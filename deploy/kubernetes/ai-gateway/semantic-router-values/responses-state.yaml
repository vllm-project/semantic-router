# The gateway in front of the Router calls it over ext_proc.
gateway:
  mode: extproc
replicaCount: 1

# ExtProc-only Responses state and protocol conversion. The external gateway
# owns the public listener, route, backend, credentials, and traffic policy.
# Replace the chart's example routing config atomically. Using `config` here
# would recursively merge in its placeholder default route and signals.
configOverride:
  version: v0.3
  listeners: []
  providers:
    models:
      # Protocol metadata only: intentionally no backend_refs or credentials.
      - name: openai/gpt-oss-20b
        api_format: openai
  routing:
    modelCards:
      - name: openai/gpt-oss-20b
  global:
    router:
      clear_route_cache: false
      model_selection:
        enabled: false
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      router_replay:
        enabled: false
        store_backend: memory
      observability:
        tracing:
          enabled: false
    stores:
      response_cache:
        enabled: false
      memory:
        enabled: false
    model_catalog:
      modules:
        prompt_compression:
          enabled: false
service:
  type: ClusterIP

persistence:
  enabled: false
