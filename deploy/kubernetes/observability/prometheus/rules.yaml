apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-alert-rules
  labels:
    app: prometheus
data:
  semantic-router-alerts.yml: |
    groups:
      - name: semantic-router-observability
        rules:
          - alert: HighRequestErrorRate
            expr: |
              (
                sum(rate(llm_request_outcomes_total{traffic_kind="inference",outcome!="success"}[5m]))
                /
                sum(rate(llm_request_outcomes_total{traffic_kind="inference"}[5m]))
              ) > 0.05
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Semantic Router request error rate is above 5%
              dashboard_panel: Inference outcomes

          - alert: HighCompletionLatencyP95
            expr: |
              histogram_quantile(0.95, sum(rate(llm_model_completion_latency_seconds_bucket[5m])) by (le)) > 30
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Semantic Router completion latency p95 is above 30s
              description: Full observed completion duration, including streaming; finite histogram buckets extend through 1800 seconds.
              dashboard_panel: Response duration by model

          - alert: HighFirstResponseObservationP95
            expr: |
              histogram_quantile(0.95, sum(rate(llm_model_first_response_observation_seconds_bucket[5m])) by (le)) > 5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Semantic Router first response observation p95 is above 5s
              dashboard_panel: First response observation by model

          - alert: HighResponseDurationPerOutputTokenP95
            expr: |
              histogram_quantile(0.95, sum(rate(llm_model_response_duration_per_output_token_seconds_bucket[5m])) by (le)) > 0.25
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Semantic Router response duration per output token p95 is above 250ms
              dashboard_panel: Response duration per output token

          - alert: HighRoutingLatencyP95
            expr: |
              histogram_quantile(0.95, sum(rate(llm_model_routing_latency_seconds_bucket[5m])) by (le)) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Semantic Router routing latency p95 is above 100ms
              description: Total routing time before dispatch; inspect the Recipe workflow section for stage timing.

          - alert: HighInflightRequests
            expr: |
              sum(llm_model_inflight_requests) by (model) > 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Semantic Router has more than 50 in-flight requests for a model
              dashboard_panel: Requests in flight by model

          - alert: LowCacheHitRate
            expr: |
              (
                (sum(rate(llm_cache_plugin_hits_total[15m])) or 0 * sum(rate(llm_cache_plugin_misses_total[15m])))
                /
                ((sum(rate(llm_cache_plugin_hits_total[15m])) or 0 * sum(rate(llm_cache_plugin_misses_total[15m]))) + (sum(rate(llm_cache_plugin_misses_total[15m])) or 0 * sum(rate(llm_cache_plugin_hits_total[15m]))))
              ) < 0.2
              and
              ((sum(rate(llm_cache_plugin_hits_total[15m])) or 0 * sum(rate(llm_cache_plugin_misses_total[15m]))) + (sum(rate(llm_cache_plugin_misses_total[15m])) or 0 * sum(rate(llm_cache_plugin_hits_total[15m])))) > 0
            for: 15m
            labels:
              severity: info
            annotations:
              summary: Semantic Router cache hit rate is below 20%
              dashboard_panel: Cache lookup outcomes
