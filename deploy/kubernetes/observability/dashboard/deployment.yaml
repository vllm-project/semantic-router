apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router-dashboard
  labels:
    app: semantic-router-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-router-dashboard
  template:
    metadata:
      labels:
        app: semantic-router-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/vllm-project/semantic-router/dashboard:latest
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is /app/entrypoint.sh (exec su-exec nonroot "$@"),
          # so args must include the binary path as the first element.
          args:
            [
              "/app/dashboard-backend",
              "-port=8700",
              "-static=/app/frontend",
              "-config=/app/config/config.yaml",
            ]
          env:
            - name: TARGET_GRAFANA_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_GRAFANA_URL
            - name: TARGET_PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_PROMETHEUS_URL
            - name: TARGET_ROUTER_API_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_ROUTER_API_URL
            - name: TARGET_ROUTER_METRICS_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_ROUTER_METRICS_URL
            - name: TARGET_OPENWEBUI_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_OPENWEBUI_URL
                  optional: true
            - name: TARGET_CHATUI_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_CHATUI_URL
                  optional: true
            - name: ROUTER_CONFIG_PATH
              value: /app/config/config.yaml
            - name: VLLM_SR_RECIPE_STORE_DIR
              value: /app/data/recipe-store
            # ML service sidecar: connect to localhost since it's in the same pod
            - name: ML_SERVICE_URL
              value: "http://127.0.0.1:8686"
            - name: ML_PIPELINE_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8700
          volumeMounts:
            - name: router-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: router-config
              mountPath: /app/config/tools_db.json
              subPath: tools_db.json
              readOnly: true
            - name: ml-data
              mountPath: /app/data/ml-pipeline

        # ML Training Service sidecar (Python)
        - name: ml-service
          image: ghcr.io/vllm-project/semantic-router/ml-training-service:latest
          imagePullPolicy: IfNotPresent
          env:
            # This unauthenticated API is only for the co-located dashboard.
            - name: ML_SERVICE_HOST
              value: "127.0.0.1"
            - name: ML_SERVICE_PORT
              value: "8686"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: ml-data
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --max-time
                - "5"
                - http://127.0.0.1:8686/api/health
            timeoutSeconds: 6
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --max-time
                - "5"
                - http://127.0.0.1:8686/api/health
            timeoutSeconds: 6
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: router-config
          configMap:
            name: semantic-router-config
        - name: ml-data
          emptyDir: {}
