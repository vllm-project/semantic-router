apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router-dashboard
  labels:
    app: semantic-router-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-router-dashboard
  template:
    metadata:
      labels:
        app: semantic-router-dashboard
    spec:
      serviceAccountName: semantic-router-dashboard
      containers:
        - name: dashboard
          image: ghcr.io/vllm-project/semantic-router/dashboard:latest
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is /app/entrypoint.sh (exec su-exec nonroot "$@"),
          # so args must include the binary path as the first element.
          args:
            [
              "/app/dashboard-backend",
              "-port=8700",
              "-static=/app/frontend",
              "-config=/app/config/config.yaml",
            ]
          env:
            - name: TARGET_GRAFANA_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_GRAFANA_URL
            - name: TARGET_PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_PROMETHEUS_URL
            - name: TARGET_ROUTER_API_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_ROUTER_API_URL
            - name: TARGET_ROUTER_METRICS_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_ROUTER_METRICS_URL
            - name: TARGET_OPENWEBUI_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_OPENWEBUI_URL
                  optional: true
            - name: TARGET_CHATUI_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_CHATUI_URL
                  optional: true
            - name: ROUTER_CONFIG_PATH
              value: /app/config/config.yaml
            - name: DASHBOARD_CONFIG_DIR
              value: /app/data
            - name: VLLM_SR_RECIPE_STORE_DIR
              value: /app/data/recipe-store
            - name: VLLM_SR_K8S_CONFIGMAP_NAME
              value: semantic-router-config
            - name: VLLM_SR_K8S_CONFIGMAP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ML_PIPELINE_ENABLED
              value: "false"
            - name: OPENCLAW_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8700
          volumeMounts:
            - name: router-config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: router-config
              mountPath: /app/config/tools_db.json
              subPath: tools_db.json
              readOnly: true

      volumes:
        - name: router-config
          configMap:
            name: semantic-router-config
