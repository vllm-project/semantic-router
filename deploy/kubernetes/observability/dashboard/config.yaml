version: v0.3
listeners: []
providers:
  defaults:
    default_model: qwen3
    reasoning_families:
      deepseek:
        type: chat_template_kwargs
        parameter: thinking
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
      gpt-oss:
        type: reasoning_effort
        parameter: reasoning_effort
      gpt:
        type: reasoning_effort
        parameter: reasoning_effort
    default_reasoning_effort: high
  models:
    - name: qwen3
      reasoning_family: qwen3
      backend_refs:
        - name: endpoint1
          endpoint: 172.28.0.20:8002
          weight: 1
routing:
  signals:
    domains:
      - name: business
        model_scores:
          - model: qwen3
            score: 0.7
            use_reasoning: false
      - name: law
        model_scores:
          - model: qwen3
            score: 0.4
            use_reasoning: false
      - name: psychology
        model_scores:
          - model: qwen3
            score: 0.6
            use_reasoning: false
      - name: biology
        model_scores:
          - model: qwen3
            score: 0.9
            use_reasoning: false
      - name: chemistry
        model_scores:
          - model: qwen3
            score: 0.6
            use_reasoning: true
      - name: history
        model_scores:
          - model: qwen3
            score: 0.7
            use_reasoning: false
      - name: other
        model_scores:
          - model: qwen3
            score: 0.7
            use_reasoning: false
      - name: health
        model_scores:
          - model: qwen3
            score: 0.5
            use_reasoning: false
      - name: economics
        model_scores:
          - model: qwen3
            score: 1.0
            use_reasoning: false
      - name: math
        model_scores:
          - model: qwen3
            score: 1.0
            use_reasoning: true
      - name: physics
        model_scores:
          - model: qwen3
            score: 0.7
            use_reasoning: true
      - name: computer science
        model_scores:
          - model: qwen3
            score: 0.6
            use_reasoning: false
      - name: philosophy
        model_scores:
          - model: qwen3
            score: 0.5
            use_reasoning: false
      - name: engineering
        model_scores:
          - model: qwen3
            score: 0.7
            use_reasoning: false
  modelCards:
    - name: qwen3
global:
  router: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        concurrency_threshold: 5
        max_concurrency: 8
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1.0
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        enabled: true
        windowed_metrics:
          enabled: true
          time_windows: [1m, 5m, 15m, 1h]
          update_interval: 30s
          model_metrics: true
          queue_depth_estimation: true
          max_models: 50
  stores:
    semantic_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
