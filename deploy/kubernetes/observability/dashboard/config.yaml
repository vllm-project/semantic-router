version: v0.4
listeners: []
models:
- name: qwen3
  card:
    reasoning:
      type: chat_template_kwargs
      efforts:
      - high
  connections:
  - provider: vllm
    endpoint: http://172.28.0.20:8002/v1
    model: qwen3
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      domains:
      - name: business
        model_scores:
        - model: qwen3
          score: 0.7
          use_reasoning: false
        description: business routing domain.
      - name: law
        model_scores:
        - model: qwen3
          score: 0.4
          use_reasoning: false
        description: law routing domain.
      - name: psychology
        model_scores:
        - model: qwen3
          score: 0.6
          use_reasoning: false
        description: psychology routing domain.
      - name: biology
        model_scores:
        - model: qwen3
          score: 0.9
          use_reasoning: false
        description: biology routing domain.
      - name: chemistry
        model_scores:
        - model: qwen3
          score: 0.6
          use_reasoning: true
        description: chemistry routing domain.
      - name: history
        model_scores:
        - model: qwen3
          score: 0.7
          use_reasoning: false
        description: history routing domain.
      - name: other
        model_scores:
        - model: qwen3
          score: 0.7
          use_reasoning: false
        description: other routing domain.
      - name: health
        model_scores:
        - model: qwen3
          score: 0.5
          use_reasoning: false
        description: health routing domain.
      - name: economics
        model_scores:
        - model: qwen3
          score: 1.0
          use_reasoning: false
        description: economics routing domain.
      - name: math
        model_scores:
        - model: qwen3
          score: 1.0
          use_reasoning: true
        description: math routing domain.
      - name: physics
        model_scores:
        - model: qwen3
          score: 0.7
          use_reasoning: true
        description: physics routing domain.
      - name: computer science
        model_scores:
        - model: qwen3
          score: 0.6
          use_reasoning: false
        description: computer science routing domain.
      - name: philosophy
        model_scores:
        - model: qwen3
          score: 0.5
          use_reasoning: false
        description: philosophy routing domain.
      - name: engineering
        model_scores:
        - model: qwen3
          score: 0.7
          use_reasoning: false
        description: engineering routing domain.
    decisions:
    - name: default-route
      description: Route benchmark requests.
      priority: 0
      rules:
        operator: AND
        conditions: []
entrypoints:
- name: vllm-sr/auto
  recipe: default
  assignments:
    default-route:
      models:
      - model: qwen3
        weight: '1'
global:
  router: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        concurrency_threshold: 5
        max_concurrency: 8
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
          duration_buckets:
          - 0.001
          - 0.005
          - 0.01
          - 0.025
          - 0.05
          - 0.1
          - 0.25
          - 0.5
          - 1
          - 2.5
          - 5
          - 10
          - 30
          size_buckets:
          - 1
          - 2
          - 5
          - 10
          - 20
          - 50
          - 100
          - 200
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1.0
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        enabled: true
        windowed_metrics:
          enabled: true
          time_windows:
          - 1m
          - 5m
          - 15m
          - 1h
          update_interval: 30s
          model_metrics: true
          queue_depth_estimation: true
          max_models: 50
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
