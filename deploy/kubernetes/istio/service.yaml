apiVersion: v1
kind: Service
metadata:
  name: semantic-router
  namespace: vllm-semantic-router-system
  labels:
    app: semantic-router
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: grpc
    protocol: TCP
    name: grpc
  # Management / classify-api (:8080) is not advertised here by default (#2463).
  # Apply service-management.yaml for in-cluster or port-forward access.
  selector:
    app: semantic-router
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-router-metrics
  namespace: vllm-semantic-router-system
  labels:
    app: semantic-router
    service: metrics
spec:
  type: ClusterIP
  ports:
  - port: 9190
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: semantic-router
