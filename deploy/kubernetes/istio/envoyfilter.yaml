apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: semantic-router
  namespace: default
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: inference-gateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.http.ext_proc
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          # Authentication, authorization, and global quotas are Router-owned.
          # ExtProc failure therefore fails closed.
          failure_mode_allow: false
          allow_mode_override: true
          message_timeout: 300s
          processing_mode:
            request_header_mode: SEND
            response_header_mode: SEND
            request_body_mode: BUFFERED
            # Response bodies carry the backend-authoritative token usage used
            # for settlement. Streaming responses override this to STREAMED.
            response_body_mode: BUFFERED
            request_trailer_mode: SKIP
            response_trailer_mode: SKIP
          grpc_service:
            envoy_grpc:
              cluster_name: outbound|50051||semantic-router.vllm-semantic-router-system.svc.cluster.local
