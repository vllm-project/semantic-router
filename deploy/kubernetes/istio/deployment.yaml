apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router
  namespace: vllm-semantic-router-system
  labels:
    app: semantic-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-router
  template:
    metadata:
      labels:
        app: semantic-router
    spec:
      serviceAccountName: semantic-router
      containers:
        - name: semantic-router
          image: ghcr.io/vllm-project/semantic-router/vllm-sr:latest
          args: ["--secure=true"]
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
            - containerPort: 9190
              name: metrics
              protocol: TCP
            - containerPort: 8080
              name: classify-api
              protocol: TCP
          env:
            # Lets the config write API patch this ConfigMap through the
            # Kubernetes API instead of the read-only mounted file (#3688).
            - name: VLLM_SR_K8S_CONFIGMAP_NAME
              value: "semantic-router-config"
            - name: VLLM_SR_K8S_CONFIGMAP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VLLM_SR_CONFIG_BACKUP_DIR
              value: /tmp/vllm-sr/config-history
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config-volume
              mountPath: /app/config/tools_db.json
              subPath: tools_db.json
              readOnly: true
            - name: models-volume
              mountPath: /app/models
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 300  # Wait 5 minutes for model loading
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5  # Allow more failures
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 300  # Wait 5 minutes for model loading
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5  # Allow more failures
          # Sized as in the Helm chart: the Router and the model runtime it starts for the decision model.
          resources:
            requests:
              memory: "3Gi"
              cpu: "1"
            limits:
              memory: "12Gi"
              cpu: "2"
      volumes:
        - name: config-volume
          configMap:
            name: semantic-router-config
        - name: models-volume
          persistentVolumeClaim:
            claimName: semantic-router-models
