apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: semantic-router-openshift

resources:
- namespace.yaml
- serviceaccount.yaml
- rbac.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- routes.yaml

# Generate ConfigMap
configMapGenerator:
- name: semantic-router-config
  files:
  - config.yaml
  - tools_db.json
  # Disabled: the running Router patches this ConfigMap directly through the
  # Kubernetes API (issue #3688). A hash-suffixed name would mint a new
  # ConfigMap on every `kubectl apply -k`, orphaning whatever the runtime
  # write API had just written to the old one, and the RBAC Role above names
  # this ConfigMap by its literal name.
  options:
    disableNameSuffixHash: true

# Namespace for all resources
namespace: vllm-semantic-router-system

images:
- name: ghcr.io/vllm-project/semantic-router/extproc
  newTag: latest

# Add OpenShift-specific labels
commonLabels:
  app.kubernetes.io/name: semantic-router
  app.kubernetes.io/instance: semantic-router-openshift
  app.kubernetes.io/part-of: vllm-semantic-router

# Add OpenShift-specific annotations
commonAnnotations:
  deployment.openshift.io/type: "vllm-semantic-router"
