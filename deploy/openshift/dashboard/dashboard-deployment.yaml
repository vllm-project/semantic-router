---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: vllm-semantic-router-system
data:
  DASHBOARD_PORT: "8700"
  TARGET_GRAFANA_URL: "http://grafana:3000"
  TARGET_PROMETHEUS_URL: "http://prometheus:9090"
  TARGET_ROUTER_API_URL: "http://semantic-router:8080"
  TARGET_ROUTER_METRICS_URL: "http://semantic-router:9190/metrics"
  ROUTER_CONFIG_PATH: "/app/config/config.yaml"
  DASHBOARD_CONFIG_DIR: "/app/data"
  # The mounted ConfigMap stays read-only; the Dashboard updates it through
  # the Kubernetes API and waits for a router rollout to activate changes.
  DASHBOARD_RUNTIME_CONFIG_WRITABLE: "true"
  DASHBOARD_RECIPE_STORE_WRITABLE: "false"
  ML_PIPELINE_ENABLED: "false"
  OPENCLAW_ENABLED: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/vllm-semantic-router-system/dashboard-custom:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8700
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-config
          env:
            - name: VLLM_SR_K8S_CONFIGMAP_NAME
              value: semantic-router-config
            - name: VLLM_SR_K8S_CONFIGMAP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/tools_db.json
              subPath: tools_db.json
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8700
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8700
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: config
          configMap:
            name: semantic-router-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-config-editor
  namespace: vllm-semantic-router-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["semantic-router-config"]
    verbs: ["get", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-config-editor
  namespace: vllm-semantic-router-system
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: vllm-semantic-router-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-config-editor

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8700
      targetPort: 8700
      protocol: TCP
  selector:
    app: dashboard

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
spec:
  to:
    kind: Service
    name: dashboard
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
