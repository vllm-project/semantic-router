---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: vllm-semantic-router-system
data:
  DASHBOARD_PORT: "8700"
  TARGET_GRAFANA_URL: "http://grafana:3000"
  TARGET_PROMETHEUS_URL: "http://prometheus:9090"
  TARGET_ROUTER_API_URL: "http://semantic-router:8080"
  TARGET_ROUTER_METRICS_URL: "http://semantic-router:9190/metrics"
  ROUTER_CONFIG_PATH: "/app/config/config.yaml"
  # Runtime config writes go through the Kubernetes API to the
  # semantic-router-config ConfigMap now (issue #3688), not the read-only
  # mounted file, so this can be enabled again.
  DASHBOARD_RUNTIME_CONFIG_WRITABLE: "true"
  # The recipe store is still a local writable-directory requirement this
  # fix does not address: no ConfigMap backs it, so it stays disabled here.
  DASHBOARD_RECIPE_STORE_WRITABLE: "false"
  # ML service sidecar: connect to localhost since it's in the same pod
  ML_SERVICE_URL: "http://localhost:8686"
  ML_PIPELINE_ENABLED: "true"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard

---
# Scoped to the one ConfigMap that backs the mounted config file, so the
# config write/deploy handlers can patch it through the Kubernetes API
# instead of the read-only mount (issue #3688).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-config-writer
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["semantic-router-config"]
    verbs: ["get", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-config-writer
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-config-writer
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: vllm-semantic-router-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/vllm-semantic-router-system/dashboard-custom:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8700
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-config
          env:
            # Lets the config write/deploy handlers patch this ConfigMap
            # through the Kubernetes API instead of the read-only mounted
            # file (issue #3688).
            - name: VLLM_SR_K8S_CONFIGMAP_NAME
              value: "semantic-router-config"
            - name: VLLM_SR_K8S_CONFIGMAP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/tools_db.json
              subPath: tools_db.json
              readOnly: true
            - name: ml-data
              mountPath: /app/data/ml-pipeline
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8700
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8700
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

        # ML Training Service sidecar (Python)
        - name: ml-service
          image: image-registry.openshift-image-registry.svc:5000/vllm-semantic-router-system/ml-training-service:latest
          imagePullPolicy: Always
          ports:
            - name: ml-http
              containerPort: 8686
              protocol: TCP
          env:
            - name: ML_SERVICE_PORT
              value: "8686"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: ml-data
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8686
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8686
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: config
          configMap:
            name: semantic-router-config
        - name: ml-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8700
      targetPort: 8700
      protocol: TCP
  selector:
    app: dashboard

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard
  namespace: vllm-semantic-router-system
  labels:
    app: dashboard
spec:
  to:
    kind: Service
    name: dashboard
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
