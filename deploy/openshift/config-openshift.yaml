version: v0.3
listeners: []
providers:
  defaults:
    reasoning_families:
      Model-A:
        type: chat_template_kwargs
        parameter: enable_thinking
      Model-B:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
  - name: Model-A
    provider_model_id: Model-A
    backend_refs:
    - provider: vllm
      endpoint: http://DYNAMIC_MODEL_A_IP:8000/v1
    control:
      timeout:
        request: 300s
        stream: 300s
    reasoning_family: Model-A
  - name: Model-B
    provider_model_id: Model-B
    backend_refs:
    - provider: vllm
      endpoint: http://DYNAMIC_MODEL_B_IP:8001/v1
    control:
      timeout:
        request: 300s
        stream: 300s
    reasoning_family: Model-B
routing:
  modelCards:
  - name: Model-A
  - name: Model-B
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: business
        description: business routing domain.
      - name: law
        description: law routing domain.
      - name: psychology
        description: psychology routing domain.
      - name: biology
        description: biology routing domain.
      - name: chemistry
        description: chemistry routing domain.
      - name: history
        description: history routing domain.
      - name: other
        description: other routing domain.
      - name: health
        description: health routing domain.
      - name: economics
        description: economics routing domain.
      - name: math
        description: math routing domain.
      - name: physics
        description: physics routing domain.
      - name: computer science
        description: computer science routing domain.
      - name: philosophy
        description: philosophy routing domain.
      - name: engineering
        description: engineering routing domain.
      - name: general
        description: general routing domain.
    decisions:
    - name: business
      description: Route business and management queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: business
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a senior business consultant and strategic advisor
            with expertise in corporate strategy, operations management, financial
            analysis, marketing, and organizational development.
          mode: replace
    - name: law
      description: Route legal queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: law
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a knowledgeable legal expert with comprehensive understanding
            of legal principles, case law, statutory interpretation, and legal procedures.
          mode: replace
    - name: psychology
      description: Route psychology queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: psychology
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a psychology expert with deep knowledge of cognitive
            processes, behavioral patterns, mental health, and therapeutic approaches.
          mode: replace
    - name: biology
      description: Route biology queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: biology
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a biology expert with comprehensive knowledge spanning
            molecular biology, genetics, cell biology, ecology, and evolution.
          mode: replace
    - name: chemistry
      description: Route chemistry queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: chemistry
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a chemistry expert specializing in chemical reactions,
            molecular structures, and laboratory techniques.
          mode: replace
    - name: history
      description: Route history queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: history
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a historian with expertise across different time
            periods and cultures.
          mode: replace
    - name: other
      description: Route general queries
      priority: 5
      rules:
        operator: OR
        conditions:
        - type: domain
          name: other
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a helpful and knowledgeable assistant.
          mode: replace
    - name: health
      description: Route health and medical queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: health
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a health and medical information expert with knowledge
            of anatomy, physiology, diseases, and treatments.
          mode: replace
    - name: economics
      description: Route economics queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: economics
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are an economics expert with deep understanding of microeconomics,
            macroeconomics, and financial markets.
          mode: replace
    - name: math
      description: Route mathematics queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: math
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a mathematics expert. Provide step-by-step solutions
            and explain mathematical concepts clearly.
          mode: replace
    - name: physics
      description: Route physics queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: physics
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a physics expert with deep understanding of physical
            laws and phenomena.
          mode: replace
    - name: computer science
      description: Route computer science queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: computer science
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a computer science expert with knowledge of algorithms,
            data structures, and software engineering.
          mode: replace
    - name: philosophy
      description: Route philosophy queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: philosophy
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a philosophy expert with comprehensive knowledge
            of philosophical traditions and ethical theories.
          mode: replace
    - name: engineering
      description: Route engineering queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: engineering
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are an engineering expert across multiple disciplines.
          mode: replace
    - name: general
      description: Route general queries
      priority: 5
      rules:
        operator: OR
        conditions:
        - type: domain
          name: general
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          system_prompt: You are a knowledgeable assistant for general questions.
          mode: replace
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    business:
      models:
      - model: Model-B
        weight: '1'
    law:
      models:
      - model: Model-B
        weight: '1'
    psychology:
      models:
      - model: Model-B
        weight: '1'
    biology:
      models:
      - model: Model-A
        weight: '1'
    chemistry:
      models:
      - model: Model-A
        weight: '1'
        reasoning:
          enabled: true
    history:
      models:
      - model: Model-A
        weight: '1'
    other:
      models:
      - model: Model-A
        weight: '1'
    health:
      models:
      - model: Model-B
        weight: '1'
    economics:
      models:
      - model: Model-A
        weight: '1'
    math:
      models:
      - model: Model-A
        weight: '1'
        reasoning:
          enabled: true
    physics:
      models:
      - model: Model-A
        weight: '1'
        reasoning:
          enabled: true
    computer science:
      models:
      - model: Model-A
        weight: '1'
    philosophy:
      models:
      - model: Model-B
        weight: '1'
    engineering:
      models:
      - model: Model-A
        weight: '1'
        reasoning:
          enabled: true
    general:
      models:
      - model: Model-A
        weight: '1'
global:
  router: {}
  services:
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: ''
        sampling:
          type: probabilistic
          rate: 0.1
      metrics:
        enabled: true
    api:
      batch_classification:
        max_batch_size: 32
        max_concurrency: 4
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
