apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: AI/Machine Learning
    certified: "false"
    containerImage: ghcr.io/vllm-project/semantic-router-operator:latest
    description: Operator for deploying and managing vLLM Semantic Router instances
    repository: https://github.com/vllm-project/semantic-router
    support: vLLM Community
  name: semantic-router-operator.v0.1.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: SemanticRouter is the Schema for the semanticrouters API
      displayName: Semantic Router
      kind: SemanticRouter
      name: semanticrouters.vllm.ai
      resources:
      - kind: Deployment
        name: ""
        version: v1
      - kind: Service
        name: ""
        version: v1
      - kind: ConfigMap
        name: ""
        version: v1
      - kind: PersistentVolumeClaim
        name: ""
        version: v1
      - kind: HorizontalPodAutoscaler
        name: ""
        version: v2
      - kind: Ingress
        name: ""
        version: v1
      - kind: Job
        name: ""
        version: v1
      - kind: NetworkPolicy
        name: ""
        version: v1
      - kind: PodDisruptionBudget
        name: ""
        version: v1
      specDescriptors:
      - description: Number of replicas for the deployment
        displayName: Replicas
        path: replicas
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      - description: Image configuration
        displayName: Image
        path: image
      - description: Resource requirements
        displayName: Resources
        path: resources
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:resourceRequirements
      - description: Persistence configuration
        displayName: Persistence
        path: persistence
      - description: Immutable v0.3 Router bootstrap reference
        displayName: Bootstrap
        path: bootstrap
      statusDescriptors:
      - description: Current number of replicas
        displayName: Replicas
        path: replicas
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      - description: Number of ready replicas
        displayName: Ready Replicas
        path: readyReplicas
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      - description: Current phase of the SemanticRouter
        displayName: Phase
        path: phase
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - description: Observed immutable bootstrap digest
        displayName: Bootstrap Revision
        path: bootstrapRevision
      - description: Management schema migration state
        displayName: Migration
        path: migration.state
      version: v1alpha1
  description: |
    ## About the Semantic Router Operator

    The Operator deploys vLLM Semantic Router from one immutable v0.3
    bootstrap ConfigMap. It never synthesizes Models, Recipes, Entrypoints,
    credentials, access policy, or quota policy.

    Without a Management store, the file is the routing authority. With a
    Management store, the Operator runs an explicit schema migration Job
    before rolling the Router Deployment, exposes configured listeners through
    separate Services, and creates capability-aware disruption, topology, and
    network isolation resources.

    Dynamic resources are created through the Router Management API;
    they do not enter the SemanticRouter custom resource or trigger Pod
    rollouts.

    ### Support

    For issues, feature requests, and contributions:
    * GitHub: https://github.com/vllm-project/semantic-router
    * Documentation: https://vllm-sr.ai
  displayName: Semantic Router Operator
  icon:
