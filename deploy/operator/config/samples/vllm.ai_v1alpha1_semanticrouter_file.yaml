apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-file-v1
immutable: true
data:
  config.yaml: |
    version: v0.3
    providers:
      models:
        - name: example-model
          provider_model_id: example-model
          api_format: openai
          backend_refs:
            - provider: openai-compatible
              endpoint: http://example-model.default.svc.cluster.local:8000
    routing:
      modelCards:
        - name: example-model
          description: General chat model
          capabilities: [chat]
          modality: ar
    recipes:
      - name: default
        routing:
          decisions:
            - name: Answer
              rules: {}
    entrypoints:
      - model_names: [example]
        recipe: default
        assignments:
          Answer:
            models:
              - model: example-model
---
apiVersion: vllm.ai/v1alpha1
kind: SemanticRouter
metadata:
  name: semantic-router-file
spec:
  bootstrap:
    configMapRef:
      name: semantic-router-file-v1
      key: config.yaml
  replicas: 1
