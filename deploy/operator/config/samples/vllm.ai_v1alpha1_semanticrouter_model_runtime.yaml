# The built-in model runtime downloads the pinned Vela 2.0 0.8B release and
# serves it on CPU; pii rules ask it instead of the default decision model.
apiVersion: vllm.ai/v1alpha1
kind: SemanticRouter
metadata:
  name: semantic-router-model-runtime
spec:
  replicas: 1
  config:
    model_deployments:
      local-vela:
        artifact: vllm-sr/Vela-2.0-0.8B
        revision: a778eb2ae2304cfa72fca7e53a19136dea5be012
        provider: model_runtime
        device: cpu
    model_admission:
      local-vela:
        max_concurrency: 2
        max_queue: 8
        queue_timeout_ms: 1000
        on_overflow: shed
    recipes:
      - name: default
        model_bindings:
          pii: local-vela
