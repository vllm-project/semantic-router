# Create the referenced Secret, external PostgreSQL/Valkey services, and the
# stable public-inference Gateway Service before applying this sample. Secret
# values are never stored in this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-durable-v1
immutable: true
data:
  config.yaml: |
    version: v0.3
    global:
      stores:
        management:
          postgres:
            dsn_env: VLLM_SR_ACCESS_DATABASE_URL
        runtime:
          redis:
            url_env: VLLM_SR_ACCESS_REDIS_URL
      services:
        agent:
          public_inference_endpoint: http://semantic-router-public.default.svc.cluster.local/v1/chat/completions
        access:
          enabled: true
          credentials:
            api_key_hmac_keyring_env: VLLM_SR_API_KEY_HMAC_KEYRING
            delegation_hmac_keyring_env: VLLM_SR_DELEGATION_HMAC_KEYRING
          tenant_context:
            signing_key_env: VLLM_SR_TENANT_CONTEXT_KEYRING
        backend_credentials:
          provider_kek_keyring_env: VLLM_SR_PROVIDER_KEK_KEYRING
        backend_egress:
          policy_file: /app/config/backend-egress-policy.yaml
        routing_security:
          hmac_keyring_env: VLLM_SR_ROUTING_HMAC_KEYRING
        management_api:
          enabled: true
          bind_address: 0.0.0.0
          port: 8080
          remote_exposure: false
          tls:
            certificate_env: VLLM_SR_MANAGEMENT_TLS_CERTIFICATE
            private_key_env: VLLM_SR_MANAGEMENT_TLS_PRIVATE_KEY
          auth:
            mode: router
            token_signing_keyring_env: VLLM_SR_MANAGEMENT_TOKEN_KEYRING
            service_account_hmac_keyring_env: VLLM_SR_SERVICE_ACCOUNT_HMAC_KEYRING
            invitation_hmac_keyring_env: VLLM_SR_INVITATION_HMAC_KEYRING
            response_kek_keyring_env: VLLM_SR_RESPONSE_KEK_KEYRING
            bootstrap:
              token_env: VLLM_SR_MANAGEMENT_BOOTSTRAP_TOKEN
              disable_after_first_cluster_admin: true
---
apiVersion: vllm.ai/v1alpha1
kind: SemanticRouter
metadata:
  name: semantic-router-durable
spec:
  bootstrap:
    configMapRef:
      name: semantic-router-durable-v1
      key: config.yaml
  replicas: 3
  service:
    management:
      port: 8443
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  topologySpread:
    enabled: true
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  networkPolicy:
    enabled: true
    inferencePeers:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: gateway
    managementPeers:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: console
    metricsPeers:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: monitoring
  env:
    - name: VLLM_SR_ACCESS_DATABASE_URL
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: postgres-dsn}}
    - name: VLLM_SR_ACCESS_REDIS_URL
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: valkey-url}}
    - name: VLLM_SR_API_KEY_HMAC_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: api-key-hmac-keyring}}
    - name: VLLM_SR_DELEGATION_HMAC_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: delegation-hmac-keyring}}
    - name: VLLM_SR_TENANT_CONTEXT_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: tenant-context-keyring}}
    - name: VLLM_SR_PROVIDER_KEK_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: provider-kek-keyring}}
    - name: VLLM_SR_MANAGEMENT_TLS_CERTIFICATE
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: management-tls-certificate}}
    - name: VLLM_SR_MANAGEMENT_TLS_PRIVATE_KEY
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: management-tls-private-key}}
    - name: VLLM_SR_MANAGEMENT_TOKEN_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: management-token-keyring}}
    - name: VLLM_SR_SERVICE_ACCOUNT_HMAC_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: service-account-hmac-keyring}}
    - name: VLLM_SR_INVITATION_HMAC_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: invitation-hmac-keyring}}
    - name: VLLM_SR_ROUTING_HMAC_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: routing-hmac-keyring}}
    - name: VLLM_SR_RESPONSE_KEK_KEYRING
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: response-kek-keyring}}
    - name: VLLM_SR_MANAGEMENT_BOOTSTRAP_TOKEN
      valueFrom: {secretKeyRef: {name: semantic-router-durable-secrets, key: management-bootstrap-token}}
