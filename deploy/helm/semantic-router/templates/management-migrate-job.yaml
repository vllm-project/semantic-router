{{- $config := include "semantic-router.effectiveConfig" . | fromYaml -}}
{{- $global := (get $config "global") | default (dict) -}}
{{- $durableRouting := eq (include "semantic-router.hasManagementStore" .) "true" -}}
{{- if $durableRouting -}}
{{- $stores := (get $global "stores") | default (dict) -}}
{{- $managementStore := (get $stores "management") | default (dict) -}}
{{- $postgres := (get $managementStore "postgres") | default (dict) -}}
{{- $dsnEnv := (get $postgres "dsn_env") | default "" -}}
{{- $dsnFile := (get $postgres "dsn_file") | default "" -}}
{{- if eq (empty $dsnEnv) (empty $dsnFile) -}}
{{- fail "global.stores.management.postgres requires exactly one of dsn_env or dsn_file" -}}
{{- end -}}
{{- $migrationEnv := list -}}
{{- $migrationProjection := dict "volumeMounts" (list) "volumes" (list) -}}
{{- if $dsnEnv -}}
{{- $migrationEnv = include "semantic-router.managementMigrationEnv" (list . $dsnEnv) | fromYamlArray -}}
{{- else -}}
{{- $migrationProjection = include "semantic-router.managementMigrationFileProjection" (list . $dsnFile) | fromYaml -}}
{{- end -}}
{{- $registry := trimSuffix "/" (default "" .Values.global.imageRegistry) -}}
{{- $prefix := ternary "" (printf "%s/" $registry) (eq $registry "") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "semantic-router.fullname" . }}-management-migrate
  namespace: {{ include "semantic-router.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: management-migration
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "semantic-router.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: management-migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: management-migrate
        image: "{{ $prefix }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        command: ["/usr/local/bin/management-migrate"]
        args:
        {{- if $dsnEnv }}
        - "--dsn-env"
        - {{ $dsnEnv | quote }}
        {{- else }}
        - "--dsn-file"
        - {{ $dsnFile | quote }}
        {{- end }}
        - "--timeout"
        - "5m"
        {{- if $migrationEnv }}
        env:
          {{- toYaml $migrationEnv | nindent 10 }}
        {{- end }}
        {{- with (get $migrationProjection "volumeMounts") }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with (get $migrationProjection "volumes") }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
