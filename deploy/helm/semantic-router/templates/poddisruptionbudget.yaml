{{- $enabled := eq (include "semantic-router.hasManagementStore" .) "true" -}}
{{- if ne .Values.podDisruptionBudget.enabled nil -}}
{{- $enabled = .Values.podDisruptionBudget.enabled -}}
{{- end -}}
{{- if $enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "semantic-router.fullname" . }}
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "semantic-router.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: router
{{- end }}
