{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "semantic-router.fullname" . }}
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                # Always route to the dedicated management ClusterIP Service
                # (deploy/helm/semantic-router/templates/service.yaml), which
                # exposes classify-api regardless of managementApi.expose.
                # The primary Service only carries that port when
                # managementApi.expose=true (#2463 Phase 4), so pointing
                # ingress at it would 503 by default after upgrade.
                name: {{ include "semantic-router.fullname" $ }}-management
                port:
                  number: {{ .servicePort }}
          {{- end }}
    {{- end }}
{{- end }}
