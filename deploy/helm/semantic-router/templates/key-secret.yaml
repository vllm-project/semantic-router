# Keys a Dashboard or management API save moves out of the ConfigMap: each
# entry is one key, which config.yaml names by its entry (auth.api_key_env for
# a backend, a "${NAME}" listener key) and the Router loads into its
# environment when it starts. Saves add the entries; the chart renders none,
# so an upgrade keeps them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semantic-router.keySecretName" . }}
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
type: Opaque
