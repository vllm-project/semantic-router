{{- $routerMultiReplica := false -}}
{{- if .Values.autoscaling.enabled -}}
{{- $routerMultiReplica = gt (int .Values.autoscaling.maxReplicas) 1 -}}
{{- else -}}
{{- $routerMultiReplica = gt (int .Values.replicaCount) 1 -}}
{{- end -}}
{{- $config := include "semantic-router.effectiveConfig" . | fromYaml -}}
{{- $global := (get $config "global") | default (dict) -}}
{{- $controlPlane := (get $global "control_plane") | default (dict) -}}
{{- $controlPlaneMode := (get $controlPlane "mode") | default "standalone" -}}
{{- $managedMode := eq $controlPlaneMode "managed" -}}
{{- $managementProbeScheme := ternary "HTTPS" "HTTP" $managedMode -}}
{{- $services := (get $global "services") | default (dict) -}}
{{- $managementAPI := (get $services "management_api") | default (dict) -}}
{{- $managementPort := (get $managementAPI "port") | default .Values.service.api.targetPort -}}
{{- $backendDispatch := (get $services "backend_dispatch") | default (dict) -}}
{{- $backendDispatchPort := (get $backendDispatch "port") | default 8180 -}}
{{- $router := (get $global "router") | default (dict) -}}
{{- $learning := (get $router "learning") | default (dict) -}}
{{- $learningEnabled := false -}}
{{- if hasKey $learning "enabled" -}}
{{- $learningEnabled = get $learning "enabled" -}}
{{- end -}}
{{- $adaptation := (get $learning "adaptation") | default (dict) -}}
{{- $protection := (get $learning "protection") | default (dict) -}}
{{- $adaptationEnabled := true -}}
{{- if hasKey $adaptation "enabled" -}}
{{- $adaptationEnabled = get $adaptation "enabled" -}}
{{- end -}}
{{- $protectionEnabled := true -}}
{{- if hasKey $protection "enabled" -}}
{{- $protectionEnabled = get $protection "enabled" -}}
{{- end -}}
{{- $localLearningStateEnabled := and $learningEnabled (or $adaptationEnabled $protectionEnabled) -}}
{{- $safetyGuards := (get .Values "safetyGuards") | default (dict) -}}
{{- $rejectMultiReplicaLocalLearningState := true -}}
{{- if hasKey $safetyGuards "rejectMultiReplicaLocalLearningState" -}}
{{- $rejectMultiReplicaLocalLearningState = get $safetyGuards "rejectMultiReplicaLocalLearningState" -}}
{{- end -}}
{{- if and $rejectMultiReplicaLocalLearningState $routerMultiReplica $localLearningStateEnabled -}}
{{- fail "multi-replica router deployments cannot use Router Learning local state; disable global.router.learning, use one router replica, or set safetyGuards.rejectMultiReplicaLocalLearningState=false after accepting replica-local learning divergence" -}}
{{- end }}
{{- range $variable := concat .Values.env .Values.extraEnv -}}
{{- if or (eq $variable.name "CONFIG_FILE") (eq $variable.name "VLLM_SR_MANAGEMENT_INTERNAL_LISTENER") -}}
{{- fail (printf "env variable %s is chart-owned and cannot be overridden" $variable.name) -}}
{{- end -}}
{{- end }}
{{- range $argument := .Values.args -}}
{{- if or (eq $argument "--config") (hasPrefix "--config=" $argument) -}}
{{- fail "args must not override the chart-mounted Router config" -}}
{{- end -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-router.fullname" . }}
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "semantic-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "semantic-router.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: router
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $registry := trimSuffix "/" (default "" .Values.global.imageRegistry) }}
      {{- $prefix := ternary "" (printf "%s/" $registry) (eq $registry "") }}
      serviceAccountName: {{ include "semantic-router.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpread.maxSkew }}
        topologyKey: {{ .Values.topologySpread.topologyKey | quote }}
        whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "semantic-router.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: router
      {{- end }}
      # Models are now automatically downloaded by the router at startup
      # No initContainer is needed - the router uses its built-in Go-based
      # modeldownload package to download models from HuggingFace based on
      # the mom_registry configuration in config.yaml
      # Note: HF_TOKEN secret (hf-token-secret) is still required for downloading
      # gated models (e.g., embeddinggemma-300m). The E2E framework creates this
      # secret automatically if HF_TOKEN is available in the test environment.
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ $prefix }}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - containerPort: {{ .Values.service.grpc.targetPort }}
          name: grpc
          protocol: TCP
        - containerPort: {{ .Values.service.metrics.targetPort }}
          name: metrics
          protocol: TCP
        - containerPort: {{ ternary $managementPort .Values.service.api.targetPort $managedMode }}
          name: classify-api
          protocol: TCP
        {{- if $managedMode }}
        - containerPort: {{ $backendDispatchPort }}
          name: backend-dsp
          protocol: TCP
        {{- end }}
        env:
          - name: CONFIG_FILE
            value: /app/config/config.yaml
          - name: VLLM_SR_MANAGEMENT_INTERNAL_LISTENER
            value: "true"
        {{- with .Values.env }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.envFromSecrets }}
        envFrom:
          {{- range . }}
          - secretRef:
              name: {{ . }}
          {{- end }}
        {{- end }}
        volumeMounts:
        - name: config-volume
          mountPath: /app/config/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: config-volume
          mountPath: /app/config/tools_db.json
          subPath: tools_db.json
          readOnly: true
        {{- if and .Values.knowledgeBases.enabled .Values.knowledgeBases.existingConfigMap }}
        - name: knowledge-bases-volume
          mountPath: {{ .Values.knowledgeBases.mountPath | quote }}
          readOnly: true
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: models-volume
          mountPath: /app/models
        {{- end }}
        {{- if .Values.startupProbe.enabled }}
        # Readiness includes model loading and, in managed mode, publication and
        # durable-store recovery. TLS certificate verification is intentionally
        # delegated to the Router; kubelet HTTPS probes do not validate the
        # serving certificate.
        startupProbe:
          httpGet:
            path: /ready
            port: classify-api
            scheme: {{ $managementProbeScheme }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: /health
            port: classify-api
            scheme: {{ $managementProbeScheme }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: /ready
            port: classify-api
            scheme: {{ $managementProbeScheme }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "semantic-router.configMapName" . }}
          items:
            - key: config.yaml
              path: config.yaml
            - key: tools_db.json
              path: tools_db.json
      {{- if and .Values.knowledgeBases.enabled .Values.knowledgeBases.existingConfigMap }}
      - name: knowledge-bases-volume
        configMap:
          name: {{ .Values.knowledgeBases.existingConfigMap | quote }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      - name: models-volume
        persistentVolumeClaim:
          claimName: {{ include "semantic-router.pvcName" . }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
