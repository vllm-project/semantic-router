{{- $config := include "semantic-router.effectiveConfig" . | fromYaml -}}
{{- $global := (get $config "global") | default (dict) -}}
{{- $durableRouting := eq (include "semantic-router.hasManagementStore" .) "true" -}}
{{- $managementAPIEnabled := eq (include "semantic-router.managementAPIEnabled" .) "true" -}}
{{- $services := (get $global "services") | default (dict) -}}
{{- $managementAPI := (get $services "management_api") | default (dict) -}}
{{- $managementPort := (get $managementAPI "port") | default .Values.service.management.port -}}
{{- $backendDispatch := (get $services "backend_dispatch") | default (dict) -}}
{{- $backendDispatchPort := (get $backendDispatch "port") | default 8180 -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.grpc.port }}
    targetPort: {{ .Values.service.grpc.targetPort }}
    protocol: {{ .Values.service.grpc.protocol }}
    name: grpc
  {{- if not $durableRouting }}
  - port: {{ .Values.service.api.port }}
    targetPort: {{ .Values.service.api.targetPort }}
    protocol: {{ .Values.service.api.protocol }}
    name: classify-api
  {{- end }}
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
---
{{- if $managementAPIEnabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-management
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  # Bootstrap and recovery use the private Management listener before the
  # inference readiness gate can succeed. This Service is authenticated and
  # never carries public inference traffic.
  publishNotReadyAddresses: true
  ports:
  - port: {{ .Values.service.management.port }}
    targetPort: {{ $managementPort }}
    protocol: TCP
    name: https-management
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
---
{{- end }}
{{- if $durableRouting }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-backend-dispatch
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    service: backend-dispatch
spec:
  type: ClusterIP
  ports:
  - port: {{ $backendDispatchPort }}
    targetPort: {{ $backendDispatchPort }}
    protocol: TCP
    name: backend-dsp
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
---
{{- end }}
# Headless per-pod DNS for gRPC ext_proc client-side load balancing (issue #2417).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-headless
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    service: headless
spec:
  # ClusterIP is required for headless; do not inherit .Values.service.type.
  type: ClusterIP
  clusterIP: None
  ports:
  - port: {{ .Values.service.grpc.port }}
    targetPort: {{ .Values.service.grpc.targetPort }}
    protocol: {{ .Values.service.grpc.protocol }}
    name: grpc
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
---
{{- if .Values.service.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-metrics
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    service: metrics
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.metrics.port }}
    targetPort: {{ .Values.service.metrics.targetPort }}
    protocol: {{ .Values.service.metrics.protocol }}
    name: metrics
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
{{- end }}
