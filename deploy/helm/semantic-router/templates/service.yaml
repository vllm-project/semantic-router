{{- $standalone := eq (include "semantic-router.gatewayMode" .) "standalone" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  {{- if $standalone }}
  {{- range (include "semantic-router.listeners" . | fromYaml).items }}
  - port: {{ .port }}
    targetPort: {{ .portName }}
    protocol: TCP
    name: {{ .portName }}
  {{- end }}
  {{- else }}
  - port: {{ .Values.service.grpc.port }}
    targetPort: {{ .Values.service.grpc.targetPort }}
    protocol: {{ .Values.service.grpc.protocol }}
    name: grpc
  {{- end }}
  - port: {{ .Values.service.api.port }}
    targetPort: {{ .Values.service.api.targetPort }}
    protocol: {{ .Values.service.api.protocol }}
    name: classify-api
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
---
{{- if not $standalone }}
# Headless per-pod DNS for gRPC ext_proc client-side load balancing (issue #2417).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-headless
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    service: headless
spec:
  # ClusterIP is required for headless; do not inherit .Values.service.type.
  type: ClusterIP
  clusterIP: None
  ports:
  - port: {{ .Values.service.grpc.port }}
    targetPort: {{ .Values.service.grpc.targetPort }}
    protocol: {{ .Values.service.grpc.protocol }}
    name: grpc
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
---
{{- end }}
{{- if .Values.service.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semantic-router.fullname" . }}-metrics
  namespace: {{ include "semantic-router.namespace" . }}
  labels:
    {{- include "semantic-router.labels" . | nindent 4 }}
    service: metrics
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.metrics.port }}
    targetPort: {{ .Values.service.metrics.targetPort }}
    protocol: {{ .Values.service.metrics.protocol }}
    name: metrics
  selector:
    {{- include "semantic-router.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
{{- end }}
