global:
  namespace: ''
  imageRegistry: ''
replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  pullPolicy: IfNotPresent
  tag: ''
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  grpc:
    port: 50051
    targetPort: 50051
    protocol: TCP
  api:
    port: 8080
    targetPort: 8080
    protocol: TCP
  management:
    port: 8080
  metrics:
    enabled: true
    port: 9190
    targetPort: 9190
    protocol: TCP
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
  - host: semantic-router.local
    paths:
    - path: /
      pathType: Prefix
      servicePort: 8080
  tls: []
resources:
  limits:
    memory: 7Gi
    cpu: '2'
  requests:
    memory: 3Gi
    cpu: '1'
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
networkPolicy:
  enabled: false
  ingress:
    extProcPeers: []
    managementPeers: []
    backendDispatchPeers: []
    metricsPeers: []
safetyGuards:
  rejectMultiReplicaLocalLearningState: true
observability:
  alerts:
    enabled: false
    labels: {}
    thresholds:
      requestErrorRate: 0.05
      completionLatencyP95Seconds: 30
      ttftP95Seconds: 5
      tpotP95Seconds: 0.25
      routingLatencyP95Seconds: 0.1
      inflightRequests: 50
      cacheHitRate: 0.2
nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
extraVolumeMounts: []
envFromSecrets: []
knowledgeBases:
  enabled: false
  existingConfigMap: ''
  mountPath: /app/config/knowledge_bases
startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 360
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
persistence:
  enabled: true
  storageClassName: standard
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}
  existingClaim: ''
config:
  version: v0.4
  listeners:
  - name: grpc-50051
    address: 0.0.0.0
    port: 50051
    timeout: 300s
  - name: http-8080
    address: 0.0.0.0
    port: 8080
    timeout: 300s
  models:
  - name: replace-with-your-model
    connections:
    - provider: vllm
      endpoint: http://replace-with-your-vllm-service:8000/v1
      model: replace-with-your-model
  recipes:
  - name: default
    description: Default routing recipe.
    document:
      signals:
        domains:
        - name: general
          description: Catch-all domain
          mmlu_categories:
          - other
      decisions:
      - name: default-route
        description: Default route for every request while you wire real backends.
        priority: 100
        rules: {}
  entrypoints:
  - name: vllm-sr/auto
    aliases: [auto]
    rules:
    - name: default
      matches: []
      recipe: default
      assignments:
        default-route:
          models:
          - model: replace-with-your-model
  global:
    control_plane:
      mode: standalone
    services:
      response_api:
        enabled: false
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
            size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
      observability:
        tracing:
          enabled: false
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: probabilistic
            rate: 0.1
          resource:
            service_name: vllm-semantic-router
            service_version: ''
            deployment_environment: development
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.8
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: true
        top_k: 3
        similarity_threshold: 0.2
        tools_db_path: config/tools_db.json
        fallback_to_empty: true
toolsDb:
- tool:
    type: function
    function:
      name: get_weather
      description: Get current weather information for a location
      parameters:
        type: object
        properties:
          location:
            type: string
            description: The city and state, e.g. San Francisco, CA
          unit:
            type: string
            enum:
            - celsius
            - fahrenheit
            description: Temperature unit
        required:
        - location
  description: Get current weather information, temperature, conditions, forecast
    for any location, city, or place. Check weather today, now, current conditions,
    temperature, rain, sun, cloudy, hot, cold, storm, snow
  category: weather
  tags:
  - weather
  - temperature
  - forecast
  - climate
- tool:
    type: function
    function:
      name: search_web
      description: Search the web for information
      parameters:
        type: object
        properties:
          query:
            type: string
            description: The search query
          num_results:
            type: integer
            description: Number of results to return
            default: 5
        required:
        - query
  description: Search the internet, web search, find information online, browse web
    content, lookup, research, google, find answers, discover, investigate
  category: search
  tags:
  - search
  - web
  - internet
  - information
  - browse
- tool:
    type: function
    function:
      name: calculate
      description: Perform mathematical calculations
      parameters:
        type: object
        properties:
          expression:
            type: string
            description: Mathematical expression to evaluate
        required:
        - expression
  description: Calculate mathematical expressions, solve math problems, arithmetic
    operations, compute numbers, addition, subtraction, multiplication, division,
    equations, formula
  category: math
  tags:
  - math
  - calculation
  - arithmetic
  - compute
  - numbers
- tool:
    type: function
    function:
      name: send_email
      description: Send an email message
      parameters:
        type: object
        properties:
          to:
            type: string
            description: Recipient email address
          subject:
            type: string
            description: Email subject
          body:
            type: string
            description: Email body content
        required:
        - to
        - subject
        - body
  description: Send email messages, email communication, contact people via email,
    mail, message, correspondence, notify, inform
  category: communication
  tags:
  - email
  - send
  - communication
  - message
  - contact
- tool:
    type: function
    function:
      name: create_calendar_event
      description: Create a new calendar event or appointment
      parameters:
        type: object
        properties:
          title:
            type: string
            description: Event title
          date:
            type: string
            description: Event date in YYYY-MM-DD format
          time:
            type: string
            description: Event time in HH:MM format
          duration:
            type: integer
            description: Duration in minutes
        required:
        - title
        - date
        - time
  description: Schedule meetings, create calendar events, set appointments, manage
    calendar, book time, plan meeting, organize schedule, reminder, agenda
  category: productivity
  tags:
  - calendar
  - event
  - meeting
  - appointment
  - schedule
args:
- --secure=false
env:
- name: LD_LIBRARY_PATH
  value: /app/lib
- name: HF_TOKEN
  valueFrom:
    secretKeyRef:
      name: hf-token-secret
      key: token
      optional: true
- name: HUGGINGFACE_HUB_TOKEN
  valueFrom:
    secretKeyRef:
      name: hf-token-secret
      key: token
      optional: true
extraEnv: []
dashboard:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/vllm-project/semantic-router/dashboard
    tag: latest
    pullPolicy: IfNotPresent
  readonly: false
  allowOpenBootstrap: false
  jwtSecret:
    existingSecret: ''
    existingSecretKey: jwt-secret
  routerTLS:
    ca:
      existingSecret: ''
      existingSecretKey: ca.crt
  extraEnv: []
  envFrom: []
  podSecurityContext:
    fsGroup: 65532
  service:
    type: ClusterIP
    port: 8700
    targetPort: 8700
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 100m
  persistence:
    enabled: false
    existingClaim: ''
    storageClassName: ''
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /app/data
    annotations: {}
  httpRoute:
    enabled: false
    annotations: {}
    hostname: semantic-router-dashboard.local
    parentRef:
      name: ''
      namespace: ''
      sectionName: ''
dependencies:
  semanticCache:
    redis:
      enabled: false
      host: ''
      port: 6379
      database: 0
      password: ''
      timeout: 30
      tls:
        enabled: false
      index:
        name: semantic_cache_idx
        prefix: 'doc:'
        vectorFieldName: embedding
        metricType: COSINE
        indexType: HNSW
        params:
          m: 16
          efConstruction: 64
      search:
        topk: 1
      development:
        dropIndexOnStartup: false
        autoCreateIndex: true
        verboseErrors: true
    milvus:
      enabled: false
      host: ''
      port: 19530
      database: semantic_router_cache
      timeout: 30
      auth:
        enabled: false
        username: ''
        password: ''
      tls:
        enabled: false
      collection:
        name: semantic_cache
        description: Semantic cache for LLM request-response pairs
        vectorFieldName: embedding
        metricType: IP
        index:
          type: HNSW
          params:
            m: 16
            efConstruction: 64
      search:
        params:
          ef: 64
        topk: 10
      development:
        dropCollectionOnStartup: false
        autoCreateCollection: true
        verboseErrors: true
  responseApi:
    redis:
      enabled: false
      host: ''
      port: 6379
      database: 0
      password: ''
      timeout: 30
      tls:
        enabled: false
    milvus:
      enabled: false
      host: ''
      port: 19530
      database: semantic_router_cache
      responseCollection: semantic_router_responses
      conversationCollection: semantic_router_conversations
  observability:
    jaeger:
      enabled: false
      otlpGrpcPort: 4317
      serviceName: ''
    prometheus:
      enabled: false
    grafana:
      enabled: false
      adminUser: admin
      adminPassword: admin
semantic-cache-redis:
  architecture: standalone
  auth:
    enabled: false
response-api-redis:
  architecture: standalone
  auth:
    enabled: false
semantic-cache-milvus:
  cluster:
    enabled: false
jaeger:
  allInOne:
    image:
      tag: latest
prometheus:
  server:
    image:
      tag: v2.53.0
grafana:
  image:
    tag: 11.5.1
  sidecar:
    datasources:
      enabled: true
