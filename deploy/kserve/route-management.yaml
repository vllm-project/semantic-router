# Opt-in OpenShift Route for the management / classify-api listener (#2463 Phase 4).
# Requires service-management.yaml. Not applied by default with the gateway Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: semantic-router-kserve-api
  labels:
    app: semantic-router
    component: gateway
    service: management
spec:
  to:
    kind: Service
    name: semantic-router-kserve-management
    weight: 100
  port:
    targetPort: classify-api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
