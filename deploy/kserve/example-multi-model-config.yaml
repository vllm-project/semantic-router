apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-kserve-config
  labels:
    app: semantic-router
    component: config
data:
  config.yaml: |
    version: v0.5
    providers:
      defaults:
        model: granite32-8b
        reasoning_effort: medium
      models:
        - name: granite32-8b
          reasoning:
            family: qwen3
          provider_model_id: granite32-8b
          backend_refs:
            - name: granite32-8b-endpoint
              provider: vllm
              endpoint: granite32-8b-predictor.<namespace>.svc.cluster.local:80
              weight: 1
          param_size: 8B
          capabilities:
            - chat
            - reasoning
        - name: granite32-78b
          reasoning:
            family: qwen3
          provider_model_id: granite32-78b
          backend_refs:
            - name: granite32-78b-endpoint
              provider: vllm
              endpoint: granite32-78b-predictor.<namespace>.svc.cluster.local:80
              weight: 1
          param_size: 78B
          capabilities:
            - chat
            - reasoning
            - long-context
    recipes:
      - name: default
        signals:
          domains:
            - name: business
              description: Business and management related queries
              labels:
                - business
            - name: math
              description: Mathematics and quantitative reasoning
              labels:
                - math
            - name: other
              description: General knowledge and miscellaneous topics
              labels:
                - other
          complexity:
            - name: needs_reasoning
              description: Escalate difficult or multi-step prompts.
        decisions:
          - name: business_default
            description: Business traffic stays on the fast Granite tier.
            priority: 100
            rules:
              operator: AND
              conditions:
                - type: domain
                  name: business
            modelRefs:
              - model: granite32-8b
                use_reasoning: false
          - name: math_escalation
            description: Math and other hard requests escalate to the larger model.
            priority: 110
            rules:
              operator: OR
              conditions:
                - type: domain
                  name: math
                - type: complexity
                  name: needs_reasoning
                  label: hard
            modelRefs:
              - model: granite32-78b
                use_reasoning: true
          - name: general_fallback
            description: Fallback route for general prompts.
            priority: 10
            rules:
              operator: AND
              conditions:
                - type: domain
                  name: other
            modelRefs:
              - model: granite32-8b
                use_reasoning: false
    global:
      router:
        strategy: priority
      stores:
        response_cache:
          backend_type: memory
          max_entries: 5000
          ttl_seconds: 7200
