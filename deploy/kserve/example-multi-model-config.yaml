apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-kserve-config
  labels:
    app: semantic-router
    component: config
data:
  config.yaml: |
    version: v0.3
    listeners: []
    providers:
      defaults:
        reasoning_families:
          granite32-8b:
            type: chat_template_kwargs
            parameter: enable_thinking
          granite32-78b:
            type: chat_template_kwargs
            parameter: enable_thinking
      models:
      - name: granite32-8b
        provider_model_id: granite32-8b
        backend_refs:
        - provider: vllm
          endpoint: http://granite32-8b-predictor.<namespace>.svc.cluster.local:80/v1
        reasoning_family: granite32-8b
      - name: granite32-78b
        provider_model_id: granite32-78b
        backend_refs:
        - provider: vllm
          endpoint: http://granite32-78b-predictor.<namespace>.svc.cluster.local:80/v1
        reasoning_family: granite32-78b
    routing:
      modelCards:
      - name: granite32-8b
        param_size: 8B
        capabilities:
        - chat
        - reasoning
      - name: granite32-78b
        param_size: 78B
        capabilities:
        - chat
        - reasoning
        - long-context
    recipes:
    - name: default
      description: Default routing recipe.
      routing:
        signals:
          domains:
          - name: business
            description: Business and management related queries
            mmlu_categories:
            - business
          - name: math
            description: Mathematics and quantitative reasoning
            mmlu_categories:
            - math
          - name: other
            description: General knowledge and miscellaneous topics
            mmlu_categories:
            - other
          complexity:
          - name: needs_reasoning
            threshold: 0.7
            description: Escalate difficult or multi-step prompts.
            hard:
              candidates:
              - solve this step by step
              - analyze the tradeoffs
            easy:
              candidates:
              - quick summary
              - answer briefly
        decisions:
        - name: business_default
          description: Business traffic stays on the fast Granite tier.
          priority: 100
          rules:
            operator: AND
            conditions:
            - type: domain
              name: business
        - name: math_escalation
          description: Math and other hard requests escalate to the larger model.
          priority: 110
          rules:
            operator: OR
            conditions:
            - type: domain
              name: math
            - type: complexity
              name: needs_reasoning:hard
        - name: general_fallback
          description: Fallback route for general prompts.
          priority: 10
          rules:
            operator: AND
            conditions:
            - type: domain
              name: other
    entrypoints:
    - model_names:
      - vllm-sr/auto
      - auto
      recipe: default
      assignments:
        business_default:
          models:
          - model: granite32-8b
        math_escalation:
          models:
          - model: granite32-78b
            reasoning:
              enabled: true
        general_fallback:
          models:
          - model: granite32-8b
    global:
      router: {}
      stores:
        response_cache:
          enabled: true
          backend_type: memory
          similarity_threshold: 0.85
          max_entries: 5000
          ttl_seconds: 7200
      integrations:
        tools:
          enabled: true
          top_k: 5
          similarity_threshold: 0.2
          tools_db_path: config/tools_db.json
          fallback_to_empty: true
      model_catalog:
        embeddings: {}
        modules:
          classifier: {}
          hallucination_mitigation: {}
      services:
        backend_dispatch:
          bind_address: 0.0.0.0
          port: 8180
          audience: vllm-sr.backend-dispatch
          capability_ttl: 30s
          max_request_body_bytes: 67108864
        backend_egress:
          policy_file: /app/config/backend-egress-policy.yaml
