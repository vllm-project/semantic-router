apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-kserve-config
  labels:
    app: semantic-router
    component: config
data:
  config.yaml: |
    version: v0.3
    listeners: []
    providers:
      defaults:
        reasoning_families:
          '{{MODEL_NAME}}':
            type: chat_template_kwargs
            parameter: enable_thinking
      models:
      - name: '{{MODEL_NAME}}'
        provider_model_id: '{{MODEL_NAME}}'
        backend_refs:
        - provider: vllm
          endpoint: http://{{PREDICTOR_SERVICE_IP}}:8000/v1
        reasoning_family: '{{MODEL_NAME}}'
    routing:
      modelCards:
      - name: '{{MODEL_NAME}}'
    recipes:
    - name: default
      description: Default routing recipe.
      routing:
        signals:
          domains:
          - name: business
            description: Business and management related queries
            mmlu_categories:
            - business
          - name: law
            description: Legal questions and law-related topics
            mmlu_categories:
            - law
          - name: psychology
            description: Psychology and mental health topics
            mmlu_categories:
            - psychology
          - name: biology
            description: Biology and life sciences questions
            mmlu_categories:
            - biology
          - name: chemistry
            description: Chemistry and chemical sciences questions
            mmlu_categories:
            - chemistry
          - name: history
            description: Historical questions and cultural topics
            mmlu_categories:
            - history
          - name: other
            description: General knowledge and miscellaneous topics
            mmlu_categories:
            - other
          - name: health
            description: Health and medical information queries
            mmlu_categories:
            - health
          - name: economics
            description: Economics and financial topics
            mmlu_categories:
            - economics
          - name: math
            description: Mathematics and quantitative reasoning
            mmlu_categories:
            - math
          - name: physics
            description: Physics and physical sciences
            mmlu_categories:
            - physics
          - name: computer science
            description: Computer science and programming
            mmlu_categories:
            - computer science
          - name: philosophy
            description: Philosophy and ethical questions
            mmlu_categories:
            - philosophy
          - name: engineering
            description: Engineering and technical problem-solving
            mmlu_categories:
            - engineering
        decisions:
        - name: business_decision
          description: Business and management related queries
          priority: 100
          rules:
            operator: AND
            conditions:
            - type: domain
              name: business
          plugins:
          - type: system_prompt
            configuration:
              system_prompt: You are a senior business consultant and strategic advisor.
        - name: math_decision
          description: Mathematics and quantitative reasoning
          priority: 100
          rules:
            operator: AND
            conditions:
            - type: domain
              name: math
          plugins:
          - type: system_prompt
            configuration:
              system_prompt: You are a mathematics expert.
        - name: general_decision
          description: General knowledge and miscellaneous topics
          priority: 50
          rules:
            operator: AND
            conditions:
            - type: domain
              name: other
          plugins:
          - type: system_prompt
            configuration:
              system_prompt: You are a helpful assistant.
          - type: response_cache
            configuration:
              enabled: true
              semantic:
                similarity_threshold: 0.75
    entrypoints:
    - model_names:
      - vllm-sr/auto
      - auto
      recipe: default
      assignments:
        business_decision:
          models:
          - model: '{{MODEL_NAME}}'
        math_decision:
          models:
          - model: '{{MODEL_NAME}}'
            reasoning:
              enabled: true
        general_decision:
          models:
          - model: '{{MODEL_NAME}}'
    global:
      router: {}
      services:
        api:
          batch_classification:
            max_batch_size: 100
            concurrency_threshold: 5
            max_concurrency: 8
            metrics:
              enabled: true
              detailed_goroutine_tracking: true
              high_resolution_timing: false
              sample_rate: 1.0
              duration_buckets:
              - 0.001
              - 0.005
              - 0.01
              - 0.025
              - 0.05
              - 0.1
              - 0.25
              - 0.5
              - 1
              - 2.5
              - 5
              - 10
              - 30
              size_buckets:
              - 1
              - 2
              - 5
              - 10
              - 20
              - 50
              - 100
              - 200
        observability:
          tracing:
            enabled: false
            provider: opentelemetry
            exporter:
              type: stdout
              endpoint: localhost:4317
              insecure: true
            sampling:
              type: always_on
              rate: 1.0
            resource:
              service_name: vllm-semantic-router
              service_version: v0.1.0
              deployment_environment: production
        backend_dispatch:
          bind_address: 0.0.0.0
          port: 8180
          audience: vllm-sr.backend-dispatch
          capability_ttl: 30s
          max_request_body_bytes: 67108864
        backend_egress:
          policy_file: /app/config/backend-egress-policy.yaml
      stores:
        response_cache:
          enabled: true
          backend_type: memory
          similarity_threshold: 0.8
          max_entries: 1000
          ttl_seconds: 3600
          eviction_policy: fifo
          embedding_model: mmbert
      integrations:
        tools:
          enabled: false
          top_k: 3
          similarity_threshold: 0.2
          tools_db_path: config/tools_db.json
          fallback_to_empty: true
      model_catalog:
        embeddings: {}
        modules:
          classifier: {}
          hallucination_mitigation: {}
