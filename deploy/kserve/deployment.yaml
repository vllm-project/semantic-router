apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router-kserve
  labels:
    app: semantic-router
    component: gateway
  annotations:
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-router
      component: gateway
  template:
    metadata:
      labels:
        app: semantic-router
        component: gateway
        app.kubernetes.io/name: semantic-router
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: vllm-semantic-router
      annotations:
        sidecar.istio.io/inject: "true"  # Enable Istio injection for service mesh integration with KServe
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'  # Ensure proxy is ready
    spec:
      serviceAccountName: semantic-router  # see serviceaccount.yaml and rbac.yaml
      # OpenShift security context - let OpenShift assign UID/GID
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # The model runtime in the router container downloads and verifies the
      # models it serves into the Hugging Face cache on the cache volume. This
      # prepares the cache directories for the UID OpenShift assigns.
      initContainers:
      - name: prepare-cache
        image: python:3.11-slim
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Creating cache directories..."
          mkdir -p /app/cache/hf /app/cache/transformers /app/cache/sentence_transformers /app/cache/xdg
          chmod -R 777 /app/cache/ 2>/dev/null || true
          find /app/models -type d -exec chmod 755 {} \; 2>/dev/null || true
          echo "Cache directories ready."
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: cache-volume
          mountPath: /app/cache

      containers:
      # Semantic Router container
      - name: semantic-router
        image: ghcr.io/vllm-project/semantic-router/vllm-sr:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        - containerPort: 9190
          name: metrics
          protocol: TCP
        - containerPort: 8080
          name: classify-api
          protocol: TCP
        env:
        # Lets the config write API patch this ConfigMap through the
        # Kubernetes API instead of the read-only mounted file (#3688).
        - name: VLLM_SR_K8S_CONFIGMAP_NAME
          value: "semantic-router-kserve-config"
        - name: VLLM_SR_K8S_CONFIGMAP_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VLLM_SR_CONFIG_BACKUP_DIR
          value: "/tmp/vllm-sr/config-history"
        - name: HF_HOME
          value: "/app/cache/hf"
        - name: TRANSFORMERS_CACHE
          value: "/app/cache/transformers"
        - name: SENTENCE_TRANSFORMERS_HOME
          value: "/app/cache/sentence_transformers"
        - name: XDG_CACHE_HOME
          value: "/app/cache/xdg"
        - name: HOME
          value: "/tmp/home"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: models-volume
          mountPath: /app/models
        - name: cache-volume
          mountPath: /app/cache
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        # Sized as in the Helm chart: the Router and the model runtime it starts for the decision model.
        resources:
          requests:
            memory: "3Gi"
            cpu: "1500m"
          limits:
            memory: "12Gi"
            cpu: "3"

      # Envoy proxy container - routes to KServe endpoints
      - name: envoy-proxy
        image: envoyproxy/envoy:v1.35.3
        ports:
        - containerPort: 8801
          name: envoy-http
          protocol: TCP
        - containerPort: 19000
          name: envoy-admin
          protocol: TCP
        command: ["/usr/local/bin/envoy"]
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--component-log-level"
        - "ext_proc:info,router:info,http:info"
        env:
        - name: loglevel
          value: "info"
        volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          tcpSocket:
            port: 8801
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8801
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      volumes:
      - name: config-volume
        configMap:
          name: semantic-router-kserve-config
      - name: envoy-config-volume
        configMap:
          name: semantic-router-envoy-kserve-config
      - name: models-volume
        persistentVolumeClaim:
          claimName: semantic-router-models
      - name: cache-volume
        persistentVolumeClaim:
          claimName: semantic-router-cache
