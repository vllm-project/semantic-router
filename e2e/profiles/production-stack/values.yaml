config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      reasoning_families:
        base-model:
          type: chat_template_kwargs
          parameter: enable_thinking
    models:
    - name: base-model
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      reasoning_family: base-model
  routing:
    modelCards:
    - name: base-model
      loras:
      - name: science-expert
      - name: social-expert
      - name: math-expert
      - name: law-expert
      - name: humanities-expert
      - name: general-expert
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals:
        domains:
        - name: business
          description: Business, corporate strategy, management, finance
        - name: philosophy
          description: Philosophical traditions, ethics, logic
        - name: biology
          description: Molecular biology, genetics, cell biology
        - name: health
          description: Anatomy, physiology, diseases, treatments
        - name: computer science
          description: Algorithms, data structures, programming
        - name: engineering
          description: Engineering disciplines, design, problem-solving
        - name: psychology
          description: Cognitive processes, behavioral patterns
        - name: math
          description: Mathematics, algebra, calculus, geometry
        - name: chemistry
          description: Chemical reactions, molecular structures
        - name: physics
          description: Physical laws, mechanics, thermodynamics
        - name: history
          description: Historical events, time periods, cultures
        - name: law
          description: Legal principles, case law, statutory interpretation
        - name: economics
          description: Microeconomics, macroeconomics, financial markets
        - name: other
          description: General knowledge and miscellaneous topics
        jailbreak:
        - name: jailbreak_standard
          threshold: 0.7
          include_history: false
          description: Standard jailbreak detection
        pii:
        - name: pii_deny_all
          threshold: 0.9
          include_history: false
          description: Block all PII
      decisions:
      - name: block_jailbreak
        description: Block jailbreak attempts
        priority: 1000
        rules:
          operator: OR
          conditions:
          - type: jailbreak
            name: jailbreak_standard
        plugins:
        - type: fast_response
          configuration:
            message: I'm sorry, but I cannot process this request as it appears to
              violate our usage policies.
      - name: block_pii
        description: Block requests containing PII
        priority: 999
        rules:
          operator: OR
          conditions:
          - type: pii
            name: pii_deny_all
        plugins:
        - type: fast_response
          configuration:
            message: Your request contains personal information that cannot be processed.
      - name: business_decision
        description: Business domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: business
        plugins: null
      - name: philosophy_decision
        description: Philosophy domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: philosophy
        plugins: null
      - name: biology_decision
        description: Biology domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: biology
        plugins: null
      - name: health_decision
        description: Health domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: health
        plugins: null
      - name: computer_science_decision
        description: Computer science domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: computer science
        plugins: null
      - name: engineering_decision
        description: Engineering domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: engineering
        plugins: null
      - name: psychology_decision
        description: Psychology domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: psychology
        plugins: null
      - name: math_decision
        description: Math domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: math
        plugins: null
      - name: chemistry_decision
        description: Chemistry domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: chemistry
        plugins: null
      - name: physics_decision
        description: Physics domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: physics
        plugins: null
      - name: history_decision
        description: History domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: history
        plugins: null
      - name: law_decision
        description: Law domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: law
        plugins: null
      - name: economics_decision
        description: Economics domain queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: economics
        plugins: null
      - name: default_decision
        description: Default route for all requests
        priority: 1
        rules:
          operator: OR
          conditions:
          - type: domain
            name: other
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.8
  entrypoints:
  - model_names:
    - vllm-sr/auto
    - auto
    recipe: default
    assignments:
      block_jailbreak:
        models:
        - model: base-model
          weight: '1'
      block_pii:
        models:
        - model: base-model
          weight: '1'
      business_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      philosophy_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      biology_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      health_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      computer_science_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      engineering_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      psychology_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      math_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
          reasoning:
            enabled: true
      chemistry_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
          reasoning:
            enabled: true
      physics_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
          reasoning:
            enabled: true
      history_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      law_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      economics_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      default_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
  global:
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router:
      clear_route_cache: true
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
            size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
      observability:
        tracing:
          enabled: false
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.8
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: false
resources:
  limits:
    memory: 10Gi
    cpu: '4'
  requests:
    memory: 5Gi
    cpu: '1'
image:
  pullPolicy: IfNotPresent
