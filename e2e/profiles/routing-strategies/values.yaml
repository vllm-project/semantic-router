config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: base-model
      reasoning_effort: high
    models:
      - name: base-model
        reasoning:
          family: qwen3
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
      - name: premium-model
        provider_model_id: base-model
        pricing:
          currency: USD
          prompt_per_1m: 10
        backend_refs:
          - name: local-vllm-premium
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
      - name: economy-model
        provider_model_id: base-model
        pricing:
          currency: USD
          prompt_per_1m: 1
        backend_refs:
          - name: local-vllm-economy
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  entrypoints:
    - model_names: [vllm-sr/auto]
      recipe: default
      default: true
    - model_names: [vllm-sr/metadata-policy]
      recipe: metadata-policy
    - model_names: [vllm-sr/input-modality-probe]
      recipe: input-modality-probe
  recipes:
    - name: default
      decisions:
        - name: quality_policy_decision
          description: Quality-only multi-factor policy
          priority: 250
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: quality_policy
          modelRefs:
            - model: premium-model
            - model: economy-model
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 1
                latency: 0
                cost: 0
                load: 0
        - name: cost_policy_decision
          description: Cost-only multi-factor policy
          priority: 250
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: cost_policy
          modelRefs:
            - model: premium-model
            - model: economy-model
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 0
                latency: 0
                cost: 1
                load: 0
        - name: random_policy_decision
          description: Uniform random selection among eligible candidates
          priority: 250
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: random_policy
          modelRefs:
            - model: premium-model
            - model: economy-model
          algorithm:
            type: random
            minimum_candidates: 2
        - name: code_keywords_decision
          description: Code and programming queries (BM25 classified)
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: code_keywords
          modelRefs:
            - model: base-model
              use_reasoning: true
          plugins:
            - type: system_prompt
              configuration:
                system_prompt: You are an expert software engineer. Provide clear, well-structured code examples with explanations. Follow best practices and consider edge cases.
        - name: urgent_request_decision
          description: Urgent and time-sensitive requests (N-gram classified with typo tolerance)
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: urgent_request
          modelRefs:
            - model: base-model
              use_reasoning: false
          plugins:
            - type: system_prompt
              configuration:
                system_prompt: You are a highly responsive assistant specialized in handling urgent requests. Prioritize speed and efficiency while maintaining accuracy. Provide concise, actionable responses and focus on immediate solutions.
        - name: sensitive_data_decision
          description: Requests involving sensitive personal data
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: sensitive_data
          modelRefs:
            - model: base-model
              use_reasoning: false
          plugins:
            - type: system_prompt
              configuration:
                system_prompt: You are a security-conscious assistant specialized in handling sensitive data. Exercise extreme caution with personal information, follow data protection best practices, and remind users about privacy considerations.
        - name: regex_pattern_match_decision
          description: Structured data and pattern-based requests
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: regex_pattern_match
          modelRefs:
            - model: base-model
              use_reasoning: false
        - name: business_decision
          description: Business and management related queries
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: domain
                name: business
          modelRefs:
            - model: base-model
              use_reasoning: false
          plugins:
            - type: system_prompt
              configuration:
                system_prompt: You are a senior business consultant and strategic advisor with expertise in corporate strategy, operations management, financial analysis, marketing, and organizational development. Provide practical, actionable business advice backed by proven methodologies and industry best practices.
        - name: general_decision
          description: General knowledge and miscellaneous topics
          priority: 50
          rules:
            operator: AND
            conditions:
              - type: domain
                name: other
          modelRefs:
            - model: base-model
              use_reasoning: false
          plugins:
            - type: system_prompt
              configuration:
                system_prompt: You are a helpful and knowledgeable assistant. Provide accurate, helpful responses across a wide range of topics.
            - type: response_cache
              configuration:
                enabled: true
                scope: global
                semantic: {match: {recall: {top_k: 3, min_similarity: 0.75}}}
      signals:
        keywords:
          - name: quality_policy
            operator: OR
            keywords:
              - decision scoped quality policy
            case_sensitive: false
          - name: cost_policy
            operator: OR
            keywords:
              - decision scoped cost policy
            case_sensitive: false
          - name: random_policy
            operator: OR
            keywords:
              - decision scoped random policy
            case_sensitive: false
          - name: code_keywords
            operator: OR
            method: bm25
            keywords:
              - code
              - function
              - implement
              - debug
              - algorithm
              - compile
              - syntax
              - variable
              - loop
              - refactor
            bm25_threshold: 0.1
            case_sensitive: false
          - name: urgent_request
            operator: OR
            method: ngram
            keywords:
              - urgent
              - immediate
              - asap
              - emergency
            ngram_threshold: 0.4
            ngram_arity: 3
            case_sensitive: false
          - name: sensitive_data
            operator: AND
            keywords:
              - SSN
              - credit card
            case_sensitive: false
          - name: regex_pattern_match
            operator: OR
            keywords:
              - user.name@domain.com
              - C:\Program Files\
            case_sensitive: false
        domains:
          - name: code_keywords
            description: Programming and software development queries
            labels:
              - "computer science"
          - name: business
            description: Business and management related queries
            labels:
              - business
          - name: law
            description: Legal questions and law-related topics
            labels:
              - law
          - name: psychology
            description: Psychology and mental health topics
            labels:
              - psychology
          - name: biology
            description: Biology and life sciences questions
            labels:
              - biology
          - name: chemistry
            description: Chemistry and chemical sciences questions
            labels:
              - chemistry
          - name: history
            description: Historical questions and cultural topics
            labels:
              - history
          - name: other
            description: General knowledge and miscellaneous topics
            labels:
              - other
          - name: health
            description: Health and medical information queries
            labels:
              - health
          - name: economics
            description: Economics and financial topics
            labels:
              - economics
          - name: math
            description: Mathematics and quantitative reasoning
            labels:
              - math
          - name: physics
            description: Physics and physical sciences
            labels:
              - physics
          - name: "computer science"
            description: Computer science and programming
            labels:
              - "computer science"
          - name: philosophy
            description: Philosophy and ethical questions
            labels:
              - philosophy
          - name: engineering
            description: Engineering and technical problem-solving
            labels:
              - engineering
        jailbreak:
          - name: jailbreak_standard
            description: Standard jailbreak detection for routing-strategies tests
            predicate:
              gte: 0.88
        pii:
          - name: pii_deny_all
            description: Block all PII
            predicate:
              gte: 0.18
    - name: input-modality-probe
      description: Deterministic structural input-modality routing probe.
      strategy: priority
      signals:
        input_modality:
          - name: image_input
            description: Request contains at least one image content part.
            modality: image
          - name: audio_input
            description: Request contains at least one audio content part.
            modality: audio
          - name: text_input
            description: Request contains user-provided text.
            modality: text
          - name: video_input
            description: Request contains video content; only the classify/eval APIs can carry it today.
            modality: video
      decisions:
        - name: input_modality_vision_decision
          description: Send image-bearing requests to the vision route.
          priority: 200
          rules:
            operator: AND
            conditions:
              - type: input_modality
                name: image_input
          modelRefs:
            - model: base-model
              use_reasoning: false
        - name: input_modality_audio_decision
          description: Send audio-bearing requests to the audio route.
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: input_modality
                name: audio_input
          modelRefs:
            - model: base-model
              use_reasoning: false
        - name: input_modality_video_decision
          description: Send video-bearing requests to the video route; reachable through the classify/eval APIs only.
          priority: 120
          rules:
            operator: AND
            conditions:
              - type: input_modality
                name: video_input
          modelRefs:
            - model: base-model
              use_reasoning: false
        - name: input_modality_text_decision
          description: Text-only requests continue on the default route.
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: input_modality
                name: text_input
          modelRefs:
            - model: base-model
              use_reasoning: false
    - name: metadata-policy
      description: Deterministic recipe-local metadata routing probe.
      strategy: priority
      signals:
        metadata:
          - name: canary_cohort
            key: cohort
            predicate:
              equals: canary
      decisions:
        - name: metadata_recipe_decision
          description: Route canary metadata inside the selected recipe.
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: metadata
                name: canary_cohort
          modelRefs:
            - model: base-model
              use_reasoning: false
  evaluation:
    records:
      - model: premium-model
        benchmark: vllm-sr/operator-rating@1.0.0
        metrics:
          score: 0.9
      - model: economy-model
        benchmark: vllm-sr/operator-rating@1.0.0
        metrics:
          score: 0.1
  global:
    model_catalog:
      deployments:
        # provider-mocker's embedding fixture (see its README) stands in for
        # the embedding model, so the Router downloads none.
        fixture-embedding:
          provider: openai_embeddings
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1
          model: e2e/fixture-embedding
          timeout_ms: 5000
          capabilities:
            dimensions: 256
        # provider-mocker's System One fixture answers the jailbreak and PII
        # rules, so the shared detection cases are pinned by their markers
        # (tools/test/services/provider-mocker/README.md).
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          schema: vllm-sr/4.0
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
      bindings:
        jailbreak: fake-systemone
        pii: fake-systemone
        domain: fake-systemone
      embeddings:
        default: {deployment: fixture-embedding}
    router:
      strategy: priority
    services:
      api:
        batch_classification:
          max_batch_size: 100
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
              - 0.001
              - 0.005
              - 0.01
              - 0.025
              - 0.05
              - 0.1
              - 0.25
              - 0.5
              - 1
              - 2.5
              - 5
              - 10
              - 30
            size_buckets:
              - 1
              - 2
              - 5
              - 10
              - 20
              - 50
              - 100
              - 200
      observability:
        tracing:
          enabled: true
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
    stores:
      response_cache:
        backend_type: memory
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
