config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      reasoning_families:
        base-model:
          type: chat_template_kwargs
          parameter: enable_thinking
    models:
    - name: base-model
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      reasoning_family: base-model
    - name: premium-model
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      pricing:
        input_cost_per_million_tokens: '10'
        cache_read_cost_per_million_tokens: '10'
        cache_write_cost_per_million_tokens: '10'
    - name: economy-model
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      pricing:
        input_cost_per_million_tokens: '1'
        cache_read_cost_per_million_tokens: '1'
        cache_write_cost_per_million_tokens: '1'
  routing:
    modelCards:
    - name: base-model
    - name: premium-model
      quality_score: 0.9
    - name: economy-model
      quality_score: 0.1
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals:
        keywords:
        - name: quality_policy
          operator: OR
          keywords:
          - decision scoped quality policy
          case_sensitive: false
        - name: cost_policy
          operator: OR
          keywords:
          - decision scoped cost policy
          case_sensitive: false
        - name: code_keywords
          operator: OR
          method: bm25
          keywords:
          - code
          - function
          - implement
          - debug
          - algorithm
          - compile
          - syntax
          - variable
          - loop
          - refactor
          bm25_threshold: 0.1
          case_sensitive: false
        - name: urgent_request
          operator: OR
          method: ngram
          keywords:
          - urgent
          - immediate
          - asap
          - emergency
          ngram_threshold: 0.4
          ngram_arity: 3
          case_sensitive: false
        - name: sensitive_data
          operator: AND
          keywords:
          - SSN
          - credit card
          case_sensitive: false
        - name: regex_pattern_match
          operator: OR
          keywords:
          - user.name@domain.com
          - C:\Program Files\
          case_sensitive: false
        domains:
        - name: code_keywords
          description: Programming and software development queries
          mmlu_categories:
          - computer science
        - name: urgent_request
          description: Urgent and time-sensitive requests
        - name: sensitive_data
          description: Requests involving sensitive personal data
        - name: business
          description: Business and management related queries
          mmlu_categories:
          - business
        - name: law
          description: Legal questions and law-related topics
          mmlu_categories:
          - law
        - name: psychology
          description: Psychology and mental health topics
          mmlu_categories:
          - psychology
        - name: biology
          description: Biology and life sciences questions
          mmlu_categories:
          - biology
        - name: chemistry
          description: Chemistry and chemical sciences questions
          mmlu_categories:
          - chemistry
        - name: history
          description: Historical questions and cultural topics
          mmlu_categories:
          - history
        - name: other
          description: General knowledge and miscellaneous topics
          mmlu_categories:
          - other
        - name: health
          description: Health and medical information queries
          mmlu_categories:
          - health
        - name: economics
          description: Economics and financial topics
          mmlu_categories:
          - economics
        - name: math
          description: Mathematics and quantitative reasoning
          mmlu_categories:
          - math
        - name: physics
          description: Physics and physical sciences
          mmlu_categories:
          - physics
        - name: computer science
          description: Computer science and programming
          mmlu_categories:
          - computer science
        - name: philosophy
          description: Philosophy and ethical questions
          mmlu_categories:
          - philosophy
        - name: engineering
          description: Engineering and technical problem-solving
          mmlu_categories:
          - engineering
        jailbreak:
        - name: jailbreak_standard
          threshold: 0.6
          include_history: false
          description: Standard jailbreak detection for routing-strategies tests
        pii:
        - name: pii_deny_all
          threshold: 0.7
          include_history: false
          description: Block all PII
      decisions:
      - name: quality_policy_decision
        description: Quality-only multi-factor policy
        priority: 250
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: quality_policy
        algorithm:
          type: multi_factor
          multi_factor:
            weights:
              quality: 1
              latency: 0
              cost: 0
              load: 0
      - name: cost_policy_decision
        description: Cost-only multi-factor policy
        priority: 250
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: cost_policy
        algorithm:
          type: multi_factor
          multi_factor:
            weights:
              quality: 0
              latency: 0
              cost: 1
              load: 0
      - name: code_keywords_decision
        description: Code and programming queries (BM25 classified)
        priority: 150
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: code_keywords
        plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are an expert software engineer. Provide clear, well-structured
              code examples with explanations. Follow best practices and consider
              edge cases.
      - name: urgent_request_decision
        description: Urgent and time-sensitive requests (N-gram classified with typo
          tolerance)
        priority: 150
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: urgent_request
        plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are a highly responsive assistant specialized in handling
              urgent requests. Prioritize speed and efficiency while maintaining accuracy.
              Provide concise, actionable responses and focus on immediate solutions.
      - name: sensitive_data_decision
        description: Requests involving sensitive personal data
        priority: 150
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: sensitive_data
        plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are a security-conscious assistant specialized in handling
              sensitive data. Exercise extreme caution with personal information,
              follow data protection best practices, and remind users about privacy
              considerations.
      - name: regex_pattern_match_decision
        description: Structured data and pattern-based requests
        priority: 150
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: regex_pattern_match
      - name: business_decision
        description: Business and management related queries
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: business
        plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are a senior business consultant and strategic advisor
              with expertise in corporate strategy, operations management, financial
              analysis, marketing, and organizational development. Provide practical,
              actionable business advice backed by proven methodologies and industry
              best practices.
      - name: general_decision
        description: General knowledge and miscellaneous topics
        priority: 50
        rules:
          operator: AND
          conditions:
          - type: domain
            name: other
        plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are a helpful and knowledgeable assistant. Provide
              accurate, helpful responses across a wide range of topics.
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.75
  - name: metadata-policy
    description: Deterministic recipe-local metadata routing probe.
    routing:
      signals:
        metadata:
        - name: canary_cohort
          key: cohort
          predicate:
            equals: canary
      decisions:
      - name: metadata_recipe_decision
        description: Route canary metadata inside the selected recipe.
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: metadata
            name: canary_cohort
      strategy: priority
  entrypoints:
  - model_names:
    - vllm-sr/metadata-policy
    recipe: metadata-policy
    assignments:
      metadata_recipe_decision:
        models:
        - model: base-model
          weight: '1'
  global:
    billing:
      currency: USD
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router: {}
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
            size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
      observability:
        tracing:
          enabled: true
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.8
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: true
        top_k: 3
        similarity_threshold: 0.2
        tools_db_path: config/tools_db.json
        fallback_to_empty: true
