version: v0.4
listeners: []
models:
- name: qwen3
  card:
    reasoning:
      type: chat_template_kwargs
      efforts:
      - high
  connections:
  - provider: vllm
    endpoint: http://172.28.0.20:8002/v1
    model: qwen3
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      keywords:
      - name: code_keywords
        operator: OR
        method: bm25
        keywords:
        - code
        - function
        - implement
        - debug
        - algorithm
        - compile
        - syntax
        - variable
        - loop
        - refactor
        bm25_threshold: 0.1
        case_sensitive: false
      - name: urgent_request
        operator: OR
        method: ngram
        keywords:
        - urgent
        - immediate
        - asap
        - emergency
        ngram_threshold: 0.4
        ngram_arity: 3
        case_sensitive: false
      - name: sensitive_data
        operator: AND
        keywords:
        - SSN
        - social security number
        - credit card
        case_sensitive: false
      - name: exclude_spam
        operator: NOR
        keywords:
        - buy now
        - free money
        case_sensitive: false
      - name: regex_pattern_match
        operator: OR
        keywords:
        - user\.name@domain\.com
        - C:\Program Files\\
        case_sensitive: false
      embeddings:
      - name: ai
        threshold: 0.75
        candidates:
        - artificial intelligence
        - machine learning
        - deep learning
        - neural networks
        - AI algorithms
        aggregation_method: max
      - name: data_science
        threshold: 0.7
        candidates:
        - data analysis
        - statistical modeling
        - predictive analytics
        - data visualization
        aggregation_method: mean
      - name: programming
        threshold: 0.72
        candidates:
        - write code
        - implement function
        - create class
        - code snippet
        - programming task
        aggregation_method: max
      domains:
      - name: urgent_request
        description: Urgent and time-sensitive requests
      - name: sensitive_data
        description: Requests involving sensitive personal data
      - name: exclude_spam
        description: Potential spam or suspicious requests
      - name: regex_pattern_match
        description: Structured data and pattern-based requests
      - name: ai
        description: Artificial intelligence and machine learning topics
      - name: data_science
        description: Data science and analytics
      - name: programming
        description: Programming and software development
      - name: business
        description: Business and management related queries
        mmlu_categories:
        - business
      - name: law
        description: Legal questions and law-related topics
        mmlu_categories:
        - law
      - name: psychology
        description: Psychology and mental health topics
        mmlu_categories:
        - psychology
      - name: biology
        description: Biology and life sciences questions
        mmlu_categories:
        - biology
      - name: chemistry
        description: Chemistry and chemical sciences questions
        mmlu_categories:
        - chemistry
      - name: history
        description: Historical questions and cultural topics
        mmlu_categories:
        - history
      - name: other
        description: General knowledge and miscellaneous topics
        mmlu_categories:
        - other
      - name: health
        description: Health and medical information queries
        mmlu_categories:
        - health
      - name: economics
        description: Economics and financial topics
        mmlu_categories:
        - economics
      - name: math
        description: Mathematics and quantitative reasoning
        mmlu_categories:
        - math
      - name: physics
        description: Physics and physical sciences
        mmlu_categories:
        - physics
      - name: computer science
        description: Computer science and programming
        mmlu_categories:
        - computer science
      - name: philosophy
        description: Philosophy and ethical questions
        mmlu_categories:
        - philosophy
      - name: engineering
        description: Engineering and technical problem-solving
        mmlu_categories:
        - engineering
    decisions:
    - name: urgent_request_decision
      description: Urgent and time-sensitive requests
      priority: 150
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: urgent_request
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a highly responsive assistant specialized in handling
            urgent requests. Prioritize speed and efficiency while maintaining accuracy.
    - name: sensitive_data_decision
      description: Requests involving sensitive personal data
      priority: 150
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: sensitive_data
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a security-conscious assistant specialized in handling
            sensitive data. Exercise extreme caution with personal information.
    - name: exclude_spam_decision
      description: Potential spam or suspicious requests
      priority: 150
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: exclude_spam
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a content moderation assistant. This request has
            been flagged as potential spam.
    - name: regex_pattern_match_decision
      description: Structured data and pattern-based requests
      priority: 150
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: regex_pattern_match
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a technical assistant specialized in handling structured
            data and pattern-based requests.
    - name: ai_decision
      description: Artificial intelligence and machine learning topics
      priority: 140
      rules:
        operator: AND
        conditions:
        - type: embedding
          name: ai
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are an AI and machine learning expert. Provide detailed,
            technical explanations about artificial intelligence, neural networks,
            and related topics.
    - name: data_science_decision
      description: Data science and analytics
      priority: 140
      rules:
        operator: AND
        conditions:
        - type: embedding
          name: data_science
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a data science expert. Provide insights on data analysis,
            statistical methods, and predictive modeling.
    - name: programming_decision
      description: Programming and software development
      priority: 140
      rules:
        operator: AND
        conditions:
        - type: embedding
          name: programming
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a programming expert. Help with code implementation,
            debugging, and software development best practices.
    - name: business_decision
      description: Business and management related queries
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: business
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a senior business consultant and strategic advisor.
    - name: math_decision
      description: Mathematics and quantitative reasoning
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: math
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a mathematics expert. Provide step-by-step solutions.
    - name: computer_science_decision
      description: Computer science and programming
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: computer science
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a computer science expert.
    - name: general_decision
      description: General knowledge and miscellaneous topics
      priority: 50
      rules:
        operator: AND
        conditions:
        - type: domain
          name: other
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a helpful and knowledgeable assistant.
      - type: response_cache
        configuration:
          enabled: true
          scope: global
          semantic:
            similarity_threshold: 0.75
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    urgent_request_decision:
      models:
      - model: qwen3
        weight: '1'
    sensitive_data_decision:
      models:
      - model: qwen3
        weight: '1'
    exclude_spam_decision:
      models:
      - model: qwen3
        weight: '1'
    regex_pattern_match_decision:
      models:
      - model: qwen3
        weight: '1'
    ai_decision:
      models:
      - model: qwen3
        weight: '1'
    data_science_decision:
      models:
      - model: qwen3
        weight: '1'
    programming_decision:
      models:
      - model: qwen3
        weight: '1'
    business_decision:
      models:
      - model: qwen3
        weight: '1'
    math_decision:
      models:
      - model: qwen3
        weight: '1'
        reasoning:
          enabled: true
    computer_science_decision:
      models:
      - model: qwen3
        weight: '1'
    general_decision:
      models:
      - model: qwen3
        weight: '1'
global:
  router: {}
  services:
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1.0
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
