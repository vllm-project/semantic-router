replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/workflow-planner
        backend_refs:
          - name: test-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  routing:
    decisions:
      - name: workflow_decision
        description: Workflow decision for testing pause and resume
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: workflow_keyword
        algorithm:
          type: workflows
          workflows:
            mode: dynamic
            planner:
              model: openai/workflow-planner
            max_steps: 2
            on_error: skip
            final:
              model: openai/gpt-oss-20b
        modelRefs:
          - model: openai/gpt-oss-20b
      - name: history_reset_recovery_probe
        description: Keyword-gated history_reset route storing removed turns in Redis, captured by Router Replay (history-reset-recovery, issue #3343)
        priority: 90
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: history_reset_recovery_probe
        modelRefs:
          - model: openai/gpt-oss-20b
            use_reasoning: false
        plugins:
          - type: history_reset
            configuration:
              enabled: true
              trigger:
                signal: topic_boundary
                min_confidence: 0.9
                accepted_versions:
                  - v1
              scope: eligible_history
              failure_mode: fail_closed
              recovery:
                enabled: true
                store: redis
                ttl_seconds: 900
                max_bytes_per_request: 1048576
                max_total_bytes: 67108864
                max_retrievals: 4
          - type: router_replay
            configuration:
              enabled: true
              max_records: 100
              capture_request_body: false
              capture_response_body: false
      - name: default_decision
        description: Default catch-all decision
        priority: 1
        rules:
          operator: OR
          conditions:
            - type: domain
              name: other
        modelRefs:
          - model: openai/gpt-oss-20b
            use_reasoning: false
    signals:
      # Evidence for the history_reset recovery probe route.
      topic_continuity:
        - name: topic_boundary
          description: Whether the live turn still depends on retained history.
      keywords:
        - name: history_reset_recovery_probe
          operator: OR
          keywords:
            - "__HISTORY_RESET_RECOVERY_PROBE__"
          case_sensitive: false
        - name: workflow_keyword
          operator: OR
          keywords:
            - "workflow"
            - "workflows"
            - "workflow_pause_resume"
          case_sensitive: false
      domains:
        - name: other
          description: General knowledge and miscellaneous topics
          mmlu_categories:
            - other
    modelCards:
      - name: openai/gpt-oss-20b
      - name: openai/workflow-planner
  global:
    router:
      strategy: priority
    services:
      # Bounded, synchronous in-memory Replay for the history_reset recovery
      # probe; bodies are never captured.
      router_replay:
        enabled: true
        store_backend: memory
        async_writes: false
        capture_request_body: false
        capture_response_body: false
        max_records: 1000
      response_api:
        enabled: true
        store_backend: redis
        ttl_seconds: 10
        max_responses: 1000
        redis:
          address: redis.default.svc.cluster.local:6379
          password: ''
          db: 0
          key_prefix: 'sr:'
          pool_size: 10
          min_idle_conns: 2
          max_retries: 3
          dial_timeout: 5
          read_timeout: 3
          write_timeout: 3
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    stores:
      response_cache:
        embedding_model: mmbert
        # The cache stays on its memory backend: this Redis is plain Redis
        # without vector search. Context recovery (recovery.store: redis)
        # reuses only this connection.
        redis:
          connection:
            host: redis.default.svc.cluster.local
            port: 6379
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      looper:
        flow:
          state:
            store_backend: redis
            ttl_seconds: 1800
            redis:
              address: redis.default.svc.cluster.local:6379
              db: 0
              password: ""
              key_prefix: "vllm-sr:flow:state:"
    model_catalog:
      kbs: []
      modules:
        prompt_guard:
          enabled: false
          model_ref: ""
          model_id: ""
          jailbreak_mapping_path: ""
        classifier:
          domain:
            model_ref: ""
            model_id: ""
            category_mapping_path: ""
          pii:
            model_ref: ""
            model_id: ""
            pii_mapping_path: ""
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false
