config:
  version: v0.4
  listeners: []
  models:
  - name: vllm-llama3-8b-instruct
    card:
      reasoning:
        type: chat_template_kwargs
        efforts:
        - high
      loras:
      - science-expert
      - social-expert
      - math-expert
      - law-expert
      - humanities-expert
      - general-expert
    connections:
    - provider: vllm
      endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      model: vllm-llama3-8b-instruct
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  recipes:
  - name: default
    description: Default routing recipe.
    document:
      signals:
        keywords:
        - name: thinking
          operator: OR
          keywords:
          - urgent
          - immediate
          - asap
          - think
          - careful
          case_sensitive: false
        domains:
        - name: business
          description: business routing domain.
        - name: law
          description: law routing domain.
        - name: psychology
          description: psychology routing domain.
        - name: biology
          description: biology routing domain.
        - name: chemistry
          description: chemistry routing domain.
        - name: history
          description: history routing domain.
        - name: other
          description: other routing domain.
        - name: health
          description: health routing domain.
        - name: economics
          description: economics routing domain.
        - name: math
          description: math routing domain.
        - name: physics
          description: physics routing domain.
        - name: computer science
          description: computer science routing domain.
        - name: philosophy
          description: philosophy routing domain.
        - name: engineering
          description: engineering routing domain.
        jailbreak:
        - name: jailbreak_standard
          threshold: 0.7
          include_history: false
          description: Standard jailbreak detection
        pii:
        - name: pii_deny_all
          threshold: 0.7
          include_history: false
          description: Block all PII
      decisions:
      - name: block_jailbreak
        description: Block jailbreak attempts
        priority: 1000
        rules:
          operator: OR
          conditions:
          - type: jailbreak
            name: jailbreak_standard
        plugins:
        - type: fast_response
          configuration:
            message: I'm sorry, but I cannot process this request as it appears to
              violate our usage policies.
      - name: block_pii
        description: Block requests containing PII
        priority: 999
        rules:
          operator: OR
          conditions:
          - type: pii
            name: pii_deny_all
        plugins:
        - type: fast_response
          configuration:
            message: I'm sorry, but I cannot process this request as it appears to
              contain personal identifiable information.
      - name: business_decision
        description: Business and management related queries
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: business
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a senior business consultant and strategic advisor
              with expertise in corporate strategy, operations management, financial
              analysis, marketing, and organizational development. Provide practical,
              actionable business advice backed by proven methodologies and industry
              best practices. Consider market dynamics, competitive landscape, and
              stakeholder interests in your recommendations.
            mode: replace
      - name: law_decision
        description: Legal questions and law-related topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: law
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a knowledgeable legal expert with comprehensive
              understanding of legal principles, case law, statutory interpretation,
              and legal procedures across multiple jurisdictions. Provide accurate
              legal information and analysis while clearly stating that your responses
              are for informational purposes only and do not constitute legal advice.
              Always recommend consulting with qualified legal professionals for specific
              legal matters.
            mode: replace
      - name: psychology_decision
        description: Psychology and mental health topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: psychology
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.92
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a psychology expert with deep knowledge of cognitive
              processes, behavioral patterns, mental health, developmental psychology,
              social psychology, and therapeutic approaches. Provide evidence-based
              insights grounded in psychological research and theory. When discussing
              mental health topics, emphasize the importance of professional consultation
              and avoid providing diagnostic or therapeutic advice.
            mode: replace
      - name: biology_decision
        description: Biology and life sciences questions
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: biology
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a biology expert with comprehensive knowledge spanning
              molecular biology, genetics, cell biology, ecology, evolution, anatomy,
              physiology, and biotechnology. Explain biological concepts with scientific
              accuracy, use appropriate terminology, and provide examples from current
              research. Connect biological principles to real-world applications and
              emphasize the interconnectedness of biological systems.
            mode: replace
      - name: chemistry_decision
        description: Chemistry and chemical sciences questions
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: chemistry
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a chemistry expert specializing in chemical reactions,
              molecular structures, and laboratory techniques. Provide detailed, step-by-step
              explanations.
            mode: replace
      - name: history_decision
        description: Historical questions and cultural topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: history
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a historian with expertise across different time
              periods and cultures. Provide accurate historical context and analysis.
            mode: replace
      - name: other_decision
        description: General knowledge and miscellaneous topics
        priority: 5
        rules:
          operator: OR
          conditions:
          - type: domain
            name: other
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.75
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a helpful and knowledgeable assistant. Provide
              accurate, helpful responses across a wide range of topics.
            mode: replace
      - name: health_decision
        description: Health and medical information queries
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: health
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.95
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a health and medical information expert with knowledge
              of anatomy, physiology, diseases, treatments, preventive care, nutrition,
              and wellness. Provide accurate, evidence-based health information while
              emphasizing that your responses are for educational purposes only and
              should never replace professional medical advice, diagnosis, or treatment.
              Always encourage users to consult healthcare professionals for medical
              concerns and emergencies.
            mode: replace
      - name: economics_decision
        description: Economics and financial topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: economics
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are an economics expert with deep understanding of
              microeconomics, macroeconomics, econometrics, financial markets, monetary
              policy, fiscal policy, international trade, and economic theory. Analyze
              economic phenomena using established economic principles, provide data-driven
              insights, and explain complex economic concepts in accessible terms.
              Consider both theoretical frameworks and real-world applications in
              your responses.
            mode: replace
      - name: math_decision
        description: Mathematics and quantitative reasoning
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: math
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a mathematics expert. Provide step-by-step solutions,
              show your work clearly, and explain mathematical concepts in an understandable
              way.
            mode: replace
      - name: physics_decision
        description: Physics and physical sciences
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: physics
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a physics expert with deep understanding of physical
              laws and phenomena. Provide clear explanations with mathematical derivations
              when appropriate.
            mode: replace
      - name: computer_science_decision
        description: Computer science and programming
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: computer science
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a computer science expert with knowledge of algorithms,
              data structures, programming languages, and software engineering. Provide
              clear, practical solutions with code examples when helpful.
            mode: replace
      - name: philosophy_decision
        description: Philosophy and ethical questions
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: philosophy
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a philosophy expert with comprehensive knowledge
              of philosophical traditions, ethical theories, logic, metaphysics, epistemology,
              political philosophy, and the history of philosophical thought. Engage
              with complex philosophical questions by presenting multiple perspectives,
              analyzing arguments rigorously, and encouraging critical thinking. Draw
              connections between philosophical concepts and contemporary issues while
              maintaining intellectual honesty about the complexity and ongoing nature
              of philosophical debates.
            mode: replace
      - name: engineering_decision
        description: Engineering and technical problem-solving
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: engineering
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are an engineering expert with knowledge across multiple
              engineering disciplines including mechanical, electrical, civil, chemical,
              software, and systems engineering. Apply engineering principles, design
              methodologies, and problem-solving approaches to provide practical solutions.
              Consider safety, efficiency, sustainability, and cost-effectiveness
              in your recommendations. Use technical precision while explaining concepts
              clearly, and emphasize the importance of proper engineering practices
              and standards.
            mode: replace
      - name: thinking_decision
        description: Complex reasoning and multi-step thinking
        priority: 15
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: thinking
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a thinking expert, should think multiple steps
              before answering. Please answer the question step by step.
            mode: replace
  entrypoints:
  - name: vllm-sr/auto
    aliases:
    - auto
    recipe: default
    assignments:
      block_jailbreak:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      block_pii:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      business_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      law_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      psychology_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      biology_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      chemistry_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
          reasoning:
            enabled: true
      history_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      other_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      health_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      economics_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      math_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
          reasoning:
            enabled: true
      physics_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
          reasoning:
            enabled: true
      computer_science_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      philosophy_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      engineering_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
      thinking_decision:
        models:
        - model: vllm-llama3-8b-instruct
          weight: '1'
          reasoning:
            enabled: true
  global:
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router: {}
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
            size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
      observability:
        tracing:
          enabled: false
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.8
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: true
        top_k: 3
        similarity_threshold: 0.2
        tools_db_path: config/tools_db.json
        fallback_to_empty: true
