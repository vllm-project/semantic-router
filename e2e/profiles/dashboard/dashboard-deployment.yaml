apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router-dashboard
  labels:
    app: semantic-router-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semantic-router-dashboard
  template:
    metadata:
      labels:
        app: semantic-router-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/vllm-project/semantic-router/dashboard:e2e-test
          imagePullPolicy: Never
          # The image ENTRYPOINT is /app/entrypoint.sh which calls:
          #   exec su-exec nonroot:nonroot "$@"
          # So args must begin with the binary path; flags-only args would
          # make su-exec treat the first flag as a username and exit(1).
          args:
            [
              "/app/dashboard-backend",
              "-port=8700",
              "-static=/app/frontend",
              "-config=/app/config/config.yaml",
            ]
          env:
            - name: TARGET_GRAFANA_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_GRAFANA_URL
            - name: TARGET_PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_PROMETHEUS_URL
            - name: TARGET_ROUTER_API_URL
              value: https://semantic-router-management.vllm-semantic-router-system.svc.cluster.local:8080
            - name: TARGET_ROUTER_METRICS_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_ROUTER_METRICS_URL
            - name: TARGET_OPENWEBUI_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_OPENWEBUI_URL
                  optional: true
            - name: TARGET_CHATUI_URL
              valueFrom:
                configMapKeyRef:
                  name: semantic-router-dashboard-config
                  key: TARGET_CHATUI_URL
                  optional: true
            - name: ROUTER_CONFIG_PATH
              value: /app/config/config.yaml
            - name: SSL_CERT_FILE
              value: /run/vllm-sr-dashboard-ca.crt
            - name: DASHBOARD_ISSUER
              value: https://semantic-router-dashboard-issuer.vllm-semantic-router-system.svc.cluster.local:9443
            - name: DASHBOARD_ISSUER_ID
              value: 10000000-0000-4000-8000-000000000011
            - name: DASHBOARD_KEY_ID
              value: dashboard-e2e-v1
            - name: DASHBOARD_SIGNING_KEY_FILE
              value: /run/vllm-sr-dashboard-assertion-signing-key.pem
            - name: DASHBOARD_ISSUER_TLS_LISTEN_ADDR
              value: :9443
            - name: DASHBOARD_ISSUER_TLS_CERT_FILE
              value: /run/vllm-sr-dashboard-issuer-tls.crt
            - name: DASHBOARD_ISSUER_TLS_KEY_FILE
              value: /run/vllm-sr-dashboard-issuer-tls.key
            - name: DASHBOARD_ROUTER_BOOTSTRAP_TOKEN_FILE
              value: /tmp/vllm-sr-dashboard/bootstrap/router-token
            - name: DASHBOARD_ALLOW_OPEN_BOOTSTRAP
              value: "true"
            # ML pipeline disabled in E2E — ml-training-service image is not
            # available in CI and the pipeline is not part of the dashboard contract.
            - name: ML_PIPELINE_ENABLED
              value: "false"
            # Keep auth enabled in E2E. The dashboard fails closed when the auth
            # store cannot be initialized, so the tests use this bootstrap admin
            # and a writable temporary SQLite store.
            - name: DASHBOARD_AUTH_DB_PATH
              value: /tmp/vllm-sr-dashboard/auth.db
            - name: DASHBOARD_WORKFLOW_DB_PATH
              value: /tmp/vllm-sr-dashboard/workflow.sqlite
            - name: DASHBOARD_STATUS_DB_PATH
              value: /tmp/vllm-sr-dashboard/status.sqlite
            - name: EVALUATION_DB_PATH
              value: /tmp/vllm-sr-dashboard/evaluations.db
            - name: DASHBOARD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: semantic-router-dashboard-e2e-dashboard
                  key: jwt-secret
          ports:
            - name: http
              containerPort: 8700
            - name: https-issuer
              containerPort: 9443
          volumeMounts:
            - name: router-config
              mountPath: /app/config
              readOnly: true
            - name: dashboard-data
              mountPath: /tmp/vllm-sr-dashboard
            # Pin each identity file as a regular bind mount. Kubernetes Secret
            # directory projections use mutable symlink trees, which the
            # Dashboard's fail-closed path walker deliberately rejects.
            - name: dashboard-identity
              mountPath: /run/vllm-sr-dashboard-assertion-signing-key.pem
              subPath: assertion-signing-key.pem
              readOnly: true
            - name: dashboard-identity
              mountPath: /run/vllm-sr-dashboard-issuer-tls.crt
              subPath: tls.crt
              readOnly: true
            - name: dashboard-identity
              mountPath: /run/vllm-sr-dashboard-issuer-tls.key
              subPath: tls.key
              readOnly: true
            - name: dashboard-identity
              mountPath: /run/vllm-sr-dashboard-ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: router-config
          configMap:
            # The profile resolves this placeholder from the installed Router
            # Deployment so Dashboard mounts the same immutable config snapshot.
            name: router-config-resolved-at-setup
        - name: dashboard-data
          persistentVolumeClaim:
            claimName: semantic-router-dashboard-e2e-data
        - name: dashboard-identity
          secret:
            secretName: semantic-router-dashboard-e2e-dashboard
            defaultMode: 0400
