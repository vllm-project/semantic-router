apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-e2e-postgres
  namespace: default
  labels:
    app: dashboard-e2e-postgres
    vllm.ai/e2e-managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-e2e-postgres
  template:
    metadata:
      labels:
        app: dashboard-e2e-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: vsr
        - name: POSTGRES_USER
          value: router
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: semantic-router-dashboard-e2e-store
              key: postgres-password
        readinessProbe:
          exec:
            command: [pg_isready, -U, router, -d, vsr]
          initialDelaySeconds: 2
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-e2e-postgres
  namespace: default
  labels:
    vllm.ai/e2e-managed: "true"
spec:
  selector:
    app: dashboard-e2e-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-e2e-valkey
  namespace: default
  labels:
    app: dashboard-e2e-valkey
    vllm.ai/e2e-managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-e2e-valkey
  template:
    metadata:
      labels:
        app: dashboard-e2e-valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:8-alpine
        imagePullPolicy: IfNotPresent
        args: [valkey-server, --save, "", --appendonly, "no"]
        ports:
        - name: valkey
          containerPort: 6379
        readinessProbe:
          exec:
            command: [valkey-cli, ping]
          initialDelaySeconds: 1
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-e2e-valkey
  namespace: default
  labels:
    vllm.ai/e2e-managed: "true"
spec:
  selector:
    app: dashboard-e2e-valkey
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
