# Semantic Router Configuration for Dashboard E2E Profile
# Minimal canonical config — dashboard tests exercise the dashboard API, not routing logic.
# Must declare routing.modelCards explicitly so Helm does not leave the chart default
# ("replace-with-your-model") and security-policy merges can validate modelRefs.
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      default_model: base-model
      reasoning_families:
        qwen3:
          type: chat_template_kwargs
          parameter: enable_thinking
    models:
      - name: base-model
        reasoning_family: qwen3
        backend_refs:
          - name: local-vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: base-model
        loras:
          - name: general-expert
            description: General-purpose adapter
    signals:
      domains:
        - name: other
          description: General knowledge and miscellaneous topics
    decisions:
      - name: other_decision
        description: Default decision for all requests
        priority: 1
        rules:
          operator: OR
          conditions:
            - type: domain
              name: other
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
      embeddings:
        semantic:
          use_cpu: true
          bert_model_path: models/mom-embedding-light
      modules:
        prompt_guard:
          enabled: false
        classifier:
          domain:
            model_id: models/mom-domain-classifier
            use_modernbert: true
            threshold: 0.6
            use_cpu: true
            category_mapping_path: models/mom-domain-classifier/category_mapping.json
          pii:
            model_id: models/mom-pii-classifier
            use_modernbert: false
            threshold: 0.9
            use_cpu: true
            pii_mapping_path: models/mom-pii-classifier/pii_type_mapping.json
    stores:
      semantic_cache:
        enabled: false
    services:
      response_api:
        enabled: false
      router_replay:
        enabled: false
