apiVersion: v1
kind: ConfigMap
metadata:
  name: looper-fake-backend
  namespace: default
data:
  server.py: |
    import json
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    # ThreadingHTTPServer dispatches each request on its own thread, so the
    # counter needs a lock: the panel calls several models concurrently and an
    # unprotected dict would drop increments exactly when a test needs them.
    DISPATCH_LOCK = threading.Lock()
    DISPATCH_COUNTS = {}

    def record_dispatch(model):
        with DISPATCH_LOCK:
            DISPATCH_COUNTS[model] = DISPATCH_COUNTS.get(model, 0) + 1

    def dispatch_snapshot():
        with DISPATCH_LOCK:
            return dict(DISPATCH_COUNTS)

    def reset_dispatch():
        with DISPATCH_LOCK:
            DISPATCH_COUNTS.clear()

    RESPONSES = {
        "ratings-model-a": ("answer-from-ratings-model-a", 3, 2),
        "ratings-model-b": ("answer-from-ratings-model-b", 7, 4),
        "confidence-model-low": ("private-low-confidence-candidate", 5, 2),
        "confidence-model-high": ("selected-high-confidence-answer", 7, 3),
        "fusion-panel-valid": ("usable-fusion-panel-answer", 11, 3),
        "fusion-fallback-target": ("fusion-quorum-fallback-answer", 13, 5),
        # Succeeds on purpose. The budget gate must refuse this target before it
        # is ever dispatched, so seeing this string proves the gate regressed.
        "fusion-fallback-tiny-window": ("fusion-tiny-window-dispatched", 13, 5),
    }

    FUSION_SYNTHESIZED_ANSWER = "unexpected-fusion-synthesized-answer"
    FUSION_SEPARATE_ANSWER = "fusion-separate-answer"
    FUSION_ONE_CALL_ANSWER = "fusion-one-call-answer"
    FUSION_NONE_ANSWER = "fusion-none-answer"

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            # Test-only introspection. This is the acceptance oracle for whether
            # a model was actually called, which no response body can establish:
            # a regression that invokes the judge and discards its output is
            # invisible from the client side but visible here.
            if self.path == "/test/calls":
                self.send_json(200, {"calls": dispatch_snapshot()})
                return
            self.send_json(404, {"error": {"message": "not found"}})

        def do_POST(self):
            if self.path == "/test/reset":
                reset_dispatch()
                self.send_json(200, {"status": "reset"})
                return
            if self.path != "/v1/chat/completions":
                self.send_json(404, {"error": {"message": "not found"}})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
            except (ValueError, json.JSONDecodeError):
                self.send_json(400, {"error": {"message": "invalid JSON"}})
                return
            if not isinstance(payload, dict) or not isinstance(payload.get("messages"), list):
                self.send_json(400, {"error": {"message": "messages must be a list"}})
                return

            model = payload.get("model")
            # Count the dispatch before any branch can sleep, fail, or return, so
            # a slow or erroring model is still recorded as having been called.
            record_dispatch(model)
            if model == "fusion-panel-empty":
                self.send_json(200, {
                    "id": "chatcmpl-looper-e2e-fusion-panel-empty",
                    "object": "chat.completion",
                    "created": 1,
                    "model": model,
                    "choices": [],
                    "usage": {
                        "prompt_tokens": 13,
                        "completion_tokens": 0,
                        "total_tokens": 13,
                    },
                })
                return
            if model == "fusion-panel-fail":
                self.send_json(502, {"error": {"message": "synthetic panel failure"}})
                return
            if model == "fusion-fallback-broken":
                self.send_json(502, {"error": {"message": "synthetic fallback failure"}})
                return
            if model == "fusion-panel-slow":
                # Outlives the decision's round_timeout_seconds so the panel
                # deadline fires deterministically.
                time.sleep(6)
                self.send_json(200, {
                    "id": "chatcmpl-looper-e2e-fusion-panel-slow",
                    "object": "chat.completion",
                    "created": 1,
                    "model": model,
                    "choices": [{
                        "index": 0,
                        "message": {"role": "assistant", "content": "too late"},
                        "finish_reason": "stop",
                    }],
                    "usage": {"prompt_tokens": 9, "completion_tokens": 2, "total_tokens": 11},
                })
                return
            if model == "fusion-judge":
                messages = payload.get("messages", [])
                prompt = messages[-1].get("content", "") if messages else ""
                content = FUSION_SYNTHESIZED_ANSWER
                if "return only valid JSON" in prompt:
                    content = json.dumps({
                        "consensus": ["unexpected analysis"],
                        "contradictions": [],
                        "partial_coverage": [],
                        "unique_insights": [],
                        "blind_spots": [],
                    })
                elif "Compare the panel responses" in prompt:
                    content = FUSION_ONE_CALL_ANSWER
                elif "Synthesize a final answer directly" in prompt:
                    content = FUSION_NONE_ANSWER
                elif "Structured analysis:" in prompt:
                    content = FUSION_SEPARATE_ANSWER
                self.send_json(200, {
                    "id": "chatcmpl-looper-e2e-fusion-judge",
                    "object": "chat.completion",
                    "created": 1,
                    "model": model,
                    "choices": [{
                        "index": 0,
                        "message": {"role": "assistant", "content": content},
                        "finish_reason": "stop",
                    }],
                    "usage": {
                        "prompt_tokens": 17,
                        "completion_tokens": 5,
                        "total_tokens": 22,
                    },
                })
                return
            if model not in RESPONSES:
                self.send_json(400, {"error": {"message": "unknown model"}})
                return

            content, prompt_tokens, completion_tokens = RESPONSES[model]
            choice = {
                "index": 0,
                "message": {"role": "assistant", "content": content},
                "finish_reason": "stop",
            }
            if model.startswith("confidence-model-"):
                choice["logprobs"] = {"content": [{
                    "token": "answer",
                    "logprob": -2.0 if model.endswith("low") else -0.1,
                    "top_logprobs": [],
                }]}
            self.send_json(200, {
                "id": "chatcmpl-looper-e2e-" + model,
                "object": "chat.completion",
                "created": 1,
                "model": model,
                "choices": [choice],
                "usage": {
                    "prompt_tokens": prompt_tokens,
                    "completion_tokens": completion_tokens,
                    "total_tokens": prompt_tokens + completion_tokens,
                },
            })

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: looper-fake-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: looper-fake-backend
  template:
    metadata:
      labels:
        app: looper-fake-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: looper-fake-backend
---
apiVersion: v1
kind: Service
metadata:
  name: looper-fake-backend
  namespace: default
spec:
  selector:
    app: looper-fake-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
