apiVersion: v1
kind: ConfigMap
metadata:
  name: looper-fake-backend
  namespace: default
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    RESPONSES = {
        "ratings-model-a": ("answer-from-ratings-model-a", 3, 2),
        "ratings-model-b": ("answer-from-ratings-model-b", 7, 4),
    }

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            self.send_json(404, {"error": {"message": "not found"}})

        def do_POST(self):
            if self.path != "/v1/chat/completions":
                self.send_json(404, {"error": {"message": "not found"}})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
            except (ValueError, json.JSONDecodeError):
                self.send_json(400, {"error": {"message": "invalid JSON"}})
                return
            if not isinstance(payload, dict) or not isinstance(payload.get("messages"), list):
                self.send_json(400, {"error": {"message": "messages must be a list"}})
                return

            model = payload.get("model")
            if model not in RESPONSES:
                self.send_json(400, {"error": {"message": "unknown model"}})
                return

            content, prompt_tokens, completion_tokens = RESPONSES[model]
            self.send_json(200, {
                "id": "chatcmpl-looper-e2e-" + model,
                "object": "chat.completion",
                "created": 1,
                "model": model,
                "choices": [{
                    "index": 0,
                    "message": {"role": "assistant", "content": content},
                    "finish_reason": "stop",
                }],
                "usage": {
                    "prompt_tokens": prompt_tokens,
                    "completion_tokens": completion_tokens,
                    "total_tokens": prompt_tokens + completion_tokens,
                },
            })

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: looper-fake-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: looper-fake-backend
  template:
    metadata:
      labels:
        app: looper-fake-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: looper-fake-backend
---
apiVersion: v1
kind: Service
metadata:
  name: looper-fake-backend
  namespace: default
spec:
  selector:
    app: looper-fake-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
