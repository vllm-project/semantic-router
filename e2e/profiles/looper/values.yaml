config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: ratings-model-a
    models:
      - name: ratings-model-a
        provider_model_id: ratings-model-a
        backend_refs:
          - name: looper-fake-backend
            provider: vllm
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: ratings-model-b
        provider_model_id: ratings-model-b
        backend_refs:
          - name: looper-fake-backend
            provider: vllm
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: confidence-model-low
        provider_model_id: confidence-model-low
        backend_refs:
          - name: looper-fake-backend
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: confidence-model-high
        provider_model_id: confidence-model-high
        backend_refs:
          - name: looper-fake-backend
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: fusion-panel-valid
        provider_model_id: fusion-panel-valid
        backend_refs:
          - name: looper-fake-backend
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: fusion-panel-empty
        provider_model_id: fusion-panel-empty
        backend_refs:
          - name: looper-fake-backend
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: fusion-panel-fail
        provider_model_id: fusion-panel-fail
        backend_refs:
          - name: looper-fake-backend
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
      - name: fusion-judge
        provider_model_id: fusion-judge
        backend_refs:
          - name: looper-fake-backend
            endpoint: looper-fake-backend.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: ratings-model-a
      - name: ratings-model-b
      - name: confidence-model-low
      - name: confidence-model-high
      - name: fusion-panel-valid
      - name: fusion-panel-empty
      - name: fusion-panel-fail
      - name: fusion-judge
    signals:
      keywords:
        - name: looper_ratings_probe_keywords
          operator: OR
          keywords:
            - __LOOPER_RATINGS_PROBE__
          case_sensitive: true
        - name: looper_fusion_quorum_probe_keywords
          operator: OR
          keywords:
            - __LOOPER_FUSION_QUORUM_PROBE__
          case_sensitive: true
        - name: looper_confidence_trace_probe_keywords
          operator: OR
          keywords:
            - __LOOPER_CONFIDENCE_TRACE_PROBE__
          case_sensitive: true
        - name: looper_fusion_separate_probe_keywords
          operator: OR
          keywords:
            - __LOOPER_FUSION_SEPARATE_PROBE__
          case_sensitive: true
        - name: looper_fusion_one_call_probe_keywords
          operator: OR
          keywords:
            - __LOOPER_FUSION_ONE_CALL_PROBE__
          case_sensitive: true
        - name: looper_fusion_none_probe_keywords
          operator: OR
          keywords:
            - __LOOPER_FUSION_NONE_PROBE__
          case_sensitive: true
    decisions:
      - name: looper_fusion_separate_decision
        description: Preserve separate Fusion analysis as the compatibility default
        priority: 123
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_fusion_separate_probe_keywords
        modelRefs:
          - model: fusion-panel-valid
            use_reasoning: false
        algorithm:
          type: fusion
          fusion:
            model: fusion-judge
            analysis_models:
              - fusion-panel-valid
            analysis_mode: separate
            include_analysis: false
            include_intermediate_responses: false
      - name: looper_fusion_one_call_decision
        description: Combine Fusion comparison and final synthesis in one judge call
        priority: 122
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_fusion_one_call_probe_keywords
        modelRefs:
          - model: fusion-panel-valid
            use_reasoning: false
        algorithm:
          type: fusion
          fusion:
            model: fusion-judge
            analysis_models:
              - fusion-panel-valid
            analysis_mode: one_call
            include_analysis: false
            include_intermediate_responses: false
      - name: looper_fusion_none_decision
        description: Synthesize directly from the Fusion panel in one judge call
        priority: 121
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_fusion_none_probe_keywords
        modelRefs:
          - model: fusion-panel-valid
            use_reasoning: false
        algorithm:
          type: fusion
          fusion:
            model: fusion-judge
            analysis_models:
              - fusion-panel-valid
            analysis_mode: none
            include_analysis: false
            include_intermediate_responses: false
      - name: looper_ratings_decision
        description: Deterministic Ratings route for issue 2859 E2E coverage
        priority: 100
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_ratings_probe_keywords
        modelRefs:
          - model: ratings-model-a
            use_reasoning: false
          - model: ratings-model-b
            use_reasoning: false
        algorithm:
          type: ratings
          ratings:
            max_concurrent: 2
            on_error: skip
      - name: looper_confidence_trace_decision
        description: Deterministic Confidence attempt telemetry for issue 2855
        priority: 120
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_confidence_trace_probe_keywords
        modelRefs:
          - model: confidence-model-low
            use_reasoning: false
            max_completion_tokens: 256
          - model: confidence-model-high
            use_reasoning: false
            max_completion_tokens: 1024
        algorithm:
          type: confidence
          confidence:
            confidence_method: avg_logprob
            threshold: 0.72
            escalation_order: declared
            on_error: fail
      - name: looper_fusion_quorum_decision
        description: Reject Fusion synthesis when usable panel responses do not meet quorum
        priority: 110
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_fusion_quorum_probe_keywords
        modelRefs:
          - model: fusion-panel-valid
            use_reasoning: false
          - model: fusion-panel-empty
            use_reasoning: false
          - model: fusion-panel-fail
            use_reasoning: false
        algorithm:
          type: fusion
          fusion:
            model: fusion-judge
            analysis_models:
              - fusion-panel-valid
              - fusion-panel-empty
              - fusion-panel-fail
            max_concurrent: 3
            min_successful_responses: 2
            on_error: skip
      - name: default-route
        description: Fallback for unmatched profile traffic
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: ratings-model-a
            use_reasoning: false
  global:
    router:
      strategy: priority
    services:
      response_api:
        enabled: false
      router_replay:
        enabled: true
        store_backend: memory
        async_writes: false
    stores:
      response_cache:
        enabled: false
    model_catalog:
      kbs: []
      embeddings:
        semantic:
          qwen3_model_path: ""
          gemma_model_path: ""
          mmbert_model_path: ""
          multimodal_model_path: ""
          bert_model_path: ""
          use_cpu: true
      modules:
        prompt_guard:
          enabled: false
          model_ref: ""
          model_id: ""
          jailbreak_mapping_path: ""
        classifier:
          domain:
            model_ref: ""
            model_id: ""
            category_mapping_path: ""
            use_mmbert_32k: false
          pii:
            model_ref: ""
            model_id: ""
            pii_mapping_path: ""
            use_mmbert_32k: false
        feedback_detector:
          enabled: false
          model_ref: ""
          model_id: ""
          use_mmbert_32k: false
    integrations:
      looper:
        endpoint: http://looper-fake-backend.default.svc.cluster.local:8000/v1/chat/completions

resources:
  limits:
    memory: 1Gi
    cpu: "1"
  requests:
    memory: 256Mi
    cpu: 100m
