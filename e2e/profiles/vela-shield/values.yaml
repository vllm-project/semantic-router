# Selects Vela Shield for the built-in safety module on its default Candle CPU
# provider. No endpoint classifier or mock classification response participates.
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      safety:
        - name: unsafe-content
          threshold: 0.5
    decisions:
      - name: handle-content-risk
        priority: 300
        rules:
          operator: AND
          on_unknown: fail_request
          conditions:
            - type: safety
              name: unsafe-content
        modelRefs:
          - model: general-expert
      - name: default-route
        priority: 1
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
  global:
    model_catalog:
      modules:
        safety:
          safety:
            model_id: models/Vela-1.0-Encoder-307M-Shield
resources:
  requests:
    memory: 2Gi
    cpu: 500m
  limits:
    memory: 6Gi
    cpu: "2"
persistence:
  enabled: false
