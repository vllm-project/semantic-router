replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: openai/mock-model
    models:
      - name: openai/mock-model
        backend_refs:
          - name: provider-mocker
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/safe-model
        backend_refs:
          - name: provider-mocker
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  entrypoints:
    - model_names: [vllm-sr/auto]
      recipe: default
      default: true
    - model_names: [vllm-sr/response-guard]
      recipe: response-guard
  recipes:
    - name: default
      decisions:
        # Only prompts the System One fixture answers as a jailbreak match this
        # decision, and the route action must then send them to the safe
        # destination.
        - name: route_prompt_attack
          description: Route detected prompt attacks to the safe fallback model.
          priority: 120
          rules:
            operator: AND
            conditions:
              - type: jailbreak
                name: prompt_attack
          action:
            type: route
            destination: openai/safe-model
          modelRefs:
            - model: openai/safe-model
              use_reasoning: false
        - name: default_decision
          description: Default catch-all decision for benign requests.
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/mock-model
              use_reasoning: false
      signals:
        jailbreak:
          - name: prompt_attack
            description: Prompt injection or jailbreak, answered by the System One fixture
            predicate:
              gte: 0.5
    # From the former response-jailbreak profile, behind its own entrypoint
    # so its keyword decisions never compete with the route-action ones.
    - name: response-guard
      # Both response_guard decisions are selected by a deterministic
      # keyword signal, so the E2E exercises the same harness path a real
      # request takes (auto model -> signal -> decision -> plugin) rather than
      # a passthrough to a concrete backend model, which skips plugins
      # entirely (see performDecisionEvaluation).
      #
      # There is deliberately no request-stage jailbreak rule here: nothing on
      # the request path asks about the probe prompt, so it reaches the backend
      # and comes back as LLM output - which is the surface under test. The one
      # jailbreak rule below has stage: response, so it is asked about that
      # output only.
      decisions:
        - name: response_jailbreak_block
          description: Blocks the response when the guardrail flags LLM output
          priority: 200
          rules:
            operator: OR
            conditions:
              - type: keyword
                name: response_block_probe
          modelRefs:
            - model: openai/mock-model
              use_reasoning: false
          plugins:
            - type: response_guard
              configuration:
                rules:
                  - when:
                      type: jailbreak
                      name: unsafe_completion
                    action: block
                on_unknown: block
        - name: response_jailbreak_warn
          description: Warns via x-vsr-warnings when the guardrail flags LLM output
          priority: 200
          rules:
            operator: OR
            conditions:
              - type: keyword
                name: response_warn_probe
          modelRefs:
            - model: openai/mock-model
              use_reasoning: false
          plugins:
            - type: response_guard
              configuration:
                rules:
                  - when:
                      type: jailbreak
                      name: unsafe_completion
                    action: annotate
                on_unknown: annotate
        - name: default_decision
          description: Catch-all decision with response jailbreak detection disabled
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/mock-model
              use_reasoning: false
      signals:
        keywords:
          - name: response_block_probe
            operator: OR
            keywords:
              - __response_block_probe__
          - name: response_warn_probe
            operator: OR
            keywords:
              - __response_warn_probe__
        # Scored from the model's output, not the request. The block and warn
        # decisions above act on this observation through their
        # response_guard rules; the threshold that decides lives here.
        jailbreak:
          - name: unsafe_completion
            description: Detect jailbreak content in the model's own output.
            predicate:
              gte: 0.5
            stage: response
  global:
    router:
      strategy: priority
    services:
      api:
        batch_classification:
          max_batch_size: 100
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    integrations: {}
    model_catalog:
      deployments:
        # provider-mocker's System One fixture (see its README).
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          schema: vllm-sr/4.0
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
      bindings:
        jailbreak: fake-systemone

resources:
  # Sized like the jailbreak-onerror profile: the local embedding model load
  # at startup needs the headroom.
  limits:
    cpu: '2'
    memory: 6Gi
  requests:
    cpu: 500m
    memory: 2Gi

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false
