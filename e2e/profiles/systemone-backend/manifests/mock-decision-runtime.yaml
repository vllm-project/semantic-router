apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-decision-runtime
  namespace: default
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    LABELS = ["safe", "risky"]

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            self.send_json(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/v1/systemone":
                self.send_json(404, {"error": "not found"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                request = json.loads(self.rfile.read(length))
                state = request["state"]
                model = request["model"]
                questions = request["questions"]
            except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                self.send_json(400, {"error": "invalid request"})
                return
            # Reject anything the published contract would reject, so a router
            # that stops sending a valid SystemOne request fails the case
            # instead of being answered anyway.
            if not isinstance(model, str) or not model.strip():
                self.send_json(422, {"error": "model is required"})
                return
            if len(questions) != 1:
                self.send_json(422, {"error": "exactly one question is expected"})
                return
            question_id, question = next(iter(questions.items()))
            if question.get("type") != "choice":
                self.send_json(422, {"error": "choice question expected"})
                return
            if not str(question.get("instructions") or "").strip():
                self.send_json(422, {"error": "instructions are required"})
                return
            criteria = question.get("criteria") or {}
            if sorted(criteria) != sorted(LABELS):
                self.send_json(422, {"error": "criteria must be the declared labels"})
                return
            risky = "__SYSTEMONE_BACKEND_RISKY__" in str(state)
            probabilities = {
                "risky": 0.97 if risky else 0.03,
                "safe": 0.03 if risky else 0.97,
            }
            self.send_json(200, {
                "model": model,
                "usage": {"input_tokens": len(str(state).split()), "output_tokens": 0},
                "answers": {
                    question_id: {
                        "type": "choice",
                        "choice": "risky" if risky else "safe",
                        "confidence": 0.97,
                        "probabilities": probabilities,
                    }
                },
            })

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-decision-runtime
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-decision-runtime
  template:
    metadata:
      labels:
        app: mock-decision-runtime
    spec:
      containers:
        - name: mock-decision-runtime
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: mock-decision-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: mock-decision-runtime
  namespace: default
spec:
  selector:
    app: mock-decision-runtime
  ports:
    - name: http
      port: 8000
      targetPort: http
