config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared AIGatewayRoute
      # in deploy/kubernetes/ai-gateway/aigw-resources/ matches x-ai-eg-model
      # exactly against six names (math-, science-, social-, humanities-, law-
      # and general-expert). A model outside that list has no route, so every
      # request 404s at the gateway while the router itself stays healthy.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      # No backend: the verdict must come from local prototype scoring of the
      # hard/easy candidate banks, the path complexity-remote-backend cannot
      # reach. Embeddings use the canonical default (Vela-1.0-Encoder-307M).
      complexity:
        - name: task_difficulty
          description: Separates demanding reasoning requests from simple lookup or copy requests.
          threshold: 0.05
          hard:
            candidates:
              - Prove that this recursive algorithm always terminates and derive its worst-case time complexity.
              - Two conflicting research studies disagree, so reconcile their evidence and defend a conclusion despite the uncertainty.
              - Design a schedule that satisfies many interacting constraints and justify why every alternative fails.
              - Analyze the trade-offs of several competing architectures and argue rigorously for the best one.
          easy:
            candidates:
              - What day is the meeting mentioned in the text above?
              - Copy the following items into a comma-separated list.
              - Fix the typo in this one sentence and leave everything else unchanged.
              - Repeat the phone number that appears in the message.
    decisions:
      - name: complexity_hard_routing
        description: Route requests the complexity signal rates hard.
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: complexity
              name: task_difficulty:hard
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: complexity_easy_routing
        description: Route requests the complexity signal rates easy.
        priority: 90
        rules:
          operator: AND
          conditions:
            - type: complexity
              name: task_difficulty:easy
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route, reached when the request rates medium.
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000

resources:
  # 2Gi OOMKills the router on a CI runner: it restarts, never becomes ready,
  # and the helm wait burns its full 60m timeout. Loading an embedding model
  # needs at least the headroom the other model-backed profiles settled on.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
