config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared AIGatewayRoute
      # in deploy/kubernetes/ai-gateway/aigw-resources/ matches x-ai-eg-model
      # exactly against six names (math-, science-, social-, humanities-, law-
      # and general-expert). A model outside that list has no route, so every
      # request 404s at the gateway while the router itself stays healthy.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      # The System One fixture answers the complexity preset; each decision
      # reads the label it chose.
      complexity:
        - name: task_difficulty
          description: Separates demanding reasoning requests from simple lookup or copy requests.
    decisions:
      - name: complexity_hard_routing
        description: Route requests the complexity signal rates hard.
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: complexity
              name: task_difficulty
              label: hard
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: complexity_easy_routing
        description: Route requests the complexity signal rates easy.
        priority: 90
        rules:
          operator: AND
          conditions:
            - type: complexity
              name: task_difficulty
              label: easy
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route, reached when the request rates medium.
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      deployments:
        # provider-mocker's System One fixture answers the complexity rule,
        # so each case's label is pinned by its __SYSTEMONE_CHOICE__ marker
        # (tools/test/services/provider-mocker/README.md).
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
      bindings:
        complexity: fake-systemone
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000

resources:
  # 2Gi OOMKills the router on a CI runner: it restarts, never becomes ready,
  # and the helm wait burns its full 60m timeout. Loading an embedding model
  # needs at least the headroom the other model-backed profiles settled on.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
