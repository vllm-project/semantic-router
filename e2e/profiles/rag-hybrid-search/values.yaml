config:
  version: v0.4
  listeners: []
  models:
  - name: base-model
    card:
      reasoning:
        type: chat_template_kwargs
        efforts: []
      loras:
      - general-expert
    connections:
    - provider: vllm
      endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      model: base-model
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  recipes:
  - name: default
    description: Default routing recipe.
    document:
      signals:
        domains:
        - name: other
          description: General knowledge and miscellaneous topics
      decisions:
      - name: other_decision
        description: General knowledge and miscellaneous topics
        priority: 1
        rules:
          operator: OR
          conditions:
          - type: domain
            name: other
  entrypoints:
  - name: vllm-sr/auto
    aliases:
    - auto
    recipe: default
    assignments:
      other_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
  global:
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router: {}
    stores:
      vector_store:
        enabled: true
        backend_type: llama_stack
        file_storage_dir: /tmp/vsr-data
        max_file_size_mb: 50
        embedding_model: mmbert
        embedding_dimension: 384
        ingestion_workers: 2
        ingestion_drain_timeout_seconds: 30
        supported_formats:
        - .txt
        - .md
        llama_stack:
          endpoint: http://llama-stack.llama-stack-system.svc.cluster.local:8321
          embedding_model: sentence-transformers/all-MiniLM-L6-v2
          request_timeout_seconds: 120
          search_type: hybrid
      response_cache:
        enabled: false
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
    integrations: {}
    services:
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
