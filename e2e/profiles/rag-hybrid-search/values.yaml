config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: general-expert
    models:
      - name: base-model
        reasoning:
          family: qwen3
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
        loras:
          - name: general-expert
            description: General-purpose adapter
  recipes:
    - name: default
      decisions:
        - name: other_decision
          description: General knowledge and miscellaneous topics
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: base-model
              lora_name: general-expert
              use_reasoning: false
  global:
    model_catalog:
      deployments:
        # Llama Stack embeds search queries itself, so the Router embeds the
        # chunks it inserts with the same model, served by Llama Stack.
        llama-stack-embedding:
          provider: openai_embeddings
          endpoint: http://llama-stack.llama-stack-system.svc.cluster.local:8321/v1
          model: sentence-transformers/all-MiniLM-L6-v2
          # The first request loads the model.
          timeout_ms: 120000
          capabilities:
            dimensions: 384
    router:
      strategy: priority
    services: {}
    stores:
      vector_store:
        enabled: true
        backend_type: llama_stack
        file_storage_dir: /tmp/vsr-data
        max_file_size_mb: 50
        embedding:
          deployment: llama-stack-embedding
          dimension: 384
        ingestion_workers: 2
        ingestion_drain_timeout_seconds: 25
        supported_formats:
          - .txt
          - .md
        llama_stack:
          endpoint: http://llama-stack.llama-stack-system.svc.cluster.local:8321
          embedding_model: sentence-transformers/all-MiniLM-L6-v2
          request_timeout_seconds: 120
          search_type: hybrid
    integrations: {}
