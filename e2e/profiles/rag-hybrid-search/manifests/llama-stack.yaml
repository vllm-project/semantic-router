---
# Llama Stack Namespace (must be created before Deployment and Service)
apiVersion: v1
kind: Namespace
metadata:
  name: llama-stack-system
---
# Llama Stack Deployment for E2E testing, from the starter distribution of
# OGX (the project Llama Stack became). It serves the vector store backend
# through its OpenAI-compatible REST API, and all-MiniLM-L6-v2 through
# /v1/embeddings so the Router embeds chunks with the model Llama Stack embeds
# queries with. The sqlite-vec vector_io provider supports hybrid search
# (vector + keyword search with RRF ranking).
#
# The startup script copies the distribution's config with all-MiniLM-L6-v2
# registered and sqlite-vec as the default vector_io provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-stack
  namespace: llama-stack-system
  labels:
    app: llama-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-stack
  template:
    metadata:
      labels:
        app: llama-stack
    spec:
      containers:
        - name: llama-stack
          image: ogxai/distribution-starter:1.5.0
          command: ["sh", "-c"]
          args:
            - |
              python3 - <<'EOF'
              import pathlib
              import yaml
              import ogx
              src = pathlib.Path(ogx.__file__).parent / "distributions/starter/config.yaml"
              cfg = yaml.safe_load(src.read_text())
              cfg["registered_resources"]["models"].append({
                  "model_id": "all-MiniLM-L6-v2",
                  "provider_id": "sentence-transformers",
                  "provider_model_id": "sentence-transformers/all-MiniLM-L6-v2",
                  "model_type": "embedding",
                  "metadata": {"embedding_dimension": 384},
              })
              cfg["vector_stores"]["default_provider_id"] = "sqlite-vec"
              pathlib.Path("/tmp/config.yaml").write_text(yaml.safe_dump(cfg, sort_keys=False))
              EOF
              exec /usr/local/bin/ogx-entrypoint.sh
          env:
            - name: RUN_CONFIG_PATH
              value: /tmp/config.yaml
            # torch starts a thread per node CPU, which the CPU limit throttles.
            - name: OMP_NUM_THREADS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
          ports:
            - containerPort: 8321
              name: http
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8321
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8321
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-stack
  namespace: llama-stack-system
  labels:
    app: llama-stack
spec:
  type: ClusterIP
  selector:
    app: llama-stack
  ports:
    - port: 8321
      targetPort: 8321
      protocol: TCP
      name: http
