replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: provider-mocker
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  routing:
    decisions:
      # Fact-checkable questions route here and, because the response carries
      # tool context, trigger the endpoint hallucination detector.
      - name: fact_check_decision
        description: Verify factual answers and run endpoint hallucination detection
        priority: 100
        rules:
          operator: OR
          conditions:
            - type: fact_check
              name: needs_fact_check
        modelRefs:
          - model: openai/gpt-oss-20b
            use_reasoning: false
        plugins:
          - type: response_guard
            configuration:
              rules:
                - when:
                    operator: AND
                    conditions:
                      - type: fact_check
                        name: needs_fact_check
                      - type: hallucination
                        name: ungrounded_claims
                  action: annotate
              on_unknown: annotate
      - name: default_decision
        description: Default catch-all decision
        priority: 1
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: openai/gpt-oss-20b
            use_reasoning: false
    signals:
      fact_check:
        - name: needs_fact_check
          description: Query contains factual claims that should be verified against context
        - name: no_fact_check_needed
          description: Query is creative, code, or opinion based - no fact verification needed
      # Checked from the model's answer against the tool context the request
      # carried. The response_guard above annotates the answer on it.
      hallucination:
        - name: ungrounded_claims
          description: Detect claims in the answer that the tool context does not support.
    modelCards:
      - name: openai/gpt-oss-20b
  global:
    router:
      strategy: priority
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    stores:
      response_cache:
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations: {}
    model_catalog:
      kbs: []
      # Pluggable endpoint backend under test: the detector is served by an
      # OpenAI-compatible endpoint (mock stands in for a vLLM-hosted
      # KRLabsOrg/lettucedect-v2-qwen-2b) instead of an in-process model.
      deployments:
        hallucination-detector:
          provider: openai_chat
          endpoint: http://mock-hallucination-detector.default.svc.cluster.local:8000/v1
          model: KRLabsOrg/lettucedect-v2-qwen-2b
          timeout_ms: 10000
      bindings:
        hallucination: hallucination-detector
      modules:
        prompt_guard:
          enabled: false
          jailbreak_mapping_path: ""
        classifier:
          domain:
            enabled: false
            category_mapping_path: ""
          pii:
            enabled: false
            pii_mapping_path: ""
        hallucination_mitigation:
          enabled: true
          # The decision model (vela3-fast) answers fact_check, which gates
          # detection.
          fact_check:
            threshold: 0.9997
            use_cpu: true
          detector:
            include_explanation: false
# The detector is remote, but the router still loads two local models before it
# serves: the startup embedding download, gated only on
# !EmbeddingModels.UsesRemoteEmbeddingBackend() and the model_catalog.embeddings
# *_model_path values (pkg/modeldownload/feature_gates.go), and the fact-check
# model (vela3-fast by default, about 7 GB once loaded) that gates when
# detection runs. 2Gi held while this profile was selection: manual and never
# ran in CI; on the PR lane the pod is OOMKilled during fact-check
# initialization before the startup probe passes. 8Gi leaves vela3-fast little
# room beside the embedding process (the Router restarted once while loading in
# CI), so this profile gets the 12Gi limit the default model needs.
resources:
  limits:
    cpu: '2'
    memory: 12Gi
  requests:
    cpu: 500m
    memory: 2Gi

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false
