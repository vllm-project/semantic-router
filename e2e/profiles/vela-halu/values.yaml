# Uses the canonical pinned Halu default and its declared Candle CPU provider.
# No endpoint detector or mock classification response participates in this test.
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    decisions:
      - name: grounded-answer
        priority: 100
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
        plugins:
          - type: hallucination
            configuration:
              enabled: true
              use_nli: false
              hallucination_action: header
              include_hallucination_details: true
  global:
    model_catalog:
      modules:
        hallucination_mitigation:
          enabled: true
          # The probe supplies whether fact checking is needed. It exercises
          # the actual detector without adding another classifier's verdict.
          fact_check:
            model_ref: ""
            model_id: ""
          explainer:
            model_ref: ""
            model_id: ""
resources:
  requests:
    memory: 2Gi
    cpu: 500m
  limits:
    memory: 6Gi
    cpu: "2"
persistence:
  enabled: false
