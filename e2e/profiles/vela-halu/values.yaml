# Pins Vela 1.0 Halu, which the Router serves through its managed model runtime
# on CPU. The canonical default detector is now vela3-fast, which holds about
# 7 GB and does not fit this profile's 6Gi limit; the contract this profile
# checks (pair input, 8192-token task limit) is Vela 1.0 Halu's. No endpoint
# detector or mock classification response participates in this test.
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    decisions:
      - name: grounded-answer
        priority: 100
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
        plugins:
          - type: hallucination
            configuration:
              enabled: true
              hallucination_action: header
              include_hallucination_details: true
  global:
    model_catalog:
      deployments:
        vela-halu:
          provider: model_runtime
          artifact: vllm-sr/Vela-1.0-Encoder-307M-Halu
          revision: ca87531211e414ac21c641b2faa8b8e21619de8f
          device: cpu
      bindings:
        hallucination: vela-halu
      modules:
        hallucination_mitigation:
          enabled: true
          # The probe supplies whether fact checking is needed. It exercises
          # the actual detector without adding another classifier's verdict.
          fact_check:
            enabled: false
resources:
  requests:
    memory: 2Gi
    cpu: 500m
  limits:
    memory: 6Gi
    cpu: "2"
persistence:
  enabled: false
