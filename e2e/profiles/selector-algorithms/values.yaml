replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  tag: latest
  pullPolicy: Never
configOverride:
  version: v0.3
  listeners: []
  providers:
    defaults:
      default_model: static-first
    models:
      - name: static-first
        backend_refs:
          - name: selector-mock-vllm
            endpoint: selector-mock-vllm.default.svc.cluster.local:8000
            weight: 1
      - name: static-second
        backend_refs:
          - name: selector-mock-vllm
            endpoint: selector-mock-vllm.default.svc.cluster.local:8000
            weight: 1
  routing:
    decisions:
      - name: selector_static
        description: Deterministic static-selector contract
        priority: 100
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: selector_static_marker
        algorithm:
          type: static
        modelRefs:
          - model: static-first
            use_reasoning: false
          - model: static-second
            use_reasoning: false
      - name: default_decision
        description: Catch-all route outside selector contract requests
        priority: 1
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: static-first
            use_reasoning: false
    signals:
      keywords:
        - name: selector_static_marker
          operator: OR
          keywords: [selector-static-contract]
          case_sensitive: true
    modelCards:
      - name: static-first
      - name: static-second
  global:
    router:
      strategy: priority
    services:
      response_api:
        enabled: false
      router_replay:
        enabled: false
    stores:
      response_cache:
        enabled: false
    model_catalog:
      kbs: []
      embeddings:
        semantic:
          qwen3_model_path: ""
          gemma_model_path: ""
          mmbert_model_path: ""
          multimodal_model_path: ""
          bert_model_path: ""
          use_cpu: true
      modules:
        prompt_guard:
          enabled: false
          model_ref: ""
          model_id: ""
          jailbreak_mapping_path: ""
        classifier:
          domain:
            model_ref: ""
            model_id: ""
            category_mapping_path: ""
            use_mmbert_32k: false
          pii:
            model_ref: ""
            model_id: ""
            pii_mapping_path: ""
            use_mmbert_32k: false
        feedback_detector:
          enabled: false
          model_ref: ""
          model_id: ""
          use_mmbert_32k: false

resources:
  limits:
    memory: 2Gi
    cpu: "2"
  requests:
    memory: 512Mi
    cpu: 250m

persistence:
  enabled: false
