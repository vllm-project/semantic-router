apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-sequence-classifier
  namespace: default
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    EXPECTED_AUTH = "Bearer e2e-classifier-key"
    TOXIC_MARKER = "__SEQUENCE_CLASSIFIER_TOXIC__"

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            self.send_json(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/classify":
                self.send_json(404, {"error": "not found"})
                return
            if self.headers.get("Authorization") != EXPECTED_AUTH:
                self.send_json(401, {"error": "invalid bearer token"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
                text = payload["inputs"]
            except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                self.send_json(400, {"error": "invalid request"})
                return

            toxic = TOXIC_MARKER in str(text)
            self.send_json(
                200,
                [
                    {"label": "toxic", "score": 0.95 if toxic else 0.05},
                    {"label": "benign", "score": 0.05 if toxic else 0.95},
                ],
            )

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-sequence-classifier
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-sequence-classifier
  template:
    metadata:
      labels:
        app: mock-sequence-classifier
    spec:
      containers:
        - name: mock-sequence-classifier
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: mock-sequence-classifier
---
apiVersion: v1
kind: Service
metadata:
  name: mock-sequence-classifier
  namespace: default
spec:
  selector:
    app: mock-sequence-classifier
  ports:
    - name: http
      port: 8000
      targetPort: http
