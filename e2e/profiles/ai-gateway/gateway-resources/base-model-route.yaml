# The shared example routes LoRA names. The fallback contract also selects the
# base provider directly, so its selected wire model needs an explicit route.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: semantic-router-base-model
  namespace: default
spec:
  parentRefs:
    - name: semantic-router
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: base-model
      backendRefs:
        - name: vllm-llama3-8b-instruct
      timeouts:
        request: 60s
        backendRequest: 60s
