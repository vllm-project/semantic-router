apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: semantic-router-timeout-route
  namespace: default
spec:
  parentRefs:
    - name: semantic-router
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: timeout-probe-fast
      backendRefs:
        - name: vllm-llama3-8b-instruct
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: timeout-probe-slow
      backendRefs:
        - name: vllm-llama3-8b-instruct
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: timeout-unreachable-backend
      backendRefs:
        - name: timeout-unreachable-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: semantic-router-timeout-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: semantic-router
  timeout:
    tcp:
      connectTimeout: 1s

