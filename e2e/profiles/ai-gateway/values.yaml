config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      default_model: general-expert
      reasoning_families:
        deepseek:
          type: chat_template_kwargs
          parameter: thinking
        qwen3:
          type: chat_template_kwargs
          parameter: enable_thinking
        gpt-oss:
          type: reasoning_effort
          parameter: reasoning_effort
        gpt:
          type: reasoning_effort
          parameter: reasoning_effort
      default_reasoning_effort: high
    models:
      - name: base-model
        reasoning_family: qwen3
        pricing:
          currency: USD
          prompt_per_1m: 0.10
          completion_per_1m: 0.30
        backend_refs:
          - name: local-vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    projections:
      scores:
        - name: e2e_contract_score
          method: weighted_sum
          inputs:
            - type: keyword
              name: retention_probe_keywords
              weight: 1
              value_source: binary
    decisions:
      - name: llm_classifier_toxic
        description: Route on the complete score distribution returned by the LLM classifier
        priority: 2100
        rules:
          operator: AND
          conditions:
            - type: classifier
              name: llm_toxicity
              label: toxic
              predicate:
                gte: 0.8
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
      - name: sequence_classifier_toxic
        description: Route on a score returned by the remote sequence-classifier E2E provider
        priority: 2000
        rules:
          operator: AND
          conditions:
            - type: classifier
              name: remote_toxicity
              label: toxic
              predicate:
                gte: 0.8
        modelRefs:
          - model: base-model
            lora_name: general-expert
      - name: block_jailbreak
        description: Block jailbreak attempts
        priority: 1000
        rules:
          operator: OR
          conditions:
            - type: jailbreak
              name: jailbreak_standard
        plugins:
          - type: fast_response
            configuration:
              message: I'm sorry, but I cannot process this request as it appears to violate our usage policies.
      - name: block_pii
        description: Block requests containing PII
        priority: 999
        rules:
          operator: OR
          conditions:
            - type: pii
              name: pii_deny_all
        plugins:
          - type: fast_response
            configuration:
              message: Your request contains personal information. Please remove any sensitive data and try again.
      - name: retention_probe_decision
        description: Deterministic keyword-gated route used by the retention-directive E2E to assert x-vsr-retention-* response headers (issue #2009).
        priority: 600
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: retention_probe_keywords
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        emits:
          - kind: retention
            retention:
              ttl_turns: 0
              keep_current_model: true
              prefer_prefix_retention: true
      - name: looper_metrics_probe_decision
        description: "Deterministic keyword-gated looper route used by the looper-latency-token-headers E2E to assert x-vsr-looper-latency-ms and x-vsr-looper-*-tokens response headers (issue #2694)."
        priority: 610
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: looper_metrics_probe_keywords
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
          - model: base-model
            lora_name: math-expert
            use_reasoning: false
        algorithm:
          type: confidence
          confidence:
            confidence_method: hybrid
            threshold: 0.72
            on_error: skip
            escalation_order: small_to_large
      - name: tool_selection_add_weather_decision
        description: Contract route for tool_selection add mode (weather-aligned retrieval)
        priority: 500
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: tool_selection_add_weather
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: tools
            configuration:
              enabled: true
              mode: passthrough
              semantic_selection: false
          - type: tool_selection
            configuration:
              enabled: true
              mode: add
              top_k: 3
              similarity_threshold: 0.01
              strategy: default
      - name: tool_selection_add_calc_decision
        description: Contract route for tool_selection add mode (math-aligned retrieval)
        priority: 500
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: tool_selection_add_calc
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: tools
            configuration:
              enabled: true
              mode: passthrough
              semantic_selection: false
          - type: tool_selection
            configuration:
              enabled: true
              mode: add
              top_k: 3
              similarity_threshold: 0.01
              strategy: default
      - name: tool_selection_filter_decision
        description: Contract route for tool_selection filter mode
        priority: 500
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: tool_selection_filter
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: tools
            configuration:
              enabled: true
              mode: passthrough
              semantic_selection: false
          - type: tool_selection
            configuration:
              enabled: true
              mode: filter
              relevance_threshold: 0.22
              preserve_count: 2
      - name: tool_selection_filter_threshold_decision
        description: Contract route for tool_selection filter mode with strict relevance threshold
        priority: 500
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: tool_selection_filter_threshold
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: tools
            configuration:
              enabled: true
              mode: passthrough
              semantic_selection: false
          - type: tool_selection
            configuration:
              enabled: true
              mode: filter
              relevance_threshold: 0.95
              preserve_count: 1
      - name: tool_selection_add_topk_one_decision
        description: Contract route for tool_selection add mode with alternate top_k
        priority: 500
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: tool_selection_add_topk_one
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: tools
            configuration:
              enabled: true
              mode: passthrough
              semantic_selection: false
          - type: tool_selection
            configuration:
              enabled: true
              mode: add
              top_k: 1
              similarity_threshold: 0.01
              strategy: default
      - name: tool_selection_with_system_prompt_decision
        description: Contract route for tool_selection stacked with system_prompt plugin
        priority: 500
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: tool_selection_with_system_prompt
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: tools
            configuration:
              enabled: true
              mode: passthrough
              semantic_selection: false
          - type: tool_selection
            configuration:
              enabled: true
              mode: add
              top_k: 2
              similarity_threshold: 0.01
              strategy: default
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: "Contract route: system_prompt + tool_selection (non-PII path)."
              mode: append
      - name: business_decision
        description: Business and management related queries
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: business
        modelRefs:
          - model: base-model
            lora_name: social-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a senior business consultant and strategic advisor with expertise in corporate strategy, operations management, financial analysis, marketing, and organizational development. Provide practical, actionable business advice backed by proven methodologies and industry best practices. Consider market dynamics, competitive landscape, and stakeholder interests in your recommendations.
              mode: replace
      - name: law_decision
        description: Legal questions and law-related topics
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: law
        modelRefs:
          - model: base-model
            lora_name: law-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a knowledgeable legal expert with comprehensive understanding of legal principles, case law, statutory interpretation, and legal procedures across multiple jurisdictions. Provide accurate legal information and analysis while clearly stating that your responses are for informational purposes only and do not constitute legal advice. Always recommend consulting with qualified legal professionals for specific legal matters.
              mode: replace
      - name: psychology_decision
        description: Psychology and mental health topics
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: psychology
        modelRefs:
          - model: base-model
            lora_name: humanities-expert
            use_reasoning: false
        plugins:
          - type: response_cache
            configuration:
              enabled: true
              scope: global
              similarity_threshold: 0.8
      - name: biology_decision
        description: Biology and life sciences questions
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: biology
        modelRefs:
          - model: base-model
            lora_name: science-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a biology expert with comprehensive knowledge spanning molecular biology, genetics, cell biology, ecology, evolution, anatomy, physiology, and biotechnology. Explain biological concepts with scientific accuracy, use appropriate terminology, and provide examples from current research. Connect biological principles to real-world applications and emphasize the interconnectedness of biological systems.
              mode: replace
      - name: chemistry_decision
        description: Chemistry and chemical sciences questions
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: chemistry
        modelRefs:
          - model: base-model
            lora_name: science-expert
            use_reasoning: true
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a chemistry expert specializing in chemical reactions, molecular structures, and laboratory techniques. Provide detailed, step-by-step explanations.
              mode: replace
      - name: history_decision
        description: Historical questions and cultural topics
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: history
        modelRefs:
          - model: base-model
            lora_name: humanities-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a historian with expertise across different time periods and cultures. Provide accurate historical context and analysis.
              mode: replace
      - name: health_decision
        description: Health and medical information queries
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: health
        modelRefs:
          - model: base-model
            lora_name: science-expert
            use_reasoning: false
        plugins:
          - type: response_cache
            configuration:
              enabled: true
              scope: global
              similarity_threshold: 0.8
      - name: economics_decision
        description: Economics and financial topics
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: economics
        modelRefs:
          - model: base-model
            lora_name: social-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are an economics expert with deep understanding of microeconomics, macroeconomics, econometrics, financial markets, monetary policy, fiscal policy, international trade, and economic theory. Analyze economic phenomena using established economic principles, provide data-driven insights, and explain complex economic concepts in accessible terms. Consider both theoretical frameworks and real-world applications in your responses.
              mode: replace
      - name: math_decision
        description: Mathematics and quantitative reasoning
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: math
        modelRefs:
          - model: base-model
            lora_name: math-expert
            use_reasoning: true
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a mathematics expert. Provide step-by-step solutions, show your work clearly, and explain mathematical concepts in an understandable way.
              mode: replace
      - name: physics_decision
        description: Physics and physical sciences
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: physics
        modelRefs:
          - model: base-model
            lora_name: science-expert
            use_reasoning: true
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a physics expert with deep understanding of physical laws and phenomena. Provide clear explanations with mathematical derivations when appropriate.
              mode: replace
      - name: computer_science_decision
        description: Computer science and programming
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: computer science
        modelRefs:
          - model: base-model
            lora_name: science-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a computer science expert with knowledge of algorithms, data structures, programming languages, and software engineering. Provide clear, practical solutions with code examples when helpful.
              mode: replace
      - name: philosophy_decision
        description: Philosophy and ethical questions
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: philosophy
        modelRefs:
          - model: base-model
            lora_name: humanities-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a philosophy expert with comprehensive knowledge of philosophical traditions, ethical theories, logic, metaphysics, epistemology, political philosophy, and the history of philosophical thought. Engage with complex philosophical questions by presenting multiple perspectives, analyzing arguments rigorously, and encouraging critical thinking. Draw connections between philosophical concepts and contemporary issues while maintaining intellectual honesty about the complexity and ongoing nature of philosophical debates.
              mode: replace
      - name: engineering_decision
        description: Engineering and technical problem-solving
        priority: 10
        rules:
          operator: OR
          conditions:
            - type: domain
              name: engineering
        modelRefs:
          - model: base-model
            lora_name: science-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are an engineering expert with knowledge across multiple engineering disciplines including mechanical, electrical, civil, chemical, software, and systems engineering. Apply engineering principles, design methodologies, and problem-solving approaches to provide practical solutions. Consider safety, efficiency, sustainability, and cost-effectiveness in your recommendations. Use technical precision while explaining concepts clearly, and emphasize the importance of proper engineering practices and standards.
              mode: replace
      - name: thinking_decision
        description: Complex reasoning and multi-step thinking
        priority: 20
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: thinking
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: true
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a thinking expert, should think multiple steps before answering. Please answer the question step by step.
              mode: replace
      - name: urgent_request
        description: Urgent requests requiring immediate attention
        priority: 30
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: urgent_keywords
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are handling an urgent request. Prioritize quick and direct responses.
              mode: replace
      - name: sensitive_data
        description: Queries containing sensitive data keywords (SSN and credit card)
        priority: 40
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: sensitive_keywords
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are handling a query with sensitive data. Be cautious and provide security-focused guidance.
              mode: replace
      - name: critical_event
        description: Critical operational events requiring specialized handling
        priority: 35
        rules:
          operator: OR
          conditions:
            - type: event
              name: critical_payment_event
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are handling a critical event alert. Prioritize a fast, precise, and factual response.
              mode: replace
      - name: spanish_language
        description: Spanish-language requests requiring specialized handling
        priority: 25
        rules:
          operator: OR
          conditions:
            - type: language
              name: es
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are responding to a Spanish-language query. Respond in Spanish.
              mode: replace
      - name: other_decision
        description: General knowledge and miscellaneous topics
        priority: 1
        rules:
          operator: OR
          conditions:
            - type: domain
              name: other
        modelRefs:
          - model: base-model
            lora_name: general-expert
            use_reasoning: false
        plugins:
          - type: response_cache
            configuration:
              enabled: true
              scope: global
              similarity_threshold: 0.75
    signals:
      keywords:
        - name: thinking
          operator: OR
          keywords:
            - think
            - careful
          case_sensitive: false
        - name: urgent_keywords
          operator: OR
          keywords:
            - urgent
            - immediate
            - asap
            - emergency
          case_sensitive: false
        - name: sensitive_keywords
          operator: OR
          keywords:
            - SSN
            - credit card
          case_sensitive: false
        - name: tool_selection_add_weather
          operator: OR
          keywords:
            - __TOOL_SELECTION_ADD_WEATHER__
          case_sensitive: false
        - name: tool_selection_add_calc
          operator: OR
          keywords:
            - __TOOL_SELECTION_ADD_CALC__
          case_sensitive: false
        - name: tool_selection_filter
          operator: OR
          keywords:
            - __TOOL_SELECTION_FILTER__
          case_sensitive: false
        - name: tool_selection_filter_threshold
          operator: OR
          keywords:
            - __TOOL_SELECTION_FILTER_THRESHOLD__
          case_sensitive: false
        - name: tool_selection_add_topk_one
          operator: OR
          keywords:
            - __TOOL_SELECTION_ADD_TOPK_ONE__
          case_sensitive: false
        - name: tool_selection_with_system_prompt
          operator: OR
          keywords:
            - __TOOL_SELECTION_WITH_SYSTEM_PROMPT__
          case_sensitive: false
        - name: retention_probe_keywords
          operator: OR
          keywords:
            - __RETENTION_PROBE__
          case_sensitive: false
        - name: looper_metrics_probe_keywords
          operator: OR
          keywords:
            - __MULTI_MODEL_PROBE__
          case_sensitive: false
      events:
        - name: critical_payment_event
          event_types:
            - payment_failed
          severities:
            - critical
          action_codes:
            - TXN_DECLINE
      language:
        - name: es
          description: Spanish-language requests.
      domains:
        - name: business
          description: Business, corporate strategy, management, finance, marketing
        - name: law
          description: Legal principles, case law, statutory interpretation, legal procedures
        - name: psychology
          description: Cognitive processes, behavioral patterns, mental health, developmental psychology
        - name: biology
          description: Molecular biology, genetics, cell biology, ecology, evolution, anatomy
        - name: chemistry
          description: Chemical reactions, molecular structures, laboratory techniques
        - name: history
          description: Historical events, time periods, cultures, civilizations
        - name: health
          description: Anatomy, physiology, diseases, treatments, preventive care, nutrition
        - name: economics
          description: Microeconomics, macroeconomics, financial markets, monetary policy, trade
        - name: math
          description: Mathematics, algebra, calculus, geometry, statistics
        - name: physics
          description: Physical laws, mechanics, thermodynamics, electromagnetism, quantum physics
        - name: computer science
          description: Algorithms, data structures, programming, software engineering
        - name: philosophy
          description: Philosophical traditions, ethics, logic, metaphysics, epistemology
        - name: engineering
          description: Engineering disciplines, design, problem-solving, systems
        - name: other
          description: General knowledge and miscellaneous topics
      jailbreak:
        - name: jailbreak_standard
          threshold: 0.65
          include_history: false
          description: Standard jailbreak detection
      pii:
        - name: pii_deny_all
          threshold: 0.7
          include_history: false
          description: Block all PII
      classifiers:
        - name: llm_toxicity
          description: Deterministic outbound LLM classifier E2E signal
          type: llm
          model: e2e-llm-classifier
          labels: [benign, toxic]
          instructions: Score whether the input contains toxic content.
        - name: remote_toxicity
          description: Deterministic outbound http_classify E2E signal
          type: sequence_classifier
          model: e2e-sequence-classifier
          labels: [benign, toxic]
    modelCards:
      - name: base-model
        loras:
          - name: science-expert
            description: 'Specialized for science domains: biology, chemistry, physics, health, engineering'
          - name: social-expert
            description: 'Optimized for social sciences: business, economics'
          - name: math-expert
            description: Fine-tuned for mathematics and quantitative reasoning
          - name: law-expert
            description: Specialized for legal questions and law-related topics
          - name: humanities-expert
            description: 'Optimized for humanities: psychology, history, philosophy'
          - name: general-expert
            description: General-purpose adapter for diverse topics
      - name: general-expert
  entrypoints:
    - model_names: ["vllm-sr/e2e-recipe-probe"]
      recipe: entrypoint-probe
    - model_names: ["vllm-sr/metadata-policy"]
      recipe: metadata-policy
    - model_names: ["vllm-sr/e2e-default-alias"]
      recipe: default
  recipes:
    - name: entrypoint-probe
      description: "Deterministic keyword-gated recipe used by the entrypoint-recipe-routing E2E (issue #2331)."
      routing:
        strategy: priority
        signals:
          keywords:
            # Intentionally reuses a signal name from the default recipe with
            # a different definition. Recipe-local namespaces must keep the
            # two definitions isolated at validation and request time.
            - name: retention_probe_keywords
              operator: OR
              keywords:
                - __ENTRYPOINT_RECIPE_PROBE__
              case_sensitive: false
        decisions:
          - name: entrypoint_probe_decision
            description: Route entrypoint-probe recipe traffic to the general-expert adapter.
            priority: 100
            rules:
              operator: OR
              conditions:
                - type: keyword
                  name: retention_probe_keywords
            modelRefs:
              - model: base-model
                lora_name: general-expert
                use_reasoning: false
    - name: metadata-policy
      description: Deterministic recipe-local metadata routing probe.
      routing:
        strategy: priority
        signals:
          metadata:
            - name: canary_cohort
              key: cohort
              predicate:
                equals: canary
        decisions:
          - name: metadata_recipe_decision
            description: Route canary metadata inside the selected recipe.
            priority: 100
            rules:
              operator: AND
              conditions:
                - type: metadata
                  name: canary_cohort
            modelRefs:
              - model: base-model
                lora_name: general-expert
                use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
      external:
        - name: e2e-llm-classifier
          llm_provider: openai
          model_role: classification
          llm_endpoint:
            address: mock-sequence-classifier.default.svc.cluster.local
            port: 8000
            protocol: http
          llm_model_name: e2e-llm-classifier
          llm_timeout_seconds: 5
          access_key: e2e-classifier-key
        - name: e2e-sequence-classifier
          model_role: classification
          llm_endpoint:
            address: mock-sequence-classifier.default.svc.cluster.local
            port: 8000
            protocol: http
          llm_timeout_seconds: 5
          access_key: e2e-classifier-key
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
              - 0.001
              - 0.005
              - 0.01
              - 0.025
              - 0.05
              - 0.1
              - 0.25
              - 0.5
              - 1
              - 2.5
              - 5
              - 10
              - 30
            size_buckets:
              - 1
              - 2
              - 5
              - 10
              - 20
              - 50
              - 100
              - 200
      observability:
        tracing:
          enabled: false
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.8
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
        # Exercised by the semantic-cache-polarity case: the NLI tier reuses the
        # default hallucination explainer (models/mom-halugate-explainer).
        polarity_guard:
          mode: lexical+nli
          nli:
            contradiction_threshold: 0.5
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: true
        top_k: 3
        similarity_threshold: 0.2
        tools_db_path: config/tools_db.json
        fallback_to_empty: true
      # The canonical default (localhost:8899) assumes a router-owned listener
      # that this profile's config.listeners: [] does not configure. Point the
      # looper's per-call HTTP client directly at the same base-model backend
      # the router itself routes to, reusing its existing LoRA adapters
      # (issue #2694 e2e coverage) instead of standing up new infra.
      looper:
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1/chat/completions
toolsDb:
  - tool:
      type: function
      function:
        name: get_weather
        description: Get current weather information for a location
        parameters:
          type: object
          properties:
            location:
              type: string
              description: City and region to query
          required:
            - location
    description: Weather forecast and current weather lookup for city-based requests.
    category: weather
    tags:
      - weather
      - forecast
      - temperature
  - tool:
      type: function
      function:
        name: calculate
        description: Perform mathematical calculations
        parameters:
          type: object
          properties:
            expression:
              type: string
              description: Mathematical expression to evaluate
          required:
            - expression
    description: Math computation helper for arithmetic and equation solving.
    category: math
    tags:
      - math
      - calculator
      - arithmetic
  - tool:
      type: function
      function:
        name: search_web
        description: Search web resources for recent information
        parameters:
          type: object
          properties:
            query:
              type: string
              description: Search query text
          required:
            - query
    description: Web search utility for current events and external information retrieval.
    category: search
    tags:
      - search
      - web
      - internet
resources:
  limits:
    cpu: "2"
    memory: "12Gi"
  requests:
    cpu: "1"
    memory: "5Gi"

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false
