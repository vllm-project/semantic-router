config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      reasoning_families:
        base-model:
          type: chat_template_kwargs
          parameter: enable_thinking
        base-model/math-expert:
          type: chat_template_kwargs
          parameter: enable_thinking
    models:
    - name: base-model
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      reasoning_family: base-model
    - name: base-model/math-expert
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      reasoning_family: base-model/math-expert
  routing:
    modelCards:
    - name: base-model
      loras:
      - name: science-expert
      - name: social-expert
      - name: math-expert
      - name: law-expert
      - name: humanities-expert
      - name: general-expert
    - name: base-model/math-expert
      loras:
      - name: math-expert
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals:
        keywords:
        - name: thinking
          operator: OR
          keywords:
          - think
          - careful
          case_sensitive: false
        - name: urgent_keywords
          operator: OR
          keywords:
          - urgent
          - immediate
          - asap
          - emergency
          case_sensitive: false
        - name: sensitive_keywords
          operator: OR
          keywords:
          - SSN
          - credit card
          case_sensitive: false
        - name: tool_selection_add_weather
          operator: OR
          keywords:
          - __TOOL_SELECTION_ADD_WEATHER__
          case_sensitive: false
        - name: tool_selection_add_calc
          operator: OR
          keywords:
          - __TOOL_SELECTION_ADD_CALC__
          case_sensitive: false
        - name: tool_selection_filter
          operator: OR
          keywords:
          - __TOOL_SELECTION_FILTER__
          case_sensitive: false
        - name: tool_selection_filter_threshold
          operator: OR
          keywords:
          - __TOOL_SELECTION_FILTER_THRESHOLD__
          case_sensitive: false
        - name: tool_selection_add_topk_one
          operator: OR
          keywords:
          - __TOOL_SELECTION_ADD_TOPK_ONE__
          case_sensitive: false
        - name: tool_selection_with_system_prompt
          operator: OR
          keywords:
          - __TOOL_SELECTION_WITH_SYSTEM_PROMPT__
          case_sensitive: false
        - name: retention_probe_keywords
          operator: OR
          keywords:
          - __RETENTION_PROBE__
          case_sensitive: false
        - name: looper_metrics_probe_keywords
          operator: OR
          keywords:
          - __MULTI_MODEL_PROBE__
          case_sensitive: false
        domains:
        - name: business
          description: Business, corporate strategy, management, finance, marketing
        - name: law
          description: Legal principles, case law, statutory interpretation, legal
            procedures
        - name: psychology
          description: Cognitive processes, behavioral patterns, mental health, developmental
            psychology
        - name: biology
          description: Molecular biology, genetics, cell biology, ecology, evolution,
            anatomy
        - name: chemistry
          description: Chemical reactions, molecular structures, laboratory techniques
        - name: history
          description: Historical events, time periods, cultures, civilizations
        - name: health
          description: Anatomy, physiology, diseases, treatments, preventive care,
            nutrition
        - name: economics
          description: Microeconomics, macroeconomics, financial markets, monetary
            policy, trade
        - name: math
          description: Mathematics, algebra, calculus, geometry, statistics
        - name: physics
          description: Physical laws, mechanics, thermodynamics, electromagnetism,
            quantum physics
        - name: computer science
          description: Algorithms, data structures, programming, software engineering
        - name: philosophy
          description: Philosophical traditions, ethics, logic, metaphysics, epistemology
        - name: engineering
          description: Engineering disciplines, design, problem-solving, systems
        - name: other
          description: General knowledge and miscellaneous topics
        jailbreak:
        - name: jailbreak_standard
          threshold: 0.65
          include_history: false
          description: Standard jailbreak detection
        pii:
        - name: pii_deny_all
          threshold: 0.5
          include_history: false
          description: Block all PII
      decisions:
      - name: block_jailbreak
        description: Block jailbreak attempts
        priority: 1000
        rules:
          operator: OR
          conditions:
          - type: jailbreak
            name: jailbreak_standard
        plugins:
        - type: fast_response
          configuration:
            message: I'm sorry, but I cannot process this request as it appears to
              violate our usage policies.
      - name: block_pii
        description: Block requests containing PII
        priority: 999
        rules:
          operator: OR
          conditions:
          - type: pii
            name: pii_deny_all
        plugins:
        - type: fast_response
          configuration:
            message: Your request contains personal information. Please remove any
              sensitive data and try again.
      - name: retention_probe_decision
        description: Deterministic keyword-gated route used by the retention-directive
          E2E to assert x-vsr-retention-* response headers (issue
        priority: 600
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: retention_probe_keywords
        emits:
        - kind: retention
          retention:
            ttl_turns: 0
            keep_current_model: true
            prefer_prefix_retention: true
      - name: looper_metrics_probe_decision
        description: 'Deterministic keyword-gated looper route used by the looper-latency-token-headers
          E2E to assert x-vsr-looper-latency-ms and x-vsr-looper-*-tokens response
          headers (issue #2694).'
        priority: 610
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: looper_metrics_probe_keywords
        algorithm:
          type: confidence
          confidence:
            confidence_method: hybrid
            threshold: 0.72
            on_error: skip
            escalation_order: small_to_large
      - name: tool_selection_add_weather_decision
        description: Contract route for tool_selection add mode (weather-aligned retrieval)
        priority: 500
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: tool_selection_add_weather
        plugins:
        - type: tools
          configuration:
            enabled: true
            mode: passthrough
            semantic_selection: false
        - type: tool_selection
          configuration:
            enabled: true
            mode: add
            top_k: 3
            similarity_threshold: 0.01
            strategy: default
      - name: tool_selection_add_calc_decision
        description: Contract route for tool_selection add mode (math-aligned retrieval)
        priority: 500
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: tool_selection_add_calc
        plugins:
        - type: tools
          configuration:
            enabled: true
            mode: passthrough
            semantic_selection: false
        - type: tool_selection
          configuration:
            enabled: true
            mode: add
            top_k: 3
            similarity_threshold: 0.01
            strategy: default
      - name: tool_selection_filter_decision
        description: Contract route for tool_selection filter mode
        priority: 500
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: tool_selection_filter
        plugins:
        - type: tools
          configuration:
            enabled: true
            mode: passthrough
            semantic_selection: false
        - type: tool_selection
          configuration:
            enabled: true
            mode: filter
            relevance_threshold: 0.22
            preserve_count: 2
      - name: tool_selection_filter_threshold_decision
        description: Contract route for tool_selection filter mode with strict relevance
          threshold
        priority: 500
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: tool_selection_filter_threshold
        plugins:
        - type: tools
          configuration:
            enabled: true
            mode: passthrough
            semantic_selection: false
        - type: tool_selection
          configuration:
            enabled: true
            mode: filter
            relevance_threshold: 0.95
            preserve_count: 1
      - name: tool_selection_add_topk_one_decision
        description: Contract route for tool_selection add mode with alternate top_k
        priority: 500
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: tool_selection_add_topk_one
        plugins:
        - type: tools
          configuration:
            enabled: true
            mode: passthrough
            semantic_selection: false
        - type: tool_selection
          configuration:
            enabled: true
            mode: add
            top_k: 1
            similarity_threshold: 0.01
            strategy: default
      - name: tool_selection_with_system_prompt_decision
        description: Contract route for tool_selection stacked with system_prompt
          plugin
        priority: 500
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: tool_selection_with_system_prompt
        plugins:
        - type: tools
          configuration:
            enabled: true
            mode: passthrough
            semantic_selection: false
        - type: tool_selection
          configuration:
            enabled: true
            mode: add
            top_k: 2
            similarity_threshold: 0.01
            strategy: default
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: 'Contract route: system_prompt + tool_selection (non-PII
              path).'
            mode: insert
      - name: business_decision
        description: Business and management related queries
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: business
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a senior business consultant and strategic advisor
              with expertise in corporate strategy, operations management, financial
              analysis, marketing, and organizational development. Provide practical,
              actionable business advice backed by proven methodologies and industry
              best practices. Consider market dynamics, competitive landscape, and
              stakeholder interests in your recommendations.
            mode: replace
      - name: law_decision
        description: Legal questions and law-related topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: law
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a knowledgeable legal expert with comprehensive
              understanding of legal principles, case law, statutory interpretation,
              and legal procedures across multiple jurisdictions. Provide accurate
              legal information and analysis while clearly stating that your responses
              are for informational purposes only and do not constitute legal advice.
              Always recommend consulting with qualified legal professionals for specific
              legal matters.
            mode: replace
      - name: psychology_decision
        description: Psychology and mental health topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: psychology
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.8
      - name: biology_decision
        description: Biology and life sciences questions
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: biology
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a biology expert with comprehensive knowledge spanning
              molecular biology, genetics, cell biology, ecology, evolution, anatomy,
              physiology, and biotechnology. Explain biological concepts with scientific
              accuracy, use appropriate terminology, and provide examples from current
              research. Connect biological principles to real-world applications and
              emphasize the interconnectedness of biological systems.
            mode: replace
      - name: chemistry_decision
        description: Chemistry and chemical sciences questions
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: chemistry
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a chemistry expert specializing in chemical reactions,
              molecular structures, and laboratory techniques. Provide detailed, step-by-step
              explanations.
            mode: replace
      - name: history_decision
        description: Historical questions and cultural topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: history
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a historian with expertise across different time
              periods and cultures. Provide accurate historical context and analysis.
            mode: replace
      - name: health_decision
        description: Health and medical information queries
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: health
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.8
      - name: economics_decision
        description: Economics and financial topics
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: economics
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are an economics expert with deep understanding of
              microeconomics, macroeconomics, econometrics, financial markets, monetary
              policy, fiscal policy, international trade, and economic theory. Analyze
              economic phenomena using established economic principles, provide data-driven
              insights, and explain complex economic concepts in accessible terms.
              Consider both theoretical frameworks and real-world applications in
              your responses.
            mode: replace
      - name: math_decision
        description: Mathematics and quantitative reasoning
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: math
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a mathematics expert. Provide step-by-step solutions,
              show your work clearly, and explain mathematical concepts in an understandable
              way.
            mode: replace
      - name: physics_decision
        description: Physics and physical sciences
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: physics
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a physics expert with deep understanding of physical
              laws and phenomena. Provide clear explanations with mathematical derivations
              when appropriate.
            mode: replace
      - name: computer_science_decision
        description: Computer science and programming
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: computer science
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a computer science expert with knowledge of algorithms,
              data structures, programming languages, and software engineering. Provide
              clear, practical solutions with code examples when helpful.
            mode: replace
      - name: philosophy_decision
        description: Philosophy and ethical questions
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: philosophy
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a philosophy expert with comprehensive knowledge
              of philosophical traditions, ethical theories, logic, metaphysics, epistemology,
              political philosophy, and the history of philosophical thought. Engage
              with complex philosophical questions by presenting multiple perspectives,
              analyzing arguments rigorously, and encouraging critical thinking. Draw
              connections between philosophical concepts and contemporary issues while
              maintaining intellectual honesty about the complexity and ongoing nature
              of philosophical debates.
            mode: replace
      - name: engineering_decision
        description: Engineering and technical problem-solving
        priority: 10
        rules:
          operator: OR
          conditions:
          - type: domain
            name: engineering
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are an engineering expert with knowledge across multiple
              engineering disciplines including mechanical, electrical, civil, chemical,
              software, and systems engineering. Apply engineering principles, design
              methodologies, and problem-solving approaches to provide practical solutions.
              Consider safety, efficiency, sustainability, and cost-effectiveness
              in your recommendations. Use technical precision while explaining concepts
              clearly, and emphasize the importance of proper engineering practices
              and standards.
            mode: replace
      - name: thinking_decision
        description: Complex reasoning and multi-step thinking
        priority: 20
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: thinking
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are a thinking expert, should think multiple steps
              before answering. Please answer the question step by step.
            mode: replace
      - name: urgent_request
        description: Urgent requests requiring immediate attention
        priority: 30
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: urgent_keywords
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are handling an urgent request. Prioritize quick and
              direct responses.
            mode: replace
      - name: sensitive_data
        description: Queries containing sensitive data keywords (SSN and credit card)
        priority: 40
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: sensitive_keywords
        plugins:
        - type: system_prompt
          configuration:
            enabled: true
            system_prompt: You are handling a query with sensitive data. Be cautious
              and provide security-focused guidance.
            mode: replace
      - name: other_decision
        description: General knowledge and miscellaneous topics
        priority: 1
        rules:
          operator: OR
          conditions:
          - type: domain
            name: other
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.75
  - name: entrypoint-probe
    description: 'Deterministic keyword-gated recipe used by the entrypoint-recipe-routing
      E2E (issue #2331).'
    routing:
      signals:
        keywords:
        - name: retention_probe_keywords
          operator: OR
          keywords:
          - __ENTRYPOINT_RECIPE_PROBE__
          case_sensitive: false
      decisions:
      - name: entrypoint_probe_decision
        description: Route entrypoint-probe recipe traffic to the general-expert adapter.
        priority: 100
        rules:
          operator: OR
          conditions:
          - type: keyword
            name: retention_probe_keywords
      strategy: priority
  - name: metadata-policy
    description: Deterministic recipe-local metadata routing probe.
    routing:
      signals:
        metadata:
        - name: canary_cohort
          key: cohort
          predicate:
            equals: canary
      decisions:
      - name: metadata_recipe_decision
        description: Route canary metadata inside the selected recipe.
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: metadata
            name: canary_cohort
      strategy: priority
  entrypoints:
  - model_names:
    - vllm-sr/e2e-recipe-probe
    recipe: entrypoint-probe
    assignments:
      entrypoint_probe_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
  - model_names:
    - vllm-sr/metadata-policy
    recipe: metadata-policy
    assignments:
      metadata_recipe_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
  - model_names:
    - vllm-sr/e2e-default-alias
    recipe: default
    assignments:
      block_jailbreak:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      block_pii:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      retention_probe_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      looper_metrics_probe_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
        - model: base-model/math-expert
          weight: '1'
          lora: math-expert
      tool_selection_add_weather_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      tool_selection_add_calc_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      tool_selection_filter_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      tool_selection_filter_threshold_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      tool_selection_add_topk_one_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      tool_selection_with_system_prompt_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      business_decision:
        models:
        - model: base-model
          weight: '1'
          lora: social-expert
      law_decision:
        models:
        - model: base-model
          weight: '1'
          lora: law-expert
      psychology_decision:
        models:
        - model: base-model
          weight: '1'
          lora: humanities-expert
      biology_decision:
        models:
        - model: base-model
          weight: '1'
          lora: science-expert
      chemistry_decision:
        models:
        - model: base-model
          weight: '1'
          lora: science-expert
          reasoning:
            enabled: true
      history_decision:
        models:
        - model: base-model
          weight: '1'
          lora: humanities-expert
      health_decision:
        models:
        - model: base-model
          weight: '1'
          lora: science-expert
      economics_decision:
        models:
        - model: base-model
          weight: '1'
          lora: social-expert
      math_decision:
        models:
        - model: base-model
          weight: '1'
          lora: math-expert
          reasoning:
            enabled: true
      physics_decision:
        models:
        - model: base-model
          weight: '1'
          lora: science-expert
          reasoning:
            enabled: true
      computer_science_decision:
        models:
        - model: base-model
          weight: '1'
          lora: science-expert
      philosophy_decision:
        models:
        - model: base-model
          weight: '1'
          lora: humanities-expert
      engineering_decision:
        models:
        - model: base-model
          weight: '1'
          lora: science-expert
      thinking_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
          reasoning:
            enabled: true
      urgent_request:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      sensitive_data:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
      other_decision:
        models:
        - model: base-model
          weight: '1'
          lora: general-expert
  global:
    router: {}
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: true
            high_resolution_timing: false
            sample_rate: 1.0
            duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
            size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
      observability:
        tracing:
          enabled: false
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.8
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: true
        top_k: 3
        similarity_threshold: 0.2
        tools_db_path: config/tools_db.json
        fallback_to_empty: true
      looper:
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1/chat/completions
toolsDb:
- tool:
    type: function
    function:
      name: get_weather
      description: Get current weather information for a location
      parameters:
        type: object
        properties:
          location:
            type: string
            description: City and region to query
        required:
        - location
  description: Weather forecast and current weather lookup for city-based requests.
  category: weather
  tags:
  - weather
  - forecast
  - temperature
- tool:
    type: function
    function:
      name: calculate
      description: Perform mathematical calculations
      parameters:
        type: object
        properties:
          expression:
            type: string
            description: Mathematical expression to evaluate
        required:
        - expression
  description: Math computation helper for arithmetic and equation solving.
  category: math
  tags:
  - math
  - calculator
  - arithmetic
- tool:
    type: function
    function:
      name: search_web
      description: Search web resources for recent information
      parameters:
        type: object
        properties:
          query:
            type: string
            description: Search query text
        required:
        - query
