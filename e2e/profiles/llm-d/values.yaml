config:
  version: v0.3
  listeners: []
  providers:
    models:
    - name: llama3-8b
      provider_model_id: llama3-8b
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
    - name: phi4-mini
      provider_model_id: phi4-mini
      backend_refs:
      - provider: vllm
        endpoint: http://phi4-mini.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
  routing:
    modelCards:
    - name: llama3-8b
    - name: phi4-mini
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals:
        domains:
        - name: business
          description: Business management, marketing, entrepreneurship
        - name: philosophy
          description: Ethics, logic, metaphysics, epistemology
        - name: biology
          description: Genetics, evolution, ecology, anatomy
        - name: health
          description: Medicine, nutrition, fitness, diseases
        - name: computer science
          description: Computer networks, programming, systems
        - name: engineering
          description: Mechanical, electrical, civil engineering
        - name: psychology
          description: Behavior, cognition, mental health
        - name: math
          description: Mathematics, arithmetic, calculation
        - name: chemistry
          description: Chemical reactions, compounds, periodic table
        - name: physics
          description: Mechanics, thermodynamics, quantum physics
        - name: history
          description: Historical events, civilizations, wars
        - name: law
          description: Legal systems, regulations, court procedures
        - name: economics
          description: Microeconomics, macroeconomics, financial markets
        - name: other
          description: General knowledge and miscellaneous topics
      decisions:
      - name: math_decision
        priority: 100
        rules:
          operator: OR
          conditions:
          - type: domain
            name: math
      - name: computer_science_decision
        priority: 100
        rules:
          operator: OR
          conditions:
          - type: domain
            name: computer science
      - name: physics_decision
        priority: 50
        rules:
          operator: OR
          conditions:
          - type: domain
            name: physics
      - name: chemistry_decision
        priority: 50
        rules:
          operator: OR
          conditions:
          - type: domain
            name: chemistry
      - name: biology_decision
        priority: 50
        rules:
          operator: OR
          conditions:
          - type: domain
            name: biology
      - name: engineering_decision
        priority: 50
        rules:
          operator: OR
          conditions:
          - type: domain
            name: engineering
      - name: health_decision
        priority: 50
        rules:
          operator: OR
          conditions:
          - type: domain
            name: health
      - name: psychology_decision
        priority: 40
        rules:
          operator: OR
          conditions:
          - type: domain
            name: psychology
      - name: economics_decision
        priority: 40
        rules:
          operator: OR
          conditions:
          - type: domain
            name: economics
      - name: business_decision
        priority: 40
        rules:
          operator: OR
          conditions:
          - type: domain
            name: business
      - name: history_decision
        priority: 40
        rules:
          operator: OR
          conditions:
          - type: domain
            name: history
      - name: philosophy_decision
        priority: 40
        rules:
          operator: OR
          conditions:
          - type: domain
            name: philosophy
      - name: law_decision
        priority: 40
        rules:
          operator: OR
          conditions:
          - type: domain
            name: law
      - name: other_decision
        priority: 1
        rules:
          operator: OR
          conditions:
          - type: domain
            name: other
  entrypoints:
  - model_names:
    - vllm-sr/auto
    - auto
    recipe: default
    assignments:
      math_decision:
        models:
        - model: phi4-mini
          weight: '1'
      computer_science_decision:
        models:
        - model: llama3-8b
          weight: '1'
      physics_decision:
        models:
        - model: llama3-8b
          weight: '1'
      chemistry_decision:
        models:
        - model: llama3-8b
          weight: '1'
      biology_decision:
        models:
        - model: llama3-8b
          weight: '1'
      engineering_decision:
        models:
        - model: llama3-8b
          weight: '1'
      health_decision:
        models:
        - model: llama3-8b
          weight: '1'
      psychology_decision:
        models:
        - model: llama3-8b
          weight: '1'
      economics_decision:
        models:
        - model: llama3-8b
          weight: '1'
      business_decision:
        models:
        - model: llama3-8b
          weight: '1'
      history_decision:
        models:
        - model: llama3-8b
          weight: '1'
      philosophy_decision:
        models:
        - model: llama3-8b
          weight: '1'
      law_decision:
        models:
        - model: llama3-8b
          weight: '1'
      other_decision:
        models:
        - model: llama3-8b
          weight: '1'
  global:
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router:
      clear_route_cache: true
    stores:
      response_cache:
        enabled: false
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: false
    services:
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
image:
  pullPolicy: IfNotPresent
