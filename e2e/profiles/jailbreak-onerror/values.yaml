replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  tag: latest
  pullPolicy: Never
config:
  version: v0.4
  listeners: []
  models:
  - name: openai/mock-model
    card: {}
    connections:
    - provider: vllm
      endpoint: http://mock-vllm.default.svc.cluster.local:8000/v1
      model: openai/mock-model
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  recipes:
  - name: default
    description: Default routing recipe.
    document:
      signals:
        jailbreak:
        - name: guardrail_unreachable
          threshold: 0.5
          include_history: false
          description: Signal rule bound to the deliberately-unreachable guardrail
            endpoint
      decisions:
      - name: block_on_classifier_error
        description: Blocks every request because the guardrail classifier is unreachable
          and on_error is block
        priority: 100
        rules:
          operator: OR
          conditions:
          - type: jailbreak
            name: guardrail_unreachable
        plugins:
        - type: fast_response
          configuration:
            message: Your request has been declined due to a policy violation.
      - name: default_decision
        description: Default catch-all decision (should not be reached - on_error:block
          always matches first)
        priority: 1
        rules:
          operator: AND
          conditions: []
  entrypoints:
  - name: vllm-sr/auto
    aliases:
    - auto
    recipe: default
    assignments:
      block_on_classifier_error:
        models:
        - model: openai/mock-model
          weight: '1'
      default_decision:
        models:
        - model: openai/mock-model
          weight: '1'
  global:
    router: {}
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: false
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations: {}
    model_catalog:
      kbs: []
      external:
      - name: unreachable-guardrail
        llm_provider: openai
        model_role: guardrail
        llm_model_name: unreachable-guardrail
        llm_endpoint:
          address: 127.0.0.1
          port: 1
          protocol: http
        llm_timeout_seconds: 2
      modules:
        prompt_guard:
          enabled: true
          model_ref: ''
          model_id: ''
          variant: ''
          protocol: http_classify
          on_error: block
          threshold: 0.5
          positive_labels:
          - jailbreak
          jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
        classifier:
          domain:
            model_ref: ''
            model_id: ''
            category_mapping_path: ''
            use_mmbert_32k: false
          pii:
            model_ref: ''
            model_id: ''
            pii_mapping_path: ''
            use_mmbert_32k: false
        hallucination_mitigation:
          enabled: false
      embeddings: {}
extraVolumes:
- name: jailbreak-mapping
  configMap:
    name: jailbreak-onerror-mapping
extraVolumeMounts:
- name: jailbreak-mapping
  mountPath: /app/models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
  subPath: jailbreak_type_mapping.json
  readOnly: true
resources:
  limits:
    cpu: '2'
    memory: 6Gi
  requests:
    cpu: 500m
    memory: 2Gi
persistence:
  enabled: false
