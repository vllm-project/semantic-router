replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  pullPolicy: Never
  tag: e2e-test
service:
  type: ClusterIP
  port: 8080
config:
  version: v0.4
  listeners: []
  models:
  - name: llama-3.2-1b
    card: {}
    connections:
    - provider: vllm
      endpoint: http://mock-llm-service.default.svc.cluster.local:8000/v1
      model: llama-3.2-1b
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  - name: llama-3.2-3b
    card: {}
    connections:
    - provider: vllm
      endpoint: http://mock-llm-service.default.svc.cluster.local:8000/v1
      model: llama-3.2-3b
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  - name: codellama-7b
    card: {}
    connections:
    - provider: vllm
      endpoint: http://mock-llm-service.default.svc.cluster.local:8000/v1
      model: codellama-7b
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  - name: mistral-7b
    card: {}
    connections:
    - provider: vllm
      endpoint: http://mock-llm-service.default.svc.cluster.local:8000/v1
      model: mistral-7b
    runtime:
      request_timeout: 300s
      stream_timeout: 300s
  recipes:
  - name: default
    description: Default routing recipe.
    document:
      signals:
        domains:
        - name: math
          description: Mathematics and quantitative reasoning
        - name: computer science
          description: Computer science and programming
        - name: physics
          description: Physics and physical sciences
        - name: chemistry
          description: Chemistry and chemical sciences
        - name: biology
          description: Biology and life sciences
        - name: health
          description: Health and medical sciences
        - name: engineering
          description: Engineering disciplines
        - name: economics
          description: Economics and finance
        - name: business
          description: Business and management
        - name: history
          description: History and historical events
        - name: law
          description: Law and legal matters
        - name: philosophy
          description: Philosophy and ethics
        - name: psychology
          description: Psychology and behavioral science
        - name: other
          description: General knowledge and miscellaneous
      decisions:
      - name: math_decision
        description: Mathematics queries - uses MLP for neural network routing
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: math
        algorithm:
          type: mlp
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            mlp:
              device: cpu
              pretrained_path: /tmp/ml-models/mlp_model.json
      - name: code_decision
        description: Programming queries - uses MLP
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: computer science
        algorithm:
          type: mlp
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            mlp:
              device: cpu
              pretrained_path: /tmp/ml-models/mlp_model.json
      - name: science_decision
        description: Science queries (chemistry, biology) - uses KNN
        priority: 100
        rules:
          operator: OR
          conditions:
          - type: domain
            name: chemistry
          - type: domain
            name: biology
        algorithm:
          type: knn
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            knn:
              k: 5
              pretrained_path: /tmp/ml-models/knn_model.json
      - name: health_decision
        description: Health and medical queries - uses KMeans
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: health
        algorithm:
          type: kmeans
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            kmeans:
              num_clusters: 8
              efficiency_weight: 0.1
              pretrained_path: /tmp/ml-models/kmeans_model.json
      - name: physics_decision
        description: Physics queries - uses KMeans
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: physics
        algorithm:
          type: kmeans
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            kmeans:
              num_clusters: 8
              efficiency_weight: 0.1
              pretrained_path: /tmp/ml-models/kmeans_model.json
      - name: business_decision
        description: Business and economics queries - uses SVM
        priority: 100
        rules:
          operator: OR
          conditions:
          - type: domain
            name: business
          - type: domain
            name: economics
        algorithm:
          type: svm
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            svm:
              kernel: rbf
              gamma: 1.0
              pretrained_path: /tmp/ml-models/svm_model.json
      - name: law_decision
        description: Law queries - uses KNN
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: law
        algorithm:
          type: knn
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            knn:
              k: 5
              pretrained_path: /tmp/ml-models/knn_model.json
      - name: engineering_decision
        description: Engineering queries - uses KMeans
        priority: 100
        rules:
          operator: AND
          conditions:
          - type: domain
            name: engineering
        algorithm:
          type: kmeans
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            kmeans:
              num_clusters: 8
              efficiency_weight: 0.1
              pretrained_path: /tmp/ml-models/kmeans_model.json
      - name: humanities_decision
        description: History, philosophy, psychology - uses KNN
        priority: 90
        rules:
          operator: OR
          conditions:
          - type: domain
            name: history
          - type: domain
            name: philosophy
          - type: domain
            name: psychology
        algorithm:
          type: knn
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            knn:
              k: 5
              pretrained_path: /tmp/ml-models/knn_model.json
      - name: general_decision
        description: General / other - catch-all for domain 'other' and low-confidence
        priority: 1
        rules:
          operator: AND
          conditions:
          - type: domain
            name: other
        algorithm:
          type: knn
          ml:
            models_path: /tmp/ml-models
            embedding_dim: 1024
            knn:
              k: 5
              pretrained_path: /tmp/ml-models/knn_model.json
  entrypoints:
  - name: vllm-sr/auto
    aliases:
    - auto
    recipe: default
    assignments:
      math_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      code_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      science_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      health_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      physics_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      business_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      law_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      engineering_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      humanities_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
      general_decision:
        models:
        - model: llama-3.2-1b
          weight: '1'
        - model: llama-3.2-3b
          weight: '1'
        - model: codellama-7b
          weight: '1'
        - model: mistral-7b
          weight: '1'
  global:
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router:
      clear_route_cache: true
    services:
      observability:
        metrics:
          enabled: true
        tracing:
          enabled: false
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations: {}
resources:
  limits:
    cpu: 2000m
    memory: 8Gi
  requests:
    cpu: 500m
    memory: 2Gi
extraVolumes:
- name: ml-models
  hostPath:
    path: /tmp/ml-models
    type: DirectoryOrCreate
extraVolumeMounts:
- name: ml-models
  mountPath: /tmp/ml-models
  readOnly: true
