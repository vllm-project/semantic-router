replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  tag: latest
  pullPolicy: Never
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-candidate
        backend_refs:
          - name: shadow-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-unreachable
        backend_refs:
          - name: shadow-unreachable-endpoint
            endpoint: 127.0.0.1:9
            weight: 1
      - name: openai/shadow-timeout
        backend_refs:
          - name: shadow-timeout-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-malformed
        backend_refs:
          - name: shadow-malformed-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-queue
        backend_refs:
          - name: shadow-queue-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  routing:
    decisions:
      - name: default_decision
        description: Default catch-all decision
        priority: 1
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: openai/gpt-oss-20b
            use_reasoning: false
        plugins:
          - type: router_replay
            configuration:
              enabled: true
              max_records: 1000
              capture_request_body: true
              capture_response_body: true
              max_body_bytes: 65536
    signals: {}
    modelCards:
      - name: openai/gpt-oss-20b
      - name: openai/shadow-candidate
      - name: openai/shadow-unreachable
      - name: openai/shadow-timeout
      - name: openai/shadow-malformed
      - name: openai/shadow-queue
  entrypoints:
    - model_names: ["vllm-sr/replay-first"]
      recipe: replay-first
    - model_names: ["vllm-sr/replay-second"]
      recipe: replay-second
    - model_names: ["vllm-sr/shadow-ok"]
      recipe: shadow-ok
    - model_names: ["vllm-sr/shadow-down"]
      recipe: shadow-down
    - model_names: ["vllm-sr/shadow-timeout"]
      recipe: shadow-timeout
    - model_names: ["vllm-sr/shadow-malformed"]
      recipe: shadow-malformed
    - model_names: ["vllm-sr/shadow-queue"]
      recipe: shadow-queue
  recipes:
    - name: replay-first
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shared_replay_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: true
                  capture_response_body: true
                  max_body_bytes: 65536
    - name: replay-second
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shared_replay_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: true
                  capture_response_body: true
                  max_body_bytes: 65536
    - name: shadow-ok
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shadow_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: true
                  capture_response_body: true
                  max_body_bytes: 65536
              - type: shadow_dispatch
                configuration:
                  enabled: true
                  model: openai/shadow-candidate
                  sample_rate: 1.0
                  max_concurrency: 2
                  max_queue_depth: 8
                  timeout_seconds: 20
                  max_response_bytes: 1048576
                  max_retries: 0
                  capture_response_body: false
    - name: shadow-timeout
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shadow_timeout_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: false
                  capture_response_body: true
                  max_body_bytes: 65536
              - type: shadow_dispatch
                configuration:
                  enabled: true
                  model: openai/shadow-timeout
                  sample_rate: 1.0
                  max_concurrency: 1
                  max_queue_depth: 1
                  timeout_seconds: 5
                  max_response_bytes: 1048576
                  max_retries: 0
                  capture_response_body: false
    - name: shadow-malformed
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shadow_malformed_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: false
                  capture_response_body: true
                  max_body_bytes: 65536
              - type: shadow_dispatch
                configuration:
                  enabled: true
                  model: openai/shadow-malformed
                  sample_rate: 1.0
                  max_concurrency: 1
                  max_queue_depth: 1
                  timeout_seconds: 5
                  max_response_bytes: 1048576
                  max_retries: 0
                  capture_response_body: false
    - name: shadow-queue
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shadow_queue_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: false
                  capture_response_body: true
                  max_body_bytes: 65536
              - type: shadow_dispatch
                configuration:
                  enabled: true
                  model: openai/shadow-queue
                  sample_rate: 1.0
                  max_concurrency: 1
                  max_queue_depth: 1
                  timeout_seconds: 30
                  max_response_bytes: 1048576
                  max_retries: 0
                  capture_response_body: false
    - name: shadow-down
      routing:
        strategy: priority
        signals: {}
        decisions:
          - name: shadow_decision
            priority: 1
            rules:
              operator: AND
              conditions: []
            modelRefs:
              - model: openai/gpt-oss-20b
                use_reasoning: false
            plugins:
              - type: router_replay
                configuration:
                  enabled: true
                  max_records: 1000
                  capture_request_body: false
                  capture_response_body: true
                  max_body_bytes: 65536
              - type: shadow_dispatch
                configuration:
                  enabled: true
                  model: openai/shadow-unreachable
                  sample_rate: 1.0
                  max_concurrency: 2
                  max_queue_depth: 8
                  timeout_seconds: 5
                  max_response_bytes: 1048576
                  max_retries: 0
                  capture_response_body: false
  global:
    router:
      strategy: priority
    services:
      management_api:
        auth:
          mode: bearer
          tokens:
            - env: VSR_E2E_REPLAY_MANAGEMENT_TOKEN
              role: viewer
            # Shadow dispatch cases read outcome reason, target_ref, and
            # metadata, which the API redacts without replay.detail.
            - env: VSR_E2E_REPLAY_DETAIL_TOKEN
              role: operator
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      router_replay:
        store_backend: postgres
        ttl_seconds: 2592000
        async_writes: false
        postgres:
          host: postgres.default.svc.cluster.local
          port: 5432
          database: vsr
          user: router
          password: router-secret
          ssl_mode: disable
          max_open_conns: 10
          max_idle_conns: 5
          conn_max_lifetime: 300
          table_name: router_replay
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    stores:
      response_cache:
        enabled: false
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: false
    model_catalog:
      kbs: []
      modules:
        prompt_guard:
          enabled: false
          model_ref: ""
          model_id: ""
          jailbreak_mapping_path: ""
        classifier:
          domain:
            model_ref: ""
            model_id: ""
            category_mapping_path: ""
            use_mmbert_32k: false
          pii:
            model_ref: ""
            model_id: ""
            pii_mapping_path: ""
            use_mmbert_32k: false
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi
extraEnv:
  - name: VSR_E2E_REPLAY_MANAGEMENT_TOKEN
    value: router-replay-e2e-viewer-token
  - name: VSR_E2E_REPLAY_DETAIL_TOKEN
    value: router-replay-e2e-operator-token
