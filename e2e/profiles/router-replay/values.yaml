replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-candidate
        backend_refs:
          - name: shadow-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-second
        backend_refs:
          - name: shadow-second-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-unreachable
        backend_refs:
          - name: shadow-unreachable-endpoint
            endpoint: 127.0.0.1:9
            weight: 1
      - name: openai/shadow-timeout
        backend_refs:
          - name: shadow-timeout-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-malformed
        backend_refs:
          - name: shadow-malformed-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: openai/shadow-queue
        backend_refs:
          - name: shadow-queue-endpoint
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  entrypoints:
    - model_names: [vllm-sr/auto]
      recipe: default
      default: true
    - model_names: ["vllm-sr/replay-first"]
      recipe: replay-first
    - model_names: ["vllm-sr/replay-second"]
      recipe: replay-second
    - model_names: ["vllm-sr/replay-tool-results"]
      recipe: replay-tool-results
    - model_names: ["vllm-sr/shadow-multi"]
      recipe: shadow-multi
    - model_names: ["vllm-sr/shadow-multi-failure"]
      recipe: shadow-multi-failure
    - model_names: ["vllm-sr/shadow-ok"]
      recipe: shadow-ok
    - model_names: ["vllm-sr/shadow-judge"]
      recipe: shadow-judge
    - model_names: ["vllm-sr/shadow-down"]
      recipe: shadow-down
    - model_names: ["vllm-sr/shadow-timeout"]
      recipe: shadow-timeout
    - model_names: ["vllm-sr/shadow-malformed"]
      recipe: shadow-malformed
    - model_names: ["vllm-sr/shadow-queue"]
      recipe: shadow-queue
  recipes:
    - name: default
      decisions:
        - name: default_decision
          description: Default catch-all decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
      signals: {}
    - name: replay-first
      strategy: priority
      signals: {}
      decisions:
        - name: shared_replay_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
    - name: replay-second
      strategy: priority
      signals: {}
      decisions:
        - name: shared_replay_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
    # Stores client tool results, cut to 32 bytes, for replay.detail readers.
    - name: replay-tool-results
      strategy: priority
      signals: {}
      decisions:
        - name: tool_results_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                capture_tool_results: true
                max_body_bytes: 65536
                max_tool_trace_bytes: 32
    - name: shadow-ok
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-candidate]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 2
                    max_queue_size: 8
                    timeout: 20s
                  budget:
                    max_response_bytes: 1048576
    - name: shadow-multi
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-candidate, openai/shadow-second]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 1
                    max_queue_size: 8
                    timeout: 20s
                  budget:
                    max_response_bytes: 2097152
    - name: shadow-multi-failure
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-malformed, openai/shadow-candidate]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 1
                    max_queue_size: 8
                    timeout: 20s
                  budget:
                    max_response_bytes: 2097152
    - name: shadow-judge
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_judge_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: true
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-candidate]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 2
                    max_queue_size: 8
                    timeout: 20s
                  budget:
                    max_response_bytes: 1048576
                  capture:
                    enabled: true
                    max_bytes: 4096
    - name: shadow-timeout
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_timeout_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: false
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-timeout]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 1
                    max_queue_size: 1
                    timeout: 5s
                  budget:
                    max_response_bytes: 1048576
    - name: shadow-malformed
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_malformed_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: false
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-malformed]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 1
                    max_queue_size: 1
                    timeout: 5s
                  budget:
                    max_response_bytes: 1048576
    - name: shadow-queue
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_queue_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: false
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-queue]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 1
                    max_queue_size: 1
                    timeout: 30s
                  budget:
                    max_response_bytes: 1048576
    - name: shadow-down
      strategy: priority
      signals: {}
      decisions:
        - name: shadow_decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
          plugins:
            - type: router_replay
              configuration:
                enabled: true
                prompt_capture: raw
                max_records: 1000
                capture_request_body: false
                capture_response_body: true
                max_body_bytes: 65536
                shadow:
                  models: [openai/shadow-unreachable]
                  sample_rate: 1.0
                  execution:
                    max_concurrency: 2
                    max_queue_size: 8
                    timeout: 5s
                  budget:
                    max_response_bytes: 1048576
  global:
    router:
      strategy: priority
    services:
      management_api:
        auth:
          mode: bearer
          tokens:
            - env: VSR_E2E_REPLAY_MANAGEMENT_TOKEN
              role: viewer
            # Shadow dispatch cases read outcome reason, target_ref, and
            # metadata, which the API redacts without replay.detail.
            - env: VSR_E2E_REPLAY_DETAIL_TOKEN
              role: operator
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      router_replay:
        store_backend: postgres
        ttl_seconds: 2592000
        async_writes: false
        postgres:
          host: postgres.default.svc.cluster.local
          port: 5432
          database: vsr
          user: router
          password: router-secret
          ssl_mode: disable
          max_open_conns: 10
          max_idle_conns: 5
          conn_max_lifetime: 300
          table_name: router_replay
      api:
        batch_classification:
          max_batch_size: 100
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi
extraEnv:
  - name: VSR_E2E_REPLAY_MANAGEMENT_TOKEN
    value: router-replay-e2e-viewer-token
  - name: VSR_E2E_REPLAY_DETAIL_TOKEN
    value: router-replay-e2e-operator-token
