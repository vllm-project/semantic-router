replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  tag: latest
  pullPolicy: Never
config:
  version: v0.3
  listeners: []
  providers:
    models:
    - name: openai/gpt-oss-20b
      provider_model_id: openai/gpt-oss-20b
      backend_refs:
      - provider: vllm
        endpoint: http://mock-vllm.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
  routing:
    modelCards:
    - name: openai/gpt-oss-20b
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals: {}
      decisions:
      - name: default_decision
        description: Default catch-all decision
        priority: 1
        rules:
          operator: AND
          conditions: []
        plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 1000
            capture_request_body: true
            capture_response_body: true
            max_body_bytes: 65536
  - name: replay-first
    routing:
      signals: {}
      decisions:
      - name: shared_replay_decision
        priority: 1
        rules:
          operator: AND
          conditions: []
        plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 1000
            capture_request_body: true
            capture_response_body: true
            max_body_bytes: 65536
      strategy: priority
  - name: replay-second
    routing:
      signals: {}
      decisions:
      - name: shared_replay_decision
        priority: 1
        rules:
          operator: AND
          conditions: []
        plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 1000
            capture_request_body: true
            capture_response_body: true
            max_body_bytes: 65536
      strategy: priority
  entrypoints:
  - model_names:
    - vllm-sr/replay-first
    recipe: replay-first
    assignments:
      shared_replay_decision:
        models:
        - model: openai/gpt-oss-20b
          weight: '1'
  - model_names:
    - vllm-sr/replay-second
    recipe: replay-second
    assignments:
      shared_replay_decision:
        models:
        - model: openai/gpt-oss-20b
          weight: '1'
  global:
    router: {}
    services:
      management_api:
        auth:
          mode: bearer
          tokens:
          - env: VSR_E2E_REPLAY_MANAGEMENT_TOKEN
            role: viewer
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      router_replay:
        store_backend: postgres
        ttl_seconds: 2592000
        async_writes: false
        postgres:
          host: postgres.default.svc.cluster.local
          port: 5432
          database: vsr
          user: router
          password: router-secret
          ssl_mode: disable
          max_open_conns: 10
          max_idle_conns: 5
          conn_max_lifetime: 300
          table_name: router_replay
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations: {}
    model_catalog:
      kbs: []
      modules:
        prompt_guard:
          enabled: false
          model_ref: ''
          model_id: ''
          jailbreak_mapping_path: ''
        classifier:
          domain:
            model_ref: ''
            model_id: ''
            category_mapping_path: ''
            use_mmbert_32k: false
          pii:
            model_ref: ''
            model_id: ''
            pii_mapping_path: ''
            use_mmbert_32k: false
        hallucination_mitigation: {}
      embeddings: {}
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi
extraEnv:
- name: VSR_E2E_REPLAY_MANAGEMENT_TOKEN
  value: router-replay-e2e-viewer-token
