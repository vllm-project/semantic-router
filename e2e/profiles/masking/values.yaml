replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  tag: latest
  pullPolicy: Never
config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: openai/mock-model
    models:
      - name: openai/mock-model
        backend_refs:
          - name: provider-mocker
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      # A second model for the session cases, so a held model and a fresh
      # decision's model differ.
      - name: openai/mock-model-b
        backend_refs:
          - name: provider-mocker-b
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  # An explicit entrypoint, not a concrete model name. A concrete model goes
  # through handleSpecifiedModelRouting, which bypasses every recipe-local
  # decision and plugin -- masking would never run and the assertions would
  # be testing nothing.
  entrypoints:
    - model_names: [vllm-sr/auto]
      recipe: default
      default: true
    - model_names: ["vllm-sr/masking"]
      recipe: masking
    - model_names: ["vllm-sr/masking-rules"]
      recipe: masking-rules
    - model_names: ["vllm-sr/agent-session"]
      recipe: agent-session
  recipes:
    - name: default
      decisions:
        # Default-recipe fallback so a request that does not use the masking
        # entrypoint still routes somewhere.
        - name: default_route
          description: Fallback with no masking
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/mock-model
              use_reasoning: false
    - name: masking
      description: Masks detected PII before dispatch on every request
      strategy: priority
      signals:
        pii:
          # No decision gates on this rule: masking reads it at the
          # dispatch boundary (applyMaskingBeforeDispatch), over the
          # request as it is sent.
          - name: personal_data
            predicate:
              gte: 0.5
            description: Personal data masked before dispatch.
      decisions:
        - name: mask_pii
          description: Masks detected PII before dispatch
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/mock-model
              use_reasoning: false
          plugins:
            - type: masking
              configuration:
                enabled: true
                signal: personal_data
                entity_types: []
                placeholders: {}
    # Masks what the recipe's own rules find, with no pii rule: a regex
    # keyword rule, and a span rule asked of the System One fixture.
    - name: masking-rules
      signals:
        keywords:
          - name: employee_id
            description: An employee ID such as E-104233.
            operator: OR
            method: regex
            keywords: ['\bE-\d{6}\b']
        systemone:
          - name: customer_account
            description: A customer's account number.
            deployment: fake-systemone
            question:
              type: span
              instructions: Which spans are named entities of these types?
              labels: [{key: account}]
      decisions:
        - name: mask_rules
          priority: 100
          rules: {operator: AND, conditions: []}
          modelRefs: [{model: openai/mock-model, use_reasoning: false}]
          plugins:
            - type: masking
              configuration:
                enabled: true
                rules:
                  - {type: keyword, name: employee_id}
                  - {type: systemone, name: customer_account}
                placeholders:
                  employee_id: "[EMPLOYEE_{index}]"
    # Two decisions that allow the same two models in opposite order, so a
    # fresh decision on the second turn picks the other model and only
    # session protection keeps the first one.
    - name: agent-session
      signals:
        keywords:
          - {name: session_plan, operator: OR, keywords: ["e2e-session-plan"], case_sensitive: false}
          - {name: session_edit, operator: OR, keywords: ["e2e-session-edit"], case_sensitive: false}
      decisions:
        - name: session_plan
          priority: 100
          rules: {operator: AND, conditions: [{type: keyword, name: session_plan}]}
          modelRefs: [{model: openai/mock-model}, {model: openai/mock-model-b}]
        - name: session_edit
          priority: 100
          rules: {operator: AND, conditions: [{type: keyword, name: session_edit}]}
          modelRefs: [{model: openai/mock-model-b}, {model: openai/mock-model}]
  global:
    router:
      strategy: priority
      # Session protection at its default tuning, keyed on a header only the
      # session cases send, so the masking cases are never held.
      learning:
        enabled: true
        adaptation: {enabled: false}
        protection:
          enabled: true
          scope: session
          identity:
            headers: {session: x-e2e-agent-session, agent: x-e2e-agent-id}
          tuning:
            idle_timeout_seconds: 3
    services:
      # The cross-protocol case sends /v1/responses, which needs the Responses
      # object store enabled or the router answers 404 before any masking runs.
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
    model_catalog:
      deployments:
        # provider-mocker's System One fixture (see its README), the same one
        # the pii-remote-backend profile uses. No PII model is hosted here
        # either; every span this profile sees came from this HTTP call.
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          schema: vllm-sr/4.0
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
      # The PII signal asks only the fixture, so a detection here is
      # attributable to it.
      bindings:
        pii: fake-systemone

resources:
  # Same headroom as the other remote-backend profiles: taking the classifier
  # off-box does not avoid the startup embedding-model load.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false
