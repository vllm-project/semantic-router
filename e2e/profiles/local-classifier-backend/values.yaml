config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared AIGatewayRoute
      # in deploy/kubernetes/ai-gateway/aigw-resources/ matches x-ai-eg-model
      # exactly against six names (math-, science-, social-, humanities-, law-
      # and general-expert). A model outside that list has no route, so every
      # request 404s at the gateway while the router itself stays healthy and
      # logs a correctly selected backend - which is what made this look like a
      # router bug rather than a routing one.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      classifiers:
        - name: local_jailbreak_score
          description: Deterministic in-process local classifier E2E signal (real candle inference, no mock)
          type: local
          model_path: models/mmbert32k-jailbreak-detector-merged
          labels: [benign, jailbreak]
          use_cpu: true
    decisions:
      - name: local_classifier_jailbreak
        description: Route on a score from the in-process local classifier backend (real candle inference, no mock)
        priority: 2000
        rules:
          operator: AND
          conditions:
            - type: classifier
              name: local_jailbreak_score
              label: jailbreak
              predicate:
                gte: 0.5
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route for non-jailbreak requests
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000

resources:
  # 2Gi OOMKills the router on a CI runner: it restarts, never becomes ready,
  # and the helm wait burns its full 60m timeout. Mirrors the same limits
  # category-remote-backend settled on for the same reason.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
