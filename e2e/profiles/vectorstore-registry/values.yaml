replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  recipes:
    - name: default
      decisions:
        - name: default_decision
          description: Default catch-all decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
      signals: {}
  global:
    model_catalog:
      deployments:
        # provider-mocker's embedding fixture (see its README) stands in for
        # the embedding model, so the Router downloads none.
        fixture-embedding:
          provider: openai_embeddings
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1
          model: e2e/fixture-embedding
          timeout_ms: 5000
          capabilities:
            dimensions: 256
      embeddings:
        default: {deployment: fixture-embedding}
    router:
      strategy: priority
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      api:
        batch_classification:
          max_batch_size: 100
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    stores:
      vector_store:
        enabled: true
        backend_type: memory
        metadata_store: postgres
        metadata_postgres:
          host: postgres.default.svc.cluster.local
          port: 5432
          database: vsr
          user: router
          password: router-secret
          ssl_mode: disable
          max_open_conns: 10
          max_idle_conns: 5
          conn_max_lifetime: 300
          table_name: vector_store_registry
    integrations: {}
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi
# Uploaded files stay at the default file_storage_dir, /var/lib/vsr/data, on
# the data volume's claim, so the restart test can read them back.
data:
  persistence:
    enabled: true
    size: 1Gi
