config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared
      # AIGatewayRoute in deploy/kubernetes/ai-gateway/aigw-resources/
      # matches x-ai-eg-model exactly against six names, and a model outside
      # that list has no route, so every request 404s at the gateway while
      # the router itself looks healthy.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      # One rule that allows no PII type at all, so any span the remote
      # backend returns is a denied entity. No local PII model is configured
      # below, which is what makes a match attributable: local token
      # classification cannot run, so a verdict here can only have come from
      # the remote token_spans.v1 call.
      pii:
        - name: pii_deny_all
          threshold: 0.5
          include_history: false
          description: Deny every PII type, so any remote span blocks the request
    decisions:
      - name: block_pii_remote
        description: Blocks when the remote token_spans.v1 backend returns a span, or fails while on_error is block
        priority: 1000
        rules:
          operator: OR
          conditions:
            - type: pii
              name: pii_deny_all
        plugins:
          - type: fast_response
            configuration:
              message: Your request contains personal information. Please remove any sensitive data and try again.
      - name: default-route
        description: Fallback route, reached when the remote backend returned no spans
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
      external:
        - name: e2e-pii-spans
          model_role: classification
          llm_endpoint:
            address: mock-pii-spans.default.svc.cluster.local
            port: 8000
            protocol: http
          llm_model_name: pii-spans-service
          llm_timeout_seconds: 5
      modules:
        classifier:
          domain:
            model_ref: ""
            model_id: ""
            category_mapping_path: ""
            use_mmbert_32k: false
          pii:
            # No local selectors: model_id empty and use_mmbert_32k false, so
            # the candle PII path cannot run and every span comes from the
            # backend below.
            model_ref: ""
            model_id: ""
            use_mmbert_32k: false
            # The mapping is still required: it is what the token_spans
            # decoder resolves provider labels against, and a label outside
            # it is a rejected response rather than a silent pass.
            pii_mapping_path: /app/models/pii-remote-backend/pii_type_mapping.json
            # contract may be omitted: PII reads exactly one, so there is
            # nothing to guess. It is stated here because this profile exists
            # to exercise it.
            backend:
              protocol: http_classify
              contract: token_spans.v1
              model: e2e-pii-spans
              deadline_ms: 5000
            # A rejected response, or a declared truncation, is not a clean
            # "no PII" result: block matches the rule as classification_error
            # so the request fails closed.
            on_error: block
        hallucination_mitigation:
          enabled: false

# The router requires a pii_type_mapping.json on disk even for a remote
# backend (IsPIIEnabled/LoadPIIMapping do not special-case it), and the
# token_spans decoder needs it to resolve labels. This profile never runs
# local inference, so a minimal stand-in mapping from the ConfigMap in
# pii-mapping-configmap.yaml, applied as a prerequisite, is enough; no need
# to bake or download the real model.
extraVolumes:
  - name: pii-mapping
    configMap:
      name: pii-remote-backend-mapping
extraVolumeMounts:
  - name: pii-mapping
    mountPath: /app/models/pii-remote-backend/pii_type_mapping.json
    subPath: pii_type_mapping.json
    readOnly: true

resources:
  # Same headroom as the complexity backend profile: taking the classifier
  # off-box does not avoid the startup embedding-model load, which is gated
  # separately from the classifier backend.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
