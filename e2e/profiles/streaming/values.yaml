config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: base-model
      reasoning_effort: high
    models:
      - name: base-model
        reasoning:
          family: qwen3
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
      # envoy-full-duplex-routing: the full-duplex gateway routes on this model
      # name, and its backend checks this provider path and credential.
      - name: full-duplex-provider
        backend_refs:
          - name: full-duplex-selected
            provider: vllm
            endpoint: full-duplex-selected.default.svc.cluster.local:8000
            chat_path: /provider/v1/chat/completions
            auth:
              api_key_env: FULL_DUPLEX_PROVIDER_KEY
  recipes:
    - name: default
      decisions:
        # ── Security layer: block before routing (priority 1000+) ──
        # These decisions verify that fast_response blocking works correctly
        # even when the request body arrives in Envoy streamed chunks.
        - name: block_jailbreak
          description: Block jailbreak attempts in streamed body mode
          priority: 1000
          rules:
            operator: OR
            conditions:
              - type: jailbreak
                name: jailbreak_standard
          plugins:
            - type: fast_response
              configuration:
                message: "I'm sorry, but I cannot process this request as it appears to violate our usage policies."
        - name: block_pii
          description: Block requests containing PII in streamed body mode
          priority: 999
          rules:
            operator: OR
            conditions:
              - type: pii
                name: pii_deny_all
          plugins:
            - type: fast_response
              configuration:
                message: "Your request contains personal information that cannot be processed."
        - name: code_keywords_decision
          description: Code and programming queries (BM25 classified)
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: code_keywords
          modelRefs:
            - model: base-model
              use_reasoning: true
          plugins:
            - type: system_prompt
              configuration:
                system_prompt: You are an expert software engineer.
        - name: urgent_request_decision
          description: Urgent and time-sensitive requests (N-gram classified)
          priority: 150
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: urgent_request
          modelRefs:
            - model: base-model
              use_reasoning: false
        - name: general_decision
          description: Catch-all with semantic cache for all unmatched requests
          priority: 50
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: base-model
              use_reasoning: false
          plugins:
            - type: response_cache
              configuration:
                enabled: true
                scope: global
                semantic: {match: {recall: {top_k: 3, min_similarity: 0.6}}}
      signals:
        keywords:
          - name: code_keywords
            operator: OR
            method: bm25
            keywords:
              - code
              - function
              - implement
              - debug
              - algorithm
              - compile
              - syntax
              - variable
              - loop
              - refactor
            bm25_threshold: 0.1
            case_sensitive: false
          - name: urgent_request
            operator: OR
            method: ngram
            keywords:
              - urgent
              - immediate
              - asap
              - emergency
            ngram_threshold: 0.4
            ngram_arity: 3
            case_sensitive: false
          - name: sensitive_data
            operator: AND
            keywords:
              - SSN
              - credit card
            case_sensitive: false
        jailbreak:
          - name: jailbreak_standard
            description: Standard jailbreak detection for streaming tests
            predicate:
              gte: 0.88
        pii:
          - name: pii_deny_all
            description: Block all PII
            predicate:
              gte: 0.18
  global:
    model_catalog:
      deployments:
        # provider-mocker's System One fixture answers the jailbreak and PII
        # rules, so the shared detection cases are pinned by their markers
        # (tools/test/services/provider-mocker/README.md).
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          schema: vllm-sr/4.0
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
      bindings:
        jailbreak: fake-systemone
        pii: fake-systemone
    router:
      streamed_body:
        enabled: true
        # The positive large-body case is ~80 KiB. Keep a small, explicit
        # ceiling so the streamed-body rejection E2E can exercise HTTP 413.
        max_bytes: 131072
        # A deliberately paused chunked upload exercises HTTP 408 while
        # staying below Envoy's 60-second request and ExtProc timeouts.
        timeout_sec: 3
      # Already the default; the FULL_DUPLEX_STREAMED gateway depends on it to
      # re-select its route on the Router's routing headers.
      clear_route_cache: true
      strategy: priority
    services:
      api:
        batch_classification:
          max_batch_size: 100
      observability:
        tracing:
          enabled: true
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
    stores:
      response_cache:
        backend_type: memory
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo

# The full-duplex backend checks this test credential; the Router reads it from
# the environment, never from its configuration.
extraEnv:
  - name: FULL_DUPLEX_PROVIDER_KEY
    value: e2e-provider-credential
