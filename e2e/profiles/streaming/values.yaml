config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      reasoning_families:
        base-model:
          type: chat_template_kwargs
          parameter: enable_thinking
    models:
    - name: base-model
      provider_model_id: base-model
      backend_refs:
      - provider: vllm
        endpoint: http://vllm-llama3-8b-instruct.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
      reasoning_family: base-model
  routing:
    modelCards:
    - name: base-model
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals:
        keywords:
        - name: code_keywords
          operator: OR
          method: bm25
          keywords:
          - code
          - function
          - implement
          - debug
          - algorithm
          - compile
          - syntax
          - variable
          - loop
          - refactor
          bm25_threshold: 0.1
          case_sensitive: false
        - name: urgent_request
          operator: OR
          method: ngram
          keywords:
          - urgent
          - immediate
          - asap
          - emergency
          ngram_threshold: 0.4
          ngram_arity: 3
          case_sensitive: false
        - name: sensitive_data
          operator: AND
          keywords:
          - SSN
          - credit card
          case_sensitive: false
        domains:
        - name: code_keywords
          description: Programming and software development queries
          mmlu_categories:
          - computer science
        - name: urgent_request
          description: Urgent and time-sensitive requests
        - name: sensitive_data
          description: Requests involving sensitive personal data
        - name: business
          description: Business and management related queries
          mmlu_categories:
          - business
        - name: other
          description: General knowledge and miscellaneous topics
          mmlu_categories:
          - other
        jailbreak:
        - name: jailbreak_standard
          threshold: 0.6
          include_history: false
          description: Standard jailbreak detection for streaming tests
        pii:
        - name: pii_deny_all
          threshold: 0.4
          include_history: false
          description: Block all PII
      decisions:
      - name: block_jailbreak
        description: Block jailbreak attempts in streamed body mode
        priority: 1000
        rules:
          operator: OR
          conditions:
          - type: jailbreak
            name: jailbreak_standard
        plugins:
        - type: fast_response
          configuration:
            message: I'm sorry, but I cannot process this request as it appears to
              violate our usage policies.
      - name: block_pii
        description: Block requests containing PII in streamed body mode
        priority: 999
        rules:
          operator: OR
          conditions:
          - type: pii
            name: pii_deny_all
        plugins:
        - type: fast_response
          configuration:
            message: Your request contains personal information that cannot be processed.
      - name: code_keywords_decision
        description: Code and programming queries (BM25 classified)
        priority: 150
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: code_keywords
        plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are an expert software engineer.
      - name: urgent_request_decision
        description: Urgent and time-sensitive requests (N-gram classified)
        priority: 150
        rules:
          operator: AND
          conditions:
          - type: keyword
            name: urgent_request
      - name: general_decision
        description: Catch-all with semantic cache for all unmatched requests
        priority: 50
        rules:
          operator: AND
          conditions: []
        plugins:
        - type: response_cache
          configuration:
            enabled: true
            scope: global
            semantic:
              similarity_threshold: 0.6
  entrypoints:
  - model_names:
    - vllm-sr/auto
    - auto
    recipe: default
    assignments:
      block_jailbreak:
        models:
        - model: base-model
          weight: '1'
      block_pii:
        models:
        - model: base-model
          weight: '1'
      code_keywords_decision:
        models:
        - model: base-model
          weight: '1'
          reasoning:
            enabled: true
      urgent_request_decision:
        models:
        - model: base-model
          weight: '1'
      general_decision:
        models:
        - model: base-model
          weight: '1'
  global:
    model_catalog:
      kbs: []
      embeddings: {}
      modules:
        classifier: {}
        hallucination_mitigation: {}
    router:
      streamed_body:
        enabled: true
        max_bytes: 10485760
        timeout_sec: 30
    services:
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
      observability:
        tracing:
          enabled: true
          provider: opentelemetry
          exporter:
            type: otlp
            endpoint: jaeger:4317
            insecure: true
          sampling:
            type: always_on
            rate: 1.0
          resource:
            service_name: vllm-semantic-router
            service_version: v0.1.0
            deployment_environment: development
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        enabled: true
        backend_type: memory
        similarity_threshold: 0.6
        max_entries: 1000
        ttl_seconds: 3600
        eviction_policy: fifo
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations:
      tools:
        enabled: true
        top_k: 3
        similarity_threshold: 0.2
        tools_db_path: config/tools_db.json
        fallback_to_empty: true
