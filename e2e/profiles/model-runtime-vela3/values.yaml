# vela3-fast on CPU, served by the Router's managed model runtime as the
# default decision deployment. Opt-in: the runtime downloads about 6.6 GB from
# the Hugging Face Hub at start-up, so this profile is not part of the CPU CI
# lanes.
#
# - The built-in prompt guard and PII signals run on the default deployment
#   (primary, vllm-sr/vela3-fast) at its calibrated thresholds;
# - decision signals ask the same deployment a Noul question (the decision
#   backbone) and a names-only span question (the entity adapter).
#
# testcases/model_runtime_vela3.go asserts the routes clear prompts take, and
# that the Router matches each decision signal exactly when vela3-fast's own
# answer passes its predicate.
config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # Both are among the names the shared AIGatewayRoute matches.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
      - name: math-expert
        provider_model_id: math-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
      - name: math-expert
    signals:
      pii:
        - name: personal_data
          # vela3-fast's calibrated PII threshold (docs/records/vela3-router-signals.md).
          threshold: 0.18
          description: Any personal information.
      jailbreak:
        - name: prompt_attack
          # vela3-fast's calibrated prompt guard threshold.
          threshold: 0.88
          description: Prompt injection or jailbreak.
      decision:
        - name: account_access
          description: The request needs access to the customer's account.
          deployment: primary
          question:
            type: noul
            instructions: Does answering this request need access to the customer's account?
          predicate:
            gte: 0.7
          timeout_ms: 30000
        - name: order_numbers
          description: The request quotes an order or account number.
          deployment: primary
          question:
            type: span
            instructions: Which spans are named entities of these types?
            labels:
              - key: order number
          predicate:
            gte: 0.8
          timeout_ms: 30000
    decisions:
      - name: jailbreak_route
        description: A prompt attack
        priority: 500
        rules:
          operator: AND
          conditions:
            - {type: jailbreak, name: prompt_attack}
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: pii_route
        description: The request carries personal data
        priority: 400
        rules:
          operator: AND
          conditions:
            - {type: pii, name: personal_data}
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: order_route
        description: vela3-fast finds an order number in the request
        priority: 300
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - {type: decision, name: order_numbers, label: order number}
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: account_route
        description: vela3-fast says the request needs the customer's account
        priority: 200
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - {type: decision, name: account_access}
        modelRefs:
          - model: math-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
      deployments:
        primary:
          provider: model_runtime
          artifact: vllm-sr/vela3-fast
          revision: 7cbefd4b92b57234bd0ffb9872451e81abcdac79
          device: cpu
      system:
        decision_model:
          deployment: primary
      modules:
        classifier:
          pii:
            use_cpu: true
        prompt_guard:
          enabled: true
          use_cpu: true
        hallucination_mitigation:
          enabled: false

extraEnv:
  # Where the managed runtimes' sockets live, so the cases can ask vela3-fast directly.
  - name: VLLM_SRUN_DIR
    value: /tmp/vsr-runtime

resources:
  requests:
    memory: 8Gi
    cpu: "4"
  limits:
    memory: 24Gi
    cpu: "8"

persistence:
  enabled: false
