config:
  version: v0.5
  listeners: []
  providers:
    # No provider default, so the e2e-no-route recipe below gets a real
    # no_route rather than a fallback model. null removes the chart's own
    # placeholder default, which config: merges in otherwise.
    defaults: null
    models:
      - name: base-model
        provider_model_id: base-model
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  entrypoints:
    - model_names: [vllm-sr/auto]
      recipe: default
      default: true
    - model_names: [e2e-no-route]
      recipe: no-route
  recipes:
    - name: no-route
      decisions: []
    - name: default
      signals:
        systemone:
          - name: billing_support
            deployment: fake-systemone
            question:
              type: noul
              instructions: 'Is the request about any of these: billing invoice payment subscription refund pricing credit card account balance?'
      decisions:
        - name: billing-route
          description: Route billing requests the billing_support rule matches
          priority: 200
          rules:
            operator: AND
            conditions:
              - type: systemone
                name: billing_support
          modelRefs:
            - model: base-model
              use_reasoning: false
          plugins:
            # Reuses a billing answer for a paraphrase: recall embeds the request
            # with the remote embedding deployment, and the same_request judge on
            # the System One fixture confirms the candidate.
            - type: response_cache
              configuration:
                enabled: true
                # The e2e requests carry no user identity to partition by.
                scope: global
                semantic:
                  match:
                    recall: {top_k: 1, min_similarity: 0.9}
                    judge: {preset: same_request, deployment: fake-systemone, min_score: 0.5, on_error: fail}
        - name: default-route
          description: Fallback when billing_support does not match
          priority: 10
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: base-model
              use_reasoning: false
  global:
    router:
      strategy: priority
    services:
      response_api:
        enabled: false
    stores:
      # The semantic response cache is the recall consumer that prepares the
      # remote embedding deployment.
      response_cache:
        backend_type: memory
        embedding: {deployment: remote-embedding}
        max_entries: 100
        ttl_seconds: 3600
        eviction_policy: fifo
    model_catalog:
      deployments:
        # provider-mocker's System One fixture answers billing_support, so the
        # routing cases are pinned by their markers
        # (tools/test/services/provider-mocker/README.md).
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          schema: vllm-sr/4.0
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
        remote-embedding:
          provider: openai_embeddings
          endpoint: http://mock-embedding.default.svc.cluster.local:8000/v1
          model: e2e-remote-embedding
          auth:
            api_key_env: REMOTE_EMBEDDING_E2E_KEY
          timeout_ms: 5000
          max_retries: 1
          capabilities:
            dimensions: 4
      embeddings:
        default: {deployment: remote-embedding}
extraEnv:
  - name: REMOTE_EMBEDDING_E2E_KEY
    value: e2e-embedding-key

resources:
  limits:
    memory: 2Gi
    cpu: "2"
  requests:
    memory: 512Mi
    cpu: 250m
