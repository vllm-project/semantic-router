config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      model: base-model
    models:
      - name: base-model
        provider_model_id: base-model
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: base-model
    signals:
      systemone:
        - name: billing_support
          deployment: fake-systemone
          question:
            type: noul
            instructions: 'Is the request about any of these: billing invoice payment subscription refund pricing credit card account balance?'
    decisions:
      - name: billing-route
        description: Route billing requests the billing_support rule matches
        priority: 200
        rules:
          operator: AND
          conditions:
            - type: systemone
              name: billing_support
        modelRefs:
          - model: base-model
            use_reasoning: false
      - name: default-route
        description: Fallback when billing_support does not match
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: base-model
            use_reasoning: false
  global:
    router:
      strategy: priority
    services:
      response_api:
        enabled: false
      router_replay:
        enabled: false
    stores:
      response_cache:
        enabled: false
    model_catalog:
      deployments:
        # provider-mocker's System One fixture answers billing_support, so the
        # routing cases are pinned by their markers
        # (tools/test/services/provider-mocker/README.md).
        fake-systemone:
          provider: systemone
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1/systemone
          model: e2e/fake-systemone
          timeout_ms: 5000
          capabilities:
            question_types: [choice, noul, span]
        remote-embedding:
          provider: openai_embeddings
          endpoint: http://mock-embedding.default.svc.cluster.local:8000/v1
          model: e2e-remote-embedding
          auth:
            api_key_env: REMOTE_EMBEDDING_E2E_KEY
          timeout_ms: 5000
          max_retries: 1
          capabilities:
            dimensions: 4
      embeddings:
        default: remote-embedding
        semantic:
          qwen3_model_path: ""
          mmbert_model_path: ""
          multimodal_model_path: ""
          use_cpu: true
          embedding_config:
            preload_embeddings: false
            target_dimension: 4
            top_k: 1
            min_score_threshold: 0.9
extraEnv:
  - name: REMOTE_EMBEDDING_E2E_KEY
    value: e2e-embedding-key

resources:
  limits:
    memory: 2Gi
    cpu: "2"
  requests:
    memory: 512Mi
    cpu: 250m
