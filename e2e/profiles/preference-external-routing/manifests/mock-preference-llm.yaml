apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-preference-llm
  namespace: default
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    EXPECTED_AUTH = "Bearer e2e-preference-key"
    TERSE_MARKER = "__PREFERENCE_TERSE__"
    DETAILED_MARKER = "__PREFERENCE_DETAILED__"

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def send_json(self, status, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
                return
            self.send_json(404, {"error": "not found"})

        def do_POST(self):
            if self.headers.get("Authorization") != EXPECTED_AUTH:
                self.send_json(401, {"error": "invalid bearer token"})
                return
            if self.path != "/v1/chat/completions":
                self.send_json(404, {"error": "not found"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
                messages = payload.get("messages", [])
            except (TypeError, ValueError, json.JSONDecodeError):
                self.send_json(400, {"error": "invalid request"})
                return

            # The real router prompt puts the candidate routes and the
            # conversation in the same user message, so a plain substring
            # check on the full message text is enough to pick a route
            # deterministically - no actual reasoning needed here.
            text = " ".join(str(message.get("content", "")) for message in messages)
            if TERSE_MARKER in text:
                route = "terse_answers"
            elif DETAILED_MARKER in text:
                route = "detailed_answers"
            else:
                route = "other"

            content = json.dumps({"route": route})
            self.send_json(200, {"choices": [{"message": {"content": content}}]})

    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-preference-llm
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-preference-llm
  template:
    metadata:
      labels:
        app: mock-preference-llm
    spec:
      containers:
        - name: mock-preference-llm
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: mock-preference-llm
---
apiVersion: v1
kind: Service
metadata:
  name: mock-preference-llm
  namespace: default
spec:
  selector:
    app: mock-preference-llm
  ports:
    - name: http
      port: 8000
      targetPort: http
