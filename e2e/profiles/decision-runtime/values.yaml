config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # Both models are among the six names the shared AIGatewayRoute matches
      # (math-, science-, social-, humanities-, law- and general-expert).
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
      - name: math-expert
        provider_model_id: math-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
      - name: math-expert
    signals:
      # Questions to the model runtime. testcases/decision_runtime_routing.go
      # mirrors these questions to compare the Router with the runtime itself.
      decision:
        - name: answered
          description: Matches whenever the runtime answers; P(true) is in [0, 1].
          deployment: decision-fixture
          question:
            type: noul
            instructions: Is this request about software?
          predicate:
            gte: 0
          timeout_ms: 10000
        - name: request_kind
          description: Which kind of work the request asks for.
          deployment: decision-fixture
          question:
            type: choice
            instructions: What kind of work does this request ask for?
            choices:
              - key: code
                description: Writing, reviewing or debugging code
              - key: math
                description: Mathematics or quantitative reasoning
              - key: chat
                description: Anything else
          timeout_ms: 10000
        - name: offline
          description: Asks a deployment with no runtime behind it.
          deployment: decision-offline
          question:
            type: noul
            instructions: Is this request about software?
          predicate:
            gte: 0
    decisions:
      # An unknown answer must never match: the offline deployment never
      # answers, so this route stays unreachable.
      - name: offline_route
        description: Fails open; never selected
        priority: 300
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - type: decision
              name: offline
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: selector_route
        description: The runtime answered; it also chooses the model
        priority: 200
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - type: decision
              name: answered
        modelRefs:
          - model: general-expert
            use_reasoning: false
          - model: math-expert
            use_reasoning: false
        algorithm:
          type: decision
          decision:
            deployment: decision-fixture
            instructions: Which model should answer this request?
            candidates:
              general-expert: General assistant for everyday requests
              math-expert: Specialist for mathematics and quantitative reasoning
            timeout_ms: 10000
      - name: request_kind_route
        description: Keeps the choice question in use; reached when the runtime is unready
        priority: 100
        rules:
          operator: OR
          on_unknown: no_match
          conditions:
            - type: decision
              name: request_kind
              label: code
            - type: decision
              name: request_kind
              label: math
            - type: decision
              name: request_kind
              label: chat
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
      deployments:
        decision-fixture:
          provider: model_runtime
          endpoint: http://decision-runtime.default.svc.cluster.local:8100
        decision-offline:
          provider: model_runtime
          endpoint: http://decision-runtime-offline.default.svc.cluster.local:8100

resources:
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
