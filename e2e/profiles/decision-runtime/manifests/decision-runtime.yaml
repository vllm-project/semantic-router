# The model runtime serving a tiny random-weight Decision 2.0 fixture on CPU.
# The fixture is written at start-up, so the image stays a plain runtime image
# and the test needs no model download.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-runtime
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decision-runtime
  template:
    metadata:
      labels:
        app: decision-runtime
    spec:
      containers:
        - name: runtime
          image: semantic-router-ci/model-runtime:e2e-test
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              vllm-sr-runtime fixture /tmp/decision-fixture --backbone qwen3 --seed 0
              && exec vllm-sr-runtime serve /tmp/decision-fixture
              --device cpu --host 0.0.0.0 --port 8100 --offline --threads 2
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: decision-runtime
  namespace: default
spec:
  selector:
    app: decision-runtime
  ports:
    - name: http
      port: 8100
      targetPort: http
