replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
        capabilities: [chat]
      - name: mock/native-responses
        api_format: responses
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      # A dedicated file-capable fixture keeps serialization probes independent
      # of catalog capabilities. The alias forces Responses re-encoding.
      - name: mock/inline-file-responses
        provider_model_id: inline-file-backend
        api_format: responses
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
        capabilities: [chat, file_input]
      # Exercise Ollama's OpenAI-compatible Chat boundary against the same
      # provider fixture while retaining Ollama-specific request projection.
      - name: mock/ollama-chat
        backend_refs:
          - name: ollama-fixture
            provider: ollama
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
        capabilities: [chat]
      - name: mock/vision
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
        capabilities:
          - chat
          - image_input
      # Identical Chat candidates tie under hybrid scoring, so only
      # prompt_cache_key affinity can move a request off the first one.
      - name: mock/cache-affinity-a
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      - name: mock/cache-affinity-b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
      # The hosted image_generation operation is expressible on the Responses
      # wire only, so this card names a Responses-capable backend. The chat-wire
      # cards above deliberately stay without it: the dispatch must reject the
      # mixed request instead of degrading it into a text call.
      - name: mock/image-generation
        api_format: responses
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
        capabilities:
          - chat
          - image_generation
      # Built-in catalog coverage: the card supplies the provider-native model ID,
      # reasoning family, pricing, limits, capabilities, and presentation.
      - name: astra-chat
        catalog: openai/gpt-6-astra
        backend_refs:
          - name: mock-openai
            provider: openai
            endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1
            auth:
              api_key_env: VSR_E2E_OPENAI_API_KEY
      - name: astra-responses
        catalog: openai/gpt-6-astra
        api_format: responses
        backend_refs:
          - name: mock-openai
            provider: openai
            endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1
            auth:
              api_key_env: VSR_E2E_OPENAI_API_KEY
      # This catalog binding uses Responses with a chat_template_kwargs
      # reasoning transport. Route a dedicated probe through a decision so
      # provider adaptation runs before dispatch to the simulator.
      - name: nemotron-summary-responses
        catalog: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
        api_format: responses
        backend_refs:
          - name: mock-compactifai
            provider: compactifai
            endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1
            auth:
              api_key_env: VSR_E2E_OPENAI_API_KEY
  recipes:
    - name: default
      decisions:
        - name: reasoning_summary_template_decision
          description: Exercise Responses summary projection through a chat template provider transport.
          priority: 110
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: reasoning_summary_template_probe
          modelRefs:
            - model: nemotron-summary-responses
              use_reasoning: true
        - name: cache_affinity_seed_decision
          description: Serve a key's first request from the candidate the tie does not pick.
          priority: 105
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: cache_affinity_seed
          modelRefs:
            - model: mock/cache-affinity-b
        - name: cache_affinity_decision
          description: Tie two identical candidates under multi_factor selection.
          priority: 105
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: cache_affinity_probe
          modelRefs:
            - model: mock/cache-affinity-a
            - model: mock/cache-affinity-b
          algorithm:
            type: multi_factor
            multi_factor:
              weights: {quality: 0.2, cost: 0.1}
        - name: default_decision
          description: Default catch-all decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
        - name: input_modality_vision_decision
          description: Send image-bearing requests to the vision route, including input_image parts that reference an uploaded file_id.
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: input_modality
                name: image_input
          modelRefs:
            - model: mock/vision
              use_reasoning: false
        - name: input_modality_text_decision
          description: Text-only requests continue on the default route.
          priority: 50
          rules:
            operator: AND
            conditions:
              - type: input_modality
                name: text_input
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
      signals:
        keywords:
          - name: reasoning_summary_template_probe
            operator: OR
            keywords:
              - reasoning_summary_template_probe
          - name: cache_affinity_seed
            operator: OR
            keywords:
              - cache_affinity_seed_probe
          - name: cache_affinity_probe
            operator: OR
            keywords:
              - cache_affinity_followup_probe
        input_modality:
          - name: image_input
            description: Request contains at least one image content part.
            modality: image
          - name: text_input
            description: Request contains user-provided text.
            modality: text
  global:
    model_catalog:
      deployments:
        # provider-mocker's embedding fixture (see its README) stands in for
        # the embedding model, so the Router downloads none.
        fixture-embedding:
          provider: openai_embeddings
          endpoint: http://provider-mocker.default.svc.cluster.local:8000/v1
          model: e2e/fixture-embedding
          timeout_ms: 5000
          capabilities:
            dimensions: 256
      embeddings:
        default: {deployment: fixture-embedding}
    router:
      strategy: priority
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 86400
        max_responses: 1000
      api:
        batch_classification:
          max_batch_size: 100
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    stores:
      vector_store:
        enabled: true
        backend_type: memory
    integrations: {}
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false

extraEnv:
  - name: VSR_E2E_OPENAI_API_KEY
    value: astra-fixture-key
