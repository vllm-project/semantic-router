config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared AIGatewayRoute
      # in deploy/kubernetes/ai-gateway/aigw-resources/ matches x-ai-eg-model
      # exactly against six names (math-, science-, social-, humanities-, law-
      # and general-expert). A model outside that list has no route, so every
      # request 404s at the gateway while the router itself stays healthy and
      # logs a correctly selected backend - which is what made this look like a
      # router bug rather than a routing one.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      context:
        - name: long_context
          description: Requests estimated at 500 tokens or more.
          min_tokens: 500
    decisions:
      - name: long_context_routing
        description: Route requests whose estimated token count matches the long_context band.
        priority: 2000
        rules:
          operator: AND
          conditions:
            - type: context
              name: long_context
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route for requests below the long_context threshold
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000

resources:
  # 2Gi OOMKills the router on a CI runner: it restarts, never becomes ready,
  # and the helm wait burns its full 60m timeout. Mirrors the same limits
  # category-remote-backend/local-classifier-backend settled on for the same
  # reason.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
