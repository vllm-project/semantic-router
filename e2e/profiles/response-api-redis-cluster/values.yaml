replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/extproc
  tag: latest
  pullPolicy: Never
config:
  version: v0.3
  listeners: []
  providers:
    models:
    - name: openai/gpt-oss-20b
      provider_model_id: openai/gpt-oss-20b
      backend_refs:
      - provider: vllm
        endpoint: http://mock-vllm.default.svc.cluster.local:8000/v1
      control:
        timeout:
          request: 300s
          stream: 300s
  routing:
    modelCards:
    - name: openai/gpt-oss-20b
  recipes:
  - name: default
    description: Default routing recipe.
    routing:
      signals:
        domains:
        - name: other
          description: General knowledge and miscellaneous topics
          mmlu_categories:
          - other
      decisions:
      - name: default_decision
        description: Default catch-all decision
        priority: 1
        rules:
          operator: OR
          conditions:
          - type: domain
            name: other
  entrypoints:
  - model_names:
    - vllm-sr/auto
    - auto
    recipe: default
    assignments:
      default_decision:
        models:
        - model: openai/gpt-oss-20b
          weight: '1'
  global:
    router: {}
    services:
      response_api:
        enabled: true
        store_backend: redis
        ttl_seconds: 10
        max_responses: 1000
        redis:
          cluster_mode: true
          cluster_addresses:
          - redis-cluster-0.redis-cluster.default.svc.cluster.local:6379
          - redis-cluster-1.redis-cluster.default.svc.cluster.local:6379
          - redis-cluster-2.redis-cluster.default.svc.cluster.local:6379
          key_prefix: 'sr:'
          pool_size: 10
          min_idle_conns: 2
          max_retries: 3
          dial_timeout: 5
          read_timeout: 3
          write_timeout: 3
      api:
        batch_classification:
          max_batch_size: 100
          concurrency_threshold: 5
          max_concurrency: 8
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
      backend_dispatch:
        bind_address: 0.0.0.0
        port: 8180
        audience: vllm-sr.backend-dispatch
        capability_ttl: 30s
        max_request_body_bytes: 67108864
      backend_egress:
        policy_file: /app/config/backend-egress-policy.yaml
    stores:
      response_cache:
        embedding_model: mmbert
      memory:
        embedding_model: mmbert
      vector_store:
        embedding_model: mmbert
    integrations: {}
    model_catalog:
      kbs: []
      modules:
        prompt_guard:
          enabled: false
          model_ref: ''
          model_id: ''
          jailbreak_mapping_path: ''
        classifier:
          domain:
            model_ref: ''
            model_id: ''
            category_mapping_path: ''
            use_mmbert_32k: false
          pii:
            model_ref: ''
            model_id: ''
            pii_mapping_path: ''
            use_mmbert_32k: false
        hallucination_mitigation: {}
      embeddings: {}
resources:
  limits:
    cpu: '2'
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi
persistence:
  enabled: false
