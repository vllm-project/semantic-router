replicaCount: 1
image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: latest
  pullPolicy: Never
config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      model: openai/gpt-oss-20b
    models:
      - name: openai/gpt-oss-20b
        backend_refs:
          - name: test-endpoint
            provider: vllm
            endpoint: provider-mocker.default.svc.cluster.local:8000
            weight: 1
  recipes:
    - name: default
      decisions:
        - name: default_decision
          description: Default catch-all decision
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: openai/gpt-oss-20b
              use_reasoning: false
  global:
    router:
      strategy: priority
    services:
      response_api:
        enabled: true
        store_backend: redis
        ttl_seconds: 10
        max_responses: 1000
        redis:
          cluster_mode: true
          cluster_addresses:
            - redis-cluster-0.redis-cluster.default.svc.cluster.local:6379
            - redis-cluster-1.redis-cluster.default.svc.cluster.local:6379
            - redis-cluster-2.redis-cluster.default.svc.cluster.local:6379
          key_prefix: 'sr:'
          pool_size: 10
          min_idle_conns: 2
          max_retries: 3
          dial_timeout: 5
          read_timeout: 3
          write_timeout: 3
      api:
        batch_classification:
          max_batch_size: 100
          metrics:
            enabled: true
            detailed_goroutine_tracking: false
            high_resolution_timing: false
            sample_rate: 1.0
      observability:
        tracing:
          enabled: false
    integrations: {}
resources:
  limits:
    cpu: '2'
    memory: 10Gi
  requests:
    cpu: 500m
    memory: 2Gi

# E2E/Kind: disable PVC for reliable CI (same as other e2e profiles).
persistence:
  enabled: false
