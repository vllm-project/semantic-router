config:
  version: v0.3
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared AIGatewayRoute
      # in deploy/kubernetes/ai-gateway/aigw-resources/ matches x-ai-eg-model
      # exactly against six names (math-, science-, social-, humanities-, law-
      # and general-expert). A model outside that list has no route, so every
      # request 404s at the gateway while the router itself stays healthy and
      # logs a correctly selected backend - which is what made this look like a
      # router bug rather than a routing one.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  routing:
    modelCards:
      - name: general-expert
    signals:
      structure:
        - name: many_questions
          description: Prompts that contain many explicit questions.
          feature:
            type: count
            source:
              type: regex
              pattern: '[?？]'
          predicate:
            gte: 4
        - name: numbered_steps
          description: Prompts that contain numbered list items such as "1. ..."
          feature:
            type: exists
            source:
              type: regex
              pattern: '(?m)^\s*\d+\.\s+'
    decisions:
      - name: many_questions_routing
        description: Route requests whose structure signal matches many_questions.
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: structure
              name: many_questions
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: numbered_steps_routing
        description: Route requests whose structure signal matches numbered_steps.
        priority: 90
        rules:
          operator: AND
          conditions:
            - type: structure
              name: numbered_steps
        modelRefs:
          - model: general-expert
            use_reasoning: false
      - name: default-route
        description: Fallback route for requests matching no structure rule.
        priority: 10
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: general-expert
            use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog:
      kbs: []
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000

resources:
  # 2Gi OOMKills the router on a CI runner: it restarts, never becomes ready,
  # and the helm wait burns its full 60m timeout. Mirrors the same limits
  # category-remote-backend/local-classifier-backend/long-context-routing
  # settled on for the same reason.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
