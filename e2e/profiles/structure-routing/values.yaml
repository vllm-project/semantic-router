config:
  version: v0.5
  listeners: []
  providers:
    defaults:
      # general-expert, not a profile-specific name: the shared AIGatewayRoute
      # in deploy/kubernetes/ai-gateway/aigw-resources/ matches x-ai-eg-model
      # exactly against six names (math-, science-, social-, humanities-, law-
      # and general-expert). A model outside that list has no route, so every
      # request 404s at the gateway while the router itself stays healthy and
      # logs a correctly selected backend - which is what made this look like a
      # router bug rather than a routing one.
      model: general-expert
    models:
      - name: general-expert
        provider_model_id: general-expert
        backend_refs:
          - name: local-vllm
            provider: vllm
            endpoint: vllm-llama3-8b-instruct.default.svc.cluster.local:8000
            weight: 1
  recipes:
    - name: default
      signals:
        keywords:
          - name: many_questions
            description: Prompts that contain many explicit questions.
            operator: OR
            method: regex
            keywords: ['[?？]']
            count:
              gte: 4
          - name: numbered_steps
            description: Prompts that contain numbered list items such as "1. ..."
            operator: OR
            method: regex
            keywords: ['(?m)^\s*\d+\.\s+']
      decisions:
        - name: many_questions_routing
          description: Route requests with four or more explicit questions.
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: many_questions
          modelRefs:
            - model: general-expert
              use_reasoning: false
        - name: numbered_steps_routing
          description: Route requests that contain numbered steps.
          priority: 90
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: numbered_steps
          modelRefs:
            - model: general-expert
              use_reasoning: false
        - name: default-route
          description: Fallback route for requests matching no request-shape rule.
          priority: 10
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: general-expert
              use_reasoning: false
  global:
    router:
      strategy: priority
    model_catalog: {}
    services:
      response_api:
        enabled: true
        store_backend: memory
        ttl_seconds: 3600
        max_responses: 1000

resources:
  # 2Gi OOMKills the router on a CI runner: it restarts, never becomes ready,
  # and the helm wait burns its full 60m timeout. Mirrors the same limits
  # long-context-routing and conversation-routing settled on for the same
  # reason.
  limits:
    memory: 6Gi
    cpu: "2"
  requests:
    memory: 2Gi
    cpu: 250m
