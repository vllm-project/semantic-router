version: v0.3
listeners:
- name: http-8888
  address: 0.0.0.0
  port: 8888
  timeout: 300s
providers:
  models:
  - name: qwen3
    provider_model_id: qwen3
    backend_refs:
    - provider: vllm
      endpoint: http://host.docker.internal:8000/v1
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: qwen3
    capabilities:
    - text
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      keywords:
      - name: no_memory_trigger
        operator: OR
        keywords:
        - NOMEM_MARKER
      - name: custom_threshold_trigger
        operator: OR
        keywords:
        - THRESHOLD_MARKER
    decisions:
    - name: no_memory_route
      description: Route with memory explicitly disabled for per-decision testing
      priority: 200
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: no_memory_trigger
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a helpful assistant. Memory access is disabled for
            this route.
          mode: insert
      - type: memory
        configuration:
          enabled: false
    - name: custom_threshold_route
      description: Route with high similarity threshold for per-decision testing
      priority: 150
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: custom_threshold_trigger
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are a helpful assistant with strict memory matching.
          mode: insert
      - type: memory
        configuration:
          enabled: true
          retrieval_limit: 5
          similarity_threshold: 0.99
          auto_store: true
    - name: default_route
      description: Default route for memory testing
      priority: 1
      rules:
        operator: AND
        conditions: []
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are MoM, a helpful AI assistant with memory. You remember
            important facts about users and use this context to provide personalized
            assistance.
          mode: insert
      - type: memory
        configuration:
          enabled: true
          retrieval_limit: 5
          similarity_threshold: 0.1
          auto_store: true
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    no_memory_route:
      models:
      - model: qwen3
        weight: '1'
    custom_threshold_route:
      models:
      - model: qwen3
        weight: '1'
    default_route:
      models:
      - model: qwen3
        weight: '1'
global:
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    memory:
      enabled: true
      auto_store: true
      milvus:
        address: host.docker.internal:19530
        collection: memory_test_ci
        dimension: 384
      embedding_model: mmbert
      default_retrieval_limit: 5
      default_similarity_threshold: 0.1
    response_cache:
      enabled: false
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ''
        gemma_model_path: ''
        mmbert_model_path: /app/models/mmbert-embed-32k-2d-matryoshka
        multimodal_model_path: ''
        bert_model_path: ''
        use_cpu: true
        embedding_config:
          model_type: mmbert
          target_dimension: 384
    modules:
      classifier: {}
      hallucination_mitigation: {}
  router: {}
  integrations: {}
