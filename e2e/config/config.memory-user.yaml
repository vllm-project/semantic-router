version: v0.5
listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 300s
    # The tests stand in for an authenticating proxy: they send x-authz-user-id.
    identity:
      trust_headers: true
providers:
  defaults:
    model: qwen3
  models:
    - name: qwen3
      provider_model_id: qwen3
      backend_refs:
        - name: provider_mocker
          provider: vllm
          weight: 1
          endpoint: host.docker.internal:8000
          protocol: http
recipes:
  - name: default
    signals:
      keywords:
        - name: persistence_receipt_trigger
          operator: OR
          keywords: [PERSISTENCE_RECEIPT_MARKER]
        - name: no_memory_trigger
          operator: OR
          keywords: [NOMEM_MARKER]
        - name: custom_threshold_trigger
          operator: OR
          keywords: [THRESHOLD_MARKER]
        - name: zero_threshold_trigger
          operator: OR
          keywords: [MEMORY_ZERO_MARKER]
        - name: calibrated_threshold_trigger
          operator: OR
          keywords: [MEMORY_CALIBRATED_MARKER]
    decisions:
      # Dedicated route so receipt assertions are not disturbed by other traffic.
      # Retrieval stays fail-open during the backend outage the receipt tests cause.
      - name: persistence_receipt_route
        description: Route for request-correlated persistence receipts
        priority: 250
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: persistence_receipt_trigger
        modelRefs:
          - model: qwen3
            use_reasoning: false
        plugins:
          - type: router_replay
            configuration:
              enabled: true
              max_records: 256
              capture_request_body: false
              capture_response_body: false
          - type: context
            configuration:
              enabled: true
              sources:
                - type: memory
                  store:
                    auto: true
      # Triggered by NOMEM_MARKER keyword. Memory explicitly disabled so retrieval
      # is skipped even though global memory.enabled=true.
      - name: no_memory_route
        description: Route with memory explicitly disabled for per-decision testing
        priority: 200
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: no_memory_trigger
        modelRefs:
          - model: qwen3
            use_reasoning: false
        plugins:
          - type: router_replay
            configuration:
              enabled: true
              max_records: 256
              capture_request_body: false
              capture_response_body: false
          - type: system_prompt
            configuration:
              system_prompt: You are a helpful assistant. Memory access is disabled for this route.
              mode: insert
          - type: context
            configuration:
              enabled: false

      # Triggered by THRESHOLD_MARKER keyword. Memory enabled with similarity_threshold=0.99
      # (near-impossible to match), overriding the integration default of 0.10.
      - name: custom_threshold_route
        description: Route with high similarity threshold for per-decision testing
        priority: 150
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: custom_threshold_trigger
        modelRefs:
          - model: qwen3
            use_reasoning: false
        plugins:
          - type: router_replay
            configuration:
              enabled: true
              max_records: 256
              capture_request_body: false
              capture_response_body: false
          - type: system_prompt
            configuration:
              system_prompt: You are a helpful assistant with strict memory matching.
              mode: insert
          - type: context
            configuration:
              enabled: true
              sources:
                - type: memory
                  match:
                    recall:
                      method: embedding
                      top_k: 5
                      min_similarity: 0.99
                  store:
                    auto: true

      # This route checks the calibrated 0.40 cutoff with engineered Milvus scores,
      # built from vela-embedding vectors of the model runtime the Router runs; the
      # reference settings are separately pinned by TestReferenceMemoryCalibratedRequestPath.
      - name: calibrated_threshold_route
        description: Route for calibrated memory retrieval regression
        priority: 125
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: calibrated_threshold_trigger
        modelRefs:
          - model: qwen3
            use_reasoning: false
        plugins:
          - type: context
            configuration:
              enabled: true
              sources:
                - type: memory
                  match:
                    recall:
                      method: embedding
                      top_k: 5
                      min_similarity: 0.40
                  store:
                    auto: false

      # A zero plugin threshold must resolve to the documented 0.70 default.
      - name: zero_threshold_route
        description: Route for the unset memory threshold regression test
        priority: 100
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: zero_threshold_trigger
        modelRefs:
          - model: qwen3
            use_reasoning: false
        plugins:
          - type: context
            configuration:
              enabled: true
              sources:
                - type: memory
                  match:
                    recall:
                      method: embedding
                      top_k: 5
                      min_similarity: 0.7
                  store:
                    auto: false

      - name: default_route
        description: Default route for memory testing
        priority: 1
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: qwen3
            use_reasoning: false
        plugins:
          - type: router_replay
            configuration:
              enabled: true
              max_records: 256
              capture_request_body: false
              capture_response_body: false
          - type: system_prompt
            configuration:
              system_prompt: You are MoM, a helpful AI assistant with memory. You remember important facts about users and use this context to provide personalized assistance.
              mode: insert
          - type: context
            configuration:
              enabled: true
              sources:
                - type: memory
                  match:
                    recall:
                      method: embedding
                      top_k: 5
                      min_similarity: 0.10
                  store:
                    auto: true
global:
  services:
    router_replay:
      store_backend: memory
      async_writes: false
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
  stores:
    memory:
      auto_store: true
      milvus:
        address: host.docker.internal:19530
        collection: memory_test_ci
        dimension: 768
      default_retrieval_limit: 5
      default_similarity_threshold: 0.10
  plugins:
    - type: context
      configuration:
        enabled: true
        sources:
          - type: memory
    - type: router_replay
      configuration:
        enabled: true
