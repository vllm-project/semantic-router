version: v0.4
listeners:
- name: agent-smoke-http-amd
  address: 0.0.0.0
  port: 8888
  timeout: 60s
models:
- name: smoke-model
  card:
    capabilities:
    - text
  connections:
  - provider: vllm
    endpoint: http://host.docker.internal:8000/v1
    model: smoke-model
    weight: '100'
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals: {}
    decisions:
    - name: default-route
      description: Minimal AMD default route for agent smoke validation
      priority: 100
      rules:
        operator: AND
        conditions: []
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    default-route:
      models:
      - model: smoke-model
        weight: '1'
global:
  stores:
    response_cache:
      enabled: false
  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: ''
        qwen3_model_path: ''
        gemma_model_path: ''
        bert_model_path: ''
        multimodal_model_path: ''
    modules:
      prompt_guard:
        enabled: false
        model_ref: ''
        model_id: ''
        jailbreak_mapping_path: ''
      classifier:
        domain:
          model_ref: ''
          model_id: ''
          category_mapping_path: ''
          use_mmbert_32k: false
        pii:
          model_ref: ''
          model_id: ''
          pii_mapping_path: ''
          use_mmbert_32k: false
      feedback_detector:
        enabled: false
        model_ref: ''
        model_id: ''
        use_mmbert_32k: false
      hallucination_mitigation: {}
  router: {}
  integrations: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
