version: v0.3

listeners:
  - name: "riscv-qemu-http"
    address: "0.0.0.0"
    port: 18888
    timeout: "60s"

providers:
  defaults:
    model: "riscv-model"
  models:
    - name: "riscv-model"
      provider_model_id: "riscv-model"
      backend_refs:
        - name: "primary"
          provider: vllm
          weight: 100
          endpoint: "127.0.0.1:8000/v1"
          protocol: "http"

routing:
  modelCards:
    - name: "riscv-model"
      modality: "text"
  signals:
    domains:
      - name: general
        description: Fallback domain for RISC-V QEMU smoke
        mmlu_categories: [other]
  decisions:
    - name: "domain-route"
      description: Prove the Vela Domain classifier is wired on linux/riscv64
      priority: 200
      rules:
        operator: "AND"
        conditions:
          - type: domain
            name: general
      modelRefs:
        - model: "riscv-model"
          use_reasoning: false
    - name: "default-route"
      description: Fallback route for RISC-V QEMU smoke
      priority: 10
      rules:
        operator: "AND"
        conditions: []
      modelRefs:
        - model: "riscv-model"
          use_reasoning: false

global:
  router:
    auto_model_names:
      - "vllm-sr/auto"
    model_selection:
      enabled: false
  services:
    response_api:
      enabled: false
    router_replay:
      enabled: false
    startup_status:
      store_backend: file
    observability:
      tracing:
        enabled: false
  stores:
    response_cache:
      enabled: false
  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: ""
        qwen3_model_path: ""
        gemma_model_path: ""
        bert_model_path: ""
        multimodal_model_path: ""
    kbs: []
    modules:
      prompt_guard:
        enabled: false
        model_ref: ""
        model_id: ""
        jailbreak_mapping_path: ""
      classifier:
        domain:
          enabled: true
          model_ref: domain_classifier
          model_id: models/Vela-1.0-Encoder-307M-Domain
          category_mapping_path: models/Vela-1.0-Encoder-307M-Domain/category_mapping.json
          variant: mmbert32k
          use_cpu: true
          threshold: 0.5
        pii:
          model_ref: ""
          model_id: ""
          pii_mapping_path: ""
          use_mmbert_32k: false
      feedback_detector:
        enabled: false
        model_ref: ""
        model_id: ""
        use_mmbert_32k: false
      hallucination_mitigation:
        enabled: false
