version: v0.3
listeners: []
providers:
  models:
  - name: gpt-4o
    provider_model_id: gpt-4o
    backend_refs:
    - provider: openai
      api_key_env: OPENAI_API_KEY
      auth_header: Authorization
      auth_prefix: Bearer
    - provider: openai-compatible
      endpoint: https://my-resource.openai.azure.com/openai/deployments/gpt-4o/v1
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: gpt-4o-mini
    provider_model_id: gpt-4o-mini
    backend_refs:
    - provider: openai
      api_key_env: OPENAI_API_KEY
      auth_header: Authorization
      auth_prefix: Bearer
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: claude-sonnet-4-20250514
    provider_model_id: claude-sonnet-4-20250514
    backend_refs:
    - provider: anthropic
      api_key_env: ANTHROPIC_API_KEY
      auth_header: x-api-key
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: MiniMax-M3
    provider_model_id: MiniMax-M3
    backend_refs:
    - provider: openai-compatible
      endpoint: https://api.minimax.io/v1
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: MiniMax-M2.7
    provider_model_id: MiniMax-M2.7
    backend_refs:
    - provider: openai-compatible
      endpoint: https://api.minimax.io/v1
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: Qwen/Qwen2.5-14B-Instruct
    provider_model_id: Qwen/Qwen2.5-14B-Instruct
    backend_refs:
    - provider: vllm
      endpoint: http://127.0.0.1:8000/v1
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: gpt-4o
  - name: gpt-4o-mini
  - name: claude-sonnet-4-20250514
  - name: MiniMax-M3
  - name: MiniMax-M2.7
  - name: Qwen/Qwen2.5-14B-Instruct
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      keywords:
      - name: code_keywords
        operator: OR
        keywords:
        - code
        - function
        - implement
        - debug
        - algorithm
        - python
        - golang
      - name: general_keywords
        operator: OR
        keywords:
        - hello
        - explain
        - what is
        - tell me
        - how does
      domains:
      - name: code
        description: Programming and software engineering
      - name: general
        description: General knowledge and conversation
    decisions:
    - name: code_to_local
      description: "Code queries \u2192 local vLLM (fast, free)"
      priority: 200
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: code_keywords
    - name: general_to_cloud
      description: "General queries \u2192 GPT-4o (cloud, with failover)"
      priority: 100
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: general_keywords
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    code_to_local:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct
        weight: '1'
    general_to_cloud:
      models:
      - model: gpt-4o
        weight: '1'
global:
  router:
    clear_route_cache: true
  stores:
    response_cache:
      enabled: false
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
