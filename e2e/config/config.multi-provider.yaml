version: v0.4
listeners: []
models:
- name: gpt-4o
  card: {}
  connections:
  - provider: openai
    model: gpt-4o
    credential: openai_api_key
  - provider: openai-compatible
    endpoint: https://my-resource.openai.azure.com/openai/deployments/gpt-4o/v1
    model: gpt-4o
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
- name: gpt-4o-mini
  card: {}
  connections:
  - provider: openai
    model: gpt-4o-mini
    credential: openai_api_key
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
- name: claude-sonnet-4-20250514
  card: {}
  connections:
  - provider: anthropic
    model: claude-sonnet-4-20250514
    credential: anthropic_api_key
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
- name: MiniMax-M3
  card: {}
  connections:
  - provider: openai-compatible
    endpoint: https://api.minimax.io/v1
    model: MiniMax-M3
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
- name: MiniMax-M2.7
  card: {}
  connections:
  - provider: openai-compatible
    endpoint: https://api.minimax.io/v1
    model: MiniMax-M2.7
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
- name: Qwen/Qwen2.5-14B-Instruct
  card: {}
  connections:
  - provider: vllm
    endpoint: http://127.0.0.1:8000/v1
    model: Qwen/Qwen2.5-14B-Instruct
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      keywords:
      - name: code_keywords
        operator: OR
        keywords:
        - code
        - function
        - implement
        - debug
        - algorithm
        - python
        - golang
      - name: general_keywords
        operator: OR
        keywords:
        - hello
        - explain
        - what is
        - tell me
        - how does
      domains:
      - name: code
        description: Programming and software engineering
      - name: general
        description: General knowledge and conversation
    decisions:
    - name: code_to_local
      description: "Code queries \u2192 local vLLM (fast, free)"
      priority: 200
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: code_keywords
    - name: general_to_cloud
      description: "General queries \u2192 GPT-4o (cloud, with failover)"
      priority: 100
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: general_keywords
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    code_to_local:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct
        weight: '1'
    general_to_cloud:
      models:
      - model: gpt-4o
        weight: '1'
global:
  router:
    clear_route_cache: true
  stores:
    response_cache:
      enabled: false
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
    backend_credentials:
      openai_api_key:
        credential_adapter_id: bearer
        secret_env: OPENAI_API_KEY
      anthropic_api_key:
        credential_adapter_id: x-api-key
        secret_env: ANTHROPIC_API_KEY
