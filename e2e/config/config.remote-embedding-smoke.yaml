# Manual smoke config for validating an OpenAI-compatible remote embedding
# provider with embedding-signal routing.
#
# Defaults are safe for generic OpenAI-compatible providers:
#   - put the secret in OPENAI_API_KEY
#   - edit global.model_catalog.embeddings.semantic.endpoint.base_url when using
#     an Azure OpenAI-compatible v1 endpoint that accepts bearer authentication,
#     for example:
#     https://<resource>.openai.azure.com/openai/v1
#     Endpoints that require the legacy api-key header are not supported.
#
# This config is intentionally not referenced by the default local-dev flow.
version: v0.5

listeners:
  - name: "remote-embedding-smoke-http"
    address: "0.0.0.0"
    port: 18888
    timeout: "60s"

providers:
  defaults:
    model: "default-model"
  models:
    - name: "billing-model"
      provider_model_id: "billing-model"
      backend_refs:
        - name: "primary"
          provider: vllm
          weight: 100
          endpoint: "host.docker.internal:18000/v1"
          protocol: "http"
      modality: "text"
    - name: "default-model"
      provider_model_id: "default-model"
      backend_refs:
        - name: "primary"
          provider: vllm
          weight: 100
          endpoint: "host.docker.internal:18001/v1"
          protocol: "http"
      modality: "text"

recipes:
  - name: default
    signals:
      systemone:
        - name: billing_support
          question:
            type: noul
            instructions: 'Is the request about any of these: billing invoice payment subscription charge refund account balance; pricing plan renewal credit card receipt usage cost?'
    decisions:
      - name: "billing-route"
        description: "Route billing and subscription prompts using remote embedding signal"
        priority: 200
        rules:
          operator: "AND"
          conditions:
            - type: systemone
              name: billing_support
        modelRefs:
          - model: "billing-model"
            use_reasoning: false
      - name: "default-route"
        description: "Fallback route for remote embedding smoke validation"
        priority: 10
        rules:
          operator: "AND"
          conditions: []
        modelRefs:
          - model: "default-model"
            use_reasoning: false

global:
  services:
    response_api:
      enabled: false
    startup_status:
      store_backend: file
  model_catalog:
    deployments:
      remote-embedding:
        provider: openai_embeddings
        endpoint: https://api.openai.com/v1
        model: text-embedding-3-small
        auth:
          api_key_env: OPENAI_API_KEY
        timeout_ms: 10000
        max_retries: 1
        capabilities:
          dimensions: 1536
    embeddings:
      default: {deployment: remote-embedding}
