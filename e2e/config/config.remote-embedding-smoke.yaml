version: v0.3
listeners:
- name: remote-embedding-smoke-http
  address: 0.0.0.0
  port: 18888
  timeout: 60s
providers:
  models:
  - name: billing-model
    provider_model_id: billing-model
    backend_refs:
    - provider: vllm
      endpoint: http://host.docker.internal:18000/v1
      weight: 100
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: default-model
    provider_model_id: default-model
    backend_refs:
    - provider: vllm
      endpoint: http://host.docker.internal:18001/v1
      weight: 100
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: billing-model
    capabilities:
    - text
  - name: default-model
    capabilities:
    - text
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      embeddings:
      - name: billing_support
        threshold: 0.35
        aggregation_method: max
        candidates:
        - billing invoice payment subscription charge refund account balance
        - pricing plan renewal credit card receipt usage cost
    decisions:
    - name: billing-route
      description: Route billing and subscription prompts using remote embedding signal
      priority: 200
      rules:
        operator: AND
        conditions:
        - type: embedding
          name: billing_support
    - name: default-route
      description: Fallback route for remote embedding smoke validation
      priority: 10
      rules:
        operator: AND
        conditions: []
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    billing-route:
      models:
      - model: billing-model
        weight: '1'
    default-route:
      models:
      - model: default-model
        weight: '1'
global:
  services:
    response_api:
      enabled: false
    router_replay:
      enabled: false
    startup_status:
      store_backend: file
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: false
  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: ''
        qwen3_model_path: ''
        gemma_model_path: ''
        bert_model_path: ''
        multimodal_model_path: ''
        use_cpu: true
        embedding_config:
          backend: openai_compatible
          model_type: remote
          preload_embeddings: false
          target_dimension: 1536
        endpoint:
          base_url: https://api.openai.com/v1
          model: text-embedding-3-small
          api_key_env: OPENAI_API_KEY
          timeout_seconds: 10
          max_retries: 1
          dimensions: 1536
    modules:
      prompt_guard:
        enabled: false
        model_ref: ''
        model_id: ''
        jailbreak_mapping_path: ''
      classifier:
        domain:
          model_ref: ''
          model_id: ''
          category_mapping_path: ''
          use_mmbert_32k: false
        pii:
          model_ref: ''
          model_id: ''
          pii_mapping_path: ''
          use_mmbert_32k: false
      feedback_detector:
        enabled: false
        model_ref: ''
        model_id: ''
        use_mmbert_32k: false
      hallucination_mitigation: {}
  router: {}
  integrations: {}
