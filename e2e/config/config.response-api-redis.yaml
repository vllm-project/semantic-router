version: v0.4
listeners: []
models:
- name: openai/gpt-oss-120b
  card: {}
  connections:
  - provider: vllm
    endpoint: http://0.0.0.0:8000/v1
    model: openai/gpt-oss-120b
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      domains:
      - name: other
        description: General knowledge and miscellaneous topics
        mmlu_categories:
        - other
    decisions:
    - name: default_decision
      description: Default catch-all decision
      priority: 1
      rules:
        operator: OR
        conditions:
        - type: domain
          name: other
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    default_decision:
      models:
      - model: openai/gpt-oss-120b
        weight: '1'
global:
  router: {}
  services:
    response_api:
      enabled: true
      store_backend: redis
      ttl_seconds: 86400
      redis:
        address: localhost:6379
        password: ''
        db: 0
        key_prefix: 'sr:'
        pool_size: 10
        min_idle_conns: 2
        max_retries: 3
        dial_timeout: 5
        read_timeout: 3
        write_timeout: 3
        cluster_mode: false
        tls_enabled: false
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
