version: v0.3
listeners: []
providers:
  models:
  - name: Qwen/Qwen-Image
    provider_model_id: Qwen/Qwen-Image
    backend_refs:
    - provider: vllm
      endpoint: http://127.0.0.1:8001/v1
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: Qwen/Qwen-Image
    capabilities:
    - image_generation
    - diffusion
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      modality:
      - name: DIFFUSION
        description: Pure image generation requests.
    decisions:
    - name: image_only
      description: Route image-generation prompts into the image backend.
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: modality
          name: DIFFUSION
      plugins:
      - type: image_gen
        configuration:
          enabled: true
          backend: vllm_omni
          backend_config:
            base_url: http://localhost:8001
            model: Qwen/Qwen-Image
            num_inference_steps: 4
            cfg_scale: 0.0
          default_width: 1024
          default_height: 1024
          timeout_seconds: 120
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    image_only:
      models:
      - model: Qwen/Qwen-Image
        weight: '1'
global:
  stores:
    response_cache:
      enabled: false
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 3600
      max_responses: 100
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  integrations:
    tools:
      enabled: false
  router: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
