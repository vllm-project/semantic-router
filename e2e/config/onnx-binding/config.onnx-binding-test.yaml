version: v0.4
listeners: []
models:
- name: qwen2.5:3b
  card:
    reasoning:
      type: chat_template_kwargs
      efforts: []
  connections:
  - provider: vllm
    endpoint: http://127.0.0.1:11434/v1
    model: qwen2.5:3b
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      domains:
      - name: general
        description: General queries
      - name: engineering
        description: Technical questions
    decisions:
    - name: default
      description: Default routing
      priority: 100
      rules:
        operator: OR
        conditions:
        - type: domain
          name: general
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    default:
      models:
      - model: qwen2.5:3b
        weight: '100'
global:
  model_catalog:
    embeddings:
      semantic:
        use_cpu: true
        mmbert_model_path: onnx-binding/mmbert-32k-yarn-onnx
    modules:
      classifier:
        domain:
          enabled: false
        pii:
          enabled: false
      hallucination_mitigation:
        enabled: false
      prompt_guard:
        enabled: false
      feedback_detector:
        enabled: false
  router: {}
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
      max_responses: 1000
    router_replay:
      store_backend: memory
      ttl_seconds: 2592000
      async_writes: true
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.85
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      tools_db_path: config/runtime/tools/tools_db.json
      similarity_threshold: 0.7
