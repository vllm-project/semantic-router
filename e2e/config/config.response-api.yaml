version: v0.5
listeners: []
providers:
  defaults:
    model: openai/gpt-oss-120b
  models:
    - name: openai/gpt-oss-120b
      backend_refs:
        - name: test-endpoint
          provider: vllm
          endpoint: 0.0.0.0:8000
          weight: 1
recipes:
  - name: default
    decisions:
      - name: default_decision
        description: Default catch-all decision
        priority: 1
        rules:
          operator: OR
          conditions:
            - type: domain
              name: other
        modelRefs:
          - model: openai/gpt-oss-120b
            use_reasoning: false
    signals:
      domains:
        - name: other
          description: General knowledge and miscellaneous topics
          labels:
            - other
global:
  router:
    strategy: priority
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
      max_responses: 1000
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
  integrations: {}
