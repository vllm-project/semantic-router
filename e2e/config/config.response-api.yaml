version: v0.3
listeners: []
providers:
  models:
  - name: openai/gpt-oss-120b
    provider_model_id: openai/gpt-oss-120b
    backend_refs:
    - provider: vllm
      endpoint: http://0.0.0.0:8000/v1
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: openai/gpt-oss-120b
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: other
        description: General knowledge and miscellaneous topics
        mmlu_categories:
        - other
    decisions:
    - name: default_decision
      description: Default catch-all decision
      priority: 1
      rules:
        operator: OR
        conditions:
        - type: domain
          name: other
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    default_decision:
      models:
      - model: openai/gpt-oss-120b
        weight: '1'
global:
  router: {}
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
      max_responses: 1000
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
