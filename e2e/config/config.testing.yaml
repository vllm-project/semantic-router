version: v0.3
listeners: []
providers:
  defaults:
    reasoning_families:
      openai/gpt-oss-20b:
        type: reasoning_effort
        parameter: reasoning_effort
  models:
  - name: openai/gpt-oss-20b
    provider_model_id: openai/gpt-oss-20b
    backend_refs:
    - provider: vllm
      endpoint: http://172.28.0.10:8000/v1
    control:
      timeout:
        request: 300s
        stream: 300s
    reasoning_family: openai/gpt-oss-20b
routing:
  modelCards:
  - name: openai/gpt-oss-20b
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      metadata:
      - name: canary_cohort
        description: Caller opted into the canary routing cohort
        key: cohort
        predicate:
          equals: canary
      domains:
      - name: other
        description: General knowledge and miscellaneous topics
        mmlu_categories:
        - other
    decisions:
    - name: metadata_decision
      description: Explicit metadata-based routing contract
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: metadata
          name: canary_cohort
    - name: general_decision
      description: General knowledge and miscellaneous topics
      priority: 50
      rules:
        operator: AND
        conditions:
        - type: domain
          name: other
- name: metadata-policy
  description: Exercise recipe-local request metadata routing.
  routing:
    signals:
      metadata:
      - name: canary_cohort
        description: Recipe-local canary cohort policy.
        key: cohort
        predicate:
          equals: canary
    decisions:
    - name: metadata_recipe_decision
      description: Route canary metadata inside the selected recipe.
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: metadata
          name: canary_cohort
entrypoints:
- model_names:
  - vllm-sr/metadata-policy
  recipe: metadata-policy
  assignments:
    metadata_recipe_decision:
      models:
      - model: openai/gpt-oss-20b
        weight: '1'
global:
  router: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        concurrency_threshold: 5
        max_concurrency: 8
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
          duration_buckets:
          - 0.001
          - 0.005
          - 0.01
          - 0.025
          - 0.05
          - 0.1
          - 0.25
          - 0.5
          - 1
          - 2.5
          - 5
          - 10
          - 30
          size_buckets:
          - 1
          - 2
          - 5
          - 10
          - 20
          - 50
          - 100
          - 200
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/runtime/tools/tools_db.json
      fallback_to_empty: true
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
