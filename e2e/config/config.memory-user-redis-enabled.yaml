# Same as config.memory-user.yaml but with Redis hot cache ENABLED for testing.
# Use this when the router runs in a container on the same network as Redis
# (e.g. semantic-router-redis). For host-only runs use address: "localhost:6379".
#
# Usage: point your router's CONFIG_FILE to this file (or merge redis_cache into your config).

version: v0.3
listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 300s
    # The tests stand in for an authenticating proxy: they send x-authz-user-id.
    identity:
      trust_headers: true
providers:
  defaults:
    model: qwen3
  models:
    - name: qwen3
      provider_model_id: qwen3
      backend_refs:
        - name: provider_mocker
          provider: vllm
          weight: 1
          endpoint: host.docker.internal:8000
          protocol: http
routing:
  modelCards:
    - name: qwen3
      modality: text
  signals:
    domains:
      - name: general
        description: General queries for memory testing
        labels: [other]
    keywords: []
  decisions:
    - name: default_route
      description: Default route for memory testing
      priority: 1
      rules:
        operator: OR
        conditions:
          - type: domain
            name: general
      modelRefs:
        - model: qwen3
          use_reasoning: false
      plugins:
        - type: system_prompt
          configuration:
            system_prompt: You are MoM, a helpful AI assistant with memory. You remember important facts about users and use this context to provide personalized assistance.
            mode: insert
        - type: context
          configuration:
            enabled: true
            sources:
              - type: memory
                match:
                  recall:
                    method: embedding
                    top_k: 5
                    min_similarity: 0.60
                store:
                  auto: false
global:
  stores:
    memory:
      enabled: true
      auto_store: false
      query_rewrite:
        deployment: memory-rewriter
      milvus:
        address: host.docker.internal:19530
        collection: memory_test_ci
        dimension: 768
      default_retrieval_limit: 5
      default_similarity_threshold: 0.60
      redis_cache:
        enabled: true
        address: semantic-router-redis:6379
        ttl_seconds: 900
        db: 0
        key_prefix: "memory_cache:"
        password: ""
  model_catalog:
    deployments:
      memory-rewriter:
        provider: openai_chat
        endpoint: http://host.docker.internal:8000/v1
        model: qwen3
        timeout_ms: 30000
