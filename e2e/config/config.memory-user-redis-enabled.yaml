version: v0.4
listeners:
- name: http-8888
  address: 0.0.0.0
  port: 8888
  timeout: 300s
models:
- name: qwen3
  card:
    capabilities:
    - text
  connections:
  - provider: vllm
    endpoint: http://host.docker.internal:8000/v1
    model: qwen3
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      domains:
      - name: general
        description: General queries for memory testing
        mmlu_categories:
        - other
      keywords: []
    decisions:
    - name: default_route
      description: Default route for memory testing
      priority: 1
      rules:
        operator: OR
        conditions:
        - type: domain
          name: general
      plugins:
      - type: system_prompt
        configuration:
          system_prompt: You are MoM, a helpful AI assistant with memory. You remember
            important facts about users and use this context to provide personalized
            assistance.
          mode: insert
      - type: memory
        configuration:
          enabled: true
          retrieval_limit: 5
          similarity_threshold: 0.6
          auto_store: false
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    default_route:
      models:
      - model: qwen3
        weight: '1'
global:
  stores:
    memory:
      enabled: true
      auto_store: false
      milvus:
        address: host.docker.internal:19530
        collection: memory_test_ci
        dimension: 384
      embedding_model: bert
      default_retrieval_limit: 5
      default_similarity_threshold: 0.6
      extraction_batch_size: 1
      redis_cache:
        enabled: true
        address: semantic-router-redis:6379
        ttl_seconds: 900
        db: 0
        key_prefix: 'memory_cache:'
        password: ''
  model_catalog:
    external:
    - llm_provider: vllm
      model_role: memory_rewrite
      llm_endpoint:
        address: host.docker.internal
        port: 8000
        protocol: http
      llm_model_name: qwen3
      llm_timeout_seconds: 30
    - llm_provider: vllm
      model_role: memory_extraction
      llm_endpoint:
        address: host.docker.internal
        port: 8000
        protocol: http
      llm_model_name: qwen3
      llm_timeout_seconds: 30
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
  router: {}
  integrations: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
