version: v0.5
listeners: []
providers:
  defaults:
    model: Model-A
    reasoning_effort: medium
  models:
    - name: Model-A
      reasoning:
        family: qwen3
      backend_refs:
        - name: qwen-endpoint
          provider: vllm
          endpoint: 127.0.0.1:8000
          weight: 1
    - name: Model-B
      backend_refs:
        - name: tinyllama-endpoint
          provider: vllm
          endpoint: 127.0.0.1:8001
          weight: 1
recipes:
  - name: default
    decisions:
      - name: business_decision
        description: Business and management related queries
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: business
        modelRefs:
          - model: Model-A
            use_reasoning: false
      - name: law_decision
        description: Legal questions and law-related topics
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: law
        modelRefs:
          - model: Model-B
            use_reasoning: false
      - name: psychology_decision
        description: Psychology and mental health topics
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: psychology
        modelRefs:
          - model: Model-A
            use_reasoning: false
      - name: biology_decision
        description: Biology and life sciences questions
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: biology
        modelRefs:
          - model: Model-A
            use_reasoning: false
      - name: chemistry_decision
        description: Chemistry and chemical sciences questions
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: chemistry
        modelRefs:
          - model: Model-A
            use_reasoning: true
      - name: history_decision
        description: Historical questions and cultural topics
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: history
        modelRefs:
          - model: Model-A
            use_reasoning: false
      - name: health_decision
        description: Health and medical information queries
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: health
        modelRefs:
          - model: Model-B
            use_reasoning: false
      - name: economics_decision
        description: Economics and financial topics
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: economics
        modelRefs:
          - model: Model-B
            use_reasoning: false
      - name: math_decision
        description: Mathematics and quantitative reasoning
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: math
        modelRefs:
          - model: Model-B
            use_reasoning: true
      - name: physics_decision
        description: Physics and physical sciences
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: physics
        modelRefs:
          - model: Model-B
            use_reasoning: true
      - name: computer_science_decision
        description: Computer science and programming
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: "computer science"
        modelRefs:
          - model: Model-B
            use_reasoning: false
      - name: philosophy_decision
        description: Philosophy and ethical questions
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: philosophy
        modelRefs:
          - model: Model-A
            use_reasoning: false
      - name: engineering_decision
        description: Engineering and technical problem-solving
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: domain
              name: engineering
        modelRefs:
          - model: Model-B
            use_reasoning: false
      - name: general_decision
        description: General knowledge and miscellaneous topics
        priority: 50
        rules:
          operator: AND
          conditions:
            - type: domain
              name: other
        modelRefs:
          - model: Model-B
            use_reasoning: false
      - name: default_decision
        description: Default catch-all decision - blocks all PII for safety
        priority: 1
        rules:
          operator: AND
        modelRefs:
          - model: Model-B
            use_reasoning: false
    signals:
      domains:
        - name: business
          description: Business and management related queries
          labels:
            - business
        - name: law
          description: Legal questions and law-related topics
          labels:
            - law
        - name: psychology
          description: Psychology and mental health topics
          labels:
            - psychology
        - name: biology
          description: Biology and life sciences questions
          labels:
            - biology
        - name: chemistry
          description: Chemistry and chemical sciences questions
          labels:
            - chemistry
        - name: history
          description: Historical questions and cultural topics
          labels:
            - history
        - name: other
          description: General knowledge and miscellaneous topics
          labels:
            - other
        - name: health
          description: Health and medical information queries
          labels:
            - health
        - name: economics
          description: Economics and financial topics
          labels:
            - economics
        - name: math
          description: Mathematics and quantitative reasoning
          labels:
            - math
        - name: physics
          description: Physics and physical sciences
          labels:
            - physics
        - name: "computer science"
          description: Computer science and programming
          labels:
            - "computer science"
        - name: philosophy
          description: Philosophy and ethical questions
          labels:
            - philosophy
        - name: engineering
          description: Engineering and technical problem-solving
          labels:
            - engineering
global:
  router:
    strategy: priority
  services:
    api:
      batch_classification:
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
