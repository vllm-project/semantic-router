version: v0.4
listeners: []
models:
- name: Model-A
  card:
    reasoning:
      type: chat_template_kwargs
      efforts:
      - medium
  connections:
  - provider: vllm
    endpoint: http://127.0.0.1:8000/v1
    model: Model-A
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
- name: Model-B
  card: {}
  connections:
  - provider: vllm
    endpoint: http://127.0.0.1:8001/v1
    model: Model-B
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      domains:
      - name: business
        description: Business and management related queries
        mmlu_categories:
        - business
      - name: law
        description: Legal questions and law-related topics
        mmlu_categories:
        - law
      - name: psychology
        description: Psychology and mental health topics
        mmlu_categories:
        - psychology
      - name: biology
        description: Biology and life sciences questions
        mmlu_categories:
        - biology
      - name: chemistry
        description: Chemistry and chemical sciences questions
        mmlu_categories:
        - chemistry
      - name: history
        description: Historical questions and cultural topics
        mmlu_categories:
        - history
      - name: other
        description: General knowledge and miscellaneous topics
        mmlu_categories:
        - other
      - name: health
        description: Health and medical information queries
        mmlu_categories:
        - health
      - name: economics
        description: Economics and financial topics
        mmlu_categories:
        - economics
      - name: math
        description: Mathematics and quantitative reasoning
        mmlu_categories:
        - math
      - name: physics
        description: Physics and physical sciences
        mmlu_categories:
        - physics
      - name: computer science
        description: Computer science and programming
        mmlu_categories:
        - computer science
      - name: philosophy
        description: Philosophy and ethical questions
        mmlu_categories:
        - philosophy
      - name: engineering
        description: Engineering and technical problem-solving
        mmlu_categories:
        - engineering
    decisions:
    - name: business_decision
      description: Business and management related queries
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: business
    - name: law_decision
      description: Legal questions and law-related topics
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: law
    - name: psychology_decision
      description: Psychology and mental health topics
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: psychology
    - name: biology_decision
      description: Biology and life sciences questions
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: biology
    - name: chemistry_decision
      description: Chemistry and chemical sciences questions
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: chemistry
    - name: history_decision
      description: Historical questions and cultural topics
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: history
    - name: health_decision
      description: Health and medical information queries
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: health
    - name: economics_decision
      description: Economics and financial topics
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: economics
    - name: math_decision
      description: Mathematics and quantitative reasoning
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: math
    - name: physics_decision
      description: Physics and physical sciences
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: physics
    - name: computer_science_decision
      description: Computer science and programming
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: computer science
    - name: philosophy_decision
      description: Philosophy and ethical questions
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: philosophy
    - name: engineering_decision
      description: Engineering and technical problem-solving
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: engineering
    - name: general_decision
      description: General knowledge and miscellaneous topics
      priority: 50
      rules:
        operator: AND
        conditions:
        - type: domain
          name: other
    - name: default_decision
      description: Default catch-all decision - blocks all PII for safety
      priority: 1
      rules:
        operator: AND
entrypoints:
- name: vllm-sr/auto
  aliases:
  - auto
  recipe: default
  assignments:
    business_decision:
      models:
      - model: Model-A
        weight: '1'
    law_decision:
      models:
      - model: Model-B
        weight: '1'
    psychology_decision:
      models:
      - model: Model-A
        weight: '1'
    biology_decision:
      models:
      - model: Model-A
        weight: '1'
    chemistry_decision:
      models:
      - model: Model-A
        weight: '1'
        reasoning:
          enabled: true
    history_decision:
      models:
      - model: Model-A
        weight: '1'
    health_decision:
      models:
      - model: Model-B
        weight: '1'
    economics_decision:
      models:
      - model: Model-B
        weight: '1'
    math_decision:
      models:
      - model: Model-B
        weight: '1'
    physics_decision:
      models:
      - model: Model-B
        weight: '1'
    computer_science_decision:
      models:
      - model: Model-B
        weight: '1'
    philosophy_decision:
      models:
      - model: Model-A
        weight: '1'
    engineering_decision:
      models:
      - model: Model-B
        weight: '1'
    general_decision:
      models:
      - model: Model-B
        weight: '1'
    default_decision:
      models:
      - model: Model-B
        weight: '1'
global:
  router: {}
  services:
    api:
      batch_classification:
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
          duration_buckets:
          - 0.001
          - 0.005
          - 0.01
          - 0.025
          - 0.05
          - 0.1
          - 0.25
          - 0.5
          - 1
          - 2.5
          - 5
          - 10
          - 30
          size_buckets:
          - 1
          - 2
          - 5
          - 10
          - 20
          - 50
          - 100
          - 200
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/runtime/tools/tools_db.json
      fallback_to_empty: true
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
