version: v0.3

listeners:
  - name: "agent-smoke-http"
    address: "0.0.0.0"
    port: 8888
    timeout: "60s"

providers:
  defaults:
    model: "smoke-model"
  models:
    - name: "smoke-model"
      provider_model_id: "smoke-model"
      backend_refs:
        - name: "primary"
          provider: vllm
          weight: 100
          endpoint: "host.docker.internal:8000/v1"
          protocol: "http"

routing:
  modelCards:
    - name: "smoke-model"
      modality: "text"
  decisions:
    - name: "default-route"
      description: "Minimal default route for agent smoke validation"
      priority: 100
      rules:
        operator: "AND"
        conditions: []
      modelRefs:
        - model: "smoke-model"
          use_reasoning: false

global:
  stores:
    response_cache:
      enabled: false
  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: ""
        qwen3_model_path: ""
        multimodal_model_path: ""
    modules:
      prompt_guard:
        enabled: false
        model_ref: ""
        model_id: ""
        jailbreak_mapping_path: ""
      classifier:
        domain:
          model_ref: ""
          model_id: ""
          category_mapping_path: ""
        pii:
          model_ref: ""
          model_id: ""
          pii_mapping_path: ""
      feedback_detector:
        enabled: false
        model_ref: ""
        model_id: ""

entrypoints:
  - model_names: ["vllm-sr/auto"]
    recipe: default
