version: v0.3
listeners: []
providers:
  models:
  - name: Qwen/Qwen2.5-14B-Instruct
    provider_model_id: Qwen/Qwen2.5-14B-Instruct
    backend_refs:
    - provider: vllm
      endpoint: http://127.0.0.1:8000/v1
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: Qwen/Qwen-Image
    provider_model_id: Qwen/Qwen-Image
    backend_refs:
    - provider: vllm
      endpoint: http://127.0.0.1:8001/v1
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: Qwen/Qwen2.5-14B-Instruct
    capabilities:
    - ar
    modality: ar
  - name: Qwen/Qwen-Image
    capabilities:
    - image_generation
    - diffusion
    modality: diffusion
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: text_generation
        description: Text generation and general queries.
        mmlu_categories:
        - other
      modality:
      - name: AR
        description: Text-only response via autoregressive LLM.
      - name: DIFFUSION
        description: Image generation via diffusion model.
      - name: BOTH
        description: Hybrid response requiring both text and image.
    decisions:
    - name: image_generation
      description: Route image generation requests to the diffusion model.
      priority: 200
      rules:
        operator: AND
        conditions:
        - type: modality
          name: DIFFUSION
      plugins:
      - type: image_gen
        configuration:
          enabled: true
          backend: vllm_omni
          backend_config:
            base_url: http://localhost:8001
            model: Qwen/Qwen-Image
            num_inference_steps: 4
            cfg_scale: 0.0
          default_width: 1024
          default_height: 1024
          timeout_seconds: 120
    - name: text_and_image
      description: Route hybrid text+image requests to both models in parallel.
      priority: 190
      rules:
        operator: AND
        conditions:
        - type: modality
          name: BOTH
      plugins:
      - type: image_gen
        configuration:
          enabled: true
          backend: vllm_omni
          backend_config:
            base_url: http://localhost:8001
            model: Qwen/Qwen-Image
            num_inference_steps: 4
            cfg_scale: 0.0
          default_width: 1024
          default_height: 1024
          timeout_seconds: 120
    - name: text_generation
      description: Default text routing for AR requests.
      priority: 1
      rules:
        operator: OR
        conditions:
        - type: modality
          name: AR
        - type: domain
          name: text_generation
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    image_generation:
      models:
      - model: Qwen/Qwen-Image
        weight: '1'
    text_and_image:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct
        weight: '1'
      - model: Qwen/Qwen-Image
        weight: '1'
    text_generation:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct
        weight: '1'
global:
  stores:
    response_cache:
      enabled: false
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 3600
      max_responses: 100
    api:
      batch_classification:
        max_batch_size: 10
        concurrency_threshold: 2
        max_concurrency: 4
    observability:
      metrics:
        enabled: true
      tracing:
        enabled: false
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  integrations:
    tools:
      enabled: false
  router: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
