version: v0.5
providers:
  defaults:
    model: "Qwen/Qwen2.5-14B-Instruct"
  models:
    - name: "Qwen/Qwen2.5-14B-Instruct"
      backend_refs:
        - name: vllm-ar
          provider: vllm
          endpoint: 127.0.0.1:8000
          weight: 1
    # vLLM-Omni serves the image model on /v1/images/generations.
    - name: "Qwen/Qwen-Image"
      api_format: images
      backend_refs:
        - name: vllm-omni
          provider: vllm
          endpoint: 127.0.0.1:8001
          weight: 1
      capabilities: [image_generation]
      modalities: {input: [text], output: [image]}
recipes:
  - name: default
    signals:
      domains:
        - name: text_generation
          description: Text generation and general queries.
          labels: [other]
      modality:
        - name: wants_text
          description: Text-only answers.
          labels: [text]
        - name: wants_image
          description: Requests for a generated image.
          labels: [image]
    decisions:
      - name: image_generation
        description: Generate the image a request asks for with the diffusion model.
        priority: 200
        rules:
          operator: AND
          conditions:
            - type: modality
              name: wants_image
        output:
          kind: image
          action: generate
        modelRefs:
          - model: "Qwen/Qwen-Image"
            use_reasoning: false
      - name: text_generation
        description: Default text routing.
        priority: 1
        rules:
          operator: OR
          conditions:
            - type: modality
              name: wants_text
            - type: domain
              name: text_generation
        modelRefs:
          - model: "Qwen/Qwen2.5-14B-Instruct"
            use_reasoning: false
global:
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 3600
      max_responses: 100
    api:
      batch_classification:
        max_batch_size: 10
    observability:
      metrics:
        enabled: true
      tracing:
        enabled: false
