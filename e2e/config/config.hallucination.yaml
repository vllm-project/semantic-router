version: v0.3
listeners: []
providers:
  defaults:
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
  - name: qwen3
    provider_model_id: qwen3
    backend_refs:
    - provider: vllm
      endpoint: http://127.0.0.1:8002/v1
    control:
      timeout:
        request: 300s
        stream: 300s
    reasoning_family: qwen3
routing:
  modelCards:
  - name: qwen3
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: general
        description: General questions
        mmlu_categories:
        - other
      fact_check:
      - name: needs_fact_check
        description: Query contains factual claims that should be verified against
          context
      - name: no_fact_check_needed
        description: Query is creative, code-related, or opinion-based - no fact verification
          needed
    decisions:
    - name: general_decision
      description: General questions
      priority: 100
      rules:
        operator: OR
        conditions:
        - type: domain
          name: general
        - type: fact_check
          name: needs_fact_check
      plugins:
      - type: hallucination
        configuration:
          enabled: true
          use_nli: true
          hallucination_action: header
          unverified_factual_action: header
          include_hallucination_details: true
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    general_decision:
      models:
      - model: qwen3
        weight: '1'
global:
  router: {}
  services:
    api:
      batch_classification:
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: false
      embedding_model: mmbert
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
