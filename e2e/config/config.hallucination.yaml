version: v0.3
listeners: []
providers:
  defaults:
    model: qwen3
  models:
    - name: qwen3
      reasoning:
        family: qwen3
      backend_refs:
        - name: provider-mocker
          provider: vllm
          endpoint: 127.0.0.1:8002
          weight: 1
routing:
  decisions:
    - name: general_decision
      description: General questions
      priority: 100
      rules:
        operator: OR
        conditions:
          - type: domain
            name: general
          - type: fact_check
            name: needs_fact_check
      modelRefs:
        - model: qwen3
          use_reasoning: false
      plugins:
        - type: response_guard
          configuration:
            rules:
              - when:
                  operator: AND
                  conditions:
                    - type: fact_check
                      name: needs_fact_check
                    - type: hallucination
                      name: ungrounded_claims
                action: annotate
            on_unknown: annotate
  signals:
    domains:
      - name: general
        description: General questions
        labels:
          - other
    fact_check:
      - name: needs_fact_check
        description: Query contains factual claims that should be verified against context
      - name: no_fact_check_needed
        description: Query is creative, code-related, or opinion-based - no fact verification needed
        labels: [NO_FACT_CHECK_NEEDED]
        predicate:
          gt: 0.3
    hallucination:
      - name: ungrounded_claims
        description: Answers with claims their grounding context does not support.
  modelCards:
    - name: qwen3
global:
  router:
    strategy: priority
  services:
    api:
      batch_classification:
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
  stores:
    response_cache:
      enabled: false
  integrations: {}
