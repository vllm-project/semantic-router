version: v0.3

listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 60s

global:
  services:
    management_api:
      # The host publication remains loopback-only; split containers need the
      # Router to listen on its container interface for the Dashboard.
      bind_address: 0.0.0.0
      port: 8080
      auth:
        mode: bearer

providers:
  defaults:
    model: test-model
  models:
    - name: test-model
      provider_model_id: test-model
      backend_refs:
        - name: primary
          base_url: http://vllm-sr-recipe-fixture-upstream:18080/v1
          provider: openai
          weight: 100

routing:
  modelCards:
    - name: test-model
  decisions:
    - name: bearer_route
      description: Route every request to the test model.
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: test-model
          use_reasoning: false
      algorithm:
        type: static
