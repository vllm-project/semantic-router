version: 3

# The only changed-path registry. Domains express ownership and the smallest
# deterministic check. Integration verifications and E2E profiles are selected only by
# explicit escalation paths.
domains:
  harness:
    owner: maintainers
    documentation_check: true
    paths:
      - AGENTS.md
      - .github/copilot-instructions.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/**
      - .github/actions/**
      - .github/workflows/**
      - .mergify.yml
      - .pre-commit-config.yaml
      - .prowlabels.yaml
      - Makefile
      - netlify.toml
      - tools/agent/**
      - tools/ci/**
      - tools/docker/Dockerfile.precommit
      - tools/linter/**
      - tools/make/**
    checks: [make harness-check]
    verifications: [harness-tools]

  documentation:
    owner: documentation
    documentation_check: true
    paths:
      - README.md
      - CONTRIBUTING.md
      - website/**
    checks: [make docs-check-translation-coverage]
    verifications: []

  generated-model-catalog:
    owner: router-core
    documentation_check: true
    paths:
      - config/catalog/**
      - config/recipes/built-in/**
      - src/vllm-sr/cli/model_bundle.py
      - src/semantic-router/pkg/catalog/zz_generated_catalog.go
      - website/static/model-catalog/**
      - tools/catalog/**
      - tools/make/model-catalog.mk
      - tools/release/stage_model_catalog_package.py
      - tools/release/snapshot_model_catalog.py
      - tools/ci/package_contract.py
      - tools/ci/check_cli_wheel.py
      - tools/ci/prepare_dev_package.py
      - config/schemas/recipe-metadata-v1.schema.json
      - config/schemas/recipe-probes-v1.schema.json
    checks: [make model-catalog-generated-check]
    verifications: [cli-package]

  generated-cli-reference:
    owner: documentation
    documentation_check: true
    paths:
      - src/vllm-sr/cli/**/*.py
      - tools/docs/**
      - website/docs/api/cli.md
      - website/scripts/check-generated.mjs
      - website/requirements.txt
    checks: [make docs-cli-check, make docs-cli-test]
    verifications: []

  generated-configuration-reference:
    owner: documentation
    documentation_check: true
    paths:
      - config/fragments/**
      - website/docs/tutorials/**
      - website/docs/installation/configuration.md
      - website/scripts/generate-configuration-catalog.mjs
      - website/scripts/lib/configuration-catalog.mjs
    checks: [make docs-config-check]
    verifications: []

  generated-crd-reference:
    owner: documentation
    documentation_check: true
    paths:
      - deploy/operator/api/**
      - tools/codegen/crd/**
      - website/docs/api/crd-reference.md
    checks: [make docs-crd-check]
    verifications: [generated-contracts]

  generated-community-snapshots:
    owner: documentation
    documentation_check: true
    paths:
      - website/scripts/generate-contributor-rank.mjs
      - website/scripts/generate-committer-activity.mjs
      - website/scripts/lib/generated-source.mjs
      - website/scripts/lib/generated-source.test.mjs
      - website/scripts/lib/identity-audit.mjs
      - website/src/data/teamMembers.tsx
      - website/src/data/contributorRank.generated.ts
      - website/src/data/committerActivity.generated.ts
    checks: [make docs-community-check, make docs-community-test]
    verifications: []

  generated-api-contract:
    owner: router-core
    documentation_check: true
    paths:
      - src/semantic-router/pkg/apiserver/**/*.go
      - src/semantic-router/pkg/catalog/**/*.go
      - src/semantic-router/pkg/config/**/*.go
      - src/semantic-router/pkg/configschema/**/*.go
      - src/semantic-router/pkg/configschema/router-config-v0.3.schema.json
      - tools/codegen/configschema/**
      - tools/codegen/openapi/**
      - tools/codegen/embed_generated_index.py
      - tools/make/docs.mk
      - tools/make/golang.mk
      - dashboard/frontend/src/generated/routerConfigContract.ts
      - website/docs/api/apiserver.md
      - website/static/openapi/apiserver/**
    checks: [make generated-contract-check]
    verifications: [generated-contracts]

  router-core:
    owner: router-core
    paths:
      - src/semantic-router/**
      - config/**
      - tools/codegen/configschema/**
      - dashboard/frontend/src/generated/routerConfigContract.ts
      - go.mod
      - go.sum
      - Cargo.toml
      - Cargo.lock
    checks: [make test-semantic-router, make config-schema-check]
    verifications: [core]
    escalation:
      verifications: [native.candle-cpu, native.ort-cpu]
      paths:
        - src/semantic-router/pkg/classification/**
        - src/semantic-router/pkg/modelruntime/**
        - src/semantic-router/pkg/config/default_execution.go
        - src/semantic-router/pkg/config/default_execution_candle.go
        - src/semantic-router/pkg/config/default_execution_onnx.go
        - src/semantic-router/tools/model-test-assets/**
        - tools/ci/run_model_tests.py
        - tools/ci/prepare_model_test_assets.py
        - tools/make/models.mk

  # All three published suites consume the shared pinned-artifact provisioner.
  model-artifacts:
    owner: native-bindings
    paths:
      - src/semantic-router/pkg/config/registry.go
      - src/semantic-router/pkg/config/canonical_defaults.go
      - src/semantic-router/pkg/config/canonical_global.go
      - src/semantic-router/pkg/modeldownload/**
    checks: []
    verifications: []
    escalation:
      verifications: [native.candle-cpu, native.ort-cpu, native.openvino-cpu, native.candle-riscv64-qemu, performance]
      paths:
        - src/semantic-router/pkg/config/registry.go
        - src/semantic-router/pkg/config/canonical_defaults.go
        - src/semantic-router/pkg/config/canonical_global.go
        - src/semantic-router/pkg/modeldownload/**

  vela-omni-artifacts:
    owner: native-bindings
    paths:
      - tools/models/vela_omni/**
    checks:
      - python3 -m unittest discover -s tools/models/vela_omni -p test_contract.py
      - python3 -m unittest discover -s tools/models/vela_omni -p test_bundle.py
    verifications: [core, native.ort-cpu, e2e.vela-omni]

  vela-halu-artifacts:
    owner: native-bindings
    paths:
      - tools/models/vela_halu/**
    checks:
      - python3 -m unittest discover -s tools/models/vela_halu -p test_contract.py
    verifications: [core, native.candle-cpu, e2e.vela-halu]

  prepared-model-contracts:
    owner: native-bindings
    paths:
      - src/semantic-router/pkg/cache/omni_storage_integration_test.go
      - src/semantic-router/pkg/cache/embedding*.go
      - src/semantic-router/pkg/memory/embedding*.go
      - src/semantic-router/pkg/modeldownload/prepared_artifact*.go
      - tools/ci/prepare_model_test_assets.py
    checks: []
    verifications: [native.ort-cpu]

  model-compatibility:
    owner: router-core
    paths:
      - tools/modelcompat/**
      - src/semantic-router/pkg/modelruntime/compatibility/**
      - tools/make/models.mk
    checks: [make check-modelcompat]
    verifications: [core]

  image-calibration:
    owner: router-core
    documentation_check: true
    paths:
      - config/fragments/signal/embedding/image-routing.yaml
      - config/assets/image-routing/**
      - tools/calibration/image-routing/**
      - tools/models/vela_omni/**
      - onnx-binding/**
      - src/semantic-router/pkg/embedding/**
      - src/semantic-router/pkg/modelruntime/embedding*.go
      - src/semantic-router/pkg/modelruntime/native/embedding*.go
      - src/semantic-router/pkg/modelruntime/native/ort_execution*.go
      - tools/ci/image_calibration.py
      - tools/ci/tests/test_image_calibration.py
      - src/semantic-router/tools/model-test-assets/**
      - src/semantic-router/pkg/config/registry*.go
      - src/semantic-router/pkg/modeldownload/**
      - e2e/testcases/testdata/image-fixtures/**
      # The whole profile: the CRD mirror, the chart values, and the package
      # test that asserts the mirror, which runs only inside this gate.
      - e2e/profiles/multimodal-routing/**
      - website/static/img/**
      - dashboard/frontend/public/**
      - candle-binding/**
      - src/semantic-router/pkg/classification/**
      - src/semantic-router/pkg/config/canonical_config.go
      - src/semantic-router/pkg/config/canonical_defaults.go
      - src/semantic-router/pkg/config/embedding_config.go
      - src/semantic-router/pkg/config/model_config_types.go
      - src/semantic-router/pkg/config/prototype_scoring_config.go
      - src/semantic-router/pkg/config/signal_config.go
      - src/semantic-router/pkg/modelruntime/router_runtime.go
      - src/semantic-router/go.mod
      - src/semantic-router/go.sum
      - Makefile
      - tools/make/rust.mk
      - tools/make/common.mk
      - tools/make/models.mk
      # Defines build-onnx-binding and its features, which rust-ci depends on.
      - tools/make/build-run-test.mk
      - tools/make/go-tools.mk
      # Defines the make target the gate runs for the profile package test.
      - tools/make/e2e.mk
    checks: [make test-e2e-profile-multimodal]
    verify: [make verify-image-routing-calibration]
    verifications: [native.image-calibration-cpu]

  router-tools:
    owner: developer-experience
    paths:
      - tools/dev/dsl/**
      - tools/models/classifier-operating-point/**
      - tools/calibration/image-routing/**
      - bench/grounded_fusion/fusioneval/**
      - tools/make/go-tools.mk
    checks: [make go-tools-test]
    verifications: [core]

  calibration-tuning:
    owner: router-core
    paths:
      - tools/calibration/recipe/**
      - tools/calibration/tuning/**
      - config/schemas/recipe-metadata-v1.schema.json
      - config/schemas/recipe-metadata-v1.contract.yaml
      - config/schemas/recipe-probes-v1.schema.json
      - tools/make/tooling.mk
    checks: [make test-calibration]
    verifications: [learning-tools]

  developer-tools:
    owner: developer-experience
    paths:
      - tools/dev/kind/**
      - tools/dev/examples/**
      - tools/dev/local-up-router.sh
      - tools/test/smoke/**
      - tools/test/soak/**
      - tools/test/services/mcp-classifier-server/**
    checks: [make harness-check]
    verifications: [core]

  provider-mocker:
    owner: evaluation-quality
    paths:
      - tools/test/services/provider-mocker/**
    checks: [make test-provider-mocker]
    verifications: [mock-provider, operator, local.cli, local.memory]

  tiny-model:
    owner: evaluation-quality
    paths:
      - tools/test/services/tiny-model/**
    checks: [make test-tiny-model]
    verifications: [harness-tools]

  native-bindings:
    owner: native-bindings
    paths:
      - candle-binding/**
      - ml-binding/**
      - nlp-binding/**
      - onnx-binding/**
      - tools/make/rust.mk
      - tools/make/common.mk
      - tools/make/build-run-test.mk
    checks: [make test-binding-minimal]
    verify: [make test-models]
    verifications: [core, native.candle-cpu, native.ort-cpu]

  published-model-tests:
    owner: native-bindings
    paths:
      - src/semantic-router/pkg/modelruntime/native/published_vela*_test.go
      - src/semantic-router/pkg/classification/*realmodel_test.go
      - src/semantic-router/pkg/classification/real_model*_test.go
      - src/semantic-router/pkg/classification/fact_check_classifier_test.go
      - src/semantic-router/pkg/classification/generic_classifier_local_test.go
      - src/semantic-router/pkg/classification/unified_classifier_integration_test.go
      - src/semantic-router/pkg/classification/embedding_classifier_integration_test.go
      - src/semantic-router/tools/model-test-assets/**
      - tools/ci/run_model_tests.py
      - tools/make/models.mk
    checks: []
    verify: [make test-models]
    verifications: [native.candle-cpu, native.ort-cpu]

  riscv-runtime:
    owner: native-bindings
    paths:
      - candle-binding/**
      - ml-binding/**
      - nlp-binding/**
      - tools/make/rust.mk
      - tools/docker/check-native-abi.sh
      - tools/ci/riscv-qemu-router-smoke.sh
      - tools/ci/riscv_evidence.py
      - src/semantic-router/tools/model-test-assets/**
      - tools/make/models.mk
      - e2e/config/config.riscv-qemu.yaml
      - src/semantic-router/pkg/classification/unified_classifier_cgo_candle.go
      - src/semantic-router/pkg/cache/valkey_*.go
      - src/semantic-router/pkg/cache/exact_cache_valkey.go
      - src/semantic-router/pkg/memory/valkey_*.go
      - src/semantic-router/pkg/vectorstore/valkey_*.go
      - src/semantic-router/pkg/extproc/router_memory.go
      - src/semantic-router/pkg/extproc/router_memory_valkey.go
      - src/semantic-router/pkg/extproc/router_memory_valkey_unavailable.go
    checks: []
    verifications: [native.candle-riscv64-qemu]

  onnx-artifact-tools:
    owner: native-bindings
    paths:
      - onnx-binding/scripts/pack_shared_weights.py
      - onnx-binding/scripts/artifact_tests/**
      - onnx-binding/scripts/onnx_artifacts.py
    checks: [make onnx-artifact-test]
    verifications: [onnx-artifacts]

  onnx-export-tools:
    owner: training
    paths:
      - onnx-binding/scripts/export_*.py
      - onnx-binding/scripts/modernbert_inputs.py
      - onnx-binding/scripts/model_precision.py
      - onnx-binding/scripts/onnx_*.py
      - onnx-binding/scripts/tests/**
    checks: [make test-training-contracts]
    verifications: [training]

  ck-flash-attn-rewriter:
    owner: native-bindings
    paths: [onnx-binding/ort-ck-flash-attn/**]
    checks: [make ck-rewrite-test]
    verifications: [ck-rewrite]

  vllm-sr-cli:
    owner: vllm-sr-cli
    paths:
      - src/vllm-sr/**
      - pyproject.toml
      - e2e/testing/vllm-sr-cli/**
      - tools/make/docker.mk
    checks: [make vllm-sr-test]
    verify: [make vllm-sr-test-integration]
    verifications: [cli-unit, cli-package]
    escalation:
      verifications: [local.cli]
      paths:
        - src/vllm-sr/Dockerfile*
        - src/vllm-sr/cli/core.py
        - src/vllm-sr/cli/commands/runtime*.py
        - src/vllm-sr/cli/container_*.py
        - src/vllm-sr/cli/runtime_*.py
        - src/vllm-sr/cli/config_generator.py
        - src/vllm-sr/cli/config_translator.py
        - src/vllm-sr/cli/catalog_provider_projection.py
        - src/vllm-sr/cli/envoy_backend_pool.py
        - src/vllm-sr/cli/deployment_backend.py
        - src/vllm-sr/cli/templates/envoy*.yaml
        - e2e/testing/vllm-sr-cli/**
        - tools/make/docker.mk

  fleet-sim:
    owner: fleet-sim
    paths: [src/fleet-sim/**]
    checks: [make vllm-sr-sim-test]
    verifications: [fleet-sim]

  dashboard:
    owner: dashboard
    paths:
      - dashboard/**
      - src/semantic-router/pkg/config/**
      - src/semantic-router/pkg/dsl/**
      - src/semantic-router/pkg/modelinventory/**
      - src/semantic-router/pkg/nlgen/**
      - src/semantic-router/pkg/startupstatus/**
      - src/vllm-sr/cli/sr_bench/**
      - tools/make/dashboard.mk
    checks: [make dashboard-check]
    verify: [make dashboard-test-e2e-evaluation]
    verifications: [dashboard]

  operator:
    owner: operator
    paths:
      - deploy/operator/**
      - deploy/kubernetes/crds/**
      - src/semantic-router/pkg/apis/**
      - tools/codegen/boilerplate.go.txt
      - deploy/helm/semantic-router/crds/**
    checks: [make generate-api-check]
    verifications: [operator]

  helm:
    owner: deployment
    paths: [deploy/helm/**]
    checks: [make helm-lint]
    verify:
      - make helm-ci-validate HELM_REPO_UPDATE=false
      - make helm-safety-validate HELM_REPO_UPDATE=false
    verifications: [core]

  maintained-recipes:
    owner: router-core
    paths:
      - config/recipes/**
      - tools/calibration/recipe/**
      - config/schemas/recipe-metadata-v1.schema.json
      - config/schemas/recipe-probes-v1.schema.json
      - tools/make/recipe-conformance.mk
      - e2e/testing/run_recipe_conformance.sh
    checks: [make recipe-conformance-static]
    verify: [make recipe-conformance-live-cpu-all]
    verifications: [recipe-conformance]

  memory:
    owner: router-core
    paths:
      - src/semantic-router/pkg/memory/**
      - src/semantic-router/pkg/responseapi/**
      - src/semantic-router/pkg/responsestore/**
      - src/semantic-router/pkg/extproc/*memory*
      - src/semantic-router/pkg/apiserver/*memory*
      - src/semantic-router/pkg/sessiontelemetry/*memory*
      - src/semantic-router/pkg/vectorstore/*memory*
      - src/semantic-router/pkg/cache/*memory*
      - e2e/testing/09-memory-features-test.py
      - e2e/testing/memory_tests/**
      - e2e/testing/run_memory_integration.sh
      - tools/test/services/provider-mocker/**
      - tools/make/milvus.mk
      - tools/make/docker.mk
      - e2e/config/config.memory*.yaml
      - e2e/profiles/response-api/**
      - e2e/profiles/response-api-redis/**
      - e2e/profiles/response-api-redis-cluster/**
      - deploy/kubernetes/response-api/**
    checks: []
    verify: [make memory-test-integration]
    verifications: []
    escalation:
      verifications: [local.memory]
      paths:
        - src/semantic-router/pkg/memory/**
        - src/semantic-router/pkg/responseapi/**
        - src/semantic-router/pkg/responsestore/**
        - src/semantic-router/pkg/extproc/*memory*
        - e2e/testing/09-memory-features-test.py
        - e2e/testing/memory_tests/**
        - e2e/testing/run_memory_integration.sh
        - tools/test/services/provider-mocker/**
        - tools/make/milvus.mk
        - tools/make/docker.mk
        - e2e/config/config.memory*.yaml
        - e2e/profiles/response-api/**
        - deploy/kubernetes/response-api/**

  e2e-framework:
    owner: e2e
    paths:
      - e2e/pkg/**
      - e2e/cmd/**
      - e2e/testcases/**
      - e2e/*.go
      - e2e/go.mod
      - e2e/go.sum
    checks: [make build-e2e]
    verifications: [e2e.envoy-ai-gateway]

  e2e-unit:
    owner: e2e
    paths:
      - e2e/pkg/**
      - e2e/cmd/**
      - e2e/testcases/**
      - e2e/profiles/**
      - e2e/*.go
      - e2e/go.mod
      - e2e/go.sum
      - tools/make/e2e.mk
      - tools/ci/run_e2e_unit.py
    checks: [make test-e2e-unit]
    verifications: [e2e-unit]

  openvino:
    owner: native-bindings
    paths:
      - openvino-binding/**
      - tools/make/openvino.mk
      - tools/make/models.mk
      - tools/make/rust.mk
      - tools/make/common.mk
      - tools/make/build-run-test.mk
      - src/semantic-router/tools/model-test-assets/**
      - src/semantic-router/pkg/modelruntime/**
      - src/semantic-router/pkg/classification/**
      - src/semantic-router/pkg/config/default_execution_openvino.go
      - src/semantic-router/pkg/config/model_deployments.go
      - src/semantic-router/pkg/config/model_deployments_openvino_test.go
      - tools/ci/openvino_evidence.py
    checks: []
    verifications: [native.openvino-cpu]

  performance:
    owner: performance
    paths:
      - perf/**
      - tools/make/performance.mk
      - tools/make/rust.mk
      - tools/make/common.mk
      - tools/make/build-run-test.mk
      - tools/make/models.mk
      - src/semantic-router/tools/model-test-assets/**
    checks: [make perf-test-unit]
    verify: [make perf-check]
    verifications: [performance]

  router-learning:
    owner: router-core
    paths:
      - bench/agentic_routing_experiment.py
      - bench/profiles/router_learning/**
      - bench/test_agentic_routing_experiment.py
    checks: [make test-learning-tools]
    verifications: [learning-tools]

  paper:
    owner: paper
    paths: [paper/**]
    checks: []
    verifications: []

  training:
    owner: training
    paths:
      - src/training/**
      - tools/make/models.mk
      - tools/ci/training-test-requirements.txt
      - website/docs/training/**
    checks: [make test-training-contracts]
    verifications: [training]

  model-selection-parity:
    owner: training
    paths:
      - src/training/model_selection/ml_model_selection/models.py
      - src/training/model_selection/ml_model_selection/tests/**
      - src/training/model_selection/ml_model_selection/requirements-parity.txt
    checks: []
    verifications: [core]


  storage-integration:
    owner: router-core
    paths:
      - src/semantic-router/pkg/cache/**
      - src/semantic-router/pkg/memory/**
      - src/semantic-router/pkg/vectorstore/**
      - tools/make/milvus.mk
      - tools/make/build-run-test.mk
      - tools/ci/run_core_tests.py
      - src/semantic-router/pkg/contextcompression/*redis*
      - src/semantic-router/pkg/responsestore/*redis*
      - src/semantic-router/pkg/routerreplay/store/*postgres*
      - src/semantic-router/pkg/postgres/**
    checks: []
    verifications: [storage]

  soak-tools:
    owner: e2e
    paths:
      - e2e/pkg/soak/**
      - e2e/cmd/soak/**
      - bench/openai_fault_proxy.py
      - bench/test_openai_fault_proxy.py
      - tools/make/soak.mk
    checks: [make soak-test]
    verifications: [soak-tools]

  image-runtime-artifacts:
    owner: maintainers
    paths:
      - tools/ci/image_artifacts.py
      - tools/ci/provider_mocker_image.py
      - .github/actions/load-ci-images/**
    checks: [make harness-check]
    verifications: [local.cli, operator, e2e.envoy-ai-gateway]

  native-runtime-artifacts:
    owner: native-bindings
    paths:
      - tools/ci/native_artifact.py
      - .github/workflows/build-native.yml
      - .github/actions/load-native-artifact/**
    checks: [make harness-check]
    verifications: [core, storage, dashboard, generated-contracts, native.candle-cpu, native.ort-cpu, native.openvino-cpu, native.image-calibration-cpu, performance]

  framework-result-adapters:
    owner: maintainers
    paths:
      - tools/ci/workflow_evidence.py
    checks: [make harness-check]
    verifications: [core, storage, dashboard, performance, security, soak-tools, generated-contracts, native.image-calibration-cpu, e2e-unit]

  python-framework-observer:
    owner: maintainers
    paths:
      - tools/ci/python_test_evidence.py
    checks: [make harness-check]
    verifications: [cli-unit, fleet-sim, training, learning-tools, harness-tools, onnx-artifacts, ck-rewrite]

  runtime-evidence:
    owner: maintainers
    paths:
      - tools/ci/runtime_evidence.py
    checks: [make harness-check]
    verifications: [native.candle-cpu, native.ort-cpu, native.openvino-cpu, native.candle-riscv64-qemu, native.image-calibration-cpu, local.cli, local.memory, recipe-conformance]

  deployment-evidence:
    owner: e2e
    paths:
      - tools/ci/deployment_test_results.py
      - tools/ci/check_operator_request.py
    checks: [make harness-check]
    verifications: [operator, e2e.envoy-ai-gateway]

  planner:
    owner: maintainers
    paths:
      - tools/ci/verification_catalog.yaml
