version: 1

compatibility_contexts:
  - Run pre-commit hooks check file lint
  - test-and-build
  - Lint
  - Unit Tests
  - Verify Manifests
  - Validate OLM Bundle

pr_job_order:
  - quality
  - security
  - core-tests
  - dashboard
  - operator
  - e2e
  - cli
  - memory
  - openvino
  - images
  - performance
  - router-learning
  - recipe-conformance
  - paper

local_full_ci_paths:
  - src/semantic-router/**
  - src/vllm-sr/**
  - src/vllm-sr/Dockerfile*
  - tools/make/**
  - tools/agent/*.yaml
  - tools/agent/scripts/**
  - tools/make/agent.mk
  - .github/workflows/**
  - e2e/pkg/**
  - e2e/cmd/**
  - e2e/testcases/**
  - e2e/go.mod
  - e2e/go.sum
  - e2e/config/**

domains:
  quality:
    owner: ci
    contract: Source formatting, lint, generated assets, and repository structure remain valid.
    layer: static
    selector: always
    pr_job: quality
    workflow: .github/workflows/pre-commit.yml
    cadence: [pr, main, nightly]
    resource_class: light
    local:
      fast: [make agent-ci-lint]
      feature: []
    image_receipts: []
    reporting: {kind: check}

  security:
    owner: security
    contract: Changed source does not introduce blocked supply-chain patterns.
    layer: static
    selector: security
    pr_job: security
    workflow: .github/workflows/security-scan.yml
    cadence: [pr]
    resource_class: light
    local: {fast: [], feature: []}
    image_receipts: []
    reporting: {kind: check}

  core-tests:
    owner: router-core
    contract: Router, bindings, config, classifiers, and store integrations compile and pass their native tests.
    layer: unit-integration
    selector: core_test
    pr_job: core-tests
    workflow: .github/workflows/test-and-build.yml
    cadence: [pr, main, nightly]
    resource_class: heavy
    local:
      fast: [make test-semantic-router]
      feature: [make test-and-build-local]
    image_receipts: []
    reporting: {kind: check}

  helm:
    owner: e2e
    contract: Helm charts lint, render required resources, and enforce deployment safety invariants.
    layer: packaging-contract
    selector: helm
    pr_job: core-tests
    workflow: .github/workflows/test-and-build.yml
    cadence: [pr, main, release]
    resource_class: light
    paths: [deploy/helm/**]
    local:
      fast: [make helm-lint]
      feature:
        - make helm-ci-validate HELM_REPO_UPDATE=false
        - make helm-safety-validate HELM_REPO_UPDATE=false
    image_receipts: []
    reporting: {kind: check}

  dashboard:
    owner: dashboard
    contract: Dashboard frontend and backend APIs preserve their component and handler contracts.
    layer: unit-integration
    selector: dashboard
    pr_job: dashboard
    workflow: .github/workflows/dashboard-test.yml
    cadence: [pr, main, nightly]
    resource_class: medium
    # Also triggers on the router packages the dashboard backend imports, so a
    # router-side change cannot break the dashboard without running its gate, and on
    # the gate's own definition so changes to it are self-tested (see issue #2793).
    paths:
      - dashboard/**
      - src/semantic-router/pkg/config/**
      - src/semantic-router/pkg/dsl/**
      - src/semantic-router/pkg/modelinventory/**
      - src/semantic-router/pkg/nlgen/**
      - src/semantic-router/pkg/startupstatus/**
      - tools/make/dashboard.mk
      - .github/workflows/dashboard-test.yml
    local: {fast: [make dashboard-check], feature: []}
    image_receipts: []
    reporting: {kind: check}

  operator:
    owner: operator
    contract: Operator APIs, generated manifests, bundles, and CR reconciliation remain valid.
    layer: unit-deployment
    selector: operator
    pr_job: operator
    workflow: .github/workflows/operator-ci.yml
    cadence: [pr, main, nightly]
    resource_class: heavy
    paths:
      - deploy/operator/**
      - deploy/kubernetes/crds/**
      - src/semantic-router/pkg/apis/**
    local: {fast: [make generate-crd], feature: []}
    image_receipts: [extproc, operator, operator-bundle]
    reporting: {kind: check}

  e2e:
    owner: e2e
    contract: Selected deployment profiles preserve externally visible router and gateway behavior.
    layer: deployment-e2e
    selector: e2e
    pr_job: e2e
    workflow: .github/workflows/integration-test-k8s.yml
    cadence: [pr, main, nightly]
    resource_class: heavy
    local: {fast: [make build-e2e], feature: []}
    image_receipts: [extproc]
    reporting:
      kind: e2e-profile
      artifact: e2e-test-reports

  cli:
    owner: vllm-sr-cli
    contract: CLI serve, status, logs, stop, topology, and image-pull behavior works with real containers.
    layer: runtime-integration
    selector: cli
    pr_job: cli
    workflow: .github/workflows/integration-test-vllm-sr-cli.yml
    suite: vllm-sr-cli-integration
    task_rule: vllm-sr-cli
    cadence: [pr, main, nightly]
    resource_class: heavy
    paths:
      - src/vllm-sr/**
      - tools/make/docker.mk
      - e2e/testing/vllm-sr-cli/**
    local:
      fast: [make vllm-sr-test]
      feature: [make vllm-sr-test-integration]
    image_receipts: [dashboard, extproc, vllm-sr, vllm-sr-sim]
    reporting: {kind: check}

  memory:
    owner: router-core
    contract: Memory extraction, persistence, user isolation, and prompt injection work through the served router.
    layer: runtime-integration
    selector: memory
    pr_job: memory
    workflow: .github/workflows/integration-test-memory.yml
    suite: memory-integration
    task_rule: memory-integration
    cadence: [pr, nightly]
    resource_class: heavy
    paths:
      - src/semantic-router/pkg/memory/**
      - src/semantic-router/pkg/responseapi/**
      - src/semantic-router/pkg/responsestore/**
      - src/semantic-router/pkg/extproc/*memory*
      - src/semantic-router/pkg/apiserver/*memory*
      - src/semantic-router/pkg/sessiontelemetry/*memory*
      - src/semantic-router/pkg/vectorstore/*memory*
      - src/semantic-router/pkg/cache/*memory*
      - src/vllm-sr/**/*memory*
      - tools/make/milvus.mk
      - e2e/testing/09-memory-features-test.py
      - e2e/testing/run_memory_integration.sh
      - e2e/testing/llm-katan/**
      - e2e/config/config.memory*.yaml
      - e2e/profiles/response-api/**
      - e2e/profiles/response-api-redis/**
      - e2e/profiles/response-api-redis-cluster/**
      - deploy/kubernetes/response-api/**
    local: {fast: [], feature: [make memory-test-integration]}
    image_receipts: [dashboard, extproc, llm-katan, vllm-sr, vllm-sr-sim]
    reporting: {kind: check}

  recipe-conformance:
    owner: router-core
    contract: Every maintained recipe remains structurally complete and routes all versioned probes exactly.
    layer: contract-runtime
    selector: recipe_conformance
    pr_job: recipe-conformance
    workflow: .github/workflows/recipe-conformance.yml
    suite: recipe-conformance-live
    task_rule: maintained-recipes
    cadence: [pr, main, nightly]
    resource_class: heavy
    paths:
      - config/recipes/**
      - src/semantic-router/pkg/config/**
      - src/semantic-router/pkg/classification/**
      - src/semantic-router/pkg/decision/**
      - src/semantic-router/pkg/dsl/**
      - src/semantic-router/pkg/projection/**
      - src/semantic-router/pkg/services/classification*
      - src/semantic-router/pkg/apiserver/route_classify*
      - tools/agent/scripts/recipe_conformance*
      - tools/agent/scripts/router_calibration_*
      - config/schemas/recipe-metadata-v1.schema.json
      - tools/agent/schemas/recipe-probes-v1.schema.json
      - tools/make/recipe-conformance.mk
      - e2e/testing/run_recipe_conformance.sh
      - .github/workflows/recipe-conformance.yml
    local:
      fast: [make recipe-conformance-static]
      feature: [make recipe-conformance-live-cpu-all]
    image_receipts: [vllm-sr]
    reporting:
      kind: conformance
      artifact: recipe-conformance-report
      root: .agent-harness/recipe-conformance

  openvino:
    owner: native-bindings
    contract: OpenVINO binding builds and its native tests pass.
    layer: unit-integration
    selector: openvino
    pr_job: openvino
    workflow: .github/workflows/openvino-binding-ci.yml
    cadence: [pr, main]
    resource_class: medium
    paths: [openvino-binding/**]
    local: {fast: [], feature: []}
    image_receipts: []
    reporting: {kind: check}

  images:
    owner: ci
    contract: Affected container definitions build without publishing.
    layer: packaging
    selector: images
    pr_job: images
    workflow: .github/workflows/docker-validate.yml
    cadence: [pr]
    resource_class: heavy
    local: {fast: [], feature: []}
    image_receipts: []
    reporting: {kind: build-receipt}

  performance:
    owner: performance
    contract: Covered Router hot paths emit complete CPU reports and do not regress portable allocation policy.
    layer: benchmark
    selector: performance
    pr_job: performance
    workflow: .github/workflows/performance-test.yml
    cadence: [pr, nightly, manual]
    resource_class: heavy
    paths:
      - perf/**
      - tools/make/performance.mk
      - src/semantic-router/pkg/classification/**
      - src/semantic-router/pkg/extproc/**
      - src/semantic-router/pkg/decision/**
      - src/semantic-router/pkg/selection/**
      - src/semantic-router/pkg/looper/**
    local:
      fast: [make perf-unit, make perf-validate]
      feature: [make perf-check]
    image_receipts: []
    reporting: {kind: benchmark, artifact: performance-results}

  router-learning:
    owner: router-core
    contract: Router Learning architecture evaluation stays within its quality and cost thresholds.
    layer: deterministic-evaluation
    selector: router_learning
    pr_job: router-learning
    workflow: .github/workflows/router-learning-eval.yml
    cadence: [pr, nightly]
    resource_class: light
    paths:
      - bench/agentic_routing_experiment.py
      - bench/profiles/router_learning/**
      - bench/test_agentic_routing_experiment.py
      - src/semantic-router/pkg/extproc/router_learning*
      - src/semantic-router/pkg/config/*learning*
      - src/semantic-router/pkg/routerreplay/store/learning_diagnostics.go
      - src/semantic-router/pkg/apiserver/route_router_outcomes.go
    local: {fast: [], feature: [make bench-router-learning]}
    image_receipts: []
    reporting: {kind: evaluation}

  paper:
    owner: paper
    contract: The research paper builds from maintained source and assets.
    layer: packaging
    selector: paper
    pr_job: paper
    workflow: .github/workflows/paper-build.yml
    cadence: [pr]
    resource_class: medium
    paths: [paper/**]
    local: {fast: [], feature: []}
    image_receipts: []
    reporting: {kind: build-receipt}

profiles:
  istio:
    owner: e2e
    coverage_role: istio-service-mesh-contracts
    selection: pr
    paths:
      - e2e/profiles/istio/**
      - e2e/testcases/istio_*.go
      - deploy/kubernetes/istio/**
  agentgateway:
    owner: e2e
    coverage_role: agentgateway-integration
    selection: pr
    paths:
      - e2e/profiles/agentgateway/**
      - deploy/kubernetes/agentgateway/**
  envoy-ai-gateway:
    owner: e2e
    coverage_role: baseline-router-contract
    selection: pr
    default_local: true
    full_ci: true
    paths:
      - e2e/profiles/ai-gateway/**
      - deploy/kubernetes/ai-gateway/**
  aibrix:
    owner: e2e
    coverage_role: aibrix-control-plane-and-gateway
    selection: pr
    paths: [e2e/profiles/aibrix/**, deploy/kubernetes/aibrix/**]
  dashboard:
    owner: e2e
    coverage_role: dashboard-api-contract
    selection: pr
    full_ci: true
    paths:
      - e2e/profiles/dashboard/**
      - e2e/testcases/dashboard_*.go
      - e2e/testcases/security_policy_apply.go
      - deploy/kubernetes/observability/dashboard/**
      - dashboard/backend/handlers/security_policy*.go
      - dashboard/backend/handlers/deploy.go
      - dashboard/backend/handlers/canonical_transport.go
  dynamic-config:
    owner: e2e
    coverage_role: dynamic-crd-routing-contracts
    selection: pr
    paths: [e2e/profiles/dynamic-config/**]
  multimodal-routing:
    owner: e2e
    coverage_role: image-modality-embedding-signal-routing
    selection: pr
    paths: [e2e/profiles/multimodal-routing/**]
  remote-embedding:
    owner: e2e
    coverage_role: openai-compatible-remote-embedding-provider
    selection: pr
    full_ci: true
    paths:
      - e2e/profiles/remote-embedding/**
      - e2e/testcases/remote_embedding_routing.go
  llm-d:
    owner: e2e
    coverage_role: llm-d-inference-gateway-health
    selection: pr
    paths: [e2e/profiles/llm-d/**, deploy/kubernetes/llmd-base/**]
  routing-strategies:
    owner: e2e
    coverage_role: routing-strategy-contracts
    selection: pr
    paths:
      - e2e/profiles/routing-strategies/**
      - deploy/kubernetes/routing-strategies/**
  production-stack:
    owner: e2e
    coverage_role: production-ha-load-observability
    selection: pr
    paths:
      - e2e/profiles/production-stack/**
      - deploy/kubernetes/ai-gateway/aigw-resources/base-model.yaml
      - deploy/kubernetes/ai-gateway/aigw-resources/gwapi-resources.yaml
  ml-model-selection:
    owner: e2e
    coverage_role: ml-model-selection-contracts
    selection: pr
    paths:
      - e2e/profiles/ml-model-selection/**
      - src/semantic-router/pkg/modelselection/**
      - src/training/model_selection/ml_model_selection/**
      - ml-binding/**
  multi-endpoint:
    owner: e2e
    coverage_role: environment-policy-routing
    selection: pr
    paths:
      - e2e/profiles/multi-endpoint/**
      - e2e/config/config.multi-endpoint.yaml
      - tools/demos/multi-endpoint.sh
  authz-rbac:
    owner: e2e
    coverage_role: authz-and-rate-limit-contracts
    selection: pr
    paths:
      - e2e/profiles/authz-rbac/**
      - e2e/config/config.authz-rbac.yaml
      - e2e/config/authz-profile-*.yaml
      - src/semantic-router/pkg/classification/authz*.go
      - src/semantic-router/pkg/authz/**
      - dashboard/backend/handlers/security_policy*.go
  streaming:
    owner: e2e
    coverage_role: streaming-request-and-cache
    selection: pr
    paths:
      - e2e/profiles/streaming/**
      - deploy/kubernetes/streaming/**
      - src/semantic-router/pkg/extproc/processor_req_body_streamed*.go
  anthropic-shim:
    owner: e2e
    coverage_role: anthropic-shape-backend-translation-contracts
    selection: manual
    image_receipts: [anthropic-shim]
    paths:
      - e2e/profiles/anthropic-shim/**
      - e2e/testing/anthropic-shim/**
      - deploy/kubernetes/anthropic-backend/**
      - src/semantic-router/pkg/anthropic/outbound*.go
  response-api:
    owner: e2e
    coverage_role: responses-api-memory
    selection: manual
    paths:
      - e2e/profiles/response-api/**
      - deploy/kubernetes/response-api/gwapi-resources.yaml
      - deploy/kubernetes/response-api/mock-vllm.yaml
  response-api-redis:
    owner: e2e
    coverage_role: responses-api-redis-ttl
    selection: manual
    paths:
      - e2e/profiles/response-api-redis/**
      - deploy/kubernetes/response-api/redis.yaml
  response-api-redis-cluster:
    owner: e2e
    coverage_role: responses-api-redis-cluster-ttl
    selection: manual
    paths:
      - e2e/profiles/response-api-redis-cluster/**
      - deploy/kubernetes/response-api/redis-cluster.yaml
  router-replay:
    owner: e2e
    coverage_role: router-replay-management-boundary-and-restart-recovery
    selection: manual
    paths:
      - e2e/profiles/router-replay/**
      - deploy/kubernetes/router-replay/**
      - src/semantic-router/pkg/routerreplay/**
      - src/semantic-router/pkg/extproc/router_replay*.go
      - src/semantic-router/pkg/apiserver/route_router_replay*.go
      - dashboard/backend/router/router_replay*.go
  dynamo:
    owner: e2e
    coverage_role: dynamo-gpu-and-batching
    selection: manual
    paths: [e2e/profiles/dynamo/**]
  vectorstore-registry:
    owner: e2e
    coverage_role: vectorstore-registry-restart-recovery
    selection: manual
    paths:
      - e2e/profiles/vectorstore-registry/**
      - deploy/kubernetes/router-replay/postgres.yaml
      - src/semantic-router/pkg/vectorstore/metadata_registry*.go
      - src/semantic-router/pkg/postgres/**
  rag-hybrid-search:
    owner: e2e
    coverage_role: rag-hybrid-search
    selection: manual
    paths: [e2e/profiles/rag-hybrid-search/**]
  hallucination:
    owner: e2e
    coverage_role: hallucination-detection
    selection: manual
    paths:
      - e2e/profiles/hallucination/**
      - e2e/testcases/hallucination_detection*.go
      - deploy/kubernetes/hallucination/**
      - e2e/testcases/testdata/hallucination_detection_cases.json
  jailbreak-onerror:
    owner: e2e
    coverage_role: prompt-guard-on-error
    selection: manual
    paths:
      - e2e/profiles/jailbreak-onerror/**
      - e2e/testcases/jailbreak_onerror_block.go
      - deploy/kubernetes/jailbreak-onerror/**
