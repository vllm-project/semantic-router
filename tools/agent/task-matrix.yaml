version: 1

rules:
  - name: repo-docs
    doc_only: true
    loop_mode: lightweight
    execution_plan_policy: long_horizon
    paths:
      - website/**
      - README.md
      - CONTRIBUTING.md
    fast_tests:
      - make docs-check-translation-coverage
    feature_tests: []
    requires_local_smoke: false
  - name: agent_text
    doc_only: true
    loop_mode: lightweight
    execution_plan_policy: long_horizon
    paths:
      - AGENTS.md
      - tools/agent/docs/**
      - tools/agent/skills/**
      - src/fleet-sim/AGENTS.md
      - src/fleet-sim/fleet_sim/optimizer/AGENTS.md
      - src/vllm-sr/cli/AGENTS.md
      - src/semantic-router/pkg/config/AGENTS.md
      - src/semantic-router/pkg/classification/AGENTS.md
      - src/semantic-router/pkg/extproc/AGENTS.md
      - deploy/operator/api/v1alpha1/AGENTS.md
      - deploy/operator/controllers/AGENTS.md
      - dashboard/frontend/src/AGENTS.md
      - dashboard/frontend/src/pages/AGENTS.md
      - dashboard/frontend/src/components/AGENTS.md
      - dashboard/backend/handlers/AGENTS.md
      - e2e/testcases/AGENTS.md
      - .github/copilot-instructions.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/**
      - .prowlabels.yaml
    fast_tests:
      - make agent-validate
    feature_tests: []
    requires_local_smoke: false
  - name: agent_exec
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - tools/agent/*.yaml
      - tools/agent/scripts/**
      - tools/ci/**
      - tools/make/agent.mk
      - tools/make/linter.mk
      - tools/make/pre-commit.mk
      - .pre-commit-config.yaml
      - .github/actions/**
      - .github/workflows/**
      - .mergify.yml
    fast_tests:
      - make agent-validate
    feature_tests: []
    requires_local_smoke: false
  - name: vllm-sr-cli
    domain: cli
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths: []
    fast_tests: []
    feature_tests: []
    requires_local_smoke: true
  - name: fleet-sim
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - src/fleet-sim/**
    fast_tests:
      - make vllm-sr-sim-test
    feature_tests: []
    requires_local_smoke: false
  - name: memory-integration
    domain: memory
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths: []
    fast_tests: []
    feature_tests: []
    requires_local_smoke: false
  - name: helm-chart
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - deploy/helm/**
    fast_tests:
      - make helm-lint
    feature_tests:
      - make helm-ci-validate HELM_REPO_UPDATE=false
      - make helm-safety-validate HELM_REPO_UPDATE=false
    requires_local_smoke: false
  - name: maintained-recipes
    domain: recipe-conformance
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths: []
    fast_tests: []
    feature_tests: []
    requires_local_smoke: false
  - name: router-core
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - src/semantic-router/**
    fast_tests:
      - make test-semantic-router
    feature_tests: []
    requires_local_smoke: true
  - name: rust-bindings
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - candle-binding/**
      - ml-binding/**
      - nlp-binding/**
      - onnx-binding/**
    fast_tests:
      - make test-binding-minimal
    feature_tests:
      - make test-binding-lora
    requires_local_smoke: false
  - name: ck-flash-attn-rewriter
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - onnx-binding/ort-ck-flash-attn/**
    fast_tests:
      - make ck-rewrite-test
    feature_tests: []
    requires_local_smoke: false
  - name: dashboard
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - dashboard/**
      - src/semantic-router/pkg/config/**
      - src/semantic-router/pkg/dsl/**
      - src/semantic-router/pkg/modelinventory/**
      - src/semantic-router/pkg/nlgen/**
      - src/semantic-router/pkg/startupstatus/**
      - src/vllm-sr/cli/evaluation/golden/metric_analysis_catalog.v1.json
      - src/vllm-sr/cli/evaluation/golden/research_benchmark_inventory.v1.json
      - tools/ci/sync_evaluation_catalogs.py
      - tools/make/dashboard.mk
      - .github/workflows/dashboard-test.yml
    fast_tests:
      - make dashboard-check
    feature_tests:
      - make dashboard-test-e2e-evaluation
    requires_local_smoke: true
  - name: e2e-framework
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - e2e/pkg/**
      - e2e/cmd/**
      - e2e/testcases/**
      - e2e/go.mod
      - e2e/go.sum
    fast_tests:
      - make build-e2e
    feature_tests: []
    requires_local_smoke: false
  - name: operator-stack
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - deploy/operator/**
      - deploy/kubernetes/crds/**
      - src/semantic-router/pkg/apis/**
    fast_tests:
      - make generate-crd
    feature_tests: []
    requires_local_smoke: false
  - name: training-stack
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - src/training/**
      - tools/make/models.mk
      - tools/models/train-mmbert32k-gpu.sh
      - website/docs/training/**
    fast_tests: []
    feature_tests: []
    requires_local_smoke: false
  - name: make-and-ci
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - Makefile
      - tools/make/**
    fast_tests:
      - make agent-validate
    feature_tests: []
    requires_local_smoke: false
  - name: ci-general
    doc_only: false
    loop_mode: completion
    execution_plan_policy: long_horizon
    paths:
      - .github/actions/**
      - .github/workflows/**
    fast_tests:
      - make agent-validate
    feature_tests: []
    requires_local_smoke: false
