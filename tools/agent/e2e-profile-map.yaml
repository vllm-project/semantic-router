version: 2

default_local_profiles:
  - envoy-ai-gateway

full_ci_profiles:
  - envoy-ai-gateway
  - dashboard
  - remote-embedding
  - response-api

full_ci_triggers:
  - src/semantic-router/**
  - src/vllm-sr/**
  - src/vllm-sr/Dockerfile*
  - tools/make/**
  - tools/agent/*.yaml
  - tools/agent/scripts/**
  - tools/make/agent.mk
  - .github/workflows/**
  - e2e/pkg/**
  - e2e/cmd/**
  - e2e/testcases/**
  - e2e/go.mod
  - e2e/go.sum
  - e2e/config/**

profile_rules:
  envoy-ai-gateway:
    owner: e2e
    coverage_role: baseline-router-contract
    selection_mode: default-local,full-ci
    summary: Baseline router contract for general routing, safety, cache, and decision behavior.
    paths:
      - e2e/profiles/ai-gateway/**
      - deploy/kubernetes/ai-gateway/**
  dashboard:
    owner: e2e
    coverage_role: dashboard-api-contract
    selection_mode: full-ci
    summary: Dashboard session, Management API client, delegated inference, health, and status contracts.
    paths:
      - e2e/profiles/dashboard/**
      - e2e/testcases/dashboard_*.go
      - deploy/kubernetes/observability/dashboard/**
      - dashboard/backend/**
      - dashboard/frontend/**
  aibrix:
    owner: e2e
    coverage_role: aibrix-control-plane-and-gateway
    selection_mode: full-ci
    summary: AIBrix-specific gateway and control-plane health plus a minimal router smoke path.
    paths:
      - e2e/profiles/aibrix/**
      - deploy/kubernetes/aibrix/**
  routing-strategies:
    owner: e2e
    coverage_role: routing-strategy-contracts
    selection_mode: full-ci
    summary: Keyword, entropy, and fallback routing strategy behavior.
    paths:
      - e2e/profiles/routing-strategies/**
      - deploy/kubernetes/routing-strategies/**
  remote-embedding:
    owner: e2e
    coverage_role: openai-compatible-remote-embedding-provider
    selection_mode: full-ci
    summary: OpenAI-compatible remote provider startup health and deterministic text embedding-signal routing.
    paths:
      - e2e/profiles/remote-embedding/**
      - e2e/testcases/remote_embedding_routing.go
  response-api:
    owner: e2e
    coverage_role: neutral-protocol-matrix-and-responses-api
    selection_mode: full-ci
    summary: Complete buffered and streaming protocol matrix plus memory-backed Responses API behavior.
    paths:
      - e2e/profiles/response-api/**
      - e2e/testcases/protocol_codec_matrix.go
      - deploy/kubernetes/response-api/gwapi-resources.yaml
      - deploy/kubernetes/response-api/mock-vllm.yaml
      - tools/mock-vllm/**
      - src/semantic-router/pkg/llmprotocol/**
      - src/semantic-router/pkg/protocolcodec/**
      - src/semantic-router/pkg/backendinvoker/**
      - src/semantic-router/pkg/extproc/processor_protocol_contract.go
      - src/semantic-router/pkg/extproc/processor_res_semantic_stream.go
  llm-d:
    owner: e2e
    coverage_role: llm-d-inference-gateway-health
    selection_mode: full-ci
    summary: LLM-D inference-gateway health with a minimal router smoke path.
    paths:
      - e2e/profiles/llm-d/**
      - deploy/kubernetes/llmd-base/**
  istio:
    owner: e2e
    coverage_role: istio-service-mesh-contracts
    selection_mode: full-ci
    summary: Istio sidecar, mTLS, and tracing behavior around the router.
    paths:
      - e2e/profiles/istio/**
      - e2e/testcases/istio_*.go
      - deploy/kubernetes/istio/**
  agentgateway:
    owner: e2e
    coverage_role: agentgateway-integration
    selection_mode: full-ci
    summary: Integration coverage with agentgateway's gateway controller, including backend routing and extproc policy enforcement.
    paths:
      - e2e/profiles/agentgateway/**
      - deploy/kubernetes/agentgateway/**
  production-stack:
    owner: e2e
    coverage_role: production-ha-load-observability
    selection_mode: full-ci
    summary: HA, load-balancing, failover, and performance checks for the production stack.
    paths:
      - e2e/profiles/production-stack/**
      - deploy/kubernetes/ai-gateway/aigw-resources/base-model.yaml
      - deploy/kubernetes/ai-gateway/aigw-resources/gwapi-resources.yaml
  ml-model-selection:
    owner: e2e
    coverage_role: ml-model-selection-contracts
    selection_mode: full-ci
    summary: ML-based model-selection behavior across trained selector backends.
    paths:
      - e2e/profiles/ml-model-selection/**
      - src/semantic-router/pkg/modelselection/**
      - src/training/model_selection/ml_model_selection/**
      - ml-binding/**
  multi-endpoint:
    owner: e2e
    coverage_role: environment-policy-routing
    selection_mode: full-ci
    summary: Environment-specific routing and safety policy enforcement across multiple backends.
    paths:
      - e2e/profiles/multi-endpoint/**
      - e2e/config/config.multi-endpoint.yaml
      - tools/demos/multi-endpoint.sh
  streaming:
    owner: e2e
    coverage_role: streaming-request-and-cache
    selection_mode: full-ci
    summary: Streamed request-body routing and streaming cache round-trip behavior.
    paths:
      - e2e/profiles/streaming/**
      - deploy/kubernetes/streaming/**
      - src/semantic-router/pkg/extproc/processor_req_body_streamed*.go
manual_profile_rules:
  response-api-redis:
    owner: e2e
    coverage_role: responses-api-redis-ttl
    selection_mode: manual-only
    summary: Responses API coverage for Redis-backed persistence and TTL expiry when debugging that backend directly.
    paths:
      - e2e/profiles/response-api-redis/**
      - deploy/kubernetes/response-api/redis.yaml
  response-api-redis-cluster:
    owner: e2e
    coverage_role: responses-api-redis-cluster-ttl
    selection_mode: manual-only
    summary: Responses API coverage for Redis Cluster-backed persistence and TTL expiry when debugging that backend directly.
    paths:
      - e2e/profiles/response-api-redis-cluster/**
      - deploy/kubernetes/response-api/redis-cluster.yaml
  router-replay:
    owner: e2e
    coverage_role: router-replay-management-boundary-and-restart-recovery
    selection_mode: manual-only
    summary: Authenticated Router Replay management access, public-listener denial, and Postgres restart recovery.
    paths:
      - e2e/profiles/router-replay/**
      - deploy/kubernetes/router-replay/**
      - src/semantic-router/pkg/routerreplay/**
      - src/semantic-router/pkg/extproc/router_replay*.go
      - src/semantic-router/pkg/apiserver/route_router_replay*.go
      - dashboard/backend/router/router_replay*.go
  dynamo:
    owner: e2e
    coverage_role: dynamo-gpu-and-batching
    selection_mode: manual-only
    summary: NVIDIA Dynamo deployment, batching, and GPU-health checks that require a manual execution path.
    paths:
      - e2e/profiles/dynamo/**
  vectorstore-registry:
    owner: e2e
    coverage_role: vectorstore-registry-restart-recovery
    selection_mode: manual-only
    summary: Vector Store Registry restart-recovery coverage with Postgres metadata backend, validating that store and file metadata survive pod restarts.
    paths:
      - e2e/profiles/vectorstore-registry/**
      - deploy/kubernetes/router-replay/postgres.yaml
      - src/semantic-router/pkg/vectorstore/metadata_registry*.go
      - src/semantic-router/pkg/postgres/**
  rag-hybrid-search:
    owner: e2e
    coverage_role: rag-hybrid-search
    selection_mode: manual-only
    summary: Llama Stack-backed RAG vector-store and hybrid-search behavior that runs outside the standard CI profile matrix.
    paths:
      - e2e/profiles/rag-hybrid-search/**
  hallucination:
    owner: e2e
    coverage_role: hallucination-detection
    selection_mode: manual-only
    summary: Pluggable endpoint hallucination detection backend coverage, verifying fact-check gating and response warnings.
    paths:
      - e2e/profiles/hallucination/**
      - e2e/testcases/hallucination_detection*.go
      - deploy/kubernetes/hallucination/**
      - e2e/testcases/testdata/hallucination_detection_cases.json
  jailbreak-onerror:
    owner: e2e
    coverage_role: prompt-guard-on-error
    selection_mode: manual-only
    summary: PromptGuardConfig.OnError (#2918) coverage against a real, deliberately unreachable classifier endpoint - verifies on_error:block closes the request instead of silently allowing it through.
    paths:
      - e2e/profiles/jailbreak-onerror/**
      - e2e/testcases/jailbreak_onerror_block.go
      - deploy/kubernetes/jailbreak-onerror/**

workflow_suite_rules:
  recipe-conformance-live:
    owner: router-core
    kind: workflow-integration
    summary: Auto-discovered maintained recipe probes against a live CPU router.
    workflow: .github/workflows/recipe-conformance.yml
    change_filter: recipe_conformance
    local_command: make recipe-conformance-live-cpu-all
    paths:
      - config/recipes/**
      - config/schemas/recipe-metadata-v1.schema.json
      - src/semantic-router/pkg/config/**
      - src/semantic-router/pkg/classification/**
      - src/semantic-router/pkg/decision/**
      - src/semantic-router/pkg/dsl/**
      - src/semantic-router/pkg/projection/**
      - src/semantic-router/pkg/services/classification*
      - src/semantic-router/pkg/apiserver/route_classify*
      - tools/agent/scripts/recipe_conformance*
      - tools/agent/scripts/router_calibration_*
      - tools/agent/schemas/recipe-probes-v1.schema.json
      - tools/make/recipe-conformance.mk
      - e2e/testing/run_recipe_conformance.sh
      - .github/workflows/recipe-conformance.yml
  vllm-sr-cli-integration:
    owner: vllm-sr-cli
    kind: workflow-integration
    summary: Real-container CLI integration coverage for serve, status, logs, stop, and image-pull behavior.
    workflow: .github/workflows/integration-test-vllm-sr-cli.yml
    change_filter: cli
    local_command: make vllm-sr-test-integration
    paths:
      - src/vllm-sr/**
      - tools/make/docker.mk
      - e2e/testing/vllm-sr-cli/**
  memory-integration:
    owner: router-core
    kind: workflow-integration
    summary: Memory extraction, Milvus persistence, and injection behavior through the served router stack.
    workflow: .github/workflows/integration-test-memory.yml
    change_filter: memory
    local_command: make memory-test-integration
    paths:
      - src/semantic-router/pkg/memory/**
      - src/semantic-router/pkg/extproc/*memory*
      - src/semantic-router/pkg/responseapi/**
      - src/semantic-router/pkg/responsestore/**
      - src/semantic-router/pkg/apiserver/*memory*
      - src/semantic-router/pkg/sessiontelemetry/*memory*
      - src/semantic-router/pkg/vectorstore/*memory*
      - src/semantic-router/pkg/cache/*memory*
      - src/vllm-sr/**/*memory*
      - tools/make/milvus.mk
      - e2e/testing/09-memory-features-test.py
      - e2e/testing/run_memory_integration.sh
      - e2e/testing/llm-katan/**
      - e2e/config/config.memory*.yaml
      - e2e/profiles/response-api/**
      - e2e/profiles/response-api-redis/**
      - e2e/profiles/response-api-redis-cluster/**
      - deploy/kubernetes/response-api/**
