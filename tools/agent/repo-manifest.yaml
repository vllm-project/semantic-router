version: 1
default_env: cpu
supported_envs:
  cpu-local:
    aliases:
    - cpu
    build_target: make vllm-sr-dev
    serve_command: vllm-sr serve --image-pull-policy never
    description: Default local Docker image workflow.
    local_env: true
    smoke_config: e2e/config/config.agent-smoke.cpu.yaml
  amd-local:
    aliases:
    - amd
    build_target: make vllm-sr-dev VLLM_SR_PLATFORM=amd
    serve_command: vllm-sr serve --image-pull-policy never --platform amd
    description: AMD ROCm local workflow.
    local_env: true
    smoke_config: e2e/config/config.agent-smoke.amd.yaml
    deployment_reference: website/docs/installation/amd-rocm.md
    example_config: config/recipes/balance/config.yaml
  ci-k8s:
    aliases:
    - ci-k8s
    build_target: make build-e2e
    serve_command: make e2e-test
    description: kind/Kubernetes merge-gate workflow.
    local_env: false
subsystems:
- name: vllm-sr-cli
  paths:
  - src/vllm-sr/**
  - src/vllm-sr/Dockerfile*
  - src/vllm-sr/Makefile
  entrypoints:
  - src/vllm-sr/cli/main.py
  - src/vllm-sr/cli/core.py
  - src/vllm-sr/cli/commands/runtime.py
  - src/vllm-sr/cli/container_cli.py
  - tools/make/docker.mk
- name: fleet-sim
  paths:
  - src/fleet-sim/**
  - website/docs/fleet-sim/**
  - website/static/files/fleet-sim/**
  - website/static/img/fleet-sim/**
  - .github/workflows/pypi-publish-vllm-sr-sim.yml
  entrypoints:
  - src/fleet-sim/run_sim.py
  - src/fleet-sim/fleet_sim/api/app.py
  - src/fleet-sim/Dockerfile
  - tools/make/docker.mk
- name: router-core
  paths:
  - src/semantic-router/**
  - config/**
  entrypoints:
  - src/semantic-router/cmd/main.go
- name: rust-bindings
  paths:
  - candle-binding/**
  - ml-binding/**
  - nlp-binding/**
  - onnx-binding/**
  entrypoints:
  - candle-binding/src/lib.rs
  - ml-binding/src/lib.rs
  - nlp-binding/src/lib.rs
  - onnx-binding/src/lib.rs
- name: dashboard
  paths:
  - dashboard/**
  entrypoints:
  - dashboard/backend/main.go
  - dashboard/frontend/src/main.tsx
- name: e2e
  paths:
  - e2e/**
  - deploy/kubernetes/**
  - deploy/helm/**
  - deploy/kserve/**
  - deploy/openshift/**
  entrypoints:
  - e2e/cmd/e2e/main.go
  - e2e/profiles/all/imports.go
  - deploy/helm/semantic-router/Chart.yaml
  - deploy/helm/semantic-router/values.yaml
- name: agent-contract
  paths:
  - AGENTS.md
  - tools/agent/docs/**
  - tools/agent/skills/**
  - tools/agent/schemas/**
  - tools/agent/*.yaml
  - tools/agent/scripts/**
  - .github/copilot-instructions.md
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/ISSUE_TEMPLATE/**
  - .prowlabels.yaml
  entrypoints:
  - AGENTS.md
  - tools/agent/docs/README.md
  - tools/agent/scripts/agent_gate.py
validation:
  smoke:
    container_name: vllm-sr-container
    dashboard_url: http://localhost:8700
    status_command: vllm-sr status all
    router_health_path: http://localhost:8000/health
    envoy_ready_path: http://localhost:8801/ready
  e2e:
    default_local_profile: envoy-ai-gateway
    full_ci_profiles:
    - envoy-ai-gateway
    - dashboard
    - remote-embedding
    - response-api
docs:
- AGENTS.md
- tools/agent/docs/README.md
- tools/agent/docs/maintainer-ops.md
- tools/agent/docs/governance.md
- tools/agent/docs/context-management.md
- tools/agent/docs/plans/README.md
- tools/agent/docs/tech-debt-register.md
- tools/agent/docs/tech-debt/README.md
- tools/agent/docs/amd-local.md
- tools/agent/docs/nvidia-local.md
- tools/agent/docs/architecture-guardrails.md
- tools/agent/docs/openai-api-contracts.md
- tools/agent/docs/architecture-scorecard.md
