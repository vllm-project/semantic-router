- tools/agent/docs/change-surfaces.md
- tools/agent/docs/environments.md
- tools/agent/docs/feature-complete-checklist.md
- tools/agent/docs/glossary.md
- tools/agent/docs/local-rules.md
- tools/agent/docs/module-boundaries.md
- tools/agent/docs/repo-map.md
- tools/agent/docs/skill-catalog.md
- tools/agent/docs/testing-strategy.md
- tools/agent/docs/plans/pl-0032-architecture-scorecard-ratchet.md
- tools/agent/docs/plans/pl-0037-router-flow-eval-campaign.md
