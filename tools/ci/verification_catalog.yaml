# Versioned required inventory, shared by /ci run full, weekly and release. A new
# public PR-CI deployment must be mapped here, not silently treated as a rotation.
# Authoring tools remain affected/manual contracts, outside product qualification.
full_cpu:
  version: 5
  required:
    - quality
    - generated-contracts
    - security
    - core
    - storage
    - dashboard
    - operator
    - operator.source
    - local.cli
    - local.memory
    - recipe-conformance
    - platform.models-cpu
    - platform.image-calibration-cpu
    - performance
    - cli-package
    - cli-unit
    - model-runtime
    - mock-provider
    - harness-tools
    - e2e-unit
    - e2e.standalone
    - e2e.envoy-ai-gateway
    - e2e.routing-errors
    - e2e.local-classifier-backend
    - e2e.dashboard
    - e2e.remote-embedding
    - e2e.streaming
    - e2e.vela-omni
    - e2e.vela-halu
    - e2e.vela-shield
    - e2e.multimodal-routing
  support_contracts:
    Helm chart: [core, e2e.standalone]
    Local deployment: [local.cli]
    Kubernetes Operator: [operator]
    Agent Router: [e2e.envoy-ai-gateway]
    Streaming with Agent Router: [e2e.streaming]
  excluded:
    cuda: No CUDA runner is declared in this CPU inventory; image build is not device qualification.
    rocm: No ROCm runner is declared in this CPU inventory; image build is not device qualification.
    manual-deployments: Public Manual integrations require their opt-in services or hardware.
    experimental-examples: Experimental examples are not promoted to release obligations.
