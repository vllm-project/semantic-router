    services: [kind]
    runtime: model-runtime
    device: cpu
    inventory: operator-memory-reconcile-and-routed-request
  local.cli:
    layer: product
    execution: approved
    display_name: Stack Lifecycle and Routing
    activity: test
    boundary: [e2e]
    executor: local
    category: e2e
    workflow: .github/workflows/test-local.yml
