version: 1
# Verification boundaries are independent of features, launchers and inference providers.
# Paths belong only in tools/agent/domains.yaml; concrete cases belong to their framework.
defaults:
  execution_target: linux-amd64-cpu
  runtime: none
  device: none
  images: []
  services: []
  setup_environment: default
# Contracts choose placement and batching independently. Exclusive is an
# explicit opt-out: it never changes which assertions produce a receipt.
batching:
  policies:
    components:
      max_contracts: 1
      max_minutes: 330
      overhead_minutes: 15
    shared-components:
      max_contracts: 4
      max_minutes: 180
      overhead_minutes: 15
    integration:
      max_contracts: 3
      max_minutes: 270
      overhead_minutes: 30
    exclusive:
      max_contracts: 1
      max_minutes: 330
      overhead_minutes: 30
  executor_defaults:
    tools:
      batch_policy: components
      timeout_minutes: 45
      setup_environment: tools
    platform:
      batch_policy: integration
      timeout_minutes: 120
    e2e:
      batch_policy: integration
      timeout_minutes: 90
component_workers:
  # Compatible contracts share bounded workers and retain independent evidence.
  cli:
    display_name: CLI
    go: false
  model:
    display_name: Model Tools
    go: false
  router:
    display_name: Router Tools
    go: true
verifications:
  quality:
    layer: source
    execution: automatic
    display_name: Source Quality
    activity: quality
    boundary: []
    executor: quality
    category: quality
    workflow: .github/workflows/pre-commit.yml
    always: true
    inventory: changed-source-format-lint-v1
  generated-contracts:
    layer: source
    execution: automatic
    display_name: Generated Contracts
    activity: quality
    boundary: []
    executor: generated
    category: quality
    workflow: .github/workflows/check-generated.yml
    inventory: canonical-generated-contracts-v1
  security:
    layer: source
    execution: automatic
    display_name: Security Checks
    activity: quality
    boundary: []
    executor: security
    category: quality
    workflow: .github/workflows/security-scan.yml
    inventory: trusted-ast-and-rendered-iac-v1
  soak-tools:
    layer: router
    execution: automatic
    display_name: Soak Tools
    activity: test
    boundary: [unit, integration]
    executor: tools
    category: components
    worker: router
    workflow: .github/workflows/test-tools.yml
    target: soak-test
    inventory: soak-client-and-fault-proxy-framework-discovery
  core:
    layer: router
    execution: automatic
    display_name: Core Tests
    activity: test
    boundary: [unit, integration]
    executor: core
    category: components
    workflow: .github/workflows/test-and-build.yml
    inventory: go-core-and-selector-parity
  storage:
    layer: runtime
    execution: approved
    display_name: Storage Integration
    activity: test
    boundary: [integration]
    executor: storage
    category: integration
    workflow: .github/workflows/test-storage.yml
    services: [milvus, redis, qdrant, valkey, postgres]
