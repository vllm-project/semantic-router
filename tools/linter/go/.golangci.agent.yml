version: "2"

run:
  timeout: "5m"

linters:
  # The changed-file gate owns exact declaration debt. Keep every complexity
  # linter active and let neither generated markers nor path rules hide source.
  default: none
  enable:
    - cyclop
    - funlen
    - gocognit
    - interfacebloat
    - nestif
  settings:
    cyclop:
      max-complexity: 12
    funlen:
      lines: 100
      statements: 40
    gocognit:
      min-complexity: 20
    interfacebloat:
      max: 5
    nestif:
      min-complexity: 4
  exclusions:
    generated: disable

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Preserve every enabled complexity dimension at a declaration. The debt
  # ratchet owns de-duplication by stable AST identity instead of hiding
  # same-line diagnostics in GolangCI's output processor.
  uniq-by-line: false
