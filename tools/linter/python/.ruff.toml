line-length = 88
target-version = "py310"

[lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "E501",
  "PLR09",   # numeric function/method counts are review signals, not correctness gates
  "PLR1702", # nested-block count is covered by the advisory structure report
]

[lint.per-file-ignores]
"src/training/decision2/**/*.py" = [
  # This imported research workspace has native GPU-only lazy dependencies,
  # quoted multilingual task text, and many small protocol literals. Retain
  # the remaining correctness and security rules for every file.
  "B007",
  "B905",
  "C401",
  "C408",
  "C416",
  "E731",
  "N806",
  "N812",
  "N818",
  "PLC0206",
  "PLC0415",
  "PLR1714",
  "PLR2004",
  "PLW1510",
  "PLW2901",
  "RUF001",
  "RUF005",
  "RUF012",
  "SIM102",
  "SIM117",
]
"tools/security/*.py" = [
  "N806",     # constant-like variables inside functions (STRING_TYPES)
  "PLC0415",  # lazy imports for optional tree-sitter
  "PLR2004",  # threshold magic numbers are readable inline
  "PLW0603",  # global for module-level allowlist cache
  "PLW1510",  # subprocess.run without check= (intentional)
  "PLW2901",  # loop var reassignment (line = line.strip())
]
"src/vllm-sr/cli/models.py" = ["I001", "N815", "PLC0415", "SIM114", "UP006", "UP035", "UP045"]
"src/vllm-sr/cli/parser.py" = ["B904", "F541", "I001", "UP006", "UP015", "UP035"]
"src/vllm-sr/cli/validator.py" = ["F401", "I001", "PLR2004", "RUF013", "SIM102", "UP006", "UP035"]
