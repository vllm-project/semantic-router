line-length = 88
target-version = "py310"

[lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "E501",
  "PLR09",   # numeric function/method counts are review signals, not correctness gates
  "PLR1702", # nested-block count is covered by the advisory structure report
]

[lint.per-file-ignores]
"tools/security/*.py" = [
  "N806",     # constant-like variables inside functions (STRING_TYPES)
  "PLC0415",  # lazy imports for optional tree-sitter
  "PLR2004",  # threshold magic numbers are readable inline
  "PLW0603",  # global for module-level allowlist cache
  "PLW1510",  # subprocess.run without check= (intentional)
  "PLW2901",  # loop var reassignment (line = line.strip())
]
"src/vllm-sr/cli/models.py" = ["I001", "N815", "PLC0415", "SIM114", "UP006", "UP035", "UP045"]
"src/vllm-sr/cli/parser.py" = ["B904", "F541", "I001", "UP006", "UP015", "UP035"]
"src/vllm-sr/cli/validator.py" = ["F401", "I001", "PLR2004", "RUF013", "SIM102", "UP006", "UP035"]
# Fleet-sim retains its pre-existing local style conventions; correctness rules
# remain enabled here.
"src/fleet-sim/**/*.py" = [
  "B007",
  "B008",
  "B904",
  "B905",
  "E402",
  "E741",
  "F401",
  "F821",
  "F841",
  "N802",
  "N803",
  "N806",
  "N812",
  "N814",
  "PLC0415",
  "PLR2004",
  "PLW1510",
  "PLW2901",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF005",
  "RUF012",
  "RUF022",
  "RUF046",
  "SIM105",
  "SIM108",
  "SIM115",
]
"tools/agent/scripts/tuning/engine.py" = [
  "E402",     # re-exports at bottom of module (after all definitions)
  "F401",     # re-exported names appear unused locally
  "PLR2004",  # threshold/weight magic numbers are readable inline
  "SIM102",   # nested ifs mirror the trace-tree dispatch pattern
]
"tools/agent/scripts/tuning/engine_selection.py" = [
  "PLR2004",  # threshold/weight magic numbers are readable inline
]
"tools/agent/scripts/tuning/scenarios/*.py" = ["PLR2004"]
"tools/agent/scripts/tuning/tests/*.py" = ["PLC0415", "PLR2004"]
"tools/mcp-classifier-server/server_*.py" = [
  "N812",     # torch.nn.functional as F is the PyTorch convention
  "PLC0415",  # aiohttp is an optional dependency used only in HTTP mode
]
"src/vllm-sr/tests/*.py" = ["PLR2004"]
"e2e/testing/anthropic-shim/tests/*.py" = ["PLR2004"]
"bench/grounded_fusion/test_*.py" = ["PLR2004"]
"bench/test_*.py" = ["PLR2004"]
"bench/reasoning/test_*.py" = ["PLR2004"]
"bench/reasoning/router_reason_bench_multi_dataset.py" = [
  "PLR2004",  # answer-parsing and token thresholds are readable inline
]
"tools/mock-vllm/tests/*.py" = ["PLR2004"]
"tools/mock-vllm/app.py" = [
  "PLR0911",  # endpoint dispatch keeps one response path per request outcome
]
"src/vllm-sr/tests/test_config_template.py" = ["E402", "UP015"]
"src/training/model_embeddings/cache_embeddings/lora_trainer.py" = [
  "N812",     # torch.nn.functional as F is the PyTorch convention
]
"src/vllm-sr/tests/test_hybrid_validator.py" = ["I001"]
"src/vllm-sr/tests/test_latency_validation.py" = ["I001"]
"src/vllm-sr/tests/test_plugin_parsing.py" = ["I001", "RUF043"]
"src/vllm-sr/tests/test_setup_bootstrap.py" = ["I001", "UP015"]
