version: v0.5
listeners:
  - name: public
    address: 127.0.0.1
    port: 8899
    timeout: 120s
providers:
  defaults:
    model: backend-model
  models:
    - name: backend-model
      provider_model_id: replace-with-served-model
      api_format: openai
      backend_refs:
        - name: external
          base_url: http://inference.example:8000/v1
          provider: vllm
          api_key_env: VSR_BACKEND_API_KEY
          weight: 100
      modality: ar
recipes:
  - name: default
    decisions:
      - name: default-route
        priority: 1
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: backend-model
entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
global:
  router:
    model_selection:
      enabled: false
  services:
    response_api:
      enabled: false
    observability:
      tracing:
        enabled: false
  model_catalog: {}
