name: Community Label Sync

# Runs only from trusted default-branch code after Community admission checks,
# reviews, and check-suite completion. It never executes pull-request code.
on:
  workflow_run:
    workflows: [Community]
    types: [completed]
  check_suite:
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: community-label-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull-request-state:
    name: Synchronize pull request state
    if: >-
      (github.event_name == 'workflow_run'
      && (github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'pull_request_review')
      && github.event.workflow_run.pull_requests[0] != null)
      || (github.event_name == 'check_suite'
      && github.event.check_suite.pull_requests[0] != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Synchronize PR state, owner, and milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/community_lifecycle.py sync-pr --event "$GITHUB_EVENT_PATH"

  pull-request-sweep:
    name: Reconcile pull request labels
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconcile the pull request queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/community_lifecycle.py sync-prs --event "$GITHUB_EVENT_PATH"
