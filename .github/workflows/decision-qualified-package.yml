name: Qualify and Package Decision Runtime

on:
  workflow_call:
    inputs:
      mode:
        description: Protected main or stable release package context.
        required: true
        type: string
      tag:
        description: Exact stable tag for release mode.
        default: ''
        type: string

permissions:
  contents: read

jobs:
  rocm:
    name: Qualify Six Decision Models on ROCm
    # The protected runner must provide six live, attested old/new service
    # pairs through its protected baseline configuration.
    if: >-
      github.repository == 'vllm-project/semantic-router'
      && github.event_name == 'push'
      && ((inputs.mode == 'main' && github.ref == 'refs/heads/main')
        || (inputs.mode == 'release' && startsWith(github.ref, 'refs/tags/v')
          && github.ref_name == inputs.tag))
      && vars.DECISION_RUNTIME_RELEASE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, decision-rocm]
    environment: decision-runtime-release
    timeout-minutes: 360
    concurrency:
      group: decision-rocm-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_ref: ${{ steps.candidate.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-published-digest-decision-runtime-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-cpu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a clean source and device-qualified runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 -uall)"
          command -v docker
          command -v skopeo
          command -v rocminfo
          rocminfo >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish a source-bound ROCm candidate
        id: candidate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/decision-registry-auth.json
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/semantic-router/decision-runtime-rocm-staging:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="$(python3 -c 'import sys; sys.path.insert(0, "tools/ci"); from image_artifacts import DECISION_RUNTIME_BASES; print(DECISION_RUNTIME_BASES["decision-runtime-rocm"][0])')"
          src/vllm-sr/decision_runtime/image/build-image.sh rocm "$base" "$image" python3
          docker push "$image"
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          manifest="$(mktemp "${RUNNER_TEMP}/decision-rocm-manifest.XXXXXXXX")"
          skopeo inspect --raw "docker://${image}" > "$manifest"
          digest="sha256:$(sha256sum "$manifest" | cut -d ' ' -f1)"
          reference="${image%:*}@${digest}"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - name: Generate six live model receipts from the exact candidate digest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CANDIDATE_REF: ${{ steps.candidate.outputs.reference }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/decision-registry-auth.json
          GPU_DEVICE: ${{ vars.DECISION_ROCM_DEVICE || '0' }}
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/decision-cli"
          "${RUNNER_TEMP}/decision-cli/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/decision-cli/bin/python" -m pip install -e src/vllm-sr
          export PATH="${RUNNER_TEMP}/decision-cli/bin:${PATH}"
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          python3 tools/ci/decision_rocm_qualify.py \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --candidate-ref "$CANDIDATE_REF" \
            --output-dir "${RUNNER_TEMP}/decision-rocm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --port "$port" \
            --gpu-device "$GPU_DEVICE"
          python3 tools/ci/decision_rocm_promotion.py \
            --receipt "${RUNNER_TEMP}/decision-rocm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qualification.json" \
            --owner "$GITHUB_REPOSITORY_OWNER"
      - name: Produce paired performance from protected live services
        env:
          BASELINE_CONFIG: ${{ vars.DECISION_PAIRED_BASELINE_CONFIG_PATH }}
          CANDIDATE_REF: ${{ steps.candidate.outputs.reference }}
        run: |
          set -euo pipefail
          test -n "$BASELINE_CONFIG"
          test -f "$BASELINE_CONFIG"
          python3 tools/ci/decision_perf_release_producer.py \
            --baseline-config "$BASELINE_CONFIG" \
            --qualification-receipt "${RUNNER_TEMP}/decision-rocm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qualification.json" \
            --candidate-ref "$CANDIDATE_REF" --owner "$GITHUB_REPOSITORY_OWNER" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-dir "${RUNNER_TEMP}/decision-paired-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Require a same-source paired performance report
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/decision-paired-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/report.json"
          test -s "$report"
          test -f tools/ci/decision_perf_release_gate.py
          python3 tools/ci/decision_perf_release_gate.py validate \
            --report "$report" --source-sha "$GITHUB_SHA" \
            --qualification-receipt "${RUNNER_TEMP}/decision-rocm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/qualification.json" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --candidate-ref "${{ steps.candidate.outputs.reference }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve qualified receipt and model evidence
        uses: actions/upload-artifact@v4
        with:
          name: decision-rocm-qualified-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/decision-rocm-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
            ${{ runner.temp }}/decision-rocm-${{ github.run_id }}-${{ github.run_attempt }}/models/*.json
            ${{ runner.temp }}/decision-rocm-${{ github.run_id }}-${{ github.run_attempt }}/raw/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve validated paired performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: decision-paired-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decision-paired-performance-${{ github.run_id }}-${{ github.run_attempt }}/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Qualify the exact published CPU digest with three live models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/decision-registry-auth.json
        run: |
          set -euo pipefail
          export PATH="${RUNNER_TEMP}/decision-cli/bin:${PATH}"
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          digest="$(<.agent-harness/decision-cpu/published-digest.txt)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          published_ref="ghcr.io/${owner}/semantic-router/decision-runtime-cpu@${digest}"
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          python3 tools/ci/decision_cpu_qualify.py \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --published-ref "$published_ref" \
            --output-dir "${RUNNER_TEMP}/decision-cpu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --port "$port"
      - name: Preserve CPU model-backed qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: decision-cpu-qualified-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/decision-cpu-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
            ${{ runner.temp }}/decision-cpu-${{ github.run_id }}-${{ github.run_attempt }}/models/*.json
            ${{ runner.temp }}/decision-cpu-${{ github.run_id }}-${{ github.run_attempt }}/raw/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package:
    name: Bind Published Digests and Build Qualified Package
    needs: rocm
    if: needs.rocm.result == 'success'
    runs-on: ubuntu-24.04
    environment: decision-runtime-release
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ci-published-digest-decision-runtime-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-cpu
      - uses: actions/download-artifact@v4
        with:
          name: decision-cpu-qualified-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-cpu-qualified
      - uses: actions/download-artifact@v4
        with:
          name: decision-rocm-qualified-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-rocm
      - uses: actions/download-artifact@v4
        with:
          name: decision-paired-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-performance
      - name: Install image and packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          python3 -m pip install build twine PyYAML==6.0.3 jsonschema==4.26.0
      - name: Log in for digest-preserving ROCm promotion
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/decision-registry-auth.json
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Recheck paired performance before image promotion
        run: |
          set -euo pipefail
          python3 tools/ci/decision_perf_release_gate.py validate \
            --report .agent-harness/decision-performance/report.json \
            --source-sha "$GITHUB_SHA" \
            --qualification-receipt .agent-harness/decision-rocm/qualification.json \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --candidate-ref "${{ needs.rocm.outputs.candidate_ref }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Promote the tested ROCm digest and inject the release lock
        env:
          CANDIDATE_REF: ${{ needs.rocm.outputs.candidate_ref }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/decision-registry-auth.json
        run: |
          set -euo pipefail
          mkdir -p .agent-harness/decision-release
          python3 tools/ci/decision_rocm_promotion.py \
            --receipt .agent-harness/decision-rocm/qualification.json \
            --owner "$GITHUB_REPOSITORY_OWNER" --promote
          digest="${CANDIDATE_REF##*@}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          rocm_ref="ghcr.io/${owner}/semantic-router/decision-runtime-rocm@${digest}"
          printf '%s\n' "$rocm_ref" > .agent-harness/decision-release/rocm-ref.txt
          python3 tools/ci/decision_image_lock_release.py generate \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --cpu-digest-file .agent-harness/decision-cpu/published-digest.txt \
            --cpu-receipt .agent-harness/decision-cpu-qualified/qualification.json \
            --rocm-receipt .agent-harness/decision-rocm/qualification.json \
            --rocm-published-ref "$rocm_ref" \
            --output src/vllm-sr/cli/decision_runtime/decision-images.lock.json
      - name: Build and verify the post-qualification wheel and sdist
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/ci/package_contract.py --mode "$MODE" --tag "$TAG" \
            --base-ref "$GITHUB_SHA" --output .agent-harness/decision-package
          shopt -s nullglob
          wheels=(.agent-harness/decision-package/dist/*.whl)
          sdists=(.agent-harness/decision-package/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python3 tools/ci/decision_image_lock_release.py check-dist \
            --lock src/vllm-sr/cli/decision_runtime/decision-images.lock.json \
            --wheel "${wheels[0]}" --sdist "${sdists[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: decision-qualified-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-package/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: decision-qualified-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent-harness/decision-cpu/published-digest.txt
            .agent-harness/decision-cpu-qualified/qualification.json
            .agent-harness/decision-cpu-qualified/models/*.json
            .agent-harness/decision-cpu-qualified/raw/**
            .agent-harness/decision-rocm/qualification.json
            .agent-harness/decision-rocm/models/*.json
            .agent-harness/decision-rocm/raw/**
            .agent-harness/decision-performance/**
            .agent-harness/decision-release/rocm-ref.txt
            src/vllm-sr/cli/decision_runtime/decision-images.lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Require Complete Decision Release Evidence
    if: always()
    needs: [rocm, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed when the protected runner or registry is unavailable
        env:
          ROCM_RESULT: ${{ needs.rocm.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$ROCM_RESULT" = success
          test "$PACKAGE_RESULT" = success
