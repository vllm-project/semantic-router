name: RISC-V QEMU Candle CPU

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  CGO_ENABLED: 1

jobs:
  candle-cpu:
    name: Candle CPU classifiers and router
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90
          targets: riscv64gc-unknown-linux-gnu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install RISC-V cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            pkg-config \
            qemu-user-static

      - name: Install HuggingFace CLI
        run: pip install -U "huggingface_hub[cli]" hf_transfer

      - name: Cache the Vela Domain classifier
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: models/Vela-1.0-Encoder-307M-Domain
          key: ${{ runner.os }}-riscv-vela-domain-f6354f54
          restore-keys: |
            ${{ runner.os }}-riscv-vela-domain-

      - name: Download the Vela Domain classifier
        run: make download-riscv-classifier
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ENABLE_HF_TRANSFER: "1"

      - name: Run Candle classifier tests and router smoke under qemu-user
        run: make test-riscv-qemu
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
