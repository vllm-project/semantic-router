name: Dashboard Tests

on:
  workflow_call:
    inputs:
      native-artifact:
        type: string
        default: ""
      verification:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dashboard-test:
    name: Dashboard Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Go
        uses: ./.github/actions/setup-go-ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            dashboard/frontend/node_modules
          key: ${{ runner.os }}-node-dashboard-${{ hashFiles('dashboard/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-dashboard-



      - name: Resolve golangci-lint version
        id: golangci_lint
        run: echo "version=v$(cat tools/linter/go/golangci-lint.version)" >> "$GITHUB_OUTPUT"

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-mode: binary
          args: --help

      - name: Load shared native libraries
        if: inputs.native-artifact != ''
        uses: ./.github/actions/load-native-artifact
        with:
          artifact: ${{ inputs.native-artifact }}

      - name: Check, test, and build Dashboard with one dependency installation
        run: make dashboard-check dashboard-test-wasm dashboard-test-e2e-evaluation dashboard-build

      - name: Record actual Dashboard framework evidence
        if: inputs.verification != ''
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ci/workflow_evidence.py --verification "$VERIFICATION" \
            --go-json .agent-harness/dashboard/backend.jsonl \
            --go-inventory .agent-harness/dashboard/inventory.jsonl \
            --exclude-go TestEvaluationStoreOwnershipSubprocessHelper \
            --exclude-go TestControlledPairSubprocessCrashHelper \
            --evidence .agent-harness/dashboard/frontend.json \
            --evidence .agent-harness/dashboard/wasm/evidence.json \
            --junit .agent-harness/dashboard/browser.xml \
            --output .agent-harness/dashboard/result.json
      - uses: actions/upload-artifact@v4
        if: inputs.verification != ''
        with:
          name: ci-result-dashboard
          path: .agent-harness/dashboard/result.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload WASM test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-wasm-evidence
          path: .agent-harness/dashboard/wasm/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Evaluation browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-browser-diagnostics
          path: |
            dashboard/frontend/playwright-report
            dashboard/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show results on failure
        if: failure()
        run: |
          echo "::error::Dashboard checks failed. Please fix the issues and commit again."
          echo ""
          echo "To run checks locally:"
          echo "  make dashboard-check"
          echo ""
          echo "To run Evaluation browser acceptance:"
          echo "  make dashboard-test-e2e-evaluation"
          echo ""
          echo "To run only the backend Go tests:"
          echo "  make dashboard-test-backend"
          echo ""
          echo "The backend tests need the vllm-sr CLI importable:"
          echo "  pip install -e src/vllm-sr"
          echo ""
          echo "To auto-fix lint issues:"
          echo "  make dashboard-lint-fix"
