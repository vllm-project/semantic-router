name: Integration Test [vLLM-SR CLI]

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli-tests:
    name: CLI E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VLLM_SR_TEST_OUTPUT_DIR: ${{ github.workspace }}/.agent-harness/cli

    steps:
      #######################################
      # Setup
      #######################################
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          show-usage: "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vllm-sr CLI
        run: |
          pip install -e src/vllm-sr
          vllm-sr --version

      #######################################
      # Run CLI Tests
      #######################################
      - name: Run CLI Integration Tests
        run: make vllm-sr-test-integration

      - name: Upload CLI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-logs
          path: ${{ env.VLLM_SR_TEST_OUTPUT_DIR }}/command.log
          include-hidden-files: true
          retention-days: 7
