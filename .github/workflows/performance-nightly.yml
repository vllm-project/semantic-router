name: Nightly Performance Trends

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-trends:
    uses: ./.github/workflows/performance-test.yml
    with:
      environment: cpu
      profile: nightly
      runner: ubuntu-latest
      baseline: perf/testdata/baselines/cpu-ci.json
