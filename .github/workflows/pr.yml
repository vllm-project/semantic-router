name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci/full') && 'checks' || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    if: >-
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
      || github.event.label.name == 'ci/full'
    uses: ./.github/workflows/ci-changes.yml

  quality:
    name: Core quality
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
    uses: ./.github/workflows/pre-commit.yml
    with:
      docs_only: >-
        ${{ needs.changes.outputs.docs_only == 'true'
            && needs.changes.outputs.full != 'true' }}
      website: ${{ needs.changes.outputs.website == 'true' }}
      domains: ${{ needs.changes.outputs.domains }}

  security:
    name: Core security
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && (needs.changes.outputs.security == 'true'
        || needs.changes.outputs.full == 'true')
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      security-events: write

  core-tests:
    name: Core tests
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && (needs.changes.outputs.core_test == 'true'
        || needs.changes.outputs.full == 'true')
    uses: ./.github/workflows/test-and-build.yml
    with:
      check_ck: ${{ contains(fromJSON(needs.changes.outputs.domains), 'ck-flash-attn-rewriter') || needs.changes.outputs.full == 'true' }}
    secrets: inherit

  python-unit:
    name: Python unit tests
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.python_unit == 'true'
    uses: ./.github/workflows/python-unit.yml
    with:
      domains: ${{ needs.changes.outputs.full == 'true' && '["vllm-sr-cli","fleet-sim","training"]' || needs.changes.outputs.domains }}
      cli_integration: ${{ needs.changes.outputs.cli == 'true' }}

  dashboard:
    name: Dashboard
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.dashboard == 'true'
    uses: ./.github/workflows/dashboard-test.yml

  operator:
    name: Operator
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.operator == 'true'
    uses: ./.github/workflows/operator-ci.yml
    with:
      run_integration: true
      integration_matrix: >-
        ${{ needs.changes.outputs.full == 'true'
            && '[{"cache-backend":"memory","deploy-redis":false,"deploy-milvus":false,"deploy-qdrant":false,"router-name":"test-router"},{"cache-backend":"redis","deploy-redis":true,"deploy-milvus":false,"deploy-qdrant":false,"router-name":"test-router-redis"},{"cache-backend":"milvus","deploy-redis":false,"deploy-milvus":true,"deploy-qdrant":false,"router-name":"test-router-milvus"},{"cache-backend":"qdrant","deploy-redis":false,"deploy-milvus":false,"deploy-qdrant":true,"router-name":"test-router-qdrant"},{"cache-backend":"hybrid","deploy-redis":false,"deploy-milvus":true,"deploy-qdrant":false,"router-name":"test-router-hybrid"},{"cache-backend":"mmbert","deploy-redis":false,"deploy-milvus":false,"deploy-qdrant":false,"router-name":"test-router-mmbert"},{"cache-backend":"complexity","deploy-redis":false,"deploy-milvus":false,"deploy-qdrant":false,"router-name":"test-router-complexity"}]'
            || '[{"cache-backend":"memory","deploy-redis":false,"deploy-milvus":false,"deploy-qdrant":false,"router-name":"test-router"}]' }}

  e2e:
    name: E2E
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && (needs.changes.outputs.e2e == 'true'
        || needs.changes.outputs.full == 'true')
    uses: ./.github/workflows/integration-test-k8s.yml
    with:
      profiles: >-
        ${{ needs.changes.outputs.full == 'true'
            && needs.changes.outputs.full_e2e_profiles
            || needs.changes.outputs.e2e_profiles }}
    secrets: inherit

  cli:
    name: CLI integration
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/integration-test-vllm-sr-cli.yml

  memory:
    name: Memory integration
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.memory == 'true'
    uses: ./.github/workflows/integration-test-memory.yml

  recipe-conformance:
    name: Recipe conformance
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.recipe_conformance == 'true'
    uses: ./.github/workflows/recipe-conformance.yml
    secrets: inherit

  openvino:
    name: OpenVINO
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.openvino == 'true'
    uses: ./.github/workflows/openvino-binding-ci.yml

  images:
    name: Images
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.images == 'true'
    uses: ./.github/workflows/docker-validate.yml
    with:
      images: ${{ needs.changes.outputs.pr_images }}

  performance:
    name: Performance
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.performance == 'true'
    uses: ./.github/workflows/performance-test.yml

  router-learning:
    name: Router learning
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.router_learning == 'true'
    uses: ./.github/workflows/router-learning-eval.yml
    with:
      profile: pr

  paper:
    name: Paper
    needs: changes
    if: >-
      (!github.event.pull_request.draft
        || startsWith(github.head_ref, 'mergify/merge-queue/'))
      && needs.changes.outputs.paper == 'true'
    uses: ./.github/workflows/paper-build.yml

  pr-gate:
    name: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci/full') && 'PR Gate' || 'Metadata event' }}
    if: >-
      always() && (github.event.action != 'labeled' && github.event.action != 'unlabeled'
      || github.event.label.name == 'ci/full')
    needs:
      - changes
      - quality
      - security
      - core-tests
      - python-unit
      - dashboard
      - operator
      - e2e
      - cli
      - memory
      - recipe-conformance
      - openvino
      - images
      - performance
      - router-learning
      - paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all selected checks
        env:
          DOMAIN_RESULTS: ${{ toJSON(needs) }}
          ACTIVE: ${{ !github.event.pull_request.draft || startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: python3 tools/ci/gate_results.py
