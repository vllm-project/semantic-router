name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      security-events: write
    with:
      profile: pr
      draft: >-
        ${{ github.event.pull_request.draft
            && !(github.event.pull_request.user.id == 37929162
                && github.event.pull_request.user.login == 'mergify[bot]'
                && github.event.pull_request.user.type == 'Bot'
                && github.event.pull_request.head.repo.full_name == github.repository
                && startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    secrets: inherit

  pr-gate:
    name: ${{ needs.ci.outputs.publisher_ready == 'true' && 'CI Execution' || 'PR Gate' }}
    if: ${{ !cancelled() }}
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful reconciliation of executed contracts
        env:
          RESULT: ${{ needs.ci.result }}
          PUBLISHER_READY: ${{ needs.ci.outputs.publisher_ready }}
          STRICT_CI_EXECUTION: ${{ needs.ci.outputs.strict_ci_execution }}
          DRAFT_PLAN: ${{ toJSON(fromJSON(needs.ci.outputs.plan || '{}').draft) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALIFIED_REVISION: ${{ needs.ci.outputs.qualified_revision }}
        run: |
          if [[ "$STRICT_CI_EXECUTION" == true ]]; then
            if [[ "$QUALIFIED_REVISION" != "$PR_HEAD_SHA:$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" ]]; then
              echo "This revision and attempt have not completed qualification. See CI / Gate."
              exit 1
            fi
          elif [[ "$PUBLISHER_READY" != true && "$DRAFT_PLAN" != false ]]; then
            echo "Draft CI does not qualify this revision for merge."
            exit 1
          fi
          test "$RESULT" = success
