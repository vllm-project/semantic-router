name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version contract to validate without publishing.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Cross-Surface Version Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sim_version: ${{ steps.contract.outputs.sim_version }}
      catalog_snapshot: ${{ steps.contract.outputs.catalog_snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release validation dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version '$VERSION' is not semantic version syntax"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release version contract
        id: contract
        run: |
          python3 tools/release/snapshot_model_catalog.py \
            --check-published --base-ref "$GITHUB_SHA"
          python3 tools/release/check_version_contract.py \
            --version "${{ steps.version.outputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

  docker:
    name: Docker images
    needs: validate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: release
      images: '["dashboard","extproc","extproc-rocm","operator","operator-bundle","vllm-sr","vllm-sr-cuda","vllm-sr-rocm"]'
      tag: ${{ needs.validate.outputs.tag }}
      publish_latest: true
    secrets: inherit

  helm:
    name: Helm chart
    needs: validate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: release
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  pypi:
    name: Python package
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/pypi-publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      catalog_snapshot: ${{ needs.validate.outputs.catalog_snapshot }}
    secrets: inherit

  crate:
    name: Rust crate
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/publish-crate.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  release-notes:
    name: Publish GitHub Release
    needs: [validate, docker, helm, pypi, crate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vllm-sr-dist
          path: release-assets/python

      - uses: actions/download-artifact@v4
        with:
          name: candle-release-libraries
          path: release-assets/rust

      - name: Resolve lowercase registry owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Create release after every publisher succeeds
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          files: |
            release-assets/python/*
            release-assets/rust/*
          body: |
            ## Release ${{ needs.validate.outputs.tag }}

            Version validation completed before Docker, Helm, PyPI, crates.io,
            and operator image publication.

            ### Container images

            All images use `${{ needs.validate.outputs.tag }}` and `latest`:

            - `dashboard`
            - `extproc`
            - `extproc-rocm`
            - `operator`
            - `operator-bundle`
            - `vllm-sr`
            - `vllm-sr-cuda`
            - `vllm-sr-rocm`

            Registry prefix:
            `ghcr.io/${{ steps.owner.outputs.value }}/semantic-router/`

            ### Helm

            ```bash
            helm install semantic-router \
              oci://ghcr.io/${{ steps.owner.outputs.value }}/charts/semantic-router \
              --version ${{ needs.validate.outputs.version }}
            ```

            ### Python

            ```bash
            pip install vllm-sr==${{ needs.validate.outputs.version }}
            ```

            ### Rust Crate (crates.io)

            ```toml
            candle-semantic-router = "${{ needs.validate.outputs.version }}"
            ```

            ### Built-in virtual models

            Curated virtual models and their versioned Recipe YAML are bundled
            in the `vllm-sr` wheel and release images. They are not published
            as separate GitHub Release assets. This release binds immutable
            catalog snapshot `${{ needs.validate.outputs.catalog_snapshot }}`.
            Inspect or fork the installed catalog locally:

            ```bash
            vllm-sr model list
            vllm-sr model show vllm-sr/mom-v1-blend \
              --catalog-version ${{ needs.validate.outputs.catalog_snapshot }}
            vllm-sr model fork vllm-sr/mom-v1-blend mom-v1.yaml \
              --catalog-version ${{ needs.validate.outputs.catalog_snapshot }}
            ```

            `vllm-sr-sim` Python releases remain on the independent
            `vllm-sr-sim-v*` tag stream (current source version
            `${{ needs.validate.outputs.sim_version }}`).
