name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Build release artifacts without publishing.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Cross-Surface Version Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      images: ${{ steps.contract.outputs.release_images_json }}
      sim_version: ${{ steps.contract.outputs.sim_version }}
      candle_version: ${{ steps.contract.outputs.candle_version }}
      catalog_snapshot: ${{ steps.contract.outputs.catalog_snapshot }}
      decision_rocm_qualification: ${{ steps.decision_rocm.outputs.record }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release validation dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version '$VERSION' is not semantic version syntax"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release version contract
        id: contract
        run: |
          python3 tools/release/snapshot_model_catalog.py \
            --check-published --base-ref "$GITHUB_SHA"
          python3 tools/release/check_version_contract.py \
            --version "${{ steps.version.outputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate Decision ROCm qualification record and image identity
        if: github.event_name == 'push'
        id: decision_rocm
        env:
          DECISION_ROCM_QUALIFICATION: ${{ vars.DECISION_ROCM_QUALIFICATION }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          record="$(python3 tools/ci/package_contract.py --mode release \
            --verify-rocm-qualification --verify-registry)"
          printf 'record=%s\n' "$record" >> "$GITHUB_OUTPUT"

  images:
    name: Build Release Images
    needs: validate
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ needs.validate.outputs.images }}
      mode: release
      tag: ${{ needs.validate.outputs.tag }}
      multiarch: true

  docker:
    name: Publish Images
    needs: [validate, images]
    if: github.event_name == 'push' && needs.images.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: release
      images: ${{ needs.validate.outputs.images }}
      tag: ${{ needs.validate.outputs.tag }}
      publish_latest: true
    secrets: inherit

  helm:
    name: Publish Helm Chart
    needs: [validate, images]
    if: github.event_name == 'push' && needs.images.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: release
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  pypi:
    name: Publish Python Package
    needs: [validate, images, docker]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.images.result == 'success'
      && needs.docker.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/pypi-publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      catalog_snapshot: ${{ needs.validate.outputs.catalog_snapshot }}
      prebuilt-dist: false
      decision_runtime: true
      decision_rocm_qualification: ${{ needs.validate.outputs.decision_rocm_qualification }}
    secrets: inherit

  crate:
    name: Publish Rust Crate
    needs: [validate, images]
    if: github.event_name == 'push' && needs.images.result == 'success'
    uses: ./.github/workflows/publish-crate.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      crate_version: ${{ needs.validate.outputs.candle_version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  release-notes:
    name: Publish GitHub Release
    needs: [validate, docker, helm, pypi, crate]
    if: >-
      always() && !cancelled() && github.event_name == 'push'
      && needs.validate.result == 'success'
      && needs.docker.result == 'success'
      && needs.helm.result == 'success'
      && needs.crate.result == 'success'
      && needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vllm-sr-dist
          path: release-assets/python

      - uses: actions/download-artifact@v4
        with:
          name: candle-release-libraries
          path: release-assets/rust

      - name: Resolve lowercase registry owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Create release after every publisher succeeds
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          files: |
            release-assets/python/*
            release-assets/rust/*
          body: |
            ## Release ${{ needs.validate.outputs.tag }}

            Release versions and artifact identities were checked. The six-model
            Decision ROCm qualification record and published CPU image identity
            were verified before publication.

            ### Container images

            The router images below use `${{ needs.validate.outputs.tag }}` and `latest`:

            - `dashboard`
            - `extproc`
            - `extproc-rocm`
            - `operator`
            - `operator-bundle`
            - `vllm-sr`
            - `vllm-sr-cuda`
            - `vllm-sr-rocm`

            Decision Runtime CPU and ROCm images are bound to this Python package
            by digest. The installed CLI selects them automatically; their image
            tags are not part of the user-facing serving command.

            Registry prefix:
            `ghcr.io/${{ steps.owner.outputs.value }}/semantic-router/`

            ### Helm

            ```bash
            helm install semantic-router \
              oci://ghcr.io/${{ steps.owner.outputs.value }}/charts/semantic-router \
              --version ${{ needs.validate.outputs.version }}
            ```

            ### Python

            ```bash
            pip install vllm-sr==${{ needs.validate.outputs.version }}
            ```

            ### Rust Crate (crates.io)

            ```toml
            candle-semantic-router = "${{ needs.validate.outputs.candle_version }}"
            ```

            The crate version may differ from the Router tag because crates.io
            versions are immutable. Use the version shown above for Rust dependencies.

            ### Built-in virtual models

            Curated virtual models and their versioned Recipe YAML are bundled
            in the `vllm-sr` wheel and release images. They are not published
            as separate GitHub Release assets. This release binds immutable
            catalog snapshot `${{ needs.validate.outputs.catalog_snapshot }}`.
            Start `vllm-sr serve`, then use Dashboard to connect Models and
            assign them to a built-in Recipe. Source-controlled deployments
            can copy the packaged Recipe YAML into a user-owned config and run
            `vllm-sr serve --config <path>`.

            `vllm-sr-sim` Python releases remain on the independent
            `vllm-sr-sim-v*` tag stream (current source version
            `${{ needs.validate.outputs.sim_version }}`).

            ### Decision 1.0

            This release publishes `decision-runtime-cpu` and binds the verified
            `decision-runtime-rocm` image. The installed CLI selects the matching
            image automatically. Run
            `vllm-sr decision serve llm-semantic-router/Decision-1.0-Kai-0.6B --port 8001 --detach`
            to serve a model.
