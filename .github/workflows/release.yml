name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate to qualify without publishing.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Cross-Surface Version Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      performance_base: ${{ steps.baseline.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
      sim_version: ${{ steps.contract.outputs.sim_version }}
      catalog_snapshot: ${{ steps.contract.outputs.catalog_snapshot }}
      decision_required: ${{ steps.decision-policy.outputs.decision_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release validation dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version '$VERSION' is not semantic version syntax"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release version contract
        id: contract
        run: |
          python3 tools/release/snapshot_model_catalog.py \
            --check-published --base-ref "$GITHUB_SHA"
          python3 tools/release/check_version_contract.py \
            --version "${{ steps.version.outputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve compatible previous release for paired performance
        id: baseline
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/ci/ci_plan.py previous-release \
            --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"

      - name: Select Decision qualification from the tagged source
        id: decision-policy
        run: python3 tools/ci/decision_release_policy.py --github-output "$GITHUB_OUTPUT"

  ci:
    name: Release Candidate
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      profile: release
      tag: ${{ needs.validate.outputs.tag }}
      performance-base-ref: ${{ needs.validate.outputs.performance_base }}
    secrets: inherit

  gate:
    name: Release CPU Qualification
    if: always()
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    steps:
      - name: Require version and complete CPU evidence
        env:
          VERSION_RESULT: ${{ needs.validate.result }}
          QUALIFICATION_RESULT: ${{ needs.ci.result }}
          DECISION_REQUIRED: ${{ needs.validate.outputs.decision_required }}
          DECISION_ENABLED: ${{ vars.DECISION_RUNTIME_RELEASE_ENABLED }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          test "$VERSION_RESULT" = success
          test "$QUALIFICATION_RESULT" = success
          case "$DECISION_REQUIRED" in
            true|false) ;;
            *) echo '::error::Decision source policy did not produce a valid result.'; exit 1 ;;
          esac
          if [[ "$RELEASE_EVENT" == push && "$DECISION_REQUIRED" == true && "$DECISION_ENABLED" != true ]]; then
            echo '::error::Decision-enabled stable release requires the protected qualification environment.'
            exit 1
          fi

  decision-cpu:
    name: Publish Immutable Decision CPU Candidate
    needs: [validate, gate, ci]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.gate.result == 'success'
      && needs.validate.outputs.decision_required == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: release
      images: '["decision-runtime-cpu"]'
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  decision:
    name: Build Qualified Stable Decision Distribution
    needs: [validate, gate, decision-cpu]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.gate.result == 'success'
      && needs.decision-cpu.result == 'success'
      && needs.validate.outputs.decision_required == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/decision-qualified-package.yml
    with:
      mode: release
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  docker:
    name: Publish Images
    needs: [validate, gate, ci, decision]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.gate.result == 'success'
      && (needs.validate.outputs.decision_required == 'false'
        || needs.decision.result == 'success')
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: release
      images: ${{ needs.ci.outputs.publish_images }}
      tag: ${{ needs.validate.outputs.tag }}
      publish_latest: true
      record_decision_digest: false
    secrets: inherit

  helm:
    name: Publish Helm Chart
    needs: [validate, gate, decision]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.gate.result == 'success'
      && (needs.validate.outputs.decision_required == 'false'
        || needs.decision.result == 'success')
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: release
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  pypi:
    name: Publish Python Package
    needs: [validate, gate, decision]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.gate.result == 'success'
      && (needs.validate.outputs.decision_required == 'false'
        || needs.decision.result == 'success')
    uses: ./.github/workflows/pypi-publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      catalog_snapshot: ${{ needs.validate.outputs.catalog_snapshot }}
      prebuilt-dist: true
      qualified-decision: ${{ needs.validate.outputs.decision_required == 'true' }}
    secrets: inherit

  crate:
    name: Publish Rust Crate
    needs: [validate, gate, decision]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.gate.result == 'success'
      && (needs.validate.outputs.decision_required == 'false'
        || needs.decision.result == 'success')
    uses: ./.github/workflows/publish-crate.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  release-notes:
    name: Publish GitHub Release
    needs: [validate, gate, docker, helm, pypi, crate]
    if: github.event_name == 'push' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.decision_required == 'true' && format('decision-qualified-dist-{0}-{1}', github.run_id, github.run_attempt) || 'vllm-sr-dist' }}
          path: release-assets/python

      - uses: actions/download-artifact@v4
        with:
          name: candle-release-libraries
          path: release-assets/rust

      - name: Resolve lowercase registry owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Create release after every publisher succeeds
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          files: |
            release-assets/python/*
            release-assets/rust/*
          body: |
            ## Release ${{ needs.validate.outputs.tag }}

            Version and CPU runtime qualification completed before Docker, Helm, PyPI, crates.io,
            and operator image publication.

            ### Container images

            All images use `${{ needs.validate.outputs.tag }}` and `latest`:

            - `dashboard`
            - `extproc`
            - `extproc-rocm`
            - `operator`
            - `operator-bundle`
            - `vllm-sr`
            - `vllm-sr-cuda`
            - `vllm-sr-rocm`

            Registry prefix:
            `ghcr.io/${{ steps.owner.outputs.value }}/semantic-router/`

            ### Helm

            ```bash
            helm install semantic-router \
              oci://ghcr.io/${{ steps.owner.outputs.value }}/charts/semantic-router \
              --version ${{ needs.validate.outputs.version }}
            ```

            ### Python

            ```bash
            pip install vllm-sr==${{ needs.validate.outputs.version }}
            ```

            ### Rust Crate (crates.io)

            ```toml
            candle-semantic-router = "${{ needs.validate.outputs.version }}"
            ```

            ### Built-in virtual models

            Curated virtual models and their versioned Recipe YAML are bundled
            in the `vllm-sr` wheel and release images. They are not published
            as separate GitHub Release assets. This release binds immutable
            catalog snapshot `${{ needs.validate.outputs.catalog_snapshot }}`.
            Start `vllm-sr serve`, then use Dashboard to connect Models and
            assign them to a built-in Recipe. Source-controlled deployments
            can copy the packaged Recipe YAML into a user-owned config and run
            `vllm-sr serve --config <path>`.

            `vllm-sr-sim` Python releases remain on the independent
            `vllm-sr-sim-v*` tag stream (current source version
            `${{ needs.validate.outputs.sim_version }}`).
