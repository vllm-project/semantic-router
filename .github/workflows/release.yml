name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Build release artifacts without publishing.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Cross-Surface Version Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      images: ${{ steps.contract.outputs.release_images_json }}
      catalog_snapshot: ${{ steps.contract.outputs.catalog_snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release validation dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version '$VERSION' is not semantic version syntax"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release version contract
        id: contract
        run: |
          python3 tools/release/snapshot_model_catalog.py \
            --check-published --base-ref "$GITHUB_SHA"
          python3 tools/release/check_version_contract.py \
            --version "${{ steps.version.outputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

  images:
    name: Build Release Images
    needs: validate
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ needs.validate.outputs.images }}
      mode: release
      tag: ${{ needs.validate.outputs.tag }}
      multiarch: true

  helm-build:
    name: Package Helm Chart
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      build-only: true
      mode: release
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}

  python-build:
    name: Build Python Distribution
    needs: validate
    uses: ./.github/workflows/pypi-publish.yml
    with:
      build-only: true
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      catalog_snapshot: ${{ needs.validate.outputs.catalog_snapshot }}

  docker:
    name: Publish Images
    needs: [validate, images, helm-build, python-build]
    if: >-
      github.event_name == 'push'
      && needs.images.result == 'success'
      && needs.helm-build.result == 'success'
      && needs.python-build.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: release
      images: ${{ needs.validate.outputs.images }}
      tag: ${{ needs.validate.outputs.tag }}
      publish_latest: true
    secrets: inherit

  helm:
    name: Publish Helm Chart
    needs: [validate, images, helm-build, python-build]
    if: >-
      github.event_name == 'push'
      && needs.images.result == 'success'
      && needs.helm-build.result == 'success'
      && needs.python-build.result == 'success'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      prebuilt-chart: true
      mode: release
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets: inherit

  pypi:
    name: Publish Python Package
    needs: [validate, images, helm-build, python-build]
    if: >-
      github.event_name == 'push'
      && needs.images.result == 'success'
      && needs.helm-build.result == 'success'
      && needs.python-build.result == 'success'
    uses: ./.github/workflows/pypi-publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      catalog_snapshot: ${{ needs.validate.outputs.catalog_snapshot }}
      prebuilt-dist: true
    secrets: inherit

  release-notes:
    name: Publish GitHub Release
    needs: [validate, docker, helm, pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vllm-sr-dist
          path: release-assets/python

      - name: Resolve lowercase registry owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Create release after every publisher succeeds
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Release ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/python/*
          body: |
            ## Release ${{ needs.validate.outputs.tag }}

            Release versions and artifact identities were checked before Docker,
            Helm, PyPI, and operator image publication.

            ### Container images

            All images use `${{ needs.validate.outputs.tag }}` and `latest`:

            - `dashboard`
            - `operator`
            - `operator-bundle`
            - `vllm-sr` (also published as `extproc`, with the same digests, for this release)
            - `vllm-sr-cuda`
            - `vllm-sr-rocm` (also published as `extproc-rocm`, with the same digests, for this release)

            Registry prefix:
            `ghcr.io/${{ steps.owner.outputs.value }}/semantic-router/`

            ### Helm

            ```bash
            helm install semantic-router \
              oci://ghcr.io/${{ steps.owner.outputs.value }}/charts/semantic-router \
              --version ${{ needs.validate.outputs.version }}
            ```

            ### Python

            ```bash
            pip install vllm-sr==${{ needs.validate.outputs.version }}
            ```

            ### Built-in virtual models

            Curated virtual models and their versioned Recipe YAML are bundled
            in the `vllm-sr` wheel and release images. They are not published
            as separate GitHub Release assets. This release binds immutable
            catalog snapshot `${{ needs.validate.outputs.catalog_snapshot }}`.
            Start `vllm-sr serve`, then use Dashboard to connect Models and
            assign them to a built-in Recipe. Source-controlled deployments
            can copy the packaged Recipe YAML into a user-owned config and run
            `vllm-sr serve --config <path>`.
