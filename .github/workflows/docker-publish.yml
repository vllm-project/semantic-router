name: Publish Qualified Images

on:
  workflow_call:
    inputs:
      mode:
        description: One of main, nightly, or release.
        required: true
        type: string
      images:
        description: JSON array of image names from shared classification.
        required: true
        type: string
      tag:
        description: Explicit release tag. Required for release mode.
        required: false
        default: ""
        type: string
      publish_latest:
        description: Also publish the mutable latest tag.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image-${{ matrix.image }}
          path: .agent-harness/image-input
      - name: Install image promotion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Promote the qualified image without rebuilding
        env:
          IMAGE: ${{ matrix.image }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          args=()
          if [[ "$PUBLISH_LATEST" == true ]]; then args+=(--latest); fi
          python tools/ci/image_artifacts.py promote --image "$IMAGE" \
            --directory .agent-harness/image-input --mode "$MODE" --tag "$RELEASE_TAG" "${args[@]}"
