name: Images Domain

on:
  workflow_call:
    inputs:
      mode:
        description: One of main, nightly, or release.
        required: true
        type: string
      images:
        description: JSON array of image names from shared classification.
        required: true
        type: string
      tag:
        description: Explicit release tag. Required for release mode.
        required: false
        default: ""
        type: string
      publish_latest:
        description: Also publish the mutable latest tag.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Validate publication mode
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$MODE" in
            main|nightly) ;;
            release)
              if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                echo "::error::Release mode requires a v-prefixed semantic version tag"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported Docker publication mode '$MODE'"
              exit 1
              ;;
          esac

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af --volumes || true

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image definition
        id: definition
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ci/docker_image_catalog.py "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve publication tags
        id: tags
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/semantic-router/${{ matrix.image }}"
          case "$MODE" in
            release)
              PRIMARY_TAG="$RELEASE_TAG"
              NIGHTLY_DATE=""
              ;;
            nightly)
              NIGHTLY_DATE="$(date -u +'%Y%m%d')"
              PRIMARY_TAG="nightly-${NIGHTLY_DATE}-${GITHUB_SHA}"
              ;;
            main)
              PRIMARY_TAG="${GITHUB_SHA}"
              NIGHTLY_DATE=""
              ;;
          esac
          TAGS="${IMAGE}:${PRIMARY_TAG}"
          MUTABLE_TAGS=""
          if [[ "$MODE" == "nightly" ]]; then
            MUTABLE_TAGS="${IMAGE}:nightly-${NIGHTLY_DATE}"
          fi
          if [[ "$MODE" == "nightly" ]] &&
             [[ "${{ matrix.image }}" =~ ^(anthropic-shim|llm-katan)$ ]]; then
            MUTABLE_TAGS="${MUTABLE_TAGS},${IMAGE}:nightly"
          fi
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            MUTABLE_TAGS="${MUTABLE_TAGS:+${MUTABLE_TAGS},}${IMAGE}:latest"
          fi
          {
            echo "primary=$PRIMARY_TAG"
            echo "nightly_date=$NIGHTLY_DATE"
            echo "tags=$TAGS"
            echo "image=$IMAGE"
            echo "mutable_tags=$MUTABLE_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build arguments
        id: build-args
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          CARGO_BUILD_JOBS: "20"
          DASHBOARD_VERSION_MODE: ${{ inputs.mode == 'release' && 'release' || 'publish' }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_NIGHTLY: ${{ inputs.mode == 'nightly' }}
          NIGHTLY_DATE: ${{ steps.tags.outputs.nightly_date }}
        run: bash tools/ci/docker-build-args.sh

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.definition.outputs.context }}
          file: ${{ steps.definition.outputs.dockerfile }}
          platforms: ${{ steps.definition.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}-publish
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-publish,ignore-error=true
          build-args: ${{ steps.build-args.outputs.args }}
          provenance: false

      - name: Record built digest for promotion
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MODE: ${{ inputs.mode }}
          MUTABLE_TAGS: ${{ steps.tags.outputs.mutable_tags }}
        run: |
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg sha "$GITHUB_SHA" \
            --arg mode "$MODE" --arg tags "$MUTABLE_TAGS" \
            '{image:$image,digest:$digest,sha:$sha,mode:$mode,mutable_tags:($tags|split(",")|map(select(length>0)))}' \
            > promotion.json
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-${{ inputs.mode }}-${{ matrix.image }}
          path: promotion.json
          retention-days: 7

  promote:
    name: Promote ${{ matrix.image }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    concurrency:
      group: image-promotion-${{ github.repository }}-${{ matrix.image }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: promotion-${{ inputs.mode }}-${{ matrix.image }}
      - name: Promote the qualified digest in source order
        run: python3 tools/ci/promote_image.py promotion.json
