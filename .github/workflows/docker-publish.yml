name: Images Domain

on:
  workflow_call:
    inputs:
      mode:
        description: One of main, nightly, or release.
        required: true
        type: string
      images:
        description: JSON array of image names from shared classification.
        required: true
        type: string
      tag:
        description: Explicit release tag. Required for release mode.
        required: false
        default: ""
        type: string
      publish_latest:
        description: Also publish the mutable latest tag.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Validate publication mode
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$MODE" in
            main|nightly) ;;
            release)
              if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                echo "::error::Release mode requires a v-prefixed semantic version tag"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported Docker publication mode '$MODE'"
              exit 1
              ;;
          esac

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af --volumes || true

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image definition
        id: definition
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            dashboard)
              CONTEXT="."
              DOCKERFILE="./dashboard/backend/Dockerfile"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            extproc)
              CONTEXT="."
              DOCKERFILE="./tools/docker/Dockerfile.extproc"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            extproc-rocm)
              CONTEXT="."
              DOCKERFILE="./tools/docker/Dockerfile.extproc-rocm"
              PLATFORMS="linux/amd64"
              ;;
            llm-katan)
              CONTEXT="./e2e/testing/llm-katan"
              DOCKERFILE="./e2e/testing/llm-katan/Dockerfile"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            operator)
              CONTEXT="."
              DOCKERFILE="./deploy/operator/Dockerfile"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            operator-bundle)
              CONTEXT="./deploy/operator"
              DOCKERFILE="./deploy/operator/bundle/Dockerfile"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            vllm-sr)
              CONTEXT="."
              DOCKERFILE="./src/vllm-sr/Dockerfile"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            vllm-sr-cuda)
              CONTEXT="."
              DOCKERFILE="./src/vllm-sr/Dockerfile.cuda"
              PLATFORMS="linux/amd64"
              ;;
            vllm-sr-rocm)
              CONTEXT="."
              DOCKERFILE="./src/vllm-sr/Dockerfile.rocm"
              PLATFORMS="linux/amd64"
              ;;
            vllm-sr-sim)
              CONTEXT="."
              DOCKERFILE="./src/fleet-sim/Dockerfile"
              PLATFORMS="linux/amd64,linux/arm64"
              ;;
            *)
              echo "::error::Unknown image '$IMAGE'"
              exit 1
              ;;
          esac
          {
            echo "context=$CONTEXT"
            echo "dockerfile=$DOCKERFILE"
            echo "platforms=$PLATFORMS"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve publication tags
        id: tags
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/semantic-router/${{ matrix.image }}"
          case "$MODE" in
            release)
              PRIMARY_TAG="$RELEASE_TAG"
              NIGHTLY_DATE=""
              ;;
            nightly)
              NIGHTLY_DATE="$(date -u +'%Y%m%d')"
              PRIMARY_TAG="nightly-${NIGHTLY_DATE}"
              ;;
            main)
              PRIMARY_TAG="${GITHUB_SHA}"
              NIGHTLY_DATE=""
              ;;
          esac
          TAGS="${IMAGE}:${PRIMARY_TAG}"
          if [[ "$MODE" == "nightly" ]] &&
             [[ "${{ matrix.image }}" == "llm-katan" ]]; then
            TAGS="${TAGS},${IMAGE}:nightly"
          fi
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          {
            echo "primary=$PRIMARY_TAG"
            echo "nightly_date=$NIGHTLY_DATE"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve build arguments
        id: build-args
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          CARGO_BUILD_JOBS: "20"
          DASHBOARD_VERSION_MODE: ${{ inputs.mode == 'release' && 'release' || 'publish' }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_NIGHTLY: ${{ inputs.mode == 'nightly' }}
          NIGHTLY_DATE: ${{ steps.tags.outputs.nightly_date }}
        run: bash tools/ci/docker-build-args.sh

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.definition.outputs.context }}
          file: ${{ steps.definition.outputs.dockerfile }}
          platforms: ${{ steps.definition.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}-publish
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-publish,ignore-error=true
          build-args: ${{ steps.build-args.outputs.args }}
          provenance: false
