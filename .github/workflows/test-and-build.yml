name: Core Tests

on:
  workflow_call:
    inputs:
      verification:
        type: string
        default: ""

permissions:
  contents: read

env:
  HELM_VERSION: v3.14.0
  CI: "true"

jobs:
  test-and-build:
    name: Router Contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go-ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            build-essential \
            pkg-config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl for offline deployment render tests
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Validate Helm chart
        run: make helm-ci-validate HELM_NAMESPACE=test-namespace

      - name: Check Go modules and vet source
        run: make check-go-mod-tidy vet

      - name: Set up Python for selector parity
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the core harness dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Verify trained selector parity with the router's selectors
        run: |
          python3 -m pip install -r src/training/model_selection/ml_model_selection/requirements-parity.txt
          mkdir -p .agent-harness/core
          PYTEST_ADDOPTS="--junitxml=$GITHUB_WORKSPACE/.agent-harness/core/parity.xml" make test-model-selection-parity

      - name: Run discovered core contracts once
        run: make test-core-unit
        env:
          SR_TEST_MODE: "true"
          ROUTER_PROTECTION_REPORT: ${{ github.workspace }}/.agent-harness/agent-routing-protection/report.json

      - name: Install the model runtime for the local smoke test
        run: make harness-venv-install model-runtime-install

      - name: Local dev smoke test (no Authorino)
        run: |
          python3 -m pip install -U "huggingface_hub[cli]" hf_transfer
          tools/test/smoke/test-local-up-router.sh
        timeout-minutes: 20
        env:
          CI: true
          CGO_ENABLED: 1
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Record actual core and parity evidence
        if: inputs.verification != ''
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          python3 tools/ci/workflow_evidence.py --verification "$VERIFICATION" \
            --evidence .agent-harness/core/unit/evidence.json \
            --junit .agent-harness/core/parity.xml \
            --case tools/test/smoke/test-local-up-router.sh \
            --output .agent-harness/core/result.json
      - uses: actions/upload-artifact@v4
        if: inputs.verification != ''
        with:
          name: ci-result-core
          path: .agent-harness/core/result.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-framework-evidence
          path: .agent-harness/core/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload agent routing protection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-protection
          path: .agent-harness/agent-routing-protection/report.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            **/*.log
            **/test-output.*
            dist/helm/*.yaml
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Test and build failed. Check the workflow run for details."
          echo "To reproduce this job locally: make test-and-build-local"
          echo "To run the baseline PR checks locally: make ci-full"
