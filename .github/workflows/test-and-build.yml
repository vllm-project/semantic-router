name: Core Tests

on:
  workflow_call:
    inputs:
      native-artifact:
        type: string
        default: ""
      verification:
        type: string
        default: ""

permissions:
  contents: read

env:
  HELM_VERSION: v3.14.0
  CI: "true"

jobs:
  test-and-build:
    name: Router Contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Rust
        if: inputs.native-artifact == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90

      - name: Set up Go
        uses: ./.github/actions/setup-go-ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            build-essential \
            pkg-config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate Helm chart
        run: make helm-ci-validate HELM_NAMESPACE=test-namespace

      - name: Cache Rust dependencies
        if: inputs.native-artifact == ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            candle-binding/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-


      - name: Load shared native libraries
        if: inputs.native-artifact != ''
        uses: ./.github/actions/load-native-artifact
        with:
          artifact: ${{ inputs.native-artifact }}

      - name: Build and test native libraries without a shared producer
        if: inputs.native-artifact == ''
        run: make rust-ci test-rust-ci

      - name: Check Go modules and vet source
        run: make check-go-mod-tidy vet

      - name: Set up Python for selector parity
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the CPU ORT runtime for tiny-tensor contracts
        run: |
          python3 -m pip install onnxruntime==1.22.0 PyYAML==6.0.3
          python3 - <<'PYCODE'
          import importlib.util
          import os
          from pathlib import Path
          root = Path(importlib.util.find_spec("onnxruntime").origin).parent / "capi"
          paths = list(root.glob("libonnxruntime.so.*"))
          assert len(paths) == 1, paths
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"ORT_DYLIB_PATH={paths[0]}\n")
          PYCODE

      - name: Run owned binding and alternate provider-default contracts
        run: make test-core-owned

      - name: Verify trained selector parity with the native runtime
        run: |
          python3 -m pip install -r src/training/model_selection/ml_model_selection/requirements-parity.txt
          mkdir -p .agent-harness/core
          PYTEST_ADDOPTS="--junitxml=$GITHUB_WORKSPACE/.agent-harness/core/parity.xml" make test-model-selection-parity

      - name: Run discovered core contracts once
        run: make test-core-unit
        env:
          CORE_NATIVE_FIXTURES: "1"
          SR_TEST_MODE: "true"
          ROUTER_PROTECTION_REPORT: ${{ github.workspace }}/.agent-harness/agent-routing-protection/report.json

      - name: Local dev smoke test (no Authorino)
        run: |
          python3 -m pip install -U "huggingface_hub[cli]" hf_transfer
          tools/test/smoke/test-local-up-router.sh
        timeout-minutes: 20
        env:
          CI: true
          CGO_ENABLED: 1
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Record actual core and parity evidence
        if: inputs.verification != ''
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          python3 tools/ci/workflow_evidence.py --verification "$VERIFICATION" \
            --evidence .agent-harness/core/unit/evidence.json \
            --evidence .agent-harness/core/owned/evidence.json \
            --junit .agent-harness/core/parity.xml \
            --case tools/test/smoke/test-local-up-router.sh \
            --output .agent-harness/core/result.json
      - uses: actions/upload-artifact@v4
        if: inputs.verification != ''
        with:
          name: ci-result-core
          path: .agent-harness/core/result.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-framework-evidence
          path: .agent-harness/core/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload agent routing protection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-routing-protection
          path: .agent-harness/agent-routing-protection/report.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            **/*.log
            **/test-output.*
            dist/helm/*.yaml
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Test and build failed. Check the workflow run for details."
          echo "To reproduce this job locally: make test-and-build-local"
          echo "To run the baseline PR checks locally: make ci-full"
