name: Core Tests

on:
  workflow_call:
    inputs:
      verification:
        type: string
        default: ""

permissions:
  contents: read

env:
  HELM_VERSION: v3.14.0
  CI: "true"

jobs:
  test-and-build:
    name: Router Contracts
    runs-on: ${{ fromJSON(inputs.verification).runner }}
    steps:
      - name: Record Runner Environment
        working-directory: ${{ github.workspace }}
        env:
          OBSERVED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: echo "CI_RUNNER_ENVIRONMENT=$OBSERVED_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: '**/go.sum'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            build-essential \
            pkg-config

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl for offline deployment render tests
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Cache Helm dependency charts
        id: helm-dependencies
        uses: actions/cache@v4
        with:
          path: deploy/helm/semantic-router/charts/*.tgz
          key: helm-dependencies-${{ hashFiles('deploy/helm/semantic-router/Chart.lock') }}

      - name: Validate Helm chart
        env:
          HELM_DEPENDENCIES_CACHED: ${{ steps.helm-dependencies.outputs.cache-hit }}
        run: make helm-ci-validate HELM_NAMESPACE=test-namespace

      - name: Cache Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Check Go modules and vet source
        run: make check-go-mod-tidy vet

      - name: Set up Python for the core harness
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the core harness dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Run discovered core contracts once
        run: make test-core-unit
        env:
          SR_TEST_MODE: "true"
          ROUTER_PROTECTION_REPORT: ${{ github.workspace }}/.agent-harness/agent-routing-protection/report.json

      - name: Record actual core evidence
        if: inputs.verification != ''
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          python3 tools/ci/workflow_evidence.py --verification "$VERIFICATION" \
            --evidence .agent-harness/core/unit/evidence.json \
            --output .agent-harness/core/result.json
      - uses: actions/upload-artifact@v4
        if: inputs.verification != ''
        with:
          overwrite: true
          name: ci-result-core
          path: .agent-harness/core/result.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: core-framework-evidence-attempt-${{ github.run_attempt }}
          path: .agent-harness/core/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload agent routing protection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: agent-routing-protection
          path: .agent-harness/agent-routing-protection/report.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: test-logs
          path: |
            **/*.log
            **/test-output.*
            dist/helm/*.yaml
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Test and build failed. Check the workflow run for details."
          echo "To reproduce this job locally: make test-and-build-local"
          echo "To run the baseline PR checks locally: make ci-full"
