name: Main

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Qualify and publish the complete development CLI and commit-addressed images.
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  ci:
    name: CI
    # A push run checks only its own commit's paths, so it never shares a group.
    # A newer publication dispatch cancels an older one's qualification.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'main-publication' || format('main-{0}', github.run_id) }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      security-events: write
    with:
      profile: main
      publish: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish }}
    secrets: inherit

  images:
    name: Publish Images
    needs: ci
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.ci.outputs.publish_images != '[]'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: main
      images: ${{ needs.ci.outputs.publish_images }}
      publish_latest: true
    secrets: inherit

  helm:
    name: Publish Helm Chart
    needs: ci
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.ci.outputs.publish_helm == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: main
    secrets: inherit

  pypi:
    name: Publish Development CLI
    # The package defaults to this commit's images, which must exist first.
    needs: [ci, images]
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.images.result == 'success'
      && needs.ci.outputs.publish_python == 'true'
      && github.repository == 'vllm-project/semantic-router'
    uses: ./.github/workflows/pypi-publish.yml
    with:
      channel: dev
      prebuilt-dist: true
    secrets: inherit
