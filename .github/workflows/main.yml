name: Main

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Run the full CPU qualification, then publish the development CLI and commit-addressed images. Every push to main already publishes them after its automatic checks.
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  ci:
    name: CI
    # A newer push cancels an older push's qualification, queued or running,
    # and its plan checks the cancelled commits' changes too (main_push_base.py).
    # A re-run is explicit, so it neither cancels nor is cancelled by a push.
    # A newer publication dispatch cancels an older one's. Publication jobs
    # are outside these groups, so a publication that started always finishes.
    concurrency:
      group: ${{ github.event_name == 'push' && github.run_attempt == '1' && 'main-push' || github.event_name == 'workflow_dispatch' && inputs.publish && 'main-publication' || format('main-{0}', github.run_id) }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      security-events: write
    with:
      profile: main
      # Every push to the upstream main publishes its commit; a publication
      # dispatch runs the full CPU qualification first.
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' && github.repository == 'vllm-project/semantic-router' || github.event_name == 'workflow_dispatch' && inputs.publish) }}
      full: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish }}
    secrets: inherit

  images:
    name: Publish Images
    needs: ci
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.ci.outputs.publish_images != '[]'
    # One publication per event at a time: a newer one waits, and no
    # publication that started is cancelled. The same holds for helm and pypi.
    concurrency:
      group: main-images-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: main
      images: ${{ needs.ci.outputs.publish_images }}
    secrets: inherit

  latest:
    name: Move latest Forward
    # Only a complete image set moves latest. A group keeps one waiting job and
    # cancels the others; a cancelled move only leaves latest to a later run.
    needs: [ci, images]
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: main-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Commits only: the move compares this commit with newer ones on main.
          fetch-depth: 0
          filter: tree:0
      - name: Install image promotion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Move latest to this commit unless a newer one holds it
        env:
          IMAGES: ${{ needs.ci.outputs.publish_images }}
        run: |
          python3 tools/ci/latest_tags.py --images "$IMAGES" --source "$GITHUB_SHA" \
            --main origin/main --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

  helm:
    name: Publish Helm Chart
    needs: ci
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.ci.outputs.publish_helm == 'true'
    concurrency:
      group: main-helm-${{ github.event_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: main
    secrets: inherit

  pypi:
    name: Publish Development CLI
    # The package defaults to this commit's images, not latest, so it waits
    # for their publication only.
    needs: [ci, images]
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && needs.images.result == 'success'
      && needs.ci.outputs.publish_python == 'true'
      && github.repository == 'vllm-project/semantic-router'
    concurrency:
      group: main-pypi-${{ github.event_name }}
      cancel-in-progress: false
    uses: ./.github/workflows/pypi-publish.yml
    with:
      channel: dev
      prebuilt-dist: true
    secrets: inherit
