name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  quality:
    needs: changes
    uses: ./.github/workflows/pre-commit.yml
    with:
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
      website: ${{ needs.changes.outputs.website == 'true' }}
      domains: ${{ needs.changes.outputs.domains }}

  security:
    needs: changes
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      security-events: write

  core:
    needs: changes
    if: needs.changes.outputs.core_test == 'true'
    uses: ./.github/workflows/test-and-build.yml
    with:
      check_ck: ${{ contains(fromJSON(needs.changes.outputs.domains), 'ck-flash-attn-rewriter') }}
    secrets: inherit

  python-unit:
    needs: changes
    if: needs.changes.outputs.python_unit == 'true'
    uses: ./.github/workflows/python-unit.yml
    with:
      domains: ${{ needs.changes.outputs.domains }}
      cli_integration: ${{ needs.changes.outputs.cli == 'true' }}

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    uses: ./.github/workflows/dashboard-test.yml

  operator:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    uses: ./.github/workflows/operator-ci.yml
    with:
      run_integration: false

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/integration-test-k8s.yml
    with:
      profiles: ${{ needs.changes.outputs.e2e_profiles }}
    secrets: inherit

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/integration-test-vllm-sr-cli.yml

  recipe-conformance:
    needs: changes
    if: needs.changes.outputs.recipe_conformance == 'true'
    uses: ./.github/workflows/recipe-conformance.yml
    secrets: inherit

  openvino:
    needs: changes
    if: needs.changes.outputs.openvino == 'true'
    uses: ./.github/workflows/openvino-binding-ci.yml

  memory:
    needs: changes
    if: needs.changes.outputs.memory == 'true'
    uses: ./.github/workflows/integration-test-memory.yml

  performance:
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    uses: ./.github/workflows/performance-test.yml

  router-learning:
    needs: changes
    if: needs.changes.outputs.router_learning == 'true'
    uses: ./.github/workflows/router-learning-eval.yml

  paper:
    needs: changes
    if: needs.changes.outputs.paper == 'true'
    uses: ./.github/workflows/paper-build.yml

  gate:
    name: Main validation gate
    if: always()
    needs:
      - changes
      - quality
      - security
      - core
      - python-unit
      - memory
      - performance
      - router-learning
      - paper
      - dashboard
      - operator
      - e2e
      - cli
      - recipe-conformance
      - openvino
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all selected checks
        env:
          DOMAIN_RESULTS: ${{ toJSON(needs) }}
          LIFECYCLE: main
        run: python3 tools/ci/gate_results.py

  images:
    name: Publish affected images
    needs: [changes, gate]
    if: >-
      needs.gate.result == 'success'
      && needs.changes.outputs.publish_images != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: main
      images: ${{ needs.changes.outputs.publish_images }}
      publish_latest: true
    secrets: inherit

  helm:
    name: Publish affected Helm chart
    needs: [changes, gate]
    if: >-
      needs.gate.result == 'success'
      && needs.changes.outputs.helm == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: main
    secrets: inherit
