name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  quality:
    needs: changes
    uses: ./.github/workflows/pre-commit.yml
    with:
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
      website: ${{ needs.changes.outputs.website == 'true' }}

  security:
    needs: changes
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      security-events: write

  core:
    needs: changes
    if: needs.changes.outputs.core_test == 'true'
    uses: ./.github/workflows/test-and-build.yml
    secrets: inherit

  image-calibration:
    needs: changes
    if: needs.changes.outputs.image_calibration == 'true'
    uses: ./.github/workflows/image-routing-calibration.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    uses: ./.github/workflows/dashboard-test.yml

  operator:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    uses: ./.github/workflows/operator-ci.yml
    with:
      run_integration: false

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/integration-test-k8s.yml
    with:
      profiles: ${{ needs.changes.outputs.e2e_profiles }}
    secrets: inherit

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/integration-test-vllm-sr-cli.yml

  recipe-conformance:
    needs: changes
    if: needs.changes.outputs.recipe_conformance == 'true'
    uses: ./.github/workflows/recipe-conformance.yml
    secrets: inherit

  openvino:
    needs: changes
    if: needs.changes.outputs.openvino == 'true'
    uses: ./.github/workflows/openvino-binding-ci.yml

  riscv-qemu:
    needs: changes
    if: needs.changes.outputs.riscv_qemu == 'true'
    uses: ./.github/workflows/riscv-qemu.yml
    secrets: inherit

  gate:
    name: Main validation gate
    if: always()
    needs:
      - changes
      - quality
      - security
      - core
      - image-calibration
      - dashboard
      - operator
      - e2e
      - cli
      - recipe-conformance
      - openvino
      - riscv-qemu
    runs-on: ubuntu-latest
    steps:
      - name: Verify affected domains
        env:
          DOMAIN_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key)=\(.value.result)"
            ' <<< "$DOMAIN_RESULTS"
          )"
          if [ -n "$failures" ]; then
            echo "$failures"
            exit 1
          fi

  images:
    name: Publish affected images
    needs: [changes, gate]
    # The gate runs with always(), so skipped domain jobs would otherwise
    # propagate an implicit success() skip to every publish job.
    if: >-
      needs.gate.result == 'success'
      && !cancelled()
      && needs.changes.outputs.publish_images != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: main
      images: ${{ needs.changes.outputs.publish_images }}
      publish_latest: true
    secrets: inherit

  helm:
    name: Publish affected Helm chart
    needs: [changes, gate]
    if: >-
      needs.gate.result == 'success'
      && !cancelled()
      && needs.changes.outputs.helm == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: main
    secrets: inherit

  pypi:
    name: Publish development CLI
    needs: gate
    # Domain jobs may be skipped even when the aggregate validation gate passes.
    if: >-
      !cancelled()
      && needs.gate.result == 'success'
      && github.repository == 'vllm-project/semantic-router'
    uses: ./.github/workflows/pypi-publish.yml
    with:
      channel: dev
    secrets: inherit
