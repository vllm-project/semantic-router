name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: >-
      github.repository == 'vllm-project/semantic-router'
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      profile: nightly
    secrets: inherit

  docker:
    name: Publish Nightly Images
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    needs: ci
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      mode: nightly
      images: ${{ needs.ci.outputs.publish_images }}
      publish_latest: false
    secrets: inherit

  helm:
    name: Publish Nightly Helm Chart
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    needs: ci
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/helm-publish.yml
    with:
      mode: nightly
    secrets: inherit
