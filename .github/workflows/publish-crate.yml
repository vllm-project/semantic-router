name: Candle Crate Publisher

on:
  workflow_call:
    inputs:
      version:
        description: Stable version without a leading v.
        required: true
        type: string
      tag:
        description: Stable tag with a leading v.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish candle-semantic-router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential pkg-config

      - name: Verify crate version
        working-directory: candle-binding
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          CRATE_VERSION="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "candle-semantic-router") | .version'
          )"
          if [[ "$CRATE_VERSION" != "$RELEASE_VERSION" ]] ||
             [[ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]]; then
            echo "::error::Crate, version, and tag inputs do not match"
            exit 1
          fi

      - name: Test crate
        run: make test-rust-ci

      - name: Run CPU API smoke tests
        working-directory: candle-binding
        run: |
          cargo test --no-default-features \
            --test qwen3_classification_api_test \
            --test classification_output_demo \
            --verbose

      - name: Check, build, and dry-run publish
        working-directory: candle-binding
        run: |
          cargo check --no-default-features --verbose
          cargo build --release --no-default-features --verbose
          cargo publish --dry-run --no-default-features --verbose

      - name: Publish crate
        working-directory: candle-binding
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --no-default-features --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: candle-release-libraries
          path: |
            candle-binding/target/release/libcandle_semantic_router.a
            candle-binding/target/release/libcandle_semantic_router.so
          retention-days: 7
