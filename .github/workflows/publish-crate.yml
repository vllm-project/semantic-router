name: Candle Crate Publisher

on:
  workflow_call:
    inputs:
      version:
        description: Router release version without a leading v.
        required: true
        type: string
      crate_version:
        description: Candle crate version to publish; may differ from the Router release.
        required: true
        type: string
      tag:
        description: Stable tag with a leading v.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Candle Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential pkg-config

      - name: Verify crate version
        working-directory: candle-binding
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_CRATE_VERSION: ${{ inputs.crate_version }}
        run: |
          CRATE_VERSION="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "candle-semantic-router") | .version'
          )"
          if [[ "$CRATE_VERSION" != "$EXPECTED_CRATE_VERSION" ]] ||
             [[ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]]; then
            echo "::error::Crate version, Router version, or tag inputs do not match"
            exit 1
          fi

      - name: Test crate
        run: make test-rust-ci

      - name: Run CPU API smoke tests
        working-directory: candle-binding
        run: |
          cargo test --no-default-features \
            --test qwen3_classification_api_test \
            --test classification_output_demo \
            --verbose

      - name: Check, build, and dry-run publish
        working-directory: candle-binding
        run: |
          cargo check --no-default-features --verbose
          cargo build --release --no-default-features --verbose
          cargo publish --dry-run --locked --no-default-features --verbose
          # Cargo's dry run builds and verifies the packaged source archive.
          sha256sum target/package/candle-semantic-router-*.crate > target/package/qualified.sha256
          git diff --exit-code
          git ls-files -z | sort -z | xargs -0 sha256sum > target/package/source.sha256

      - name: Publish crate
        working-directory: candle-binding
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          sha256sum --check target/package/source.sha256
          sha256sum --check target/package/qualified.sha256
          cargo publish --locked --no-default-features --verbose
          # Assert Cargo published the identical, deterministic package bytes.
          sha256sum --check target/package/qualified.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: candle-release-libraries
          path: |
            candle-binding/target/release/libcandle_semantic_router.a
            candle-binding/target/release/libcandle_semantic_router.so
            candle-binding/target/package/*.crate
            candle-binding/target/package/qualified.sha256
          retention-days: 7
