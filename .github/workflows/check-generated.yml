name: Generated Contracts

on:
  workflow_call:
    inputs:
      verifications:
        description: Selected generated-contract activity from the CI plan.
        type: string
        required: true

permissions:
  contents: read

jobs:
  generated:
    name: Generated Contracts
    runs-on: ${{ inputs.verifications != '[]' && fromJSON(inputs.verifications)[0].runner || 'ubuntu-24.04' }}
    env:
      CI: "true"
    steps:
      - name: Record Runner Environment
        working-directory: ${{ github.workspace }}
        env:
          OBSERVED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: echo "CI_RUNNER_ENVIRONMENT=$OBSERVED_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Schema, OpenAPI, CRD, and Runtime References
        run: make config-schema-check api-docs-check docs-crd-check model-runtime-client-check decision-runtime-catalog-check
      - name: Record Generated Contract Evidence
        env:
          VERIFICATIONS: ${{ inputs.verifications }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ci/workflow_evidence.py --verifications "$VERIFICATIONS" --id generated-contracts \
            --check config-schema-check --check api-docs-check --check docs-crd-check \
            --check model-runtime-client-check --check decision-runtime-catalog-check \
            --output .agent-harness/generated-contracts-result.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-result-generated-contracts
          path: .agent-harness/generated-contracts-result.json
          include-hidden-files: true
          if-no-files-found: error
