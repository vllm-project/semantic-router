name: Generated Contracts

on:
  workflow_call:
    inputs:
      native-artifact:
        description: Verified CPU libraries from this workflow run.
        type: string
        required: true
      verifications:
        description: Selected generated-contract activity from the CI plan.
        type: string
        required: true

permissions:
  contents: read

jobs:
  generated:
    name: Generated Contracts
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-ci\n      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load Shared Native Libraries
        uses: ./.github/actions/load-native-artifact
        with:
          artifact: ${{ inputs.native-artifact }}
      - name: Check Schema, OpenAPI, and CRD References
        run: make config-schema-check api-docs-check docs-crd-check
      - name: Record Generated Contract Evidence
        env:
          VERIFICATIONS: ${{ inputs.verifications }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ci/workflow_evidence.py --verifications "$VERIFICATIONS" --id generated-contracts \
            --check config-schema-check --check api-docs-check --check docs-crd-check \
            --output .agent-harness/generated-contracts-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-result-generated-contracts
          path: .agent-harness/generated-contracts-result.json
          include-hidden-files: true
          if-no-files-found: error
