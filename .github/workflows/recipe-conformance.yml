name: Recipe Conformance

on:
  workflow_call:
    inputs:
      verification:
        type: string
        required: true
      prebuilt-images:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: Inventory
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-go-ci

      - name: Install conformance dependencies
        run: python -m pip install -r tools/agent/requirements.txt -e src/vllm-sr

      - name: Validate maintained recipe contracts
        # Routing Tools owns the authoring unit tests; this checks the actual assets.
        run: |
          python tools/calibration/recipe/recipe_conformance.py \
            --output-dir .agent-harness/recipe-conformance static-all

      - id: plan
        name: Materialize live CPU shards
        run: |
          python tools/calibration/recipe/recipe_conformance.py \
            plan-all \
            --shards 3 \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish static coverage summary
        run: |
          shopt -s globstar nullglob
          for report in .agent-harness/recipe-conformance/**/coverage.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: recipe-conformance-inventory
          path: .agent-harness/recipe-conformance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  live-cpu:
    name: Preview (${{ matrix.shard }})
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      OPENROUTER_API_KEY: recipe-conformance-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache router signal models
        uses: actions/cache@v4
        with:
          path: models/
          key: >-
            ${{ runner.os }}-recipe-models-v1-${{
              hashFiles('tools/make/models.mk', 'config/recipes/**/config.yaml')
            }}
          restore-keys: |
            ${{ runner.os }}-recipe-models-v1-
        continue-on-error: true

      - name: Install CLI and conformance dependencies
        run: |
          python -m pip install -r tools/agent/requirements.txt
          python -m pip install -e src/vllm-sr

      - uses: ./.github/actions/load-ci-images
        if: inputs.prebuilt-images
        with:
          images: '["vllm-sr"]'
      - name: Run maintained recipe probes
        env:
          RECIPE_CONFORMANCE_RECIPES: ${{ matrix.recipes }}
          RECIPE_CONFORMANCE_RECIPES_ROOT: ${{ matrix.recipes_root }}
          RECIPE_CONFORMANCE_REPORT_DIR: >-
            ${{ github.workspace }}/.agent-harness/recipe-conformance/${{ matrix.report_dir }}
        run: |
          make recipe-conformance-live-cpu \
            RECIPE_CONFORMANCE_RECIPES="$RECIPE_CONFORMANCE_RECIPES" \
            RECIPE_CONFORMANCE_RECIPES_ROOT="$RECIPE_CONFORMANCE_RECIPES_ROOT" \
            RECIPE_CONFORMANCE_REPORT_DIR="$RECIPE_CONFORMANCE_REPORT_DIR"

      - name: Preserve consumed image identity
        if: inputs.prebuilt-images && always()
        env:
          SHARD: ${{ matrix.shard }}
        run: cp "$CI_IMAGE_RECEIPTS" ".agent-harness/recipe-conformance/image-$SHARD.json"
      - name: Add shard summaries
        if: always()
        run: |
          shopt -s globstar nullglob
          for summary in .agent-harness/recipe-conformance/**/summary.md; do
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-conformance-live-${{ matrix.shard }}
          path: .agent-harness/recipe-conformance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  report:
    name: Results
    if: ${{ !cancelled() && needs.inventory.result == 'success' }}
    needs:
      - inventory
      - live-cpu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install report dependencies
        run: python -m pip install -r tools/agent/requirements.txt

      - name: Download inventory and live reports
        uses: actions/download-artifact@v4
        with:
          pattern: recipe-conformance-*
          path: .agent-harness/recipe-conformance
          merge-multiple: true

      - name: Assemble consolidated report
        run: make recipe-conformance-report

      - name: Record complete Preview inventory
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          python tools/ci/runtime_evidence.py recipes --directory .agent-harness/recipe-conformance --output .agent-harness/recipe-evidence.json
          python tools/ci/ci_results.py record --verification "$VERIFICATION" \
            --evidence .agent-harness/recipe-evidence.json --output .agent-harness/recipe-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ fromJSON(inputs.verification).id }}
          path: .agent-harness/recipe-result.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish consolidated summary
        if: always()
        run: |
          shopt -s globstar nullglob
          for report in .agent-harness/recipe-conformance/**/conformance-report.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-conformance-report
          path: .agent-harness/recipe-conformance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
