name: CI Change Classification

on:
  workflow_call:
    outputs:
      domains:
        value: ${{ jobs.classify.outputs.domains }}
      python_unit:
        value: ${{ jobs.classify.outputs.python_unit }}
      core_test:
        value: ${{ jobs.classify.outputs.core_test }}
      dashboard:
        value: ${{ jobs.classify.outputs.dashboard }}
      website:
        value: ${{ jobs.classify.outputs.website }}
      paper:
        value: ${{ jobs.classify.outputs.paper }}
      helm:
        value: ${{ jobs.classify.outputs.helm }}
      e2e:
        value: ${{ jobs.classify.outputs.e2e }}
      e2e_profiles:
        value: ${{ jobs.classify.outputs.e2e_profiles }}
      full_e2e_profiles:
        value: ${{ jobs.classify.outputs.full_e2e_profiles }}
      cli:
        value: ${{ jobs.classify.outputs.cli }}
      memory:
        value: ${{ jobs.classify.outputs.memory }}
      images:
        value: ${{ jobs.classify.outputs.images }}
      pr_images:
        value: ${{ jobs.classify.outputs.pr_images }}
      publish_images:
        value: ${{ jobs.classify.outputs.publish_images }}
      operator:
        value: ${{ jobs.classify.outputs.operator }}
      openvino:
        value: ${{ jobs.classify.outputs.openvino }}
      performance:
        value: ${{ jobs.classify.outputs.performance }}
      router_learning:
        value: ${{ jobs.classify.outputs.router_learning }}
      recipe_conformance:
        value: ${{ jobs.classify.outputs.recipe_conformance }}
      docs_only:
        value: ${{ jobs.classify.outputs.docs_only }}
      security:
        value: ${{ jobs.classify.outputs.security }}
      full:
        value: ${{ jobs.classify.outputs.full }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.classify.outputs.domains }}
      python_unit: ${{ steps.classify.outputs.python_unit }}
      core_test: ${{ steps.classify.outputs.core_test }}
      dashboard: ${{ steps.classify.outputs.dashboard }}
      website: ${{ steps.classify.outputs.website }}
      paper: ${{ steps.classify.outputs.paper }}
      helm: ${{ steps.classify.outputs.helm }}
      e2e: ${{ steps.classify.outputs.e2e }}
      e2e_profiles: ${{ steps.classify.outputs.e2e_profiles }}
      full_e2e_profiles: ${{ steps.classify.outputs.full_e2e_profiles }}
      cli: ${{ steps.classify.outputs.cli }}
      memory: ${{ steps.classify.outputs.memory }}
      images: ${{ steps.classify.outputs.images }}
      pr_images: ${{ steps.classify.outputs.pr_images }}
      publish_images: ${{ steps.classify.outputs.publish_images }}
      operator: ${{ steps.classify.outputs.operator }}
      openvino: ${{ steps.classify.outputs.openvino }}
      performance: ${{ steps.classify.outputs.performance }}
      router_learning: ${{ steps.classify.outputs.router_learning }}
      recipe_conformance: ${{ steps.classify.outputs.recipe_conformance }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      security: ${{ steps.classify.outputs.security }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install classifier dependency
        run: python3 -m pip install PyYAML==6.0.3

      - id: classify
        name: Classify domains and explicit escalations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci/full') }}
        run: |
          full_arg=()
          if [[ "$FULL" == "true" ]]; then
            full_arg+=(--full)
          fi
          python3 tools/ci/classify_pr_changes.py \
            --base "$BASE_SHA" \
            --head "$GITHUB_SHA" \
            "${full_arg[@]}" \
            --github-output "$GITHUB_OUTPUT"
