name: CI Plan

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: pr
      full:
        type: boolean
        default: false
      draft:
        type: boolean
        default: false
      verification:
        description: Explicit verification for a manual run; normal entrypoints use changed paths.
        type: string
        default: ''
    outputs:
      plan:
        value: ${{ jobs.plan.outputs.plan }}
      images:
        value: ${{ jobs.plan.outputs.images }}
      publish_images:
        value: ${{ jobs.plan.outputs.publish_images }}
      build_native:
        value: ${{ jobs.plan.outputs.build_native }}
      multiarch:
        value: ${{ jobs.plan.outputs.multiarch }}
      publish_helm:
        value: ${{ jobs.plan.outputs.publish_helm }}
      publish_python:
        value: ${{ jobs.plan.outputs.publish_python }}
      quality:
        value: ${{ jobs.plan.outputs.quality }}
      generated:
        value: ${{ jobs.plan.outputs.generated }}
      security:
        value: ${{ jobs.plan.outputs.security }}
      core:
        value: ${{ jobs.plan.outputs.core }}
      storage:
        value: ${{ jobs.plan.outputs.storage }}
      dashboard:
        value: ${{ jobs.plan.outputs.dashboard }}
      operator:
        value: ${{ jobs.plan.outputs.operator }}
      local:
        value: ${{ jobs.plan.outputs.local }}
      recipes:
        value: ${{ jobs.plan.outputs.recipes }}
      native:
        value: ${{ jobs.plan.outputs.native }}
      performance:
        value: ${{ jobs.plan.outputs.performance }}
      package:
        value: ${{ jobs.plan.outputs.package }}
      component_batches:
        value: ${{ jobs.plan.outputs.component_batches }}
      e2e:
        value: ${{ jobs.plan.outputs.e2e }}

permissions:
  contents: read

jobs:
  plan:
    name: Verification Plan
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      images: ${{ steps.plan.outputs.images }}
      publish_images: ${{ steps.plan.outputs.publish_images }}
      build_native: ${{ steps.plan.outputs.build_native }}
      multiarch: ${{ steps.plan.outputs.multiarch }}
      publish_helm: ${{ steps.plan.outputs.publish_helm }}
      publish_python: ${{ steps.plan.outputs.publish_python }}
      quality: ${{ steps.plan.outputs.quality }}
      generated: ${{ steps.plan.outputs.generated }}
      security: ${{ steps.plan.outputs.security }}
      core: ${{ steps.plan.outputs.core }}
      storage: ${{ steps.plan.outputs.storage }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      operator: ${{ steps.plan.outputs.operator }}
      local: ${{ steps.plan.outputs.local }}
      recipes: ${{ steps.plan.outputs.recipes }}
      native: ${{ steps.plan.outputs.native }}
      performance: ${{ steps.plan.outputs.performance }}
      package: ${{ steps.plan.outputs.package }}
      component_batches: ${{ steps.plan.outputs.component_batches }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install PyYAML==6.0.3
      - id: plan
        env:
          PROFILE: ${{ inputs.profile }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ inputs.full }}
          DRAFT: ${{ inputs.draft }}
          VERIFICATION: ${{ inputs.verification }}
        run: |
          flags=()
          if [[ "$FULL" == true ]]; then flags+=(--full); fi
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ -n "$VERIFICATION" ]]; then flags+=(--verification "$VERIFICATION"); fi
          python3 tools/ci/ci_plan.py --profile "$PROFILE" \
            --base "$BASE_SHA" --head "$GITHUB_SHA" "${flags[@]}" \
            --output .agent-harness/ci/plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: .agent-harness/ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
