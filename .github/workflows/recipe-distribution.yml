name: Built-in Recipes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/recipes/**"
      - "config/schemas/recipe-metadata-v1.*"
      - "tools/agent/schemas/recipe-probes-v1.schema.json"
      - "tools/agent/scripts/recipe_conformance*.py"
      - "tools/agent/scripts/recipe_metadata_schema.py"
      - "tools/agent/scripts/router_calibration_*.py"
      - "tools/make/recipe-conformance.mk"
      - "tools/release/recipe_bundle.py"
      - "tools/release/snapshot_builtin_recipes.py"
      - ".github/workflows/recipe-distribution.yml"
  push:
    branches:
      - main
    paths:
      - "config/recipes/**"
      - "config/schemas/recipe-metadata-v1.*"
      - "tools/agent/schemas/recipe-probes-v1.schema.json"
      - "tools/agent/scripts/recipe_conformance*.py"
      - "tools/agent/scripts/recipe_metadata_schema.py"
      - "tools/agent/scripts/router_calibration_*.py"
      - "tools/make/recipe-conformance.mk"
      - "tools/release/recipe_bundle.py"
      - "tools/release/snapshot_builtin_recipes.py"
      - ".github/workflows/recipe-distribution.yml"

permissions:
  contents: read

concurrency:
  group: built-in-recipes-${{ github.event_name == 'push' && 'latest' || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-built-in-recipes:
    name: Validate built-in Recipes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Validate canonical source contracts
        run: |
          python -m pip install -r tools/agent/requirements.txt
          make recipe-conformance-static

      - name: Protect snapshots already bound to release tags
        env:
          BASE_REF: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
                github.event_name == 'push' && github.event.before || github.sha }}
        run: |
          python tools/release/snapshot_builtin_recipes.py \
            --check-published --base-ref "$BASE_REF"

      - name: Write validation receipt
        run: |
          set -euo pipefail
          receipt_dir="dist/built-in-recipe-receipt"
          mkdir -p "$receipt_dir"
          printf '%s\n' "$GITHUB_SHA" >"$receipt_dir/source-commit.txt"
          find config/recipes/built-in \
            -type f \( -name '*.yaml' -o -name '*.md' -o -name '*.dsl' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum >"$receipt_dir/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: built-in-recipe-receipt-${{ github.run_id }}
          path: dist/built-in-recipe-receipt/
          if-no-files-found: error
          retention-days: 30
