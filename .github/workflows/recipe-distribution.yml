name: Built-in Model Catalog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/recipes/**"
      - "config/schemas/recipe-metadata-v1.*"
      - "src/vllm-sr/MANIFEST.in"
      - "src/vllm-sr/cli/commands/general.py"
      - "src/vllm-sr/cli/commands/model.py"
      - "src/vllm-sr/cli/commands/model_rendering.py"
      - "src/vllm-sr/cli/model_assets/**"
      - "src/vllm-sr/cli/model_bundle.py"
      - "src/vllm-sr/cli/model_catalog.py"
      - "src/vllm-sr/cli/model_catalog_types.py"
      - "src/vllm-sr/cli/model_catalog_validation.py"
      - "src/vllm-sr/pyproject.toml"
      - "tools/agent/schemas/recipe-probes-v1.schema.json"
      - "tools/agent/scripts/recipe_conformance*.py"
      - "tools/agent/scripts/recipe_metadata_schema.py"
      - "tools/agent/scripts/router_calibration_*.py"
      - "tools/make/recipe-conformance.mk"
      - "tools/release/sync_model_catalog.py"
      - "tools/release/snapshot_model_catalog.py"
      - ".github/workflows/recipe-distribution.yml"
  push:
    branches:
      - main
    paths:
      - "config/recipes/**"
      - "config/schemas/recipe-metadata-v1.*"
      - "src/vllm-sr/MANIFEST.in"
      - "src/vllm-sr/cli/commands/general.py"
      - "src/vllm-sr/cli/commands/model.py"
      - "src/vllm-sr/cli/commands/model_rendering.py"
      - "src/vllm-sr/cli/model_assets/**"
      - "src/vllm-sr/cli/model_bundle.py"
      - "src/vllm-sr/cli/model_catalog.py"
      - "src/vllm-sr/cli/model_catalog_types.py"
      - "src/vllm-sr/cli/model_catalog_validation.py"
      - "src/vllm-sr/pyproject.toml"
      - "tools/agent/schemas/recipe-probes-v1.schema.json"
      - "tools/agent/scripts/recipe_conformance*.py"
      - "tools/agent/scripts/recipe_metadata_schema.py"
      - "tools/agent/scripts/router_calibration_*.py"
      - "tools/make/recipe-conformance.mk"
      - "tools/release/sync_model_catalog.py"
      - "tools/release/snapshot_model_catalog.py"
      - ".github/workflows/recipe-distribution.yml"

permissions:
  contents: read

concurrency:
  group: built-in-model-catalog-${{ github.event_name == 'push' && 'latest' || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-built-in-models:
    name: Validate bundled virtual models
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Validate source contracts and generated package assets
        run: |
          python -m pip install -r tools/agent/requirements.txt
          python tools/release/sync_model_catalog.py --check
          make recipe-conformance-static

      - name: Protect snapshots already bound to release tags
        env:
          BASE_REF: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
                github.event_name == 'push' && github.event.before || github.sha }}
        run: |
          python tools/release/snapshot_model_catalog.py \
            --check-published --base-ref "$BASE_REF"

      - name: Verify the installed model catalog
        run: |
          python -m pip install ./src/vllm-sr
          vllm-sr model list --output json >/tmp/model-catalog-latest.json
          vllm-sr model list --all-versions --output json >/tmp/model-catalog-all.json
          vllm-sr model show vllm-sr/chorus-v1 --output json >/tmp/model-chorus-v1.json

      - name: Write catalog validation receipt
        run: |
          set -euo pipefail
          receipt_dir="dist/model-catalog-receipt"
          mkdir -p "$receipt_dir"
          cp /tmp/model-catalog-latest.json "$receipt_dir/latest.json"
          cp /tmp/model-catalog-all.json "$receipt_dir/all-versions.json"
          cp /tmp/model-chorus-v1.json "$receipt_dir/chorus-v1.json"
          printf '%s\n' "$GITHUB_SHA" >"$receipt_dir/source-commit.txt"
          find config/recipes/built-in src/vllm-sr/cli/model_assets \
            -type f \( -name '*.yaml' -o -name '*.md' -o -name '*.dsl' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum >"$receipt_dir/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: built-in-model-catalog-receipt-${{ github.run_id }}
          path: dist/model-catalog-receipt/
          if-no-files-found: error
          retention-days: 30
