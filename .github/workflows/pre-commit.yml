name: Source Quality

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip native-language tooling for documentation-only changes.
        required: true
        type: boolean
      website:
        description: Build the website when its source or contracts change.
        type: boolean
        default: false
      verifications:
        description: Selected source-quality activity from the CI plan.
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  quality:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out the Planned Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set Up Rust
        if: ${{ !inputs.docs_only }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - name: Install System Dependencies
        if: ${{ !inputs.docs_only }}
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential pkg-config shellcheck
      - name: Resolve Go Linter Version
        if: ${{ !inputs.docs_only }}
        id: golangci_lint
        run: echo "version=v$(cat tools/linter/go/golangci-lint.version)" >> "$GITHUB_OUTPUT"
      - name: Set Up Go Linter
        if: ${{ !inputs.docs_only }}
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-mode: binary
          args: --help
      - name: Cache Rust Dependencies
        if: ${{ !inputs.docs_only }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            candle-binding/target/
          key: ${{ runner.os }}-cargo-precommit-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-precommit-
      - name: Cache Go Dependencies
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-precommit-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-precommit-
      - name: Cache Node Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-precommit-${{ hashFiles('website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-precommit-
      - name: Cache Pre-Commit Environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-
      - name: Install Reference Generator Dependencies
        run: python -m pip install -r tools/docs/requirements.txt
      # Verify committed references before website builds consume them.
      - name: Check Generated References
        run: make docs-generated-check docs-cli-test docs-community-test docs-check-translation-coverage
      - name: Check Changed Source
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_REF="origin/${{ github.base_ref }}"
          else
            export BASE_REF="HEAD^"
          fi
          make check CI_STATIC_ONLY=true
      - name: Build Website
        if: inputs.website
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Record Quality Evidence
        if: inputs.verifications != '[]'
        env:
          VERIFICATIONS: ${{ inputs.verifications }}
          CHECK_WEBSITE: ${{ inputs.website }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          checks=(--check changed-source-format-lint --check generated-reference-contracts)
          if [ "$CHECK_WEBSITE" = true ]; then checks+=(--check website-build); fi
          python3 tools/ci/workflow_evidence.py --verifications "$VERIFICATIONS" --id quality \
            "${checks[@]}" --output .agent-harness/quality-result.json
      - uses: actions/upload-artifact@v4
        if: inputs.verifications != '[]'
        with:
          name: ci-result-quality
          path: .agent-harness/quality-result.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Show Failure Context
        if: failure()
        run: |
          git status --short
          git diff --stat
          echo "Reproduce with make check BASE_REF=origin/${{ github.base_ref }}"
