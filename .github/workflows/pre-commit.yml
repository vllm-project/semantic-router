name: Pre-commit

on:
  workflow_call:
    inputs:
      docs_only:
        description: Run the lightweight docs and website gate.
        required: true
        type: boolean
      website:
        description: Build the website in lightweight mode.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  docs-precommit:
    if: inputs.docs_only
    runs-on: ubuntu-latest
    name: Docs and website lightweight checks

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        if: inputs.website
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache Node dependencies
        if: inputs.website
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            website/node_modules
          key: ${{ runner.os }}-node-docs-ci-${{ hashFiles('website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-docs-ci-

      - name: Run docs CI gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export AGENT_BASE_REF="origin/${{ github.base_ref }}"
          else
            export AGENT_BASE_REF="HEAD^"
          fi
          make agent-docs-ci-gate

      - name: Build website
        if: inputs.website
        run: |
          cd website
          npm ci
          npm run build

  full-precommit:
    if: ${{ !inputs.docs_only }}
    runs-on: ubuntu-latest
    name: Full pre-commit checks

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for pre-commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            build-essential \
            pkg-config \
            shellcheck

      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          install-mode: binary
          args: --help

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            candle-binding/target/
          key: ${{ runner.os }}-cargo-precommit-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-precommit-

      - name: Cache Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-precommit-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-precommit-

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-node-precommit-${{ hashFiles('website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-precommit-

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-precommit-

      # agent-ci-lint runs the selected domains' fast tests, which for dashboard
      # changes includes make dashboard-check. Some dashboard backend tests shell
      # out to the vllm-sr CLI, so its Python dependencies must be importable.
      - name: Install vllm-sr CLI
        run: pip install -e src/vllm-sr

      - name: Run agent CI lint on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export AGENT_BASE_REF="origin/${{ github.base_ref }}"
          else
            export AGENT_BASE_REF="HEAD^"
          fi
          make agent-ci-lint

      - name: Show pre-commit results
        if: failure()
        run: |
          echo "::error::Pre-commit hooks failed. Please fix the issues and commit again."
          echo ""
          echo "=== Files with gofmt issues (gofmt -l) ==="
          gofmt -l $(find . -name "*.go" -not -path "./.git/*") || true
          echo ""
          echo "=== gofmt diff for all modified Go files ==="
          gofmt -d $(find . -name "*.go" -not -path "./.git/*") || true
          echo ""
          echo "=== Working tree changes after pre-commit run ==="
          git diff --name-only || true
          echo ""
          echo "=== Full git diff ==="
          git diff || true
          echo ""
          echo "To reproduce the full PR pre-commit baseline locally:"
          echo "  make agent-pr-gate"
          echo ""
          echo "To run the local branch prelint bundle manually:"
          echo "  make precommit-branch-gate AGENT_BASE_REF=origin/${{ github.base_ref }}"
          echo ""
          echo "To run the changed-file pre-commit workflow locally:"
          echo "  make precommit-local"
