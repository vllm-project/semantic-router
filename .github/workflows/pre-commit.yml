name: Pre-commit

on:
  workflow_call:
    inputs:
      docs_only:
        description: Avoid native lint tool setup for documentation-only changes.
        required: true
        type: boolean
      website:
        description: Build the website whenever website files change.
        required: false
        default: false
        type: boolean
      domains:
        description: JSON ownership domains from the shared classifier.
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

jobs:
  static:
    name: Static and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.docs_only }}
        with:
          toolchain: '1.90'
          components: rustfmt, clippy
      - name: Install Go lint binary
        if: ${{ !inputs.docs_only }}
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          install-mode: binary
          args: --help
      - name: Cache native lint dependencies
        if: ${{ !inputs.docs_only }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/db/
            candle-binding/target/
          key: ${{ runner.os }}-cargo-precommit-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-precommit-
      - name: Cache Node packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-precommit-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-precommit-
      - name: Install shell lint tooling
        if: ${{ !inputs.docs_only }}
        run: sudo apt-get update && sudo apt-get install -y shellcheck pkg-config
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run changed-file static checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: make check
      - name: Validate repository harness
        if: contains(fromJSON(inputs.domains), 'harness')
        run: make harness-check
      - name: Check translation coverage
        if: contains(fromJSON(inputs.domains), 'documentation')
        run: make docs-check-translation-coverage
      - name: Build website
        if: inputs.website
        working-directory: website
        run: npm ci && npm run build
      - name: Show generated or formatting differences
        if: failure()
        run: git diff --stat && git diff

  e2e-compile:
    name: Compile E2E framework
    if: contains(fromJSON(inputs.domains), 'e2e-framework')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: e2e/go.sum
      - run: make build-e2e
