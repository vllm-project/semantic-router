name: Vela 2 ARM64 Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-baseline:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      OMP_WAIT_POLICY: PASSIVE
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      VELA2_REVISION: a3209a50dc3ebd7e3b7520440d8fba666000f4c4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/model-runtime/pyproject.toml

      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: vela2-0.3b-${{ env.VELA2_REVISION }}

      - name: Install the model runtime benchmark dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "src/model-runtime[reference]"

      - name: Download the pinned Vela 2 package
        run: |
          package=$(hf download vllm-sr/Vela-2.0-0.3B --revision "$VELA2_REVISION")
          echo "VELA2_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Record the runner environment
        run: |
          test "$(uname -m)" = aarch64
          mkdir -p reports
          uname -a > reports/environment.txt
          lscpu >> reports/environment.txt
          python -c "import platform, torch; print(platform.platform()); print(torch.__version__); print(torch.__config__.show()); print('mkldnn_available=', torch.backends.mkldnn.is_available()); print('mkldnn_reorder=', hasattr(torch.ops.mkldnn, '_reorder_linear_weight')); print('mkldnn_linear=', hasattr(torch.ops.mkldnn, '_linear_pointwise'))" >> reports/environment.txt

      - name: Verify the current ARM64 runtime against the released engine
        run: |
          set -o pipefail
          python src/model-runtime/tools/vela2_parity.py \
            --package "$VELA2_PACKAGE" \
            --device cpu \
            --generate 8 \
            --seed 4668 \
            --output reports/parity.json 2>&1 | tee reports/parity.log

      - name: Measure the interleaved paired baseline
        run: |
          set -o pipefail
          python src/model-runtime/tools/vela2_bench.py \
            --package "$VELA2_PACKAGE" \
            --device cpu \
            --sides reference,runtime \
            --tokens 32 \
            --requests 20 \
            --warmup 5 \
            --concurrency 1 \
            --rounds 5 \
            --baselines reference \
            --trace \
            --output reports/baseline.json 2>&1 | tee reports/baseline.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vela2-arm64-baseline-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
