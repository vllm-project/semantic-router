name: CI

on:
  workflow_dispatch:
    inputs:
      verification:
        description: Verification ID from tools/ci/verification_catalog.yaml (or e2e.PROFILE) to run on the selected branch or tag.
        type: string
        default: native.image-calibration-cpu
        required: true
  workflow_call:
    inputs:
      profile:
        type: string
        default: pr
      full:
        type: boolean
        default: false
      draft:
        type: boolean
        default: false
      tag:
        type: string
        default: ''
      performance-base-ref:
        type: string
        default: ''
    outputs:
      plan:
        value: ${{ jobs.plan.outputs.plan }}
      publish_images:
        value: ${{ jobs.plan.outputs.publish_images }}
      publish_helm:
        value: ${{ jobs.plan.outputs.publish_helm }}
      publish_python:
        value: ${{ jobs.plan.outputs.publish_python }}

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/ci-changes.yml
    with:
      profile: ${{ inputs.profile || 'pr' }}
      full: ${{ inputs.full || false }}
      draft: ${{ inputs.draft || false }}
      verification: ${{ github.event_name == 'workflow_dispatch' && inputs.verification || '' }}

  image-router:
    name: Artifacts / Router Image
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.image_producers)['image-router'].images) != '[]'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-router'].build_images) }}
      published-images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-router'].published_images) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
      multiarch: ${{ needs.plan.outputs.multiarch == 'true' }}
    secrets: inherit

  image-local:
    name: Artifacts / Local Runtime Image
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.image_producers)['image-local'].images) != '[]'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-local'].build_images) }}
      published-images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-local'].published_images) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
      multiarch: ${{ needs.plan.outputs.multiarch == 'true' }}
    secrets: inherit

  image-dashboard:
    name: Artifacts / Dashboard Image
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.image_producers)['image-dashboard'].images) != '[]'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-dashboard'].build_images) }}
      published-images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-dashboard'].published_images) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
      multiarch: ${{ needs.plan.outputs.multiarch == 'true' }}
    secrets: inherit

  image-operator:
    name: Artifacts / Operator Images
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.image_producers)['image-operator'].images) != '[]'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-operator'].build_images) }}
      published-images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-operator'].published_images) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
      multiarch: ${{ needs.plan.outputs.multiarch == 'true' }}
    secrets: inherit

  image-fixtures:
    name: Artifacts / Provider Fixture
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.image_producers)['image-fixtures'].images) != '[]'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-fixtures'].build_images) }}
      published-images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-fixtures'].published_images) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
      multiarch: ${{ needs.plan.outputs.multiarch == 'true' }}
    secrets: inherit

  image-distribution:
    name: Artifacts / Distribution Images
    needs: plan
    if: toJSON(fromJSON(needs.plan.outputs.image_producers)['image-distribution'].images) != '[]'
    uses: ./.github/workflows/build-artifacts.yml
    with:
      images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-distribution'].build_images) }}
      published-images: ${{ toJSON(fromJSON(needs.plan.outputs.image_producers)['image-distribution'].published_images) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
      multiarch: ${{ needs.plan.outputs.multiarch == 'true' }}
    secrets: inherit

  native-build:
    name: Artifacts / Native Libraries
    needs: plan
    if: needs.plan.outputs.build_native == 'true'
    uses: ./.github/workflows/build-native.yml

  quality:
    name: Quality / Source
    needs: plan
    if: needs.plan.outputs.quality != '[]'
    uses: ./.github/workflows/pre-commit.yml
    with:
      verifications: ${{ needs.plan.outputs.quality }}
      docs_only: ${{ fromJSON(needs.plan.outputs.plan).quality_context.docs_only && !inputs.full }}
      website: ${{ fromJSON(needs.plan.outputs.plan).quality_context.website }}

  generated:
    name: Quality / Generated
    needs: [plan, native-build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.generated != '[]'
      && needs.native-build.result == 'success'
    uses: ./.github/workflows/check-generated.yml
    with:
      verifications: ${{ needs.plan.outputs.generated }}
      native-artifact: ${{ needs.native-build.outputs.artifact-name }}

  security:
    name: Quality / Security
    needs: [plan]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.security != '[]'
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.security)[0]) }}
    secrets: inherit

  core:
    name: Tests / Components / Router
    needs: [plan, native-build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.core != '[]'
      && needs.native-build.result == 'success'
    uses: ./.github/workflows/test-and-build.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.core)[0]) }}
      native-artifact: ${{ needs.native-build.outputs.artifact-name }}
    secrets: inherit

  storage:
    name: Tests / Integration / Storage
    needs: [plan, native-build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.storage != '[]'
      && needs.native-build.result == 'success'
    uses: ./.github/workflows/test-storage.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.storage)[0]) }}
      native-artifact: ${{ needs.native-build.outputs.artifact-name }}
    secrets: inherit

  dashboard:
    name: Tests / Components / Dashboard
    needs: [plan, native-build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.dashboard != '[]'
      && needs.native-build.result == 'success'
    uses: ./.github/workflows/dashboard-test.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.dashboard)[0]) }}
      native-artifact: ${{ needs.native-build.outputs.artifact-name }}
    secrets: inherit

  operator:
    name: Tests / E2E / Operator
    needs: [plan, image-router, image-operator, image-fixtures]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.operator != '[]'
      && needs.image-router.result == 'success'
      && needs.image-operator.result == 'success'
      && needs.image-fixtures.result == 'success'
    uses: ./.github/workflows/operator-ci.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.operator)[0]) }}
      run_integration: true
      integration_matrix: ${{ toJSON(fromJSON(needs.plan.outputs.operator)[0].integration_matrix) }}
    secrets: inherit

  local:
    name: Tests / E2E / Local Stack
    needs: [plan, image-local, image-dashboard, image-fixtures]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.local != '[]'
      && needs.image-local.result == 'success'
      && needs.image-dashboard.result == 'success'
      && needs.image-fixtures.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['local'] }}
    uses: ./.github/workflows/test-local.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['local'][matrix.label]) }}
      prebuilt-images: true
    secrets: inherit

  recipes:
    name: Tests / Conformance / Recipes
    needs: [plan, image-local]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.recipes != '[]'
      && needs.image-local.result == 'success'
    uses: ./.github/workflows/recipe-conformance.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.recipes)[0]) }}
      prebuilt-images: true
    secrets: inherit

  native-shared:
    name: Tests / CPU Contracts
    needs: [plan, native-build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.native-shared != '[]'
      && needs.native-build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['native-shared'] }}
    uses: ./.github/workflows/test-native.yml
    with:
      batch: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['native-shared'][matrix.label]) }}
      native-artifact: ${{ needs.native-build.outputs.artifact-name }}
    secrets: inherit

  native-independent:
    name: Tests / Emulated Contracts
    needs: [plan]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.native-independent != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['native-independent'] }}
    uses: ./.github/workflows/test-native.yml
    with:
      batch: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['native-independent'][matrix.label]) }}
    secrets: inherit

  performance:
    name: Tests / Performance
    needs: [plan, native-build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.performance != '[]'
      && needs.native-build.result == 'success'
    uses: ./.github/workflows/performance-test.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.performance)[0]) }}
      native-artifact: ${{ needs.native-build.outputs.artifact-name }}
      base-ref: ${{ inputs.performance-base-ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    secrets: inherit

  package:
    name: Tests / Packages
    needs: [plan]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.package != '[]'
    uses: ./.github/workflows/package-check.yml
    with:
      verification: ${{ toJSON(fromJSON(needs.plan.outputs.package)[0]) }}
      mode: ${{ fromJSON(needs.plan.outputs.plan).profile }}
      tag: ${{ inputs.tag }}
    secrets: inherit

  tools:
    name: Tests / Components
    needs: [plan]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.tools != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['tools'] }}
    uses: ./.github/workflows/test-tools.yml
    with:
      batch: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['tools'][matrix.label]) }}
    secrets: inherit

  e2e-router:
    name: Tests / E2E / Kubernetes Router
    needs: [plan, image-router]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.e2e-router != '[]'
      && needs.image-router.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['e2e-router'] }}
    uses: ./.github/workflows/integration-test-k8s.yml
    with:
      batch: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['e2e-router'][matrix.label]) }}
      prebuilt-images: true
    secrets: inherit

  e2e-fixtures:
    name: Tests / E2E / Kubernetes Providers
    needs: [plan, image-router, image-fixtures]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.e2e-fixtures != '[]'
      && needs.image-router.result == 'success'
      && needs.image-fixtures.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['e2e-fixtures'] }}
    uses: ./.github/workflows/integration-test-k8s.yml
    with:
      batch: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['e2e-fixtures'][matrix.label]) }}
      prebuilt-images: true
    secrets: inherit

  e2e-dashboard:
    name: Tests / E2E / Kubernetes Dashboard
    needs: [plan, image-router, image-dashboard]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.e2e-dashboard != '[]'
      && needs.image-router.result == 'success'
      && needs.image-dashboard.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.worker_labels)['e2e-dashboard'] }}
    uses: ./.github/workflows/integration-test-k8s.yml
    with:
      batch: ${{ toJSON(fromJSON(needs.plan.outputs.dispatch)['e2e-dashboard'][matrix.label]) }}
      prebuilt-images: true
    secrets: inherit

  gate:
    name: Gate
    if: always()
    needs: [plan, image-router, image-local, image-dashboard, image-operator, image-fixtures, image-distribution, native-build, quality, generated, security, core, storage, dashboard, operator, local, recipes, native-shared, native-independent, performance, package, tools, e2e-router, e2e-fixtures, e2e-dashboard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install PyYAML==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: .agent-harness/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: .agent-harness/ci/results
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-build-*
          path: .agent-harness/ci/results
      - name: Reconcile source, dependencies, qualified combinations and cases
        env:
          # Job outputs include the full plan and dispatch copies. Keep them out of
          # the process environment; the complete plan is downloaded above.
          EXECUTOR_RESULTS: >-
            {
              "plan": {"result": "${{ needs.plan.result }}"},
              "image-router": {"result": "${{ needs.image-router.result }}"},
              "image-local": {"result": "${{ needs.image-local.result }}"},
              "image-dashboard": {"result": "${{ needs.image-dashboard.result }}"},
              "image-operator": {"result": "${{ needs.image-operator.result }}"},
              "image-fixtures": {"result": "${{ needs.image-fixtures.result }}"},
              "image-distribution": {"result": "${{ needs.image-distribution.result }}"},
              "native-build": {"result": "${{ needs.native-build.result }}"},
              "quality": {"result": "${{ needs.quality.result }}"},
              "generated": {"result": "${{ needs.generated.result }}"},
              "security": {"result": "${{ needs.security.result }}"},
              "core": {"result": "${{ needs.core.result }}"},
              "storage": {"result": "${{ needs.storage.result }}"},
              "dashboard": {"result": "${{ needs.dashboard.result }}"},
              "operator": {"result": "${{ needs.operator.result }}"},
              "local": {"result": "${{ needs.local.result }}"},
              "recipes": {"result": "${{ needs.recipes.result }}"},
              "native-shared": {"result": "${{ needs.native-shared.result }}"},
              "native-independent": {"result": "${{ needs.native-independent.result }}"},
              "performance": {"result": "${{ needs.performance.result }}"},
              "package": {"result": "${{ needs.package.result }}"},
              "tools": {"result": "${{ needs.tools.result }}"},
              "e2e-router": {"result": "${{ needs.e2e-router.result }}"},
              "e2e-fixtures": {"result": "${{ needs.e2e-fixtures.result }}"},
              "e2e-dashboard": {"result": "${{ needs.e2e-dashboard.result }}"}
            }
        run: |
          python3 tools/ci/check_ci_gate.py \
            --plan .agent-harness/ci/plan.json \
            --results .agent-harness/ci/results
