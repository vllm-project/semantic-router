name: Kubernetes Integration

on:
  workflow_call:
    inputs:
      batch:
        description: Planned compatible profiles with independent verification contracts.
        type: string
        required: true
      prebuilt-images:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  integration-test:
    name: Execute Contracts
    runs-on: ${{ fromJSON(inputs.batch).runner }}
    timeout-minutes: ${{ fromJSON(inputs.batch).job_timeout_minutes }}
    env:
      E2E_SEMANTIC_ROUTER_HELM_TIMEOUT: 60m
      # Pipe falls back to direct on any proxy error; comma only on 404 and 410.
      GOPROXY: 'https://proxy.golang.org|direct'
      BATCH: ${{ inputs.batch }}
      BATCH_ID: ${{ fromJSON(inputs.batch).id }}

    steps:
      - uses: actions/checkout@v4
      - name: Require immutable image handoff
        env:
          PREBUILT: ${{ inputs.prebuilt-images }}
        run: test "$PREBUILT" = true
      - name: Set up Kind once for the shard
        uses: ./.github/actions/setup-kind
        with:
          show-usage: "true"
          relocate-docker: "true"
      - name: Load verified image union once
        uses: ./.github/actions/load-ci-images
        with:
          images: ${{ toJSON(fromJSON(inputs.batch).images) }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence tools
        run: make harness-venv-install
      - name: Build E2E test binary once
        run: make build-e2e
      - name: Execute isolated profile cases
        env:
          E2E_BATCH_STATE_ROOT: /mnt/tmp/e2e-${{ fromJSON(inputs.batch).id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          .venv-agent/bin/python tools/ci/run_e2e_batch.py --batch "$BATCH" \
            --output ".agent-harness/ci/e2e/$BATCH_ID"
      - name: Finish interrupted profile teardown
        if: always()
        run: |
          if [ -x .venv-agent/bin/python ]; then
            .venv-agent/bin/python tools/ci/run_e2e_batch.py --cleanup \
              --output ".agent-harness/ci/e2e/$BATCH_ID"
          fi
      - name: Upload independent profile receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ fromJSON(inputs.batch).id }}
          path: .agent-harness/ci/e2e/${{ fromJSON(inputs.batch).id }}/results/*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload every profile's raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ fromJSON(inputs.batch).id }}
          path: |
            .agent-harness/ci/e2e/${{ fromJSON(inputs.batch).id }}/raw/
            .agent-harness/ci/e2e/${{ fromJSON(inputs.batch).id }}/batch.json
            .agent-harness/ci/e2e/${{ fromJSON(inputs.batch).id }}/summary.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize profile reports
        if: always()
        run: |
          for report in ".agent-harness/ci/e2e/$BATCH_ID"/raw/*/test-report.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for failure in ".agent-harness/ci/e2e/$BATCH_ID"/raw/*/failure.txt; do
            if [ -f "$failure" ]; then
              printf '\nProfile failure (%s):\n\n' "$(basename "$(dirname "$failure")")" >> "$GITHUB_STEP_SUMMARY"
              cat "$failure" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
