name: Python Package Publisher

on:
  workflow_call:
    inputs:
      prebuilt-dist:
        description: Promote the exact distribution qualified by package-check.yml.
        type: boolean
        default: false
      qualified-decision:
        description: Publish the post-image six-model-qualified Decision distribution.
        type: boolean
        default: false
      channel:
        description: Package channel, stable for releases or dev for validated main commits.
        required: false
        default: stable
        type: string
      version:
        description: Stable version without a leading v.
        required: false
        default: ""
        type: string
      tag:
        description: Stable tag with a leading v.
        required: false
        default: ""
        type: string
      catalog_snapshot:
        description: Immutable built-in catalog snapshot derived from the release minor.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish to TestPyPI.
        required: true
        type: string
      tag:
        description: Optional source tag label.
        required: false
        default: ""
        type: string
      catalog_snapshot:
        description: Optional built-in snapshot; defaults to v<major>.<minor>.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Python Package
    if: ${{ !inputs.prebuilt-dist }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare development package version
        if: inputs.channel == 'dev'
        id: dev
        run: |
          python tools/ci/prepare_dev_package.py \
            --source-date-epoch "$(git show -s --format=%ct HEAD)" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate package version
        id: contract
        working-directory: src/vllm-sr
        env:
          PACKAGE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_VERSION: ${{ steps.dev.outputs.version || inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          INPUT_CATALOG_SNAPSHOT: ${{ inputs.catalog_snapshot }}
        run: |
          case "$PACKAGE_CHANNEL" in
            stable|dev) ;;
            *) echo "::error::Unsupported package channel '$PACKAGE_CHANNEL'"; exit 1 ;;
          esac
          PACKAGE_VERSION="$(
            sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1
          )"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Package version '$PACKAGE_VERSION' does not match '$RELEASE_VERSION'"
            exit 1
          fi
          if [[ "$PACKAGE_CHANNEL" == "stable" ]] &&
             [[ "${{ github.event_name }}" != "workflow_dispatch" ]] &&
             [[ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version"
            exit 1
          fi
          if [[ "$PACKAGE_CHANNEL" == "dev" ]]; then
            CATALOG_SNAPSHOT=latest
          else
            IFS=. read -r VERSION_MAJOR VERSION_MINOR _ <<< "$RELEASE_VERSION"
            EXPECTED_CATALOG_SNAPSHOT="v${VERSION_MAJOR}.${VERSION_MINOR}"
            CATALOG_SNAPSHOT="${INPUT_CATALOG_SNAPSHOT:-$EXPECTED_CATALOG_SNAPSHOT}"
            if [[ "$CATALOG_SNAPSHOT" != "$EXPECTED_CATALOG_SNAPSHOT" ]]; then
              echo "::error::Catalog snapshot '$CATALOG_SNAPSHOT' does not match '$EXPECTED_CATALOG_SNAPSHOT'"
              exit 1
            fi
          fi
          if [[ ! -d "../../config/recipes/built-in/$CATALOG_SNAPSHOT" ]]; then
            echo "::error::Missing release catalog snapshot 'config/recipes/built-in/$CATALOG_SNAPSHOT'"
            exit 1
          fi
          echo "catalog_snapshot=$CATALOG_SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Build and verify package
        working-directory: src/vllm-sr
        env:
          CATALOG_SNAPSHOT: ${{ steps.contract.outputs.catalog_snapshot }}
          PACKAGE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_VERSION: ${{ steps.dev.outputs.version || inputs.version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pyyaml
          if [[ "$PACKAGE_CHANNEL" == "stable" ]]; then
            python ../../tools/release/snapshot_model_catalog.py \
              --check --version "$RELEASE_VERSION"
          fi
          python ../../tools/release/stage_model_catalog_package.py
          python ../../tools/release/stage_model_catalog_package.py --check
          python -m build
          twine check dist/*
          REQUIRED_FILES=(
            "cli/templates/config.template.yaml"
            "cli/templates/envoy.template.yaml"
            "cli/templates/tools_db.json"
            "cli/templates/grafana.serve.ini"
            "cli/templates/prometheus.serve.yaml"
          )
          WHEEL_PATH="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [[ -z "$WHEEL_PATH" ]]; then
            echo "::error::Package build produced no wheel"
            exit 1
          fi
          mkdir wheel-unpacked
          unzip -q "$WHEEL_PATH" -d wheel-unpacked
          for catalog_version in latest "$CATALOG_SNAPSHOT"; do
            SNAPSHOT_DIR="../../config/recipes/built-in/$catalog_version"
            mapfile -t SNAPSHOT_FILES < <(
              find "$SNAPSHOT_DIR" -type f -printf '%P\n' | sort
            )
            if [[ "${#SNAPSHOT_FILES[@]}" -eq 0 ]]; then
              echo "::error::Catalog snapshot '$catalog_version' contains no packaged resources"
              exit 1
            fi
            for file in "${SNAPSHOT_FILES[@]}"; do
              package_file="cli/model_assets/$catalog_version/$file"
              REQUIRED_FILES+=("$package_file")
              cmp -s "$SNAPSHOT_DIR/$file" "wheel-unpacked/$package_file" || {
                echo "::error::Packaged model resource drifted: '$package_file'"
                exit 1
              }
            done
          done

          unzip -Z1 "$WHEEL_PATH" > wheel-files.txt
          for file in "${REQUIRED_FILES[@]}"; do
            grep -Fqx "$file" wheel-files.txt || {
              echo "::error::Missing package file '$file'"
              exit 1
            }
          done

      - name: Verify installed wheel capabilities
        run: python tools/ci/check_cli_wheel.py src/vllm-sr/dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: vllm-sr-dist
          path: src/vllm-sr/dist/*
          retention-days: 7

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vllm-sr-dist
          path: dist

      - run: pip install twine

      - name: Publish explicit test package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository testpypi dist/*

  pypi:
    name: Publish to PyPI
    if: >-
      always() && !cancelled()
      && (needs.build.result == 'success' || inputs.prebuilt-dist)
      && (!inputs.qualified-decision || inputs.prebuilt-dist)
      && github.repository == 'vllm-project/semantic-router'
      && github.event_name == 'push'
      && ((inputs.channel == 'dev' && github.ref == 'refs/heads/main')
        || (inputs.channel == 'stable' && startsWith(github.ref, 'refs/tags/v')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the qualified path for Decision-enabled stable source
        if: inputs.channel == 'stable'
        env:
          QUALIFIED_DECISION: ${{ inputs.qualified-decision }}
        run: python tools/ci/decision_release_policy.py --expect "$QUALIFIED_DECISION"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.qualified-decision && format('decision-qualified-dist-{0}-{1}', github.run_id, github.run_attempt) || 'vllm-sr-dist' }}
          path: dist

      - name: Verify qualified source and package content
        if: inputs.prebuilt-dist
        env:
          MODE: ${{ inputs.channel == 'dev' && 'main' || 'release' }}
          TAG: ${{ inputs.tag }}
        run: python tools/ci/package_contract.py --verify-dist --output dist --mode "$MODE" --tag "$TAG"
      - uses: actions/download-artifact@v4
        if: inputs.qualified-decision
        with:
          name: decision-qualified-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-harness/decision-release-evidence
      - name: Verify Decision release evidence against published registry digests
        if: inputs.qualified-decision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/decision-registry-auth.json
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          evidence=.agent-harness/decision-release-evidence
          lock="$evidence/src/vllm-sr/cli/decision_runtime/decision-images.lock.json"
          receipt="$evidence/.agent-harness/decision-rocm/qualification.json"
          rocm_ref="$(cat "$evidence/.agent-harness/decision-release/rocm-ref.txt")"
          python tools/ci/decision_image_lock_release.py validate \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --cpu-digest-file "$evidence/.agent-harness/decision-cpu/published-digest.txt" \
            --rocm-receipt "$receipt" \
            --rocm-published-ref "$rocm_ref" --lock "$lock"
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python tools/ci/decision_image_lock_release.py check-dist \
            --lock "$lock" --wheel "${wheels[0]}" --sdist "${sdists[0]}"
          candidate_ref="$(python3 -c 'import json, sys; from pathlib import Path; print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["candidate_ref"])' "$receipt")"
          python tools/ci/decision_perf_release_gate.py validate \
            --report "$evidence/.agent-harness/decision-performance/report.json" \
            --source-sha "$GITHUB_SHA" \
            --qualification-receipt "$receipt" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --candidate-ref "$candidate_ref" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - run: pip install twine

      - name: Publish verified package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          QUALIFIED_DECISION: ${{ inputs.qualified-decision }}
        run: |
          if [[ "$QUALIFIED_DECISION" == true ]]; then
            twine upload dist/*.whl dist/*.tar.gz
          else
            twine upload dist/*.whl dist/*.tar.gz --skip-existing
          fi
