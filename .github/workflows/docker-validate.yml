name: Images Validation

on:
  workflow_call:
    inputs:
      images:
        description: JSON array of affected image names.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Resolve image definition
        id: definition
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 tools/ci/docker_image_catalog.py "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve build arguments
        id: build-args
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          CARGO_BUILD_JOBS: "8"
          DASHBOARD_VERSION_MODE: pr
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/ci/docker-build-args.sh

      - name: Build affected image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.definition.outputs.context }}
          file: ${{ steps.definition.outputs.dockerfile }}
          platforms: ${{ steps.definition.outputs.platforms }}
          push: false
          load: false
          tags: semantic-router/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-linux-amd64,ignore-error=true
          build-args: ${{ steps.build-args.outputs.args }}
