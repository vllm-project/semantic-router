name: Pre-commit Tooling Image

on:
  pull_request:
    branches: [main]
    paths:
      - tools/docker/Dockerfile.precommit
      - .github/workflows/precommit-publish.yml
  push:
    branches: [main]
    paths:
      - tools/docker/Dockerfile.precommit
      - .github/workflows/precommit-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate pre-commit image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/Dockerfile.precommit
          platforms: linux/amd64
          push: false
          tags: semantic-router/precommit:pr
          cache-from: type=gha,scope=precommit-linux-amd64
          cache-to: type=gha,mode=max,scope=precommit-linux-amd64,ignore-error=true

  publish:
    name: Publish pre-commit image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tooling image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/Dockerfile.precommit
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.owner }}/semantic-router/precommit:latest
          cache-from: type=gha,scope=precommit-publish
          cache-to: type=gha,mode=max,scope=precommit-publish,ignore-error=true
