name: Performance Tests

on:
  workflow_call:
    inputs:
      native-artifact:
        type: string
        default: ""
      verification:
        type: string
        default: ""
      base-ref:
        description: Explicit implementation baseline (required for release comparisons).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  component-benchmarks:
    name: Production Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for baseline comparison

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The paired baseline may rebuild its libraries even when HEAD uses the shared artifact.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            candle-binding/target/
          key: ${{ runner.os }}-perf-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-cargo-

      - name: Cache Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-perf-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-perf-go-

      - name: Cache Models
        uses: actions/cache@v4
        with:
          path: |
            models/
          key: ${{ runner.os }}-models-v1-${{ hashFiles('src/semantic-router/pkg/config/registry.go', 'src/semantic-router/pkg/config/canonical_defaults.go') }}
          restore-keys: |
            ${{ runner.os }}-models-v1-
        continue-on-error: true

      - name: Load shared native libraries
        if: inputs.native-artifact != ''
        uses: ./.github/actions/load-native-artifact
        with:
          artifact: ${{ inputs.native-artifact }}

      - name: Build Rust library (CPU-only)
        if: inputs.native-artifact == ''
        run: make rust-ci

      - name: Install HuggingFace CLI
        run: |
          pip install -U "huggingface_hub[cli]" hf_transfer

      - name: Test benchmark measurement and ownership contracts
        run: make perf-test-unit perf-test-benchmark-contracts

      - name: Measure baseline with identical Vela artifacts
        env:
          HF_HUB_DISABLE_XET: "1"
          PERF_BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: make perf-model-baseline PERF_BASE_REF="$PERF_BASE_REF"

      - name: Run component benchmarks
        id: bench
        run: |
          set -o pipefail
          mkdir -p reports
          export LD_LIBRARY_PATH=${PWD}/candle-binding/target/release:${PWD}/ml-binding/target/release:${PWD}/nlp-binding/target/release
          make perf-bench-quick 2>&1 | tee reports/bench-output.txt

      - name: Run Looper benchmarks
        id: looper
        if: always() # report Looper status even if the component step failed
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH=${PWD}/candle-binding/target/release:${PWD}/ml-binding/target/release:${PWD}/nlp-binding/target/release
          make perf-bench-looper 2>&1 | tee -a reports/bench-output.txt

      - name: Generate current results
        id: current
        run: |
          set -o pipefail
          cd perf && go run cmd/perftest/main.go \
            --parse-bench=../reports/bench-output.txt \
            --output=../reports/current.json

      # Model benchmarks use the measured base implementation with identical
      # artifacts; other components retain their committed baselines. Numeric
      # regressions are advisory; invalid or incomplete comparisons still fail.
      - name: Compare against baseline and report regressions
        id: comparison
        run: |
          cd perf && go run cmd/perftest/main.go \
            --compare-baseline=testdata/baselines/ \
            --model-baseline=../reports/model-baseline.json \
            --current=../reports/current.json \
            --threshold-file=config/thresholds.yaml \
            --output=../reports/comparison.json \
            --inventory=config/benchmark-inventory.json

      - name: Record the complete production benchmark inventory
        if: inputs.verification != ''
        env:
          VERIFICATION: ${{ inputs.verification }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tools/ci/workflow_evidence.py --verification "$VERIFICATION" \
            --benchmarks reports/current.json --inventory perf/config/benchmark-inventory.json \
            --output reports/ci-result.json
      - uses: actions/upload-artifact@v4
        if: inputs.verification != ''
        with:
          name: ci-result-performance
          path: reports/ci-result.json
          if-no-files-found: error

      - name: Parse benchmark results
        id: parse
        if: always()
        continue-on-error: true
        run: |
          echo "benchmarks_completed=${{ steps.bench.outcome == 'success' }}" >> $GITHUB_OUTPUT

      - name: Generate performance summary
        id: summary
        if: always()
        run: |
          mkdir -p reports
          # Per-suite status derived from actual benchmark output:
          # a suite failed if any of its benchmarks printed "--- FAIL:", passed if
          # at least one result line is present, and did not run otherwise.
          suite_status() {
            local prefix="$1"
            if grep -qE "^--- FAIL: ${prefix}" reports/bench-output.txt 2>/dev/null; then
              echo "❌"
            elif grep -qE "^${prefix}" reports/bench-output.txt 2>/dev/null; then
              echo "✅"
            else
              echo "⚠️ not run"
            fi
          }
          # Preserve allocation and timing observations without blocking CI.
          regressions=""
          timing=""
          comparison_status="⚠️ not run"
          if [ "${{ steps.comparison.outcome }}" = "success" ]; then
            jq -e '(.results | type == "array") and (.has_regressions | type == "boolean")' reports/comparison.json > /dev/null
            regressions=$(jq -r '.results[]? | select(.RegressionDetected==true) | "- \(.BenchmarkName): allocs/op \(.Baseline.allocs_per_op // 0)→\(.Current.allocs_per_op // 0) \(if (.Baseline.allocs_per_op // 0) > 0 then "(\(if .AllocsPerOpChange>=0 then "+" else "" end)\(.AllocsPerOpChange|round)%)" else "(new)" end), B/op \(.Baseline.bytes_per_op // 0)→\(.Current.bytes_per_op // 0) \(if (.Baseline.bytes_per_op // 0) > 0 then "(\(if .BytesPerOpChange>=0 then "+" else "" end)\(.BytesPerOpChange|round)%)" else "(new)" end)"' reports/comparison.json)
            timing=$(jq -r '.results[]? | select(.NsAdvisory==true) | "- \(.BenchmarkName): ns/op \(.NsPerOpChange|round)% slower"' reports/comparison.json)
            comparison_status="✅ no allocation regressions beyond thresholds"
            if [ -n "$regressions" ]; then
              comparison_status="⚠️ allocation regressions detected (advisory)"
              echo "::warning::Performance regressions detected; see the performance summary. Numerical regressions do not block CI."
            fi
          elif [ "${{ steps.comparison.outcome }}" = "failure" ]; then
            comparison_status="❌ comparison failed"
          fi
          if [ "${{ steps.bench.outcome }}" != "success" ] || [ "${{ steps.looper.outcome }}" != "success" ] || [ "${{ steps.comparison.outcome }}" != "success" ]; then
            headline="❌ Benchmark execution or comparison **FAILED** — see the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          elif [ -n "$regressions" ]; then
            headline="⚠️ **Performance regressions detected (advisory)** — measurements completed; numerical regressions do not block CI."
          else
            headline="Component benchmarks completed with no allocation regressions beyond thresholds."
          fi
          cat > reports/summary.md <<EOF
          ## Performance Benchmark Results

          ${headline}

          ### Summary
          - Classification benchmarks: $(suite_status BenchmarkClassify)
          - Decision engine benchmarks: $(suite_status BenchmarkEvaluate)
          - Cache benchmarks: $(suite_status BenchmarkCache)
          - Looper family benchmarks: $(suite_status "Benchmark(ReMoM|Fusion|Flow|Base)")
          - Baseline comparison: ${comparison_status}
          - Regression policy: advisory; benchmark execution and complete evidence remain required.
          EOF
          if [ -n "$regressions" ]; then
            { echo ""; echo "### Advisory allocation regressions (allocs/op or B/op over threshold)"; echo "$regressions"; } >> reports/summary.md
          fi
          if [ -n "$timing" ]; then
            { echo ""; echo "### Advisory timing regressions (ns/op)"; echo "$timing"; } >> reports/summary.md
          fi
          cat >> reports/summary.md <<EOF

          ### Details
          See attached benchmark artifacts for detailed results and profiles.

          ---
          _Performance testing powered by [vLLM Semantic Router](https://github.com/vllm-project/semantic-router)_
          EOF
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_number }}
          path: |
            reports/
          retention-days: 30
