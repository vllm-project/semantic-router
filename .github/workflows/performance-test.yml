name: Performance Tests

on:
  workflow_call:
    inputs:
      environment:
        description: Environment adapter from perf/config/perf.yaml.
        type: string
        default: cpu
      profile:
        description: Bounded suite profile from perf/config/perf.yaml.
        type: string
        default: ci
      runner:
        description: GitHub runner label; accelerator workflows provide their own label.
        type: string
        default: ubuntu-latest
      baseline:
        description: Reviewed result set used by the fail-closed comparison.
        type: string
        default: perf/testdata/baselines/cpu-ci.json

permissions:
  contents: read

jobs:
  performance:
    name: ${{ inputs.environment }} / ${{ inputs.profile }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            candle-binding/target
            ml-binding/target
            nlp-binding/target
          key: ${{ runner.os }}-perf-v2-${{ hashFiles('**/go.sum', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-v2-

      - name: Validate performance contract
        run: make perf-validate

      - name: Run fail-closed performance gate
        id: performance
        env:
          PERF_ENV: ${{ inputs.environment }}
          PERF_PROFILE: ${{ inputs.profile }}
          PERF_BASELINE: ${{ github.workspace }}/${{ inputs.baseline }}
          PERF_OUTPUT_DIR: ${{ github.workspace }}/reports/perf/${{ inputs.environment }}-${{ inputs.profile }}
        run: |
          set -o pipefail
          mkdir -p reports
          CI=true make perf-check \
            PERF_ENV="$PERF_ENV" \
            PERF_PROFILE="$PERF_PROFILE" \
            PERF_BASELINE="$PERF_BASELINE" \
            PERF_OUTPUT_DIR="$PERF_OUTPUT_DIR" \
            2>&1 | tee reports/perf-run.log

      - name: Upload performance artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ inputs.environment }}-${{ inputs.profile }}-${{ github.run_number }}
          path: |
            reports/perf-run.log
            reports/perf/${{ inputs.environment }}-${{ inputs.profile }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          REPORT: reports/perf/${{ inputs.environment }}-${{ inputs.profile }}/report.md
        run: |
          if [[ -n "$ARTIFACT_URL" ]]; then
            echo "> **Visual report:** [download the complete HTML, SVG, JSON, and raw logs]($ARTIFACT_URL), then open \`report.html\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Performance report unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "The runner failed before producing a report. Inspect the raw workflow log." >> "$GITHUB_STEP_SUMMARY"
          fi
