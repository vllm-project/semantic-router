name: Moderation Quarantine

# Automatic moderation is intentionally disabled. The previous implementation
# evaluated hidden JavaScript from a secret with write permissions. See TD045.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    name: Reviewed moderation implementation required
    runs-on: ubuntu-latest
    steps:
      - name: Report safe boundary
        run: |
          {
            echo "## Moderation is quarantined"
            echo
            echo "No content was analyzed or mutated."
            echo "A reviewed detector or GitHub App is required before re-enabling automation."
            echo "See tools/agent/docs/tech-debt/td-045-reviewed-content-moderation.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Moderation remains disabled pending TD045."
