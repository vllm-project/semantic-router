name: Operator Tests

on:
  workflow_call:
    inputs:
      verification:
        type: string
        default: '{}'
      run_integration:
        description: Run operator Kind integration coverage.
        required: false
        default: true
        type: boolean
      integration_matrix:
        description: JSON array of operator integration matrix objects.
        required: false
        default: >-
          [{"cache-backend":"memory","deploy-redis":false,
          "deploy-milvus":false,"deploy-qdrant":false,
          "router-name":"test-router"}]
        type: string

permissions:
  contents: read
  actions: read

env:
  GO_VERSION: '1.25'
  # Pipe falls back to direct on any proxy error; comma only on 404 and 410
  GOPROXY: 'https://proxy.golang.org|direct'

jobs:
  bundle-image:
    name: Bundle Image
    runs-on: ${{ fromJSON(inputs.verification).runner }}
    steps:
      - name: Record Runner Environment
        working-directory: ${{ github.workspace }}
        env:
          OBSERVED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: echo "CI_RUNNER_ENVIRONMENT=$OBSERVED_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Load validated bundle image
        uses: ./.github/actions/load-ci-images
        with:
          images: '["operator-bundle"]'
      - name: Inspect shared bundle image
        run: docker image inspect "$E2E_PREBUILT_OPERATOR_BUNDLE_IMAGE"
      - name: Preserve consumed bundle identity
        run: cp "$CI_IMAGE_RECEIPTS" artifacts.json
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: operator-bundle
          path: artifacts.json
          if-no-files-found: error

  integration-test:
    name: Routed Requests
    if: ${{ !cancelled() && inputs.run_integration && needs.bundle-image.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.verification).runner }}
    timeout-minutes: 30
    needs: [bundle-image]
    strategy:
      fail-fast: false
      matrix:
        cache-backend: ${{ fromJSON(inputs.integration_matrix).*.cache-backend }}
    steps:
      - name: Record Runner Environment
        working-directory: ${{ github.workspace }}
        env:
          OBSERVED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: echo "CI_RUNNER_ENVIRONMENT=$OBSERVED_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Kind
        uses: ./.github/actions/setup-kind

      - name: Install kubectl
        run: |
          source tools/ci/retry.sh

          install_kubectl() {
            curl -fsSLO "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl" &&
              chmod +x kubectl &&
              sudo mv kubectl /usr/local/bin/kubectl
          }

          retry_run 3 10 install_kubectl

      - name: Create kind cluster
        run: |
          source tools/ci/retry.sh

          cluster="operator-test-${{ matrix.cache-backend }}"
          config="$(mktemp)"
          printf '%s\n' \
            'kind: Cluster' \
            'apiVersion: kind.x-k8s.io/v1alpha4' \
            'nodes:' \
            '- role: control-plane' >"${config}"

          delete_cluster() {
            kind delete cluster --name "${cluster}" >/dev/null 2>&1 || true
          }

          create_cluster() {
            kind create cluster --name "${cluster}" --image "${KIND_NODE_IMAGE}" --config "${config}" &&
              kubectl cluster-info &&
              kubectl get nodes
          }

          RETRY_CLEANUP=delete_cluster retry_run 2 60 create_cluster

      - name: Install Gateway API CRDs
        run: |
          source tools/ci/retry.sh

          install_crds() {
            kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml
          }

          retry_run 3 15 install_crds

          kubectl wait --for condition=established --timeout=60s crd/gateways.gateway.networking.k8s.io
          kubectl wait --for condition=established --timeout=60s crd/httproutes.gateway.networking.k8s.io

      - name: Deploy Redis
        if: matrix.cache-backend == 'redis'
        run: |
          echo "Deploying Redis..."
          kubectl create namespace cache-backends || true

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
            namespace: cache-backends
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis
            template:
              metadata:
                labels:
                  app: redis
              spec:
                containers:
                - name: redis
                  image: redis/redis-stack-server:latest
                  env:
                  - name: REDIS_ARGS
                    value: "--requirepass testpassword"
                  readinessProbe:
                    exec:
                      command: ["redis-cli", "-a", "testpassword", "ping"]
                    periodSeconds: 2
                    failureThreshold: 30
                  ports:
                  - containerPort: 6379
                    name: redis
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
            namespace: cache-backends
          spec:
            selector:
              app: redis
            ports:
            - port: 6379
              targetPort: 6379
              name: redis
          EOF

          kubectl wait --for=condition=available --timeout=120s deployment/redis -n cache-backends
          echo "Redis deployed successfully"

      - name: Deploy Milvus
        if: (matrix.cache-backend == 'milvus' || matrix.cache-backend == 'hybrid')
        run: |
          echo "Deploying Milvus Standalone..."
          kubectl create namespace cache-backends || true

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: milvus-standalone
            namespace: cache-backends
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: milvus-standalone
            template:
              metadata:
                labels:
                  app: milvus-standalone
              spec:
                containers:
                - name: milvus
                  image: milvusdb/milvus:v2.4.0
                  command:
                  - milvus
                  - run
                  - standalone
                  env:
                  - name: ETCD_USE_EMBED
                    value: "true"
                  - name: COMMON_STORAGETYPE
                    value: local
                  ports:
                  - containerPort: 19530
                    name: milvus
                  - containerPort: 9091
                    name: metrics
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: 2000m
                      memory: 2Gi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: milvus-standalone
            namespace: cache-backends
          spec:
            selector:
              app: milvus-standalone
            ports:
            - port: 19530
              targetPort: 19530
              name: milvus
            - port: 9091
              targetPort: 9091
              name: metrics
          EOF

          kubectl wait --for=condition=available --timeout=180s deployment/milvus-standalone -n cache-backends
          echo "Milvus deployed successfully"
          sleep 10

      - name: Deploy Qdrant
        if: matrix.cache-backend == 'qdrant'
        run: |
          echo "Deploying Qdrant..."
          kubectl create namespace cache-backends || true

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: qdrant
            namespace: cache-backends
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: qdrant
            template:
              metadata:
                labels:
                  app: qdrant
              spec:
                containers:
                - name: qdrant
                  image: qdrant/qdrant:latest
                  ports:
                  - containerPort: 6333
                    name: rest
                  - containerPort: 6334
                    name: grpc
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: 1000m
                      memory: 1Gi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: qdrant
            namespace: cache-backends
          spec:
            selector:
              app: qdrant
            ports:
            - port: 6333
              targetPort: 6333
              name: rest
            - port: 6334
              targetPort: 6334
              name: grpc
          EOF

          kubectl wait --for=condition=available --timeout=120s deployment/qdrant -n cache-backends
          echo "Qdrant deployed successfully"

      - name: Create cache credentials secrets
        if: matrix.cache-backend == 'redis' || (matrix.cache-backend == 'milvus' || matrix.cache-backend == 'hybrid')
        run: |
          kubectl create namespace semantic-router-test || true

          if [ "${{ matrix.cache-backend == 'redis' }}" == "true" ]; then
            kubectl create secret generic redis-credentials \
              --from-literal=password=testpassword \
              -n semantic-router-test
          fi

          if [ "${{ matrix.cache-backend == 'milvus' || matrix.cache-backend == 'hybrid' }}" == "true" ]; then
            kubectl create secret generic milvus-credentials \
              --from-literal=password=Milvus \
              -n semantic-router-test
          fi

      - name: Load verified operator and request-path images
        uses: ./.github/actions/load-ci-images
        with:
          images: '["operator","vllm-sr","provider-mocker"]'
      - name: Assign verified local tags
        run: |
          docker tag "$E2E_PREBUILT_OPERATOR_IMAGE" semantic-router-operator:test
          docker tag "$E2E_PREBUILT_EXT_PROC_IMAGE" semantic-router-vllm-sr:test
          docker tag "$E2E_PREBUILT_PROVIDER_MOCKER_IMAGE" semantic-router-operator-mock:test
      - name: Deploy request-observing backend
        run: |
          kind load docker-image semantic-router-operator-mock:test --name operator-test-${{ matrix.cache-backend }}
          kubectl create namespace semantic-router-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n semantic-router-test create deployment operator-mock --image=semantic-router-operator-mock:test --port=8000 --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n semantic-router-test patch deployment operator-mock -p '{"spec":{"template":{"spec":{"containers":[{"name":"semantic-router-operator-mock","imagePullPolicy":"Never"}]}}}}'
          kubectl -n semantic-router-test expose deployment operator-mock --port=8000 --target-port=8000 --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n semantic-router-test rollout status deployment/operator-mock --timeout=120s

      - name: Verify operator image loaded
        run: |
          echo "Verifying operator image is available..."
          docker images | grep semantic-router-operator || {
            echo "ERROR: semantic-router-operator:test image not found!"
            echo "Available images:"
            docker images
            exit 1
          }

      - name: Load operator image into kind
        run: kind load docker-image semantic-router-operator:test --name operator-test-${{ matrix.cache-backend }}

      - name: Verify operator image in kind
        run: |
          echo "Verifying operator image is available in kind cluster..."
          docker exec operator-test-${{ matrix.cache-backend }}-control-plane crictl images | grep semantic-router-operator || {
            echo "ERROR: semantic-router-operator:test image not found in kind!"
            echo "Available images in kind:"
            docker exec operator-test-${{ matrix.cache-backend }}-control-plane crictl images
            exit 1
          }

      - name: Verify router image loaded
        run: |
          echo "Verifying router image is available..."
          docker images | grep semantic-router-vllm-sr || {
            echo "ERROR: semantic-router-vllm-sr:test image not found!"
            echo "Available images:"
            docker images
            exit 1
          }

      - name: Load router image into kind
        run: kind load docker-image semantic-router-vllm-sr:test --name operator-test-${{ matrix.cache-backend }}

      - name: Verify router image in kind
        run: |
          echo "Verifying router image is available in kind cluster..."
          docker exec operator-test-${{ matrix.cache-backend }}-control-plane crictl images | grep semantic-router-vllm-sr || {
            echo "ERROR: semantic-router-vllm-sr:test image not found in kind!"
            echo "Available images in kind:"
            docker exec operator-test-${{ matrix.cache-backend }}-control-plane crictl images
            exit 1
          }

      - name: Install CRDs
        run: |
          cd deploy/operator
          make install

      - name: Deploy operator
        run: |
          cd deploy/operator
          # Update image in kustomization
          cd config/manager
          kustomize edit set image controller=semantic-router-operator:test
          cd ../..
          # Deploy operator
          make deploy IMG=semantic-router-operator:test

      - name: Wait for operator deployment to be created
        run: |
          echo "Waiting for operator deployment to be created..."
          for i in {1..30}; do
            DEPLOYMENT=$(kubectl get deployment -n semantic-router-operator-system -l control-plane=controller-manager -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$DEPLOYMENT" ]; then
              echo "Found deployment: $DEPLOYMENT"
              echo "OPERATOR_DEPLOYMENT=$DEPLOYMENT" >> $GITHUB_ENV
              break
            fi
            echo "Waiting for deployment creation... (attempt $i/30)"
            sleep 2
          done
          if [ -z "$DEPLOYMENT" ]; then
            echo "ERROR: Deployment not found after 60 seconds"
            kubectl get all -n semantic-router-operator-system
            exit 1
          fi

      - name: Wait for operator deployment to be ready
        run: |
          kubectl wait --for=condition=available --timeout=120s \
            deployment/${{ env.OPERATOR_DEPLOYMENT }} \
            -n semantic-router-operator-system

      - name: Check operator logs
        if: always()
        run: |
          echo "=== Operator Logs ==="
          # Try to get deployment name from env, fallback to label selector
          DEPLOYMENT="${{ env.OPERATOR_DEPLOYMENT }}"
          if [ -z "$DEPLOYMENT" ]; then
            DEPLOYMENT=$(kubectl get deployment -n semantic-router-operator-system -l control-plane=controller-manager -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          fi
          if [ -n "$DEPLOYMENT" ]; then
            kubectl logs -n semantic-router-operator-system \
              deployment/$DEPLOYMENT \
              --all-containers --tail=100 || true
          else
            echo "Could not find operator deployment"
            kubectl get all -n semantic-router-operator-system || true
          fi

      - name: Create test namespace
        run: |
          kubectl create namespace semantic-router-test || true

      - name: Create test SemanticRouter CR
        run: |
          # Generate base CR configuration
          CACHE_CONFIG=""

          case "${{ matrix.cache-backend }}" in
            memory)
              CACHE_CONFIG='
              semantic_cache:
                enabled: true
                backend_type: "memory"
                embedding_model: "mmbert"
                max_entries: 100'
              ;;
            redis)
              CACHE_CONFIG='
              semantic_cache:
                enabled: true
                backend_type: "redis"
                similarity_threshold: "0.85"
                ttl_seconds: 3600
                embedding_model: "mmbert"
                redis:
                  connection:
                    host: redis.cache-backends.svc.cluster.local
                    port: 6379
                    database: 0
                    password_secret_ref:
                      name: redis-credentials
                      key: password
                    timeout: 30
                    tls:
                      enabled: false
                  index:
                    name: semantic_cache_idx
                    prefix: "cache:"
                    vector_field:
                      name: embedding
                      dimension: 384
                      metric_type: COSINE
                    index_type: HNSW
                    params:
                      M: 16
                      efConstruction: 64
                  search:
                    topk: 1
                  development:
                    drop_index_on_startup: false
                    auto_create_index: true'
              ;;
            milvus)
              CACHE_CONFIG='
              semantic_cache:
                enabled: true
                backend_type: "milvus"
                similarity_threshold: "0.90"
                ttl_seconds: 7200
                embedding_model: "mmbert"
                milvus:
                  connection:
                    host: milvus-standalone.cache-backends.svc.cluster.local
                    port: 19530
                    database: semantic_router_cache
                    timeout: 30
                    auth:
                      enabled: true
                      username: root
                      password_secret_ref:
                        name: milvus-credentials
                        key: password
                    tls:
                      enabled: false
                  collection:
                    name: semantic_cache
                    description: "Semantic cache for LLM responses"
                    vector_field:
                      name: embedding
                      dimension: 384
                      metric_type: IP
                    index:
                      type: HNSW
                      params:
                        M: 16
                        efConstruction: 64
                  search:
                    params:
                      ef: 64
                    topk: 10
                    consistency_level: Session
                  development:
                    drop_collection_on_startup: false
                    auto_create_collection: true'
              ;;
            qdrant)
              CACHE_CONFIG='
              semantic_cache:
                enabled: true
                backend_type: "qdrant"
                similarity_threshold: "0.90"
                ttl_seconds: 7200
                embedding_model: "mmbert"
                qdrant:
                  host: qdrant.cache-backends.svc.cluster.local
                  port: 6334
                  api_key: ""
                  use_tls: false
                  collection_name: semantic_cache
                  connect_timeout: 10'
              ;;
            hybrid)
              CACHE_CONFIG='
              semantic_cache:
                enabled: true
                backend_type: "hybrid"
                similarity_threshold: "0.85"
                ttl_seconds: 3600
                max_entries: 5000
                eviction_policy: lru
                embedding_model: "mmbert"
                hnsw:
                  use_hnsw: true
                  hnsw_m: 32
                  hnsw_ef_construction: 128
                  max_memory_entries: 5000
                milvus:
                  connection:
                    host: milvus-standalone.cache-backends.svc.cluster.local
                    port: 19530
                    database: semantic_router_cache
                    timeout: 30
                    auth:
                      enabled: true
                      username: root
                      password_secret_ref:
                        name: milvus-credentials
                        key: password
                    tls:
                      enabled: false
                  collection:
                    name: semantic_cache_hybrid
                    description: "Hybrid cache backend storage"
                    vector_field:
                      name: embedding
                      dimension: 384
                      metric_type: IP
                    index:
                      type: HNSW
                      params:
                        M: 32
                        efConstruction: 128
                  search:
                    params:
                      ef: 128
                    topk: 20
                    consistency_level: Eventually
                  development:
                    drop_collection_on_startup: false
                    auto_create_collection: true'
              ;;
            *)
              echo "Unsupported operator cache backend: ${{ matrix.cache-backend }}" >&2
              exit 1
              ;;
          esac

          cat <<EOF | kubectl apply -f -
          apiVersion: vllm.ai/v1alpha1
          kind: SemanticRouter
          metadata:
            name: test-router-${{ matrix.cache-backend }}
            namespace: semantic-router-test
          spec:
            replicas: 1
            vllmEndpoints:
              - name: operator-mock
                model: operator-ci-model
                backend:
                  type: service
                  service:
                    name: operator-mock
                    namespace: semantic-router-test
                    port: 8000
                weight: 1
            image:
              repository: semantic-router-vllm-sr
              tag: test
              pullPolicy: Never
            service:
              type: ClusterIP
              grpc:
                port: 50051
                targetPort: 50051
              api:
                port: 8080
                targetPort: 8080
            resources:
              limits:
                memory: "8Gi"
                cpu: "4000m"
              requests:
                memory: "4Gi"
                cpu: "2000m"
            persistence:
              enabled: false
            startupProbe:
              enabled: true
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
            config:
              routing:
                strategy: priority
                decisions:
                  - name: operator_ci_route
                    rules:
                      operator: AND
                    modelRefs:
                      - model: operator-ci-model
                        use_reasoning: false
              embedding_models:
                mmbert_model_path: "models/Vela-1.0-Encoder-307M-Embedding"
                use_cpu: true
                embedding_config:
                  model_type: "mmbert"
                  preload_embeddings: true
                  enable_soft_matching: true
                  min_score_threshold: "0.6"
          ${CACHE_CONFIG}
              tools:
                enabled: false
              prompt_guard:
                enabled: false
              # Domain and PII inherit the operator's canonical Vela CPU defaults.
              api:
                batch_classification:
                  max_batch_size: 50
                  metrics:
                    enabled: true
              observability:
                tracing:
                  enabled: false
          EOF

      - name: Wait for SemanticRouter deployment to be created
        run: |
          echo "Waiting for deployment to be created..."
          for i in {1..30}; do
            if kubectl get deployment test-router-${{ matrix.cache-backend }} -n semantic-router-test 2>/dev/null; then
              echo "Deployment found!"
              break
            fi
            echo "Waiting for deployment creation... (attempt $i/30)"
            sleep 2
          done

      - name: Verify resources created
        run: |
          echo "=== Checking Deployment ==="
          kubectl get deployment test-router-${{ matrix.cache-backend }} -n semantic-router-test -o yaml || true

          echo "=== Checking Service ==="
          kubectl get service test-router-${{ matrix.cache-backend }} -n semantic-router-test || true

          echo "=== Checking ConfigMap ==="
          kubectl get configmap -n semantic-router-test || true

          echo "=== Checking ServiceAccount ==="
          kubectl get serviceaccount -n semantic-router-test || true

          echo "=== Checking Pods ==="
          kubectl get pods -n semantic-router-test || true

      - name: Wait for semantic router pod to start
        run: |
          echo "Waiting for pod to be created..."
          for i in {1..60}; do
            POD_NAME=$(kubectl get pods -n semantic-router-test -l app.kubernetes.io/instance=test-router-${{ matrix.cache-backend }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$POD_NAME" ]; then
              echo "Pod $POD_NAME found!"
              break
            fi
            echo "Waiting for pod creation... (attempt $i/60)"
            sleep 2
          done

      - name: Wait for semantic router pod to be ready
        run: |
          echo "Waiting for pod to be ready (downloading models may take several minutes)..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/instance=test-router-${{ matrix.cache-backend }} \
            -n semantic-router-test \
            --timeout=300s || {
              echo "Pod failed to become ready within 5 minutes"
              echo "=== Pod Status ==="
              kubectl get pods -n semantic-router-test -o wide
              echo "=== Pod Events ==="
              kubectl get events -n semantic-router-test --sort-by='.lastTimestamp'
              echo "=== Pod Logs ==="
              POD_NAME=$(kubectl get pods -n semantic-router-test -l app.kubernetes.io/instance=test-router-${{ matrix.cache-backend }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
              if [ -n "$POD_NAME" ]; then
                kubectl logs $POD_NAME -n semantic-router-test --all-containers --tail=100 || true
              fi
              exit 1
            }

      - name: Check semantic router pod status
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n semantic-router-test -o wide || true

          echo "=== Pod Events ==="
          kubectl get events -n semantic-router-test --sort-by='.lastTimestamp' || true

      - name: Get semantic router logs
        if: always()
        run: |
          POD_NAME=$(kubectl get pods -n semantic-router-test -l app.kubernetes.io/instance=test-router-${{ matrix.cache-backend }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$POD_NAME" ]; then
            echo "=== Semantic Router Pod Logs ==="
            kubectl logs $POD_NAME -n semantic-router-test --all-containers --tail=200 || true
          else
            echo "No pod found to get logs from"
          fi

      - name: Verify deployment reconciliation
        run: |
          echo "=== Checking SemanticRouter Status ==="
          kubectl get semanticrouter test-router-${{ matrix.cache-backend }} -n semantic-router-test -o yaml || true

          echo "=== Verifying Deployment Exists ==="
          if kubectl get deployment test-router-${{ matrix.cache-backend }} -n semantic-router-test; then
            echo "✓ Deployment successfully created by operator"
          else
            echo "✗ Deployment not found"
            exit 1
          fi

          echo "=== Verifying Service Exists ==="
          if kubectl get service test-router-${{ matrix.cache-backend }} -n semantic-router-test; then
            echo "✓ Service successfully created by operator"
          else
            echo "✗ Service not found"
            exit 1
          fi

      - name: Verify a routed request through reconciled Envoy and backend
        env:
          ROUTER_NAME: test-router-${{ matrix.cache-backend }}
        run: |
          kubectl -n semantic-router-test port-forward "service/$ROUTER_NAME" 18801:8801 > /tmp/operator-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          python3 tools/ci/check_operator_request.py --url http://127.0.0.1:18801 --model operator-ci-model --output operator-request.json
      - name: Preserve consumed request-path image identities
        if: always()
        run: cp "$CI_IMAGE_RECEIPTS" artifacts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: operator-request-${{ matrix.cache-backend }}
          path: |
            operator-request.json
            artifacts.json
          if-no-files-found: error

      - name: Upload operator logs
        if: always()
        run: |
          mkdir -p /tmp/operator-logs
          # Try to get deployment name from env, fallback to label selector
          DEPLOYMENT="${{ env.OPERATOR_DEPLOYMENT }}"
          if [ -z "$DEPLOYMENT" ]; then
            DEPLOYMENT=$(kubectl get deployment -n semantic-router-operator-system -l control-plane=controller-manager -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          fi
          if [ -n "$DEPLOYMENT" ]; then
            kubectl logs -n semantic-router-operator-system \
              deployment/$DEPLOYMENT \
              --all-containers > /tmp/operator-logs/operator.log || true
          fi

          POD_NAME=$(kubectl get pods -n semantic-router-test -l app.kubernetes.io/instance=test-router-${{ matrix.cache-backend }} -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$POD_NAME" ]; then
            kubectl logs $POD_NAME -n semantic-router-test --all-containers > /tmp/operator-logs/semantic-router.log || true
          fi

          kubectl get all -n semantic-router-test -o yaml > /tmp/operator-logs/resources.yaml || true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: operator-integration-logs-${{ matrix.cache-backend }}
          path: /tmp/operator-logs/
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          kind delete cluster --name operator-test-${{ matrix.cache-backend }} || true

  result:
    name: Results
    if: always() && inputs.verification != '{}'
    needs: [bundle-image, integration-test]
    runs-on: ${{ fromJSON(inputs.verification).runner }}
    steps:
      - name: Record Runner Environment
        working-directory: ${{ github.workspace }}
        env:
          OBSERVED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: echo "CI_RUNNER_ENVIRONMENT=$OBSERVED_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install receipt dependencies
        run: python3 -m pip install PyYAML==6.0.3
      - uses: actions/download-artifact@v4
        with:
          pattern: operator-*
          path: operator-evidence
      - name: Validate every selected variant and prerequisite
        env:
          VERIFICATION: ${{ inputs.verification }}
          VARIANTS: ${{ inputs.integration_matrix }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 tools/ci/deployment_test_results.py operator --directory operator-evidence --variants "$VARIANTS" --jobs "$JOB_RESULTS" --output operator-evidence.json
          python3 tools/ci/ci_results.py record --verification "$VERIFICATION" --evidence operator-evidence.json --output operator-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: ci-result-${{ fromJSON(inputs.verification).id }}
          path: operator-result.json
          if-no-files-found: error
