name: PR CI Status

on:
  workflow_run:
    workflows: [Pull Request, Community]
    types: [in_progress, completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Pull Request workflow run to reconcile against the current PR revision.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-pr:
    name: Publish Pull Request qualification status
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.path == '.github/workflows/pr.yml'
      && github.event.workflow_run.event == 'pull_request'
    # A Pull Request event already identifies the qualification run. Use the
    # same lock as Community recovery and /ci run before resolving its identity.
    concurrency:
      group: ci-status-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the trusted status publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the current qualification run
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/pr_ci_status.py --resolve-event --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
      - name: Reconcile the current run and update PR guidance
        if: >-
          steps.qualification.outputs.mode == 'publish'
          && steps.qualification.outputs.run_id == format('{0}', github.event.workflow_run.id)
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.qualification.outputs.run_id }}
          STATUS_MODE: ${{ steps.qualification.outputs.mode }}
        run: python3 tools/ci/pr_ci_status.py --event "$GITHUB_EVENT_PATH" --run-id "$QUALIFICATION_RUN_ID" --mode "$STATUS_MODE"

  resolve:
    name: Resolve qualification identity
    # Only successful PR-related Community completions can restore a pending Gate.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.path == '.github/workflows/community.yml'
        && github.event.action == 'completed'
        && github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.event == 'pull_request'
          || github.event.workflow_run.event == 'pull_request_review'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.qualification.outputs.run_id }}
      mode: ${{ steps.qualification.outputs.mode }}
    steps:
      - name: Check out the trusted resolver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the current qualification run
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/pr_ci_status.py --resolve-event --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  publish:
    name: Publish PR qualification status
    needs: resolve
    if: >-
      needs.resolve.outputs.run_id != ''
      && (github.event_name == 'workflow_run'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    concurrency:
      group: ci-status-${{ needs.resolve.outputs.run_id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write
      issues: write
      # PR guidance uses /issues APIs but still writes to a PR resource.
      pull-requests: write
    steps:
      - name: Check out the trusted status publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconcile the current run and update PR guidance
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          STATUS_MODE: ${{ needs.resolve.outputs.mode }}
        run: python3 tools/ci/pr_ci_status.py --event "$GITHUB_EVENT_PATH" --run-id "$QUALIFICATION_RUN_ID" --mode "$STATUS_MODE"
