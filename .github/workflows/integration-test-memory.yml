name: Integration Test [Memory]
on:
  workflow_call:

permissions:
  contents: read

jobs:
  memory-integration-test:
    name: Memory Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VLLM_SR_TEST_OUTPUT_DIR: ${{ github.workspace }}/.agent-harness/memory
      MEMORY_OUTPUT_DIR: ${{ github.workspace }}/.agent-harness/memory

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # NOTE: Model storage setup skipped - using echo backend for memory tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Free up disk space for large Docker build (CUDA + PyTorch dependencies)
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          show-usage: "true"

      - name: Pre-pull Milvus image
        run: docker pull milvusdb/milvus:v2.3.3

      - name: Run memory integration tests
        run: |
          USE_DETERMINISTIC_MEMORY_EMBEDDINGS=0 \
          HF_DOWNLOAD_ATTEMPTS=10 \
            make memory-test-integration DOCKER_TAG=ci VLLM_SR_IMAGE=vllm-sr:ci

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-test-logs
          path: |
            ${{ env.MEMORY_OUTPUT_DIR }}/command.log
            ${{ env.MEMORY_OUTPUT_DIR }}/logs/
            ${{ env.MEMORY_OUTPUT_DIR }}/serve.log
          include-hidden-files: true
          retention-days: 7
