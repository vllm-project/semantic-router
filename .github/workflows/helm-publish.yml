name: Helm Publisher

on:
  workflow_call:
    inputs:
      mode:
        description: One of main, nightly, or release.
        required: true
        type: string
      version:
        description: Release version without a leading v.
        required: false
        default: ""
        type: string
      tag:
        description: Release image tag with a leading v.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  HELM_VERSION: v3.14.0
  CHART_PATH: deploy/helm/semantic-router
  REGISTRY: ghcr.io

jobs:
  package:
    name: Validate and package Helm
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.package.outputs.chart }}
      version: ${{ steps.versions.outputs.chart_version }}
      app_version: ${{ steps.versions.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Resolve chart versions
        id: versions
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$MODE" in
            release)
              if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] ||
                 [[ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]]; then
                echo "::error::Release Helm inputs do not match"
                exit 1
              fi
              CHART_VERSION="$RELEASE_VERSION"
              APP_VERSION="$RELEASE_TAG"
              ;;
            nightly)
              DATE="$(date -u +'%Y%m%d')"
              CHART_VERSION="0.0.0-nightly.${DATE}"
              APP_VERSION="nightly-${DATE}"
              ;;
            main)
              CHART_VERSION="0.0.0-latest"
              APP_VERSION="latest"
              ;;
            *)
              echo "::error::Unsupported Helm publication mode '$MODE'"
              exit 1
              ;;
          esac
          {
            echo "chart_version=$CHART_VERSION"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint "${{ env.CHART_PATH }}"

      - name: Package chart
        id: package
        run: |
          helm package -u "${{ env.CHART_PATH }}" \
            --version "${{ steps.versions.outputs.chart_version }}" \
            --app-version "${{ steps.versions.outputs.app_version }}" \
            --destination .
          echo "chart=$(ls semantic-router-*.tgz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ github.run_id }}
          path: ${{ steps.package.outputs.chart }}
          retention-days: 1

  publish:
    name: Publish Helm to GHCR
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart-${{ github.run_id }}

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish chart
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login "${{ env.REGISTRY }}" \
              -u "${{ github.actor }}" --password-stdin
          helm push "${{ needs.package.outputs.chart }}" \
            "oci://${{ env.REGISTRY }}/${OWNER}/charts"
          helm registry logout "${{ env.REGISTRY }}"
