    open-pull-requests-limit: 0
    groups:
      website-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /src/semantic-router
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      router-go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /perf
