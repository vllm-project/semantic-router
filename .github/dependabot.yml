        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /src/vllm-sr
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      cli-python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tools/mock-vllm
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      mock-vllm-python-security:
        applies-to: security-updates
