name: Bug Report
description: Report reproducible behavior for Maintainer triage
labels: ["bug", "needs-acceptance"]
title: "bug: <title>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The report enters `needs-acceptance` so a
        Maintainer can confirm ownership, impact, and supported behavior before
        implementation begins.
  - type: dropdown
    id: workgroup
    attributes:
      label: Proposed Workgroup
      description: Select the single direction that appears to own the affected behavior.
      options:
        - MoM & Routing Intelligence
        - Router Models, Runtime & Ecosystem
        - Data Plane & Deployment
        - Platform & Operations
        - Quality & Release
        - Developer Experience & Community
        - Unsure / Maintainer triage
    validations:
      required: true
  - type: textarea
    id: bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Provide the smallest reproducible steps, configuration, and environment.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the supported behavior you expected.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and is there a safe workaround?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, or other relevant context without secrets.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Reactions help show impact but do not grant acceptance, priority,
        assignment, or release commitment.
