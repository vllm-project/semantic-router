version: v0.4
listeners:
- address: 0.0.0.0
  name: http-8899
  port: 8899
  timeout: 300s
models:
- name: qwen3-8b
  card:
    aliases:
    - qwen3-routing
    param_size: 8B
    context_window_size: 32768
    description: Fast general-purpose chat and tool model.
    capabilities:
    - chat
    - reasoning
    - tools
    - ar
    reasoning:
      type: chat_template_kwargs
      efforts:
      - medium
    modality: ar
    quality_score: 0.78
    tags:
    - local
    - fast
  connections:
  - provider: vllm
    interface: chat
    endpoint: http://127.0.0.1:8000/v1
    model: qwen3-8b-instruct
    weight: '80'
  - provider: openai-compatible
    endpoint: https://api.example.com/v1
    model: qwen3-8b-instruct
    credential: reference_api_key
    weight: '20'
  runtime:
    max_retries: 2
    request_timeout: 180s
    stream_timeout: 900s
  pricing:
    input_cost_per_million_tokens: '0.18'
    output_cost_per_million_tokens: '0.42'
    cache_read_cost_per_million_tokens: '0.04'
    cache_write_cost_per_million_tokens: '0.225'
- name: qwen3-32b
  card:
    description: High-capacity reasoning and long-context model.
    capabilities:
    - chat
    - reasoning
    - long-context
    - ar
    reasoning:
      type: reasoning_effort
      efforts:
      - high
      - medium
    loras:
    - computer-science-expert
    modality: ar
  connections:
  - provider: anthropic-compatible
    endpoint: http://127.0.0.1:8001
    model: qwen3-32b-instruct
    weight: '100'
  pricing:
    input_cost_per_million_tokens: '1.2'
    output_cost_per_million_tokens: '3.4'
    cache_read_cost_per_million_tokens: '0.3'
- name: llava-omni
  card:
    aliases:
    - llava-omni-preview
    capabilities:
    - chat
    - vision
    - multimodal
    - omni
    modality: omni
  connections:
  - provider: vllm
    endpoint: http://127.0.0.1:8002/v1
    model: llava-omni-preview
    weight: '100'
  pricing:
    input_cost_per_million_tokens: '2.5'
    output_cost_per_million_tokens: '4'
    cache_read_cost_per_million_tokens: '0.5'
- name: sdxl-image
  card:
    aliases:
    - gpt-image-1
    capabilities:
    - image_generation
    - diffusion
    modality: diffusion
  connections:
  - provider: vllm
    endpoint: http://127.0.0.1:8003/v1
    model: sdxl-image
    weight: '100'
  pricing:
    input_cost_per_million_tokens: '4'
    output_cost_per_million_tokens: '4'
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      classifiers:
      - description: Generic binary safety classification head.
        labels:
        - SAFE
        - JAILBREAK
        model_path: models/mmbert32k-jailbreak-detector-merged
        name: generic-safety-score
        type: local
        use_cpu: true
      - description: Prompted tool execution risk labeler.
        instructions: Choose RISKY only for destructive, privileged, or irreversible
          tool operations.
        labels:
        - SAFE
        - RISKY
        model: external-classifier
        name: tool-risk
        type: llm
      complexity:
      - composer:
          conditions:
          - name: long_context
            type: context
          - name: computer science
            type: domain
          operator: OR
        description: Escalate multi-step reasoning or synthesis-heavy prompts.
        easy:
          candidates:
          - answer briefly
          - quick summary
          - simple rewrite
          image_candidates:
          - make a simple icon
        hard:
          candidates:
          - solve this step by step
          - compare multiple tradeoffs
          - analyze the root cause
          image_candidates:
          - generate a detailed architecture diagram
        name: needs_reasoning
        threshold: 0.75
      context:
      - description: Requests that need larger effective context windows.
        max_tokens: 256K
        min_tokens: 32K
        name: long_context
      conversation:
      - description: At least two user messages.
        feature:
          source:
            role: user
            type: message
          type: count
        name: multi_turn_user
        predicate:
          gte: 2
      - description: Request defines at least one tool.
        feature:
          source:
            type: tool_definition
          type: count
        name: has_tools
        predicate:
          gte: 1
      - description: Tool-result continuation inside an agent loop.
        feature:
          source:
            type: active_tool_loop
          type: exists
        name: active_tool_use
      - description: Request contains a developer message.
        feature:
          source:
            role: developer
            type: message
          type: exists
        name: has_developer_msg
      - description: Non-user messages exceed threshold.
        feature:
          source:
            role: non_user
            type: message
          type: count
        name: heavy_non_user
        predicate:
          gt: 5
          lte: 99
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: has_images
      domains:
      - description: Business and management related queries.
        mmlu_categories:
        - business
        model_scores:
        - model: qwen3-32b
          score: 0.96
          use_reasoning: true
        name: business
      - description: Legal questions and policy topics.
        mmlu_categories:
        - law
        name: law
      - description: Psychology and mental-health oriented prompts.
        mmlu_categories:
        - psychology
        name: psychology
      - description: Health and medical information requests.
        mmlu_categories:
        - health
        name: health
      - description: Computer science and engineering prompts.
        mmlu_categories:
        - computer science
        name: computer science
      - description: General fallback traffic.
        mmlu_categories:
        - other
        name: other
      embeddings:
      - aggregation_method: max
        candidates:
        - how to configure the system
        - installation guide
        - troubleshooting steps
        - error message explanation
        name: technical_support
        threshold: 0.75
      - aggregation_method: any
        candidates:
        - password reset
        - account settings
        - billing information
        - subscription management
        name: account_management
        threshold: 0.72
      - aggregation_method: max
        candidates:
        - patient symptoms or clinical question
        - medication interaction or dosage question
        - test result interpretation request
        name: clinical_query_intent
        query_modality: text
        threshold: 0.72
      events:
      - action_codes:
        - TXN_DECLINE
        description: Critical payment or transaction events that need incident-grade
          routing.
        event_types:
        - payment_failed
        - transaction_declined
        name: critical_payment_event
        severities:
        - critical
        - high
        temporal: true
      fact_check:
      - description: Prompts with factual claims that should be verified.
        name: needs_fact_check
      - description: Creative prompts that do not need factual verification.
        name: no_fact_check_needed
      jailbreak:
      - benign_patterns:
        - explain the policy
        - summarize the safety rules
        description: Detect common prompt-injection or jailbreak attempts.
        include_history: true
        jailbreak_patterns:
        - ignore previous instructions
        - reveal the hidden prompt
        - jailbreak mode
        method: hybrid
        name: prompt_injection
        threshold: 0.8
      kb:
      - kb: privacy_kb
        match: best
        name: privacy_policy
        target:
          kind: group
          value: privacy_policy
      - kb: privacy_kb
        match: best
        name: security_containment
        target:
          kind: group
          value: security_containment
      - kb: privacy_kb
        match: best
        name: frontier_reasoning
        target:
          kind: group
          value: frontier_reasoning
      - kb: privacy_kb
        match: best
        name: local_standard
        target:
          kind: group
          value: local_standard
      keywords:
      - bm25_threshold: 0.1
        case_sensitive: false
        keywords:
        - code
        - function
        - debug
        - algorithm
        - refactor
        method: bm25
        name: code_keywords
        operator: OR
      - bm25_threshold: 0.1
        case_sensitive: false
        keywords:
        - machine learning
        - model training
        - gradient
        - neural network
        - classifier
        method: bm25
        name: machine_learning
        operator: OR
      - case_sensitive: false
        keywords:
        - urgent
        - immediate
        - asap
        - emergency
        method: ngram
        name: urgent_keywords
        ngram_arity: 3
        ngram_threshold: 0.4
        operator: OR
      - case_sensitive: false
        fuzzy_match: true
        fuzzy_threshold: 82
        keywords:
        - social security
        - credit card
        - password
        - api key
        method: fuzzy
        name: fuzzy_sensitive_keywords
        operator: OR
      language:
      - description: Chinese-language requests.
        name: zh
        threshold: 0
      - description: Spanish-language requests.
        name: es
      metadata:
      - description: Caller explicitly denied remote processing consent.
        key: consent
        name: consent_denied
        predicate:
          equals: denied
      modality:
      - description: Text-only autoregressive requests.
        name: AR
      - description: Image-generation requests.
        name: DIFFUSION
      - description: Requests that need both text and image generation.
        name: BOTH
      pii:
      - description: Sensitive prompts where only low-risk identifiers may pass through.
        include_history: true
        name: restricted_pii
        pii_types_allowed:
        - EMAIL_ADDRESS
        threshold: 0.85
      preferences:
      - description: Users who prefer short, direct responses.
        examples:
        - keep it concise
        - bullet points only
        - answer in one paragraph
        name: terse_answers
        threshold: 0.7
      reasks:
      - description: The current user turn closely repeats the immediately previous
          user turn.
        lookback_turns: 1
        name: likely_dissatisfied
        threshold: 0.8
      - description: The current user turn repeats the last two user turns in a row.
        lookback_turns: 2
        name: persistently_dissatisfied
        threshold: 0.8
      role_bindings:
      - description: Requests from platform administrators.
        name: admin
        role: admin
        subjects:
        - kind: Group
          name: platform-admins
      - description: Requests from paid end users.
        name: premium_user
        role: premium_user
        subjects:
        - kind: Group
          name: premium-tier
      structure:
      - description: Prompts that contain many explicit questions.
        feature:
          source:
            pattern: "[?\uFF1F]"
            type: regex
          type: count
        name: many_questions
        predicate:
          gte: 4
      - description: Prompts with one or fewer explicit questions.
        feature:
          source:
            pattern: "[?\uFF1F]"
            type: regex
          type: count
        name: at_most_one_question
        predicate:
          lte: 1
      - description: Prompts that contain numbered list items such as "1. ..."
        feature:
          source:
            pattern: (?m)^\s*\d+\.\s+
            type: regex
          type: exists
        name: numbered_steps
      - description: Prompts that express an ordered workflow.
        feature:
          source:
            case_sensitive: false
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - "\u9996\u5148"
              - "\u7136\u540E"
            - - "\u5148"
              - "\u518D"
            type: sequence
          type: sequence
        name: first_then_flow
      - description: Prompts with dense explicit constraints relative to multilingual
          text units.
        feature:
          source:
            case_sensitive: false
            keywords:
            - under
            - at most
            - at least
            - within
            - no more than
            - "\u4E0D\u8D85\u8FC7"
            - "\u81F3\u5C11"
            - "\u6700\u591A"
            type: keyword_set
          type: density
        name: constraint_dense
        predicate:
          gt: 0.08
      - description: Prompts with dense output-format directives relative to multilingual
          text units.
        feature:
          source:
            keywords:
            - table
            - bullet
            - json
            - markdown
            - "\u8868\u683C"
            - "\u5217\u8868"
            - JSON
            type: keyword_set
          type: density
        name: format_directive_dense
        predicate:
          gt: 0.08
      - description: Prompts with very low question density relative to multilingual
          text units.
        feature:
          source:
            pattern: "[?\uFF1F]"
            type: regex
          type: density
        name: low_question_density
        predicate:
          lt: 0.05
      - description: Current user turn is at least four thousand UTF-8 bytes.
        feature:
          source:
            type: text_bytes
          type: count
        name: long_current_turn_bytes
        predicate:
          gte: 4000
      user_feedbacks:
      - description: The user indicates the previous answer was incorrect.
        name: wrong_answer
      - description: The user asks for a clearer or more detailed answer.
        name: need_clarification
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 10
        method: threshold_bands
        name: request_band
        outputs:
        - lte: 0.2
          name: support_fast
        - gt: 0.2
          lt: 0.45
          name: support_balanced
        - gte: 0.45
          name: support_escalated
        source: request_difficulty
      partitions:
      - default: technical_support
        members:
        - technical_support
        - account_management
        name: support_intents
        semantics: exclusive
        temperature: 0.3
      scores:
      - inputs:
        - match: 1
          miss: 0
          name: technical_support
          type: embedding
          value_source: confidence
          weight: 0.18
        - name: account_management
          type: embedding
          value_source: confidence
          weight: -0.08
        - name: needs_reasoning:medium
          type: complexity
          weight: 0.18
        - name: needs_reasoning:hard
          type: complexity
          weight: 0.36
        - name: long_context
          type: context
          weight: 0.18
        - name: first_then_flow
          type: structure
          weight: 0.12
        method: weighted_sum
        name: request_difficulty
      - inputs:
        - kb: privacy_kb
          metric: private_vs_public
          type: kb_metric
          value_source: score
          weight: 1
        method: weighted_sum
        name: privacy_kb_bias
    decisions:
    - algorithm:
        type: static
      annotations:
        owner: routing-platform
        policy_class: business
      description: Static fallback for standard business traffic.
      emits:
      - kind: retention
        retention:
          drop: false
          keep_current_model: true
          prefer_prefix_retention: true
          ttl_turns: 4
      name: static_business_route
      candidateIterations:
      - variable: candidate
        source: decision.candidates
        outputs:
        - type: model
          value: candidate
      output_contract: Preserve any explicit user-requested output format exactly.
      plugins:
      - configuration:
          enabled: true
          mode: insert
          system_prompt: You are a senior business consultant. Give practical recommendations
            and clear tradeoffs.
        type: system_prompt
      - configuration:
          enabled: true
          mode: exact_then_semantic
          personalized:
            mode: disabled
          request_controls:
            allowed:
            - no-cache
            - no-store
            - bypass
            - max-age
            - ttl
            enabled: true
            header: x-vsr-cache-control
            max_ttl_seconds: 7200
          revision:
            cache_epoch: 2026-08
            model_revision: model-catalog-v1
            policy_revision: policy-v1
            prompt_revision: prompts-v1
          scope: user
          semantic:
            similarity_threshold: 0.82
          ttl_seconds: 7200
        type: response_cache
      - configuration:
          budget:
            reserve_output_tokens: auto
            target_tokens: auto
            trigger_tokens: auto
          enabled: true
          failure_mode: fail_open
          mode: auto
          recovery:
            enabled: false
            max_bytes_per_request: 10485760
            max_retrievals: 8
            max_total_bytes: 268435456
            store: response_cache
            ttl_seconds: 900
          request_controls:
            allowed:
            - bypass
            - target
            enabled: false
            header: x-vsr-compression-control
            max_target_tokens: 16000
          scoring:
            embedding_model_ref: ''
            method: bm25
          targets:
            history:
              mode: preserve
            memory:
              mode: preserve
            rag:
              mode: preserve
            tool_outputs:
              min_tokens: 2000
              mode: extractive
              target_tokens: 1000
        type: context_compression
      - configuration:
          allow_tools:
          - search_web
          block_tools:
          - exec_cmd
          enabled: true
          mode: filtered
          semantic_selection: true
        type: tools
      - configuration:
          advanced_filtering:
            candidate_pool_size: 30
            enabled: true
            min_combined_score: 0.4
          enabled: false
          fallback_to_empty: false
          mode: add
          similarity_threshold: 0.3
          strategy: default
          tools_db_path: config/tools_db.json
          top_k: 5
        type: tool_selection
      priority: 200
      rules:
        conditions:
        - name: business
          type: domain
        operator: AND
      tier: 2
    - algorithm:
        confidence:
          confidence_method: hybrid
          cost_quality_tradeoff: 0.45
          escalation_order: small_to_large
          hybrid_weights:
            logprob_weight: 0.65
            margin_weight: 0.35
          on_error: skip
          threshold: 0.72
          token_filter: tool_call_args
          verifier_server_url: ''
          verifier_timeout_seconds: 0
        on_error: fallback
        type: confidence
      description: Confidence-routed legal and factual traffic.
      name: legal_confidence_route
      plugins:
      - configuration:
          enabled: true
          hallucination_action: header
          include_hallucination_details: true
          unverified_factual_action: header
          use_nli: true
        type: hallucination
      - configuration:
          enabled: false
          mode: filter
          preserve_count: 2
          relevance_threshold: 0.25
        type: tool_selection
      priority: 190
      rules:
        conditions:
        - name: law
          type: domain
        - name: needs_fact_check
          type: fact_check
        operator: OR
    - adaptations:
        mode: bypass
      algorithm:
        ratings:
          max_concurrent: 3
          on_error: skip
        type: ratings
      description: Ratings-based route for health requests that need fact verification.
      name: health_ratings_route
      plugins:
      - configuration:
          capture_request_body: true
          capture_response_body: true
          enabled: true
          max_body_bytes: 4096
          max_records: 10000
          max_tool_trace_bytes: 0
          max_tool_trace_steps: 100
        type: router_replay
      priority: 180
      rules:
        conditions:
        - name: health
          type: domain
        - name: needs_fact_check
          type: fact_check
        operator: AND
    - algorithm:
        remom:
          breadth_schedule:
          - 3
          - 2
          compaction_strategy: last_n_tokens
          compaction_tokens: 512
          include_intermediate_responses: true
          include_reasoning: true
          max_completion_tokens: 1024
          max_concurrent: 3
          max_responses_per_round: 2
          min_successful_responses: 2
          model_distribution: round_robin
          on_error: skip
          round_timeout_seconds: 120
          shuffle_seed: 7
          synthesis_template: Fuse the strongest technical findings into a final answer.
          temperature: 0.7
        type: remom
      description: ReMoM route for complex computer science prompts.
      name: computer-science-remom-route
      output_contract_spec:
        extract:
          mode: exact
          sources:
          - content
        postprocess:
        - type: dereference_selected_reference
        reference:
          id_format: index
          source: candidate_responses
        type: reference_selection
      plugins:
      - configuration:
          auto_store: true
          enabled: true
          hybrid_mode: rerank
          hybrid_search: true
          reflection:
            algorithm: recency_semantic
            block_patterns:
            - api key
            - password
            dedup_threshold: 0.9
            enabled: true
            max_inject_tokens: 384
            recency_decay_days: 14
          retrieval_limit: 6
          similarity_threshold: 0.72
        type: memory
      priority: 170
      rules:
        conditions:
        - name: computer science
          type: domain
        - name: needs_reasoning:hard
          type: complexity
        operator: AND
    - algorithm:
        fusion:
          analysis_template: ''
          grounding:
            enabled: false
            min_keep: 1
            min_score: 0
            nli_contradiction_penalty: 1
            on_error: skip
            policy: weight
            reference: hybrid
          include_analysis: true
          include_intermediate_responses: true
          judge_prompt_version: fusion-v1
          max_completion_tokens: 512
          max_concurrent: 2
          min_successful_responses: 1
          on_error: skip
          round_timeout_seconds: 90
          synthesis_template: ''
          temperature: 0.2
        type: fusion
      description: Fusion route for prompts that benefit from panel deliberation.
      name: deliberation-fusion-route
      priority: 165
      rules:
        conditions:
        - name: business
          type: domain
        - name: needs_reasoning:hard
          type: complexity
        operator: AND
    - algorithm:
        type: workflows
        workflows:
          include_intermediate_responses: true
          max_completion_tokens: 1024
          max_parallel: 2
          max_steps: 6
          min_successful_responses: 1
          mode: dynamic
          on_error: fail
          planner: {}
          round_timeout_seconds: 90
          temperature: 0.2
          template: micro_agent
      description: Router Flow route for bounded static or dynamic micro-agent workflows.
      name: router-flow-workflow-route
      priority: 164
      rules:
        conditions:
        - name: business
          type: domain
        - name: needs_reasoning:hard
          type: complexity
        operator: AND
    - adaptations:
        adaptation:
          mode: apply
      description: Terse-answer route that allows Router Learning adaptation to adjust
        feedback-driven routing.
      name: terse_feedback_route
      plugins:
      - configuration:
          message: The primary model is saturated, so a lightweight response was returned
            immediately.
        type: fast_response
      - configuration:
          blocked_params:
          - logprobs
          - top_logprobs
          max_n: 4
          max_tokens_limit: 8192
          strip_unknown: false
        type: request_params
      priority: 160
      rules:
        conditions:
        - name: terse_answers
          type: preference
        operator: AND
    - algorithm:
        router_dc:
          dimension_size: 384
          min_similarity: 0.7
          require_descriptions: true
          temperature: 0.2
          use_capabilities: true
          use_model_contrastive: true
          use_query_contrastive: true
        type: router_dc
      description: Embedding-driven support route that escalates only when the derived
        projection band says the request is not a simple support query.
      name: support_router_dc_route
      plugins:
      - configuration:
          add:
          - name: X-Tenant-Tier
            value: premium
          delete:
          - X-Debug-Trace
          update:
          - name: X-Route-Source
            value: semantic-router
        type: header_mutation
      priority: 150
      rules:
        conditions:
        - name: technical_support
          type: embedding
        - name: support_escalated
          type: projection
        operator: AND
    - algorithm:
        automix:
          cost_aware_routing: true
          cost_quality_tradeoff: 0.35
          discount_factor: 0.9
          max_escalations: 2
          use_logprob_verification: true
          verification_threshold: 0.78
        type: automix
      description: Cost-aware urgent handling with AutoMix.
      name: urgent_automix_route
      plugins:
      - configuration:
          action: header
          enabled: true
          threshold: 0.85
        type: response_jailbreak
      priority: 145
      rules:
        conditions:
        - name: urgent_keywords
          type: keyword
        operator: AND
    - algorithm:
        hybrid:
          automix_weight: 0.2
          cost_weight: 0.1
          experience_weight: 0.4
          normalize_scores: true
          quality_gap_threshold: 0.08
          router_dc_weight: 0.3
        type: hybrid
      description: Composite route combining AND, OR, and NOT with Hybrid selection.
      name: safe_hybrid_route
      plugins:
      - configuration:
          enabled: true
          mode: none
          strip_tool_history: true
        type: tools
      priority: 140
      rules:
        conditions:
        - name: business
          type: domain
        - conditions:
          - name: urgent_keywords
            type: keyword
          - name: needs_reasoning:hard
            type: complexity
          operator: OR
        - conditions:
          - name: prompt_injection
            type: jailbreak
          operator: NOT
        operator: AND
    - adaptations:
        adaptation:
          mode: observe
        protection:
          stability_weight: 1.2
          switch_margin: 0.04
      description: Spanish-language route that observes Router Learning adaptation
        with Milvus RAG.
      name: spanish_adaptive_route
      plugins:
      - configuration:
          backend: milvus
          backend_config:
            collection: docs
            content_field: content
            filter_expression: locale == "es"
            metadata_field: metadata
            reuse_cache_connection: true
          cache_results: true
          cache_ttl_seconds: 600
          enabled: true
          injection_mode: tool_role
          max_context_length: 12000
          min_confidence_threshold: 0.55
          on_failure: warn
          similarity_threshold: 0.78
          top_k: 5
        type: rag
      priority: 135
      rules:
        conditions:
        - name: es
          type: language
        operator: AND
    - adaptations:
        adaptation:
          mode: apply
      description: Admin route with Router Learning adaptation and external API RAG.
      name: admin_adaptive_route
      plugins:
      - configuration:
          backend: external_api
          backend_config:
            api_key: search-api-key
            auth_header: X-API-Key
            endpoint: https://search.example.com/query
            headers:
              X-Environment: admin
            request_format: custom
            request_template: '{"query":"{{.Query}}","top_k":{{.TopK}},"threshold":{{.Threshold}}}'
            timeout_seconds: 15
          cache_results: false
          enabled: true
          injection_mode: system_prompt
          max_context_length: 8000
          min_confidence_threshold: 0.5
          on_failure: block
          similarity_threshold: 0.7
          top_k: 6
        type: rag
      priority: 130
      rules:
        conditions:
        - name: admin
          type: authz
        operator: AND
    - algorithm:
        latency_aware:
          description: Balance throughput and first-token latency for long prompts.
          tpot_percentile: 90
          ttft_percentile: 95
        type: latency_aware
      description: Long-context route with latency-aware policy and MCP-backed RAG.
      name: long_context_latency_route
      plugins:
      - configuration:
          backend: mcp
          backend_config:
            server_name: docs-server
            timeout_seconds: 20
            tool_arguments:
              query: ${user_content}
              top_k: ${top_k}
            tool_name: retrieve_docs
          cache_results: false
          enabled: true
          injection_mode: tool_role
          max_context_length: 10000
          min_confidence_threshold: 0.5
          on_failure: skip
          similarity_threshold: 0.74
          top_k: 4
        type: rag
      priority: 125
      rules:
        conditions:
        - name: long_context
          type: context
        operator: AND
    - algorithm:
        on_error: fallback
        prompt:
          instructions: Choose qwen3-8b for ordinary requests and qwen3-32b for hard
            reasoning, coding, or multi-step analysis.
          timeout_seconds: 5
        type: prompt
      description: Prompt-driven selection among bounded decision candidates.
      name: prompt_selected_route
      priority: 126
      rules:
        conditions:
        - name: other
          type: domain
        operator: AND
    - description: Route a bounded generic classifier score to a local model.
      name: classifier_band_route
      priority: 125
      rules:
        conditions:
        - label: JAILBREAK
          name: generic-safety-score
          on_error: no_match
          predicate:
            gte: 0.5
          type: classifier
        operator: AND
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: cheapest
          slo:
            max_cost_per_1m: 5
            max_inflight: 50
            max_tpot_ms: 200
            max_ttft_ms: 800
          weights:
            cost: 0.2
            latency: 0.2
            load: 0.2
            quality: 0.4
        type: multi_factor
      description: Compose quality, latency, cost, and load signals into a single
        weighted score.
      name: multi_factor_route
      priority: 124
      rules:
        conditions:
        - name: other
          type: domain
        operator: AND
    - algorithm:
        ml:
          embedding_dim: 1024
          knn:
            k: 5
            pretrained_path: /models/selection/knn_model.json
          models_path: /models/selection
        type: knn
      description: KNN fallback route for general traffic with OpenAI vector-store
        RAG.
      name: fallback_knn_route
      plugins:
      - configuration:
          backend: openai
          backend_config:
            api_key: openai-file-search-key
            base_url: https://api.openai.com
            file_ids:
            - file_a
            - file_b
            filter:
              doc_type: manual
            max_num_results: 12
            timeout_seconds: 20
            vector_store_id: vs_docs_prod
            workflow_mode: tool_based
          cache_results: true
          cache_ttl_seconds: 300
          enabled: true
          injection_mode: tool_role
          max_context_length: 9000
          min_confidence_threshold: 0.35
          on_failure: warn
          similarity_threshold: 0.73
          top_k: 8
        type: rag
      priority: 120
      rules:
        conditions:
        - name: other
          type: domain
        operator: AND
    - algorithm:
        ml:
          embedding_dim: 1024
          kmeans:
            efficiency_weight: 0.1
            num_clusters: 8
            pretrained_path: /models/selection/kmeans_model.json
          models_path: /models/selection
        type: kmeans
      description: KMeans route for clarification requests with local vector-store
        RAG.
      name: clarification_kmeans_route
      plugins:
      - configuration:
          backend: vectorstore
          backend_config:
            file_ids:
            - kb-001
            - kb-002
            vector_store_id: local-vs
          cache_results: true
          cache_ttl_seconds: 900
          enabled: true
          injection_mode: tool_role
          max_context_length: 7000
          min_confidence_threshold: 0.25
          on_failure: skip
          similarity_threshold: 0.69
          top_k: 5
        type: rag
      priority: 115
      rules:
        conditions:
        - name: need_clarification
          type: user_feedback
        operator: AND
    - algorithm:
        type: static
      description: Escalate when the user repeats the same question after an unsatisfying
        answer.
      name: repeat_question_escalation
      plugins:
      - configuration:
          add:
          - name: x-escalation-reason
            value: repeated-question
        type: header_mutation
      priority: 114
      rules:
        conditions:
        - name: likely_dissatisfied
          type: reask
        operator: AND
    - algorithm:
        ml:
          embedding_dim: 1024
          models_path: /models/selection
          svm:
            gamma: 1
            kernel: rbf
            pretrained_path: /models/selection/svm_model.json
        type: svm
      description: SVM route that only matches when prompt-injection signals are absent.
      name: safe_only_svm_route
      plugins:
      - configuration:
          backend: hybrid
          backend_config:
            fallback: external_api
            fallback_config:
              endpoint: https://search.example.com/query
              request_format: pinecone
            primary: milvus
            primary_config:
              collection: docs
              reuse_cache_connection: true
            strategy: parallel
          cache_results: false
          enabled: true
          injection_mode: tool_role
          max_context_length: 9000
          min_confidence_threshold: 0.45
          on_failure: warn
          similarity_threshold: 0.76
          top_k: 6
        type: rag
      priority: 110
      rules:
        conditions:
        - name: prompt_injection
          type: jailbreak
        operator: NOT
    - algorithm:
        ml:
          embedding_dim: 1024
          mlp:
            device: cpu
            pretrained_path: /models/selection/mlp_model.json
          models_path: /models/selection
        type: mlp
      description: Experimental MLP-based model selection route.
      name: mlp_experimental_route
      priority: 103
      rules:
        conditions:
        - name: machine_learning
          type: keyword
        operator: AND
    - description: Dedicated image-generation route using the OpenAI image backend.
      name: image_generation_route
      plugins:
      - configuration:
          backend: openai
          backend_config:
            api_key: openai-image-key
            base_url: https://api.openai.com/v1
            model: gpt-image-1
            quality: hd
            style: vivid
          default_height: 1024
          default_width: 1024
          enabled: true
          max_inference_steps: 30
          modality_detection:
            both_keywords:
            - explain and illustrate
            - describe with an image
            classifier:
              model_path: models/mmbert32k-modality-router-merged
              use_cpu: true
            confidence_threshold: 0.7
            keywords:
            - generate an image
            - draw
            - create a picture
            lower_threshold_ratio: 0.7
            method: hybrid
          timeout_seconds: 60
        type: image_gen
      priority: 105
      rules:
        conditions:
        - name: DIFFUSION
          type: modality
        operator: AND
    - description: BOTH-modality route requiring text and image-capable execution.
      name: multimodal_route
      plugins:
      - configuration:
          backend: vllm_omni
          backend_config:
            base_url: http://image-router:8005
            cfg_scale: 4.5
            model: Qwen/Qwen-Image
            num_inference_steps: 28
            seed: 42
          default_height: 1024
          default_width: 1024
          enabled: true
          max_inference_steps: 28
          timeout_seconds: 90
        type: image_gen
      priority: 100
      rules:
        conditions:
        - name: BOTH
          type: modality
        operator: AND
    strategy: priority
- name: privacy-first
  description: Keeps privacy-sensitive traffic on the local default-tier model.
  document:
    signals:
      keywords:
      - bm25_threshold: 0.1
        case_sensitive: false
        keywords:
        - ssn
        - passport number
        - credit card number
        method: bm25
        name: privacy_recipe_keywords
        operator: OR
    decisions:
    - algorithm:
        type: static
      description: Route privacy-sensitive prompts to the local model.
      name: privacy_recipe_route
      priority: 100
      rules:
        conditions:
        - name: privacy_recipe_keywords
          type: keyword
        operator: AND
    strategy: confidence
