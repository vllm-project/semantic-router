        prefix: /private
    recipe: privacy-first
    assignments:
      privacy_recipe_route:
        models:
        - model: qwen3-8b
  - name: default
    recipe: privacy-first
    assignments:
      privacy_recipe_route:
        models:
        - model: qwen3-8b
global:
  billing:
    currency: USD
  integrations:
    looper:
      endpoint: http://localhost:8899/v1/chat/completions
      flow:
        model_names:
        - vllm-sr/flow
        state:
          file:
            directory: .vllm-sr/flow-state
          redis:
            address: localhost:6379
            db: 0
            key_prefix: 'vllm-sr:flow:state:'
            max_retries: 3
            password: ''
            pool_size: 10
            tls_skip_verify: false
            use_tls: false
          store_backend: file
          ttl_seconds: 1800
      fusion:
        model_names:
        - vllm-sr/fusion
      grpc_max_msg_size_mb: 16
      headers:
        X-Trace-Source: looper
      max_response_bytes_mb: 32
      remom:
        model_names:
        - vllm-sr/remom
      retry_count: 2
      timeout_seconds: 120
    tools:
      advanced_filtering:
        allow_tools:
        - docs.search
        - tickets.lookup
        block_tools:
        - admin.delete
        candidate_pool_size: 50
        category_confidence_threshold: 0.7
        enabled: true
        hybrid_history:
          history_confidence_threshold: 0
          history_horizon: 8
          min_history_steps: 1
          repetition_penalty_strength: 0
          weight_decision_prior: 1
          weight_history_transition: 1
          weight_semantic: 1
        min_combined_score: 0.42
        min_lexical_overlap: 1
        retrieval_strategy: weighted
        use_category_filter: true
        weights:
          category: 0.1
          embed: 0.5
          lexical: 0.2
          name: 0.1
          tag: 0.1
      enabled: true
      fallback_to_empty: true
      similarity_threshold: 0.35
      tools_db_path: config/runtime/tools/tools_db.json
      top_k: 5
  model_catalog:
    embeddings:
      semantic:
        bert_model_path: models/mom-embedding-light
        embedding_config:
          backend: candle
          enable_soft_matching: true
          min_score_threshold: 0.45
          model_type: mmbert
          preload_embeddings: true
          prototype_scoring:
            best_weight: 0.75
            cluster_similarity_threshold: 0.9
            enabled: true
            margin_threshold: 0
            max_prototypes: 8
            top_m: 2
          target_dimension: 768
          target_layer: 22
          top_k: 1
        endpoint:
          api_key_env: EMBEDDING_API_KEY
          base_url: http://embedding-service:8000/v1
          dimensions: 1024
          max_retries: 2
          model: BAAI/bge-m3
          timeout_seconds: 5
        gemma_model_path: models/mom-embedding-flash
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        multimodal_model_path: models/mom-embedding-multimodal
        qwen3_model_path: models/mom-embedding-pro
        use_cpu: true
    external:
    - access_key: external-guardrail-key
      llm_endpoint:
        address: openai-proxy
        name: openai-guardrail
        port: 443
        prompt_template: '{{ .Prompt }}'
        protocol: https
        use_chat_template: true
      llm_model_name: gpt-4.1-mini
      llm_provider: openai
      llm_timeout_seconds: 30
      max_tokens: 2048
      model_role: guardrail
      name: external-guardrail
      parser_type: json
      temperature: 0.2
      threshold: 0.65
    - access_key: external-classifier-key
      llm_endpoint:
        address: openai-proxy
        name: openai-classifier
        port: 443
        prompt_template: '{{ .Prompt }}'
        protocol: https
        use_chat_template: true
      llm_model_name: gpt-4.1-mini
      llm_provider: openai
      llm_timeout_seconds: 15
      max_tokens: 128
      model_role: classification
      name: external-classifier
      parser_type: json
      temperature: 0
    kbs:
    - groups:
        frontier_reasoning:
        - architecture_analysis
        - root_cause_analysis
        - multi_step_tradeoffs
        local_standard:
        - generic_coding
        - simple_task
        - general_knowledge
        privacy_policy:
        - proprietary_code
        - internal_document
        - pii
        - business_strategy
        - trade_secret_ip
        - operational_infrastructure
        - locality_directive
        - customer_data
        private:
        - prompt_injection
        - credential_exfiltration
        - jailbreak_role
        - system_prompt_extraction
        - proprietary_code
        - internal_document
        - pii
        - business_strategy
        - trade_secret_ip
        - operational_infrastructure
        - locality_directive
        - customer_data
        public:
        - architecture_analysis
        - root_cause_analysis
        - multi_step_tradeoffs
        - generic_coding
        - simple_task
        - general_knowledge
        security_containment:
        - prompt_injection
        - credential_exfiltration
        - jailbreak_role
        - system_prompt_extraction
      label_thresholds:
        prompt_injection: 0.7
      metrics:
      - name: private_vs_public
        negative_group: public
        positive_group: private
        type: group_margin
      name: privacy_kb
      prototype_scoring:
        best_weight: 0.75
        cluster_similarity_threshold: 0.9
        enabled: true
        margin_threshold: 0
        max_prototypes: 8
        top_m: 2
      source:
        manifest: labels.json
        path: knowledge_bases/privacy/
      threshold: 0.55
    - groups:
        escalate:
        - biology
        - business
        - computer science
        - economics
        - history
        - math
        - other
        - philosophy
        - psychology
        keep:
        - chemistry
        - engineering
        - health
        - law
        - physics
      metrics:
      - name: escalate_vs_keep
        negative_group: keep
        positive_group: escalate
        type: group_margin
      name: mmlu_kb
      source:
        manifest: labels.json
        path: knowledge_bases/mmlu/
      threshold: 0.25
    modules:
      classifier:
        domain:
          category_mapping_path: models/mmbert32k-intent-classifier-merged/category_mapping.json
          enabled: true
          fallback_category: other
          model_id: models/mmbert32k-intent-classifier-merged
          model_ref: domain_classifier
          threshold: 0.5
          use_cpu: true
          use_mmbert_32k: true
          use_modernbert: false
        mcp:
          args:
          - -m
          - mcp_classifier
          command: python
          enabled: true
          env:
            MCP_MODE: local
          threshold: 0.6
          timeout_seconds: 15
          tool_name: classify
          transport_type: stdio
          url: http://localhost:9010
        pii:
          enabled: true
          model_id: models/mmbert32k-pii-detector-merged
          model_ref: pii_classifier
          pii_mapping_path: models/mmbert32k-pii-detector-merged/pii_type_mapping.json
          threshold: 0.9
          use_cpu: true
          use_mmbert_32k: true
        preference:
          embedding_model: models/preference-encoder
          prototype_scoring:
            best_weight: 0.75
            cluster_similarity_threshold: 0.9
            enabled: true
            margin_threshold: 0
            max_prototypes: 8
            top_m: 2
          use_contrastive: true
      complexity:
        prototype_scoring:
          best_weight: 0.75
          cluster_similarity_threshold: 0.9
          enabled: true
          margin_threshold: 0
          max_prototypes: 6
          top_m: 2
      feedback_detector:
        enabled: true
        feedback_mapping_path: models/mmbert32k-feedback-detector-merged/feedback_mapping.json
        model_id: models/mmbert32k-feedback-detector-merged
        model_ref: feedback_detector
        threshold: 0.7
        use_cpu: true
        use_mmbert_32k: true
        use_modernbert: false
      hallucination_mitigation:
        detector:
          backend: candle
          context_window_size: 50
          enable_nli_filtering: true
          endpoint: ''
          include_explanation: false
          min_span_confidence: 0.6
          min_span_length: 2
          model_id: models/mom-halugate-detector
          model_ref: hallucination_detector
          nli_entailment_threshold: 0.75
          threshold: 0.82
          use_cpu: true
        enabled: true
        explainer:
          model_id: models/mom-halugate-explainer
          model_ref: hallucination_explainer
          threshold: 0.9
          use_cpu: true
        fact_check:
          model_id: models/mmbert32k-factcheck-classifier-merged
          model_ref: fact_check_classifier
          threshold: 0.65
          use_cpu: true
          use_mmbert_32k: true
        on_hallucination_detected: annotate
      modality_detector:
        both_keywords:
        - explain and illustrate
        - describe with an image
        classifier:
          model_path: models/mmbert32k-modality-router-merged
          use_cpu: true
        confidence_threshold: 0.7
        enabled: true
        keywords:
        - image
        - picture
        - illustration
        lower_threshold_ratio: 0.7
        method: hybrid
        prompt_prefixes:
        - generate an image of
        - draw
        - create a picture of
      prompt_compression:
        enabled: true
        max_tokens: 4096
        min_length: 512
        novelty_weight: 0.1
        position_depth: 0.1
        position_weight: 0.2
        preserve_first_n: 3
        preserve_last_n: 2
        profile: default
        skip_signals:
        - jailbreak
        - pii
        textrank_weight: 0.4
        tfidf_weight: 0.3
      prompt_guard:
        enabled: true
        jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
        model_id: models/mmbert32k-jailbreak-detector-merged
        model_ref: prompt_guard
        on_error: allow
        positive_labels:
        - jailbreak
        threshold: 0.7
        use_cpu: true
        variant: mmbert32k
    system:
      domain_classifier: models/mmbert32k-intent-classifier-merged
      fact_check_classifier: models/mmbert32k-factcheck-classifier-merged
      feedback_detector: models/mmbert32k-feedback-detector-merged
      hallucination_detector: models/mom-halugate-detector
      hallucination_explainer: models/mom-halugate-explainer
      pii_classifier: models/mmbert32k-pii-detector-merged
      prompt_guard: models/mmbert32k-jailbreak-detector-merged
  router:
    clear_route_cache: false
    learning:
      adaptation:
        candidate_set: decision
        enabled: true
        strategy: routing_sampling
      enabled: true
      protection:
        enabled: true
        identity:
          headers:
            conversation: x-conversation-id
            session: x-session-id
        scope: conversation
        tuning:
          idle_timeout_seconds: 300
          min_turns_before_switch: 1
          stability_weight: 1
          switch_margin: 0.05
      state_store:
        backend: redis
        redis:
          address: redis:6379
          database: 2
          key_prefix: 'vsr:router-session:v1:'
          password: "${VLLM_SR_STACK_REDIS_PASSWORD}"
        timeout_ms: 50
        ttl_seconds: 86400
    streamed_body:
      enabled: true
      max_bytes: 1048576
      timeout_sec: 15
  services:
    agent:
      public_inference_endpoint: ''
    backend_credentials:
      reference_api_key:
        credential_adapter_id: bearer
        secret_env: REFERENCE_API_KEY
    api:
      batch_classification:
        concurrency_threshold: 5
        max_batch_size: 100
        max_concurrency: 8
        metrics:
          batch_size_ranges:
          - label: tiny
            max: 4
            min: 1
          - label: standard
            max: 16
            min: 5
          detailed_goroutine_tracking: true
          duration_buckets:
          - 0.01
          - 0.05
          - 0.1
          - 0.5
          - 1
          enabled: true
          high_resolution_timing: true
          sample_rate: 1
          size_buckets:
          - 128
          - 512
          - 2048
          - 8192
    backend_dispatch:
      audience: vllm-sr.backend-dispatch
      bind_address: 0.0.0.0
      capability_ttl: 30s
      max_request_body_bytes: 67108864
      port: 8180
    management_api:
      auth:
        control_plane_hmac_keyring_env: ''
        control_plane_hmac_keyring_file: ''
        mode: disabled
        roles:
          admin:
          - '*'
          operator:
          - health.read
          - ready.read
          - docs.read
          - metrics.read
          - classify.invoke
          - config.read
          - replay.read
          - replay.detail
          - data.read
          - data.write
          - cache.read
          - cache.invalidate
          - compression.read
          - compression.preview
          viewer:
          - health.read
          - ready.read
          - docs.read
          - metrics.read
          - classify.invoke
          - config.read
          - replay.read
          - data.read
          - cache.read
          - compression.read
        tokens:
        - env: VSR_MGMT_TOKEN
          role: admin
      bind_address: 127.0.0.1
      port: 8080
      remote_exposure: false
      tls:
        certificate_env: ''
        certificate_file: ''
        client_ca_bundle_env: ''
        client_ca_bundle_file: ''
        private_key_env: ''
        private_key_file: ''
    observability:
      metrics:
        enabled: true
        windowed_metrics:
          enabled: true
          max_models: 50
          model_metrics: true
          queue_depth_estimation: true
          time_windows:
          - 1m
          - 5m
          - 1h
          update_interval: 30s
      tracing:
        enabled: true
        exporter:
          endpoint: jaeger:4317
          insecure: true
          type: otlp
        provider: opentelemetry
        resource:
          deployment_environment: development
          service_name: vllm-sr
          service_version: v0.4.0
        sampling:
          rate: 0.5
          type: probabilistic
    response_api:
      enabled: true
      max_responses: 2000
      redis:
        address: redis:6379
        cluster_addresses:
        - redis-a:6379
        - redis-b:6379
        cluster_mode: false
        config_path: config/backends/response-api-redis.yaml
        db: 1
        dial_timeout: 5
        key_prefix: 'vsr:responses:'
        max_retries: 3
        min_idle_conns: 2
        password: "${VLLM_SR_STACK_REDIS_PASSWORD}"
        pool_size: 10
        read_timeout: 5
        tls_ca_path: certs/ca.crt
        tls_cert_path: certs/redis.crt
        tls_enabled: false
        tls_key_path: certs/redis.key
        write_timeout: 5
      store_backend: redis
      ttl_seconds: 86400
    router_replay:
      async_writes: true
      enabled: true
      milvus:
        address: milvus:19530
        collection_name: router_replay
        consistency_level: Bounded
        password: "${MILVUS_PASSWORD}"
        shard_num: 2
        username: root
      postgres:
        conn_max_lifetime: 300
        database: vsr
        host: postgres
        max_idle_conns: 10
        max_open_conns: 20
        password: "${VLLM_SR_STACK_POSTGRES_PASSWORD}"
        port: 5432
        ssl_mode: disable
        table_name: router_replay
        user: router
      qdrant:
        api_key: ''
        collection_name: router_replay
        host: qdrant
        port: 6334
        use_tls: false
      redis:
        address: redis:6379
        db: 2
        key_prefix: 'vsr:replay:'
        max_retries: 3
        password: "${VLLM_SR_STACK_REDIS_PASSWORD}"
        pool_size: 20
        tls_skip_verify: false
        use_tls: false
      store_backend: postgres
      ttl_seconds: 2592000
    startup_status:
      store_backend: file
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    memory:
      adaptive_threshold: true
      auto_store: true
      backend: milvus
      default_retrieval_limit: 10
      default_similarity_threshold: 0.74
      disabled_models: []
      disabled_routes: []
      embedding_model: bert
      enabled: true
      extraction_batch_size: 16
      hybrid_mode: rerank
      hybrid_search: true
      milvus:
        address: milvus:19530
        collection: agentic_memory
        dimension: 384
        num_partitions: 32
      qdrant:
        api_key: ''
        collection: agentic_memory
        connect_timeout: 10
        dimension: 384
        host: qdrant
        port: 6334
        use_tls: false
      quality_scoring:
        initial_strength_days: 30
        max_memories_per_user: 200
        prune_threshold: 0.15
      redis_cache:
        address: localhost:6379
        db: 0
        enabled: false
        key_prefix: 'memory_cache:'
        password: ''
        ttl_seconds: 300
      reflection:
        algorithm: recency_semantic
        block_patterns:
        - api key
        - password
        dedup_threshold: 0.9
        enabled: true
        max_inject_tokens: 512
        recency_decay_days: 14
      valkey:
        collection_prefix: 'mem:'
        database: 0
        dimension: 384
        host: valkey
        index_ef_construction: 200
        index_m: 16
        index_name: mem_idx
        metric_type: COSINE
        password: "${VALKEY_PASSWORD}"
        port: 6379
        timeout: 10
        tls_ca_path: ''
        tls_enabled: false
        tls_insecure_skip_verify: false
    response_cache:
      backend_type: milvus
      embedding_model: mmbert
      enabled: true
      eviction_policy: lru
      max_entries: 50000
      milvus:
        collection:
          description: Semantic cache vectors.
          index:
            params:
              M: 16
              efConstruction: 200
            type: HNSW
          name: semantic_cache
          vector_field:
            dimension: 768
            metric_type: COSINE
            name: embedding
        connection:
          auth:
            enabled: true
            password: "${MILVUS_PASSWORD}"
            username: root
          database: default
          host: milvus
          port: 19530
          timeout: 30
          tls:
            ca_file: certs/ca.crt
            cert_file: certs/milvus.crt
            enabled: false
            key_file: certs/milvus.key
        data_management:
          compaction:
            enabled: true
            interval: 86400
          ttl:
            cleanup_interval: 3600
            enabled: true
            timestamp_field: created_at
        development:
          auto_create_collection: true
          drop_collection_on_startup: false
          verbose_errors: true
        logging:
          enable_metrics: true
          enable_query_log: true
          level: info
        performance:
          batch:
            insert_batch_size: 128
            timeout: 30
          connection_pool:
            acquire_timeout: 10
            max_connections: 20
            max_idle_connections: 10
        search:
          consistency_level: Bounded
          params:
            ef: 64
          topk: 10
      similarity_threshold: 0.86
      ttl_seconds: 7200
    vector_store:
      backend_type: llama_stack
      embedding_dimension: 384
      embedding_model: multimodal
      enabled: true
      file_storage_dir: /var/lib/vsr/data
      ingestion_drain_timeout_seconds: 30
      ingestion_workers: 4
      llama_stack:
        auth_token: "${LLAMA_STACK_AUTH_TOKEN}"
        embedding_model: all-MiniLM-L6-v2
        endpoint: http://llama-stack:8321
        request_timeout_seconds: 30
        search_type: hybrid
      max_file_size_mb: 100
      memory:
        max_entries_per_store: 5000
      metadata_postgres:
        conn_max_lifetime: 300
        database: vsr
        host: postgres
        max_idle_conns: 5
        max_open_conns: 25
        password: "${VLLM_SR_STACK_POSTGRES_PASSWORD}"
        port: 5432
        ssl_mode: disable
        table_name: vector_store_registry
        user: router
      metadata_store: memory
      milvus:
        collection:
          description: Uploaded document embeddings.
          index:
            params:
              M: 16
              efConstruction: 200
            type: HNSW
          name: vector_store
          vector_field:
            dimension: 384
            metric_type: COSINE
            name: embedding
        connection:
          auth:
            enabled: true
            password: "${MILVUS_PASSWORD}"
            username: root
          database: vector_store
          host: milvus
          port: 19530
          timeout: 30
          tls:
            ca_file: certs/ca.crt
            cert_file: certs/milvus.crt
            enabled: false
            key_file: certs/milvus.key
        data_management:
          compaction:
            enabled: true
            interval: 86400
          ttl:
            cleanup_interval: 3600
            enabled: true
            timestamp_field: created_at
        development:
          auto_create_collection: true
          drop_collection_on_startup: false
          verbose_errors: true
        logging:
          enable_metrics: true
          enable_query_log: true
          level: info
        performance:
          batch:
            insert_batch_size: 64
            timeout: 30
          connection_pool:
            acquire_timeout: 10
            max_connections: 20
            max_idle_connections: 10
        search:
          consistency_level: Strong
          params:
            ef: 64
          topk: 10
      qdrant:
        api_key: ''
        collection_prefix: vsr_vs_
        connect_timeout: 10
        host: qdrant
        port: 6334
        use_tls: false
      supported_formats:
      - .txt
      - .md
      - .json
      - .csv
      - .html
      - .pdf
      valkey:
        collection_prefix: vsr_vs_
        connect_timeout: 5
        database: 0
        host: valkey
        index_ef_construction: 200
        index_m: 16
        metric_type: COSINE
        password: "${VALKEY_PASSWORD}"
        port: 6379
