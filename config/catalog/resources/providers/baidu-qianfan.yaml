id: baidu-qianfan
display_name: Baidu Qianfan
description: ERNIE and selected third-party models through Qianfan's OpenAI-compatible API.
category: model_api
support_tier: compatible
default_base_url: https://api.baiduqianfan.ai/v1
protocols:
- openai/chat-completions@1
default_protocol: openai/chat-completions@1
supported_operations:
- openai/chat-completions@1#create
auth:
  strategy: bearer
  header: Authorization
  prefix: Bearer
presentation:
  logo: package:baidu
  monogram: E
  monochrome: false
conformance:
  status: unverified
