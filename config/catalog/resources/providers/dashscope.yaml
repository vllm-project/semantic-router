id: dashscope
display_name: DashScope
description: Qwen models through the compatible endpoint.
category: model_api
support_tier: compatible
default_base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
protocols:
- openai/chat-completions@1
- openai/responses@1
default_protocol: openai/chat-completions@1
supported_operations:
- openai/chat-completions@1#create
- openai/chat-completions@1#list_models
- openai/responses@1#create
- openai/responses@1#list_models
reasoning_transport: top_level_effort
auth:
  strategy: bearer
  header: Authorization
  prefix: Bearer
presentation:
  logo: package:qwen
  monogram: Q
  monochrome: false
  featured: true
conformance:
  status: unverified
# Existing models stay on default_base_url. qwen4-max calls should set the
# backend endpoint to the caller's workspace host, including /compatible-mode/v1:
#   Beijing  https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
#   Singapore https://{WorkspaceId}.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
#   Virginia https://{WorkspaceId}.us-east-1.maas.aliyuncs.com/compatible-mode/v1
#   Hong Kong https://{WorkspaceId}.cn-hongkong.maas.aliyuncs.com/compatible-mode/v1
#   Tokyo    https://{WorkspaceId}.ap-northeast-1.maas.aliyuncs.com/compatible-mode/v1
# The API key must be created in that same region. qwen4-max Chat Completions
# uses top_level_effort_boolean_switch: reasoning_effort is low, high, or
# xhigh (declared default high), and enable_thinking is the on/off switch.
# A disabled decision sends enable_thinking: false.
models:
- catalog: qwen/qwen4-max
  relationship: first_party
  id: qwen4-max
  protocols:
  - openai/chat-completions@1
  reasoning_transport: top_level_effort_boolean_switch
  lifecycle: active
  verification:
    status: claimed
    verified_at: 2026-11-22
    source: https://www.alibabacloud.com/help/en/model-studio/compatibility-of-openai-with-dashscope
- catalog: qwen/qwen3.7-max
  relationship: first_party
  id: qwen3.7-max
  protocols:
  - openai/chat-completions@1
  reasoning_transport: top_level_boolean
  lifecycle: active
  verification:
    status: claimed
    verified_at: 2026-09-05
    source: https://www.alibabacloud.com/help/en/model-studio/text-generation-model
- catalog: qwen/qwen3.8-max
  relationship: first_party
  id: qwen3.8-max
  protocols:
  - openai/chat-completions@1
  - openai/responses@1
  reasoning_transport: top_level_effort_boolean_switch
  lifecycle: active
  verification:
    status: claimed
    verified_at: 2026-09-05
    source: https://www.alibabacloud.com/help/en/model-studio/text-generation-model
