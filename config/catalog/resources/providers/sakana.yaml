id: sakana
display_name: Sakana AI
description: Sakana Fugu and Namazu through OpenAI- and Anthropic-compatible APIs.
category: model_api
support_tier: compatible
default_base_url: https://api.sakana.ai/v1
protocols:
- openai/chat-completions@1
- openai/responses@1
- anthropic/messages@1
default_protocol: openai/responses@1
supported_operations:
- openai/chat-completions@1#create
- openai/chat-completions@1#list_models
- openai/responses@1#create
- openai/responses@1#list_models
- anthropic/messages@1#create
- anthropic/messages@1#list_models
reasoning_transport: reasoning_object
auth:
  strategy: bearer
  header: Authorization
  prefix: Bearer
presentation:
  logo: monogram
  monogram: S
  monochrome: true
conformance:
  status: unverified
models:
- catalog: sakana/fugu
  id: fugu
  protocols: &sakana-protocols [openai/chat-completions@1, openai/responses@1, anthropic/messages@1]
  lifecycle: active
  verification: &sakana-binding-verification
    status: claimed
    verified_at: 2026-09-05
    source: https://console.sakana.ai/models
- catalog: sakana/fugu-ultra
  id: fugu-ultra
  protocols: *sakana-protocols
  lifecycle: active
  verification: *sakana-binding-verification
- catalog: sakana/fugu-cyber
  id: fugu-cyber
  protocols: *sakana-protocols
  restrictions:
    access: reviewed
  lifecycle: experimental
  verification: *sakana-binding-verification
- catalog: sakana/sakana-namazu
  id: sakana-namazu
  protocols: *sakana-protocols
  lifecycle: active
  verification:
    status: claimed
    verified_at: 2026-09-05
    source: https://console.sakana.ai/models?model=sakana-namazu
