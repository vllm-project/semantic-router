- id: tiger-ai-lab/mmlu-pro@1.0.0
  display_name: MMLU-Pro
  domain: general_reasoning
  source: https://github.com/TIGER-AI-Lab/MMLU-Pro
  default_profile: published-standard
  profiles:
    - id: published-standard
      display_name: Published standard
      description: Vendor-published MMLU-Pro result using the source's documented standard setup.
  metrics:
    - id: accuracy
      unit: proportion
      direction: higher_is_better
      range: [0, 1]
