- id: vllm-sr/intelligence@1.0.0
  display_name: vLLM-SR Open Intelligence Index
  description: Complete-case composite of five open benchmarks for reasoning, scientific coding, and agentic execution.
  methodology: https://github.com/vllm-project/semantic-router/blob/main/website/docs/proposals/open-intelligence-index-and-model-arena.md
  aggregation: weighted_mean
  scale: [0, 100]
  missing:
    policy: require_all
  domains:
    general_reasoning: 0.20
    scientific_reasoning: 0.20
    frontier_reasoning: 0.20
    scientific_coding: 0.20
    agentic_systems: 0.20
  components:
    - benchmark: tiger-ai-lab/mmlu-pro@1.0.0
      metric: accuracy
      benchmark_profiles: [independent-standard, published-standard]
      weight: 0.20
      normalization: {type: identity}
    - benchmark: idavidrein/gpqa-diamond@1.0.0
      metric: accuracy
      benchmark_profiles: [independent-standard, published-standard]
      weight: 0.20
      normalization: {type: identity}
    - benchmark: cais/humanitys-last-exam@1.0.0
      metric: accuracy
      benchmark_profiles: [independent-standard, no-tools]
      weight: 0.20
      normalization: {type: identity}
    - benchmark: scicode-bench/scicode@1.0.0
      metric: score
      benchmark_profiles: [independent-test-288, published-standard]
      weight: 0.20
      normalization: {type: identity}
    - benchmark: harbor/terminal-bench@2.1.0
      metric: resolved
      benchmark_profiles: [independent-agent, published-agent]
      weight: 0.20
      normalization: {type: identity}
