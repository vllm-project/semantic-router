# Redis Store Configuration for Response API - Simple Standalone Mode
# This is the simplest configuration for local development and testing.
# To use this configuration:
# 1. Set store_backend: "redis" in your main config.yaml
# 2. Set redis.config_path: "config/response-api/redis-simple.yaml" in response_api section
# 3. Ensure Redis server is running on localhost:6379

# Basic connection
address: "localhost:6379"
password: ""  # Leave empty if Redis has no authentication
db: 0         # Database number 0 (shared with semantic cache, separated by prefix)

# Key management
key_prefix: "sr:"  # Base prefix - creates keys like: sr:response:xxx, sr:conversation:xxx

# Connection pooling
pool_size: 10        # Maximum connections (good for local dev)
min_idle_conns: 2    # Keep 2 connections ready
max_retries: 3       # Retry failed operations up to 3 times

# Timeouts (in seconds)
dial_timeout: 5      # 5 seconds to establish connection
read_timeout: 3      # 3 seconds to read response
write_timeout: 3     # 3 seconds to write data

# Cluster mode (disabled for simple standalone)
cluster_mode: false

# TLS (disabled for local development)
tls_enabled: false

# Usage Example in main config:
# response_api:
#   enabled: true
#   store_backend: "redis"
#   ttl_seconds: 86400  # 24 hours
#   redis:
#     config_path: "config/response-api/redis-simple.yaml"

# Or use inline configuration instead:
# response_api:
#   enabled: true
#   store_backend: "redis"
#   ttl_seconds: 86400
#   redis:
#     address: "localhost:6379"
#     db: 0
#     key_prefix: "sr:"
#     pool_size: 10

# Redis Key Schema:
# sr:response:{response_id}                         → flat JSON StoredResponse (source of truth).
#                                                      New writes add an internal UUID-v4 field,
#                                                      _vsr_generation. Legacy JSON without it is
#                                                      readable. Request-path legacy scans leave
#                                                      it untouched while index-unaware writers
#                                                      may still exist. The operator-authorized
#                                                      finalization sweep upgrades it in place —
#                                                      preserving content and remaining TTL — and
#                                                      a post-finalization cascade can upgrade any
#                                                      residual legacy payload on demand. A
#                                                      payload that still lacks a generation is
#                                                      never deleted by CAS; it is upgraded first.
# sr:conversation:{conv_id}                         → JSON blob of StoredConversation.
# sr:conversation-index:{base64url(conv_id)}        → sorted set of raw response IDs, scored by
#                                                      created_at. The escaped brace-delimited
#                                                      value is a Redis Cluster hash tag, not the
#                                                      literal conversation ID.
# sr:conversation-index-gen:{base64url(conv_id)}    → HASH from response ID to _vsr_generation.
#                                                      It shares the ZSET's hash tag and monotonic
#                                                      TTL, so Lua atomically updates or
#                                                      conditionally removes both. ZSET members
#                                                      stay raw response IDs for cursor ordering.
#                                                      A member left by a legacy payload has no
#                                                      field here. That absence is a comparable
#                                                      witness, but it only authorizes removing a
#                                                      membership once the completion record
#                                                      below is set: until then an index-unaware
#                                                      writer can put a payload back under the
#                                                      same ID without claiming the member, and
#                                                      the stale cleanup would orphan it. Before
#                                                      finalization the remedy for a legacy
#                                                      member is upgrading its payload, not
#                                                      removing it, so a membership whose payload
#                                                      is already gone is deliberately left in
#                                                      place for the migration window — a short
#                                                      page beats a lost record.
# sr:conversation-index-migrated:{conv_id}          → per-conversation proof with value
#                                                      "v1:empty" or "v1:populated", written only
#                                                      after a complete legacy scan. Both proof
#                                                      kinds expire after min(retention TTL,
#                                                      5 minutes), and ordinary response writes
#                                                      never refresh them during rolling upgrade.
# sr:conversation-index-scan-lease:v1               → one renewable, store-wide 30-second lease
#                                                      serializing all full-keyspace legacy scans;
#                                                      it is not a per-conversation lock.
# sr:conversation-index-complete:v1                 → persistent value "v1", set only by the
#                                                      operator-triggered finalization sweep after
#                                                      every index-unaware writer is gone. Once set,
#                                                      reads trust the secondary index and never
#                                                      run legacy scans again, and witness-less
#                                                      memberships become safe to clean up.
#
# The ZSET is derived state and can be partial until a proof or global completion record says it
# is exhaustive. All key families use disjoint prefixes so conversation/response JSON scans never
# attempt to decode a ZSET, HASH, proof, lease, or completion value.
#
# Both Response API and Semantic Cache share DB 0 but use different base prefixes:
# - Response API: sr:*
# - Semantic Cache: doc:*
