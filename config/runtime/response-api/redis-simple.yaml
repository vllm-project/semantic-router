# Redis Store Configuration for Response API - Simple Standalone Mode
# This is the simplest configuration for local development and testing.
# To use this configuration:
# 1. Set store_backend: "redis" in your main config.yaml
# 2. Set redis.config_path: "config/response-api/redis-simple.yaml" in response_api section
# 3. Ensure Redis server is running on localhost:6379

# Basic connection
address: "localhost:6379"
password: ""  # Leave empty if Redis has no authentication
db: 0         # Database number 0 (shared with semantic cache, separated by prefix)

# Key management
key_prefix: "sr:"  # Base prefix - creates keys like: sr:response:xxx, sr:conversation:xxx

# Connection pooling
pool_size: 10        # Maximum connections (good for local dev)
min_idle_conns: 2    # Keep 2 connections ready
max_retries: 3       # Retry failed operations up to 3 times

# Timeouts (in seconds)
dial_timeout: 5      # 5 seconds to establish connection
read_timeout: 3      # 3 seconds to read response
write_timeout: 3     # 3 seconds to write data

# Cluster mode (disabled for simple standalone)
cluster_mode: false

# TLS (disabled for local development)
tls_enabled: false

# Usage Example in main config:
# response_api:
#   enabled: true
#   store_backend: "redis"
#   ttl_seconds: 86400  # 24 hours
#   redis:
#     config_path: "config/response-api/redis-simple.yaml"

# Or use inline configuration instead:
# response_api:
#   enabled: true
#   store_backend: "redis"
#   ttl_seconds: 86400
#   redis:
#     address: "localhost:6379"
#     db: 0
#     key_prefix: "sr:"
#     pool_size: 10

# Redis Key Schema:
# sr:response:{response_id}                → JSON blob of StoredResponse (source of truth)
# sr:conversation:{conv_id}                → JSON blob of StoredConversation
# sr:conversation-index:{conv_id}          → sorted set of response IDs, scored by created_at.
#                                             Derived from sr:response:* and repairable from it;
#                                             not itself the source of truth. Can exist with only
#                                             *some* of a conversation's responses indexed (e.g.
#                                             right after its first post-upgrade write) — never
#                                             trust it as exhaustive without checking the
#                                             migrated marker below first.
# sr:conversation-index-migrated:{conv_id} → marker (value "v1") set once a full legacy-scan
#                                             backfill has completed for conv_id, whether or not
#                                             it found anything to index. This — not whether the
#                                             index key exists — is what every read and cascade
#                                             delete checks before trusting the index's current
#                                             membership as complete. TTL matches the data
#                                             retention TTL above when the scan found responses
#                                             (refreshed on every later write to the same
#                                             conversation); capped at 5 minutes when it found
#                                             none, so a write from an older pod during a rolling
#                                             upgrade can't stay hidden behind a stale "confirmed
#                                             empty" result for long.
# sr:conversation-index-lock:{conv_id}     → short-lived (30s) lock guarding the one-time legacy
#                                             scan against a stampede of concurrent readers. An
#                                             optimization, not a correctness dependency.
#
# All four families are disjoint prefixes by design: sr:conversation-index* must never be
# matched by the sr:conversation:* or sr:response:* scans used elsewhere, or a sorted set or
# marker string would be read back as conversation/response JSON.
#
# Both Response API and Semantic Cache share DB 0 but use different base prefixes:
# - Response API: sr:*
# - Semantic Cache: doc:*

