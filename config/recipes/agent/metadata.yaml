schema_version: vllm-sr/recipe-metadata/v1
id: agent
name: Agent Routing
version: 0.3.0
description: >-
  Routes agentic, coding, specialist, privacy, and security workloads across
  local and frontier lanes while collecting replay data for learning.
  It routes on five named questions that its declared decision model,
  Vela 2.0 0.8B, answers in one call per request.
