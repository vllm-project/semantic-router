version: v0.3
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 1200s
providers:
  defaults:
    default_model: qwen/qwen3.6-rocm
    reasoning_families:
      qwen/qwen3.6-rocm:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
  - name: qwen/qwen3.6-rocm
    provider_model_id: qwen/qwen3.6-rocm
    backend_refs:
    - endpoint: http://vllm:8000/v1
      provider: vllm
    api_format: openai
    reasoning_family: qwen/qwen3.6-rocm
  - name: google/gemini-2.5-flash-lite
    provider_model_id: google/gemini-2.5-flash-lite
    backend_refs:
    - endpoint: http://vllm:8000/v1
      provider: vllm
    api_format: openai
    pricing:
      input_cost_per_million_tokens: '0.01'
      output_cost_per_million_tokens: '0.04'
      cache_read_cost_per_million_tokens: '0.002'
  - name: google/gemini-3.1-pro
    provider_model_id: google/gemini-3.1-pro
    backend_refs:
    - endpoint: http://vllm:8000/v1
      provider: vllm
    api_format: openai
    pricing:
      input_cost_per_million_tokens: '0.48'
      output_cost_per_million_tokens: '1.92'
      cache_read_cost_per_million_tokens: '0.12'
  - name: openai/gpt5.4
    provider_model_id: openai/gpt5.4
    backend_refs:
    - endpoint: http://vllm:8000/v1
      provider: vllm
    api_format: openai
    pricing:
      input_cost_per_million_tokens: '1.2'
      output_cost_per_million_tokens: '4.8'
      cache_read_cost_per_million_tokens: '0.3'
  - name: anthropic/claude-opus-4.6
    provider_model_id: anthropic/claude-opus-4.6
    backend_refs:
    - endpoint: http://vllm:8000/v1
      provider: vllm
    api_format: openai
    pricing:
      input_cost_per_million_tokens: '1.8'
      output_cost_per_million_tokens: '7.2'
      cache_read_cost_per_million_tokens: '0.45'
  - name: local/omni
    provider_model_id: local/omni
    backend_refs:
    - endpoint: http://vllm-omni:8000/v1
      provider: vllm
    api_format: openai
routing:
  modelCards:
  - name: qwen/qwen3.6-rocm
    capabilities:
    - chat
    - privacy_locality
    - private_code
    - simple_qa
    - tool_use
    - text
  - name: google/gemini-2.5-flash-lite
    capabilities:
    - chat
    - low_cost
    - explanation
    - coding
    - text
  - name: google/gemini-3.1-pro
    capabilities:
    - chat
    - reasoning
    - architecture
    - research
    - code
    - text
  - name: openai/gpt5.4
    capabilities:
    - chat
    - frontier_reasoning
    - planning
    - synthesis
    - text
  - name: anthropic/claude-opus-4.6
    capabilities:
    - chat
    - legal_analysis
    - health_guidance
    - high_stakes
    - text
  - name: local/omni
    capabilities:
    - chat
    - image_understanding
    - multimodal
    - omni
    - text
    - vision
    modality: omni
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      conversation:
      - name: agent_has_images
        description: Request contains at least one image content part.
        feature:
          type: exists
          source:
            type: image_content
      - name: multi_turn_user
        feature:
          type: count
          source:
            type: message
            role: user
        predicate:
          gte: 2
      - name: has_tools
        feature:
          type: count
          source:
            type: tool_definition
        predicate:
          gte: 1
      - name: active_tool_use
        feature:
          type: count
          source:
            type: assistant_tool_call
        predicate:
          gte: 1
      - name: completed_tool_cycle
        feature:
          type: count
          source:
            type: assistant_tool_cycle
        predicate:
          gte: 1
      - name: current_tool_loop
        feature:
          type: exists
          source:
            type: active_tool_loop
      - name: heavy_non_user
        feature:
          type: count
          source:
            type: message
            role: non_user
        predicate:
          gt: 4
      keywords:
      - name: prompt_injection_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bignore (all )?(the )?previous instructions\b
        - \bignore the system instructions\b
        - \bdisregard the system prompt\b
        - \bbypass (every )?(safety|security) (rule|restriction)s?\b
        - \boverride (the )?policy\b
        - \breveal (the )?(hidden instructions|system prompt)\b
        - \bforget (all )?(of )?your rules\b
        - 忽略(所有)?之前的指令
        - 绕过(所有)?安全(限制|规则)
        - (泄露|透露)系统提示词
      - name: secret_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bapi[_ -]?key\b
        - \bsecret[_ -]?key\b
        - \baccess[_ -]?token\b
        - \boauth[_ -]?token\b
        - \bid[_ -]?token\b
        - \bprivate[_ -]?key\b
        - \bssh[_ -]?key\b
        - \bcredential(s)?\b
        - \bpassword\b
        - \bconnection[_ -]?string\b
        - \bwebhook[_ -]?secret\b
        - \bsigning[_ -]?secret\b
        - \bbearer\s+[A-Za-z0-9._~+/-]+=*\b
        - \bsk-[A-Za-z0-9_-]{8,}\b
        - 密钥
        - 凭据
        - 访问令牌
        - 私钥
        - 密码
      - name: personal_data_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \b\d{3}-\d{2}-\d{4}\b
        - \bssn\b
        - \bsocial security( number)?\b
        - \bcredit card\b
        - \bcard number\b
        - \bbank account\b
        - \biban\b
        - \bpassport number\b
        - \bdriver'?s? license\b
        - \bnational id\b
        - \bgovernment id\b
        - \bmedical record\b
        - \bpatient record\b
        - \bdate of birth\b
        - \bdob\b
        - \bhome address\b
        - \bphone number\b
        - \bemail address\b
        - \b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b
        - customer data
        - employee data
        - payroll record
        - hr spreadsheet
        - crm export
        - 客户数据
        - 员工数据
        - 身份证号
        - 手机号
        - 护照号
        - 银行卡号
        - 家庭住址
      - name: private_code_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bprivate repo(sitory)?\b
        - \binternal repo(sitory)?\b
        - '\bproprietary(?: internal)? (?:source )?code\b'
        - \bcompany codebase\b
        - \bour codebase\b
        - \binternal sdk\b
        - \bprivate package\b
        - \bconfidential code\b
        - \binternal monorepo\b
        - \bproprietary source\b
        - 私有仓库
        - 内部仓库
        - 公司代码
        - 私有代码
        - 保密代码
      - name: internal_doc_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \binternal document\b
        - \binternal doc\b
        - \binternal design doc(ument)?\b
        - \binternal ADR\b
        - \binternal RFC\b
        - \binternal runbook\b
        - \binternal incident review\b
        - \binternal postmortem\b
        - \bconfidential memo\b
        - \bconfidential board memo\b
        - \bconfidential board deck\b
        - \binternal board deck\b
        - \binternal-only document\b
        - \bemployee handbook\b
        - 内部文档
        - 内部设计文档
        - 内部备忘录
        - 保密备忘录
        - 内部运行手册
        - 内部事故复盘
        - 仅内部流转
      - name: local_only_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \blocal processing only\b
        - \blocal model only\b
        - \blocal only\b
        - \blocally only\b
        - \bon-prem(?:ises)? only\b
        - \bkeep (this|processing) local\b
        - \bdo not (send (this )?to the cloud|upload this)\b
        - \bconfidential handling\b
        - \binternal use only\b
        - \bhandle this locally\b
        - \buse (the )?local model\b
        - \brun locally\b
        - \bstay on the local model\b
        - \bprivate infrastructure\b
        - 仅本地处理
        - 不要发送到云端
      - name: simple_request_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bbriefly\b
        - \bquick answer\b
        - \bone sentence\b
        - \bsimple explanation\b
        - \bsummarize briefly\b
        - \bwhat is\b
        - \bwho is\b
        - \bdefine\b
        - 简单解释
        - 简短回答
      - name: agentic_request_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bagent(ic)?\b
        - \btool (loop|call)\b
        - \buse a tool\b
        - \brun a command\b
        - \b(read-only )?shell command\b
        - \bplan and execute\b
        - \brun until fixed\b
        - \biterate until it passes\b
        - \bcheckpoints?\b
        - \brollback (plan|criteria)\b
        - \bvalidation loop\b
        - \bmulti-step workflow\b
        - 分阶段实施
        - 回滚步骤
      - name: code_request_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bimplement\b
        - \brefactor\b
        - \bdebug\b
        - \bstack trace\b
        - \bfailing tests?\b
        - \bpull request\b
        - \brepositor(y|ies)\b
        - \bcodebase\b
        - \blint\b
        - \bkubernetes controller\b
        - \bdistributed system\b
        - \brate limiter\b
      - name: legal_risk_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bcontract risk\b
        - \bcompliance\b
        - \bindemnity\b
        - \blimitation[- ]of[- ]liability\b
        - \bprivacy policy\b
        - \bregulatory\b
        - \blegal memo\b
        - \bdata transfer agreement\b
      - name: health_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bsymptoms?\b
        - \bdiagnos(is|e)\b
        - \bmedical\b
        - \bmedication\b
        - \btreatment\b
        - \bclinical\b
        - \bdoctor\b
        - \bblood pressure\b
      - name: research_request_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bcite sources\b
        - \bwith evidence\b
        - \bcompare the evidence\b
        - \bliterature review\b
        - \bcompare studies\b
        - \bsource-backed\b
        - \breferences\b
        - \bsurvey the literature\b
        - \bresearch (approaches|methods?|synthesis)\b
      - name: reasoning_request_markers
        operator: OR
        method: regex
        case_sensitive: false
        keywords:
        - \bcompare (the )?tradeoffs\b
        - \broot cause\b
        - \barchitecture\b
        - \bdesign review\b
        - \breason (carefully|step by step)\b
        - \bevaluate options\b
        - \bsynthesize\b
        - \bfirst principles\b
      embeddings:
      - name: fast_qa
        aggregation_method: max
        threshold: 0.72
        candidates:
        - What is the capital of France?
        - Briefly explain what an API is.
        - What does CPU stand for?
        - Give me a quick summary of this paragraph.
        - 用一句话解释这个概念。
      - name: coding_workflows
        aggregation_method: max
        threshold: 0.75
        candidates:
        - Debug this Python stack trace and explain the likely bug.
        - Refactor this TypeScript module while preserving behavior.
        - Implement the feature and update the tests.
        - Fix the CI failure and rerun the relevant gate.
      - name: architecture_design
        aggregation_method: max
        threshold: 0.78
        candidates:
        - Design a distributed rate limiter and explain failure modes.
        - Plan a migration from a monolith to event-driven microservices.
        - Propose a consistency strategy for a global payments platform.
      - name: agentic_workflows
        aggregation_method: max
        threshold: 0.76
        candidates:
        - Create a migration plan with checkpoints, rollback, and validation.
        - Troubleshoot the production issue and iterate until it is fixed.
        - Break this project into tasks, dependencies, and acceptance checks.
        - Design an execution workflow with milestones, owners, and guardrails.
        - 给我一个分阶段实施方案，并包含校验与回滚步骤。
      - name: legal_analysis
        aggregation_method: max
        threshold: 0.78
        candidates:
        - Analyze indemnity, limitation of liability, and governing-law risks in this contract.
        - Draft a legal-risk memo for a cross-border data transfer policy.
        - Compare regulatory exposure under two compliance strategies.
      - name: health_guidance
        aggregation_method: max
        threshold: 0.77
        candidates:
        - Explain common causes of chest pain and when someone should seek urgent care.
        - Compare evidence-backed treatment options for type 2 diabetes management.
        - Summarize safe, clinically grounded steps for lowering high blood pressure.
      - name: research_synthesis
        aggregation_method: max
        threshold: 0.77
        candidates:
        - Compare several studies, cite the evidence, and explain the trade-offs.
        - Write a source-backed memo that synthesizes multiple references.
        - Survey the literature and recommend a position with supporting evidence.
      - name: business_analysis
        aggregation_method: max
        threshold: 0.75
        candidates:
        - Compare two pricing strategies for a B2B SaaS product.
        - Analyze CAC, LTV, and retention trade-offs for a subscription business.
        - Draft a market-entry strategy for a new AI tooling startup.
      - name: private_code_request
        aggregation_method: max
        threshold: 0.79
        candidates:
        - Review source code from a private repository and suggest a fix.
        - Debug proprietary backend code from our internal monorepo.
        - Refactor a confidential microservice from our company codebase.
        - Analyze an internal SDK source file and explain the risks.
        - 帮我分析公司私有仓库里的源代码。
      - name: pii_request
        aggregation_method: max
        threshold: 0.82
        candidates:
        - Review an HR spreadsheet containing employee phone numbers, home addresses, and government identifiers.
        - Analyze a CRM export with names, phone numbers, street addresses, and account numbers.
        - Process payroll records that include passport numbers, bank accounts, and home addresses.
        - Summarize a file containing employee personal identifiers and contact details.
        - 帮我处理包含手机号、家庭住址和身份证号的员工信息。
      - name: internal_document_request
        aggregation_method: max
        threshold: 0.86
        candidates:
        - Summarize this internal design document and highlight the risks.
        - Extract action items from a confidential board memo.
        - Analyze a private incident postmortem for follow-up actions.
        - Summarize this internal runbook and identify owners.
        - 帮我总结这份内部设计文档并提炼风险。
      context:
      - name: short_context
        min_tokens: '0'
        max_tokens: '999'
      - name: medium_context
        min_tokens: 1K
        max_tokens: '7999'
      - name: long_context
        min_tokens: 8K
        max_tokens: 256K
      structure:
      - name: ordered_workflow
        feature:
          type: sequence
          source:
            type: sequence
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - plan
              - execute
              - verify
            - - 先
              - 再
      - name: numbered_steps
        feature:
          type: exists
          source:
            type: regex
            pattern: (?m)^\s*\d+\.\s+
      - name: constraint_dense
        feature:
          type: density
          source:
            type: keyword_set
            keywords:
            - under
            - at most
            - at least
            - within
            - no more than
            - must
            - should
            - 不超过
            - 至少
        predicate:
          gt: 0.08
      complexity:
      - name: general_reasoning
        threshold: 0.14
        easy:
          candidates:
          - brief definition
          - quick summary
          - simple explanation
          - short direct answer
        hard:
          candidates:
          - compare several approaches and justify the trade-offs
          - synthesize constraints into a plan
          - root-cause analysis for a complex failure
          - derive the answer from first principles
      - name: code_task
        threshold: 0.12
        easy:
          candidates:
          - explain what this function does
          - fix a small bug in this code snippet
          - write a helper function
        hard:
          candidates:
          - design a distributed system with failure handling
          - debug a race condition in production
          - refactor a large service boundary safely
      - name: agentic_delivery
        threshold: 0.12
        easy:
          candidates:
          - give me a short checklist
          - suggest the next step only
          - write a small implementation plan
        hard:
          candidates:
          - create a migration plan with checkpoints, rollback, and validation
          - troubleshoot this production issue until the root cause is fixed
          - design an execution workflow with milestones, owners, and guardrails
          - automate the process and include verification after each phase
      - name: evidence_synthesis
        threshold: 0.12
        easy:
          candidates:
          - give a quick overview of the topic
          - summarize one article briefly
          - explain the term in simple language
        hard:
          candidates:
          - compare several sources and recommend the strongest evidence-backed position
          - write a source-backed memo that synthesizes multiple references
          - survey the literature and explain conflicting evidence with citations
      pii:
      - name: pii_strict
        threshold: 0.85
      domains:
      - name: computer science
        description: Programming, software systems, debugging, APIs, and infrastructure.
      - name: law
        description: Legal, compliance, policy, and regulatory topics.
      - name: health
        description: Health, medicine, clinical guidance, and patient-facing information.
      - name: math
        description: Mathematics, statistics, and quantitative reasoning.
      - name: physics
        description: Physics, chemistry, biology, engineering, and technical research.
      - name: business
        description: Business, product, operations, and management topics.
      - name: other
        description: General knowledge and miscellaneous topics.
    projections:
      scores:
      - name: security_risk_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: prompt_injection_markers
          value_source: confidence
          weight: 0.6
        - type: keyword
          name: local_only_markers
          value_source: confidence
          weight: 0.2
      - name: privacy_risk_score
        method: weighted_sum
        inputs:
        - type: pii
          name: pii_strict
          weight: 0.92
        - type: keyword
          name: local_only_markers
          value_source: confidence
          weight: 0.12
        - type: keyword
          name: private_code_markers
          value_source: confidence
          weight: 0.5
        - type: keyword
          name: internal_doc_markers
          value_source: confidence
          weight: 0.46
        - type: keyword
          name: secret_markers
          value_source: confidence
          weight: 0.72
        - type: keyword
          name: personal_data_markers
          value_source: confidence
          weight: 0.72
        - type: embedding
          name: private_code_request
          value_source: confidence
          weight: 0.22
        - type: embedding
          name: pii_request
          value_source: confidence
          weight: 0.24
        - type: embedding
          name: internal_document_request
          value_source: confidence
          weight: 0.22
        - type: context
          name: long_context
          weight: 0.04
      - name: difficulty_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: simple_request_markers
          value_source: confidence
          weight: -0.24
        - type: embedding
          name: fast_qa
          value_source: confidence
          weight: -0.22
        - type: context
          name: short_context
          weight: -0.1
        - type: context
          name: medium_context
          weight: 0.06
        - type: context
          name: long_context
          weight: 0.18
        - type: keyword
          name: reasoning_request_markers
          value_source: confidence
          weight: 0.18
        - type: keyword
          name: code_request_markers
          value_source: confidence
          weight: 0.1
        - type: keyword
          name: research_request_markers
          value_source: confidence
          weight: 0.14
        - type: keyword
          name: agentic_request_markers
          value_source: confidence
          weight: 0.16
        - type: embedding
          name: coding_workflows
          value_source: confidence
          weight: 0.12
        - type: embedding
          name: architecture_design
          value_source: confidence
          weight: 0.18
        - type: embedding
          name: agentic_workflows
          value_source: confidence
          weight: 0.2
        - type: embedding
          name: research_synthesis
          value_source: confidence
          weight: 0.16
        - type: structure
          name: ordered_workflow
          weight: 0.1
        - type: structure
          name: numbered_steps
          weight: 0.06
        - type: structure
          name: constraint_dense
          weight: 0.05
        - type: complexity
          name: general_reasoning:medium
          weight: 0.08
        - type: complexity
          name: general_reasoning:hard
          weight: 0.2
        - type: complexity
          name: code_task:hard
          weight: 0.16
        - type: complexity
          name: agentic_delivery:hard
          weight: 0.22
        - type: complexity
          name: evidence_synthesis:hard
          weight: 0.18
      - name: agentic_pressure
        method: weighted_sum
        inputs:
        - type: conversation
          name: current_tool_loop
          weight: 0.34
        - type: conversation
          name: active_tool_use
          weight: 0.04
        - type: conversation
          name: completed_tool_cycle
          weight: 0.04
        - type: conversation
          name: has_tools
          weight: 0.06
        - type: conversation
          name: multi_turn_user
          weight: 0.04
        - type: conversation
          name: heavy_non_user
          weight: 0.04
        - type: keyword
          name: agentic_request_markers
          value_source: confidence
          weight: 0.18
        - type: embedding
          name: agentic_workflows
          value_source: confidence
          weight: 0.06
        - type: structure
          name: ordered_workflow
          weight: 0.1
        - type: complexity
          name: agentic_delivery:hard
          weight: 0.18
      mappings:
      - name: security_policy_band
        source: security_risk_score
        method: threshold_bands
        outputs:
        - name: policy_security_standard
          lt: 0.3
        - name: policy_security_local_only
          gte: 0.3
      - name: privacy_policy_band
        source: privacy_risk_score
        method: threshold_bands
        outputs:
        - name: policy_privacy_cloud_allowed
          lt: 0.35
        - name: policy_privacy_local_only
          gte: 0.35
      - name: difficulty_band
        source: difficulty_score
        method: threshold_bands
        outputs:
        - name: balance_simple
          lt: 0.2
        - name: balance_medium
          gte: 0.2
          lt: 0.45
        - name: balance_complex
          gte: 0.45
          lt: 0.7
        - name: balance_reasoning
          gte: 0.7
      - name: agentic_band
        source: agentic_pressure
        method: threshold_bands
        outputs:
        - name: non_agentic
          lt: 0.3
        - name: agentic_workflow
          gte: 0.3
    decisions:
    - name: local_security_containment
      description: Keep prompt-injection or jailbreak-like prompts on the local AMD model.
      priority: 340
      tier: 1
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_security_local_only
      adaptations:
        mode: bypass
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          capture_request_body: true
          capture_response_body: true
          max_body_bytes: 2048
          max_tool_trace_steps: 100
    - name: omni
      description: Understand image-bearing requests locally without bypassing security containment.
      priority: 330
      tier: 1
      rules:
        operator: OR
        conditions:
        - type: conversation
          name: agent_has_images
      algorithm:
        type: static
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          capture_request_body: true
          capture_response_body: true
          max_body_bytes: 2048
          max_tool_trace_steps: 100
    - name: local_privacy_policy
      description: Route private code, internal documents, credentials, and PII-like requests to the local AMD model.
      priority: 320
      tier: 1
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_local_only
        - operator: NOT
          conditions:
          - type: projection
            name: policy_security_local_only
      adaptations:
        mode: bypass
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          capture_request_body: true
          capture_response_body: true
          max_body_bytes: 2048
          max_tool_trace_steps: 100
    - name: simple_math_fast_path
      description: Keep simple math and short factual STEM questions on the simple local alias.
      priority: 300
      tier: 2
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - type: domain
          name: math
        - operator: OR
          conditions:
          - type: projection
            name: balance_simple
          - type: keyword
            name: simple_request_markers
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          capture_request_body: true
          capture_response_body: true
          max_body_bytes: 2048
          max_tool_trace_steps: 100
    - name: domain_legal_health
      description: Non-private legal, compliance, and health requests route to the high-care domain alias.
      priority: 260
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: OR
          conditions:
          - type: domain
            name: law
          - type: domain
            name: health
          - type: keyword
            name: legal_risk_markers
          - type: keyword
            name: health_markers
          - type: embedding
            name: legal_analysis
          - type: embedding
            name: health_guidance
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          max_body_bytes: 4096
    - name: domain_code_complex
      description: Non-private complex coding, architecture, and software-system requests route to stronger technical aliases.
      priority: 255
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: OR
          conditions:
          - type: keyword
            name: code_request_markers
          - operator: AND
            conditions:
            - type: domain
              name: computer science
            - operator: OR
              conditions:
              - type: embedding
                name: coding_workflows
              - type: embedding
                name: architecture_design
        - operator: OR
          conditions:
          - type: projection
            name: balance_complex
          - type: projection
            name: balance_reasoning
          - type: embedding
            name: architecture_design
          - type: complexity
            name: general_reasoning:hard
          - type: complexity
            name: code_task:hard
        - operator: NOT
          conditions:
          - type: projection
            name: balance_simple
        - operator: NOT
          conditions:
          - type: embedding
            name: fast_qa
        - operator: NOT
          conditions:
          - type: keyword
            name: simple_request_markers
        - operator: NOT
          conditions:
          - type: keyword
            name: research_request_markers
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          max_body_bytes: 4096
    - name: domain_code
      description: Non-private medium coding, repository, and software-system requests route to the code-capable domain alias.
      priority: 250
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: OR
          conditions:
          - type: keyword
            name: code_request_markers
          - operator: AND
            conditions:
            - type: domain
              name: computer science
            - type: embedding
              name: coding_workflows
        - operator: NOT
          conditions:
          - operator: OR
            conditions:
            - type: projection
              name: balance_complex
            - type: projection
              name: balance_reasoning
            - type: keyword
              name: reasoning_request_markers
            - type: embedding
              name: architecture_design
            - type: complexity
              name: general_reasoning:hard
            - type: complexity
              name: code_task:hard
        - operator: NOT
          conditions:
          - type: keyword
            name: research_request_markers
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          max_body_bytes: 4096
    - name: domain_stem_research
      description: Non-private math, science, research, and evidence-heavy requests route to the STEM/research alias.
      priority: 240
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: OR
          conditions:
          - type: domain
            name: math
          - type: domain
            name: physics
          - type: keyword
            name: research_request_markers
        - operator: NOT
          conditions:
          - operator: OR
            conditions:
            - type: projection
              name: balance_simple
            - type: domain
              name: business
            - type: embedding
              name: business_analysis
            - type: embedding
              name: fast_qa
            - type: keyword
              name: simple_request_markers
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          max_body_bytes: 4096
    - name: domain_business
      description: Non-private business and product-analysis requests route to the medium domain alias.
      priority: 230
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: OR
          conditions:
          - type: domain
            name: business
          - type: embedding
            name: business_analysis
        - operator: NOT
          conditions:
          - operator: OR
            conditions:
            - type: projection
              name: balance_complex
            - type: projection
              name: balance_reasoning
            - type: keyword
              name: reasoning_request_markers
            - type: embedding
              name: architecture_design
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          max_body_bytes: 4096
    - name: complex_general
      description: Non-private complex or reasoning-heavy work routes to stronger aliases.
      priority: 190
      tier: 4
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: OR
          conditions:
          - type: projection
            name: balance_complex
          - type: projection
            name: balance_reasoning
          - type: keyword
            name: reasoning_request_markers
          - type: keyword
            name: agentic_request_markers
          - type: projection
            name: agentic_workflow
        - operator: NOT
          conditions:
          - operator: OR
            conditions:
            - type: keyword
              name: code_request_markers
            - type: domain
              name: math
            - type: domain
              name: physics
            - type: keyword
              name: research_request_markers
            - operator: AND
              conditions:
              - type: domain
                name: computer science
              - type: embedding
                name: coding_workflows
      plugins:
      - type: router_replay
        configuration:
          enabled: true
          max_records: 10000
          max_body_bytes: 4096
    - name: medium_general
      description: Non-private medium-difficulty explanations and follow-ups route to the medium alias.
      priority: 150
      tier: 5
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - type: projection
          name: balance_medium
    - name: simple_general
      description: Simple or otherwise unmatched traffic uses the local fallback.
      priority: 80
      tier: 6
entrypoints:
- recipe: default
  assignments:
    local_security_containment:
      models:
      - model: qwen/qwen3.6-rocm
        weight: '1'
    local_privacy_policy:
      models:
      - model: qwen/qwen3.6-rocm
        weight: '1'
    simple_math_fast_path:
      models:
      - model: qwen/qwen3.6-rocm
        weight: '1'
    domain_legal_health:
      models:
      - model: anthropic/claude-opus-4.6
        weight: '1'
    domain_code_complex:
      models:
      - model: google/gemini-3.1-pro
        weight: '1'
      - model: openai/gpt5.4
        weight: '1'
    domain_code:
      models:
      - model: google/gemini-2.5-flash-lite
        weight: '1'
      - model: google/gemini-3.1-pro
        weight: '1'
    domain_stem_research:
      models:
      - model: google/gemini-3.1-pro
        weight: '1'
      - model: openai/gpt5.4
        weight: '1'
    domain_business:
      models:
      - model: google/gemini-2.5-flash-lite
        weight: '1'
    complex_general:
      models:
      - model: google/gemini-3.1-pro
        weight: '1'
      - model: openai/gpt5.4
        weight: '1'
    medium_general:
      models:
      - model: google/gemini-2.5-flash-lite
        weight: '1'
    simple_general:
      models:
      - model: qwen/qwen3.6-rocm
        weight: '1'
    omni:
      models:
      - model: local/omni
        weight: '1'
  model_names:
  - vllm-sr/auto
global:
  billing:
    currency: USD
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
      max_responses: 1000
    router_replay:
      enabled: true
      store_backend: postgres
      ttl_seconds: 2592000
      async_writes: false
      postgres:
        host: postgres
        port: 5432
        database: vsr
        user: router
        password: ${POSTGRES_PASSWORD}
        ssl_mode: disable
        table_name: router_replay_records
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  router:
    learning:
      enabled: true
      adaptation:
        enabled: true
        candidate_set: decision
        strategy: routing_sampling
      protection:
        enabled: true
        scope: conversation
        identity:
          headers:
            session: x-session-id
            conversation: x-conversation-id
        tuning:
          idle_timeout_seconds: 300
          min_turns_before_switch: 1
          switch_margin: 0.05
          stability_weight: 1.0
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
