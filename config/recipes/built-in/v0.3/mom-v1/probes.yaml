  - id: speed_heavy_workload__heavy_en
    query: Design the consistency protocol for a multi-region checkout cache. Compare write-invalidation against
      versioned cache entries, derive how reads and writes must be ordered, and prove whether each protocol
      prevents stale prices after an acknowledged update. Explain the tradeoffs in latency, communication
      cost and recovery when a region crashes halfway through an update.
    tags:
    - language:en
    - heavy
    - positive
    - demo
    expected_signals:
      complexity:
      - difficulty:hard
    notes: Substantive architecture analysis and competing failure modes require a reasoning-quality policy; response
      length alone is insufficient.
