  variants:
  - id: vault_long_image__image_within_triage_budget
    display_prompt: Analyze the attached image with the long neutral record and explain the most important visual
      finding.
    playground:
      enabled: false
      reason: This long-input fixture is validated in Eval and is intentionally disabled in Playground.
    messages:
    - role: user
      content:
      - type: text
        text: 'Summarize this public exhibition record about paper shapes and their arrangements.


          The public exhibition contains paper circles, wooden cubes, cardboard triangles, and strips of colored
          fabric. The objects sit on broad tables near illustrated display boards. Their arrangement makes
          differences in shape, texture, and size visible from several positions around the room. Small printed
          labels name the ordinary materials used in each display.


          The blue board shows three large circles across its upper half and two rectangles near the lower
          edge. Thin gray lines connect the circles with the rectangles. A small legend identifies the circles
          as collections and the rectangles as individual examples. The background is plain white, leaving
          generous space between the colored shapes.


          At the next table, circles cut from yellow paper form a loose ring around a green square. The pieces
          are flat and their edges are visible. Beside this arrangement, another group contains the same shapes
          in a straight row. Both groups use equal numbers of pieces, although their overall outlines look
          quite different.


          The wooden objects occupy a separate low shelf. Smooth cubes stand beside short cylinders and shallow
          cones. The cubes have straight edges and flat faces, while the cylinders have curved sides. A lamp
          above the shelf produces soft shadows that make these differences easier to notice. None of the
          objects is enclosed behind glass.


          A fabric panel hangs beside a collection of small cardboard frames. Wide blue strips alternate with
          narrow orange strips across the panel. The frames contain similar patterns made from paper. The
          comparison shows how a familiar arrangement can look different when its material changes. The labels
          describe texture, flexibility, and the way each surface reflects light.


          The central display contains three shallow trays. One tray holds small circles, another holds medium
          circles, and the last contains large circles. A nearby tray mixes all three sizes together. The
          grouped arrangement makes the range of sizes easy to compare. The mixed arrangement reveals how
          much empty space remains between pieces of different sizes.


          The diagram on the wall represents the tables as rectangles with rounded corners. A curved dotted
          line joins them in a broad loop. Tiny squares beside the rectangles indicate the illustrated labels.
          The diagram includes a clear margin around its perimeter. Its colors correspond to the colored panels
          beside the actual tables in the exhibition.


          Another board compares a single layer of shapes with a small stack. In the flat version, every outline
          is visible. In the stacked version, parts of the lower pieces disappear beneath the upper pieces.
          The side view shows the thickness of the layers. These drawings describe familiar physical relationships
          without relying on specialized symbols or technical vocabulary.


          The display materials include reusable trays, open stands, small boxes, and broad support boards.
          Trays keep loose pieces together on the tables. Open stands hold the descriptive cards upright.
          Small boxes contain additional examples of each material. The broad boards provide a plain background
          for the larger arrangements. Each kind of support has a distinct visual role.


          A set of postcards repeats the main patterns in miniature. One card shows a row of alternating triangles
          and circles. Another shows a group of rectangles inside a larger outline. A third contains three
          nested rings. The postcards have the same simple color palette as the wall diagrams, which makes
          their relationship to the larger displays easy to recognize.


          The final table compares two versions of a paper arrangement. The first contains many small pieces
          spread across a wide area. The second uses fewer, larger pieces placed closer together. Both versions
          contain a central group and several smaller groups around it. Their different spacing produces a
          noticeably different impression despite their shared basic organization.


          The exhibit record ends with an overview of the visible collection. Paper and fabric contribute
          color and texture, wooden objects provide solid forms, and boards provide a background for comparison.
          Lines and spacing show relationships between groups. The material is intended for a general audience
          interested in everyday shapes, with examples that remain understandable without prior study.


          Describe the attached diagram and explain how its visual groups relate to this exhibition record.'
      - type: image_fixture
        fixture: mom_v1_architecture
    tags:
    - language:en
    - shape:messages
    - multimodal
    - image
    - stress:long-input
    - positive
    - supported
    - context:within-triage-budget
    - tools
