        language:
          - {name: en, threshold: 0.5, description: English-language request.}
          - {name: zh, threshold: 0.5, description: Chinese-language request.}
          - {name: es, threshold: 0.5, description: Spanish-language request.}
          - {name: fr, threshold: 0.5, description: French-language request.}
          - {name: ja, threshold: 0.5, description: Japanese-language request.}
          - {name: de, threshold: 0.5, description: German-language request.}
          - {name: pt, threshold: 0.5, description: Portuguese-language request.}
          - {name: ko, threshold: 0.5, description: Korean-language request.}
          - {name: ar, threshold: 0.5, description: Arabic-language request.}
          - {name: hi, threshold: 0.5, description: Hindi-language request.}
          - {name: ru, threshold: 0.5, description: Russian-language request.}
        conversation:
          - name: accuracy_has_images
            description: Request contains at least one image content part.
            feature:
              type: exists
              source:
                type: image_content
          - name: accuracy_multiple_tools_available
            description: Requests with two or more tools can support bounded workflow decomposition.
            feature:
              type: count
              source:
                type: tool_definition
            predicate:
              gte: 2
          - name: accuracy_active_tool_loop
            description: Detect a request actively continuing a client-owned tool loop, including an outstanding assistant tool call.
            feature:
              type: exists
              source:
                type: active_tool_loop
          - name: accuracy_has_tool_result
            description: Detect at least one completed client tool result that can be synthesized.
            feature:
              type: count
              source:
                type: assistant_tool_cycle
            predicate:
              gte: 1
        context:
          - name: accuracy_at_least_16k_context
            min_tokens: 16K
            max_tokens: "2147483647"
            description: Text and tool requests from 16K upward qualify for confidence-based verification.
          - name: accuracy_context_from_120k_to_240k
            min_tokens: "120001"
            max_tokens: "240000"
            description: The 120K-240K image band preserves reserve on the native-262K local frontier backend.
          - name: accuracy_exceeds_240k_context
            min_tokens: "240001"
            max_tokens: "2147483647"
            description: Inputs beyond 240K require a modality-preserving terminal lane.
        structure:
          - name: accuracy_ordered_workflow
            description: Detect prompts that explicitly describe a multi-stage workflow.
            feature:
              type: sequence
              source:
                type: sequence
                sequences:
                  - [first, then]
                  - [first, next, finally]
                  - [首先, 然后]
                  - [先, 再]
                  - [primero, luego]
                  - [d'abord, puis]
                  - [zuerst, dann]
                  - [primeiro, depois]
                  - [まず, 次に]
                  - [먼저, 다음]
                  - [أولاً, ثم]
                  - [पहले, फिर]
                  - [сначала, затем]
          - name: accuracy_constraint_dense
            description: Detect dense correctness and structured-output constraints.
            feature:
              type: density
              source:
                type: keyword_set
                keywords: [must, exactly, at least, at most, verify, JSON, schema, 必须, 严格, 至少, 不超过, debe, exactement, muss, deve, 厳密, 반드시, يجب, अनिवार्य, строго]
            predicate:
              gt: 0.08
          - name: accuracy_direct_reference
            description: Detect requests that quote orchestration vocabulary only to define, translate, or briefly explain it.
            feature:
              type: exists
              source:
                type: regex
                pattern: >-
                  (?i)(\b(define|translate|explain)\b.{0,48}\b(phrase|term|expression)\b|(définis|traduis|explique).{0,48}(expression|terme)|(define|traduce|explica).{0,48}(frase|expresión|término)|(definiere|übersetze|erkläre).{0,48}(ausdruck|begriff)|(defina|traduza|explique).{0,48}(frase|expressão|ter(?:mo))|(정의|번역|설명).{0,16}(문구|표현|용어|“|「)|(عرّف|ترجم|اشرح).{0,32}(العبارة|التعبير|المصطلح)|(परिभाषित|अनुवाद|समझाइए).{0,32}(वाक्यांश|अभिव्यक्ति|शब्द)|(определи|переведи|объясни).{0,48}(фразу|выражение|термин)|(定义|翻译|解释).{0,16}(短语|词语|“|「)|(説明|翻訳).{0,16}(表現|語句|「)|(["“「][^"”」]{1,120}["”」]).{0,80}(define|translate|explain|설명|정의|번역|اشرح|عرّف|ترجم|समझाइए|परिभाषित|अनुवाद|объясни|определи|переведи|解释|定义|翻译|説明|翻訳))
        complexity:
          - name: accuracy_complexity
            threshold: 0.15
            description: Semantic boundary for tasks that merit bounded multi-round reasoning.
            easy:
              candidates:
                - Explain a familiar concept in plain language.
                - Summarize a short paragraph.
                - Answer a direct factual question.
            hard:
              candidates:
                - Prove a difficult result by exploring multiple possible derivations.
                - Diagnose a complex distributed-system failure with incomplete evidence.
                - Synthesize competing scientific explanations into a rigorous conclusion.
                - 从多个推理路径证明困难结论并综合最严谨答案。
                - استكشف اشتقاقات متعددة وأثبت نتيجة صعبة بدقة.
      projections:
        scores:
          - name: accuracy_dynamic_workflow_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: accuracy_workflow_request_phrases, weight: 0.7, value_source: confidence}
              - {type: embedding, name: accuracy_dynamic_workflow_intent, weight: 0.55, value_source: confidence}
              - {type: conversation, name: accuracy_multiple_tools_available, weight: 0.1}
              - {type: conversation, name: accuracy_active_tool_loop, weight: 0.1}
              - {type: structure, name: accuracy_ordered_workflow, weight: 0.25}
              - {type: structure, name: accuracy_direct_reference, weight: -1.2}
          - name: accuracy_expert_fusion_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: accuracy_expert_fusion_request_phrases, weight: 0.7, value_source: confidence}
              - {type: embedding, name: accuracy_expert_fusion_intent, weight: 0.55, value_source: confidence}
              - {type: structure, name: accuracy_constraint_dense, weight: 0.1}
              - {type: structure, name: accuracy_direct_reference, weight: -1.2}
          - name: accuracy_verification_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: accuracy_verification_request_phrases, weight: 0.7, value_source: confidence}
              - {type: embedding, name: accuracy_verification_intent, weight: 0.55, value_source: confidence}
              - {type: structure, name: accuracy_constraint_dense, weight: 0.1}
              - {type: structure, name: accuracy_direct_reference, weight: -1.2}
          - name: accuracy_multi_round_exploration_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: accuracy_multi_round_exploration_phrases, weight: 0.45, value_source: confidence}
              - {type: embedding, name: accuracy_multi_round_exploration_intent, weight: 0.35, value_source: confidence}
              - {type: structure, name: accuracy_ordered_workflow, weight: 0.15}
              - {type: structure, name: accuracy_constraint_dense, weight: 0.1}
              - {type: complexity, name: 'accuracy_complexity:hard', weight: 0.35}
              - {type: complexity, name: 'accuracy_complexity:easy', weight: -0.1}
              - {type: structure, name: accuracy_direct_reference, weight: -1.2}
              - {type: language, name: en, weight: 0.02}
              - {type: language, name: zh, weight: 0.02}
              - {type: language, name: es, weight: 0.02}
              - {type: language, name: fr, weight: 0.02}
              - {type: language, name: ja, weight: 0.02}
              - {type: language, name: de, weight: 0.02}
              - {type: language, name: pt, weight: 0.02}
              - {type: language, name: ko, weight: 0.02}
              - {type: language, name: ar, weight: 0.02}
              - {type: language, name: hi, weight: 0.02}
              - {type: language, name: ru, weight: 0.02}
        mappings:
          - name: accuracy_dynamic_workflow_band
            source: accuracy_dynamic_workflow_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 12}
            outputs:
              - {name: accuracy_direct_without_workflow, lt: 0.5}
              - {name: accuracy_requires_dynamic_workflow, gte: 0.5}
          - name: accuracy_expert_fusion_band
            source: accuracy_expert_fusion_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 12}
            outputs:
              - {name: accuracy_direct_without_expert_fusion, lt: 0.5}
              - {name: accuracy_requires_expert_fusion, gte: 0.5}
          - name: accuracy_verification_band
            source: accuracy_verification_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 12}
            outputs:
              - {name: accuracy_direct_without_confidence_escalation, lt: 0.45}
              - {name: accuracy_requires_confidence_escalation, gte: 0.45}
          - name: accuracy_multi_round_exploration_band
            source: accuracy_multi_round_exploration_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 10}
            outputs:
              - {name: accuracy_direct_single_pass, lt: 0.35}
              - {name: accuracy_requires_multi_round_exploration, gte: 0.35}
      decisions:
        - name: omni
          description: Route image understanding directly to the dedicated local visual-language model.
          priority: 590
          rules:
            operator: OR
            conditions:
              - type: conversation
                name: accuracy_has_images
          modelRefs:
            - model: local/qwen3.6-27b-omni
              use_reasoning: false
          algorithm:
            type: static
        - name: resume
          description: Finish the current tool turn without opening another tool or model loop.
          priority: 600
          rules:
            operator: AND
            conditions:
              - type: conversation
                name: accuracy_active_tool_loop
              - type: conversation
                name: accuracy_has_tool_result
