            \u0629 \u0623\u0646\u0645\u0627\u0637 \u0644\u0644\u0641\u0634\u0644."
        name: speed_complexity
        threshold: 0.1
      context:
      - description: The 30K-60K band records conservative context use within the
          native-262K latency pool.
        max_tokens: '60000'
        min_tokens: '30001'
