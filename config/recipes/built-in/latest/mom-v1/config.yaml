        - "\u0915\u094D\u0932\u093E\u0909\u0921 \u092A\u0930 \u0928 \u092D\u0947\u091C\
          \u0947\u0902"
        - "\u0928\u093F\u091C\u0940 \u0930\u093F\u092A\u0949\u091C\u093C\u093F\u091F\
          \u0930\u0940"
        - "\u0442\u043E\u043B\u044C\u043A\u043E \u043B\u043E\u043A\u0430\u043B\u044C\
