        method: regex
        name: vault_sensitive_request_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - \bpublic information\b
        - \bpublic cloud\b
        - \bpublic open-source\b
        - \bpublicly documented\b
        - "\u516C\u5F00\u4FE1\u606F"
        - "\u516C\u6709\u4E91"
        - "\u516C\u5171\u5F00\u6E90\u9879\u76EE"
        - "informaci\xF3n p\xFAblica"
        - informations publiques
        - "\u516C\u958B\u60C5\u5831"
        - "\xF6ffentliche informationen"
        - "informa\xE7\xF5es p\xFAblicas"
        - "\uACF5\uAC1C \uC815\uBCF4"
        - "\u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0639\u0627\u0645\u0629"
        - "\u0938\u093E\u0930\u094D\u0935\u091C\u0928\u093F\u0915 \u091C\u093E\u0928\
          \u0915\u093E\u0930\u0940"
        - "\u043E\u0431\u0449\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0430\
          \u044F \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u044F"
        method: regex
        name: vault_public_information_phrases
        operator: OR
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 12
        method: threshold_bands
        name: vault_risk_band
        outputs:
        - lt: 0.35
          name: vault_standard_risk
        - gte: 0.35
          name: vault_sensitive_risk
        source: vault_risk_score
      scores:
      - inputs:
        - name: vault_sensitive_request_phrases
          type: keyword
          value_source: confidence
          weight: 0.75
        - name: vault_public_information_phrases
          type: keyword
          value_source: confidence
          weight: -0.5
        - name: vault_detects_jailbreak
          type: jailbreak
          weight: 0.9
        - name: vault_attack_request_phrases
          type: keyword
          value_source: confidence
          weight: 0.9
        - name: vault_privacy_policy
          type: kb
          value_source: confidence
          weight: 0.15
        method: weighted_sum
        name: vault_risk_score
    decisions:
    - algorithm:
        type: static
      description: Keep private image understanding on the dedicated local visual-language
        model.
      name: omni
      plugins:
      - configuration:
          enabled: true
          mode: none
          strip_tool_history: true
        type: tools
      - configuration:
          enabled: false
        type: router_replay
      priority: 550
      rules:
        conditions:
        - name: vault_has_images
          type: conversation
        operator: OR
    - algorithm:
        type: static
      description: Keep private, multimodal, and long-context work on the strongest
        local boundary.
      name: sensitive
      plugins:
      - configuration:
          enabled: true
          mode: none
          strip_tool_history: true
        type: tools
      - configuration:
          enabled: false
        type: router_replay
      priority: 500
      rules:
        conditions:
        - conditions:
          - name: vault_sensitive_risk
            type: projection
          - name: vault_has_images
            type: conversation
          - name: vault_context_from_120k_to_240k
            type: context
          - name: vault_exceeds_240k_context
            type: context
          operator: OR
        - conditions:
          - name: vault_attack_request_phrases
            type: keyword
          operator: NOT
        - conditions:
          - name: vault_detects_jailbreak
            type: jailbreak
          operator: NOT
        operator: AND
    - algorithm:
        type: static
      description: Isolate suspicious requests on a strong local model with external
        actions disabled.
      name: containment
      plugins:
      - configuration:
          enabled: true
          mode: none
          strip_tool_history: true
        type: tools
      - configuration:
          enabled: false
        type: router_replay
      priority: 700
      rules:
        conditions:
        - name: vault_attack_request_phrases
          type: keyword
        - name: vault_detects_jailbreak
          type: jailbreak
        operator: OR
    - algorithm:
        type: static
      description: Keep tool-bearing requests local while removing every external
        action surface.
      name: restricted_tools
      plugins:
      - configuration:
          enabled: true
          mode: none
          strip_tool_history: true
        type: tools
      - configuration:
          enabled: false
        type: router_replay
      priority: 600
      rules:
        conditions:
        - name: vault_has_tools
          type: conversation
        - conditions:
          - name: vault_has_images
            type: conversation
          operator: NOT
        operator: AND
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.3
            latency: 0.2
            load: 0.2
            quality: 0.3
        type: multi_factor
      description: Fail closed to a local multimodal pool with external actions disabled.
      name: private
      plugins:
      - configuration:
          enabled: true
          mode: none
          strip_tool_history: true
        type: tools
      - configuration:
          enabled: false
        type: router_replay
      priority: 10
    strategy: priority
