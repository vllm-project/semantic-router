                  - [first, next, finally]
                  - [首先, 然后]
                  - [先, 再]
                  - [primero, luego]
                  - [d'abord, puis]
                  - [zuerst, dann]
                  - [primeiro, depois]
                  - [まず, 次に]
                  - [먼저, 다음]
