          \ \u092A\u0924\u093E|\u092A\u093E\u0938\u092A\u094B\u0930\u094D\u091F \u0928\
          \u0902\u092C\u0930)"
        - "(\u043D\u043E\u043C\u0435\u0440 \u043F\u0430\u0441\u043F\u043E\u0440\u0442\
          \u0430|\u0430\u0434\u0440\u0435\u0441 \u044D\u043B\u0435\u043A\u0442\u0440\
