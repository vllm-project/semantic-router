routing:
  strategy: priority
  modelCards:
    - name: local/qwen3.5-9b
      param_size: 9B
      context_window_size: 262144
      description: Economy dense tier for efficient long-context text and tool traffic.
      capabilities: [chat, reasoning, tools, structured-output, long-context]
      quality_score: 0.76
      modality: ar
      tags: [tier:economy, precision:bf16, tp:1, node:node-a]
    - name: local/qwen3.6-35b
      param_size: 35B-A3B
      context_window_size: 262144
      description: Fast sparse tier for long-context reasoning, code, and vision.
      capabilities: [chat, reasoning, code, tools, vision, multimodal, structured-output, long-context]
      quality_score: 0.86
      modality: ar
      tags: [tier:fast, precision:fp8, tp:1, node:node-a]
    - name: local/step-3.7-flash
      param_size: 198B-A11B
      context_window_size: 65536
      description: Frontier flash tier with multimodal understanding enabled.
      capabilities: [chat, reasoning, tools, vision, multimodal]
      quality_score: 0.93
      modality: ar
      tags: [tier:frontier-flash, precision:fp8, tp:2, node:node-a]
    - name: local/qwen3.5-122b
      param_size: 122B-A10B
      context_window_size: 131072
      description: Accuracy-first sparse tier for synthesis and review.
      capabilities: [chat, reasoning, code, tools, vision, multimodal, long-context]
      quality_score: 0.92
      modality: ar
      tags: [tier:frontier, precision:fp8, tp:1, node:node-a]
    - name: local/mistral-small-4
      param_size: 119B
      context_window_size: 131072
      description: Provider-diverse tier for independent analysis and code review.
      capabilities: [chat, reasoning, code, tools, vision, multimodal, long-context]
      quality_score: 0.91
      modality: ar
      tags: [tier:frontier, precision:fp8, tp:2, node:node-a]
    - name: local/gpt-oss-120b
      param_size: 120B
      context_window_size: 131072
      description: Open-weight reasoning tier used for isolated local handling.
      capabilities: [chat, reasoning, code, tools]
      quality_score: 0.9
      modality: ar
      tags: [tier:private, precision:mxfp4, tp:1, node:node-a]
    - name: local/glm-5.2
      param_size: 743B-A39B
      context_window_size: 524288
      description: Text-only frontier tier for high-accuracy synthesis and long-context reasoning.
      capabilities: [chat, reasoning, code, tools, structured-output, long-context]
      quality_score: 0.97
      modality: ar
      tags: [tier:frontier, precision:fp8, tp:8, node:node-b, text-only]

entrypoints:
  - model_names: [vllm-sr/mom-v1-blend]
    recipe: balance
  - model_names: [vllm-sr/mom-v1-lite]
    recipe: cost
  - model_names: [vllm-sr/mom-v1-flash]
    recipe: speed
  - model_names: [vllm-sr/mom-v1-ultra]
    recipe: accuracy
  - model_names: [vllm-sr/mom-v1-vault]
    recipe: vault

recipes:
  - name: balance
    description: A balanced model optimized across quality, speed, and cost.
    routing:
      signals:
        keywords:
          - name: balance_simple_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - quick answer
              - answer briefly
              - one sentence
              - concise summary
              - 简单回答
              - 简要说明
              - 简短回答
              - respuesta breve
              - réponse brève
              - 簡潔に答えて
              - kurz antworten
              - resposta breve
              - 짧게 답해
              - إجابة مختصرة
              - संक्षिप्त उत्तर
              - краткий ответ
          - name: balance_concise_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - concise and direct
              - brief and direct
              - 简洁直接
              - 简短直接
              - breve y directa
              - brève et directe
              - 簡潔で直接的
              - kurz und direkt
              - breve e direta
              - 간결하고 직접적으로
              - موجز ومباشر
              - संक्षिप्त और सीधा
              - кратко и прямо
          - name: balance_reasoning_opt_out_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - do not analyze
              - don't analyze
              - without analysis
              - 不要分析
              - 无需分析
              - no analices
              - sans analyse
              - 分析しない
              - nicht analysieren
              - sem análise
              - 분석하지 마
              - دون تحليل
              - विश्लेषण मत करो
              - без анализа
          - name: balance_deliberate_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - analyze the tradeoffs
              - from first principles
              - root cause
              - reason step by step
              - compare the alternatives carefully
              - 分析取舍
              - 第一性原理
              - 根因分析
              - 逐步推理
              - analizar las ventajas y desventajas
              - causa raíz
              - analyser les compromis
              - cause racine
              - トレードオフを分析
              - 根本原因
              - kompromisse analysieren
              - ursache analysieren
              - analisar as compensações
              - causa raiz
              - 트레이드오프를 분석
              - 근본 원인
              - حلل المفاضلات
              - السبب الجذري
              - समझौतों का विश्लेषण
              - मूल कारण
              - проанализируй компромиссы
              - первопричина
          - name: balance_verification_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - verify the answer
              - cite sources
              - fact-check
              - check the evidence
              - 核实答案
              - 引用来源
              - verificar la respuesta
              - citer les sources
              - 答えを検証
              - quellen zitieren
              - verificar a resposta
              - 답변을 검증
              - تحقق من الإجابة
              - उत्तर सत्यापित करें
              - проверь ответ
          - name: balance_correction_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - that's wrong
              - wrong answer
              - please correct the answer
              - try again
              - 回答错了
              - 请纠正答案
              - la respuesta es incorrecta
              - corrige la respuesta
              - la réponse est incorrecte
              - corrige la réponse
              - 回答が間違っています
              - bitte korrigiere die antwort
              - a resposta está errada
              - 답변이 틀렸습니다
              - الإجابة خاطئة
              - उत्तर गलत है
              - ответ неверный
        fact_check:
          - name: balance_needs_fact_check
            description: Detect claims that benefit from evidence-backed verification.
        user_feedbacks:
          - name: balance_user_reports_incorrect_answer
            description: Detect explicit correction or dissatisfaction with the previous answer.
        reasks:
          - name: balance_repeated_question
            description: Detect an immediate semantic repeat after an unsatisfactory answer.
            threshold: 0.8
            lookback_turns: 1
        language:
          - {name: en, threshold: 0.5, description: English-language request.}
          - {name: zh, threshold: 0.5, description: Chinese-language request.}
          - {name: es, threshold: 0.5, description: Spanish-language request.}
          - {name: fr, threshold: 0.5, description: French-language request.}
          - {name: ja, threshold: 0.5, description: Japanese-language request.}
          - {name: de, threshold: 0.5, description: German-language request.}
          - {name: pt, threshold: 0.5, description: Portuguese-language request.}
          - {name: ko, threshold: 0.5, description: Korean-language request.}
          - {name: ar, threshold: 0.5, description: Arabic-language request.}
          - {name: hi, threshold: 0.5, description: Hindi-language request.}
          - {name: ru, threshold: 0.5, description: Russian-language request.}
        context:
          - name: balance_context_from_30k_to_60k
            min_tokens: "30001"
            max_tokens: "60000"
            description: The 30K-60K text/tool band preserves output, system, and tool reserve on 65K-capable backends.
          - name: balance_context_from_60k_to_120k
            min_tokens: "60001"
            max_tokens: "120000"
            description: The 60K-120K text/tool band preserves reserve on 128K-capable backends.
          - name: balance_context_from_120k_to_240k
            min_tokens: "120001"
            max_tokens: "240000"
            description: The 120K-240K text/tool band preserves reserve on the two declared native-262K backends.
          - name: balance_exceeds_240k_context
            min_tokens: "240001"
            max_tokens: "2147483647"
            description: Inputs beyond 240K require a capability-preserving terminal lane.
        conversation:
          - name: balance_has_images
            description: Request contains at least one image content part.
            feature:
              type: exists
              source:
                type: image_content
          - name: balance_has_tools
            description: Request declares at least one callable tool.
            feature:
              type: count
              source:
                type: tool_definition
            predicate:
              gte: 1
          - name: balance_multi_turn
            description: Multi-turn conversations benefit from a small synthesis allowance.
            feature:
              type: count
              source:
                type: message
                role: user
            predicate:
              gte: 2
        structure:
          - name: balance_constraint_dense
            description: Detect a dense set of explicit output or correctness constraints.
            feature:
              type: density
              source:
                type: keyword_set
                keywords: [must, exactly, at least, at most, without, 必须, 严格, 至少, 不超过]
            predicate:
              gt: 0.08
        complexity:
          - name: balance_difficulty
            threshold: 0.08
            description: Semantic boundary between direct requests and synthesis-heavy work.
            easy:
              candidates:
                - Give a short definition of a common term.
                - Summarize one paragraph in a single sentence.
                - Explain a basic concept with one example.
            hard:
              candidates:
                - Analyze a production failure from several competing root causes.
                - Design a distributed system and justify its consistency tradeoffs.
                - Synthesize conflicting evidence into a defensible recommendation.
                - 分析复杂生产故障中的多个竞争性根因并提出可靠方案。
                - Analiza varias causas raíz y sintetiza una recomendación defendible.
                - حلّل عدة أسباب جذرية متنافسة وقدّم توصية قابلة للدفاع.
      projections:
        scores:
          - name: balance_reasoning_effort_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: balance_simple_request_phrases, weight: -0.35, value_source: confidence}
              - {type: keyword, name: balance_concise_request_phrases, weight: -0.1, value_source: confidence}
              - {type: keyword, name: balance_reasoning_opt_out_phrases, weight: -1.0, value_source: confidence}
              - {type: keyword, name: balance_deliberate_request_phrases, weight: 0.85, value_source: confidence}
              - {type: keyword, name: balance_verification_request_phrases, weight: 0.45, value_source: confidence}
              - {type: fact_check, name: balance_needs_fact_check, weight: 0.45}
              - {type: structure, name: balance_constraint_dense, weight: 0.45}
              - {type: complexity, name: 'balance_difficulty:hard', weight: 0.4}
              - {type: complexity, name: 'balance_difficulty:easy', weight: -0.05}
              - {type: conversation, name: balance_multi_turn, weight: 0.08}
              - {type: language, name: en, weight: 0.02}
              - {type: language, name: zh, weight: 0.02}
              - {type: language, name: es, weight: 0.02}
              - {type: language, name: fr, weight: 0.02}
              - {type: language, name: ja, weight: 0.02}
              - {type: language, name: de, weight: 0.02}
              - {type: language, name: pt, weight: 0.02}
              - {type: language, name: ko, weight: 0.02}
              - {type: language, name: ar, weight: 0.02}
              - {type: language, name: hi, weight: 0.02}
              - {type: language, name: ru, weight: 0.02}
          - name: balance_answer_recovery_score
            method: weighted_sum
            inputs:
              - {type: user_feedback, name: balance_user_reports_incorrect_answer, weight: 0.65}
              - {type: keyword, name: balance_correction_request_phrases, weight: 0.5, value_source: confidence}
              - {type: reask, name: balance_repeated_question, weight: 0.4, value_source: confidence}
        mappings:
          - name: balance_reasoning_effort_band
            source: balance_reasoning_effort_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 10}
            outputs:
              - {name: balance_direct_workload, lt: 0.3}
              - {name: balance_deliberate_workload, gte: 0.3}
          - name: balance_answer_recovery_band
            source: balance_answer_recovery_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 12}
            outputs:
              - {name: balance_no_recovery_needed, lt: 0.35}
              - {name: balance_needs_recovery, gte: 0.35}
      decisions:
        - name: balance_over_240k_image_guard
          description: Keep image input beyond the conservative 240K boundary on Qwen36 so vLLM rejects true native-262K overflow instead of misrouting to text-only GLM.
          priority: 900
          rules:
            operator: AND
            conditions:
              - type: context
                name: balance_exceeds_240k_context
              - type: conversation
                name: balance_has_images
          modelRefs:
            - model: local/qwen3.6-35b
              use_reasoning: false
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Blend, built by AMD. Balance accuracy, speed, and cost. Give one clear answer.
        - name: balance_over_240k_text_guard
          description: Route text and tool requests beyond 240K to GLM; its native context contract enforces terminal overflow.
          priority: 850
          rules:
            operator: AND
            conditions:
              - type: context
                name: balance_exceeds_240k_context
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_images
          modelRefs:
            - model: local/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Blend, built by AMD. Balance accuracy, speed, and cost. Give one clear answer.
        - name: balance_text_from_120k_to_240k
          description: Balance text and tool traffic in the 120K-240K band across the two declared native-262K backends.
          priority: 800
          rules:
            operator: AND
            conditions:
              - type: context
                name: balance_context_from_120k_to_240k
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_images
          modelRefs:
            - model: local/qwen3.5-9b
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.6-35b
              use_reasoning: true
              reasoning_effort: high
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 0.55
                latency: 0.15
                cost: 0.15
                load: 0.15
              on_no_candidates: cheapest
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Blend, built by AMD. Balance accuracy, speed, and cost. Give one clear answer.
        - name: balance_text_from_60k_to_120k
          description: Balance text and tool traffic in the 60K-120K band across native-262K backends and compatible strong 128K backends.
          priority: 750
          rules:
            operator: AND
            conditions:
              - type: context
                name: balance_context_from_60k_to_120k
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_images
          modelRefs:
            - model: local/qwen3.5-9b
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.6-35b
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.5-122b
              use_reasoning: true
              reasoning_effort: high
            - model: local/mistral-small-4
              use_reasoning: true
              reasoning_effort: high
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 0.55
                latency: 0.15
                cost: 0.15
                load: 0.15
              on_no_candidates: cheapest
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Blend, built by AMD. Balance accuracy, speed, and cost. Give one clear answer.
        - name: balance_text_from_30k_to_60k
          description: Balance text and tool traffic in the 30K-60K band across native-262K backends and compatible strong shorter-context backends.
          priority: 700
          rules:
            operator: AND
            conditions:
              - type: context
                name: balance_context_from_30k_to_60k
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_images
          modelRefs:
            - model: local/qwen3.5-9b
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.6-35b
              use_reasoning: true
              reasoning_effort: high
            - model: local/step-3.7-flash
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.5-122b
              use_reasoning: true
              reasoning_effort: high
            - model: local/mistral-small-4
              use_reasoning: true
              reasoning_effort: high
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 0.55
                latency: 0.15
                cost: 0.15
                load: 0.15
              on_no_candidates: cheapest
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Blend, built by AMD. Balance accuracy, speed, and cost. Give one clear answer.
        - name: balance_image_tools
          description: Keep image-and-tool requests through 240K on the declared native-262K multimodal backend.
          priority: 500
          rules:
            operator: AND
            conditions:
              - type: conversation
                name: balance_has_images
              - type: conversation
                name: balance_has_tools
              - operator: NOT
                conditions:
                  - type: context
                    name: balance_exceeds_240k_context
          modelRefs:
            - model: local/qwen3.6-35b
              use_reasoning: false
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
