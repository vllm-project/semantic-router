version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 1200s

global:
  router:
    auto_model_names: []
  services:
    router_replay:
      enabled: true
      store_backend: redis
      ttl_seconds: 604800
      async_writes: false
      redis:
        address: redis:6379
        db: 2
        key_prefix: "mom-v1:router-replay:"
    observability:
      # This self-contained Recipe does not assume an OTLP collector exists.
      # Deployments that provision one may explicitly enable tracing in their
      # realized runtime config.
      tracing:
        enabled: false
    management_api:
      bind_address: 0.0.0.0
      port: 8080
      remote_exposure: true
      auth:
        mode: bearer
        tokens:
          - env: VLLM_SR_DASHBOARD_RECIPE_TOKEN
            role: dashboard_control_plane
        roles:
          dashboard_control_plane:
            - cache.invalidate
            - cache.manage
            - cache.read
            - classify.invoke
            - compression.manage
            - compression.preview
            - compression.read
            - config.read
            - config.write
            - learning.ingest
            - ready.read
            - replay.detail
            - replay.read
  integrations:
    looper:
      # Multi-call algorithms must re-enter through Envoy rather than the
      # Router container's loopback interface or an undeclared DNS alias.
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      timeout_seconds: 1200

providers:
  defaults:
    default_model: local/qwen3.5-9b
    default_reasoning_effort: medium
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
      effort:
        type: reasoning_effort
        parameter: reasoning_effort
      mistral:
        type: top_level_reasoning_effort
        parameter: reasoning_effort
  models:
    - name: local/qwen3.5-9b
      provider_model_id: local/qwen3.5-9b
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.02
        completion_per_1m: 0.08
        cached_input_per_1m: 0.005
      backend_refs:
        - name: qwen35-9b-node-a
          endpoint: qwen9:8107
          protocol: http
          type: vllm
          weight: 1
    - name: local/qwen3.6-35b
      provider_model_id: local/qwen3.6-35b
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.08
        completion_per_1m: 0.32
        cached_input_per_1m: 0.02
      backend_refs:
        - name: qwen36-35b-node-a
          endpoint: qwen36:8106
          protocol: http
          type: vllm
          weight: 1
    - name: local/step-3.7-flash
      provider_model_id: local/step-3.7-flash
      api_format: openai
      reasoning_family: effort
      pricing:
        currency: USD
        prompt_per_1m: 0.4
        completion_per_1m: 1.6
        cached_input_per_1m: 0.1
      backend_refs:
        - name: step37-node-a
          endpoint: step37:8101
          protocol: http
          type: vllm
          weight: 1
    - name: local/qwen3.5-122b
      provider_model_id: local/qwen3.5-122b
      api_format: openai
      reasoning_family: qwen3
