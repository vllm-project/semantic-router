              reasoning_effort: high
          algorithm:
            type: static
          plugins:
            - type: tools
              configuration:
                enabled: true
                mode: none
        - name: extended
          description: Preserve very long text context on the remote frontier lane.
          priority: 550
          rules:
            operator: AND
            conditions:
              - type: context
                name: accuracy_exceeds_240k_context
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_has_images
          modelRefs:
            - model: remote/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: static
        - name: orchestrate
          description: Plan and execute explicit multi-stage work across coding, analysis, and synthesis specialists.
          priority: 500
          rules:
            operator: AND
            conditions:
              - type: projection
                name: accuracy_requires_dynamic_workflow
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_active_tool_loop
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_has_images
              - operator: OR
                conditions:
                  - type: keyword
                    name: accuracy_workflow_request_phrases
                  - type: structure
                    name: accuracy_ordered_workflow
          modelRefs:
            - model: local/qwen3-coder-next
              use_reasoning: false
            - model: local/deepseek-v4-flash-analyst
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.5-122b-frontier
              use_reasoning: true
              reasoning_effort: medium
            - model: remote/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: workflows
            workflows:
              mode: dynamic
              template: micro_agent
              planner:
                model: local/qwen3-coder-next
                max_completion_tokens: 2048
              final:
                model: remote/glm-5.2
              max_steps: 4
              max_parallel: 3
              min_successful_responses: 2
              max_completion_tokens: 2048
              round_timeout_seconds: 180
              include_intermediate_responses: false
              on_error: skip
        - name: experts
          description: Combine architecture-diverse expert views for explicit exploration and fusion requests.
          priority: 450
          rules:
            operator: AND
            conditions:
              - operator: OR
                conditions:
                  - type: projection
                    name: accuracy_requires_expert_fusion
                  - type: projection
                    name: accuracy_requires_multi_round_exploration
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_active_tool_loop
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_has_images
          modelRefs:
            - model: local/gemma4-26b-balanced
              use_reasoning: true
              reasoning_effort: high
            - model: local/deepseek-v4-flash-analyst
              use_reasoning: true
              reasoning_effort: high
            - model: local/qwen3.5-122b-frontier
              use_reasoning: true
              reasoning_effort: high
            - model: remote/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: fusion
            fusion:
              model: remote/glm-5.2
              analysis_models:
                - local/gemma4-26b-balanced
                - local/deepseek-v4-flash-analyst
                - local/qwen3.5-122b-frontier
              max_concurrent: 3
              min_successful_responses: 2
              max_completion_tokens: 2048
              round_timeout_seconds: 240
              include_analysis: false
              include_intermediate_responses: false
              on_error: skip
        - name: verify
          description: Start fast and escalate across independent model families when confidence is insufficient.
          priority: 300
          rules:
            operator: AND
            conditions:
              - operator: OR
                conditions:
                  - type: projection
                    name: accuracy_requires_confidence_escalation
                  - type: context
                    name: accuracy_at_least_16k_context
                  - type: structure
                    name: accuracy_direct_reference
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_active_tool_loop
              - operator: NOT
                conditions:
                  - type: conversation
                    name: accuracy_has_images
          modelRefs:
            - model: local/qwen3.6-35b-flash
              use_reasoning: false
            - model: local/deepseek-v4-flash-analyst
              use_reasoning: true
              reasoning_effort: high
            - model: remote/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: confidence
            confidence:
              confidence_method: avg_logprob
              threshold: 0.72
              escalation_order: declared
              on_error: skip
        - name: direct
          description: Use the strongest local multimodal model when fan-out has no explicit benefit.
          priority: 10
          modelRefs:
            - model: local/qwen3.5-122b-frontier
              use_reasoning: true
              reasoning_effort: high
          algorithm:
            type: static
      strategy: priority

