        - "(\u0631\u0642\u0645 \u0627\u0644\u0647\u0648\u064A\u0629|\u0627\u0644\u0628\
          \u0631\u064A\u062F \u0627\u0644\u0625\u0644\u0643\u062A\u0631\u0648\u0646\
          \u064A|\u0631\u0642\u0645 \u062C\u0648\u0627\u0632 \u0627\u0644\u0633\u0641\
