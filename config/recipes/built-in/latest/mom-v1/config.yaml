  - name: vault
    description: A privacy-first model for sensitive workloads and protected data boundaries.
    routing:
      signals:
        keywords:
          - name: vault_attack_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - '\bignore previous instructions\b'
              - '\breveal the system prompt\b'
              - '\bexfiltrate credentials\b'
              - '\bbypass the safety policy\b'
              - 忽略之前的指令
              - 泄露系统提示词
              - 导出凭据
              - 绕过安全策略
              - ignora las instrucciones anteriores
              - extraer credenciales
              - ignorer les instructions précédentes
              - exfiltrer les identifiants
              - 以前の指示を無視
              - 認証情報を流出
              - vorherige anweisungen ignorieren
              - zugangsdaten exfiltrieren
              - ignore as instruções anteriores
              - exfiltrar credenciais
              - 이전 지시를 무시
              - 자격 증명 유출
              - تجاهل التعليمات السابقة
              - سرّب بيانات الاعتماد
              - पिछले निर्देशों को अनदेखा करें
              - क्रेडेंशियल निकालें
              - игнорируй предыдущие инструкции
              - извлеки учётные данные
          - name: vault_sensitive_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - '\blocal processing only\b'
              - '\bdo not send (this|it) to the cloud\b'
              - '\bconfidential handling\b'
              - '\binternal use only\b'
              - '\bprivate repositor(y|ies)\b' # codespell:ignore repositor
              - '\bproprietary code\b'
              - '\b\d{3}-\d{2}-\d{4}\b'
              - 本地处理
              - 不要发到云端
              - 机密处理
              - 仅供内部使用
              - 私有仓库
              - 内部文档
              - solo procesamiento local
              - no enviar a la nube
              - repositorio privado
              - traitement local uniquement
              - ne pas envoyer au cloud
              - dépôt privé
              - ローカル処理のみ
              - クラウドに送信しない
              - プライベートリポジトリ
              - nur lokale verarbeitung
              - nicht in die cloud senden
              - privates repository
              - processamento local apenas
              - não enviar para a nuvem
              - repositório privado
              - 로컬 처리만
              - 클라우드로 보내지 마
              - 비공개 저장소
              - المعالجة المحلية فقط
              - لا ترسل إلى السحابة
              - مستودع خاص
              - केवल स्थानीय प्रसंस्करण
              - क्लाउड पर न भेजें
              - निजी रिपॉज़िटरी
              - только локальная обработка
              - не отправлять в облако
              - частный репозиторий
              - '\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
              - '\b(ssn|social security number|credit card|passport number)\b'
              - (身份证|邮箱|护照号码|银行卡号)
              - (número de seguridad social|correo electrónico|pasaporte)
              - (numéro de sécurité sociale|adresse e-mail|passeport)
              - (マイナンバー|メールアドレス|パスポート番号)
              - (sozialversicherungsnummer|e-mail-adresse|reisepassnummer)
              - (número de segurança social|endereço de e-mail|passaporte)
              - (주민등록번호|이메일 주소|여권 번호)
              - (رقم الهوية|البريد الإلكتروني|رقم جواز السفر)
              - (आधार नंबर|ईमेल पता|पासपोर्ट नंबर)
              - (номер паспорта|адрес электронной почты|снилс)
        pii:
          - name: vault_detects_pii
            threshold: 0.7
            description: Detect personally identifiable information that must remain locally contained.
        jailbreak:
          - name: vault_detects_jailbreak
            method: classifier
            threshold: 0.45
            description: Detect suspicious prompts that require local containment.
        kb:
          - name: vault_privacy_policy
            kb: privacy_kb
            target:
              kind: group
              value: privacy_policy
            match: best
        context:
          - name: vault_context_from_120k_to_240k
            min_tokens: "120001"
            max_tokens: "240000"
            description: The 120K-240K band preserves reserve on the declared native-262K Qwen36 backend.
          - name: vault_exceeds_240k_context
            min_tokens: "240001"
            max_tokens: "2147483647"
            description: Inputs beyond 240K require a capability-preserving terminal lane.
        conversation:
          - name: vault_has_images
            description: Request contains at least one image content part.
            feature:
              type: exists
              source:
                type: image_content
          - name: vault_has_tools
            description: Request declares one or more client tools that must be stripped.
            feature:
              type: count
              source:
                type: tool_definition
            predicate:
              gte: 1
      projections:
        scores:
          - name: vault_risk_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: vault_sensitive_request_phrases, weight: 0.75, value_source: confidence}
              - {type: pii, name: vault_detects_pii, weight: 0.9}
              - {type: jailbreak, name: vault_detects_jailbreak, weight: 0.9}
              - {type: keyword, name: vault_attack_request_phrases, weight: 0.9, value_source: confidence}
              - {type: kb, name: vault_privacy_policy, weight: 0.45}
        mappings:
          - name: vault_risk_band
            source: vault_risk_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 12}
            outputs:
              - {name: vault_standard_risk, lt: 0.35}
              - {name: vault_sensitive_risk, gte: 0.35}
      decisions:
        - name: vault_over_240k_image_guard
          description: Keep image input beyond the conservative 240K boundary on local Qwen36 so vLLM enforces true native-262K overflow.
          priority: 900
          rules:
            operator: AND
            conditions:
              - type: context
                name: vault_exceeds_240k_context
              - type: conversation
                name: vault_has_images
          modelRefs:
            - model: local/qwen3.6-35b
              use_reasoning: false
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Vault, built by AMD. Treat inputs as confidential and minimize disclosure.
            - type: tools
              configuration:
                enabled: true
                mode: none
                strip_tool_history: true
            - type: router_replay
              configuration:
                enabled: false
        - name: vault_over_240k_text_guard
          description: Keep text and tool requests beyond 240K on local GLM with client tools and prior tool history stripped.
          priority: 850
          rules:
            operator: AND
            conditions:
              - type: context
                name: vault_exceeds_240k_context
              - operator: NOT
                conditions:
                  - type: conversation
                    name: vault_has_images
          modelRefs:
            - model: local/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Vault, built by AMD. Treat inputs as confidential and minimize disclosure.
            - type: tools
              configuration:
                enabled: true
                mode: none
                strip_tool_history: true
            - type: router_replay
              configuration:
                enabled: false
        - name: vault_request_from_120k_to_240k
          description: Keep every request in the 120K-240K band on local Qwen36 with client tools and prior tool history stripped.
          priority: 800
          rules:
            operator: OR
            conditions:
              - type: context
                name: vault_context_from_120k_to_240k
          modelRefs:
            - model: local/qwen3.6-35b
              use_reasoning: false
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Vault, built by AMD. Treat inputs as confidential and minimize disclosure.
            - type: tools
              configuration:
                enabled: true
                mode: none
                strip_tool_history: true
            - type: router_replay
              configuration:
                enabled: false
        - name: vault_image
          description: Keep image and image-with-tool requests through the conservative 120K boundary on a local image backend with every client tool disabled.
          priority: 600
          rules:
            operator: AND
            conditions:
              - type: conversation
                name: vault_has_images
              - operator: NOT
                conditions:
                  - type: context
                    name: vault_context_from_120k_to_240k
              - operator: NOT
                conditions:
                  - type: context
                    name: vault_exceeds_240k_context
          modelRefs:
            - model: local/qwen3.5-122b
              use_reasoning: false
          algorithm:
            type: static
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                mode: insert
                system_prompt: You are vLLM-SR MoM V1 Vault, built by AMD. Treat inputs as confidential and minimize disclosure.
            - type: tools
              configuration:
                enabled: true
                mode: none
                strip_tool_history: true
            - type: router_replay
              configuration:
                enabled: false
        - name: vault_security_containment
          description: Keep suspicious requests local and strip every client tool.
          priority: 300
          rules:
            operator: OR
            conditions:
              - type: keyword
                name: vault_attack_request_phrases
              - type: jailbreak
                name: vault_detects_jailbreak
          modelRefs:
            - model: local/gpt-oss-120b
              use_reasoning: false
