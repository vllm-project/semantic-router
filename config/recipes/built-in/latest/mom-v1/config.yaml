        threshold: 0.08
      context:
      - description: The 30K-60K band raises text and tool requests into the complex
          lane.
        max_tokens: '60000'
        min_tokens: '30001'
        name: balance_context_from_30k_to_60k
      - description: The 60K-120K band raises text and tool requests into the complex
