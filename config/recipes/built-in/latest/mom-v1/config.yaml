version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 1200s

global:
  router:
    auto_model_names: []
  services:
    router_replay:
      enabled: true
      store_backend: redis
      ttl_seconds: 604800
      async_writes: false
      redis:
        address: redis:6379
        db: 2
        key_prefix: "mom-v1:router-replay:"
    observability:
      # This self-contained Recipe does not assume an OTLP collector exists.
      # Deployments that provision one may explicitly enable tracing in their
      # realized runtime config.
      tracing:
        enabled: false
    management_api:
      bind_address: 0.0.0.0
      port: 8080
      remote_exposure: true
      auth:
        mode: bearer
        tokens:
          - env: VLLM_SR_DASHBOARD_RECIPE_TOKEN
            role: dashboard_control_plane
        roles:
          dashboard_control_plane:
            - cache.invalidate
            - cache.manage
            - cache.read
            - classify.invoke
            - compression.manage
            - compression.preview
            - compression.read
            - config.read
            - config.write
            - learning.ingest
            - ready.read
            - replay.detail
            - replay.read
  integrations:
    looper:
      # Multi-call algorithms must re-enter through Envoy rather than the
      # Router container's loopback interface or an undeclared DNS alias.
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      timeout_seconds: 1200

providers:
  defaults:
    default_model: local/qwen3.6-35b-flash
    default_reasoning_effort: medium
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
      effort:
        type: reasoning_effort
        parameter: reasoning_effort
  models:
    - name: local/qwen3.6-35b-flash
      provider_model_id: local/qwen3.6-35b-flash
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.08
        completion_per_1m: 0.32
        cached_input_per_1m: 0.02
      backend_refs:
        - name: qwen36-35b-local
          endpoint: qwen36:8104
          protocol: http
          type: vllm
          weight: 1
    - name: local/gemma4-26b-balanced
      provider_model_id: local/gemma4-26b-balanced
      api_format: openai
      reasoning_family: effort
      pricing:
        currency: USD
        prompt_per_1m: 0.1
        completion_per_1m: 0.4
        cached_input_per_1m: 0.025
      backend_refs:
        - name: gemma4-26b-local
          endpoint: gemma4:8105
          protocol: http
          type: vllm
          weight: 1
    - name: local/qwen3.6-27b-omni
      provider_model_id: local/qwen3.6-27b-omni
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.18
        completion_per_1m: 0.72
        cached_input_per_1m: 0.045
      backend_refs:
        - name: qwen36-27b-omni-local
          endpoint: qwen27:8108
          protocol: http
          type: vllm
          weight: 1
    - name: local/qwen3-coder-next
      provider_model_id: local/qwen3-coder-next
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0.2
        completion_per_1m: 0.8
        cached_input_per_1m: 0.05
      backend_refs:
        - name: qwen3-coder-next-local
          endpoint: qwen-coder:8107
          protocol: http
          type: vllm
          weight: 1
    - name: local/qwen3.5-122b-frontier
      provider_model_id: local/qwen3.5-122b-frontier
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.35
        completion_per_1m: 1.4
        cached_input_per_1m: 0.0875
      backend_refs:
        - name: qwen35-122b-local
          endpoint: qwen122:8101
          protocol: http
          type: vllm
          weight: 1
    - name: local/deepseek-v4-flash-analyst
      provider_model_id: local/deepseek-v4-flash-analyst
      api_format: openai
      reasoning_family: effort
      pricing:
        currency: USD
        prompt_per_1m: 0.45
        completion_per_1m: 1.8
        cached_input_per_1m: 0.1125
      backend_refs:
        - name: deepseek-v4-local
          endpoint: deepseek-v4:8106
          protocol: http
          type: vllm
          weight: 1
    - name: remote/glm-5.2
      provider_model_id: remote/glm-5.2
      api_format: openai
      reasoning_family: effort
      pricing:
        currency: USD
        prompt_per_1m: 1.2
        completion_per_1m: 4.8
        cached_input_per_1m: 0.3
      backend_refs:
        - name: glm-5-2-remote
          endpoint: glm52-remote:8201
          protocol: http
          type: vllm
          weight: 1
routing:
  strategy: priority
  modelCards:
    - name: local/qwen3.6-35b-flash
      param_size: 35B-A3B
      context_window_size: 262144
      description: Fast default tier for interactive chat, tools, vision, and structured output.
      capabilities: [chat, reasoning, code, tools, vision, multimodal, structured-output, long-context]
      quality_score: 0.86
      modality: ar
      tags: [role:fast, precision:fp8, tp:1, placement:local]
    - name: local/gemma4-26b-balanced
      param_size: 26B-A4B
      context_window_size: 131072
      description: Architecture-diverse balanced tier for multilingual, visual, and structured work.
      capabilities: [chat, reasoning, tools, vision, multimodal, structured-output, long-context]
      quality_score: 0.89
      modality: ar
      tags: [role:balanced, precision:bf16, tp:1, placement:local]
    - name: local/qwen3.6-27b-omni
      param_size: 27B
      context_window_size: 262144
      description: Dedicated visual-language tier for image understanding, documents, tools, and long context.
      capabilities: [chat, reasoning, tools, vision, multimodal, structured-output, long-context]
      quality_score: 0.9
      modality: ar
      tags: [role:omni, precision:bf16, tp:1, placement:local]
    - name: local/qwen3-coder-next
      param_size: 80B-A3B
      context_window_size: 262144
      description: Dedicated agentic coding tier for repositories, tools, planning, and precise structured output.
      capabilities: [chat, code, tools, structured-output, long-context]
      quality_score: 0.92
      modality: ar
      tags: [role:coder, precision:fp8, tp:1, placement:local, text-only]
    - name: local/qwen3.5-122b-frontier
      param_size: 122B-A10B
      context_window_size: 262144
      description: Local frontier tier for multimodal synthesis, review, and high-risk answers.
      capabilities: [chat, reasoning, code, tools, vision, multimodal, structured-output, long-context]
      quality_score: 0.94
      modality: ar
      tags: [role:frontier, precision:fp8, tp:1, placement:local]
    - name: local/deepseek-v4-flash-analyst
      param_size: 284B-A13B
      context_window_size: 262144
      description: Independent analysis tier for hard reasoning, code, tools, and long-context review.
      capabilities: [chat, reasoning, code, tools, structured-output, long-context]
      quality_score: 0.93
      modality: ar
      tags: [role:analyst, precision:fp8, tp:2, placement:local, text-only]
    - name: remote/glm-5.2
      param_size: 743B-A39B
      context_window_size: 524288
      description: Remote synthesis tier for frontier reasoning, judging, and terminal text context.
      capabilities: [chat, reasoning, code, tools, structured-output, long-context]
      quality_score: 0.97
      modality: ar
      tags: [role:synthesis, precision:fp8, tp:8, placement:remote, text-only]
entrypoints:
  - model_names: [vllm-sr/mom-v1-blend]
    recipe: balance
  - model_names: [vllm-sr/mom-v1-lite]
    recipe: cost
  - model_names: [vllm-sr/mom-v1-flash]
    recipe: speed
  - model_names: [vllm-sr/mom-v1-ultra]
    recipe: accuracy
  - model_names: [vllm-sr/mom-v1-vault]
    recipe: vault

recipes:
  - name: balance
    description: A balanced model optimized across quality, speed, and cost.
    routing:
      signals:
        keywords:
          - name: balance_simple_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - quick answer
              - answer briefly
              - one sentence
              - concise summary
              - 简单回答
              - 简要说明
              - 简短回答
              - respuesta breve
              - réponse brève
              - 簡潔に答えて
              - kurz antworten
              - resposta breve
              - 짧게 답해
              - إجابة مختصرة
              - संक्षिप्त उत्तर
              - краткий ответ
          - name: balance_concise_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - concise and direct
              - brief and direct
              - 简洁直接
              - 简短直接
              - breve y directa
              - brève et directe
              - 簡潔で直接的
              - kurz und direkt
              - breve e direta
              - 간결하고 직접적으로
              - موجز ومباشر
              - संक्षिप्त और सीधा
              - кратко и прямо
          - name: balance_reasoning_opt_out_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - do not analyze
              - don't analyze
              - without analysis
              - 不要分析
              - 无需分析
              - no analices
              - sans analyse
              - 分析しない
              - nicht analysieren
              - sem análise
              - 분석하지 마
              - دون تحليل
              - विश्लेषण मत करो
              - без анализа
          - name: balance_deliberate_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - analyze the tradeoffs
              - from first principles
              - root cause
              - reason step by step
              - compare the alternatives carefully
              - 分析取舍
              - 第一性原理
              - 根因分析
              - 逐步推理
              - analizar las ventajas y desventajas
              - causa raíz
              - analyser les compromis
              - cause racine
              - トレードオフを分析
              - 根本原因
              - kompromisse analysieren
              - ursache analysieren
              - analisar as compensações
              - causa raiz
              - 트레이드오프를 분석
              - 근본 원인
              - حلل المفاضلات
              - السبب الجذري
              - समझौतों का विश्लेषण
              - मूल कारण
              - проанализируй компромиссы
              - первопричина
          - name: balance_verification_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - verify the answer
              - cite sources
              - fact-check
              - check the evidence
              - 核实答案
              - 引用来源
              - verificar la respuesta
              - citer les sources
              - 答えを検証
              - quellen zitieren
              - verificar a resposta
              - 답변을 검증
              - تحقق من الإجابة
              - उत्तर सत्यापित करें
              - проверь ответ
          - name: balance_correction_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - that's wrong
              - wrong answer
              - '\b(is|was|were) wrong\b'
              - '\banswer was incorrect\b'
              - '\bcorrect (it|this|the answer)\b'
              - please correct the answer
              - try again
              - 回答错了
              - 请纠正答案
              - la respuesta es incorrecta
              - corrige la respuesta
              - la réponse est incorrecte
              - corrige la réponse
              - 回答が間違っています
              - bitte korrigiere die antwort
              - a resposta está errada
              - 답변이 틀렸습니다
              - الإجابة خاطئة
              - उत्तर गलत है
              - ответ неверный
        reasks:
          - name: balance_repeated_question
            description: Detect an immediate semantic repeat after an unsatisfactory answer.
            threshold: 0.8
            lookback_turns: 1
        language:
          - {name: en, threshold: 0.5, description: English-language request.}
          - {name: zh, threshold: 0.5, description: Chinese-language request.}
          - {name: es, threshold: 0.5, description: Spanish-language request.}
          - {name: fr, threshold: 0.5, description: French-language request.}
          - {name: ja, threshold: 0.5, description: Japanese-language request.}
          - {name: de, threshold: 0.5, description: German-language request.}
          - {name: pt, threshold: 0.5, description: Portuguese-language request.}
          - {name: ko, threshold: 0.5, description: Korean-language request.}
          - {name: ar, threshold: 0.5, description: Arabic-language request.}
          - {name: hi, threshold: 0.5, description: Hindi-language request.}
          - {name: ru, threshold: 0.5, description: Russian-language request.}
        context:
          - name: balance_context_from_30k_to_60k
            min_tokens: "30001"
            max_tokens: "60000"
            description: The 30K-60K band raises text and tool requests into the complex lane.
          - name: balance_context_from_60k_to_120k
            min_tokens: "60001"
            max_tokens: "120000"
            description: The 60K-120K band raises text and tool requests into the complex lane.
          - name: balance_context_from_120k_to_240k
            min_tokens: "120001"
            max_tokens: "240000"
            description: The 120K-240K band preserves output and tool reserve on native-262K backends.
          - name: balance_exceeds_240k_context
            min_tokens: "240001"
            max_tokens: "2147483647"
            description: Inputs beyond 240K require a capability-preserving terminal lane.
        conversation:
          - name: balance_has_images
            description: Request contains at least one image content part.
            feature:
              type: exists
              source:
                type: image_content
          - name: balance_has_tools
            description: Request declares at least one callable tool.
            feature:
              type: count
              source:
                type: tool_definition
            predicate:
              gte: 1
          - name: balance_multi_turn
            description: Multi-turn conversations benefit from a small synthesis allowance.
            feature:
              type: count
              source:
                type: message
                role: user
            predicate:
              gte: 2
        structure:
          - name: balance_constraint_dense
            description: Detect a dense set of explicit output or correctness constraints.
            feature:
              type: density
              source:
                type: keyword_set
                keywords: [must, exactly, at least, at most, without, 必须, 严格, 至少, 不超过]
            predicate:
              gt: 0.08
        complexity:
          - name: balance_difficulty
            threshold: 0.08
            description: Semantic boundary between direct requests and synthesis-heavy work.
            easy:
              candidates:
                - Give a short definition of a common term.
                - Summarize one paragraph in a single sentence.
                - Explain a basic concept with one example.
            hard:
              candidates:
                - Analyze a production failure from several competing root causes.
                - Design a distributed system and justify its consistency tradeoffs.
                - Synthesize conflicting evidence into a defensible recommendation.
                - 分析复杂生产故障中的多个竞争性根因并提出可靠方案。
                - Analiza varias causas raíz y sintetiza una recomendación defendible.
                - حلّل عدة أسباب جذرية متنافسة وقدّم توصية قابلة للدفاع.
      projections:
        scores:
          - name: balance_reasoning_effort_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: balance_simple_request_phrases, weight: -0.35, value_source: confidence}
              - {type: keyword, name: balance_concise_request_phrases, weight: -0.1, value_source: confidence}
              - {type: keyword, name: balance_reasoning_opt_out_phrases, weight: -1.0, value_source: confidence}
              - {type: keyword, name: balance_deliberate_request_phrases, weight: 0.85, value_source: confidence}
              - {type: keyword, name: balance_verification_request_phrases, weight: 0.45, value_source: confidence}
              - {type: structure, name: balance_constraint_dense, weight: 0.45}
              - {type: complexity, name: 'balance_difficulty:hard', weight: 0.4}
              - {type: complexity, name: 'balance_difficulty:easy', weight: -0.05}
              - {type: conversation, name: balance_multi_turn, weight: 0.08}
              - {type: language, name: en, weight: 0.02}
              - {type: language, name: zh, weight: 0.02}
              - {type: language, name: es, weight: 0.02}
              - {type: language, name: fr, weight: 0.02}
              - {type: language, name: ja, weight: 0.02}
              - {type: language, name: de, weight: 0.02}
              - {type: language, name: pt, weight: 0.02}
              - {type: language, name: ko, weight: 0.02}
              - {type: language, name: ar, weight: 0.02}
              - {type: language, name: hi, weight: 0.02}
              - {type: language, name: ru, weight: 0.02}
          - name: balance_answer_recovery_score
            method: weighted_sum
            inputs:
              - {type: keyword, name: balance_correction_request_phrases, weight: 0.5, value_source: confidence}
              - {type: reask, name: balance_repeated_question, weight: 0.4, value_source: confidence}
        mappings:
          - name: balance_reasoning_effort_band
            source: balance_reasoning_effort_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 10}
            outputs:
              - {name: balance_direct_workload, lt: 0.3}
              - {name: balance_deliberate_workload, gte: 0.3}
          - name: balance_answer_recovery_band
            source: balance_answer_recovery_score
            method: threshold_bands
            calibration: {method: sigmoid_distance, slope: 12}
            outputs:
              - {name: balance_no_recovery_needed, lt: 0.35}
              - {name: balance_needs_recovery, gte: 0.35}
      decisions:
        - name: omni
          description: Keep image understanding on the dedicated local visual-language model.
          priority: 500
          rules:
            operator: OR
            conditions:
              - type: conversation
                name: balance_has_images
          modelRefs:
            - model: local/qwen3.6-27b-omni
              use_reasoning: false
          algorithm:
            type: static
        - name: agentic
          description: Keep tool-driven and constrained coding work on the dedicated coding model.
          priority: 400
          rules:
            operator: AND
            conditions:
              - operator: OR
                conditions:
                  - type: conversation
                    name: balance_has_tools
                  - operator: AND
                    conditions:
                      - type: structure
                        name: balance_constraint_dense
                      - operator: NOT
                        conditions:
                          - operator: OR
                            conditions:
                              - type: context
                                name: balance_context_from_30k_to_60k
                              - type: context
                                name: balance_context_from_60k_to_120k
                              - type: context
                                name: balance_context_from_120k_to_240k
                              - type: context
                                name: balance_exceeds_240k_context
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_images
          modelRefs:
            - model: local/qwen3-coder-next
              use_reasoning: false
          algorithm:
            type: static
        - name: complex
          description: Send difficult, corrective, or long text synthesis to the frontier analysis pool.
          priority: 300
          rules:
            operator: AND
            conditions:
              - operator: OR
                conditions:
                  - type: projection
                    name: balance_deliberate_workload
                  - type: projection
                    name: balance_needs_recovery
                  - type: context
                    name: balance_context_from_30k_to_60k
                  - type: context
                    name: balance_context_from_60k_to_120k
                  - type: context
                    name: balance_context_from_120k_to_240k
                  - type: context
                    name: balance_exceeds_240k_context
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_images
              - operator: NOT
                conditions:
                  - type: conversation
                    name: balance_has_tools
          modelRefs:
            - model: remote/glm-5.2
              use_reasoning: true
              reasoning_effort: max
          algorithm:
            type: static
        - name: medium
          description: Balance multimodal and conversational work across fast, diverse, and frontier local models.
          priority: 200
          rules:
            operator: OR
            conditions:
              - type: conversation
                name: balance_has_images
              - type: conversation
                name: balance_multi_turn
          modelRefs:
            - model: local/qwen3.6-35b-flash
              use_reasoning: false
            - model: local/qwen3.5-122b-frontier
              use_reasoning: true
              reasoning_effort: medium
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 0.45
                latency: 0.25
                cost: 0.15
                load: 0.15
              on_no_candidates: first
        - name: simple
          description: Keep ordinary requests on the fastest balanced local pair.
          priority: 10
          modelRefs:
            - model: local/qwen3.6-35b-flash
              use_reasoning: false
            - model: local/gemma4-26b-balanced
              use_reasoning: false
          algorithm:
            type: multi_factor
            multi_factor:
              weights:
                quality: 0.25
                latency: 0.35
                cost: 0.25
                load: 0.15
              on_no_candidates: first
      strategy: priority

  - name: speed
    description: A speed-first model for low-latency, real-time experiences.
    routing:
      signals:
        keywords:
          - name: speed_heavy_request_phrases
            operator: OR
            method: regex
            case_sensitive: false
            keywords:
              - deep analysis
              - detailed architecture
              - comprehensive review
              - multi-step plan
              - 深入分析
              - 详细架构
              - 全面审查
              - análisis profundo
              - architecture détaillée
              - 詳細なアーキテクチャ
              - gründliche analyse
              - análise aprofundada
              - 심층 분석
              - تحليل متعمق
              - गहन विश्लेषण
              - глубокий анализ
        embeddings:
          - name: speed_heavy_intent
            threshold: 0.77
            aggregation_method: max
            candidates:
              - Produce a comprehensive architecture and analyze several failure modes.
              - 对复杂迁移做深入分析并给出详细架构。
              - Realiza un análisis profundo y una arquitectura detallada.
              - Produis une analyse approfondie et une architecture détaillée.
              - 複雑な移行を深く分析し、詳細なアーキテクチャを示してください。
              - Erstelle eine gründliche Analyse und detaillierte Architektur.
              - Faça uma análise aprofundada e uma arquitetura detalhada.
              - 복잡한 마이그레이션을 심층 분석하고 상세 아키텍처를 제시하세요.
              - قدّم تحليلاً متعمقاً وبنية مفصلة.
              - गहन विश्लेषण और विस्तृत आर्किटेक्चर प्रस्तुत करें।
              - Проведи глубокий анализ и предложи подробную архитектуру.
        context:
          - name: speed_context_from_30k_to_60k
            min_tokens: "30001"
            max_tokens: "60000"
            description: The 30K-60K band records conservative context use within the native-262K latency pool.
          - name: speed_context_from_60k_to_120k
            min_tokens: "60001"
            max_tokens: "120000"
            description: The 60K-120K band records conservative context use within the native-262K latency pool.
          - name: speed_context_from_120k_to_240k
            min_tokens: "120001"
            max_tokens: "240000"
