      classifiers:
      - name: content-risk
        description: Recognize high-consequence content using the published Hazard
          operating point.
        type: local
        labels:
        - violence
        - criminal_activity
        - sexual_content
        - child_exploitation
        - hate
        - harassment_abuse
        - regulated_substances
        - weapons
        - self_harm
        - privacy
        - specialized_advice
        - misinformation
      embeddings:
      - name: supportive_intent
        threshold: 0.7
        aggregation_method: max
        candidates:
        - I need supportive help to stay safe and find someone who can assist me now.
        - Help me cope with distress and identify a safe next step without suggesting
          harmful actions.
        - 我需要支持来保证自身安全，并找到现在能够帮助我的人。
        - 请帮助我应对痛苦，确定安全的下一步，不要建议有害行为。
        - أحتاج إلى دعم يساعدني على البقاء آمناً والعثور على شخص يمكنه مساعدتي الآن.
        - ساعدني على التعامل مع الضيق وتحديد خطوة تالية آمنة من دون اقتراح أفعال مؤذية.
        - Ich brauche Unterstützung, um sicher zu bleiben und jemanden zu finden,
          der mir jetzt helfen kann.
        - Hilf mir, mit meiner Belastung umzugehen und einen sicheren nächsten Schritt
          zu finden, ohne schädliche Handlungen vorzuschlagen.
        - Necesito apoyo para mantenerme a salvo y encontrar a alguien que pueda ayudarme
          ahora.
        - Ayúdame a afrontar la angustia y encontrar un siguiente paso seguro sin
          sugerir acciones dañinas.
        - 自分の安全を保ち、今助けてくれる人を見つけるための支援が必要です。
        - 有害な行動を勧めずに、つらさへの対処と安全な次の一歩を考える手助けをしてください。
        prototype_scoring:
          enabled: false
          best_weight: 0.75
          top_m: 2
      - name: informational
        threshold: 0.7
        aggregation_method: max
        candidates:
        - Explain the meaning of a concept neutrally without advising anyone to act.
        - Describe background information for learning or quotation, without making
          a practical recommendation.
        - 客观解释一个概念的含义，不建议任何人采取行动。
        - 介绍用于学习或引用的背景信息，不提供现实行动建议。
        - اشرح معنى مفهوم بشكل محايد من دون أن تنصح أحداً باتخاذ إجراء.
        - قدّم معلومات خلفية للتعلم أو الاقتباس من دون تقديم توصية عملية.
        - Erkläre die Bedeutung eines Begriffs neutral, ohne jemandem zu einer Handlung
          zu raten.
        - Beschreibe Hintergrundinformationen zum Lernen oder Zitieren, ohne eine
          praktische Empfehlung zu geben.
        - Explica el significado de un concepto de forma neutral sin aconsejar a nadie
          que actúe.
        - Describe información de contexto para aprender o citar, sin hacer una recomendación
          práctica.
        - 誰かに行動を勧めることなく、概念の意味を中立的に説明してください。
        - 学習や引用のための背景情報を説明し、実際の行動については助言しないでください。
        prototype_scoring:
          enabled: false
          best_weight: 0.75
          top_m: 2
      - name: consequential
        threshold: 0.7
        aggregation_method: max
        candidates:
        - Help choose an action when a mistaken choice could cause material harm or
          an irreversible loss.
        - Evaluate practical alternatives and recommend a course of action while accounting
          for consequential uncertainty.
        - 当错误选择可能造成实质伤害或不可逆损失时，帮助选择行动。
        - 评估现实可行的方案，并在考虑重大不确定性的基础上建议行动路线。
        - ساعد في اختيار تصرف عندما قد يؤدي القرار الخاطئ إلى ضرر ملموس أو خسارة لا
          يمكن تداركها.
        - قيّم البدائل العملية واقترح مساراً للعمل مع مراعاة عدم اليقين ذي العواقب
          المهمة.
        - Hilf bei der Wahl einer Handlung, wenn eine falsche Entscheidung erheblichen
          Schaden oder einen unumkehrbaren Verlust verursachen könnte.
        - Bewerte praktische Alternativen und empfehle ein Vorgehen unter Berücksichtigung
          folgenreicher Unsicherheit.
        - Ayuda a elegir una acción cuando una decisión equivocada podría causar un
          daño importante o una pérdida irreversible.
        - Evalúa alternativas prácticas y recomienda una línea de acción teniendo
          en cuenta la incertidumbre y sus consecuencias.
        - 誤った選択が重大な被害や取り返しのつかない損失を招く可能性があるとき、行動の選択を支援してください。
        - 現実的な選択肢を評価し、重大な結果につながる不確実性を考慮して行動方針を勧めてください。
        prototype_scoring:
          enabled: false
          best_weight: 0.75
          top_m: 2
      structure:
      - description: Vocabulary mentioned for explanation or translation is not an
          execution request.
        feature:
          source:
            pattern: (?i)(?:(\b(define|translate|explain)\b.{0,48}\b(phrase|term|expression)\b|(définis|traduis|explique).{0,48}(expression|terme)|(define|traduce|explica).{0,48}(frase|expresión|término)|(definiere|übersetze|erkläre).{0,48}(ausdruck|begriff)|(defina|traduza|explique).{0,48}(frase|expressão|ter(?:mo))|(정의|번역|설명).{0,16}(문구|표현|용어|“|「)|(عرّف|ترجم|اشرح).{0,32}(العبارة|التعبير|المصطلح)|(परिभाषित|अनुवाद|समझाइए).{0,32}(वाक्यांश|अभिव्यक्ति|शब्द)|(определи|переведи|объясни).{0,48}(фразу|выражение|термин)|(定义|翻译|解释).{0,16}(短语|词语|“|「)|(説明|翻訳).{0,16}(表現|語句|「)|(["“「][^"”」]{1,120}["”」]).{0,80}(define|translate|explain|설명|정의|번역|اشرح|عرّف|ترجم|समझाइए|परिभाषित|अनुवाद|объясни|определи|переведи|解释|定义|翻译|説明|翻訳))|(?:^|[.!?;。！？；\n])\s*(?:please\s+)?(?:translate|quote)\b[^.!?;:\n]{0,64}[:：]|(?:^|[.!?;。！？；\n])\s*(?:请)?(?:翻译|引用)[^。！？；：\n]{0,32}[:：]|(?:^|[.!?;。！？；\n])\s*(?:(?:من
              فضلك|رجاء)\s+)?(?:ترجم|اقتبس)[^.!?؛:\n]{0,48}[:：]|(?:^|[.!?;。！？；\n])\s*(?:bitte\s+)?(?:übersetze|zitiere)\b[^.!?;:\n]{0,64}[:：]|(?:^|[.!?;。！？；\n])\s*(?:por
              favor\s+)?(?:traduce|cita)\b[^.!?;:\n]{0,64}[:：]|(?:^|[.!?;。！？；\n])\s*(?:以下を|次を)?(?:翻訳|引用)(?:して(?:ください)?)?[:：])
            type: regex
          type: exists
        name: quoted_request
      domains:
      - name: health
        description: Medical and health information.
        mmlu_categories:
        - health
      - name: law
        description: Legal information and interpretation.
        mmlu_categories:
        - law
      - name: business
        description: Business information and commercial decisions.
        mmlu_categories:
        - business
      - name: economics
        description: Economic information and financial decisions.
        mmlu_categories:
