- name: vault
  description: Keep private traffic inside the assigned deployment boundary, with
    tools and Router content storage disabled.
  routing:
    strategy: priority
    candidate_requirements:
      capabilities: declared
      context: known_limits
    signals:
      jailbreak:
      - name: prompt_attack
        threshold: 0.5
        include_history: true
      safety:
      - name: unsafe
        threshold: 0.5
      pii:
      - name: personal_data
        description: Personal identifiers trigger sensitive handling independently of context.
        include_history: true
        threshold: 0.7
        pii_types_allowed:
        - NRP
      - name: personal_attribute
        description: Nationality, religious and political attributes require personal context.
        include_history: true
        threshold: 0.7
