    decisions:
    - name: guard
      description: Contain detected prompt attacks before calling a backend.
      priority: 300
      rules:
        operator: AND
        conditions:
        - type: jailbreak
          name: prompt_attack
        on_unknown: fail_request
      adaptations:
        mode: bypass
      plugins:
      - type: fast_response
        configuration:
          message: This request cannot be processed under the private routing policy.
      - type: tools
        configuration:
          enabled: true
          mode: none
          strip_tool_history: true
      - type: memory
        configuration:
          enabled: false
      - type: response_cache
        configuration:
          enabled: false
      emits:
      - kind: retention
        retention:
          drop: true
    - name: sensitive
      description: Use the stronger approved private pool for personal data, content
        risks, and responsible assistance.
      priority: 200
      rules:
        operator: OR
        conditions:
        - type: pii
          name: personal_data
        - operator: AND
          conditions:
          - type: pii
            name: personal_attribute
          - type: keyword
            name: personal_context
        - type: keyword
          name: confidential
        - type: safety
          name: unsafe
        - type: classifier
          name: content-risk
          label: violence
        - type: classifier
          name: content-risk
          label: child_exploitation
        - type: classifier
          name: content-risk
          label: weapons
        - type: classifier
          name: content-risk
          label: self_harm
        - type: classifier
          name: content-risk
          label: privacy
        - type: classifier
          name: content-risk
          label: specialized_advice
        - operator: AND
          conditions:
          - operator: OR
            conditions:
            - type: embedding
              name: supportive_intent
            - operator: AND
              conditions:
              - type: keyword
                name: personal_support
              - type: projection
                name: support_requested
          - operator: NOT
            conditions:
            - type: structure
              name: quoted_request
        - operator: AND
          conditions:
          - operator: OR
            conditions:
            - type: domain
              name: health
            - type: domain
              name: law
            - type: domain
              name: business
            - type: domain
              name: economics
          - operator: OR
            conditions:
            - operator: AND
              conditions:
              - type: keyword
                name: care_request
              - operator: NOT
                conditions:
                - type: structure
                  name: quoted_request
            - type: projection
              name: actionable_care
        - operator: AND
          conditions:
          - type: keyword
            name: care_request
          - type: projection
            name: actionable_care
          - type: projection
            name: support_requested
          - operator: OR
            conditions:
            - type: projection
              name: confident_care
            - type: projection
              name: confident_action
        on_unknown: fail_request
      algorithm:
        type: multi_factor
        minimum_candidates: 1
        multi_factor:
          quality:
            index: vllm-sr/general@1.0.0
            on_missing: exclude
          objective:
            strategy: lexicographic
            priorities:
            - factor: quality
              tolerance: 0.02
            - factor: latency
              tolerance: 0.1
            - factor: load
          latency_metric: ttft
          latency_percentile: 95
          on_no_candidates: fail
      adaptations:
        mode: bypass
      plugins:
      - type: request_params
        configuration:
          default_max_tokens: 4096
      - type: tools
        configuration:
          enabled: true
          mode: none
          strip_tool_history: true
      - type: memory
        configuration:
          enabled: false
      - type: response_cache
        configuration:
          enabled: false
      emits:
      - kind: retention
        retention:
          drop: true
    - name: private
      description: Serve ordinary private requests from the approved model pool.
      priority: 10
      algorithm:
        type: multi_factor
        minimum_candidates: 1
        multi_factor:
          quality:
            index: vllm-sr/general@1.0.0
            on_missing: exclude
          objective:
            strategy: lexicographic
            priorities:
            - factor: quality
              tolerance: 0.07
            - factor: cost
              tolerance: 0.05
            - factor: latency
              tolerance: 0.1
            - factor: load
          latency_metric: ttft
          latency_percentile: 95
          on_no_candidates: fail
      adaptations:
        mode: bypass
      plugins:
      - type: request_params
        configuration:
          default_max_tokens: 4096
      - type: tools
        configuration:
          enabled: true
          mode: none
          strip_tool_history: true
      - type: memory
        configuration:
          enabled: false
      - type: response_cache
        configuration:
          enabled: false
      emits:
      - kind: retention
        retention:
          drop: true
    data_policy:
      replay: true
    model_bindings:
      classifier.content-risk:
        deployment: hazard
        adapter: modernbert
        contract: label_scores.v1
        operating_point:
          path: operating_point.json
          sha256: e79a78f48bf45eb38e3f5402de3b3b18eeaa822e00b42b3640bf471276290de5
    projections:
      scores:
      - name: support_margin
        method: weighted_sum
        inputs:
        - type: embedding
          name: supportive_intent
          weight: 1
          value_source: raw
        - type: embedding
          name: informational
          weight: -1
          value_source: raw
      - name: care_margin
        method: weighted_sum
        inputs:
        - type: embedding
          name: consequential
          weight: 1
          value_source: raw
        - type: embedding
          name: informational
          weight: -1
          value_source: raw
      - name: care_confidence
        method: weighted_sum
        inputs:
        - type: embedding
          name: supportive_intent
          weight: 1
          value_source: raw
      - name: action_confidence
        method: weighted_sum
        inputs:
        - type: embedding
          name: consequential
          weight: 1
          value_source: raw
      mappings:
      - name: care_confidence_level
        source: care_confidence
        method: threshold_bands
        outputs:
        - name: confident_care
          gte: 0.6
      - name: action_confidence_level
        source: action_confidence
        method: threshold_bands
        outputs:
        - name: confident_action
          gte: 0.6
      - name: support_margin_direction
        source: support_margin
        method: threshold_bands
        outputs:
        - name: support_requested
          gt: 0
      - name: care_margin_direction
        source: care_margin
        method: threshold_bands
        outputs:
        - name: actionable_care
          gt: 0
