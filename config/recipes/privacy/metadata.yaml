schema_version: vllm-sr/recipe-metadata/v1
id: privacy
name: Privacy-First Routing
version: 0.2.0
description: >-
  Keeps sensitive and suspicious requests on policy-compatible local models
  while reserving frontier inference for clearly non-sensitive reasoning.
  It routes on four named questions that its declared decision model,
  Vela 2.0 0.8B, answers in one call per request; an unanswered request stays
  local.
