version: v0.4
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 1200s
models:
- name: local/private-qwen
  card:
    capabilities:
    - self_hosted
    - privacy_locality
    - security_containment
    - code
    - internal_docs
    - text
    reasoning:
      type: chat_template_kwargs
      efforts:
      - medium
  connections:
  - provider: vllm
    endpoint: http://vllm:8000/v1
    model: qwen/qwen3.5-rocm
- name: cloud/frontier-reasoning
  card:
    capabilities:
    - frontier_reasoning
    - deep_synthesis
    - architecture_review
    - long_context
    - text
  connections:
  - provider: vllm
    endpoint: http://vllm:8000/v1
    model: anthropic/claude-opus-4.6
  pricing:
    input_cost_per_million_tokens: '1.8'
    output_cost_per_million_tokens: '7.2'
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      keywords:
      - name: local_only_markers
        operator: OR
        keywords:
        - local processing only
        - local model only
        - on-prem only
        - all processing on-prem
        - process this on-prem
        - do not send to the cloud
        - do not upload this
        - confidential handling
        - internal use only
        - handle this locally
        - stay on the local model
        - stay on local infrastructure
        - "\u672C\u5730\u5904\u7406"
        - "\u4EC5\u9650\u672C\u5730\u6A21\u578B"
        - "\u4E0D\u8981\u53D1\u5230\u4E91\u7AEF"
        - "\u4E0D\u8981\u4E0A\u4F20"
        - "\u673A\u5BC6\u5904\u7406"
        - "\u4EC5\u4F9B\u5185\u90E8\u4F7F\u7528"
      - name: private_code_markers
        operator: OR
        keywords:
        - private repo
        - private repository
        - internal repo
        - proprietary code
        - company codebase
        - our source tree
        - internal SDK
        - monorepo
        - private package
        - confidential code
        - "\u79C1\u6709\u4ED3\u5E93"
        - "\u5185\u90E8\u4ED3\u5E93"
        - "\u516C\u53F8\u4EE3\u7801"
        - "\u5185\u90E8 SDK"
        - "\u79C1\u6709\u4EE3\u7801"
        - "\u4FDD\u5BC6\u4EE3\u7801"
      - name: internal_doc_markers
        operator: OR
        keywords:
        - internal document
        - internal doc
        - internal design doc
        - internal design document
        - internal architecture decision record
        - internal ADR
        - confidential memo
        - confidential board memo
        - internal runbook
        - internal incident review
        - internal postmortem
        - internal SOP
        - internal RFC
        - employee handbook
        - confidential board deck
        - internal board deck
        - internal-only document
        - "\u5185\u90E8\u6587\u6863"
        - "\u5185\u90E8\u8BBE\u8BA1\u6587\u6863"
        - "\u5185\u90E8\u67B6\u6784\u51B3\u7B56\u8BB0\u5F55"
        - "\u5185\u90E8\u5907\u5FD8\u5F55"
        - "\u4FDD\u5BC6\u5907\u5FD8\u5F55"
        - "\u5185\u90E8\u8FD0\u884C\u624B\u518C"
        - "\u5185\u90E8\u4E8B\u6545\u590D\u76D8"
        - "\u5185\u90E8 SOP"
        - "\u5185\u90E8 RFC"
        - "\u5458\u5DE5\u624B\u518C"
        - "\u8463\u4E8B\u4F1A\u6750\u6599"
        - "\u4EC5\u5185\u90E8\u6D41\u8F6C"
      - name: prompt_injection_markers
        operator: OR
        keywords:
        - ignore previous instructions
        - ignore all previous instructions
        - ignore the instructions
        - ignore the system instructions
        - disregard the system prompt
        - bypass safety
        - override policy
        - reveal hidden instructions
        - reveal the system prompt
        - hidden system prompt
        - forget your rules
        - you are now unrestricted
        - ignore the developer message
        - "\u5FFD\u7565\u4E4B\u524D\u7684\u6307\u4EE4"
        - "\u5FFD\u7565\u7CFB\u7EDF\u63D0\u793A\u8BCD"
        - "\u7ED5\u8FC7\u5B89\u5168"
        - "\u8986\u76D6\u7B56\u7565"
        - "\u6CC4\u9732\u9690\u85CF\u6307\u4EE4"
        - "\u5FD8\u6389\u4F60\u7684\u89C4\u5219"
      - name: exfiltration_markers
        operator: OR
        keywords:
        - show the system prompt
        - show the hidden system prompt
        - reveal the system prompt
        - reveal the hidden prompt
        - reveal the hidden system prompt
        - print the secret
        - print the api key
        - dump credentials
        - expose the api key
        - leak the policy
        - show internal instructions
        - "\u8F93\u51FA\u7CFB\u7EDF\u63D0\u793A\u8BCD"
        - "\u6CC4\u9732\u63D0\u793A\u8BCD"
        - "\u6253\u5370\u5BC6\u94A5"
        - "\u66B4\u9732\u51ED\u636E"
        - "\u6CC4\u9732\u5185\u90E8\u89C4\u5219"
      - name: reasoning_request_markers
        operator: OR
        keywords:
        - reason carefully
        - step by step
        - compare the trade-offs
        - compare the tradeoffs
        - justify the trade-offs
        - trade-offs between
        - analyze deeply
        - first principles
        - root cause analysis
        - root-cause analysis
        - failure modes
        - "\u9010\u6B65\u63A8\u7406"
        - "\u4ED4\u7EC6\u5206\u6790"
        - "\u6BD4\u8F83\u53D6\u820D"
        - "\u4ECE\u7B2C\u4E00\u6027\u539F\u7406\u51FA\u53D1"
        - "\u6839\u56E0\u5206\u6790"
        - "\u4ECE\u7B2C\u4E00\u6027\u539F\u7406"
      - name: research_request_markers
        operator: OR
        keywords:
        - research memo
        - synthesize the sources
        - compare the evidence
        - survey the literature
        - write an analysis memo
        - "\u7814\u7A76\u5907\u5FD8\u5F55"
        - "\u7EFC\u5408\u8D44\u6599"
        - "\u5BF9\u6BD4\u8BC1\u636E"
        - "\u6587\u732E\u7EFC\u8FF0"
        - "\u5206\u6790\u5907\u5FD8\u5F55"
      - name: architecture_markers
        operator: OR
        keywords:
        - distributed system
        - system design
        - migration strategy
        - failover strategy
        - event-driven architecture
        - event-driven architectures
        - multi-region
        - multi-region architecture
        - control plane
        - data plane
        - consistency trade-offs
        - failure modes
        - fault tolerance
        - recovery guarantees
        - system architecture
        - "\u5206\u5E03\u5F0F\u7CFB\u7EDF"
        - "\u7CFB\u7EDF\u8BBE\u8BA1"
        - "\u8FC1\u79FB\u7B56\u7565"
        - "\u6545\u969C\u5207\u6362\u65B9\u6848"
        - "\u63A7\u5236\u9762"
        - "\u6570\u636E\u9762"
        - "\u4E00\u81F4\u6027\u53D6\u820D"
        - "\u5BB9\u9519\u8BBE\u8BA1"
      - name: multi_step_markers
        operator: OR
        keywords:
        - phased plan
        - execution plan
        - checklist
        - runbook
        - rollback plan
        - implementation steps
        - "\u5206\u9636\u6BB5\u65B9\u6848"
        - "\u5B9E\u65BD\u8BA1\u5212"
        - "\u68C0\u67E5\u6E05\u5355"
        - "\u8FD0\u884C\u624B\u518C"
        - "\u56DE\u6EDA\u65B9\u6848"
        - "\u5B9E\u65BD\u6B65\u9AA4"
      embeddings:
      - name: private_code_request
        threshold: 0.79
        aggregation_method: max
        candidates:
        - Review source code from a private repository and keep all processing on-prem.
        - Debug proprietary backend code from our internal monorepo without sending
          it to a cloud model.
        - Refactor a confidential microservice implementation from our company codebase.
        - Analyze an internal SDK source file and suggest code changes locally.
        - "\u5E2E\u6211\u5206\u6790\u516C\u53F8\u79C1\u6709\u4ED3\u5E93\u91CC\u7684\
          \u6E90\u4EE3\u7801\uFF0C\u4E0D\u8981\u53D1\u5230\u4E91\u7AEF\u3002"
      - name: pii_request
        threshold: 0.82
        aggregation_method: max
        candidates:
        - Review an HR spreadsheet containing employee phone numbers, home addresses,
          and government identifiers.
        - Analyze a CRM export with names, phone numbers, street addresses, and account
          numbers.
        - Process payroll records that include passport numbers, bank accounts, and
          home addresses.
        - Summarize a file that contains employee personal identifiers and contact
          details locally.
        - "\u5E2E\u6211\u5904\u7406\u5305\u542B\u624B\u673A\u53F7\u3001\u5BB6\u5EAD\
          \u4F4F\u5740\u548C\u8EAB\u4EFD\u8BC1\u53F7\u7684\u5458\u5DE5\u4FE1\u606F\
          \uFF0C\u5E76\u4E14\u53EA\u5728\u672C\u5730\u5206\u6790\u3002"
      - name: internal_document_request
        threshold: 0.9
        aggregation_method: max
        candidates:
        - Summarize this internal design document and highlight the risks.
        - Extract action items from a confidential board memo.
        - Summarize this internal runbook, extract the action items, and keep it on
          the local model.
        - Analyze a private incident postmortem for follow-up actions.
        - "\u5E2E\u6211\u603B\u7ED3\u8FD9\u4EFD\u5185\u90E8\u8BBE\u8BA1\u6587\u6863\
          \uFF0C\u53EA\u80FD\u5728\u672C\u5730\u6A21\u578B\u5904\u7406\uFF0C\u4E0D\
          \u8981\u53D1\u5230\u4E91\u7AEF\u3002"
      - name: frontier_reasoning_request
        threshold: 0.88
        aggregation_method: max
        candidates:
        - Compare several distributed system architectures and recommend the best
          one with explicit trade-offs and failure modes.
        - Produce a rigorous root-cause analysis for a multi-service production outage.
        - Evaluate multi-region failover strategies and justify the recovery guarantees.
        - Synthesize multiple technical constraints into an architecture recommendation
          with explicit alternatives.
        - "\u4ECE\u7B2C\u4E00\u6027\u539F\u7406\u6BD4\u8F83\u591A\u79CD\u7CFB\u7EDF\
          \u65B9\u6848\uFF0C\u5E76\u7ED9\u51FA\u5E26\u53D6\u820D\u7684\u67B6\u6784\
          \u5EFA\u8BAE\u3002"
      context:
      - name: short_context
        min_tokens: '0'
        max_tokens: '999'
      - name: medium_context
        min_tokens: 1K
        max_tokens: '7999'
      - name: long_context
        min_tokens: 8K
        max_tokens: 256K
      structure:
      - name: many_questions
        description: Prompts with several explicit questions, usually indicating multi-part
          reasoning.
        feature:
          type: count
          source:
            type: regex
            pattern: "[?\uFF1F]"
        predicate:
          gte: 4.0
      - name: ordered_workflow
        description: Prompts with ordered workflow markers.
        feature:
          type: sequence
          source:
            type: sequence
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - "\u5148"
              - "\u518D"
            - - "\u9996\u5148"
              - "\u7136\u540E"
      - name: override_directive_dense
        description: Override-oriented instruction language is dense relative to prompt
          length.
        feature:
          type: density
          source:
            type: keyword_set
            keywords:
            - ignore
            - override
            - bypass
            - reveal
            - forget
            - system prompt
            - developer message
            - "\u5FFD\u7565"
            - "\u8986\u76D6"
            - "\u7ED5\u8FC7"
            - "\u6CC4\u9732"
            - "\u63D0\u793A\u8BCD"
        predicate:
          gt: 0.06
      - name: fenced_instruction_blob
        description: Prompt contains fenced or tagged instruction wrappers often used
          in injection attempts.
        feature:
          type: exists
          source:
            type: regex
            pattern: (?i)(<system>|<assistant>|begin system prompt|```system|###\s*system)
      complexity:
      - name: frontier_reasoning
        threshold: 0.12
        description: General reasoning boundary between local handling and frontier-cloud
          escalation.
        hard:
          candidates:
          - compare several approaches and justify the trade-offs
          - build a rigorous argument from first principles
          - perform a deep root-cause analysis across multiple systems
          - synthesize many constraints into one recommendation
          - write a detailed strategy memo with alternatives
        easy:
          candidates:
          - give a short definition
          - answer briefly
          - rewrite this paragraph
          - explain the error in one paragraph
          - summarize this simply
      - name: code_reasoning
        threshold: 0.12
        description: Coding difficulty boundary for simple local help versus frontier-scale
          engineering analysis.
        hard:
          candidates:
          - design a distributed service with rollback and failure handling
          - debug a production race condition across multiple services
          - plan a large-scale refactor with compatibility constraints
          - analyze deep performance trade-offs across a codebase
        easy:
          candidates:
          - explain what this function does
          - fix a small bug
          - rename variables for clarity
          - write a helper function
          - summarize the stack trace
      jailbreak:
      - name: jailbreak_strict
        method: classifier
        threshold: 0.45
        description: Strict jailbreak classifier for routing suspicious prompts into
          local containment.
      pii:
      - name: pii_strict
        threshold: 0.85
        description: Detect personally identifiable information that should remain
          on local infrastructure.
      kb:
      - name: privacy_policy
        kb: privacy_kb
        target:
          kind: group
          value: privacy_policy
        match: best
    projections:
      scores:
      - name: security_risk_score
        method: weighted_sum
        inputs:
        - type: jailbreak
          name: jailbreak_strict
          weight: 0.82
        - type: keyword
          name: prompt_injection_markers
          weight: 0.48
          value_source: confidence
        - type: keyword
          name: exfiltration_markers
          weight: 0.5
          value_source: confidence
        - type: structure
          name: override_directive_dense
          weight: 0.6
        - type: structure
          name: fenced_instruction_blob
          weight: 0.35
      - name: privacy_risk_score
        method: weighted_sum
        inputs:
        - type: pii
          name: pii_strict
          weight: 0.92
        - type: keyword
          name: local_only_markers
          weight: 0.15
          value_source: confidence
        - type: keyword
          name: private_code_markers
          weight: 0.5
          value_source: confidence
        - type: keyword
          name: internal_doc_markers
          weight: 0.2
          value_source: confidence
        - type: embedding
          name: private_code_request
          weight: 0.32
          value_source: confidence
        - type: embedding
          name: pii_request
          weight: 0.4
          value_source: confidence
        - type: embedding
          name: internal_document_request
          weight: 0.4
          value_source: confidence
        - type: kb
          name: privacy_policy
          weight: 0.25
          value_source: confidence
        - type: context
          name: long_context
          weight: 0.06
      - name: reasoning_pressure
        method: weighted_sum
        inputs:
        - type: keyword
          name: reasoning_request_markers
          weight: 0.28
          value_source: confidence
        - type: keyword
          name: research_request_markers
          weight: 0.12
          value_source: confidence
        - type: keyword
          name: architecture_markers
          weight: 0.28
          value_source: confidence
        - type: keyword
          name: multi_step_markers
          weight: 0.1
          value_source: confidence
        - type: embedding
          name: frontier_reasoning_request
          weight: 0.48
          value_source: confidence
        - type: context
          name: medium_context
          weight: 0.04
        - type: context
          name: long_context
          weight: 0.16
        - type: structure
          name: many_questions
          weight: 0.08
        - type: structure
          name: ordered_workflow
          weight: 0.1
        - type: complexity
          name: frontier_reasoning:medium
          weight: 0.08
        - type: complexity
          name: frontier_reasoning:hard
          weight: 0.3
        - type: complexity
          name: code_reasoning:medium
          weight: 0.02
        - type: complexity
          name: code_reasoning:hard
          weight: 0.18
      - name: privacy_contrastive_score
        method: weighted_sum
        inputs:
        - type: kb_metric
          kb: privacy_kb
          metric: private_vs_public
          weight: 1.0
          value_source: score
      mappings:
      - name: security_policy_band
        source: security_risk_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10.0
        outputs:
        - name: policy_security_standard
          lt: 0.35
        - name: policy_security_local_only
          gte: 0.35
      - name: privacy_policy_band
        source: privacy_risk_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10.0
        outputs:
        - name: policy_privacy_cloud_allowed
          lt: 0.35
        - name: policy_privacy_local_only
          gte: 0.35
      - name: reasoning_policy_band
        source: reasoning_pressure
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10.0
        outputs:
        - name: policy_local_reasoning
          lt: 0.5
        - name: policy_frontier_reasoning
          gte: 0.5
      - name: privacy_override_band
        source: privacy_contrastive_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10.0
        outputs:
        - name: privacy_override_inactive
          lt: 0.55
        - name: privacy_override_active
          gte: 0.55
    decisions:
    - name: local_security_containment
      description: Keep suspicious or jailbreak-like prompts on the local safety lane
        with restricted capabilities.
      priority: 300
      tier: 1
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_security_local_only
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: none
      - type: router_replay
        configuration:
          enabled: true
          max_records: 50000
          max_body_bytes: 2048
    - name: local_privacy_policy
      description: Route PII, private code, and internal documents to the local model
        with local-only tool access.
      priority: 250
      tier: 2
      rules:
        operator: AND
        conditions:
        - operator: OR
          conditions:
          - type: projection
            name: policy_privacy_local_only
          - type: projection
            name: privacy_override_active
        - operator: NOT
          conditions:
          - type: projection
            name: policy_security_local_only
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: filtered
          allow_tools:
          - local_search
          - local_read
      - type: router_replay
        configuration:
          enabled: true
          max_records: 50000
          max_body_bytes: 2048
    - name: cloud_frontier_reasoning
      description: Send only non-sensitive, non-suspicious high-reasoning traffic
        to the cloud frontier model with full tool access.
      priority: 200
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_frontier_reasoning
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
        - operator: NOT
          conditions:
          - type: projection
            name: privacy_override_active
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: passthrough
      - type: router_replay
        configuration:
          enabled: true
          max_records: 50000
          max_body_bytes: 2048
    - name: local_standard
      description: Default local route for non-sensitive tasks that do not justify
        cloud escalation.
      priority: 100
      tier: 4
      rules:
        operator: AND
        conditions:
        - type: projection
          name: policy_local_reasoning
        - type: projection
          name: policy_privacy_cloud_allowed
        - type: projection
          name: policy_security_standard
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: passthrough
      - type: router_replay
        configuration:
          enabled: true
          max_records: 50000
          max_body_bytes: 2048
entrypoints:
- name: vllm-sr/auto
  recipe: default
  assignments:
    local_security_containment:
      models:
      - model: local/private-qwen
        weight: '1'
    local_privacy_policy:
      models:
      - model: local/private-qwen
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
    cloud_frontier_reasoning:
      models:
      - model: cloud/frontier-reasoning
        weight: '1'
    local_standard:
      models:
      - model: local/private-qwen
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
billing_currency: USD
global:
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  router: {}
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
