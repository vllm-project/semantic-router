global:
  billing:
    currency: USD
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  router:
    learning:
      enabled: true
      adaptation:
        enabled: false
        strategy: routing_sampling
        candidate_set: decision
      protection:
        enabled: true
        scope: conversation
        tuning:
          idle_timeout_seconds: 300
          min_turns_before_switch: 1
          switch_margin: 0.05
          stability_weight: 1.0
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
