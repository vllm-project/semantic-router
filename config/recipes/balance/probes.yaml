schema_version: v1
name: balance
description: 'Executable eval probes for the Balance recipe on decision-model questions. Probes are grouped by lane,
  and each lane''s probes assert the question that decides it: task for the specialist lanes, verification for the
  verified explainer, and correction or clarify for follow-ups after an earlier answer. The terminal casual_chat
  decision is the fallback for unclear or unknown answers.

  '
routing_assets:
  yaml: config/recipes/balance/config.yaml
  dsl: config/recipes/balance/recipe.dsl
fixtures:
  images:
    routing_pixel:
      description: Minimal PNG fixture used to exercise image-bearing request routing.
      media_type: image/png
      sha256: sha256:431ced6916a2a21a156e38701afe55bbd7f88969fbbfc56d7fe099d47f265460
      data_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
router_eval_endpoint: /api/v1/routing/preview
evaluation:
  request_timeout_seconds: 300
  concurrency: 4
acceptance:
  min_probe_pass_rate: 100.0
  min_decision_pass_rate: 100.0
coverage:
  min_signal_assertion_percent: 3.8
  min_projection_assertion_percent: 0.0
  min_algorithm_assertion_percent: 100.0
  min_plugin_assertion_percent: 100.0
  required_request_shapes:
  - text
  - messages
  min_tag_counts:
    language: 9
    negative: 1
    collision: 1
    fallback: 1
    stress: 1
    multi_turn: 3
  min_tag_pass_rate:
    language: 100.0
    negative: 100.0
    collision: 100.0
    fallback: 100.0
    stress: 100.0
    multi_turn: 100.0
decisions:
- id: omni
  expected_decision: omni
  expected_algorithm: static
  expected_alias: local/omni
  variants:
  - id: image_understanding
    messages:
    - role: user
      content:
      - type: text
        text: Read the attached image and explain its main point concisely.
      - type: image_fixture
        fixture: routing_pixel
    expected_signals:
      conversation:
      - has_image
    tags:
    - language:en
    - multimodal
    - image
    - shape:messages
  objective: An image request goes to the visual-language model.
- id: premium_legal
  expected_decision: premium_legal
  expected_algorithm: static
  expected_plugins:
  - router_replay
  expected_alias: anthropic/claude-opus-4.6
  objective: 'task answers legal: legal and compliance analysis uses the premium lane.'
  variants:
