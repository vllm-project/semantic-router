    messages:
    - role: user
      content: Why did the Roman Republic collapse?
    - role: assistant
      content: It collapsed because Carthage conquered Rome in 44 BC.
    - role: user
      content: This is wrong. Please correct the explanation of why the Roman Republic collapsed and cite reliable
        historical sources.
    expected_signals:
      conversation:
      - has_prior_answer
      decision:
      - correction
    tags:
    - baseline
    - feedback
    - multi-turn
    - shape:messages
