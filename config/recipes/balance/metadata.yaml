id: balance
name: Balanced Routing
version: 0.2.0
description: >-
  A general-purpose recipe that balances quality, latency, cost, safety, and
  conversation continuity across local and premium model lanes. It routes on
  four named questions that its declared decision model, Vela 2.0 0.8B,
  answers in one call per request.
