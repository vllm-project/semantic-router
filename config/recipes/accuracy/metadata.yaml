schema_version: vllm-sr/recipe-metadata/v1
id: accuracy
name: Accuracy Routing
version: 0.2.0
description: >-
  Asks the decision model how each request should be worked on, and uses
  bounded multi-model orchestration only for multi-step workstreams and
  reviews, keeping ordinary and long-context requests direct.
  Its declared decision model, Vela 2.0 0.8B, answers the routing questions
  in one call per request.
