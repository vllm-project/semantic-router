version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 1200s

global:
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  router:
    auto_model_names:
      - vllm-sr/auto
  integrations:
    looper:
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      timeout_seconds: 300
      fusion:
        model_names:
          - vllm-sr/fusion
      flow:
        model_names:
          - vllm-sr/flow

providers:
  defaults:
    default_model: qwen-coordinator
    default_reasoning_effort: medium
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
    - name: local/omni
      provider_model_id: local/omni
      api_format: openai
      backend_refs:
        - name: local-omni
          endpoint: vllm-omni:8000
          protocol: http
          type: vllm
          weight: 1
    - name: qwen-coordinator
      provider_model_id: qwen-coordinator
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0
        cached_input_per_1m: 0
        completion_per_1m: 0
      backend_refs:
        - name: local-qwen
          endpoint: qwen-coordinator:8000
          protocol: http
          type: vllm
          weight: 1
    - name: opus48-worker
      provider_model_id: anthropic/claude-opus-4.8
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0
        cached_input_per_1m: 0
        completion_per_1m: 0
      backend_refs:
        - name: openrouter
          base_url: https://openrouter.ai/api/v1
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: OPENROUTER_API_KEY
          weight: 1
    - name: gemini31-worker
      provider_model_id: google/gemini-3.1-pro-preview
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0
        cached_input_per_1m: 0
        completion_per_1m: 0
      backend_refs:
        - name: openrouter
          base_url: https://openrouter.ai/api/v1
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: OPENROUTER_API_KEY
          weight: 1
    - name: gpt55-worker
      provider_model_id: openai/gpt-5.5
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0
        cached_input_per_1m: 0
        completion_per_1m: 0
      backend_refs:
        - name: openrouter
          base_url: https://openrouter.ai/api/v1
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: OPENROUTER_API_KEY
          weight: 1

routing:
  modelCards:
    - name: local/omni
      capabilities: [chat, image_understanding, multimodal, omni, text, vision]
      modality: omni
    - name: qwen-coordinator
      context_window_size: 32768
      description: Local planner and synthesis model for Router Flow dynamic plans.
      capabilities: [chat, planning, synthesis, code]
      quality_score: 0.88
      modality: text
      tags: [deployment:self_hosted, role:planner]
    - name: opus48-worker
      context_window_size: 1000000
      description: OpenRouter worker for long-horizon agentic work.
      capabilities: [chat, code, reasoning, long-context]
      quality_score: 0.95
      modality: text
      tags: [deployment:openrouter, role:worker]
    - name: gemini31-worker
      context_window_size: 1000000
      description: OpenRouter worker for broad reasoning and coding.
      capabilities: [chat, code, reasoning, long-context]
      quality_score: 0.93
      modality: text
      tags: [deployment:openrouter, role:worker]
    - name: gpt55-worker
      context_window_size: 1048576
      description: OpenRouter worker for long-context planning and frontier synthesis.
      capabilities: [chat, code, reasoning, long-context, planning, synthesis]
      quality_score: 0.94
      modality: text
      tags: [deployment:openrouter, role:worker, role:planner]

  signals:
    conversation:
      - name: accuracy_has_images
        description: Request contains at least one image content part.
        feature:
          type: exists
          source:
            type: image_content
    keywords:
      - name: accuracy_workflow_request
        operator: OR
        keywords:
          - investigate and produce an implementation plan
          - research, compare, and synthesize
          - diagnose the root cause and verify the fix
          - break this into independent workstreams
          - use tools to gather evidence
          - 调研、比较并综合
          - 分解为独立任务并验证
          - 根因分析并验证修复
      - name: accuracy_deliberation_request
        operator: OR
        keywords:
          - debate both sides
          - compare competing hypotheses
          - adversarial review
          - independent expert opinions
          - challenge the proposed solution
          - compare multiple approaches and reach a verdict
          - 比较多个假设并得出结论
          - 从正反两面论证
          - 对方案进行对抗性审查
      - name: accuracy_direct_request
        operator: OR
        keywords:
          - answer the question directly
          - do not debate
          - do not compare
          - do not create workstreams
          - use a single model
          - without multi-model fan-out
          - 直接回答问题
          - 不要比较多个方案
          - 不要创建并行工作流
    context:
      - name: accuracy_long_context
        min_tokens: 16K
        max_tokens: 1M
        description: Long inputs stay on one capable worker to avoid multiplying context cost across a fan-out workflow.

  decisions:
    - name: omni
      description: Understand image-bearing requests with the dedicated visual-language model.
      priority: 200
      rules:
        operator: OR
        conditions:
          - type: conversation
            name: accuracy_has_images
      modelRefs:
        - model: local/omni
      algorithm:
        type: static

    - name: accuracy_workflow
      description: Decompose evidence-gathering and tool-heavy tasks into a bounded parallel workflow.
      priority: 100
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: accuracy_workflow_request
      modelRefs:
        - model: opus48-worker
          use_reasoning: true
          reasoning_effort: medium
        - model: gemini31-worker
          use_reasoning: true
          reasoning_effort: medium
        - model: gpt55-worker
          use_reasoning: true
          reasoning_effort: medium
      algorithm:
        type: workflows
        workflows:
          mode: dynamic
          template: micro_agent
          planner:
            model: gpt55-worker
            max_completion_tokens: 2048
          max_steps: 4
          max_parallel: 3
          min_successful_responses: 2
          max_completion_tokens: 8192
          include_intermediate_responses: true
          on_error: skip
    - name: accuracy_long_context_direct
      description: Keep long-context work on one frontier model instead of paying the latency and token multiplier of fan-out.
      priority: 95
      rules:
        operator: OR
        conditions:
          - type: context
            name: accuracy_long_context
      modelRefs:
        - model: gpt55-worker
          use_reasoning: true
          reasoning_effort: high
      algorithm:
        type: static
    - name: accuracy_deliberation
      description: Use independent frontier perspectives for ambiguous, adversarial, or high-stakes judgments.
      priority: 90
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: accuracy_deliberation_request
          - operator: NOT
            conditions:
              - type: keyword
                name: accuracy_direct_request
      modelRefs:
        - model: opus48-worker
          use_reasoning: true
          reasoning_effort: medium
        - model: gemini31-worker
          use_reasoning: true
          reasoning_effort: medium
        - model: gpt55-worker
          use_reasoning: true
          reasoning_effort: medium
        - model: qwen-coordinator
          use_reasoning: false
      algorithm:
        type: fusion
        fusion:
          model: qwen-coordinator
          analysis_models:
            - opus48-worker
            - gemini31-worker
            - gpt55-worker
          max_concurrent: 3
          min_successful_responses: 2
          include_analysis: true
          include_intermediate_responses: true
          on_error: skip
    - name: accuracy_direct
      description: Default to one frontier worker when orchestration has no explicit expected-quality benefit.
      priority: 10
      modelRefs:
        - model: gpt55-worker
          use_reasoning: true
          reasoning_effort: medium
      algorithm:
        type: static
