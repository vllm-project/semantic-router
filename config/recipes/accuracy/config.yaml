version: v0.3
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 1200s
providers:
  defaults:
    default_model: qwen-coordinator
    reasoning_families:
      qwen-coordinator:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
  - name: qwen-coordinator
    provider_model_id: qwen-coordinator
    backend_refs:
    - endpoint: http://qwen-coordinator:8000/v1
      provider: vllm
    api_format: openai
    reasoning_family: qwen-coordinator
  - name: opus48-worker
    provider_model_id: anthropic/claude-opus-4.8
    backend_refs:
    - provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      auth_header: Authorization
      auth_prefix: Bearer
    api_format: openai
  - name: gemini31-worker
    provider_model_id: google/gemini-3.1-pro-preview
    backend_refs:
    - provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      auth_header: Authorization
      auth_prefix: Bearer
    api_format: openai
  - name: gpt55-worker
    provider_model_id: openai/gpt-5.5
    backend_refs:
    - provider: openrouter
      api_key_env: OPENROUTER_API_KEY
      auth_header: Authorization
      auth_prefix: Bearer
    api_format: openai
  - name: local/omni
    provider_model_id: local/omni
    backend_refs:
    - endpoint: http://vllm-omni:8000/v1
      provider: vllm
    api_format: openai
routing:
  modelCards:
  - name: qwen-coordinator
    capabilities:
    - chat
    - planning
    - synthesis
    - code
    - text
  - name: opus48-worker
    capabilities:
    - chat
    - code
    - reasoning
    - long-context
    - text
  - name: gemini31-worker
    capabilities:
    - chat
    - code
    - reasoning
    - long-context
    - text
  - name: gpt55-worker
    capabilities:
    - chat
    - code
    - reasoning
    - long-context
    - text
  - name: local/omni
    capabilities:
    - chat
    - image_understanding
    - multimodal
    - omni
    - text
    - vision
    modality: omni
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      keywords:
      - name: accuracy_workflow_request
        operator: OR
        keywords:
        - investigate and produce an implementation plan
        - research, compare, and synthesize
        - diagnose the root cause and verify the fix
        - break this into independent workstreams
        - use tools to gather evidence
        - 调研、比较并综合
        - 分解为独立任务并验证
        - 根因分析并验证修复
      - name: accuracy_deliberation_request
        operator: OR
        keywords:
        - debate both sides
        - compare competing hypotheses
        - adversarial review
        - independent expert opinions
        - challenge the proposed solution
        - compare multiple approaches and reach a verdict
        - 比较多个假设并得出结论
        - 从正反两面论证
        - 对方案进行对抗性审查
      - name: accuracy_direct_request
        operator: OR
        keywords:
        - answer the question directly
        - do not debate
        - do not compare
        - do not create workstreams
        - use a single model
        - without multi-model fan-out
        - 直接回答问题
        - 不要比较多个方案
        - 不要创建并行工作流
      context:
      - name: accuracy_long_context
        min_tokens: 16K
        max_tokens: 1M
        description: Long inputs stay on one capable worker to avoid multiplying context cost across a fan-out workflow.
      conversation:
      - name: accuracy_has_images
        description: Request contains at least one image content part.
        feature:
          type: exists
          source:
            type: image_content
    decisions:
    - name: omni
      description: Understand image-bearing requests with the dedicated visual-language model.
      priority: 200
      rules:
        operator: OR
        conditions:
        - type: conversation
          name: accuracy_has_images
      algorithm:
        type: static
    - name: accuracy_workflow
      description: Decompose evidence-gathering and tool-heavy tasks into a bounded parallel workflow.
      priority: 100
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: accuracy_workflow_request
      algorithm:
        type: workflows
        workflows:
          mode: dynamic
          template: micro_agent
          planner:
            max_completion_tokens: 2048
          max_steps: 4
          max_parallel: 3
          min_successful_responses: 2
          max_completion_tokens: 8192
          include_intermediate_responses: true
          on_error: skip
    - name: accuracy_long_context_direct
      description: Keep long-context work on one frontier model instead of paying the latency and token multiplier of fan-out.
      priority: 95
      rules:
        operator: OR
        conditions:
        - type: context
          name: accuracy_long_context
      algorithm:
        type: static
    - name: accuracy_deliberation
      description: Use independent frontier perspectives for ambiguous, adversarial, or high-stakes judgments.
      priority: 90
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: accuracy_deliberation_request
        - operator: NOT
          conditions:
          - type: keyword
            name: accuracy_direct_request
      algorithm:
        type: fusion
        fusion:
          max_concurrent: 3
          min_successful_responses: 2
          include_analysis: true
          include_intermediate_responses: true
          on_error: skip
    - name: accuracy_direct
      description: Default to one frontier worker when orchestration has no explicit expected-quality benefit.
      priority: 10
      algorithm:
        type: static
entrypoints:
- recipe: default
  assignments:
    accuracy_workflow:
      models:
      - model: opus48-worker
        weight: '1'
      - model: gemini31-worker
        weight: '1'
      - model: gpt55-worker
        weight: '1'
    accuracy_long_context_direct:
      models:
      - model: gpt55-worker
        weight: '1'
    accuracy_deliberation:
      models:
      - model: opus48-worker
        weight: '1'
      - model: gemini31-worker
        weight: '1'
      - model: gpt55-worker
        weight: '1'
      - model: qwen-coordinator
        weight: '1'
    accuracy_direct:
      models:
      - model: gpt55-worker
        weight: '1'
    omni:
      models:
      - model: local/omni
        weight: '1'
  model_names:
  - vllm-sr/auto
global:
  billing:
    currency: USD
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  router: {}
  integrations:
    looper:
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      timeout_seconds: 300
      fusion: {}
      flow: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
