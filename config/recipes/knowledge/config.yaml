version: v0.4
listeners:
- address: 0.0.0.0
  name: http-8899
  port: 8899
  timeout: 1200s
models:
- name: local/small-7b
  connections:
  - provider: vllm
    endpoint: http://vllm:8000/v1
    model: qwen/qwen3.5-rocm
  pricing:
    input_cost_per_million_tokens: '0.04'
    output_cost_per_million_tokens: '0.1'
- name: cloud/frontier-72b
  connections:
  - provider: vllm
    endpoint: http://vllm:8000/v1
    model: anthropic/claude-opus-4.6
  pricing:
    input_cost_per_million_tokens: '0.12'
    output_cost_per_million_tokens: '0.39'
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      keywords:
      - name: escalation_domain_override
        operator: OR
        case_sensitive: false
        keywords:
        - matrix
        - determinant
        - invertibility
        - shareholder equity
        - amortized time complexity
        - reinforcement schedule
      - name: local_domain_override
        operator: OR
        case_sensitive: false
        keywords:
        - blood cells
        - transporting oxygen
        - contract law
        - legal consideration
        - ideal transformer
        - measured in joules
        - share electron pairs
      kb:
      - name: best_biology
        kb: mmlu_kb
        target:
          kind: label
          value: biology
        match: best
      - name: best_business
        kb: mmlu_kb
        target:
          kind: label
          value: business
        match: best
      - name: best_computing
        kb: mmlu_kb
        target:
          kind: label
          value: computer science
        match: best
      - name: best_economics
        kb: mmlu_kb
        target:
          kind: label
          value: economics
        match: best
      - name: best_engineering
        kb: mmlu_kb
        target:
          kind: label
          value: engineering
        match: best
      - name: best_health
        kb: mmlu_kb
        target:
          kind: label
          value: health
        match: best
      - name: best_history
        kb: mmlu_kb
        target:
          kind: label
          value: history
        match: best
      - name: best_law
        kb: mmlu_kb
        target:
          kind: label
          value: law
        match: best
      - name: best_math
        kb: mmlu_kb
        target:
          kind: label
          value: math
        match: best
      - name: best_other
        kb: mmlu_kb
        target:
          kind: label
          value: other
        match: best
      - name: best_philosophy
        kb: mmlu_kb
        target:
          kind: label
          value: philosophy
        match: best
      - name: best_physics
        kb: mmlu_kb
        target:
          kind: label
          value: physics
        match: best
      - name: best_psychology
        kb: mmlu_kb
        target:
          kind: label
          value: psychology
        match: best
      - name: best_chemistry
        kb: mmlu_kb
        target:
          kind: label
          value: chemistry
        match: best
    projections:
      scores:
      - name: escalation_pressure
        method: weighted_sum
        inputs:
        - type: kb_metric
          kb: mmlu_kb
          metric: escalate_vs_keep
          value_source: score
          weight: 1.0
      mappings:
      - name: escalation_band
        source: escalation_pressure
        method: threshold_bands
        outputs:
        - name: no_escalation
          lt: 2.0
        - name: escalation_signal
          gte: 2.0
    decisions:
    - name: escalate_72b
      description: Escalate high-uplift MMLU domains to the frontier 72B lane.
      priority: 200
      tier: 1
      rules:
        operator: AND
        conditions:
        - operator: OR
          conditions:
          - type: kb
            name: best_biology
          - type: kb
            name: best_business
          - type: kb
            name: best_computing
          - type: kb
            name: best_economics
          - type: kb
            name: best_history
          - type: kb
            name: best_math
          - type: kb
            name: best_other
          - type: kb
            name: best_philosophy
          - type: kb
            name: best_psychology
          - type: keyword
            name: escalation_domain_override
        - operator: NOT
          conditions:
          - type: keyword
            name: local_domain_override
    - name: keep_7b
      description: Keep lower-uplift MMLU domains on the local 7B lane.
      priority: 100
      tier: 2
      rules:
        operator: AND
        conditions:
        - operator: OR
          conditions:
          - type: projection
            name: no_escalation
          - type: keyword
            name: local_domain_override
entrypoints:
- name: vllm-sr/auto
  recipe: default
  assignments:
    escalate_72b:
      models:
      - model: cloud/frontier-72b
        weight: '1'
    keep_7b:
      models:
      - model: local/small-7b
        weight: '1'
global:
  billing:
    currency: USD
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  router: {}
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
  services:
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
