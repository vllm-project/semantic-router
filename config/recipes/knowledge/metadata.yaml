schema_version: vllm-sr/recipe-metadata/v1
id: knowledge
name: Knowledge-Aware Routing
version: 0.2.0
description: >-
  Uses measured domain evidence to keep low-uplift subjects local and
  escalate questions where measured model capability justifies the cost.
  Its declared decision model, Vela 2.0 0.8B, names each question's subject
  in one call, and the subject decides the lane.
