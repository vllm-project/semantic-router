# Explicit AMD deployments: the built-in model runtime serves every model on rocm:0.
# All-signals Preview is limited to 8192 tokens; task-specific budgets include special tokens.
# Replace vs_your_documents after creating and indexing a vector store for RAG.
version: v0.3
listeners:
- name: vela-http
  address: 0.0.0.0
  port: 8899
providers:
  defaults:
    model: vela-default
  models:
  - name: vela-default
    provider_model_id: vela-default
    backend_refs:
    - name: vllm
      endpoint: vllm:8000
      protocol: http
      provider: vllm
routing:
  signals:
    domains:
    - name: biology
      labels:
      - biology
      description: Observe biology using the published Vela model.
      predicate:
        gte: 0.5
    - name: business
      labels:
      - business
      description: Observe business using the published Vela model.
      predicate:
        gte: 0.5
    - name: chemistry
      labels:
      - chemistry
      description: Observe chemistry using the published Vela model.
      predicate:
        gte: 0.5
    - name: computer science
      labels:
      - computer science
      description: Observe computer science using the published Vela model.
      predicate:
        gte: 0.5
    - name: economics
      labels:
      - economics
      description: Observe economics using the published Vela model.
      predicate:
        gte: 0.5
    - name: engineering
      labels:
      - engineering
      description: Observe engineering using the published Vela model.
      predicate:
        gte: 0.5
    - name: health
      labels:
      - health
      description: Observe health using the published Vela model.
      predicate:
        gte: 0.5
    - name: history
      labels:
      - history
      description: Observe history using the published Vela model.
      predicate:
        gte: 0.5
    - name: law
      labels:
      - law
      description: Observe law using the published Vela model.
      predicate:
        gte: 0.5
    - name: math
      labels:
      - math
      description: Observe math using the published Vela model.
      predicate:
        gte: 0.5
    - name: other
      labels:
      - other
      description: Observe other using the published Vela model.
      predicate:
        gte: 0.5
    - name: philosophy
      labels:
      - philosophy
      description: Observe philosophy using the published Vela model.
      predicate:
        gte: 0.5
    - name: physics
      labels:
      - physics
      description: Observe physics using the published Vela model.
      predicate:
        gte: 0.5
    - name: psychology
      labels:
      - psychology
      description: Observe psychology using the published Vela model.
      predicate:
        gte: 0.5
    pii:
    - name: sensitive
      predicate:
        gte: 0.9
      input:
        history: true
    jailbreak:
    - name: prompt-attack
      predicate:
        gte: 0.5
    safety:
    - name: unsafe-content
      predicate:
        gte: 0.5
    fact_check:
    - name: needs_fact_check
      description: Observe needs_fact_check using the published Vela model.
      predicate:
        gte: 0.95
    - name: no_fact_check_needed
      description: Observe no_fact_check_needed using the published Vela model.
      labels:
      - NO_FACT_CHECK_NEEDED
      predicate:
        gt: 0.05
    user_feedbacks:
    - name: wrong_answer
      description: Observe wrong_answer using the published Vela model.
      labels:
      - WRONG_ANSWER
      predicate:
        gte: 0.7
    - name: need_clarification
      description: Observe need_clarification using the published Vela model.
      labels:
      - NEED_CLARIFICATION
      predicate:
        gte: 0.7
    - name: want_different
      description: Observe want_different using the published Vela model.
      labels:
      - WANT_DIFFERENT
      predicate:
        gte: 0.7
    - name: satisfied
      description: Observe satisfied using the published Vela model.
      labels:
      - SAT
      predicate:
        gte: 0.7
    modality:
    - name: AR
      labels:
      - text
    - name: DIFFUSION
      labels:
      - image
    - name: BOTH
      labels:
      - text_image
    keywords:
    - name: knowledge-query
      operator: OR
      keywords:
      - Search my documents
    systemone:
    - name: content-risk
      question:
        type: choice
        instructions: Which of these labels applies to the request?
        choices:
        - key: violence
        - key: criminal_activity
        - key: sexual_content
        - key: child_exploitation
        - key: hate
        - key: harassment_abuse
        - key: regulated_substances
        - key: weapons
        - key: self_harm
        - key: privacy
        - key: specialized_advice
        - key: misinformation
    - name: semantic-code
      question:
        type: noul
        instructions: 'Is the request about any of these: Debug this Python program
          and fix its error.?'
  decisions:
  - name: knowledge
    priority: 200
    rules:
      operator: AND
      on_unknown: fail_request
      conditions:
      - type: keyword
        name: knowledge-query
    algorithm:
      type: static
    modelRefs:
    - model: vela-default
      use_reasoning: false
    plugins:
    - type: context
      configuration:
        enabled: true
        sources:
        - type: rag
          backend: vectorstore
          match:
            recall:
              method: embedding
              top_k: 3
              min_similarity: 0.0
            judge:
              preset: relevance
              top_k: 2
              min_score: 0.5
          max_context_length: 4096
          on_failure: block
          backend_config:
            vector_store_id: vs_your_documents
    description: Retrieve indexed documents and keep the ones the decision model judges relevant before generation.
  - name: observe
    description: Inspect Vela signals and send the request to the connected backend.
    priority: 100
    rules:
      operator: OR
      on_unknown: fail_request
      conditions:
      - type: jailbreak
        name: prompt-attack
      - type: safety
        name: unsafe-content
      - type: pii
        name: sensitive
      - type: systemone
        name: content-risk
        label: violence
      - type: systemone
        name: content-risk
        label: criminal_activity
      - type: systemone
        name: content-risk
        label: sexual_content
      - type: systemone
        name: content-risk
        label: child_exploitation
      - type: systemone
        name: content-risk
        label: hate
      - type: systemone
        name: content-risk
        label: harassment_abuse
      - type: systemone
        name: content-risk
        label: regulated_substances
      - type: systemone
        name: content-risk
        label: weapons
      - type: systemone
        name: content-risk
        label: self_harm
      - type: systemone
        name: content-risk
        label: privacy
      - type: systemone
        name: content-risk
        label: specialized_advice
      - type: systemone
        name: content-risk
        label: misinformation
      - type: fact_check
        name: needs_fact_check
      - type: user_feedback
        name: wrong_answer
      - type: user_feedback
        name: need_clarification
      - type: user_feedback
        name: want_different
      - type: user_feedback
        name: satisfied
      - type: modality
        name: AR
      - type: systemone
        name: semantic-code
      - type: domain
        name: biology
      - type: domain
        name: business
      - type: domain
        name: chemistry
      - type: domain
        name: computer science
      - type: domain
        name: economics
      - type: domain
        name: engineering
      - type: domain
        name: health
      - type: domain
        name: history
      - type: domain
        name: law
      - type: domain
        name: math
      - type: domain
        name: other
      - type: domain
        name: philosophy
      - type: domain
        name: physics
      - type: domain
        name: psychology
    algorithm:
      type: static
    modelRefs:
    - model: vela-default
      use_reasoning: false
  modelCards:
  - name: vela-default
    modality: ar
    capabilities:
    - text
global:
  router:
    model_selection:
      enabled: false
  services:
    response_api:
      enabled: false
    api:
      routing_preview:
        request_timeout_seconds: 120
        max_concurrency: 16
  stores:
    response_cache:
      enabled: false
    vector_store:
      enabled: true
      backend_type: memory
      embedding:
        dimension: 768
      file_storage_dir: /app/.vllm-sr/files
      metadata_store: memory
      ingestion_workers: 1
  model_catalog:
    system:
      decision_model:
        deployment: decision-amd
    embeddings:
      default: embedding-amd
    deployments:
      decision-amd:
        provider: model_runtime
        artifact: vllm-sr/vela3-fast
        revision: 7cbefd4b92b57234bd0ffb9872451e81abcdac79
        device: rocm:0
        input:
          max_tokens: 8192
          overflow: window
      embedding-amd:
        provider: model_runtime
        artifact: vllm-sr/Vela-1.0-Encoder-307M-Embedding
        revision: 1e57cebf5a7b7fec6e6973f05bbca97c5cca4436
        device: rocm:0
        input:
          max_tokens: 32768
          overflow: reject
entrypoints:
- model_names: ["vela-auto"]
  recipe: default
