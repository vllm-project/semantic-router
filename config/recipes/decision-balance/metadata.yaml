id: decision-balance
name: Decision Balance
version: 0.3.1
description: >-
  A balanced Mixture-of-Models over GLM-5.3-Flash, Qwen3.8-Flash-Next and
  Qwen3.8-27B in which the Vela-2.0-4B decision model answers every routing
  question in one call and spends reasoning only where the request needs it.
