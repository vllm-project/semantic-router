version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 1200s

global:
  stores:
    response_cache:
      enabled: false
      backend_type: memory
  model_catalog:
    deployments:
      primary:
        provider: model_runtime
        artifact: vllm-sr/Vela-2.0-0.8B
    system:
      decision_model:
        deployment: primary
providers:
  defaults:
    model: qwen/qwen3.5-rocm
    reasoning_effort: medium
  models:
    - name: local/omni
      provider_model_id: local/omni
      api_format: openai
      backend_refs:
        - name: local-omni
          endpoint: vllm-omni:8000
          protocol: http
          provider: vllm
          weight: 1
    - name: qwen/qwen3.5-rocm
      provider_model_id: qwen/qwen3.5-rocm
      reasoning:
        family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.00
        completion_per_1m: 0.00
      backend_refs:
        - name: vllm_primary
          provider: vllm
          endpoint: vllm:8000
          protocol: http
          weight: 1
    - name: google/gemini-3.1-pro
      provider_model_id: google/gemini-3.1-pro
      pricing:
        currency: USD
        prompt_per_1m: 0.48
        completion_per_1m: 1.92
      backend_refs:
        - name: vllm_primary
          provider: vllm
          endpoint: vllm:8000
          protocol: http
          weight: 1
    - name: openai/gpt5.4
      provider_model_id: openai/gpt5.4
      pricing:
        currency: USD
        prompt_per_1m: 1.20
        completion_per_1m: 4.80
      backend_refs:
        - name: vllm_primary
          provider: vllm
          endpoint: vllm:8000
          protocol: http
          weight: 1

evaluation:
  records:
    - model: qwen/qwen3.5-rocm
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.72
    - model: google/gemini-3.1-pro
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.88
    - model: openai/gpt5.4
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.94
routing:
  modelCards:
    - name: local/omni
      capabilities:
        - chat
        - image_understanding
        - multimodal
        - omni
        - text
        - vision
      modality: omni
    - name: qwen/qwen3.5-rocm
      context_window_size: 131072
      description: Cheap default lane for standard follow-ups and lightweight clarification.
      capabilities:
        - cheap_followup
        - concise_rewrite
        - general_chat
      modality: text
      tags:
        - tier:cheap
        - purpose:default_feedback
    - name: google/gemini-3.1-pro
      context_window_size: 262144
      description: Mid-cost recovery lane for repeated dissatisfaction, debugging, and answer repair.
      capabilities:
        - answer_repair
        - debugging
        - reasoning
      modality: text
      tags:
        - tier:repair
        - purpose:feedback_recovery
    - name: openai/gpt5.4
      context_window_size: 262144
      description: Premium lane reserved for verified or high-stakes dissatisfaction recovery.
      capabilities:
        - verified_reasoning
        - evidence_synthesis
        - high_stakes
      modality: text
      tags:
        - tier:verified
        - purpose:feedback_recovery
  signals:
    conversation:
      - name: feedback_has_images
        description: Request contains at least one image content part.
        feature:
          type: exists
          source:
            type: image_content
    reasks:
      - name: persistently_dissatisfied
        description: Current user turn repeats the last two user turns in a row.
        threshold: 0.8
        lookback_turns: 2
    decision:
      - name: wrong
        description: The latest message says an earlier answer or fix was wrong.
        question:
          type: noul
          instructions: Does the latest message say that an earlier answer or fix was wrong, incorrect
            or did not work?
        predicate:
          gte: 0.5
      - name: clarify
        description: The latest message asks for an earlier answer again, more clearly.
        question:
          type: noul
          instructions: Does the latest message ask to explain an earlier answer again, more clearly,
            more simply or with an example?
        predicate:
          gte: 0.6
      - name: code
        description: The request is about software.
        question:
          type: noul
          instructions: Is the request about software, such as code, a program error or exception, a failing
            test or a bug?
        predicate:
          gte: 0.5
      - name: sources
        description: The user asks for sources, citations or a fact check.
        question:
          type: noul
          instructions: Does the user ask for sources, citations or a fact check of the answer?
        predicate:
          gte: 0.6
  decisions:
    - name: omni
      description: Image-bearing follow-ups go to the visual-language model.
      priority: 260
      rules:
        operator: AND
        conditions:
          - type: conversation
            name: feedback_has_images
      modelRefs:
        - model: local/omni
          use_reasoning: false
      algorithm:
        type: static
    - name: feedback_verified_recovery
      description: A wrong answer or a repeated question (wrong, persistently_dissatisfied) that asks
        for sources (sources), outside code, goes to the verified recovery lane.
      priority: 240
      rules:
        operator: AND
        on_unknown: no_match
        conditions:
          - operator: OR
            conditions:
              - type: decision
                name: wrong
              - type: reask
                name: persistently_dissatisfied
          - type: decision
            name: sources
          - operator: NOT
            conditions:
              - type: decision
                name: code
      modelRefs:
        - model: openai/gpt5.4
          use_reasoning: true
          reasoning_effort: high
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: X-Feedback-Lane
                value: verified-recovery
            update:
              - name: X-Route-Source
                value: feedback-recipe
    - name: feedback_persistent_code_recovery
      description: A code question the user keeps repeating (code, persistently_dissatisfied) goes to
        the premium code-repair lane.
      priority: 230
      rules:
        operator: AND
        on_unknown: no_match
        conditions:
          - type: decision
            name: code
          - type: reask
            name: persistently_dissatisfied
      modelRefs:
        - model: openai/gpt5.4
          use_reasoning: true
          reasoning_effort: high
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: X-Feedback-Lane
                value: persistent-code-recovery
            update:
              - name: X-Route-Source
                value: feedback-recipe
    - name: feedback_code_recovery
      description: A first report that code is still wrong (code, wrong) goes to the code-repair lane.
      priority: 220
      rules:
        operator: AND
        on_unknown: no_match
        conditions:
          - type: decision
            name: code
          - type: decision
            name: wrong
          - operator: NOT
            conditions:
              - type: reask
                name: persistently_dissatisfied
      modelRefs:
        - model: google/gemini-3.1-pro
          use_reasoning: true
          reasoning_effort: medium
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: X-Feedback-Lane
                value: code-recovery
            update:
              - name: X-Route-Source
                value: feedback-recipe
    - name: feedback_persistent_recovery
      description: Any other question the user keeps repeating (persistently_dissatisfied) goes to the
        premium general recovery lane.
      priority: 210
      rules:
        operator: AND
        on_unknown: no_match
        conditions:
          - type: reask
            name: persistently_dissatisfied
          - operator: NOT
            conditions:
              - type: decision
                name: code
          - operator: NOT
            conditions:
              - type: decision
                name: sources
      modelRefs:
        - model: openai/gpt5.4
          use_reasoning: true
          reasoning_effort: high
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: X-Feedback-Lane
                value: persistent-recovery
            update:
              - name: X-Route-Source
                value: feedback-recipe
    - name: feedback_general_recovery
      description: Any other report that an answer was wrong (wrong) goes to the general recovery lane.
      priority: 200
      rules:
        operator: AND
        on_unknown: no_match
        conditions:
          - type: decision
            name: wrong
          - operator: NOT
            conditions:
              - type: decision
                name: code
          - operator: NOT
            conditions:
              - type: decision
                name: sources
          - operator: NOT
            conditions:
              - type: reask
                name: persistently_dissatisfied
      modelRefs:
        - model: google/gemini-3.1-pro
          use_reasoning: true
          reasoning_effort: medium
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: X-Feedback-Lane
                value: general-recovery
            update:
              - name: X-Route-Source
                value: feedback-recipe
    - name: feedback_need_clarification
      description: A request to explain an earlier answer again (clarify) that does not call it wrong
        stays on the low-cost lane.
      priority: 180
      rules:
        operator: AND
        on_unknown: no_match
        conditions:
          - type: decision
            name: clarify
          - operator: NOT
            conditions:
              - type: decision
                name: wrong
          - operator: NOT
            conditions:
              - type: reask
                name: persistently_dissatisfied
      modelRefs:
        - model: qwen/qwen3.5-rocm
          use_reasoning: false
      plugins:
        - type: response_cache
          configuration:
            enabled: true
            similarity_threshold: 0.86
            ttl_seconds: 1800
    - name: feedback_default
      description: Everything else, including requests the decision model cannot answer, stays on the
        low-cost default lane.
      priority: 10
      modelRefs:
        - model: qwen/qwen3.5-rocm
          use_reasoning: false
entrypoints:
  - model_names: ["vllm-sr/auto"]
    recipe: default
