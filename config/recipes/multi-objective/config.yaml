recipes:
- name: balanced
  description: "Mixture-of-Models \xB7 Balanced \u2014 adaptive quality, speed, and\
    \ efficiency for everyday routing."
  document:
    signals:
      complexity:
      - description: Semantic boundary between direct requests and synthesis-heavy
          work.
        easy:
          candidates:
          - Give a short definition of a common term.
          - Summarize one paragraph in a single sentence.
          - Explain a basic concept with one example.
        hard:
          candidates:
          - Analyze a production failure from several competing root causes.
          - Design a distributed system and justify its consistency tradeoffs.
          - Synthesize conflicting evidence into a defensible recommendation.
        name: unified_balance_difficulty
        threshold: 0.08
      context:
      - description: Long inputs that justify stronger synthesis.
        max_tokens: 262K
        min_tokens: 12K
        name: unified_balance_long_context
      conversation:
      - description: Multi-turn conversations benefit from a small synthesis allowance.
        feature:
          source:
            role: user
            type: message
          type: count
        name: unified_balance_multi_turn
        predicate:
          gte: 2
      fact_check:
      - description: Detect claims that benefit from evidence-backed verification.
        name: needs_fact_check
      keywords:
      - case_sensitive: false
        keywords:
        - quick answer
        - answer briefly
        - one sentence
        - concise summary
        - "\u7B80\u5355\u56DE\u7B54"
        - "\u7B80\u8981\u8BF4\u660E"
        - respuesta breve
        - "r\xE9ponse br\xE8ve"
        - "\u7C21\u6F54\u306B\u7B54\u3048\u3066"
        - kurz antworten
        method: regex
        name: unified_balance_simple_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - concise and direct
        - brief and direct
        - "\u7B80\u6D01\u76F4\u63A5"
        - "\u7B80\u77ED\u76F4\u63A5"
        - breve y directa
        - "br\xE8ve et directe"
        - "\u7C21\u6F54\u3067\u76F4\u63A5\u7684"
        - kurz und direkt
        method: regex
        name: unified_balance_terse_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - do not analyze
        - don't analyze
        - without analysis
        - "\u4E0D\u8981\u5206\u6790"
        - "\u65E0\u9700\u5206\u6790"
        - no analices
        - sans analyse
        - "\u5206\u6790\u3057\u306A\u3044"
        - nicht analysieren
        method: regex
        name: unified_balance_negated_reasoning
        operator: OR
      - case_sensitive: false
        keywords:
        - analyze the tradeoffs
        - analyze the trade-offs
        - from first principles
        - root cause
        - step by step
        - system design
        - consistency tradeoffs
        - competing production failure
        - "\u5206\u6790\u53D6\u820D"
        - "\u7B2C\u4E00\u6027\u539F\u7406"
        - "\u6839\u56E0\u5206\u6790"
        - "\u9010\u6B65\u63A8\u7406"
        - "\u53D6\u820D"
        - "\u6839\u56E0"
        - analizar las ventajas y desventajas
        - "causa ra\xEDz"
        - analyser les compromis
        - cause racine
        - "\u6839\u672C\u539F\u56E0\u3092\u5206\u6790"
        - "\u6BB5\u968E\u7684\u306B\u63A8\u8AD6"
        - "\u30C8\u30EC\u30FC\u30C9\u30AA\u30D5"
        - "\u6839\u672C\u539F\u56E0"
        - "\u30C8\u30EC\u30FC\u30C9\u30AA\u30D5\u3092\u5206\u6790"
        - "\u6839\u672C\u539F\u56E0\u3068"
        - kompromisse analysieren
        method: regex
        name: unified_balance_reasoning_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - verify the answer
        - cite sources
        - fact-check
        - check the evidence
        - provide evidence
        - "\u6838\u5B9E\u7B54\u6848"
        - "\u5F15\u7528\u6765\u6E90"
        - "\u68C0\u67E5\u8BC1\u636E"
        - verificar la respuesta
        - citer les sources
        - "\u7B54\u3048\u3092\u691C\u8A3C"
        - quellen zitieren
        method: regex
        name: unified_balance_verification_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - that's wrong
        - wrong answer
        - please correct the answer
        - try again
        - "\u56DE\u7B54\u9519\u4E86"
        - "\u8BF7\u7EA0\u6B63\u7B54\u6848"
        - "\u91CD\u65B0\u56DE\u7B54"
        - la respuesta es incorrecta
        - corrige la respuesta
        - "la r\xE9ponse est incorrecte"
        - "corrige la r\xE9ponse"
        - "\u56DE\u7B54\u304C\u9593\u9055\u3063\u3066\u3044\u307E\u3059"
        - bitte korrigiere die antwort
        method: regex
        name: unified_balance_correction_markers
        operator: OR
      language:
      - description: Chinese-language requests.
        name: zh
        threshold: 0.5
      - description: Spanish-language requests.
        name: es
        threshold: 0.5
      - description: French-language requests.
        name: fr
        threshold: 0.5
      - description: Japanese-language requests.
        name: ja
        threshold: 0.5
      - description: German-language requests.
        name: de
        threshold: 0.5
      reasks:
      - description: Detect an immediate semantic repeat after an unsatisfactory answer.
        lookback_turns: 1
        name: unified_balance_reask
        threshold: 0.8
      structure:
      - description: Requests containing a dense set of explicit constraints.
        feature:
          source:
            keywords:
            - at most
            - at least
            - must
            - without
            - no more than
            - "\u4E0D\u8D85\u8FC7"
            - "\u81F3\u5C11"
            - "\u5FC5\u987B"
            type: keyword_set
          type: density
        name: unified_balance_constraint_dense
        predicate:
          gt: 0.08
      user_feedbacks:
      - description: Detect explicit correction or dissatisfaction with the previous
          answer.
        name: wrong_answer
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 10
        method: threshold_bands
        name: unified_balance_effort_band
        outputs:
        - lt: 0.3
          name: unified_balance_standard
        - gte: 0.3
          name: unified_balance_deliberate
        source: unified_balance_effort_score
      scores:
      - inputs:
        - name: unified_balance_simple_markers
          type: keyword
          value_source: confidence
          weight: -0.35
        - name: unified_balance_terse_markers
          type: keyword
          value_source: confidence
          weight: -0.1
        - name: unified_balance_negated_reasoning
          type: keyword
          value_source: confidence
          weight: -1
        - name: unified_balance_reasoning_markers
          type: keyword
          value_source: confidence
          weight: 0.85
        - name: unified_balance_verification_markers
          type: keyword
          value_source: confidence
          weight: 0.45
        - name: needs_fact_check
          type: fact_check
          weight: 0.45
        - name: wrong_answer
          type: user_feedback
          weight: 0.35
        - name: unified_balance_correction_markers
          type: keyword
          value_source: confidence
          weight: 0.35
        - name: unified_balance_reask
          type: reask
          value_source: confidence
          weight: 0.25
        - name: unified_balance_long_context
          type: context
          weight: 0.18
        - name: unified_balance_constraint_dense
          type: structure
          weight: 0.45
        - name: unified_balance_difficulty:hard
          type: complexity
          weight: 0.4
        - name: unified_balance_difficulty:easy
          type: complexity
          weight: -0.05
        - name: unified_balance_multi_turn
          type: conversation
          weight: 0.08
        - name: zh
          type: language
          weight: 0.06
        - name: es
          type: language
          weight: 0.06
        - name: fr
          type: language
          weight: 0.06
        - name: ja
          type: language
          weight: 0.06
        - name: de
          type: language
          weight: 0.06
        method: weighted_sum
        name: unified_balance_effort_score
    decisions:
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: first
          weights:
            cost: 0.1
            latency: 0.1
            load: 0.15
            quality: 0.65
        type: multi_factor
      description: Recover from explicit dissatisfaction with a stronger reasoning
        pool and corrective prompt.
      name: unified_balance_recovery
      plugins:
      - configuration:
          enabled: true
          mode: insert
          system_prompt: Rebuild the answer from first principles, correct the earlier
            miss directly, and make the improvement explicit.
        type: system_prompt
      priority: 300
      rules:
        conditions:
        - name: wrong_answer
          type: user_feedback
        - name: unified_balance_correction_markers
          type: keyword
        - name: unified_balance_reask
          type: reask
        operator: OR
      tier: 1
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: cheapest
          weights:
            cost: 0.15
            latency: 0.15
            load: 0.15
            quality: 0.55
        type: multi_factor
      description: Increase quality for complex, constrained, long-context, or verification-heavy
        work.
      name: unified_balance_deliberate_route
      priority: 200
      rules:
        conditions:
        - name: unified_balance_deliberate
          type: projection
        operator: AND
      tier: 2
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: cheapest
          weights:
            cost: 0.25
            latency: 0.2
            load: 0.15
            quality: 0.4
        type: multi_factor
      description: Balance quality, observed latency, configured cost, and current
        load.
      name: unified_balance_route
      priority: 100
      rules:
        conditions: []
        operator: AND
      tier: 3
    strategy: priority
- name: speed-first
  description: Prefer the lowest observed latency while preserving a bounded lane
    for heavy requests.
  document:
    signals:
      context:
      - description: Long requests where first-token and generation latency should
          be measured separately.
        max_tokens: 262K
        min_tokens: 16K
        name: unified_speed_long_context
      keywords:
      - case_sensitive: false
        keywords:
        - deep analysis
        - detailed architecture
        - comprehensive review
        - multi-step plan
        - "\u6DF1\u5165\u5206\u6790"
        - "\u8BE6\u7EC6\u67B6\u6784"
        - "\u5168\u9762\u5BA1\u67E5"
        - "\u591A\u6B65\u9AA4\u8BA1\u5212"
        - "an\xE1lisis profundo"
        - "architecture d\xE9taill\xE9e"
        - "\u8A73\u7D30\u306A\u30A2\u30FC\u30AD\u30C6\u30AF\u30C1\u30E3"
        - "gr\xFCndliche analyse"
        method: regex
        name: unified_speed_heavy_markers
        operator: OR
      structure:
      - description: Prompts that require an ordered workflow.
        feature:
          source:
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - "\u9996\u5148"
              - "\u7136\u540E"
            - - "\u5148"
              - "\u518D"
            type: sequence
          type: sequence
        name: unified_speed_ordered_workflow
    projections:
      mappings:
      - method: threshold_bands
        name: unified_speed_work_band
        outputs:
        - lt: 0.35
          name: unified_speed_interactive
        - gte: 0.35
          name: unified_speed_heavy
        source: unified_speed_work_score
      scores:
      - inputs:
        - name: unified_speed_heavy_markers
          type: keyword
          value_source: confidence
          weight: 0.6
        - name: unified_speed_long_context
          type: context
          weight: 0.35
        - name: unified_speed_ordered_workflow
          type: structure
          weight: 0.25
        method: weighted_sum
        name: unified_speed_work_score
    decisions:
    - algorithm:
        latency_aware:
          description: Minimize observed generation and first-token latency.
          tpot_percentile: 90
          ttft_percentile: 90
        type: latency_aware
      description: Use live TTFT and TPOT percentiles across efficient models for
        heavier requests.
      name: unified_speed_heavy_route
      priority: 200
      rules:
        conditions:
        - name: unified_speed_heavy
          type: projection
        operator: AND
      tier: 1
    - algorithm:
        multi_factor:
          latency_percentile: 90
          on_no_candidates: first
          weights:
            latency: 0.85
            load: 0.15
        type: multi_factor
      description: Choose the fastest healthy candidate from live p90 latency and
        load.
      name: unified_speed_first_route
      plugins:
      - configuration:
          enabled: true
          semantic:
            similarity_threshold: 0.9
          ttl_seconds: 900
        type: response_cache
      priority: 100
      rules:
        conditions: []
        operator: AND
      tier: 2
    strategy: priority
- name: cost-first
  description: Keep every request local and spend additional compute only when the
    request justifies reasoning.
  document:
    signals:
      context:
      - description: Long requests that benefit from local reasoning.
        max_tokens: 262K
        min_tokens: 16K
        name: unified_cost_long_context
      keywords:
      - case_sensitive: false
        keywords:
        - reason step by step
        - analyze the tradeoffs
        - root cause
        - design a system
        - prove that
        - "\u9010\u6B65\u63A8\u7406"
        - "\u5206\u6790\u53D6\u820D"
        - "\u6839\u56E0\u5206\u6790"
        - "\u8BBE\u8BA1\u7CFB\u7EDF"
        - "\u8BC1\u660E"
        - razonar paso a paso
        - razona paso a paso
        - "concevoir un syst\xE8me"
        - "con\xE7ois un syst\xE8me"
        - "raisonner \xE9tape par \xE9tape"
        - "raisonne \xE9tape par \xE9tape"
        - "\u6BB5\u968E\u7684\u306B\u63A8\u8AD6"
        - system entwerfen
        method: regex
        name: unified_cost_reasoning_markers
        operator: OR
      structure:
      - description: Multi-stage requests that benefit from local reasoning.
        feature:
          source:
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - "\u9996\u5148"
              - "\u7136\u540E"
            - - "\u5148"
              - "\u518D"
            type: sequence
          type: sequence
        name: unified_cost_ordered_workflow
    projections:
      mappings:
      - method: threshold_bands
        name: unified_cost_compute_band
        outputs:
        - lt: 0.35
          name: unified_cost_direct
        - gte: 0.35
          name: unified_cost_reasoning
        source: unified_cost_compute_score
      scores:
      - inputs:
        - name: unified_cost_reasoning_markers
          type: keyword
          value_source: confidence
          weight: 0.6
        - name: unified_cost_long_context
          type: context
          weight: 0.35
        - name: unified_cost_ordered_workflow
          type: structure
          weight: 0.3
        method: weighted_sum
        name: unified_cost_compute_score
    decisions:
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.6
            load: 0.4
        type: multi_factor
      description: Enable bounded reasoning on the self-hosted model for genuinely
        demanding requests.
      name: unified_cost_local_reasoning
      priority: 200
      rules:
        conditions:
        - name: unified_cost_reasoning
          type: projection
        operator: AND
      tier: 1
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.8
            load: 0.2
        type: multi_factor
      description: Deterministic local route with semantic reuse for ordinary requests.
      name: unified_cost_first_route
      plugins:
      - configuration:
          enabled: true
          semantic:
            similarity_threshold: 0.88
          ttl_seconds: 3600
        type: response_cache
      priority: 100
      rules:
        conditions: []
        operator: AND
      tier: 2
    strategy: priority
- name: accuracy-first
  description: Escalate from a frontier direct answer to ReMoM, Fusion, or Router
    Flow when the task benefits from orchestration.
  document:
    signals:
      complexity:
      - description: Semantic boundary for tasks that merit multi-round reasoning.
        easy:
          candidates:
          - Explain a familiar concept in plain language.
          - Summarize a short paragraph.
          - Answer a direct factual question.
        hard:
          candidates:
          - Prove a difficult result by exploring multiple possible derivations.
          - Diagnose a complex distributed-system failure with incomplete evidence.
          - Synthesize competing scientific explanations into a rigorous conclusion.
        name: unified_frontier_complexity
        threshold: 0.15
      context:
      - description: Long-context tasks that benefit from multi-pass synthesis.
        max_tokens: 262K
        min_tokens: 16K
        name: unified_frontier_long_context
      conversation:
      - description: Tool-rich requests are candidates for Router Flow decomposition.
        feature:
          source:
            type: tool_definition
          type: count
        name: unified_frontier_tooling_available
        predicate:
          gte: 2
      - description: Continue an already active tool loop through Router Flow.
        feature:
          source:
            type: active_tool_loop
          type: exists
        name: unified_frontier_active_tool_loop
      embeddings:
      - aggregation_method: max
        candidates:
        - Investigate the repository, implement the fix, run tests, and iterate until
          it works.
        - Coordinate specialized agents to research, code, review, and validate a
          complete solution.
        - "\u5236\u5B9A\u6267\u884C\u8BA1\u5212\uFF0C\u5B8C\u6210\u5B9E\u73B0\u3001\
          \u8BC4\u5BA1\u548C\u9A8C\u8BC1\u3002"
        - "Investiga el repositorio, implementa la soluci\xF3n y valida todos los\
          \ cambios."
        - "\u30EA\u30DD\u30B8\u30C8\u30EA\u3092\u8ABF\u67FB\u3057\u3001\u4FEE\u6B63\
          \u3092\u5B9F\u88C5\u3057\u3066\u691C\u8A3C\u3057\u3066\u304F\u3060\u3055\
          \u3044\u3002"
        name: unified_frontier_workflow_intent
        threshold: 0.78
      - aggregation_method: max
        candidates:
        - Ask independent experts to solve the problem and synthesize the most reliable
          answer.
        - Compare conflicting analyses, identify disagreements, and produce a verified
          conclusion.
        - "\u6C47\u603B\u591A\u4E2A\u72EC\u7ACB\u89C2\u70B9\u5E76\u89E3\u51B3\u5176\
          \u4E2D\u7684\u5206\u6B67\u3002"
