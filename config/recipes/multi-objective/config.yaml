recipes:
- name: balanced
  description: Mixture-of-Models · Balanced — adaptive quality, speed, and efficiency for everyday routing.
  routing:
    signals:
      keywords:
      - name: unified_balance_simple_markers
        operator: OR
        keywords:
        - quick answer
        - answer briefly
        - one sentence
        - concise summary
        - 简单回答
        - 简要说明
        - respuesta breve
        - réponse brève
        - 簡潔に答えて
        - kurz antworten
        case_sensitive: false
        method: regex
      - name: unified_balance_terse_markers
        operator: OR
        keywords:
        - concise and direct
        - brief and direct
        - 简洁直接
        - 简短直接
        - breve y directa
        - brève et directe
        - 簡潔で直接的
        - kurz und direkt
        case_sensitive: false
        method: regex
      - name: unified_balance_negated_reasoning
        operator: OR
        keywords:
        - do not analyze
        - don't analyze
        - without analysis
        - 不要分析
        - 无需分析
        - no analices
        - sans analyse
        - 分析しない
        - nicht analysieren
        case_sensitive: false
        method: regex
      - name: unified_balance_reasoning_markers
        operator: OR
        keywords:
        - analyze the tradeoffs
        - analyze the trade-offs
        - from first principles
        - root cause
        - step by step
        - system design
        - consistency tradeoffs
        - competing production failure
        - 分析取舍
        - 第一性原理
        - 根因分析
        - 逐步推理
        - 取舍
        - 根因
        - analizar las ventajas y desventajas
        - causa raíz
        - analyser les compromis
        - cause racine
        - 根本原因を分析
        - 段階的に推論
        - トレードオフ
        - 根本原因
        - トレードオフを分析
        - 根本原因と
        - kompromisse analysieren
        case_sensitive: false
        method: regex
      - name: unified_balance_verification_markers
        operator: OR
        keywords:
        - verify the answer
        - cite sources
        - fact-check
        - check the evidence
        - provide evidence
        - 核实答案
        - 引用来源
        - 检查证据
        - verificar la respuesta
        - citer les sources
        - 答えを検証
        - quellen zitieren
        case_sensitive: false
        method: regex
      - name: unified_balance_correction_markers
        operator: OR
        keywords:
        - that's wrong
        - wrong answer
        - please correct the answer
        - try again
        - 回答错了
        - 请纠正答案
        - 重新回答
        - la respuesta es incorrecta
        - corrige la respuesta
        - la réponse est incorrecte
        - corrige la réponse
        - 回答が間違っています
        - bitte korrigiere die antwort
        case_sensitive: false
        method: regex
      fact_check:
      - name: needs_fact_check
        description: Detect claims that benefit from evidence-backed verification.
      user_feedbacks:
      - name: wrong_answer
        description: Detect explicit correction or dissatisfaction with the previous answer.
      reasks:
      - name: unified_balance_reask
        description: Detect an immediate semantic repeat after an unsatisfactory answer.
        threshold: 0.8
        lookback_turns: 1
      language:
      - name: zh
        description: Chinese-language requests.
        threshold: 0.5
      - name: es
        description: Spanish-language requests.
        threshold: 0.5
      - name: fr
        description: French-language requests.
        threshold: 0.5
      - name: ja
        description: Japanese-language requests.
        threshold: 0.5
      - name: de
        description: German-language requests.
        threshold: 0.5
      conversation:
      - name: unified_balance_multi_turn
        description: Multi-turn conversations benefit from a small synthesis allowance.
        feature:
          type: count
          source:
            type: message
            role: user
        predicate:
          gte: 2
      context:
      - name: unified_balance_long_context
        min_tokens: 12K
        max_tokens: 262K
        description: Long inputs that justify stronger synthesis.
      structure:
      - name: unified_balance_constraint_dense
        description: Requests containing a dense set of explicit constraints.
        feature:
          type: density
          source:
            type: keyword_set
            keywords:
            - at most
            - at least
            - must
            - without
            - no more than
            - 不超过
            - 至少
            - 必须
        predicate:
          gt: 0.08
      complexity:
      - name: unified_balance_difficulty
        threshold: 0.08
        description: Semantic boundary between direct requests and synthesis-heavy work.
        easy:
          candidates:
          - Give a short definition of a common term.
          - Summarize one paragraph in a single sentence.
          - Explain a basic concept with one example.
        hard:
          candidates:
          - Analyze a production failure from several competing root causes.
          - Design a distributed system and justify its consistency tradeoffs.
          - Synthesize conflicting evidence into a defensible recommendation.
    projections:
      scores:
      - name: unified_balance_effort_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_balance_simple_markers
          weight: -0.35
          value_source: confidence
        - type: keyword
          name: unified_balance_terse_markers
          weight: -0.1
          value_source: confidence
        - type: keyword
          name: unified_balance_negated_reasoning
          weight: -1
          value_source: confidence
        - type: keyword
          name: unified_balance_reasoning_markers
          weight: 0.85
          value_source: confidence
        - type: keyword
          name: unified_balance_verification_markers
          weight: 0.45
          value_source: confidence
        - type: fact_check
          name: needs_fact_check
          weight: 0.45
        - type: user_feedback
          name: wrong_answer
          weight: 0.35
        - type: keyword
          name: unified_balance_correction_markers
          weight: 0.35
          value_source: confidence
        - type: reask
          name: unified_balance_reask
          weight: 0.25
          value_source: confidence
        - type: context
          name: unified_balance_long_context
          weight: 0.18
        - type: structure
          name: unified_balance_constraint_dense
          weight: 0.45
        - type: complexity
          name: unified_balance_difficulty:hard
          weight: 0.4
        - type: complexity
          name: unified_balance_difficulty:easy
          weight: -0.05
        - type: conversation
          name: unified_balance_multi_turn
          weight: 0.08
        - type: language
          name: zh
          weight: 0.06
        - type: language
          name: es
          weight: 0.06
        - type: language
          name: fr
          weight: 0.06
        - type: language
          name: ja
          weight: 0.06
        - type: language
          name: de
          weight: 0.06
      mappings:
      - name: unified_balance_effort_band
        source: unified_balance_effort_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10
        outputs:
        - name: unified_balance_standard
          lt: 0.3
        - name: unified_balance_deliberate
          gte: 0.3
    decisions:
    - name: unified_balance_recovery
      description: Recover from explicit dissatisfaction with a stronger reasoning pool and corrective prompt.
      priority: 300
      tier: 1
      rules:
        operator: OR
        conditions:
        - type: user_feedback
          name: wrong_answer
        - type: keyword
          name: unified_balance_correction_markers
        - type: reask
          name: unified_balance_reask
      modelRefs:
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/gemma4-26b-balanced
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: multi_factor
        multi_factor:
          weights:
            quality: 0.65
            latency: 0.1
            cost: 0.1
            load: 0.15
          latency_percentile: 95
          on_no_candidates: first
      plugins:
      - type: system_prompt
        configuration:
          enabled: true
          mode: insert
          system_prompt: Rebuild the answer from first principles, correct the earlier miss directly, and make the improvement explicit.
    - name: unified_balance_deliberate_route
      description: Increase quality for complex, constrained, long-context, or verification-heavy work.
      priority: 200
      tier: 2
      rules:
        operator: AND
        conditions:
        - type: projection
          name: unified_balance_deliberate
      modelRefs:
      - model: local/qwen3.5-9b-economy
        use_reasoning: false
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: multi_factor
        multi_factor:
          weights:
            quality: 0.55
            latency: 0.15
            cost: 0.15
            load: 0.15
          latency_percentile: 95
          on_no_candidates: cheapest
    - name: unified_balance_route
      description: Balance quality, observed latency, configured cost, and current load.
      priority: 100
      tier: 3
      rules:
        operator: AND
        conditions: []
      modelRefs:
      - model: local/qwen3.5-9b-economy
        use_reasoning: false
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/gemma4-26b-balanced
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: multi_factor
        multi_factor:
          weights:
            quality: 0.4
            latency: 0.2
            cost: 0.25
            load: 0.15
          latency_percentile: 95
          on_no_candidates: cheapest
    strategy: priority
- name: speed-first
  description: Prefer the lowest observed latency while preserving a bounded lane for heavy requests.
  routing:
    signals:
      keywords:
      - name: unified_speed_heavy_markers
        operator: OR
        keywords:
        - deep analysis
        - detailed architecture
        - comprehensive review
        - multi-step plan
        - 深入分析
        - 详细架构
        - 全面审查
        - 多步骤计划
        - análisis profundo
        - architecture détaillée
        - 詳細なアーキテクチャ
        - gründliche analyse
        case_sensitive: false
        method: regex
      context:
      - name: unified_speed_long_context
        min_tokens: 16K
        max_tokens: 262K
        description: Long requests where first-token and generation latency should be measured separately.
      structure:
      - name: unified_speed_ordered_workflow
        description: Prompts that require an ordered workflow.
        feature:
          type: sequence
          source:
            type: sequence
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - 首先
              - 然后
            - - 先
              - 再
    projections:
      scores:
      - name: unified_speed_work_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_speed_heavy_markers
          weight: 0.6
          value_source: confidence
        - type: context
          name: unified_speed_long_context
          weight: 0.35
        - type: structure
          name: unified_speed_ordered_workflow
          weight: 0.25
      mappings:
      - name: unified_speed_work_band
        source: unified_speed_work_score
        method: threshold_bands
        outputs:
        - name: unified_speed_interactive
          lt: 0.35
        - name: unified_speed_heavy
          gte: 0.35
    decisions:
    - name: unified_speed_heavy_route
      description: Use live TTFT and TPOT percentiles across efficient models for heavier requests.
      priority: 200
      tier: 1
      rules:
        operator: AND
        conditions:
        - type: projection
          name: unified_speed_heavy
      modelRefs:
      - model: local/qwen3.5-9b-economy
        use_reasoning: false
      - model: local/qwen3.5-9b-economy-replica
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/gemma4-26b-balanced
        use_reasoning: false
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      algorithm:
        type: latency_aware
        latency_aware:
          tpot_percentile: 90
          ttft_percentile: 90
          description: Minimize observed generation and first-token latency.
    - name: unified_speed_first_route
      description: Choose the fastest healthy candidate from live p90 latency and load.
      priority: 100
      tier: 2
      rules:
        operator: AND
        conditions: []
      modelRefs:
      - model: local/qwen3.5-9b-economy
        use_reasoning: false
      - model: local/qwen3.5-9b-economy-replica
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/gemma4-26b-balanced
        use_reasoning: false
      algorithm:
        type: multi_factor
        multi_factor:
          weights:
            latency: 0.85
            load: 0.15
          latency_percentile: 90
          on_no_candidates: first
      plugins:
      - type: response_cache
        configuration:
          enabled: true
          similarity_threshold: 0.9
          ttl_seconds: 900
    strategy: priority
- name: cost-first
  description: Keep every request local and spend additional compute only when the request justifies reasoning.
  routing:
    signals:
      keywords:
      - name: unified_cost_reasoning_markers
        operator: OR
        keywords:
        - reason step by step
        - analyze the tradeoffs
        - root cause
        - design a system
        - prove that
        - 逐步推理
        - 分析取舍
        - 根因分析
        - 设计系统
        - 证明
        - razonar paso a paso
        - razona paso a paso
        - concevoir un système
        - conçois un système
        - raisonner étape par étape
        - raisonne étape par étape
        - 段階的に推論
        - system entwerfen
        case_sensitive: false
        method: regex
      context:
      - name: unified_cost_long_context
        min_tokens: 16K
        max_tokens: 262K
        description: Long requests that benefit from local reasoning.
      structure:
      - name: unified_cost_ordered_workflow
        description: Multi-stage requests that benefit from local reasoning.
        feature:
          type: sequence
          source:
            type: sequence
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - 首先
              - 然后
            - - 先
              - 再
    projections:
      scores:
      - name: unified_cost_compute_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_cost_reasoning_markers
          weight: 0.6
          value_source: confidence
        - type: context
          name: unified_cost_long_context
          weight: 0.35
        - type: structure
          name: unified_cost_ordered_workflow
          weight: 0.3
      mappings:
      - name: unified_cost_compute_band
        source: unified_cost_compute_score
        method: threshold_bands
        outputs:
        - name: unified_cost_direct
          lt: 0.35
        - name: unified_cost_reasoning
          gte: 0.35
    decisions:
    - name: unified_cost_local_reasoning
