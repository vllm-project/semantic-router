        case_sensitive: false
        method: regex
      - name: unified_frontier_deep_markers
        operator: OR
        keywords:
        - explore several approaches
        - search multiple reasoning paths
        - from first principles
        - rigorous proof
        - derive step by step
        - hard reasoning problem
        - difficult result
        - multiple possible derivations
        - think deeply before answering
        - think deeply
        - solve this thoroughly
        - reason through alternative paths
        - alternative paths
        - do a deep analysis
        - 探索多种方法
        - 多条推理路径
        - 第一性原理
        - 严格证明
        - 逐步推导
        - explorar varios enfoques
        - demostración rigurosa
        - explorer plusieurs approches
        - preuve rigoureuse
        - 複数のアプローチを探索
        - 複数のアプローチと推論経路を探索
        - 推論経路を探索
        - 厳密な証明
        - mehrere ansätze untersuchen
        - denkwege untersuchen
        case_sensitive: false
        method: regex
      - name: unified_frontier_verification_markers
        operator: OR
        keywords:
        - verify with evidence
        - verify the answer
        - cite reliable sources
        - check every factual claim
        - 用证据核实
        - 核实每个事实
        - verificar con evidencia
        - vérifier avec des preuves
        - 証拠で検証
        - mit belegen überprüfen
        - \b(is|was|were)\b.{0,80}\b(accurate|true|correct)\b
        - \b(when was|who invented|what is the population|how tall is)\b
        case_sensitive: false
        method: regex
      embeddings:
      - name: unified_frontier_workflow_intent
        threshold: 0.78
        aggregation_method: max
        candidates:
        - Investigate the repository, implement the fix, run tests, and iterate until it works.
        - Coordinate specialized agents to research, code, review, and validate a complete solution.
        - 制定执行计划，完成实现、评审和验证。
        - Investiga el repositorio, implementa la solución y valida todos los cambios.
        - リポジトリを調査し、修正を実装して検証してください。
      - name: unified_frontier_fusion_intent
        threshold: 0.79
        aggregation_method: max
        candidates:
        - Ask independent experts to solve the problem and synthesize the most reliable answer.
        - Compare conflicting analyses, identify disagreements, and produce a verified conclusion.
        - 汇总多个独立观点并解决其中的分歧。
        - Compara análisis independientes, resuelve desacuerdos y sintetiza la respuesta.
        - 複数の独立した分析を比較し、相違点を解決してください。
      - name: unified_frontier_deep_intent
        threshold: 0.78
        aggregation_method: max
        candidates:
        - Explore several reasoning paths and synthesize the strongest rigorous solution.
        - Build a careful derivation from first principles for a difficult problem.
        - 从多个推理路径探索难题并综合最强答案。
        - Explora varias rutas de razonamiento y sintetiza la solución más rigurosa.
        - 複数の推論経路を探索し、最も厳密な解答を統合してください。
      language:
      - name: zh
        description: Chinese-language requests.
        threshold: 0.5
      - name: es
        description: Spanish-language requests.
        threshold: 0.5
      - name: fr
        description: French-language requests.
        threshold: 0.5
      - name: ja
        description: Japanese-language requests.
        threshold: 0.5
      - name: de
        description: German-language requests.
        threshold: 0.5
      conversation:
      - name: unified_frontier_tooling_available
        description: Tool-rich requests are candidates for Router Flow decomposition.
        feature:
          type: count
          source:
            type: tool_definition
        predicate:
          gte: 2
      - name: unified_frontier_active_tool_loop
        description: Continue an already active tool loop through Router Flow.
        feature:
          type: exists
          source:
            type: active_tool_loop
      context:
      - name: unified_frontier_long_context
        min_tokens: 16K
        max_tokens: 262K
        description: Long-context tasks that benefit from multi-pass synthesis.
      structure:
      - name: unified_frontier_ordered_workflow
        description: Prompts that explicitly describe a multi-stage workflow.
        feature:
          type: sequence
          source:
            type: sequence
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - 首先
              - 然后
            - - 先
              - 再
      - name: unified_frontier_constraint_dense
        description: Prompts with dense correctness or output constraints.
        feature:
          type: density
          source:
            type: keyword_set
            keywords:
            - must
            - exactly
            - at least
            - at most
            - verify
            - 必须
            - 严格
            - 至少
            - 不超过
        predicate:
          gt: 0.08
      - name: unified_frontier_direct_reference
        description: >-
          Detect requests that quote orchestration vocabulary only to define,
          translate, or briefly explain it; this independently suppresses
          workflow and fusion escalation even when their keyword signals match.
        feature:
          type: exists
          source:
            type: regex
            pattern: >-
              (?i)(\b(define|translate|explain)\b.{0,48}\b(phrase|term|expression)\b|(définis|traduis|explique).{0,48}(expression|terme)|(define|traduce|explica).{0,48}(frase|expresión|término)|(definiere|übersetze|erkläre).{0,48}(ausdruck|begriff)|(定义|翻译|解释).{0,16}(短语|词语|“|「)|(説明|翻訳).{0,16}(表現|語句|「))
      complexity:
      - name: unified_frontier_complexity
        threshold: 0.15
        description: Semantic boundary for tasks that merit multi-round reasoning.
        easy:
          candidates:
          - Explain a familiar concept in plain language.
          - Summarize a short paragraph.
          - Answer a direct factual question.
        hard:
          candidates:
          - Prove a difficult result by exploring multiple possible derivations.
          - Diagnose a complex distributed-system failure with incomplete evidence.
          - Synthesize competing scientific explanations into a rigorous conclusion.
    projections:
      scores:
      - name: unified_frontier_workflow_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_frontier_workflow_markers
          weight: 0.7
          value_source: confidence
        - type: embedding
          name: unified_frontier_workflow_intent
          weight: 0.55
          value_source: confidence
        - type: conversation
          name: unified_frontier_tooling_available
          weight: 0.1
        - type: conversation
          name: unified_frontier_active_tool_loop
          weight: 0.1
        - type: structure
          name: unified_frontier_ordered_workflow
          weight: 0.25
        - type: structure
          name: unified_frontier_direct_reference
          weight: -0.9
      - name: unified_frontier_fusion_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_frontier_fusion_markers
          weight: 0.7
          value_source: confidence
        - type: embedding
          name: unified_frontier_fusion_intent
          weight: 0.55
          value_source: confidence
        - type: structure
          name: unified_frontier_direct_reference
          weight: -0.9
      - name: unified_frontier_deliberation_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_frontier_deep_markers
          weight: 0.45
          value_source: confidence
        - type: embedding
          name: unified_frontier_deep_intent
          weight: 0.35
          value_source: confidence
        - type: context
          name: unified_frontier_long_context
          weight: 0.2
        - type: structure
          name: unified_frontier_ordered_workflow
          weight: 0.15
        - type: structure
          name: unified_frontier_constraint_dense
          weight: 0.1
        - type: complexity
          name: unified_frontier_complexity:hard
          weight: 0.35
        - type: structure
          name: unified_frontier_direct_reference
          weight: -0.65
        - type: language
          name: zh
          weight: 0.05
        - type: language
          name: es
          weight: 0.05
        - type: language
          name: fr
          weight: 0.05
        - type: language
          name: ja
          weight: 0.05
        - type: language
          name: de
          weight: 0.05
      mappings:
      - name: unified_frontier_workflow_band
        source: unified_frontier_workflow_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 12
        outputs:
        - name: unified_frontier_not_workflow
          lt: 0.5
        - name: unified_frontier_use_workflow
          gte: 0.5
      - name: unified_frontier_fusion_band
        source: unified_frontier_fusion_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 12
        outputs:
        - name: unified_frontier_not_fusion
          lt: 0.5
        - name: unified_frontier_use_fusion
          gte: 0.5
      - name: unified_frontier_deliberation_band
        source: unified_frontier_deliberation_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10
        outputs:
        - name: unified_frontier_direct
          lt: 0.35
        - name: unified_frontier_deliberate
          gte: 0.35
    decisions:
    - name: unified_frontier_workflow
      description: Use Router Flow for explicit investigate-plan-execute tasks with separable roles.
      priority: 400
      tier: 1
      rules:
        operator: AND
        conditions:
        - type: projection
          name: unified_frontier_use_workflow
        - operator: OR
          conditions:
          - type: keyword
            name: unified_frontier_workflow_markers
          - type: structure
            name: unified_frontier_ordered_workflow
      modelRefs:
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: workflows
        workflows:
          mode: dynamic
          template: micro_agent
          planner:
            model: local/qwen3.6-27b-coder
          max_steps: 4
          max_parallel: 3
          round_timeout_seconds: 120
          min_successful_responses: 2
          include_intermediate_responses: false
          on_error: skip
    - name: unified_frontier_tool_result_synthesis
      description: Synthesize an existing client tool result directly without spawning another tool or multi-agent loop.
      priority: 375
      tier: 2
      rules:
        operator: AND
        conditions:
        - type: conversation
          name: unified_frontier_active_tool_loop
        - operator: NOT
          conditions:
          - type: keyword
            name: unified_frontier_workflow_markers
      modelRefs:
      - model: local/qwen3.5-122b-frontier
        use_reasoning: true
        reasoning_effort: medium
      algorithm:
        type: static
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: none
    - name: unified_frontier_fusion
      description: Use independent expert answers plus a frontier judge when disagreement resolution matters.
      priority: 350
      tier: 3
      rules:
        operator: AND
        conditions:
        - type: projection
          name: unified_frontier_use_fusion
        - type: keyword
          name: unified_frontier_fusion_markers
      modelRefs:
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/gemma4-26b-balanced
        use_reasoning: false
      - model: local/deepseek-v4-flash-analyst
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: fusion
        fusion:
          model: local/qwen3.5-122b-frontier
          analysis_models:
          - local/qwen3.6-27b-coder
          - local/gemma4-26b-balanced
          - local/deepseek-v4-flash-analyst
          max_concurrent: 3
          round_timeout_seconds: 180
          min_successful_responses: 2
          temperature: 0.2
          include_analysis: false
          include_intermediate_responses: false
          on_error: skip
          judge_prompt_version: fusion-v1
    - name: unified_frontier_verified_answer
      description: Escalate evidence-sensitive factual answers from an efficient model to frontier models only when confidence is insufficient.
      priority: 325
      tier: 4
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: unified_frontier_verification_markers
      modelRefs:
      - model: local/qwen3.5-9b-economy
        use_reasoning: false
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: confidence
        confidence:
          confidence_method: avg_logprob
          threshold: 0.72
          escalation_order: small_to_large
          on_error: skip
    - name: unified_frontier_remom
      description: Use bounded multi-round search and synthesis for deep reasoning tasks.
      priority: 300
      tier: 5
      rules:
        operator: AND
        conditions:
        - type: projection
          name: unified_frontier_deliberate
      modelRefs:
      - model: local/qwen3.6-27b-coder
        use_reasoning: true
        reasoning_effort: high
      - model: local/deepseek-v4-flash-analyst
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: true
        reasoning_effort: high
      algorithm:
        type: remom
        remom:
          breadth_schedule:
          - 3
          - 2
          model_distribution: round_robin
          temperature: 0.6
          include_reasoning: true
          compaction_strategy: last_n_tokens
          compaction_tokens: 8000
          synthesis_model: local/qwen3.5-122b-frontier
          max_concurrent: 3
          round_timeout_seconds: 180
          min_successful_responses: 2
          max_responses_per_round: 3
          include_intermediate_responses: false
          on_error: skip
    - name: unified_frontier_direct
      description: Use the strongest direct model when orchestration would add little value.
      priority: 100
      tier: 6
      rules:
        operator: AND
        conditions: []
      modelRefs:
      - model: local/qwen3.6-27b-coder
        use_reasoning: false
      - model: local/qwen3.6-35b-flash
        use_reasoning: false
      - model: local/gemma4-26b-balanced
        use_reasoning: false
      - model: local/qwen3.5-122b-frontier
        use_reasoning: false
      algorithm:
        type: multi_factor
        multi_factor:
          weights:
            quality: 1
          on_no_candidates: first
    strategy: priority
- name: privacy-first
  description: Keep every request local, using recipe-scoped risk projections to isolate sensitive and suspicious prompts.
  routing:
    signals:
      keywords:
      - name: unified_privacy_local_only_markers
        operator: OR
        keywords:
        - local processing only
        - on-prem only
        - do not send to the cloud
        - confidential handling
        - internal use only
        - private repository
        - proprietary code
        - internal document
        - 本地处理
        - 不要发到云端
        - 仅供内部使用
        - 私有仓库
        - 内部文档
        - solo procesamiento local
        - no enviar a la nube
        - traitement local uniquement
        - ne pas envoyer au cloud
        - ローカル処理のみ
        - クラウドに送信しない
        - nur lokale verarbeitung
        case_sensitive: false
        method: regex
      - name: unified_privacy_sensitive_markers
        operator: OR
        keywords:
        - \b\d{3}-\d{2}-\d{4}\b
        - \b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b
        - \b(ssn|social security number|credit card|passport number)\b
        - (身份证|邮箱|护照号码|银行卡号)
        - (número de seguridad social|correo electrónico|pasaporte)
        - (numéro de sécurité sociale|adresse e-mail|passeport)
        - (マイナンバー|メールアドレス|パスポート番号)
        - (sozialversicherungsnummer|e-mail-adresse|reisepassnummer)
        case_sensitive: false
        method: regex
      - name: unified_privacy_attack_markers
        operator: OR
        keywords:
        - ignore previous instructions
        - reveal the system prompt
        - exfiltrate credentials
        - bypass the safety policy
        - 忽略之前的指令
        - 泄露系统提示词
        - 导出凭据
        - 绕过安全策略
        - ignora las instrucciones anteriores
        - extraer credenciales
        - ignorer les instructions précédentes
        - exfiltrer les identifiants
        - 以前の指示を無視
        - 認証情報を流出
        - vorherige anweisungen ignorieren
        case_sensitive: false
        method: regex
      jailbreak:
      - name: unified_privacy_jailbreak_strict
        method: classifier
        threshold: 0.45
        description: Detect suspicious prompts that require local containment.
      pii:
      - name: unified_privacy_pii_strict
        threshold: 0.7
        description: Detect personally identifiable information that must remain local.
      kb:
      - name: unified_privacy_policy
        kb: privacy_kb
        target:
          kind: group
          value: privacy_policy
        match: best
    projections:
      scores:
      - name: unified_privacy_risk_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: unified_privacy_local_only_markers
          weight: 0.5
          value_source: confidence
        - type: keyword
          name: unified_privacy_sensitive_markers
          weight: 0.75
          value_source: confidence
        - type: pii
          name: unified_privacy_pii_strict
          weight: 0.9
        - type: jailbreak
          name: unified_privacy_jailbreak_strict
          weight: 0.9
        - type: keyword
          name: unified_privacy_attack_markers
          weight: 0.9
          value_source: confidence
        - type: kb
          name: unified_privacy_policy
          weight: 0.3
      mappings:
      - name: unified_privacy_risk_band
        source: unified_privacy_risk_score
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 12
        outputs:
        - name: unified_privacy_standard
          lt: 0.35
        - name: unified_privacy_sensitive
          gte: 0.35
    decisions:
    - name: unified_privacy_security_containment
      description: Disable tool access for suspicious prompts while keeping inference local.
      priority: 300
      tier: 1
      rules:
        operator: OR
        conditions:
        - type: jailbreak
          name: unified_privacy_jailbreak_strict
        - type: keyword
          name: unified_privacy_attack_markers
      modelRefs:
      - model: local/qwen3.5-9b-private
        use_reasoning: false
      algorithm:
        type: static
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: none
    - name: unified_privacy_sensitive_route
      description: Keep PII, private-domain, and explicit local-only work on the local model with no tools.
      priority: 200
      tier: 2
      rules:
        operator: AND
        conditions:
        - type: projection
          name: unified_privacy_sensitive
      modelRefs:
      - model: local/qwen3.5-9b-private
        use_reasoning: false
      algorithm:
        type: static
      plugins:
      - type: tools
        configuration:
          enabled: true
          mode: none
    - name: unified_privacy_local_default
      description: Route non-sensitive traffic locally as the privacy-first default.
      priority: 100
      tier: 3
      rules:
        operator: AND
        conditions: []
      modelRefs:
      - model: local/qwen3.5-9b-private
        use_reasoning: false
    strategy: priority
global:
  router:
    config_source: file
    strategy: priority
    auto_model_name: MoM
    auto_model_names: []
    include_config_models_in_list: false
    clear_route_cache: true
    model_selection:
      enabled: true
  services:
    response_api:
      enabled: true
      store_backend: redis
      ttl_seconds: 86400
      max_responses: 1000
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: vllm-sr-jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-sr
          service_version: v0.3.0
          deployment_environment: development
      metrics:
        enabled: true
    management_api:
      # The host publication remains loopback-only; split containers need the
      # Router to listen on its container interface for Dashboard and Envoy.
      bind_address: 0.0.0.0
      port: 8080
      auth:
        mode: disabled
        roles:
          admin:
          - '*'
          operator:
          - health.read
          - ready.read
          - docs.read
          - metrics.read
          - classify.invoke
          - config.read
          - config.write
          - learning.ingest
          - replay.read
          - replay.detail
          - data.read
          - data.write
          viewer:
          - health.read
          - ready.read
          - docs.read
          - metrics.read
          - classify.invoke
          - config.read
          - replay.read
          - data.read
    router_replay:
      enabled: true
      store_backend: postgres
      ttl_seconds: 2592000
    startup_status:
      store_backend: redis
  stores:
    response_cache:
      backend_type: memory
      enabled: true
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
  integrations:
    looper:
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      timeout_seconds: 1200
      flow:
        state:
          store_backend: file
          ttl_seconds: 1800
  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system:
      prompt_guard: models/mmbert32k-jailbreak-detector-merged
      pii_classifier: models/mmbert32k-pii-detector-merged
      fact_check_classifier: models/mmbert32k-factcheck-classifier-merged
      hallucination_detector: models/mom-halugate-detector
      hallucination_explainer: models/mom-halugate-explainer
      feedback_detector: models/mmbert32k-feedback-detector-merged
    modules:
      prompt_guard:
        enabled: true
        model_id: models/mmbert32k-jailbreak-detector-merged
        threshold: 0.7
        use_cpu: true
        variant: mmbert32k
        jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
        model_ref: prompt_guard
      classifier:
        pii:
          model_id: models/mmbert32k-pii-detector-merged
          threshold: 0.9
          use_cpu: true
          use_mmbert_32k: true
          pii_mapping_path: models/mmbert32k-pii-detector-merged/pii_type_mapping.json
          model_ref: pii_classifier
      complexity:
        prototype_scoring:
          enabled: true
          cluster_similarity_threshold: 0.9
          max_prototypes: 8
          best_weight: 0.75
          top_m: 2
      hallucination_mitigation:
        fact_check:
          model_id: models/mmbert32k-factcheck-classifier-merged
          threshold: 0.5
          use_cpu: true
          use_mmbert_32k: true
          model_ref: fact_check_classifier
        detector:
          model_id: models/mom-halugate-detector
          threshold: 0.8
          use_cpu: true
          min_span_length: 2
          min_span_confidence: 0.6
          context_window_size: 50
          enable_nli_filtering: true
          nli_entailment_threshold: 0.75
          model_ref: hallucination_detector
        explainer:
          model_id: models/mom-halugate-explainer
          threshold: 0.9
          use_cpu: true
          model_ref: hallucination_explainer
      feedback_detector:
        enabled: true
        model_id: models/mmbert32k-feedback-detector-merged
        threshold: 0.5
        use_cpu: true
        use_modernbert: false
        use_mmbert_32k: true
        feedback_mapping_path: ''
        model_ref: feedback_detector
