    decisions:
    - algorithm:
        type: workflows
        workflows:
          include_intermediate_responses: false
          max_parallel: 3
          max_steps: 4
          min_successful_responses: 2
          mode: dynamic
          on_error: skip
          planner: {}
          round_timeout_seconds: 120
          template: micro_agent
      description: Use Router Flow for explicit investigate-plan-execute tasks with
        separable roles.
      name: unified_frontier_workflow
      priority: 400
      rules:
        conditions:
        - name: unified_frontier_use_workflow
          type: projection
        - conditions:
          - name: unified_frontier_workflow_markers
            type: keyword
          - name: unified_frontier_ordered_workflow
            type: structure
          operator: OR
        operator: AND
      tier: 1
    - algorithm:
        type: static
      description: Synthesize an existing client tool result directly without spawning
        another tool or multi-agent loop.
      name: unified_frontier_tool_result_synthesis
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 375
      rules:
        conditions:
        - name: unified_frontier_active_tool_loop
          type: conversation
        - conditions:
          - name: unified_frontier_workflow_markers
            type: keyword
          operator: NOT
        operator: AND
      tier: 2
    - algorithm:
        fusion:
          include_analysis: false
          include_intermediate_responses: false
          judge_prompt_version: fusion-v1
          max_concurrent: 3
          min_successful_responses: 2
          on_error: skip
          round_timeout_seconds: 180
          temperature: 0.2
        type: fusion
      description: Use independent expert answers plus a frontier judge when disagreement
        resolution matters.
      name: unified_frontier_fusion
      priority: 350
      rules:
        conditions:
        - name: unified_frontier_use_fusion
          type: projection
        - name: unified_frontier_fusion_markers
          type: keyword
        operator: AND
      tier: 3
    - algorithm:
        confidence:
          confidence_method: avg_logprob
          escalation_order: small_to_large
          on_error: skip
          threshold: 0.72
        type: confidence
      description: Escalate evidence-sensitive factual answers from an efficient model
        to frontier models only when confidence is insufficient.
      name: unified_frontier_verified_answer
      priority: 325
      rules:
        conditions:
        - name: unified_frontier_verification_markers
          type: keyword
        operator: AND
      tier: 4
    - algorithm:
        remom:
          breadth_schedule:
          - 3
          - 2
          compaction_strategy: last_n_tokens
          compaction_tokens: 8000
          include_intermediate_responses: false
          include_reasoning: true
          max_concurrent: 3
          max_responses_per_round: 3
          min_successful_responses: 2
          model_distribution: round_robin
          on_error: skip
          round_timeout_seconds: 180
          temperature: 0.6
        type: remom
      description: Use bounded multi-round search and synthesis for deep reasoning
        tasks.
      name: unified_frontier_remom
      priority: 300
      rules:
        conditions:
        - name: unified_frontier_deliberate
          type: projection
        operator: AND
      tier: 5
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            quality: 1
        type: multi_factor
      description: Use the strongest direct model when orchestration would add little
        value.
      name: unified_frontier_direct
      priority: 100
      rules:
        conditions: []
        operator: AND
      tier: 6
    strategy: priority
- name: privacy-first
  description: Keep every request local, using recipe-scoped risk projections to isolate
    sensitive and suspicious prompts.
  document:
    signals:
      jailbreak:
      - description: Detect suspicious prompts that require local containment.
        method: classifier
        name: unified_privacy_jailbreak_strict
        threshold: 0.45
      kb:
      - kb: privacy_kb
        match: best
        name: unified_privacy_policy
        target:
          kind: group
          value: privacy_policy
      keywords:
      - case_sensitive: false
        keywords:
        - local processing only
        - on-prem only
        - do not send to the cloud
        - confidential handling
        - internal use only
        - private repository
        - proprietary code
        - internal document
        - "\u672C\u5730\u5904\u7406"
        - "\u4E0D\u8981\u53D1\u5230\u4E91\u7AEF"
        - "\u4EC5\u4F9B\u5185\u90E8\u4F7F\u7528"
        - "\u79C1\u6709\u4ED3\u5E93"
        - "\u5185\u90E8\u6587\u6863"
        - solo procesamiento local
        - no enviar a la nube
        - traitement local uniquement
        - ne pas envoyer au cloud
        - "\u30ED\u30FC\u30AB\u30EB\u51E6\u7406\u306E\u307F"
        - "\u30AF\u30E9\u30A6\u30C9\u306B\u9001\u4FE1\u3057\u306A\u3044"
        - nur lokale verarbeitung
        method: regex
        name: unified_privacy_local_only_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - \b\d{3}-\d{2}-\d{4}\b
        - \b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b
        - \b(ssn|social security number|credit card|passport number)\b
        - "(\u8EAB\u4EFD\u8BC1|\u90AE\u7BB1|\u62A4\u7167\u53F7\u7801|\u94F6\u884C\u5361\
          \u53F7)"
        - "(n\xFAmero de seguridad social|correo electr\xF3nico|pasaporte)"
        - "(num\xE9ro de s\xE9curit\xE9 sociale|adresse e-mail|passeport)"
        - "(\u30DE\u30A4\u30CA\u30F3\u30D0\u30FC|\u30E1\u30FC\u30EB\u30A2\u30C9\u30EC\
          \u30B9|\u30D1\u30B9\u30DD\u30FC\u30C8\u756A\u53F7)"
        - (sozialversicherungsnummer|e-mail-adresse|reisepassnummer)
        method: regex
        name: unified_privacy_sensitive_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - ignore previous instructions
        - reveal the system prompt
        - exfiltrate credentials
        - bypass the safety policy
        - "\u5FFD\u7565\u4E4B\u524D\u7684\u6307\u4EE4"
        - "\u6CC4\u9732\u7CFB\u7EDF\u63D0\u793A\u8BCD"
        - "\u5BFC\u51FA\u51ED\u636E"
        - "\u7ED5\u8FC7\u5B89\u5168\u7B56\u7565"
        - ignora las instrucciones anteriores
        - extraer credenciales
        - "ignorer les instructions pr\xE9c\xE9dentes"
        - exfiltrer les identifiants
        - "\u4EE5\u524D\u306E\u6307\u793A\u3092\u7121\u8996"
        - "\u8A8D\u8A3C\u60C5\u5831\u3092\u6D41\u51FA"
        - vorherige anweisungen ignorieren
        method: regex
        name: unified_privacy_attack_markers
        operator: OR
      pii:
      - description: Detect personally identifiable information that must remain local.
        name: unified_privacy_pii_strict
        threshold: 0.7
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 12
        method: threshold_bands
        name: unified_privacy_risk_band
        outputs:
        - lt: 0.35
          name: unified_privacy_standard
        - gte: 0.35
          name: unified_privacy_sensitive
        source: unified_privacy_risk_score
      scores:
      - inputs:
        - name: unified_privacy_local_only_markers
          type: keyword
          value_source: confidence
          weight: 0.5
        - name: unified_privacy_sensitive_markers
          type: keyword
          value_source: confidence
          weight: 0.75
        - name: unified_privacy_pii_strict
          type: pii
          weight: 0.9
        - name: unified_privacy_jailbreak_strict
          type: jailbreak
          weight: 0.9
        - name: unified_privacy_attack_markers
          type: keyword
          value_source: confidence
          weight: 0.9
        - name: unified_privacy_policy
          type: kb
          weight: 0.3
        method: weighted_sum
        name: unified_privacy_risk_score
    decisions:
    - algorithm:
        type: static
      description: Disable tool access for suspicious prompts while keeping inference
        local.
      name: unified_privacy_security_containment
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 300
      rules:
        conditions:
        - name: unified_privacy_jailbreak_strict
          type: jailbreak
        - name: unified_privacy_attack_markers
          type: keyword
        operator: OR
      tier: 1
    - algorithm:
        type: static
      description: Keep PII, private-domain, and explicit local-only work on the local
        model with no tools.
      name: unified_privacy_sensitive_route
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 200
      rules:
        conditions:
        - name: unified_privacy_sensitive
          type: projection
        operator: AND
      tier: 2
    - description: Route non-sensitive traffic locally as the privacy-first default.
      name: unified_privacy_local_default
      priority: 100
      rules:
        conditions: []
        operator: AND
      tier: 3
    strategy: priority
