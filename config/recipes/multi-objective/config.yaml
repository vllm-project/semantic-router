    decisions:
    - algorithm:
        type: static
      description: Understand image-bearing requests directly before text-only orchestration.
      name: omni
      priority: 500
      rules:
        conditions:
        - name: unified_frontier_has_images
          type: conversation
        operator: OR
    - algorithm:
        type: workflows
        workflows:
          include_intermediate_responses: false
          max_parallel: 3
          max_steps: 4
          min_successful_responses: 2
          mode: dynamic
          on_error: skip
          planner: {}
          round_timeout_seconds: 120
          template: micro_agent
      description: Use Router Flow for explicit investigate-plan-execute tasks with separable roles.
      name: unified_frontier_workflow
      priority: 400
      rules:
        conditions:
        - name: unified_frontier_use_workflow
          type: projection
        - conditions:
          - name: unified_frontier_workflow_markers
            type: keyword
          - name: unified_frontier_ordered_workflow
            type: structure
          operator: OR
        operator: AND
      tier: 1
    - algorithm:
        type: static
      description: Synthesize an existing client tool result directly without spawning another tool or multi-agent loop.
      name: unified_frontier_tool_result_synthesis
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 375
      rules:
        conditions:
        - name: unified_frontier_active_tool_loop
          type: conversation
        - conditions:
          - name: unified_frontier_workflow_markers
            type: keyword
          operator: NOT
        operator: AND
      tier: 2
    - algorithm:
        fusion:
          include_analysis: false
          include_intermediate_responses: false
          judge_prompt_version: fusion-v1
          max_concurrent: 3
          min_successful_responses: 2
          on_error: skip
          round_timeout_seconds: 180
          temperature: 0.2
        type: fusion
      description: Use independent expert answers plus a frontier judge when disagreement resolution matters.
      name: unified_frontier_fusion
      priority: 350
      rules:
        conditions:
        - name: unified_frontier_use_fusion
          type: projection
        - name: unified_frontier_fusion_markers
          type: keyword
        operator: AND
      tier: 3
    - algorithm:
        confidence:
          confidence_method: avg_logprob
          escalation_order: small_to_large
          on_error: skip
          threshold: 0.72
        type: confidence
      description: Escalate evidence-sensitive factual answers from an efficient model to frontier models only when confidence is insufficient.
      name: unified_frontier_verified_answer
      priority: 325
      rules:
        conditions:
        - name: unified_frontier_verification_markers
          type: keyword
        operator: AND
      tier: 4
    - algorithm:
        remom:
          breadth_schedule:
          - 3
          - 2
          compaction_strategy: last_n_tokens
          compaction_tokens: 8000
          include_intermediate_responses: false
          include_reasoning: true
          max_concurrent: 3
          max_responses_per_round: 3
          min_successful_responses: 2
          model_distribution: round_robin
          on_error: skip
          round_timeout_seconds: 180
          temperature: 0.6
        type: remom
      description: Use bounded multi-round search and synthesis for deep reasoning tasks.
      name: unified_frontier_remom
      priority: 300
      rules:
        conditions:
        - name: unified_frontier_deliberate
          type: projection
        operator: AND
      tier: 5
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            quality: 1
        type: multi_factor
      description: Use the strongest direct model when orchestration would add little value.
      name: unified_frontier_direct
      priority: 100
      tier: 6
    strategy: priority
- name: privacy-first
  description: Keep every request local, using recipe-scoped risk projections to isolate sensitive and suspicious prompts.
  routing:
    signals:
      jailbreak:
      - description: Detect suspicious prompts that require local containment.
        method: classifier
        name: unified_privacy_jailbreak_strict
        threshold: 0.45
      kb:
      - kb: privacy_kb
        match: best
        name: unified_privacy_policy
        target:
          kind: group
          value: privacy_policy
      keywords:
      - case_sensitive: false
        keywords:
        - local processing only
        - on-prem only
        - do not send to the cloud
        - confidential handling
        - internal use only
        - private repository
        - proprietary code
        - internal document
        - 本地处理
        - 不要发到云端
        - 仅供内部使用
        - 私有仓库
        - 内部文档
        - solo procesamiento local
        - no enviar a la nube
        - traitement local uniquement
        - ne pas envoyer au cloud
        - ローカル処理のみ
        - クラウドに送信しない
        - nur lokale verarbeitung
        method: regex
        name: unified_privacy_local_only_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - \b\d{3}-\d{2}-\d{4}\b
        - \b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b
        - \b(ssn|social security number|credit card|passport number)\b
        - (身份证|邮箱|护照号码|银行卡号)
        - (número de seguridad social|correo electrónico|pasaporte)
        - (numéro de sécurité sociale|adresse e-mail|passeport)
        - (マイナンバー|メールアドレス|パスポート番号)
        - (sozialversicherungsnummer|e-mail-adresse|reisepassnummer)
        method: regex
        name: unified_privacy_sensitive_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - ignore previous instructions
        - reveal the system prompt
        - exfiltrate credentials
        - bypass the safety policy
        - 忽略之前的指令
        - 泄露系统提示词
        - 导出凭据
        - 绕过安全策略
        - ignora las instrucciones anteriores
        - extraer credenciales
        - ignorer les instructions précédentes
        - exfiltrer les identifiants
        - 以前の指示を無視
        - 認証情報を流出
        - vorherige anweisungen ignorieren
        method: regex
        name: unified_privacy_attack_markers
        operator: OR
      pii:
      - description: Detect personally identifiable information that must remain local.
        name: unified_privacy_pii_strict
        threshold: 0.7
      conversation:
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: unified_privacy_has_images
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 12
        method: threshold_bands
        name: unified_privacy_risk_band
        outputs:
        - lt: 0.35
          name: unified_privacy_standard
        - gte: 0.35
          name: unified_privacy_sensitive
        source: unified_privacy_risk_score
      scores:
      - inputs:
        - name: unified_privacy_local_only_markers
          type: keyword
          value_source: confidence
          weight: 0.5
        - name: unified_privacy_sensitive_markers
          type: keyword
          value_source: confidence
          weight: 0.75
        - name: unified_privacy_pii_strict
          type: pii
          weight: 0.9
        - name: unified_privacy_jailbreak_strict
          type: jailbreak
          weight: 0.9
        - name: unified_privacy_attack_markers
          type: keyword
          value_source: confidence
          weight: 0.9
        - name: unified_privacy_policy
          type: kb
          weight: 0.3
        method: weighted_sum
        name: unified_privacy_risk_score
    decisions:
    - algorithm:
        type: static
      description: Disable tool access for suspicious prompts while keeping inference local.
      name: unified_privacy_security_containment
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 300
      rules:
        conditions:
        - name: unified_privacy_jailbreak_strict
          type: jailbreak
        - name: unified_privacy_attack_markers
          type: keyword
        operator: OR
      tier: 1
    - algorithm:
        type: static
      description: Understand private image-bearing requests on the local visual-language model.
      name: omni
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 250
      rules:
        conditions:
        - name: unified_privacy_has_images
          type: conversation
        operator: OR
      tier: 2
    - algorithm:
        type: static
      description: Keep PII, private-domain, and explicit local-only work on the local model with no tools.
      name: unified_privacy_sensitive_route
      plugins:
      - configuration:
          enabled: true
          mode: none
        type: tools
      priority: 200
      rules:
        conditions:
        - name: unified_privacy_sensitive
          type: projection
        operator: AND
      tier: 2
    - description: Route non-sensitive traffic locally as the privacy-first default.
      name: unified_privacy_local_default
      priority: 100
      tier: 3
    strategy: priority
