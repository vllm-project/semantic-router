global:
  integrations:
    looper:
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      flow:
        state:
          store_backend: file
          ttl_seconds: 1800
      timeout_seconds: 1200
  model_catalog:
    embeddings:
      semantic:
        embedding_config:
          enable_soft_matching: true
          min_score_threshold: 0.5
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          top_k: 1
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
    modules:
      classifier:
        pii:
          model_id: models/mmbert32k-pii-detector-merged
          model_ref: pii_classifier
          pii_mapping_path: models/mmbert32k-pii-detector-merged/pii_type_mapping.json
          threshold: 0.9
          use_cpu: true
          use_mmbert_32k: true
      complexity:
        prototype_scoring:
          best_weight: 0.75
          cluster_similarity_threshold: 0.9
          enabled: true
          max_prototypes: 8
          top_m: 2
      feedback_detector:
        enabled: true
        feedback_mapping_path: ''
        model_id: models/mmbert32k-feedback-detector-merged
        model_ref: feedback_detector
        threshold: 0.5
        use_cpu: true
        use_mmbert_32k: true
        use_modernbert: false
      hallucination_mitigation:
        detector:
          context_window_size: 50
          enable_nli_filtering: true
          min_span_confidence: 0.6
          min_span_length: 2
          model_id: models/mom-halugate-detector
          model_ref: hallucination_detector
          nli_entailment_threshold: 0.75
          threshold: 0.8
          use_cpu: true
        explainer:
          model_id: models/mom-halugate-explainer
          model_ref: hallucination_explainer
          threshold: 0.9
          use_cpu: true
        fact_check:
          model_id: models/mmbert32k-factcheck-classifier-merged
          model_ref: fact_check_classifier
          threshold: 0.5
          use_cpu: true
          use_mmbert_32k: true
      prompt_guard:
        enabled: true
        jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
        model_id: models/mmbert32k-jailbreak-detector-merged
        model_ref: prompt_guard
        threshold: 0.7
        use_cpu: true
        variant: mmbert32k
    system:
      fact_check_classifier: models/mmbert32k-factcheck-classifier-merged
      feedback_detector: models/mmbert32k-feedback-detector-merged
      hallucination_detector: models/mom-halugate-detector
      hallucination_explainer: models/mom-halugate-explainer
      pii_classifier: models/mmbert32k-pii-detector-merged
      prompt_guard: models/mmbert32k-jailbreak-detector-merged
  router:
    clear_route_cache: true
  services:
    management_api:
      auth:
        mode: disabled
        roles:
          admin:
          - '*'
          operator:
          - health.read
          - ready.read
          - docs.read
          - metrics.read
          - classify.invoke
          - config.read
          - replay.read
          - replay.detail
          - data.read
          - data.write
          viewer:
          - health.read
          - ready.read
          - docs.read
          - metrics.read
          - classify.invoke
          - config.read
          - replay.read
          - data.read
      bind_address: 0.0.0.0
      port: 8080
    observability:
      metrics:
        enabled: true
      tracing:
        enabled: true
        exporter:
          endpoint: vllm-sr-jaeger:4317
          insecure: true
          type: otlp
        provider: opentelemetry
        resource:
          deployment_environment: development
          service_name: vllm-sr
          service_version: v0.4.0
        sampling:
          rate: 1
          type: always_on
    response_api:
      enabled: true
      max_responses: 1000
      store_backend: redis
      ttl_seconds: 86400
    router_replay:
      enabled: true
      store_backend: postgres
      ttl_seconds: 2592000
    startup_status:
      store_backend: redis
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    response_cache:
      backend_type: memory
      enabled: true
      eviction_policy: fifo
      max_entries: 1000
      ttl_seconds: 3600
