recipes:
- name: balanced
  description: Mixture-of-Models · Balanced — adaptive quality, speed, and efficiency for everyday routing.
  routing:
    signals:
      complexity:
      - description: Semantic boundary between direct requests and synthesis-heavy work.
        easy:
          candidates:
          - Give a short definition of a common term.
          - Summarize one paragraph in a single sentence.
          - Explain a basic concept with one example.
        hard:
          candidates:
          - Analyze a production failure from several competing root causes.
          - Design a distributed system and justify its consistency tradeoffs.
          - Synthesize conflicting evidence into a defensible recommendation.
        name: unified_balance_difficulty
        threshold: 0.08
      context:
      - description: Long inputs that justify stronger synthesis.
        max_tokens: 262K
        min_tokens: 12K
        name: unified_balance_long_context
      conversation:
      - description: Multi-turn conversations benefit from a small synthesis allowance.
        feature:
          source:
            role: user
            type: message
          type: count
        name: unified_balance_multi_turn
        predicate:
          gte: 2
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: unified_balance_has_images
      fact_check:
      - description: Detect claims that benefit from evidence-backed verification.
        name: needs_fact_check
      keywords:
      - case_sensitive: false
        keywords:
        - quick answer
        - answer briefly
        - one sentence
        - concise summary
        - 简单回答
        - 简要说明
        - respuesta breve
        - réponse brève
        - 簡潔に答えて
        - kurz antworten
        method: regex
        name: unified_balance_simple_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - concise and direct
        - brief and direct
        - 简洁直接
        - 简短直接
        - breve y directa
        - brève et directe
        - 簡潔で直接的
        - kurz und direkt
        method: regex
        name: unified_balance_terse_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - do not analyze
        - don't analyze
        - without analysis
        - 不要分析
        - 无需分析
        - no analices
        - sans analyse
        - 分析しない
        - nicht analysieren
        method: regex
        name: unified_balance_negated_reasoning
        operator: OR
      - case_sensitive: false
        keywords:
        - analyze the tradeoffs
        - analyze the trade-offs
        - from first principles
        - root cause
        - step by step
        - system design
        - consistency tradeoffs
        - competing production failure
        - 分析取舍
        - 第一性原理
        - 根因分析
        - 逐步推理
        - 取舍
        - 根因
        - analizar las ventajas y desventajas
        - causa raíz
        - analyser les compromis
        - cause racine
        - 根本原因を分析
        - 段階的に推論
        - トレードオフ
        - 根本原因
        - トレードオフを分析
        - 根本原因と
        - kompromisse analysieren
        method: regex
        name: unified_balance_reasoning_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - verify the answer
        - cite sources
        - fact-check
        - check the evidence
        - provide evidence
        - 核实答案
        - 引用来源
        - 检查证据
        - verificar la respuesta
        - citer les sources
        - 答えを検証
        - quellen zitieren
        method: regex
        name: unified_balance_verification_markers
        operator: OR
      - case_sensitive: false
        keywords:
        - that's wrong
        - wrong answer
        - please correct the answer
        - try again
        - 回答错了
        - 请纠正答案
        - 重新回答
        - la respuesta es incorrecta
        - corrige la respuesta
        - la réponse est incorrecte
        - corrige la réponse
        - 回答が間違っています
        - bitte korrigiere die antwort
        method: regex
        name: unified_balance_correction_markers
        operator: OR
      language:
      - description: Chinese-language requests.
        name: zh
        threshold: 0.5
      - description: Spanish-language requests.
        name: es
        threshold: 0.5
      - description: French-language requests.
        name: fr
        threshold: 0.5
      - description: Japanese-language requests.
        name: ja
        threshold: 0.5
      - description: German-language requests.
        name: de
        threshold: 0.5
      reasks:
      - description: Detect an immediate semantic repeat after an unsatisfactory answer.
        lookback_turns: 1
        name: unified_balance_reask
        threshold: 0.8
      structure:
      - description: Requests containing a dense set of explicit constraints.
        feature:
          source:
            keywords:
            - at most
            - at least
            - must
            - without
            - no more than
            - 不超过
            - 至少
            - 必须
            type: keyword_set
          type: density
        name: unified_balance_constraint_dense
        predicate:
          gt: 0.08
      user_feedbacks:
      - description: Detect explicit correction or dissatisfaction with the previous answer.
        name: wrong_answer
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 10
        method: threshold_bands
        name: unified_balance_effort_band
        outputs:
        - lt: 0.3
          name: unified_balance_standard
        - gte: 0.3
          name: unified_balance_deliberate
        source: unified_balance_effort_score
      scores:
      - inputs:
        - name: unified_balance_simple_markers
          type: keyword
          value_source: confidence
          weight: -0.35
        - name: unified_balance_terse_markers
          type: keyword
          value_source: confidence
          weight: -0.1
        - name: unified_balance_negated_reasoning
          type: keyword
          value_source: confidence
          weight: -1
        - name: unified_balance_reasoning_markers
          type: keyword
          value_source: confidence
          weight: 0.85
        - name: unified_balance_verification_markers
          type: keyword
          value_source: confidence
          weight: 0.45
        - name: needs_fact_check
          type: fact_check
          weight: 0.45
        - name: wrong_answer
          type: user_feedback
          weight: 0.35
        - name: unified_balance_correction_markers
          type: keyword
          value_source: confidence
          weight: 0.35
        - name: unified_balance_reask
          type: reask
          value_source: confidence
          weight: 0.25
        - name: unified_balance_long_context
          type: context
          weight: 0.18
        - name: unified_balance_constraint_dense
          type: structure
          weight: 0.45
        - name: unified_balance_difficulty:hard
          type: complexity
          weight: 0.4
        - name: unified_balance_difficulty:easy
          type: complexity
          weight: -0.05
        - name: unified_balance_multi_turn
          type: conversation
          weight: 0.08
        - name: zh
          type: language
          weight: 0.06
        - name: es
          type: language
          weight: 0.06
        - name: fr
          type: language
          weight: 0.06
        - name: ja
          type: language
          weight: 0.06
        - name: de
          type: language
          weight: 0.06
        method: weighted_sum
        name: unified_balance_effort_score
    decisions:
    - algorithm:
        type: static
      description: Understand image-bearing requests with the dedicated visual-language model.
      name: omni
      priority: 400
      rules:
        conditions:
        - name: unified_balance_has_images
          type: conversation
        operator: OR
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: first
          weights:
            cost: 0.1
            latency: 0.1
            load: 0.15
            quality: 0.65
        type: multi_factor
      description: Recover from explicit dissatisfaction with a stronger reasoning pool.
      name: unified_balance_recovery
      priority: 300
      rules:
        conditions:
        - name: wrong_answer
          type: user_feedback
        - name: unified_balance_correction_markers
          type: keyword
        - name: unified_balance_reask
          type: reask
        operator: OR
      tier: 1
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: cheapest
          weights:
            cost: 0.15
            latency: 0.15
            load: 0.15
            quality: 0.55
        type: multi_factor
      description: Increase quality for complex, constrained, long-context, or verification-heavy work.
      name: unified_balance_deliberate_route
      priority: 200
      rules:
        conditions:
        - name: unified_balance_deliberate
          type: projection
        operator: AND
      tier: 2
    - algorithm:
        multi_factor:
          latency_percentile: 95
          on_no_candidates: cheapest
          weights:
            cost: 0.25
            latency: 0.2
            load: 0.15
            quality: 0.4
        type: multi_factor
      description: Balance quality, observed latency, configured cost, and current load.
      name: unified_balance_route
      priority: 100
      tier: 3
    strategy: priority
- name: speed-first
  description: Prefer the lowest observed latency while preserving a bounded lane for heavy requests.
  routing:
    signals:
      context:
      - description: Long requests where first-token and generation latency should be measured separately.
        max_tokens: 262K
        min_tokens: 16K
        name: unified_speed_long_context
      keywords:
      - case_sensitive: false
        keywords:
        - deep analysis
        - detailed architecture
        - comprehensive review
        - multi-step plan
        - 深入分析
        - 详细架构
        - 全面审查
        - 多步骤计划
        - análisis profundo
        - architecture détaillée
        - 詳細なアーキテクチャ
        - gründliche analyse
        method: regex
        name: unified_speed_heavy_markers
        operator: OR
      structure:
      - description: Prompts that require an ordered workflow.
        feature:
          source:
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - 首先
              - 然后
            - - 先
              - 再
            type: sequence
          type: sequence
        name: unified_speed_ordered_workflow
      conversation:
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: unified_speed_has_images
    projections:
      mappings:
      - method: threshold_bands
        name: unified_speed_work_band
        outputs:
        - lt: 0.35
          name: unified_speed_interactive
        - gte: 0.35
          name: unified_speed_heavy
        source: unified_speed_work_score
      scores:
      - inputs:
        - name: unified_speed_heavy_markers
          type: keyword
          value_source: confidence
          weight: 0.6
        - name: unified_speed_long_context
          type: context
          weight: 0.35
        - name: unified_speed_ordered_workflow
          type: structure
          weight: 0.25
        method: weighted_sum
        name: unified_speed_work_score
    decisions:
    - algorithm:
        type: static
      description: Keep visual requests on the dedicated low-latency visual-language model.
      name: omni
      priority: 300
      rules:
        conditions:
        - name: unified_speed_has_images
          type: conversation
        operator: OR
    - algorithm:
        latency_aware:
          description: Minimize observed generation and first-token latency.
          tpot_percentile: 90
          ttft_percentile: 90
        type: latency_aware
      description: Use live TTFT and TPOT percentiles across efficient models for heavier requests.
      name: unified_speed_heavy_route
      priority: 200
      rules:
        conditions:
        - name: unified_speed_heavy
          type: projection
        operator: AND
      tier: 1
    - algorithm:
        multi_factor:
          latency_percentile: 90
          on_no_candidates: first
          weights:
            latency: 0.85
            load: 0.15
        type: multi_factor
      description: Choose the fastest healthy candidate from live p90 latency and load.
      name: unified_speed_first_route
      plugins:
      - configuration:
          enabled: true
          semantic:
            similarity_threshold: 0.9
          ttl_seconds: 900
        type: response_cache
      priority: 100
      tier: 2
    strategy: priority
- name: cost-first
  description: Keep every request local and spend additional compute only when the request justifies reasoning.
  routing:
    signals:
      context:
      - description: Long requests that benefit from local reasoning.
        max_tokens: 262K
        min_tokens: 16K
        name: unified_cost_long_context
      keywords:
      - case_sensitive: false
        keywords:
        - reason step by step
        - analyze the tradeoffs
        - root cause
        - design a system
        - prove that
        - 逐步推理
        - 分析取舍
        - 根因分析
        - 设计系统
        - 证明
        - razonar paso a paso
        - razona paso a paso
        - concevoir un système
        - conçois un système
        - raisonner étape par étape
        - raisonne étape par étape
        - 段階的に推論
        - system entwerfen
        method: regex
        name: unified_cost_reasoning_markers
        operator: OR
      structure:
      - description: Multi-stage requests that benefit from local reasoning.
        feature:
          source:
            sequences:
            - - first
              - then
            - - first
              - next
              - finally
            - - 首先
              - 然后
            - - 先
              - 再
            type: sequence
          type: sequence
        name: unified_cost_ordered_workflow
      conversation:
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: unified_cost_has_images
    projections:
      mappings:
      - method: threshold_bands
        name: unified_cost_compute_band
        outputs:
        - lt: 0.35
          name: unified_cost_direct
        - gte: 0.35
          name: unified_cost_reasoning
        source: unified_cost_compute_score
      scores:
      - inputs:
        - name: unified_cost_reasoning_markers
          type: keyword
          value_source: confidence
          weight: 0.6
        - name: unified_cost_long_context
          type: context
          weight: 0.35
        - name: unified_cost_ordered_workflow
          type: structure
          weight: 0.3
        method: weighted_sum
        name: unified_cost_compute_score
    decisions:
    - algorithm:
        type: static
      description: Keep visual requests on the dedicated local visual-language model.
      name: omni
      priority: 300
      rules:
        conditions:
        - name: unified_cost_has_images
          type: conversation
        operator: OR
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.6
            load: 0.4
        type: multi_factor
      description: Enable bounded reasoning on the self-hosted model for genuinely demanding requests.
      name: unified_cost_local_reasoning
      priority: 200
      rules:
        conditions:
        - name: unified_cost_reasoning
          type: projection
        operator: AND
      tier: 1
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.8
            load: 0.2
        type: multi_factor
      description: Deterministic local route with semantic reuse for ordinary requests.
      name: unified_cost_first_route
      plugins:
      - configuration:
          enabled: true
          semantic:
            similarity_threshold: 0.88
          ttl_seconds: 3600
        type: response_cache
      priority: 100
      tier: 2
    strategy: priority
- name: accuracy-first
  description: Escalate from a frontier direct answer to ReMoM, Fusion, or Router Flow when the task benefits from orchestration.
  routing:
    signals:
      complexity:
      - description: Semantic boundary for tasks that merit multi-round reasoning.
        easy:
          candidates:
          - Explain a familiar concept in plain language.
          - Summarize a short paragraph.
          - Answer a direct factual question.
        hard:
          candidates:
          - Prove a difficult result by exploring multiple possible derivations.
          - Diagnose a complex distributed-system failure with incomplete evidence.
          - Synthesize competing scientific explanations into a rigorous conclusion.
        name: unified_frontier_complexity
        threshold: 0.15
      context:
      - description: Long-context tasks that benefit from multi-pass synthesis.
        max_tokens: 262K
        min_tokens: 16K
        name: unified_frontier_long_context
      conversation:
      - description: Tool-rich requests are candidates for Router Flow decomposition.
        feature:
          source:
            type: tool_definition
          type: count
        name: unified_frontier_tooling_available
        predicate:
          gte: 2
      - description: Continue an already active tool loop through Router Flow.
        feature:
          source:
            type: active_tool_loop
          type: exists
        name: unified_frontier_active_tool_loop
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: unified_frontier_has_images
      embeddings:
      - aggregation_method: max
        candidates:
        - Investigate the repository, implement the fix, run tests, and iterate until it works.
        - Coordinate specialized agents to research, code, review, and validate a complete solution.
        - 制定执行计划，完成实现、评审和验证。
        - Investiga el repositorio, implementa la solución y valida todos los cambios.
        - リポジトリを調査し、修正を実装して検証してください。
        name: unified_frontier_workflow_intent
        threshold: 0.78
      - aggregation_method: max
        candidates:
        - Ask independent experts to solve the problem and synthesize the most reliable answer.
        - Compare conflicting analyses, identify disagreements, and produce a verified conclusion.
        - 汇总多个独立观点并解决其中的分歧。
        - Compara análisis independientes, resuelve desacuerdos y sintetiza la respuesta.
        - 複数の独立した分析を比較し、相違点を解決してください。
        name: unified_frontier_fusion_intent
        threshold: 0.79
      - aggregation_method: max
        candidates:
        - Explore several reasoning paths and synthesize the strongest rigorous solution.
        - Build a careful derivation from first principles for a difficult problem.
