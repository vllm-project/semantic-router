---
name: multi-objective
description: >
  Backend-independent Eval API probes for every maintained decision in the
  multi-recipe profile. Each probe requires the requested routing model,
  selected recipe, decision, and execution algorithm to agree.
routing_assets:
  yaml: config/recipes/multi-objective/config.yaml
  dsl: config/recipes/multi-objective/recipe.dsl
router_eval_endpoint: /api/v1/eval
evaluation:
  request_timeout_seconds: 300
  concurrency: 8
acceptance:
  min_probe_pass_rate: 100.0
  min_decision_pass_rate: 100.0
decisions:
  - id: balanced_standard
    model: vllm-sr/mom-balanced-v1
    expected_recipe: balanced
    expected_decision: unified_balance_route
    expected_algorithm: multi_factor
    variants:
      - id: brief_definition
        query: Answer briefly in one sentence. What is a process?
        expected_signals:
          keywords: [unified_balance_simple_markers]
          projection: [unified_balance_standard]
        tags: [recipe:balanced, language:en, direct]
      - id: ordinary_summary
        query: Summarize this product update in one paragraph.
        tags: [recipe:balanced, language:en, direct]
      - id: semantic_easy_complexity
        query: Give a short definition of a common term.
        expected_signals:
          complexity: [unified_balance_difficulty:easy]
          projection: [unified_balance_standard]
        tags: [recipe:balanced, language:en, signal:complexity, direct]
      - id: spanish_direct
        query: Resume esta actualización del producto en un párrafo.
        expected_signals:
          language: [es]
          projection: [unified_balance_standard]
        tags: [recipe:balanced, language:es, class:negative, direct]
      - id: japanese_direct
        query: この製品アップデートを一段落で要約してください。
        tags: [recipe:balanced, language:ja, class:negative, direct]
      - id: german_direct
        query: Fasse dieses Produktupdate kurz in einem Absatz zusammen.
        tags: [recipe:balanced, language:de, class:negative, direct]
      - id: chinese_concise
        query: 请保持回答简洁直接：用一句话说明什么是进程。
        expected_signals:
          keywords: [unified_balance_terse_markers]
          projection: [unified_balance_standard]
        tags: [recipe:balanced, language:zh, class:negative, signal:keyword, direct]
      - id: french_concise
        query: >-
          Réponds de manière brève et directe en une phrase : qu'est-ce qu'un
          processus ?
        expected_signals:
          keywords: [unified_balance_terse_markers]
          projection: [unified_balance_standard]
        tags: [recipe:balanced, language:fr, class:negative, signal:keyword, direct]
      - id: negated_deliberation
        query: Do not analyze the tradeoffs; answer briefly in one sentence.
        expected_signals:
          keywords: [unified_balance_negated_reasoning, unified_balance_reasoning_markers]
          projection: [unified_balance_standard]
        tags: [recipe:balanced, language:en, stress:conflict, direct]

  - id: balanced_deliberate
    model: vllm-sr/mom-balanced-v1
    expected_recipe: balanced
    expected_decision: unified_balance_deliberate_route
    expected_algorithm: multi_factor
    variants:
      - id: root_cause
        query: Keep the answer concise and direct, but analyze the tradeoffs and root cause of this distributed failure.
        expected_signals:
          keywords: [unified_balance_reasoning_markers, unified_balance_terse_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:en, stress:preference-conflict, projection]
      - id: first_principles
        query: 请保持回答简洁直接，但要从第一性原理逐步推理，并分析这几个架构方案的取舍。
        expected_signals:
          keywords: [unified_balance_reasoning_markers, unified_balance_terse_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:zh, stress:preference-conflict, projection]
      - id: tradeoffs_es
        query: Responde de forma breve y directa, pero analiza las ventajas y desventajas y la causa raíz paso a paso.
        expected_signals:
          keywords: [unified_balance_reasoning_markers, unified_balance_terse_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:es, signal:keyword, stress:preference-conflict, projection]
      - id: tradeoffs_fr
        query: Réponds de manière brève et directe, mais analyse les compromis et la cause racine de cette panne.
        expected_signals:
          keywords: [unified_balance_reasoning_markers, unified_balance_terse_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:fr, signal:keyword, stress:preference-conflict, projection]
      - id: root_cause_ja
        query: 簡潔で直接的に答えてください。ただし、この障害の根本原因を分析し、段階的に推論してください。
        expected_signals:
          keywords: [unified_balance_reasoning_markers, unified_balance_terse_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:ja, signal:keyword, stress:preference-conflict, projection]
      - id: tradeoffs_de
        query: Bitte kurz und direkt antworten, aber die Kompromisse analysieren und die Ursache schrittweise erklären.
        expected_signals:
          keywords: [unified_balance_reasoning_markers, unified_balance_terse_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:de, signal:keyword, stress:preference-conflict, projection]
      - id: long_context_reasoning
        query: Analyze the tradeoffs in this long architecture context.
        expected_signals:
          context: [unified_balance_long_context]
          projection: [unified_balance_deliberate]
        repeat: 1800
        tags: [recipe:balanced, language:en, signal:context, stress:long-input]
      - id: dense_constraints
        query: >-
          The answer must contain exactly three options, must include at least
          one risk, and must use no more than 120 words without omitting the
          final recommendation.
        expected_signals:
          structure: [unified_balance_constraint_dense]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:en, signal:structure, projection]
      - id: verification_pressure
        query: Verify the answer, cite reliable sources, and check the evidence.
        expected_signals:
          keywords: [unified_balance_verification_markers]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:en, signal:keyword, verification]
      - id: semantic_hard_complexity
        query: >-
          Design a distributed system and justify its consistency tradeoffs
          while analyzing several competing production failure causes.
        expected_signals:
          complexity: [unified_balance_difficulty:hard]
          projection: [unified_balance_deliberate]
        tags: [recipe:balanced, language:en, signal:complexity, projection]

  - id: balanced_recovery
    model: vllm-sr/mom-balanced-v1
    expected_recipe: balanced
    expected_decision: unified_balance_recovery
    expected_algorithm: multi_factor
    expected_plugins: [system_prompt]
    variants:
      - id: explicit_correction
        query: That's wrong. Please correct the answer and try again.
        expected_signals:
          keywords: [unified_balance_correction_markers]
        tags: [recipe:balanced, language:en, feedback]
      - id: correction_zh
        query: 回答错了，请纠正答案并重新回答。
        tags: [recipe:balanced, language:zh, feedback]
      - id: correction_es
        query: La respuesta es incorrecta; corrige la respuesta e inténtalo de nuevo.
        tags: [recipe:balanced, language:es, signal:keyword, recovery]
      - id: correction_fr
        query: La réponse est incorrecte, corrige la réponse et réessaie.
        tags: [recipe:balanced, language:fr, signal:keyword, recovery]
      - id: correction_ja
        query: 回答が間違っています。修正してもう一度答えてください。
        tags: [recipe:balanced, language:ja, signal:keyword, recovery]
      - id: semantic_reask
        messages:
          - role: user
            content: Explain vector clocks with an example.
          - role: assistant
            content: A vector clock is a logical timestamp.
          - role: user
            content: Explain vector clocks with an example.
        expected_signals:
          reask: [unified_balance_reask]
          conversation: [unified_balance_multi_turn]
        tags: [recipe:balanced, language:en, signal:reask, shape:multi-turn]
      - id: feedback_classifier
        messages:
          - role: user
            content: What is the capital of Australia?
          - role: assistant
            content: Sydney.
          - role: user
            content: That answer was incorrect and did not solve my request.
        expected_signals:
          user_feedback: [wrong_answer]
          conversation: [unified_balance_multi_turn]
        tags: [recipe:balanced, language:en, signal:user-feedback, shape:multi-turn]

  - id: speed_interactive
    model: vllm-sr/mom-flash-v1
    expected_recipe: speed-first
    expected_decision: unified_speed_first_route
    expected_algorithm: multi_factor
    expected_plugins: [semantic-cache]
    variants:
      - id: concise_summary
        query: Give me the fastest concise summary of this incident report.
        expected_signals:
          projection: [unified_speed_interactive]
        tags: [recipe:speed-first, language:en, direct]
      - id: ordinary_explanation
        query: Explain the difference between a process and a thread.
        tags: [recipe:speed-first, language:en, direct]
      - id: spanish_interactive
        query: Explica brevemente la diferencia entre un proceso y un hilo.
        tags: [recipe:speed-first, language:es, class:negative, direct]
      - id: french_interactive
        query: Explique brièvement la différence entre un processus et un thread.
        tags: [recipe:speed-first, language:fr, class:negative, direct]
      - id: japanese_interactive
        query: プロセスとスレッドの違いを簡潔に説明してください。
        tags: [recipe:speed-first, language:ja, class:negative, direct]
      - id: german_interactive
        query: Erkläre kurz den Unterschied zwischen einem Prozess und einem Thread.
        tags: [recipe:speed-first, language:de, class:negative, direct]

  - id: speed_heavy
    model: vllm-sr/mom-flash-v1
    expected_recipe: speed-first
    expected_decision: unified_speed_heavy_route
    expected_algorithm: latency_aware
    variants:
      - id: architecture
        query: Produce a detailed architecture for a multi-region cache.
        expected_signals:
          keywords: [unified_speed_heavy_markers]
          projection: [unified_speed_heavy]
        tags: [recipe:speed-first, language:en, projection]
      - id: review_zh
        query: 请对这个迁移方案做一次全面审查，但仍然优先保证低延迟。
        tags: [recipe:speed-first, language:zh, projection]
      - id: deep_analysis_es
        query: Haz un análisis profundo de esta migración manteniendo baja latencia.
        tags: [recipe:speed-first, language:es, signal:keyword, projection]
      - id: architecture_fr
        query: Produis une architecture détaillée pour ce cache distribué.
        tags: [recipe:speed-first, language:fr, signal:keyword, projection]
      - id: architecture_ja
        query: マルチリージョンキャッシュの詳細なアーキテクチャを作成してください。
        tags: [recipe:speed-first, language:ja, signal:keyword, projection]
      - id: deep_analysis_de
        query: Erstelle eine gründliche Analyse dieser latenzkritischen Migration.
        tags: [recipe:speed-first, language:de, signal:keyword, projection]
      - id: long_context_only
        query: Background context for a latency-sensitive migration.
        expected_signals:
          context: [unified_speed_long_context]
          projection: [unified_speed_heavy]
        repeat: 1800
        tags: [recipe:speed-first, language:en, signal:context, stress:long-input]
      - id: ordered_heavy_work
        query: >-
          First inspect the incident, then produce a detailed architecture, and
          finally provide a comprehensive review.
        expected_signals:
          structure: [unified_speed_ordered_workflow]
          projection: [unified_speed_heavy]
        tags: [recipe:speed-first, language:en, signal:structure, projection]

  - id: cost_direct
    model: vllm-sr/mom-economy-v1
    expected_recipe: cost-first
    expected_decision: unified_cost_first_route
    expected_algorithm: multi_factor
    expected_plugins: [semantic-cache]
    variants:
      - id: basic_definition
        query: Define eventual consistency in one paragraph.
        expected_signals:
          projection: [unified_cost_direct]
        tags: [recipe:cost-first, language:en, direct]
      - id: ordinary_summary
        query: Summarize the meeting notes.
        tags: [recipe:cost-first, language:en, direct]
      - id: spanish_direct
        query: Resume las notas de la reunión.
        tags: [recipe:cost-first, language:es, class:negative, direct]
      - id: french_direct
        query: Résume les notes de la réunion.
        tags: [recipe:cost-first, language:fr, class:negative, direct]
      - id: japanese_direct
        query: 会議メモを要約してください。
        tags: [recipe:cost-first, language:ja, class:negative, direct]
      - id: german_direct
        query: Fasse die Besprechungsnotizen kurz zusammen.
        tags: [recipe:cost-first, language:de, class:negative, direct]

  - id: cost_reasoning
    model: vllm-sr/mom-economy-v1
    expected_recipe: cost-first
    expected_decision: unified_cost_local_reasoning
    expected_algorithm: multi_factor
    variants:
      - id: system_design
        query: Design a system and reason step by step about the tradeoffs.
        expected_signals:
          keywords: [unified_cost_reasoning_markers]
          projection: [unified_cost_reasoning]
        tags: [recipe:cost-first, language:en, projection]
      - id: root_cause_zh
        query: 请逐步推理并分析这个生产事故的根因。
        tags: [recipe:cost-first, language:zh, projection]
      - id: system_design_es
        query: Diseña un sistema y razona paso a paso sobre las ventajas y desventajas.
        tags: [recipe:cost-first, language:es, signal:keyword, projection]
      - id: system_design_fr
        query: Conçois un système et raisonne étape par étape sur les compromis.
        tags: [recipe:cost-first, language:fr, signal:keyword, projection]
      - id: system_design_ja
        query: システムを設計し、トレードオフを段階的に推論してください。
        tags: [recipe:cost-first, language:ja, signal:keyword, projection]
      - id: system_design_de
        query: Ein System entwerfen und die Kompromisse Schritt für Schritt begründen.
        tags: [recipe:cost-first, language:de, signal:keyword, projection]
      - id: long_context_only
        query: Local context that must be synthesized economically.
        expected_signals:
          context: [unified_cost_long_context]
          projection: [unified_cost_reasoning]
        repeat: 1800
        tags: [recipe:cost-first, language:en, signal:context, stress:long-input]
      - id: ordered_local_reasoning
        query: >-
          First identify the root cause, then reason step by step, and finally
          design a system that stays local.
        expected_signals:
          structure: [unified_cost_ordered_workflow]
          projection: [unified_cost_reasoning]
        tags: [recipe:cost-first, language:en, signal:structure, projection]

  - id: frontier_direct
    model: vllm-sr/mom-frontier-v1
    expected_recipe: accuracy-first
    expected_decision: unified_frontier_direct
    expected_algorithm: multi_factor
    variants:
      - id: basic_fact
        query: Rewrite "hello world" in uppercase.
        tags: [recipe:accuracy-first, language:en, direct]
      - id: greeting_stays_direct
        query: How are you?
        tags: [recipe:accuracy-first, language:en, class:negative, direct]
      - id: available_tools_do_not_imply_workflow
        query: Tell me something about vllm-sr.
        expected_signals:
          conversation: [unified_frontier_tooling_available]
          projection: [unified_frontier_not_workflow, unified_frontier_direct]
        tools:
          - type: function
            function:
              name: search_web
              description: Search public web sources.
          - type: function
            function:
              name: read_file
              description: Read a local file.
          - type: function
            function:
              name: search_repository
              description: Search repository content.
          - type: function
            function:
              name: apply_patch
              description: Apply a source patch.
          - type: function
            function:
              name: run_tests
              description: Run project tests.
        tags: [recipe:accuracy-first, language:en, class:negative, shape:tools, direct]
      - id: plain_explanation
        query: Explain what a mutex does in plain language.
        expected_signals:
          projection: [unified_frontier_direct]
        tags: [recipe:accuracy-first, language:en, direct]
      - id: phrase_collision_fusion
        query: Define the phrase "panel of experts" in one sentence.
        expected_signals:
          structure: [unified_frontier_direct_reference]
          projection: [unified_frontier_not_fusion, unified_frontier_direct]
        tags: [recipe:accuracy-first, language:en, class:negative, stress:collision]
      - id: phrase_collision_workflow
        query: Translate the phrase "investigate and implement" into Japanese.
        tags: [recipe:accuracy-first, language:en, class:negative, stress:collision]
      - id: phrase_collision_fusion_es
        query: Define la frase "comparar opiniones de expertos" en una oración.
        tags: [recipe:accuracy-first, language:es, class:negative, stress:collision]
      - id: phrase_collision_fusion_fr
        query: Traduis cette expression "comparer plusieurs avis d'experts" en japonais.
        tags: [recipe:accuracy-first, language:fr, class:negative, stress:collision]
      - id: phrase_collision_fusion_zh
        query: 定义这个短语“比较多个专家意见”，只用一句话。
        tags: [recipe:accuracy-first, language:zh, class:negative, stress:collision]
      - id: phrase_collision_workflow_ja
        query: 説明「調査して実装」という表現の意味だけを一文で答えてください。
        tags: [recipe:accuracy-first, language:ja, class:negative, stress:collision]
      - id: phrase_collision_fusion_de
        query: Definiere den Ausdruck "panel of experts" in einem Satz.
        tags: [recipe:accuracy-first, language:de, class:negative, stress:collision]
      - id: spanish_direct
        query: Explica qué hace un mutex en lenguaje sencillo.
        tags: [recipe:accuracy-first, language:es, class:negative, direct]
      - id: japanese_direct
        query: ミューテックスの役割を簡単に説明してください。
        tags: [recipe:accuracy-first, language:ja, class:negative, direct]

  - id: frontier_tool_result_synthesis
    model: vllm-sr/mom-frontier-v1
    expected_recipe: accuracy-first
    expected_decision: unified_frontier_tool_result_synthesis
    expected_algorithm: static
    expected_plugins: [tools]
    variants:
      - id: ordinary_tool_result
        messages:
          - role: user
            content: Tell me something about vllm-sr.
          - role: assistant
            content: ""
            tool_calls:
              - id: call-1
                type: function
                function:
                  name: search_web
                  arguments: '{"query":"vllm-sr"}'
          - role: tool
            tool_call_id: call-1
            content: vLLM Semantic Router routes requests across model backends.
        expected_signals:
          conversation: [unified_frontier_active_tool_loop]
          projection: [unified_frontier_not_workflow]
        tags: [recipe:accuracy-first, language:en, shape:tool-loop, direct]

  - id: frontier_verified
    model: vllm-sr/mom-frontier-v1
    expected_recipe: accuracy-first
    expected_decision: unified_frontier_verified_answer
    expected_algorithm: confidence
    variants:
      - id: evidence_en
        query: Verify the answer with evidence and cite reliable sources.
        expected_signals:
          keywords: [unified_frontier_verification_markers]
        tags: [recipe:accuracy-first, language:en, signal:keyword, looper:confidence]
      - id: evidence_zh
        query: 请用证据核实答案，并核实每个事实。
        tags: [recipe:accuracy-first, language:zh, signal:keyword, looper:confidence]
      - id: evidence_es
        query: Verificar con evidencia cada afirmación y citar fuentes fiables.
        tags: [recipe:accuracy-first, language:es, signal:keyword, looper:confidence]
      - id: evidence_fr
        query: Vérifier avec des preuves chaque affirmation et citer des sources fiables.
        tags: [recipe:accuracy-first, language:fr, signal:keyword, looper:confidence]
      - id: evidence_ja
        query: 証拠で検証し、信頼できる情報源を示してください。
        tags: [recipe:accuracy-first, language:ja, signal:keyword, looper:confidence]
      - id: disputed_claim
        query: The Great Wall is visible from the Moon with the naked eye. Is that claim accurate?
        expected_signals:
          keywords: [unified_frontier_verification_markers]
        tags: [recipe:accuracy-first, language:en, signal:keyword, looper:confidence]

  - id: frontier_remom
    model: vllm-sr/mom-frontier-v1
    expected_recipe: accuracy-first
    expected_decision: unified_frontier_remom
    expected_algorithm: remom
    variants:
      - id: reasoning_paths
        query: >-
          Explore several approaches and search multiple reasoning paths before
          synthesizing the strongest answer.
        expected_signals:
          embeddings: [unified_frontier_deep_intent]
          projection: [unified_frontier_deliberate]
        tags: [recipe:accuracy-first, language:en, looper:remom]
      - id: rigorous_proof_zh
        query: 请探索多种方法，给出严格证明，并从多条推理路径综合最终答案。
        tags: [recipe:accuracy-first, language:zh, looper:remom]
      - id: reasoning_paths_es
        query: Explorar varios enfoques y varias rutas de razonamiento antes de sintetizar la respuesta.
        tags: [recipe:accuracy-first, language:es, signal:keyword, looper:remom]
      - id: reasoning_paths_fr
        query: Explorer plusieurs approches et fournir une preuve rigoureuse avant la synthèse.
        tags: [recipe:accuracy-first, language:fr, signal:keyword, looper:remom]
      - id: reasoning_paths_ja
        query: 複数のアプローチと推論経路を探索し、厳密な証明を統合してください。
        tags: [recipe:accuracy-first, language:ja, signal:keyword, looper:remom]
      - id: reasoning_paths_de
        query: Mehrere Ansätze untersuchen und die stärkste Lösung synthetisieren.
        tags: [recipe:accuracy-first, language:de, signal:keyword, looper:remom]
      - id: natural_deep_request
        query: Think deeply before answering and reason through alternative paths.
        expected_signals:
          keywords: [unified_frontier_deep_markers]
          projection: [unified_frontier_deliberate]
        tags: [recipe:accuracy-first, language:en, signal:keyword, looper:remom]
      - id: shorthand_deep_request
        query: "Think deeply / alternative paths: propose a robust migration plan."
        expected_signals:
          keywords: [unified_frontier_deep_markers]
          projection: [unified_frontier_deliberate]
        tags: [recipe:accuracy-first, language:en, signal:keyword, looper:remom]
      - id: tools_attached_reasoning_only
        query: Think deeply about alternative migration paths and recommend the safest one.
        expected_signals:
          keywords: [unified_frontier_deep_markers]
          projection: [unified_frontier_deliberate]
        tools:
          - type: function
            function:
              name: search_web
              description: Search public web sources.
        tags: [recipe:accuracy-first, language:en, shape:tools, looper:remom]
      - id: long_context_reasoning
        query: Explore several approaches in this long system-design context.
        expected_signals:
          context: [unified_frontier_long_context]
          projection: [unified_frontier_deliberate]
        repeat: 1800
        tags: [recipe:accuracy-first, language:en, signal:context, stress:long-input]
      - id: hard_complexity
        query: >-
          Prove a difficult result by exploring multiple possible derivations
          and synthesize the strongest rigorous solution.
        expected_signals:
          complexity: [unified_frontier_complexity:hard]
          projection: [unified_frontier_deliberate]
        tags: [recipe:accuracy-first, language:en, signal:complexity, looper:remom]

  - id: frontier_fusion
    model: vllm-sr/mom-frontier-v1
    expected_recipe: accuracy-first
    expected_decision: unified_frontier_fusion
    expected_algorithm: fusion
    variants:
      - id: expert_panel
        query: >-
          Produce independent analyses from a panel of experts, resolve
