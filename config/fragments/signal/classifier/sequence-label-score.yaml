version: v0.3

global:
  model_catalog:
    deployments:
      # A classifier service speaking the Router's classification API:
      # POST <endpoint>/classify.
      risk-classifier:
        provider: classify
        endpoint: https://classifier.example.com

routing:
  signals:
    classifiers:
      - name: tool-risk
        deployment: risk-classifier
        labels: [SAFE, RISKY]
