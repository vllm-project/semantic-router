global:
  model_catalog:
    deployments:
      # A chat model used as a classifier: POST <endpoint>/chat/completions.
      risk-judge:
        provider: openai_chat
        endpoint: https://classifier.example.com/v1
        model: gpt-4.1-mini
        timeout_ms: 5000

routing:
  signals:
    classifiers:
      - name: tool-risk
        deployment: risk-judge
        labels: [SAFE, RISKY]
        disable_rationale: true
        instructions: >-
          Choose RISKY only for destructive, privileged, or irreversible tool
          operations.
