# Response-stage jailbreak signal.
#
# Scores the model's output rather than the request, so it is only available
# after the model has answered. A response_guard plugin of the decision
# selected for the request acts on it; decision rules cannot read it.
recipes:
  - name: default
    signals:
      jailbreak:
        - name: unsafe_completion
          description: Detect jailbreak content in the model's own output.
          predicate:
            gte: 0.90
          stage: response
