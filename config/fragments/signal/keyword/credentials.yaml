# Credential detection in tool results.
#
# Coding-agent harnesses place the output of every tool call, such as a file
# read or a shell command, in a tool result and resend the whole conversation
# on each turn. These rules read the textual tool results of a request and
# nothing else (input.tool_results: true, input.request: false): not the
# prompt, not the conversation history, not the model's output. Each rule name
# identifies a credential class, so headers, logs and Router Replay can report
# which class was found without carrying the value.
#
# The patterns are copied unchanged from gitleaks, config/gitleaks.toml at
# https://github.com/gitleaks/gitleaks/commit/5f6ec56cfa6f8c67648d863582c7ae2f206d5c1c
# (master, 2026-10-23). The gitleaks rule id follows each pattern. gitleaks'
# entropy thresholds, keyword pre-filters and allowlists are not part of the
# keyword signal, so its generic high-entropy rules are intentionally left out.
# Patterns use Go RE2 syntax and are case-sensitive; a pattern that needs
# case folding carries its own (?i). Prefix-less secrets are out of reach: the
# AWS rule finds the access key id (AKIA...), not the secret access key, and no
# rule finds a generic password.
#
