recipes:
  - name: default
    signals:
      keywords:
        # Cloud provider access keys: AWS access key ids and Bedrock API keys, Azure AD client secrets and Google Cloud API keys.
        - name: credential_cloud_keys
          operator: OR
          method: regex
          case_sensitive: true
          input:
            tool_results: true
            request: false
          keywords:
            - '\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b' # gitleaks aws-access-token
            - '\b(ABSK[A-Za-z0-9+/]{109,269}={0,2})(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks aws-amazon-bedrock-api-key-long-lived
            - 'bedrock-api-key-YmVkcm9jay5hbWF6b25hd3MuY29t' # gitleaks aws-amazon-bedrock-api-key-short-lived
            - '(?:^|[\\''"\x60\s>=:(,)])([a-zA-Z0-9_~.]{3}\dQ~[a-zA-Z0-9_~.-]{31,34})(?:$|[\\''"\x60\s<),])' # gitleaks azure-ad-client-secret
            - '\b(AIza[\w-]{35})(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks gcp-api-key
        # Service access tokens: Anthropic, GitHub, GitLab, Hugging Face, OpenAI, Slack and Stripe.
        - name: credential_access_tokens
          operator: OR
          method: regex
          case_sensitive: true
          input:
            tool_results: true
            request: false
          keywords:
            - '\b(sk-ant-admin01-[a-zA-Z0-9_\-]{93}AA)(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks anthropic-admin-api-key
            - '\b(sk-ant-api03-[a-zA-Z0-9_\-]{93}AA)(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks anthropic-api-key
            - '(?:ghu|ghs)_[0-9a-zA-Z]{36}' # gitleaks github-app-token
            - 'github_pat_\w{82}' # gitleaks github-fine-grained-pat
            - 'gho_[0-9a-zA-Z]{36}' # gitleaks github-oauth
            - 'ghp_[0-9a-zA-Z]{36}' # gitleaks github-pat
            - 'ghr_[0-9a-zA-Z]{36}' # gitleaks github-refresh-token
            - 'gldt-[0-9a-zA-Z_\-]{20}' # gitleaks gitlab-deploy-token
            - 'glpat-[\w-]{20}' # gitleaks gitlab-pat
            - '\bglpat-[0-9a-zA-Z_-]{27,300}\.[0-9a-z]{2}[0-9a-z]{7}\b' # gitleaks gitlab-pat-routable
            - 'glrt-[0-9a-zA-Z_\-]{20}' # gitleaks gitlab-runner-authentication-token
            - '\b(hf_(?i:[a-z]{34}))(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks huggingface-access-token
            - '\b(api_org_(?i:[a-z]{34}))(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks huggingface-organization-api-token
            - '\b(sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})\b|sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20})(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks openai-api-key
            - '(?i)xapp-\d-[A-Z0-9]+-\d+-[a-z0-9]+' # gitleaks slack-app-token
            - 'xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*' # gitleaks slack-bot-token
            - 'xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}' # gitleaks slack-user-token
            - '(?:https?://)?hooks.slack.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}' # gitleaks slack-webhook-url
            - '\b((?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99})(?:[\x60''"\s;]|\\[nr]|$)' # gitleaks stripe-access-token
        # PEM private key blocks, any algorithm.
        - name: credential_private_keys
          operator: OR
          method: regex
          case_sensitive: true
          input:
            tool_results: true
            request: false
          keywords:
            - '(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S-]{64,}?KEY(?: BLOCK)?-----' # gitleaks private-key
