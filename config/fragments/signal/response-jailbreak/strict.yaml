# Response-stage jailbreak signal.
#
# Observes the model's output rather than the request, so it is only available
# after the model has answered. A decision that reads it is a response-stage
# decision and is not evaluated while the request is still being routed.
response_jailbreak:
  - name: unsafe_completion
    threshold: 0.85
    description: Detect jailbreak content in the model's own output.
