plugin:
  type: response_cache
  configuration:
    enabled: true
    mode: exact_then_semantic
    scope: tenant
    ttl_seconds: 86400
    semantic:
      match:
        recall: {top_k: 3, min_similarity: 0.92}
    request_controls:
      enabled: true
      header: x-vsr-cache-control
      allowed: [no-cache, no-store, bypass, max-age, ttl]
      max_ttl_seconds: 86400
    personalized:
      mode: disabled
