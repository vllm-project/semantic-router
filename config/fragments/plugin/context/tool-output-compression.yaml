plugin:
  type: context
  configuration:
    enabled: true
    compress:
      mode: auto
      targets:
        current_user:
          mode: preserve
        tool_outputs:
          mode: extractive
          min_tokens: 2000
          target_tokens: 1000
        history:
          mode: preserve
        rag:
          mode: preserve
        memory:
          mode: preserve
      # Without a match block, the decision model judges the segments'
      # relevance; the least relevant shrink first.
      recovery:
        enabled: false
        ttl_seconds: 900
        max_bytes_per_request: 10485760
        max_total_bytes: 268435456
        max_retrievals: 8
      request_controls:
        enabled: false
        header: x-vsr-compression-control
        allowed: [bypass, target]
        max_target_tokens: 16000
      failure_mode: fail_open
    budget:
      max_tokens: auto
      reserve_output_tokens: auto
