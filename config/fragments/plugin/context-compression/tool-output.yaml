plugin:
  type: context_compression
  configuration:
    enabled: true
    mode: auto
    budget:
      trigger_tokens: auto
      target_tokens: auto
      reserve_output_tokens: auto
    targets:
      tool_outputs:
        mode: extractive
        min_tokens: 2000
        target_tokens: 1000
      history:
        mode: preserve
      rag:
        mode: preserve
      memory:
        mode: preserve
    scoring:
      method: bm25
    recovery:
      enabled: false
      ttl_seconds: 900
      max_bytes_per_request: 10485760
      max_total_bytes: 268435456
      max_retrievals: 8
    request_controls:
      enabled: false
      header: x-vsr-compression-control
      allowed: [bypass, target]
      max_target_tokens: 16000
    failure_mode: fail_open
