routing:
  decisions:
    - name: prompt-selected-route
      description: Select a candidate with a concrete helper model.
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: qwen3-8b
          use_reasoning: false
        - model: qwen3-32b
          use_reasoning: true
      algorithm:
        type: prompt
        prompt:
          model: qwen3-8b
          instructions: >-
            Choose qwen3-8b for ordinary requests and qwen3-32b for hard
            reasoning, coding, or multi-step analysis.
          timeout_seconds: 5
