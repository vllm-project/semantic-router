algorithm:
  type: fusion
  minimum_candidates: 2
  fusion:
    model: qwen3-32b
    analysis_models:
      - qwen3-8b
      - qwen3-32b
    analysis_mode: separate
    max_concurrent: 2
    max_completion_tokens: 512
    round_timeout_seconds: 90
    min_successful_responses: 1
    temperature: 0.2
    include_analysis: true
    include_intermediate_responses: true
    on_error: skip
    # Panel-level policy when usable responses fall below
    # min_successful_responses: fail (typed error) or fallback (route to
    # quorum_fallback_target). Independent of on_error, which governs a single
    # failed panel attempt. Recipe-owned; requests cannot override it.
    quorum_failure_policy: fail
    judge_prompt_version: fusion-v1
