# Combine this policy with explicit System One provider aliases and an
# api: systemone entrypoint. Thresholds are illustrative, not calibrated risk.
recipes:
  - name: native-cascade
    routing:
      budget: {deadline: 3s, max_calls: 3}
      decisions:
        - name: quality-first
          rules: {}
          modelRefs: [{model: kai}, {model: nox}]
          algorithm:
            type: cascade
            quality:
              type: uncalibrated
              acceptance:
                rules:
                  - {question_type: choice, field: confidence, predicate: {gte: 0.9}}
                  - {question_type: score, field: confidence, predicate: {gte: 0.9}}
                  - {question_type: noul, field: probability_margin, predicate: {gte: 0.4}}
            stages:
              - {name: fast, kind: native, model: kai}
              - {name: strong, kind: native, model: nox}
