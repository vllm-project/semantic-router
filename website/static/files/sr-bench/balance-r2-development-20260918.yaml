    signals:
      complexity:
      - description: Separate direct tasks from analysis and synthesis. Length and language
          do not determine difficulty.
        easy:
          candidates:
          - Copy explicitly supplied information into the requested structure without adding
            an inference.
          - Apply one local edit while preserving the meaning and all other stated details.
          - Retrieve a directly stated fact and give a concise answer without combining separate
            arguments.
          - 把明确提供的信息复制到指定结构中，不添加推断。
          - 只做一处局部修改，保留原意以及所有其他已述细节。
          - 提取直接陈述的事实，简洁作答，不合并不同论证。
          - انسخ المعلومات المقدمة صراحةً إلى البنية المطلوبة من دون إضافة استنتاج.
          - أجر تعديلاً موضعياً واحداً مع الحفاظ على المعنى وجميع التفاصيل الأخرى المذكورة.
          - استخرج حقيقة مذكورة مباشرةً وقدّم إجابة موجزة من دون دمج حجج منفصلة.
          - Übertrage ausdrücklich bereitgestellte Informationen in die verlangte Struktur,
            ohne eine Schlussfolgerung hinzuzufügen.
          - Nimm eine einzige lokale Änderung vor und erhalte dabei die Bedeutung und alle
            anderen genannten Einzelheiten.
          - Entnimm eine direkt genannte Tatsache und antworte knapp, ohne getrennte Argumente
            zu verbinden.
          - Copia la información proporcionada explícitamente en la estructura solicitada
            sin añadir inferencias.
          - Aplica una sola modificación local conservando el significado y todos los demás
            detalles indicados.
          - Extrae un hecho expresado directamente y responde de forma concisa sin combinar
            argumentos separados.
          - 明示された情報を指定の構造にそのまま移し、推論を加えないでください。
          - 意味と他のすべての記載事項を保ちながら、一か所だけ修正してください。
          - 直接述べられた事実を取り出し、別々の論点を組み合わせずに簡潔に答えてください。
          - Return the order number explicitly shown on this receipt.
          - Look up the requested service status using the provided function.
          - Translate this short message while preserving its meaning.
          - Summarize the facts stated in this paragraph in one sentence.
          - 返回这张收据上明确写出的订单编号。
          - 使用提供的函数查询指定服务的当前状态。
          - 翻译这条简短消息并保留原意。
          - 用一句话概括这段文字中陈述的事实。
          - Devuelve el número de pedido que aparece explícitamente en este recibo.
          - Consulta el estado del servicio solicitado mediante la función proporcionada.
          - Traduce este mensaje breve conservando su significado.
          - Resume en una frase los hechos expuestos en este párrafo.
          - Gib die auf diesem Beleg ausdrücklich angegebene Bestellnummer zurück.
          - Frage den Zustand des gewünschten Dienstes mit der bereitgestellten Funktion ab.
          - Übersetze diese kurze Nachricht und erhalte ihre Bedeutung.
          - Fasse die in diesem Absatz genannten Fakten in einem Satz zusammen.
          - أعِد رقم الطلب المذكور صراحةً في هذا الإيصال.
          - استعلم عن حالة الخدمة المطلوبة باستخدام الدالة المتاحة.
          - ترجم هذه الرسالة القصيرة مع الحفاظ على معناها.
          - لخّص الحقائق الواردة في هذه الفقرة في جملة واحدة.
          - この領収書に明記された注文番号を返してください。
          - 提供された関数で指定サービスの現在の状態を調べてください。
          - この短いメッセージを意味を保って翻訳してください。
          - この段落に書かれた事実を一文に要約してください。
        easy_below: -0.08
        hard:
          candidates:
          - Find an outcome satisfying interacting constraints and justify why the nearest
            alternatives fail.
          - Reconcile conflicting evidence, identify unsupported assumptions, and defend a
            conclusion under uncertainty.
          - Design a multi-stage solution whose intermediate choices remain consistent with
            the final objective.
          - 找出满足相互影响的约束的结果，并说明最接近的其他方案为何不成立。
          - 协调冲突的证据，识别没有依据的假设，并在不确定性下论证结论。
          - 设计一个多阶段方案，使中间选择始终与最终目标一致。
          - أوجد نتيجة تحقق قيوداً متفاعلة، وبيّن لماذا لا تصلح البدائل الأقرب.
          - وفّق بين الأدلة المتعارضة، وحدد الافتراضات غير المدعومة، ودافع عن استنتاج في ظل
            عدم اليقين.
          - صمّم حلاً متعدد المراحل تبقى خياراته الوسيطة متسقة مع الهدف النهائي.
          - Finde ein Ergebnis, das zusammenwirkende Bedingungen erfüllt, und begründe, warum
            die nächstliegenden Alternativen scheitern.
          - Gleiche widersprüchliche Belege ab, erkenne unbelegte Annahmen und verteidige
            eine Schlussfolgerung unter Unsicherheit.
          - Entwirf eine mehrstufige Lösung, deren Zwischenentscheidungen mit dem Endziel
            vereinbar bleiben.
          - Encuentra un resultado que satisfaga restricciones interdependientes y justifica
            por qué fallan las alternativas más cercanas.
          - Concilia pruebas contradictorias, identifica supuestos sin fundamento y defiende
            una conclusión ante la incertidumbre.
          - Diseña una solución de varias etapas cuyas decisiones intermedias sigan siendo
            coherentes con el objetivo final.
          - 相互に影響する制約を満たす結果を見つけ、近い代替案が成立しない理由を示してください。
          - 矛盾する証拠を整理し、裏付けのない仮定を特定して、不確実な状況でも結論を論証してください。
          - 中間の選択が最終目標と一貫する、多段階の解決策を設計してください。
          - Design a reliable service architecture, compare alternatives and explain the latency,
            cost and failure-recovery tradeoffs.
          - Diagnose the underlying cause of a failure using incomplete logs and conflicting
            observations, and justify the proposed fix.
          - Derive an algorithm, prove its correctness and analyze its time and space complexity.
          - Combine conflicting research findings into a supported conclusion and identify
            which additional evidence would change it.
          - 设计可靠的服务架构，比较备选方案，并解释延迟、成本和故障恢复之间的取舍。
          - 结合不完整日志和相互矛盾的观察诊断故障根因，并论证修复方案。
          - 推导一个算法，证明其正确性并分析时间和空间复杂度。
          - 综合相互冲突的研究结果，得出有依据的结论，并指出哪些额外证据会改变该结论。
          - Diseña una arquitectura de servicio fiable, compara alternativas y explica los
            compromisos entre latencia, coste y recuperación ante fallos.
          - Diagnostica la causa de un fallo con registros incompletos y observaciones contradictorias,
            y justifica la solución propuesta.
          - Deduce un algoritmo, demuestra su corrección y analiza su complejidad temporal
            y espacial.
          - Integra resultados de investigación contradictorios en una conclusión fundamentada
            e identifica qué pruebas adicionales la cambiarían.
          - Entwirf eine zuverlässige Dienstarchitektur, vergleiche Alternativen und erläutere
            die Zielkonflikte zwischen Latenz, Kosten und Wiederherstellung nach Ausfällen.
          - Diagnostiziere die Ursache eines Fehlers anhand unvollständiger Protokolle und
            widersprüchlicher Beobachtungen und begründe die vorgeschlagene Lösung.
          - Leite einen Algorithmus her, beweise seine Korrektheit und analysiere seine Zeit-
            und Speicherkomplexität.
          - Führe widersprüchliche Forschungsergebnisse zu einer belegten Schlussfolgerung
            zusammen und benenne zusätzliche Belege, die sie ändern würden.
          - صمّم بنية خدمة موثوقة، وقارن البدائل، واشرح المفاضلات بين زمن الاستجابة والتكلفة
            والتعافي من الأعطال.
          - شخّص السبب الجذري لعطل باستخدام سجلات غير مكتملة وملاحظات متعارضة، وبرّر الإصلاح
            المقترح.
          - اشتق خوارزمية، وأثبت صحتها، وحلّل تعقيدها الزمني والمكاني.
          - ادمج نتائج أبحاث متعارضة للوصول إلى استنتاج مدعوم، وحدد الأدلة الإضافية التي قد
            تغيّره.
          - 信頼性の高いサービス構成を設計し、代替案を比較して、遅延、費用、障害復旧のトレードオフを説明してください。
          - 不完全なログと矛盾する観測から障害の根本原因を診断し、修正案の根拠を説明してください。
          - アルゴリズムを導出し、正しさを証明して、時間と空間の計算量を分析してください。
          - 相反する研究結果を統合して根拠のある結論を示し、どの追加証拠が結論を変えるかを特定してください。
        hard_above: 0.025
        name: difficulty
        prototype_scoring:
