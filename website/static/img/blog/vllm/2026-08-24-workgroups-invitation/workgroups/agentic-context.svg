<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Agentic and Context Workgroup</title><desc id="desc">A growing long-running session enters a protected context envelope. Memory selection, pruning, compression, and prompt restructuring produce a bounded context. The Router then selects, hands off to, or composes qualified agent backends within explicit collaboration limits.</desc>
  <defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#111827"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px;font-weight:750;fill:#111827}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke:#111827;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1672" height="941" fill="#fff"/><g class="s" transform="translate(48 35)"><path d="M0 8.65h16.22V40L0 8.65z" fill="#FDB515"/><path d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" fill="#30A2FF"/><text x="53" y="25" font-size="25" font-weight="780" fill="#111827">vLLM</text><text x="53" y="42" font-size="12" font-weight="720" letter-spacing="1.4" fill="#475467">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 05</text><text x="1624" y="75" font-size="16" font-weight="650" fill="#2563eb">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">AGENTIC &amp; CONTEXT</text><text x="836" y="137" class="sub">Optimize context, route agent backends, and bound multi-agent collaboration.</text></g>

  <!-- Growing session -->
  <g class="s" filter="url(#shadow)"><rect x="42" y="221" width="278" height="424" rx="16" fill="url(#blue)" class="card"/><text x="181" y="260" text-anchor="middle" class="pt">LONG SESSION</text><text x="181" y="284" text-anchor="middle" class="sm">Context grows across turns and tools</text>
    <line x1="95" y1="326" x2="95" y2="581" stroke="#2563eb" stroke-width="3"/><circle cx="95" cy="341" r="9" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><rect x="123" y="315" width="153" height="52" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><text x="141" y="346" font-size="14" fill="#344054">system instructions</text>
    <circle cx="95" cy="409" r="9" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><rect x="123" y="383" width="153" height="52" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><text x="141" y="414" class="b">user messages</text>
    <circle cx="95" cy="477" r="9" fill="#fde68a" stroke="#111827" stroke-width="2"/><rect x="123" y="451" width="153" height="52" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><text x="141" y="482" class="b">tool outputs</text>
    <circle cx="95" cy="545" r="9" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><rect x="123" y="519" width="153" height="52" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><text x="141" y="550" class="b">retrieved memory</text><path d="M95 581l-12-18h24z" fill="#2563eb"/><text x="181" y="615" text-anchor="middle" class="st">TOKENS · COST · RISK ↑</text></g><path d="M320 433h48" class="line"/>

  <!-- Protected envelope -->
  <g class="s" filter="url(#shadow)"><rect x="370" y="221" width="308" height="424" rx="16" fill="url(#amber)" class="card"/><text x="524" y="260" text-anchor="middle" class="pt">PROTECTED ENVELOPE</text><text x="524" y="284" text-anchor="middle" class="sm">Preserve authority before optimizing tokens</text>
    <path d="M524 315c21 18 51 21 51 21v42c0 44-27 67-51 80-24-13-51-36-51-80v-42s30-3 51-21z" fill="#fde68a" stroke="#111827" stroke-width="2.3"/><path d="M501 385l16 16 32-43" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="404" y="489" width="240" height="115" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><text x="425" y="518" class="st">MUST SURVIVE</text><circle cx="425" cy="545" r="4" fill="#f59e0b"/><text x="439" y="550" class="sm">system + developer instructions</text><circle cx="425" cy="572" r="4" fill="#f59e0b"/><text x="439" y="577" class="sm">authorization + tool contracts</text><text x="524" y="628" text-anchor="middle" class="sm">No silent lossy transformation</text></g><path d="M678 433h48" class="line"/>

  <!-- Context optimization -->
  <g class="s" filter="url(#shadow)"><rect x="728" y="174" width="488" height="518" rx="17" fill="#fcfcfd" class="card"/><text x="972" y="213" text-anchor="middle" class="pt">CONTEXT OPTIMIZATION</text><text x="972" y="237" text-anchor="middle" class="sm">Transform history under explicit budgets and safety constraints</text>
    <rect x="758" y="270" width="200" height="118" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><circle cx="798" cy="316" r="20" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M790 316h16M798 308v16" stroke="#111827" stroke-width="2"/><text x="829" y="306" class="st">SELECT</text><text x="829" y="330" class="sm">memory + retrieval</text><text x="858" y="367" text-anchor="middle" class="sm">keep what the task needs</text>
    <rect x="986" y="270" width="200" height="118" rx="12" fill="url(#green)" stroke="#111827" stroke-width="2"/><path d="M1019 301h46v46h-46z" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><path d="M1028 314h28M1028 326h20" stroke="#111827" stroke-width="2"/><path d="M1013 292l57 64" stroke="#111827" stroke-width="2.5"/><text x="1081" y="306" class="st">PRUNE</text><text x="1081" y="330" font-size="12" fill="#475467">messages + tools</text><text x="1086" y="367" text-anchor="middle" class="sm">remove low-value history</text>
    <rect x="758" y="415" width="200" height="118" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><path d="M783 452h64M793 465h44M803 478h24" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><text x="858" y="452" class="st">COMPRESS</text><text x="858" y="476" font-size="12" fill="#475467">summarize safely</text><text x="858" y="511" text-anchor="middle" class="sm">reduce tokens with receipts</text>
    <rect x="986" y="415" width="200" height="118" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><path d="M1014 449h54M1014 464h38M1014 479h46" stroke="#6d5bd0" stroke-width="3"/><path d="M1062 442l15 15-15 15" fill="none" stroke="#111827" stroke-width="2"/><text x="1081" y="452" font-size="14" font-weight="750" fill="#111827">RESTRUCTURE</text><text x="1081" y="476" font-size="11" fill="#475467">prompt + sections</text><text x="1086" y="511" text-anchor="middle" class="sm">restore useful ordering</text>
    <path d="M858 533v41h228v-41M972 533v41" fill="none" stroke="#111827" stroke-width="2"/><path d="M972 574v25" class="line"/><rect x="812" y="601" width="320" height="59" rx="11" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="972" y="626" text-anchor="middle" class="st">BOUNDED CONTEXT</text><text x="972" y="648" text-anchor="middle" class="sm">protected · compact · traceable</text></g><path d="M1216 433h46" class="line"/>

  <!-- Agent routing and composition -->
  <g class="s" filter="url(#shadow)"><rect x="1264" y="221" width="364" height="424" rx="16" fill="url(#green)" class="card"/><text x="1446" y="260" text-anchor="middle" class="pt">AGENT ROUTING</text><text x="1446" y="284" text-anchor="middle" class="sm">Select one agent or compose a bounded team</text>
    <rect x="1296" y="318" width="300" height="66" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="1326" cy="351" r="15" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="1326" y="356" text-anchor="middle" font-size="13" font-weight="750" fill="#111827">1</text><text x="1353" y="346" class="st">SELECT</text><text x="1353" y="369" class="sm">capability · trust · state fit</text>
    <path d="M1446 384v30" class="line"/><rect x="1296" y="416" width="300" height="66" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="1326" cy="449" r="15" fill="#fde68a" stroke="#111827" stroke-width="2"/><path d="M1317 449h18M1330 443l6 6-6 6" fill="none" stroke="#111827" stroke-width="2"/><text x="1353" y="444" class="st">HAND OFF</text><text x="1353" y="467" class="sm">preserve context + authority</text>
    <path d="M1446 482v30" class="line"/><rect x="1296" y="514" width="300" height="66" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="1319" cy="547" r="11" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><circle cx="1335" cy="547" r="11" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><text x="1358" y="542" class="st">COMPOSE</text><text x="1358" y="565" class="sm">delegate · parallel · synthesize</text><text x="1446" y="620" text-anchor="middle" class="sm">Explicit limits · single-agent fallback</text></g>

  <!-- Evaluation bar -->
  <g class="s"><text x="836" y="738" text-anchor="middle" class="pt">EVALUATE THE COMPLETE AGENTIC ROUTE</text><rect x="155" y="775" width="1362" height="77" rx="13" fill="#fcfcfd" stroke="#111827" stroke-width="2"/>
    <circle cx="209" cy="813" r="18" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M199 813l7 7 14-18" fill="none" stroke="#2563eb" stroke-width="3"/><text x="241" y="819" class="st">Instruction retention</text><line x1="426" y1="793" x2="426" y2="833" stroke="#d0d5dd"/>
    <circle cx="468" cy="813" r="18" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><text x="468" y="819" text-anchor="middle" class="st">Q</text><text x="500" y="819" class="st">Selection quality</text><line x1="682" y1="793" x2="682" y2="833" stroke="#d0d5dd"/>
    <circle cx="724" cy="813" r="18" fill="#fde68a" stroke="#111827" stroke-width="2"/><text x="724" y="819" text-anchor="middle" class="st">+</text><text x="756" y="819" class="st">Collaboration gain</text><line x1="951" y1="793" x2="951" y2="833" stroke="#d0d5dd"/>
    <circle cx="993" cy="813" r="18" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><text x="993" y="819" text-anchor="middle" class="st">!</text><text x="1025" y="819" class="st">Handoff + context loss</text><line x1="1278" y1="793" x2="1278" y2="833" stroke="#d0d5dd"/>
    <circle cx="1320" cy="813" r="18" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1320 801v13l9 6" fill="none" stroke="#111827" stroke-width="2"/><text x="1348" y="819" font-size="15" font-weight="750" fill="#111827">Latency · cost · safety</text></g>
  <g class="s"><rect x="40" y="900" width="1592" height="1" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">context optimization · session state · agent selection and handoff · bounded multi-agent collaboration</text><text x="1624" y="925" text-anchor="end" class="sm">Not a general agent orchestrator · MoM owns model-level collaboration</text></g>
</svg>
