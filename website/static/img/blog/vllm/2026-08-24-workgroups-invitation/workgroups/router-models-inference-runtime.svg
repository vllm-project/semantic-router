<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Router Models and Inference Runtime Workgroup</title>
  <desc id="desc">Specialized Router Models transform request information into typed routing signals through one extensible inference runtime. A controlled lifecycle improves, evaluates, activates, drains, and rolls back versioned model artifacts.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#111827"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563eb"/></marker>
    <style>
      .s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px;font-weight:750;fill:#111827}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke:#111827;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#blue-arrow)}
    </style>
  </defs>
  <rect width="1672" height="941" fill="#fff"/>
  <g class="s" transform="translate(48 35)"><path d="M0 8.65h16.22V40L0 8.65z" fill="#FDB515"/><path d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" fill="#30A2FF"/><text x="53" y="25" font-size="25" font-weight="780" fill="#111827">vLLM</text><text x="53" y="42" font-size="12" font-weight="720" letter-spacing="1.4" fill="#475467">SEMANTIC ROUTER</text></g>
  <g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 02</text><text x="1624" y="75" font-size="16" font-weight="650" fill="#2563eb">@vllm-sr.ai</text></g>
  <g class="s" text-anchor="middle"><text x="836" y="105" class="t">ROUTER MODELS &amp; INFERENCE RUNTIME</text><text x="836" y="137" class="sub">Turn each request into reliable routing signals through one extensible runtime.</text></g>

  <!-- Input -->
  <g class="s" filter="url(#shadow)"><rect x="44" y="263" width="212" height="270" rx="15" fill="url(#blue)" class="card"/><text x="150" y="301" text-anchor="middle" class="pt">REQUEST</text><rect x="84" y="329" width="132" height="92" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><rect x="101" y="348" width="72" height="38" rx="12" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><circle cx="120" cy="367" r="3"/><circle cx="137" cy="367" r="3"/><circle cx="154" cy="367" r="3"/><path d="M115 386l-12 11v-18" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="150" y="458" text-anchor="middle" class="st">Typed input</text><text x="150" y="484" text-anchor="middle" class="sm">Text · metadata · context</text><text x="150" y="506" text-anchor="middle" class="sm">Policy-safe features</text></g>
  <path d="M256 398h48" class="line"/>

  <!-- Router Model family -->
  <g class="s" filter="url(#shadow)"><rect x="306" y="187" width="588" height="422" rx="17" fill="#fcfcfd" class="card"/><text x="600" y="225" text-anchor="middle" class="pt">ROUTER MODEL FAMILY</text><text x="600" y="249" text-anchor="middle" class="sm">Specialized, versioned models produce distinct signals and scores</text>
    <rect x="333" y="279" width="160" height="125" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><circle cx="413" cy="315" r="20" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M402 315h22M413 304v22" stroke="#111827" stroke-width="2"/><text x="413" y="358" text-anchor="middle" class="st">INTENT</text><text x="413" y="382" text-anchor="middle" class="sm">class + confidence</text>
    <rect x="520" y="279" width="160" height="125" rx="12" fill="url(#green)" stroke="#111827" stroke-width="2"/><path d="M579 334l21-39 21 39z" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><line x1="600" y1="305" x2="600" y2="322" stroke="#111827" stroke-width="2"/><circle cx="600" cy="328" r="2.5"/><text x="600" y="358" text-anchor="middle" class="st">COMPLEXITY</text><text x="600" y="382" text-anchor="middle" class="sm">difficulty score</text>
    <rect x="707" y="279" width="160" height="125" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><path d="M787 292c10 10 23 12 23 12v18c0 19-12 29-23 35-11-6-23-16-23-35v-18s13-2 23-12z" fill="#fde68a" stroke="#111827" stroke-width="2"/><path d="M777 322l8 8 13-18" fill="none" stroke="#111827" stroke-width="2.5"/><text x="787" y="382" text-anchor="middle" class="st">SAFETY</text>
    <rect x="380" y="433" width="190" height="132" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><circle cx="438" cy="482" r="20" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><path d="M428 482l7 7 14-18" fill="none" stroke="#111827" stroke-width="2.5"/><text x="475" y="473" class="st">PREFERENCE</text><text x="475" y="499" class="sm">model affinity</text><text x="475" y="523" class="sm">user or domain fit</text>
    <rect x="597" y="433" width="217" height="132" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><path d="M631 519V477M649 519v-27M667 519v-51" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><text x="695" y="473" class="st">QUALITY</text><text x="695" y="499" class="sm">expected outcome</text><text x="695" y="523" class="sm">per candidate model</text>
  </g>
  <path d="M894 398h48" class="line"/>

  <!-- Runtime -->
  <g class="s" filter="url(#shadow)"><rect x="944" y="218" width="390" height="360" rx="17" fill="url(#violet)" class="card"/><text x="1139" y="256" text-anchor="middle" class="pt">INFERENCE RUNTIME</text><text x="1139" y="280" text-anchor="middle" class="sm">One typed contract across model engines</text>
    <rect x="977" y="307" width="324" height="58" rx="10" fill="#fff" stroke="#6d5bd0" stroke-width="2"/><text x="1139" y="331" text-anchor="middle" class="tiny">MODEL CONTRACT</text><text x="1139" y="352" text-anchor="middle" class="b">capabilities · artifact ID · schema</text>
    <path d="M1139 365v37" class="line"/>
    <rect x="977" y="404" width="92" height="65" rx="10" fill="#fff" stroke="#111827" stroke-width="1.8"/><text x="1023" y="432" text-anchor="middle" class="st">LOCAL</text><text x="1023" y="453" text-anchor="middle" class="sm">Candle</text>
    <rect x="1093" y="404" width="92" height="65" rx="10" fill="#fff" stroke="#111827" stroke-width="1.8"/><text x="1139" y="432" text-anchor="middle" class="st">ONNX</text><text x="1139" y="453" text-anchor="middle" class="sm">Runtime</text>
    <rect x="1209" y="404" width="92" height="65" rx="10" fill="#fff" stroke="#111827" stroke-width="1.8"/><text x="1255" y="432" text-anchor="middle" class="st">REMOTE</text><text x="1255" y="453" text-anchor="middle" class="sm">vLLM · TEI</text>
    <path d="M1023 469v35h232v-35M1139 469v35" fill="none" stroke="#111827" stroke-width="2"/><path d="M1139 504v24" class="line"/>
    <text x="1139" y="554" text-anchor="middle" class="sm">Load · warm · diagnose · drain · rollback</text>
  </g>
  <path d="M1334 398h43" class="line"/>

  <!-- Typed output -->
  <g class="s" filter="url(#shadow)"><rect x="1379" y="263" width="249" height="270" rx="15" fill="url(#green)" class="card"/><text x="1503.5" y="301" text-anchor="middle" class="pt">ROUTING SIGNALS</text><rect x="1414" y="331" width="179" height="104" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><text x="1434" y="359" class="sm">intent</text><rect x="1491" y="349" width="80" height="10" rx="5" fill="#bfdbfe"/><text x="1434" y="389" class="sm">complexity</text><rect x="1510" y="379" width="61" height="10" rx="5" fill="#b9e4ae"/><text x="1434" y="419" class="sm">quality</text><rect x="1476" y="409" width="95" height="10" rx="5" fill="#fde68a"/><text x="1503.5" y="474" text-anchor="middle" class="st">Typed + explainable</text><text x="1503.5" y="500" text-anchor="middle" class="sm">Consumed by MoM recipes</text></g>

  <!-- Improvement lifecycle -->
  <g class="s"><text x="836" y="665" text-anchor="middle" class="pt">ROUTER MODEL LIFECYCLE</text><text x="836" y="690" text-anchor="middle" class="sm">Improve model quality without bypassing evaluation or runtime controls</text>
    <rect x="112" y="727" width="240" height="95" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><text x="232" y="763" text-anchor="middle" class="st">DATA + FEEDBACK</text><text x="232" y="790" text-anchor="middle" class="sm">Traces · labels · outcomes</text>
    <path d="M352 775h48" class="line"/><rect x="402" y="727" width="240" height="95" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><text x="522" y="763" text-anchor="middle" class="st">IMPROVE</text><text x="522" y="790" text-anchor="middle" class="sm">Train · distill · calibrate</text>
    <path d="M642 775h48" class="line"/><rect x="692" y="727" width="240" height="95" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><text x="812" y="763" text-anchor="middle" class="st">VERSIONED ARTIFACT</text><text x="812" y="790" text-anchor="middle" class="sm">Weights · schema · provenance</text>
    <path d="M932 775h48" class="line"/><rect x="982" y="727" width="240" height="95" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><text x="1102" y="763" text-anchor="middle" class="st">EVALUATE + GATE</text><text x="1102" y="790" text-anchor="middle" class="sm">Quality · calibration · speed</text>
    <path d="M1222 775h48" class="line"/><rect x="1272" y="727" width="288" height="95" rx="12" fill="url(#green)" stroke="#111827" stroke-width="2"/><text x="1416" y="763" text-anchor="middle" class="st">ACTIVATE OR ROLLBACK</text><text x="1416" y="790" text-anchor="middle" class="sm">Warm · switch · drain · reverse</text>
    <path d="M1416 822v42H232v-40" class="loop"/>
  </g>
  <g class="s"><rect x="40" y="900" width="1592" height="1" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">Router Model quality · routing-native model families · typed inference runtime · artifact lifecycle</text><text x="1624" y="925" text-anchor="end" class="sm">MoM recipes consume signals · Data Plane carries the live request</text></g>
</svg>
