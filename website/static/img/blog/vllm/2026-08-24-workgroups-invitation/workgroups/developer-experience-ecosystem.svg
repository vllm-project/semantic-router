<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Developer Experience and Ecosystem Workgroup</title><desc id="desc">A developer journey moves from discovery and installation to configuration, the first routed request, understanding, tuning, sharing, and contribution. CLI, Dashboard, APIs, recipes, documentation, tutorials, and extensions form one approachable experience.</desc>
  <defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#111827"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px;font-weight:750;fill:#111827}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke:#111827;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1672" height="941" fill="#fff"/><g class="s" transform="translate(48 35)"><path d="M0 8.65h16.22V40L0 8.65z" fill="#FDB515"/><path d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" fill="#30A2FF"/><text x="53" y="25" font-size="25" font-weight="780" fill="#111827">vLLM</text><text x="53" y="42" font-size="12" font-weight="720" letter-spacing="1.4" fill="#475467">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 06</text><text x="1624" y="75" font-size="16" font-weight="650" fill="#2563eb">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">DEVELOPER EXPERIENCE &amp; ECOSYSTEM</text><text x="836" y="137" class="sub">Make vLLM Semantic Router easy to discover, install, configure, extend, and operate.</text></g>

  <!-- User journey -->
  <g class="s"><text x="836" y="194" text-anchor="middle" class="pt">ONE APPROACHABLE DEVELOPER JOURNEY</text><text x="836" y="219" text-anchor="middle" class="sm">Reduce the distance from curiosity to a successful, understood, and shareable routed workload</text>
    <line x1="143" y1="350" x2="1528" y2="350" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><rect x="54" y="261" width="206" height="178" rx="14" fill="url(#blue)" class="card"/><circle cx="157" cy="311" r="27" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M145 311h24M157 299v24" stroke="#111827" stroke-width="2"/><text x="157" y="365" text-anchor="middle" class="st">1 · DISCOVER</text><text x="157" y="392" text-anchor="middle" class="sm">What problem does it solve?</text><text x="157" y="416" text-anchor="middle" class="sm">Which path fits me?</text></g>
    <g filter="url(#shadow)"><rect x="283" y="261" width="206" height="178" rx="14" fill="url(#green)" class="card"/><path d="M352 294h68v49h-68z" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M365 307h42M365 321h31" stroke="#388e3c" stroke-width="2"/><path d="M386 283v36M375 308l11 11 11-11" fill="none" stroke="#111827" stroke-width="2.5"/><text x="386" y="365" text-anchor="middle" class="st">2 · INSTALL</text><text x="386" y="392" text-anchor="middle" font-size="13" fill="#475467">Supported package + platform</text><text x="386" y="416" text-anchor="middle" class="sm">Clear validation and recovery</text></g>
    <g filter="url(#shadow)"><rect x="512" y="261" width="206" height="178" rx="14" fill="url(#amber)" class="card"/><path d="M580 291h70v58h-70z" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M593 305h44M593 319h34M593 333h22" stroke="#f59e0b" stroke-width="2"/><text x="615" y="365" text-anchor="middle" class="st">3 · CONFIGURE</text><text x="615" y="392" text-anchor="middle" class="sm">Recipe + model pool</text><text x="615" y="416" text-anchor="middle" class="sm">Validate before serving</text></g>
    <g filter="url(#shadow)"><rect x="741" y="241" width="230" height="218" rx="14" fill="url(#violet)" class="card"/><circle cx="856" cy="304" r="35" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><path d="M842 304l10 10 20-27" fill="none" stroke="#111827" stroke-width="3.5"/><text x="856" y="373" text-anchor="middle" font-size="16" font-weight="750" fill="#111827">4 · FIRST ROUTED REQUEST</text><text x="856" y="401" text-anchor="middle" class="sm">One command · visible decision</text><rect x="794" y="417" width="124" height="25" rx="12" fill="#fff" stroke="#6d5bd0"/><text x="856" y="434" text-anchor="middle" class="tiny">TIME TO VALUE ↓</text></g>
    <g filter="url(#shadow)"><rect x="994" y="261" width="206" height="178" rx="14" fill="url(#blue)" class="card"/><path d="M1062 292h70v55h-70z" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1074 334v-20M1089 334v-31M1104 334v-13M1119 334v-38" stroke="#2563eb" stroke-width="5"/><text x="1097" y="365" text-anchor="middle" class="st">5 · UNDERSTAND</text><text x="1097" y="392" text-anchor="middle" class="sm">Explain route + health</text><text x="1097" y="416" text-anchor="middle" class="sm">Evaluate and tune safely</text></g>
    <g filter="url(#shadow)"><rect x="1223" y="261" width="206" height="178" rx="14" fill="url(#green)" class="card"/><circle cx="1326" cy="317" r="31" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><circle cx="1315" cy="311" r="8" fill="#fff" stroke="#111827"/><circle cx="1338" cy="311" r="8" fill="#fff" stroke="#111827"/><path d="M1303 334c3-11 21-11 24 0M1325 334c3-11 21-11 24 0" fill="#fff" stroke="#111827"/><text x="1326" y="365" text-anchor="middle" class="st">6 · SHARE</text><text x="1326" y="392" text-anchor="middle" class="sm">Use cases + tutorials</text><text x="1326" y="416" text-anchor="middle" class="sm">Extensions + integrations</text></g>
    <g filter="url(#shadow)"><rect x="1452" y="261" width="176" height="178" rx="14" fill="url(#amber)" class="card"/><path d="M1502 294h76v48h-76z" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1518 306h44M1518 320h30" stroke="#111827" stroke-width="2"/><path d="M1540 282v60" stroke="#f59e0b" stroke-width="3"/><text x="1540" y="365" text-anchor="middle" class="st">7 · CONTRIBUTE</text><text x="1540" y="392" text-anchor="middle" class="sm">Clear issue + epic</text><text x="1540" y="416" text-anchor="middle" class="sm">Reviewable change</text></g>
  </g>

  <!-- Interfaces -->
  <g class="s" filter="url(#shadow)"><rect x="102" y="505" width="1468" height="162" rx="17" fill="#fcfcfd" class="card"/><text x="836" y="541" text-anchor="middle" class="pt">CONSISTENT INTERFACES</text><text x="836" y="565" text-anchor="middle" class="sm">Different ways to use the project should expose the same maintained concepts and validation</text>
    <rect x="153" y="589" width="272" height="51" rx="10" fill="url(#blue)" stroke="#111827" stroke-width="2"/><text x="289" y="621" text-anchor="middle" class="st">CLI · INSTALL / DEPLOY / TUNE</text>
    <rect x="453" y="589" width="272" height="51" rx="10" fill="url(#green)" stroke="#111827" stroke-width="2"/><text x="589" y="621" text-anchor="middle" class="st">DASHBOARD · SEE / OPERATE</text>
    <rect x="753" y="589" width="272" height="51" rx="10" fill="url(#amber)" stroke="#111827" stroke-width="2"/><text x="889" y="621" text-anchor="middle" class="st">APIs · AUTOMATE / EXTEND</text>
    <rect x="1053" y="589" width="466" height="51" rx="10" fill="url(#violet)" stroke="#111827" stroke-width="2"/><text x="1286" y="621" text-anchor="middle" class="st">AGENT SKILL · GENERATE / EVALUATE / OPERATE</text></g>

