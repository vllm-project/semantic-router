    <rect x="843" y="757" width="335" height="97" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><text x="1010.5" y="793" text-anchor="middle" class="st">EXTEND</text><text x="1010.5" y="820" text-anchor="middle" class="sm">signals · algorithms · integrations</text><text x="1010.5" y="842" text-anchor="middle" class="sm">maintained extension contracts</text>
    <rect x="1213" y="757" width="356" height="97" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><text x="1391" y="793" text-anchor="middle" class="st">GROW TOGETHER</text><text x="1391" y="820" text-anchor="middle" class="sm">contributor entry points · Workgroups</text><text x="1391" y="842" text-anchor="middle" class="sm">shared stories and reusable knowledge</text></g>
  <g class="s"><rect x="40" y="900" width="1592" height="1" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">CLI · Dashboard UX · docs · tutorials · examples · agent skill · extension and contributor experience</text><text x="1624" y="925" text-anchor="end" class="sm">Other Workgroups own the algorithms and production contracts surfaced here</text></g>
