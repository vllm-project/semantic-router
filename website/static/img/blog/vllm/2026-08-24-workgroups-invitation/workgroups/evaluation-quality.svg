<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation and Quality Workgroup</title><desc id="desc">Capabilities from every technical direction enter one shared evaluation contract. Signal and model quality, routing decisions, MoM outcomes, serving performance, platform compatibility, and end-to-end workflows are measured through reproducible benchmarks and regression gates before results are published.</desc>
  <defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#111827"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px;font-weight:750;fill:#111827}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke:#111827;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1672" height="941" fill="#fff"/><g class="s" transform="translate(48 35)"><path d="M0 8.65h16.22V40L0 8.65z" fill="#FDB515"/><path d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" fill="#30A2FF"/><text x="53" y="25" font-size="25" font-weight="780" fill="#111827">vLLM</text><text x="53" y="42" font-size="12" font-weight="720" letter-spacing="1.4" fill="#475467">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 07</text><text x="1624" y="75" font-size="16" font-weight="650" fill="#2563eb">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">EVALUATION &amp; QUALITY</text><text x="836" y="137" class="sub">Make every supported capability measurable and every change verifiable.</text></g>

  <!-- Inputs from directions -->
  <g class="s" filter="url(#shadow)"><rect x="43" y="194" width="292" height="508" rx="16" fill="#fcfcfd" class="card"/><text x="189" y="232" text-anchor="middle" class="pt">WHAT WE MEASURE</text><text x="189" y="256" text-anchor="middle" class="sm">Capabilities stay owned by their domains</text>
    <rect x="72" y="286" width="234" height="53" rx="10" fill="url(#blue)" stroke="#111827" stroke-width="1.8"/><circle cx="99" cy="312" r="10" fill="#60a5fa"/><text x="121" y="318" class="st">Router Models</text>
    <rect x="72" y="355" width="234" height="53" rx="10" fill="url(#green)" stroke="#111827" stroke-width="1.8"/><circle cx="99" cy="381" r="10" fill="#7bc66c"/><text x="121" y="387" class="st">MoM + recipes</text>
    <rect x="72" y="424" width="234" height="53" rx="10" fill="url(#amber)" stroke="#111827" stroke-width="1.8"/><circle cx="99" cy="450" r="10" fill="#f7b84b"/><text x="121" y="456" class="st">Data Plane</text>
    <rect x="72" y="493" width="234" height="53" rx="10" fill="url(#violet)" stroke="#111827" stroke-width="1.8"/><circle cx="99" cy="519" r="10" fill="#9b8ae6"/><text x="121" y="525" class="st">Enterprise + env.</text>
    <rect x="72" y="562" width="234" height="53" rx="10" fill="url(#blue)" stroke="#111827" stroke-width="1.8"/><circle cx="99" cy="588" r="10" fill="#60a5fa"/><text x="121" y="594" class="st">Agentic + context</text>
    <rect x="72" y="631" width="234" height="45" rx="10" fill="url(#green)" stroke="#111827" stroke-width="1.8"/><circle cx="99" cy="653" r="10" fill="#7bc66c"/><text x="121" y="659" class="st">Developer workflows</text></g><path d="M335 448h49" class="line"/>

  <!-- Evaluation contract -->
  <g class="s" filter="url(#shadow)"><rect x="386" y="194" width="392" height="508" rx="16" fill="url(#blue)" class="card"/><text x="582" y="232" text-anchor="middle" class="pt">SHARED EVALUATION CONTRACT</text><text x="582" y="256" text-anchor="middle" class="sm">Comparable results require more than a score</text>
    <rect x="417" y="290" width="330" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M444 311h39v31h-39z" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M453 320h21M453 330h15" stroke="#111827" stroke-width="1.8"/><text x="503" y="320" class="st">BENCHMARK DEFINITION</text><text x="503" y="344" class="sm">task · dataset · provenance</text>
    <rect x="417" y="382" width="330" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M444 437v-38h39v38M453 427v-16M463 427v-24M473 427v-10" fill="none" stroke="#388e3c" stroke-width="2.5"/><text x="503" y="412" class="st">METRICS + COMPARISON</text><text x="503" y="436" class="sm">quality · cost · latency · safety</text>
    <rect x="417" y="474" width="330" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M443 497h40v30h-40z" fill="#fde68a" stroke="#111827" stroke-width="2"/><path d="M451 507h24M451 517h16" stroke="#111827" stroke-width="1.8"/><text x="503" y="504" class="st">REPRODUCIBLE RUN</text><text x="503" y="528" class="sm">version · config · seed · environment</text>
    <rect x="417" y="566" width="330" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="463" cy="602" r="20" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><path d="M453 602l7 7 14-18" fill="none" stroke="#111827" stroke-width="2.5"/><text x="503" y="596" class="st">ACCEPTANCE RULE</text><text x="503" y="620" font-size="13" fill="#475467">baseline · threshold · regression policy</text><text x="582" y="673" text-anchor="middle" class="sm">Same claim → same evidence structure</text></g><path d="M778 448h49" class="line"/>

  <!-- Evaluation stack -->
  <g class="s" filter="url(#shadow)"><rect x="829" y="174" width="484" height="548" rx="17" fill="#fcfcfd" class="card"/><text x="1071" y="213" text-anchor="middle" class="pt">EVALUATION STACK</text><text x="1071" y="237" text-anchor="middle" class="sm">Measure each layer, then validate the system end to end</text>
    <rect x="866" y="270" width="410" height="68" rx="10" fill="url(#green)" stroke="#111827" stroke-width="2"/><text x="889" y="298" class="st">1 · SIGNAL / MODEL</text><text x="889" y="322" class="sm">accuracy · calibration · robustness · speed</text>
    <rect x="886" y="352" width="370" height="68" rx="10" fill="url(#blue)" stroke="#111827" stroke-width="2"/><text x="909" y="380" class="st">2 · ROUTING DECISION</text><text x="909" y="404" class="sm">selection quality · regret · policy compliance</text>
    <rect x="906" y="434" width="330" height="68" rx="10" fill="url(#amber)" stroke="#111827" stroke-width="2"/><text x="929" y="462" class="st">3 · MoM OUTCOME</text><text x="929" y="486" class="sm">answer quality · cost · model card results</text>
    <rect x="926" y="516" width="290" height="68" rx="10" fill="url(#violet)" stroke="#111827" stroke-width="2"/><text x="949" y="544" class="st">4 · SERVING / PLATFORM</text><text x="949" y="568" class="sm">performance · compatibility · recovery</text>
    <rect x="946" y="598" width="250" height="68" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="1071" y="626" text-anchor="middle" class="st">5 · END TO END</text><text x="1071" y="650" text-anchor="middle" class="sm">real workflow · supported path</text><path d="M1071 338v14M1071 420v14M1071 502v14M1071 584v14" class="line"/></g><path d="M1313 448h49" class="line"/>

  <!-- Gates and output -->
  <g class="s" filter="url(#shadow)"><rect x="1364" y="194" width="264" height="508" rx="16" fill="url(#green)" class="card"/><text x="1496" y="232" text-anchor="middle" class="pt">QUALITY GATES</text><text x="1496" y="256" text-anchor="middle" class="sm">Protect supported behavior</text>
    <path d="M1496 291c22 19 52 22 52 22v43c0 45-28 69-52 82-24-13-52-37-52-82v-43s30-3 52-22z" fill="#b9e4ae" stroke="#111827" stroke-width="2.3"/><path d="M1472 361l17 17 33-45" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1496" y="479" text-anchor="middle" class="st">REGRESSION CHECKS</text><text x="1496" y="505" text-anchor="middle" class="sm">CI · E2E · performance</text><text x="1496" y="529" text-anchor="middle" class="sm">compatibility · security</text><line x1="1407" y1="556" x2="1585" y2="556" stroke="#98a2b3" stroke-dasharray="5 5"/>
    <text x="1496" y="588" text-anchor="middle" class="st">PUBLISH RESULTS</text><text x="1496" y="614" text-anchor="middle" class="sm">model card · benchmark report</text><text x="1496" y="638" text-anchor="middle" class="sm">known limits · reproducible setup</text><rect x="1435" y="658" width="122" height="27" rx="13" fill="#fff" stroke="#388e3c"/><text x="1496" y="677" text-anchor="middle" class="tiny">PASS / BLOCK</text></g>

  <!-- Responsibility model -->
  <g class="s"><text x="836" y="775" text-anchor="middle" class="pt">SHARED MEASUREMENT · DISTRIBUTED ACCOUNTABILITY</text><rect x="211" y="806" width="548" height="65" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><text x="485" y="833" text-anchor="middle" class="st">EVALUATION &amp; QUALITY DEFINES</text><text x="485" y="856" text-anchor="middle" class="sm">common contracts · reproducibility · shared gates</text><path d="M759 839h154" class="line"/><rect x="915" y="806" width="548" height="65" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><text x="1189" y="833" text-anchor="middle" class="st">EACH TECHNICAL WORKGROUP OWNS</text><text x="1189" y="856" text-anchor="middle" class="sm">its quality target · implementation · regression fix</text></g>
  <g class="s"><rect x="40" y="900" width="1592" height="1" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">benchmark contracts · result publication · model-card requirements · CI/E2E/performance quality gates</text><text x="1624" y="925" text-anchor="end" class="sm">Does not replace domain ownership, Maintainer review, or release decisions</text></g>
</svg>
