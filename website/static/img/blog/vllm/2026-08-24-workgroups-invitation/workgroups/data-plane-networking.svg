<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Data Plane and Networking Workgroup</title>
  <desc id="desc">Standalone HTTP and Envoy ExtProc entry modes converge on one shared routing core, then dispatch to model backends and stream a response. Performance, reliability, and observability apply across the complete live path.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#111827"/></marker>
    <style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px;font-weight:750;fill:#111827}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke:#111827;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1672" height="941" fill="#fff"/>
  <g class="s" transform="translate(48 35)"><path d="M0 8.65h16.22V40L0 8.65z" fill="#FDB515"/><path d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" fill="#30A2FF"/><text x="53" y="25" font-size="25" font-weight="780" fill="#111827">vLLM</text><text x="53" y="42" font-size="12" font-weight="720" letter-spacing="1.4" fill="#475467">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 03</text><text x="1624" y="75" font-size="16" font-weight="650" fill="#2563eb">@vllm-sr.ai</text></g>
  <g class="s" text-anchor="middle"><text x="836" y="105" class="t">DATA PLANE &amp; NETWORKING</text><text x="836" y="137" class="sub">Execute every routing decision through one fast, reliable, portable request path.</text></g>

  <!-- Client -->
  <g class="s" filter="url(#shadow)"><rect x="44" y="292" width="198" height="244" rx="15" fill="url(#blue)" class="card"/><text x="143" y="331" text-anchor="middle" class="pt">CLIENT</text><rect x="85" y="359" width="116" height="85" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M103 382h80M103 399h55M103 416h67" stroke="#111827" stroke-width="2"/><circle cx="103" cy="468" r="6" fill="#30a2ff"/><text x="143" y="474" font-size="13" fill="#475467">request stream</text><text x="143" y="505" text-anchor="middle" class="sm">OpenAI-compatible traffic</text></g>
  <path d="M242 414h57" class="line"/>

  <!-- Two entry modes -->
  <g class="s" filter="url(#shadow)"><rect x="301" y="199" width="330" height="430" rx="17" fill="#fcfcfd" class="card"/><text x="466" y="237" text-anchor="middle" class="pt">ENTRY MODES</text><text x="466" y="261" text-anchor="middle" class="sm">Choose the boundary—not the routing behavior</text>
    <rect x="331" y="291" width="270" height="126" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><rect x="355" y="320" width="56" height="46" rx="7" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M365 335h36M365 348h26" stroke="#2563eb" stroke-width="2"/><text x="433" y="330" class="st">STANDALONE</text><text x="433" y="354" class="sm">Native HTTP server</text><text x="433" y="378" class="sm">Docker · Kubernetes</text><text x="433" y="399" font-size="12" fill="#475467">No Envoy dependency</text>
    <text x="466" y="447" text-anchor="middle" class="tiny">OR</text>
    <rect x="331" y="474" width="270" height="126" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><path d="M355 511h56v47h-56z" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M366 525h34M366 538h34M383 511v47" stroke="#6d5bd0" stroke-width="2"/><text x="429" y="513" font-size="14" font-weight="750" fill="#111827">GATEWAY-INTEGRATED</text><text x="433" y="537" class="sm">Envoy ExtProc</text><text x="433" y="561" class="sm">Existing gateway stack</text></g>

  <!-- Both modes converge -->
  <path d="M631 354h51v60h42M631 537h51V414h42" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g class="s" filter="url(#shadow)"><rect x="726" y="242" width="403" height="344" rx="17" fill="url(#green)" class="card"/><text x="927.5" y="280" text-anchor="middle" class="pt">SHARED ROUTING CORE</text><text x="927.5" y="304" text-anchor="middle" class="sm">The same semantics in both entry modes</text>
    <rect x="758" y="337" width="96" height="92" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="806" cy="365" r="14" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="806" y="399" text-anchor="middle" class="st">SIGNALS</text>
    <path d="M854 383h43" class="line"/><rect x="899" y="337" width="96" height="92" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M923 365h48M947 347v36" stroke="#111827" stroke-width="2"/><text x="947" y="399" text-anchor="middle" class="st">DECIDE</text>
    <path d="M995 383h43" class="line"/><rect x="1040" y="337" width="58" height="92" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1055 354h28v28h-28zM1055 389h28v16h-28z" fill="#fde68a" stroke="#111827" stroke-width="1.6"/><text x="1069" y="450" text-anchor="middle" class="sm">plugins</text>
    <rect x="758" y="477" width="340" height="70" rx="11" fill="#fff" stroke="#388e3c" stroke-width="2"/><text x="928" y="506" text-anchor="middle" class="st">ONE EXECUTION CONTRACT</text><text x="928" y="530" text-anchor="middle" class="sm">request · response · errors · telemetry</text></g>
  <path d="M1129 414h53" class="line"/>

  <!-- Backend dispatch -->
  <g class="s" filter="url(#shadow)"><rect x="1184" y="242" width="264" height="344" rx="17" fill="url(#amber)" class="card"/><text x="1316" y="280" text-anchor="middle" class="pt">DISPATCH</text><text x="1316" y="304" text-anchor="middle" class="sm">Engine-neutral connectivity</text>
    <rect x="1215" y="337" width="202" height="170" rx="12" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="1261" cy="383" r="22" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><text x="1261" y="389" text-anchor="middle" class="st">A</text><circle cx="1371" cy="383" r="22" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><text x="1371" y="389" text-anchor="middle" class="st">B</text><circle cx="1316" cy="455" r="22" fill="#fde68a" stroke="#111827" stroke-width="2"/><text x="1316" y="461" text-anchor="middle" class="st">C</text><path d="M1261 405v20l55 8 55-8v-20M1316 433v-28" fill="none" stroke="#111827" stroke-width="2"/><text x="1316" y="537" text-anchor="middle" class="sm">Backend pool + endpoints</text><text x="1316" y="560" text-anchor="middle" class="sm">Retry · fallback · recovery</text></g>
  <path d="M1448 414h47" class="line"/>
  <g class="s" filter="url(#shadow)"><rect x="1497" y="292" width="131" height="244" rx="15" fill="url(#green)" class="card"/><text x="1562.5" y="331" text-anchor="middle" class="pt">STREAM</text><path d="M1528 370h69M1528 394h48M1528 418h60" stroke="#388e3c" stroke-width="5" stroke-linecap="round"/><path d="M1530 465h63" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/><text x="1562.5" y="505" text-anchor="middle" class="sm">One response</text></g>

  <!-- Horizontal qualities -->
  <g class="s"><text x="836" y="684" text-anchor="middle" class="pt">ONE LIVE-PATH QUALITY BAR</text><text x="836" y="709" text-anchor="middle" class="sm">Every mode must preserve behavior while meeting measurable performance and reliability targets</text>
    <rect x="143" y="747" width="294" height="102" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><path d="M174 805l18-35 18 35 18-21 18 21" fill="none" stroke="#2563eb" stroke-width="3"/><text x="268" y="780" class="st">PERFORMANCE</text><text x="268" y="811" font-size="11" font-weight="650" fill="#667085">P50 / P99 · THROUGHPUT</text><text x="268" y="833" font-size="11" font-weight="650" fill="#667085">STREAMING · EFFICIENCY</text>
    <rect x="478" y="747" width="294" height="102" rx="12" fill="url(#green)" stroke="#111827" stroke-width="2"/><path d="M510 777c10 9 20 10 20 10v16c0 16-10 24-20 29-10-5-20-13-20-29v-16s10-1 20-10z" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><text x="551" y="780" class="st">RELIABILITY</text><text x="551" y="811" font-size="11" font-weight="650" fill="#667085">TIMEOUT · RETRY · FALLBACK</text><text x="551" y="833" font-size="11" font-weight="650" fill="#667085">RECOVERY · BACKPRESSURE</text>
    <rect x="813" y="747" width="294" height="102" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><circle cx="850" cy="798" r="23" fill="#fde68a" stroke="#111827" stroke-width="2"/><path d="M850 783v17l12 8" fill="none" stroke="#111827" stroke-width="2"/><text x="891" y="780" class="st">CONSISTENCY</text><text x="891" y="811" font-size="11" font-weight="650" fill="#667085">SAME SEMANTICS IN BOTH MODES</text><text x="891" y="833" font-size="11" font-weight="650" fill="#667085">ERRORS · HEADERS · STREAMING</text>
    <rect x="1148" y="747" width="381" height="102" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><path d="M1180 823v-42h56v42M1194 812v-20M1208 812v-10M1222 812v-28" fill="none" stroke="#6d5bd0" stroke-width="3"/><text x="1254" y="780" class="st">OBSERVABILITY</text><text x="1254" y="811" font-size="11" font-weight="650" fill="#667085">TRACES · METRICS · ROUTE METADATA</text><text x="1254" y="833" font-size="11" font-weight="650" fill="#667085">REPRODUCIBLE PERFORMANCE EVIDENCE</text>
  </g>
  <g class="s"><rect x="40" y="900" width="1592" height="1" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">live request path · standalone mode · Envoy/gateway integration · backend dispatch · performance</text><text x="1624" y="925" text-anchor="end" class="sm">Enterprise defines access policy · MoM defines the routing decision</text></g>
</svg>
