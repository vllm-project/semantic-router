<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise and Environment Workgroup</title><desc id="desc">Operators and applications use provider-backed identity, management authorization, and audit boundaries. A production management layer activates versioned snapshots into supported Docker and Kubernetes environments across qualified hardware, with monitoring and rollback.</desc>
  <defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfff9"/><stop offset="1" stop-color="#edf8e9"/></linearGradient><linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2d8"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcff"/><stop offset="1" stop-color="#f1edff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#111827"/></marker><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.t{font-size:42px;font-weight:760;fill:#111827;letter-spacing:-.6px}.sub{font-size:21px;fill:#475467}.pt{font-size:22px;font-weight:750;fill:#111827}.st{font-size:17px;font-weight:750;fill:#111827}.b{font-size:16px;fill:#344054}.sm{font-size:14px;fill:#475467}.tiny{font-size:12px;font-weight:650;fill:#667085;letter-spacing:.4px}.card{stroke:#111827;stroke-width:2.2}.line{fill:none;stroke:#111827;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1672" height="941" fill="#fff"/><g class="s" transform="translate(48 35)"><path d="M0 8.65h16.22V40L0 8.65z" fill="#FDB515"/><path d="M24.33 7.57L38.93 0 28.12 40H16.22l8.11-32.43z" fill="#30A2FF"/><text x="53" y="25" font-size="25" font-weight="780" fill="#111827">vLLM</text><text x="53" y="42" font-size="12" font-weight="720" letter-spacing="1.4" fill="#475467">SEMANTIC ROUTER</text></g><g class="s" text-anchor="end"><text x="1624" y="50" class="tiny">WORKGROUP 04</text><text x="1624" y="75" font-size="16" font-weight="650" fill="#2563eb">@vllm-sr.ai</text></g><g class="s" text-anchor="middle"><text x="836" y="105" class="t">ENTERPRISE &amp; ENVIRONMENT</text><text x="836" y="137" class="sub">Make vLLM Semantic Router production-grade across supported environments and hardware.</text></g>

  <!-- Principals -->
  <g class="s" filter="url(#shadow)"><rect x="43" y="236" width="225" height="350" rx="15" fill="url(#blue)" class="card"/><text x="155.5" y="275" text-anchor="middle" class="pt">CLIENTS</text><circle cx="117" cy="328" r="28" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><circle cx="117" cy="320" r="9" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M99 345c4-13 31-13 36 0" fill="#fff" stroke="#111827" stroke-width="2"/><text x="163" y="325" class="st">OPERATORS</text><text x="163" y="348" font-size="12" fill="#475467">provider identities</text><rect x="87" y="386" width="60" height="60" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M100 430v-21h9v21M113 430v-33h9v33M126 430v-14h9v14" fill="#b9e4ae" stroke="#111827" stroke-width="1.5"/><text x="163" y="407" class="st">APPS</text><text x="163" y="430" font-size="12" fill="#475467">management clients</text><rect x="87" y="474" width="60" height="60" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M104 491h26v26h-26zM97 500h7M130 500h7M117 484v7M117 517v9" fill="#fde68a" stroke="#111827" stroke-width="2"/><text x="158" y="495" font-size="15" font-weight="750" fill="#111827">AUTOMATION</text><text x="158" y="518" font-size="12" fill="#475467">agents + services</text><text x="155.5" y="561" text-anchor="middle" class="sm">trusted identity · permission</text></g><path d="M268 411h47" class="line"/>

  <!-- Access controls -->
  <g class="s" filter="url(#shadow)"><rect x="317" y="190" width="380" height="442" rx="17" fill="url(#amber)" class="card"/><text x="507" y="229" text-anchor="middle" class="pt">SECURITY BOUNDARIES</text><text x="507" y="253" text-anchor="middle" class="sm">Who may operate each management surface?</text>
    <rect x="347" y="285" width="320" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M378 312a14 14 0 0128 0v10h-28z" fill="#fde68a" stroke="#111827" stroke-width="2"/><rect x="373" y="320" width="38" height="25" rx="5" fill="#fde68a" stroke="#111827" stroke-width="2"/><text x="431" y="316" class="st">PROVIDER IDENTITY</text><text x="431" y="339" class="sm">OIDC login · trusted claims</text>
    <rect x="347" y="376" width="320" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="392" cy="412" r="19" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M392 400v24M380 412h24" stroke="#111827" stroke-width="2"/><text x="431" y="407" class="st">ROUTE AUTHORIZATION</text><text x="431" y="430" class="sm">explicit permissions · safe defaults</text>
    <rect x="347" y="467" width="320" height="72" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M371 520h43v-29h-43z" fill="#b9e4ae" stroke="#111827" stroke-width="2"/><path d="M379 512v-10M391 512v-18M403 512v-7" stroke="#111827" stroke-width="3"/><text x="431" y="498" class="st">AUDIT EVENTS</text><text x="431" y="521" class="sm">redacted · durable · exportable</text>
    <rect x="347" y="558" width="320" height="47" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><text x="507" y="587" text-anchor="middle" class="st">CREDENTIAL + INPUT SAFETY</text></g><path d="M697 411h47" class="line"/>

  <!-- Management/control plane -->
  <g class="s" filter="url(#shadow)"><rect x="746" y="190" width="420" height="442" rx="17" fill="url(#violet)" class="card"/><text x="956" y="229" text-anchor="middle" class="pt">PRODUCTION MANAGEMENT</text><text x="956" y="253" text-anchor="middle" class="sm">Operate versioned state safely across replicas</text>
    <rect x="779" y="285" width="354" height="84" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><rect x="804" y="307" width="43" height="42" rx="6" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><path d="M814 320h23M814 331h23M814 342h15" stroke="#111827" stroke-width="2"/><text x="868" y="318" class="st">VERSIONED SNAPSHOT</text><text x="868" y="343" class="sm">model pool · recipe · Router config</text>
    <path d="M956 369v34" class="line"/><rect x="779" y="405" width="166" height="92" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M807 465v-37h27v37M842 465v-25h27v25M877 465v-47h27v47" fill="#bfdbfe" stroke="#111827" stroke-width="1.7"/><text x="862" y="486" text-anchor="middle" class="sm">gray release</text><rect x="967" y="405" width="166" height="92" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1012 446a24 24 0 1041-17" fill="none" stroke="#388e3c" stroke-width="3" marker-end="url(#arrow)"/><text x="1050" y="486" text-anchor="middle" class="sm">rollback</text>
    <rect x="779" y="522" width="354" height="83" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M805 580v-35h70v35M821 580v-21M839 580v-12M857 580v-29" fill="none" stroke="#6d5bd0" stroke-width="3"/><text x="895" y="553" class="st">HEALTH + CONSISTENCY</text><text x="895" y="578" font-size="13" fill="#475467">monitor · diagnose · recover · reconcile</text></g><path d="M1166 411h47" class="line"/>

  <!-- Environments -->
  <g class="s" filter="url(#shadow)"><rect x="1215" y="190" width="413" height="442" rx="17" fill="url(#green)" class="card"/><text x="1421.5" y="229" text-anchor="middle" class="pt">SUPPORTED ENVIRONMENTS</text><text x="1421.5" y="253" text-anchor="middle" class="sm">A tested support matrix—not an unbounded promise</text>
    <rect x="1247" y="285" width="349" height="88" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1272 309h62v43h-62z" fill="#bfdbfe" stroke="#111827" stroke-width="2"/><path d="M1282 322h42M1282 336h26" stroke="#111827" stroke-width="2"/><text x="1355" y="319" class="st">PACKAGING</text><text x="1355" y="344" class="sm">Docker · images · precision</text>
    <rect x="1247" y="392" width="349" height="88" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><path d="M1270 456l31-51 31 51z" fill="#ddd6fe" stroke="#111827" stroke-width="2"/><circle cx="1301" cy="440" r="7" fill="#fff" stroke="#111827"/><text x="1355" y="426" class="st">ORCHESTRATION</text><text x="1355" y="451" class="sm">Docker · Kubernetes · replicas</text>
    <rect x="1247" y="499" width="349" height="88" rx="11" fill="#fff" stroke="#111827" stroke-width="2"/><rect x="1271" y="522" width="62" height="42" rx="6" fill="#fde68a" stroke="#111827" stroke-width="2"/><path d="M1282 532h11v11h-11zM1300 532h11v11h-11zM1318 532h7v11h-7zM1282 550h43" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="1355" y="533" class="st">HARDWARE</text><text x="1355" y="558" class="sm">CPU · AMD · NVIDIA</text><text x="1421.5" y="613" text-anchor="middle" class="sm">Qualified versions · maintained configurations</text></g>

  <!-- Operating outcomes -->
  <g class="s"><text x="836" y="686" text-anchor="middle" class="pt">PRODUCTION OUTCOMES</text><text x="836" y="711" text-anchor="middle" class="sm">Reusable open-source capabilities for stable, scalable, observable operation</text>
    <rect x="160" y="752" width="300" height="94" rx="12" fill="url(#blue)" stroke="#111827" stroke-width="2"/><text x="310" y="789" text-anchor="middle" class="st">SECURE MANAGEMENT</text><text x="310" y="816" text-anchor="middle" class="sm">identity, authorization, and audit</text>
    <rect x="496" y="752" width="300" height="94" rx="12" fill="url(#green)" stroke="#111827" stroke-width="2"/><text x="646" y="789" text-anchor="middle" class="st">SAFE LIFECYCLE</text><text x="646" y="816" text-anchor="middle" class="sm">activate, drain, promote, and reverse</text>
    <rect x="832" y="752" width="300" height="94" rx="12" fill="url(#amber)" stroke="#111827" stroke-width="2"/><text x="982" y="789" text-anchor="middle" class="st">OPERABILITY</text><text x="982" y="816" text-anchor="middle" class="sm">monitor, diagnose, audit, and recover</text>
    <rect x="1168" y="752" width="344" height="94" rx="12" fill="url(#violet)" stroke="#111827" stroke-width="2"/><text x="1340" y="789" text-anchor="middle" class="st">QUALIFIED PORTABILITY</text><text x="1340" y="816" text-anchor="middle" class="sm">supported deployments and hardware paths</text></g>
  <g class="s"><rect x="40" y="900" width="1592" height="1" fill="#e4e7ec"/><text x="48" y="925" class="tiny">OWNS</text><text x="100" y="925" class="sm">management security · lifecycle controls · capacity planning · observability · supported environments</text><text x="1624" y="925" text-anchor="end" class="sm">Developer Experience supplies the Dashboard and CLI over these contracts</text></g>
</svg>
