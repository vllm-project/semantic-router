<text x="250" y="190.35" font-size="22" text-anchor="middle" class="">→ head → softmax</text>
</g>
<g data-box="75.0 260 350 80">
<rect x="75.0" y="260" width="350" height="80" rx="7" fill="#DEDCEE" stroke="#111" stroke-width="2.2"/>
