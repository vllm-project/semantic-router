<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1560" viewBox="0 0 1640 1560" role="img"><title>vela3-fast-vision: model architecture</title><desc>Three UltraVBERT backbone files on the vision side, each with its own task head, plus the frozen text encoder with the text adapters. Each question runs on one network. Read bottom to top.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 L3 5 Z" fill="#111"/></marker></defs>
        <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<text x="250" y="58.0" font-size="25" text-anchor="middle" class="">Image + text decisions</text>
<text x="250" y="88.0" font-size="22" text-anchor="middle" class="">Choice · Noul</text>
<g data-box="75.0 130 350 80">
<rect x="75.0" y="130" width="350" height="80" rx="7" fill="#D8EBD8" stroke="#111" stroke-width="2.2"/>
