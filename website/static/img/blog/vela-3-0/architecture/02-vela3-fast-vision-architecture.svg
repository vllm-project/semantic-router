<text x="330" y="1265.74" font-size="22" text-anchor="middle" class="">+ one global view</text>
<path d="M330,1218 L330,1186" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="950" y="1240.0" font-size="22" text-anchor="middle" class="">state up to</text>
<text x="950" y="1265.74" font-size="22" text-anchor="middle" class="">1,024 tokens (decisions)</text>
<path d="M950,1218 L950,931" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
