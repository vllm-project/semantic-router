<path d="M1430,529 L1430,461" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1430,769 L1430,681" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1430" y="960.0" font-size="22" text-anchor="middle" class="">Non-router text</text>
<text x="1430" y="985.74" font-size="22" text-anchor="middle" class="">decisions go to the</text>
<text x="1430" y="1011.48" font-size="22" text-anchor="middle" class="">decision-trained</text>
<text x="1430" y="1037.22" font-size="22" text-anchor="middle" class="">backbone (left)</text>
<text x="820" y="1300.0" font-size="25" text-anchor="middle" class="">Request: state, questions, optional images (decisions up to 3; spans and boxes 1)</text>
<path d="M1300,1300 L1430,1300 L1430,1211" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="820" y="1400.0" font-size="31" text-anchor="middle" class="serif">vela3-fast-vision (0.3B)</text>
<text x="820" y="1440.0" font-size="21" text-anchor="middle" class="">Each question is answered by one network: decision, box or span backbone, or the text side.</text>
<text x="820" y="1472.0" font-size="21" text-anchor="middle" class="">The decision head has no LoRA: the whole decision-trained backbone is its network.</text>
</svg>
