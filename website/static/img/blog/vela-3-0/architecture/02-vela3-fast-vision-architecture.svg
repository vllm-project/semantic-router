<text x="1430" y="414.61" font-size="22" text-anchor="middle" class="">vela3-fast runtime</text>
<text x="1430" y="440.35" font-size="22" text-anchor="middle" class="">heads per adapter</text>
</g>
<g data-box="1285.0 530 290 150">
<rect x="1285.0" y="530" width="290" height="150" rx="7" fill="#DED2EC" stroke="#111" stroke-width="2.2"/>
<text x="1430" y="575.285" font-size="21" text-anchor="middle" class="">Text adapters</text>
<text x="1430" y="599.855" font-size="21" text-anchor="middle" class="">router (r64) · span (r64)</text>
<text x="1430" y="624.425" font-size="21" text-anchor="middle" class="">NER (r128) · domain</text>
<text x="1430" y="648.995" font-size="21" text-anchor="middle" class="">· feedback</text>
</g>
<g data-box="1285.0 770 290 110">
<rect x="1285.0" y="770" width="290" height="110" rx="7" fill="#FCE1B8" stroke="#111" stroke-width="2.2"/>
<text x="1430" y="807.5699999999999" font-size="21" text-anchor="middle" class="">Original UltraVBERT</text>
<text x="1430" y="832.14" font-size="21" text-anchor="middle" class="">text encoder</text>
<text x="1430" y="856.7099999999999" font-size="21" text-anchor="middle" class="">UltraBERT-150M, frozen</text>
</g>
<path d="M1430,229 L1430,178" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
