<text x="250" y="424.61" font-size="22" text-anchor="middle" class="">Decision-trained backbone</text>
<text x="250" y="450.35" font-size="22" text-anchor="middle" class="">backbone_h2 · head only</text>
</g>
<path d="M250,129 L250,100" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
