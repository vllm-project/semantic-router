<text x="1030" y="450.35" font-size="22" text-anchor="middle" class="">model + LoRA r64</text>
</g>
<path d="M1030,129 L1030,100" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1030,259 L1030,211" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1030,389 L1030,341" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60" y="520" width="1160" height="690" rx="23" fill="#F4F4F4" stroke="#111" stroke-width="2.2"/>
<text x="640.0" y="556.0" font-size="25" text-anchor="middle" class="serif">UltraVBERT topology of each backbone file (weights differ per file)</text>
<g data-box="240.0 590 800 120">
<rect x="240.0" y="590" width="800" height="120" rx="7" fill="#FCE1B8" stroke="#111" stroke-width="2.2"/>
<text x="640" y="631.74" font-size="22" text-anchor="middle" class="">UltraBERT-150M text encoder, bidirectional</text>
<text x="640" y="657.48" font-size="22" text-anchor="middle" class="">24 layers · hidden 768 · SwiGLU 768 → 1,024 → 768</text>
<text x="640" y="683.22" font-size="22" text-anchor="middle" class="">6 heads × 128 · local |i − j| ≤ 128 · every third layer global</text>
</g>
<g data-box="140.0 850 380 80">
<rect x="140.0" y="850" width="380" height="80" rx="7" fill="#E6ECE8" stroke="#111" stroke-width="2.2"/>
<text x="330" y="884.61" font-size="22" text-anchor="middle" class="">Image tokens</text>
<text x="330" y="910.35" font-size="22" text-anchor="middle" class="">320 per image at 1024 px</text>
</g>
<g data-box="760.0 850 380 80">
<rect x="760.0" y="850" width="380" height="80" rx="7" fill="#F7DCDF" stroke="#111" stroke-width="2.2"/>
<text x="950" y="884.61" font-size="22" text-anchor="middle" class="">Text tokens</text>
<text x="950" y="910.35" font-size="22" text-anchor="middle" class="">question, options, state</text>
</g>
<path d="M330,849 L330,760 L560,760 L560,711" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M950,849 L950,760 L720,760 L720,711" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-box="140.0 980 380 80">
