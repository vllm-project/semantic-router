<text x="640" y="424.61" font-size="22" text-anchor="middle" class="">Decision-trained backbone</text>
<text x="640" y="450.35" font-size="22" text-anchor="middle" class="">backbone_v2 + LoRA r64</text>
</g>
<path d="M640,129 L640,100" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M640,259 L640,211" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
