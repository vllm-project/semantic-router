<text x="330" y="1014.61" font-size="22" text-anchor="middle" class="">Pixel shuffle ×4</text>
<text x="330" y="1040.35" font-size="22" text-anchor="middle" class="">+ connector (LayerNorm)</text>
</g>
<g data-box="140.0 1105 380 80">
<rect x="140.0" y="1105" width="380" height="80" rx="7" fill="#C7E5F0" stroke="#111" stroke-width="2.2"/>
<text x="330" y="1139.6100000000001" font-size="22" text-anchor="middle" class="">SigLIP2-B/16 vision encoder</text>
<text x="330" y="1165.3500000000001" font-size="22" text-anchor="middle" class="">12 layers · hidden 768 · 12 heads</text>
</g>
<path d="M330,979 L330,931" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
