</g>
<g data-box="855.0 260 350 80">
<rect x="855.0" y="260" width="350" height="80" rx="7" fill="#DEDCEE" stroke="#111" stroke-width="2.2"/>
<text x="1030" y="294.61" font-size="22" text-anchor="middle" class="">Head: Linear · GELU</text>
<text x="1030" y="320.35" font-size="22" text-anchor="middle" class="">· LayerNorm · Linear → 1</text>
</g>
