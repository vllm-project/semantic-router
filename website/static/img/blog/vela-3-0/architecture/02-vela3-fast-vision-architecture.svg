<text x="640" y="164.60999999999999" font-size="22" text-anchor="middle" class="">One logit per image token</text>
<text x="640" y="190.35" font-size="22" text-anchor="middle" class="">64 × 64 px cells</text>
</g>
<g data-box="465.0 260 350 80">
<rect x="465.0" y="260" width="350" height="80" rx="7" fill="#DEDCEE" stroke="#111" stroke-width="2.2"/>
