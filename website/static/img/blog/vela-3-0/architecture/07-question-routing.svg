<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1170" viewBox="0 0 1640 1170" role="img"><title>Vela 3.0: one request, every question</title><desc>How system_one sends each question to a network, in vela3-fast (left) and the d3 sizes (right). Read top to bottom.</desc>
