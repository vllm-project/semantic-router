<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1700" viewBox="0 0 1560 1700" role="img"><title>vela3-fast: model architecture</title><desc>UltraBERT-380M bidirectional encoder. Frozen decision backbone with its decision readout; one routed adapter per non-decision question. Read bottom to top.</desc>
