<text x="1320" y="1139.855" font-size="21" text-anchor="middle" class="">Every other weight: the frozen</text>
<text x="1320" y="1164.425" font-size="21" text-anchor="middle" class="">backbone&#x27;s, shared by reference</text>
</g>
<path d="M1100,920 L840,920" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="1320" y="1222.0" font-size="22" text-anchor="middle" class="">Rank 64 (α 128); NER and</text>
<text x="1320" y="1247.74" font-size="22" text-anchor="middle" class="">relation adapters rank 128 (α 256)</text>
<text x="600" y="1580.0" font-size="31" text-anchor="middle" class="serif">vela3-fast (0.4B)</text>
<text x="600" y="1620.0" font-size="21" text-anchor="middle" class="">Decisions run on the frozen backbone with no adapter; every other question runs one routed adapter pass.</text>
<text x="600" y="1652.0" font-size="21" text-anchor="middle" class="">Bidirectional SDPA encoder. Decisions run under bf16 autocast on GPU; adapter passes run in fp32, as evaluated.</text>
