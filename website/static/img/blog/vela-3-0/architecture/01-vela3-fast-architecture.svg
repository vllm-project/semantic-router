<path d="M600,1289 L600,1157" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="795" y="1318.0" font-size="21" text-anchor="start" class="">49,152 UltraBERT tokens</text>
<text x="795" y="1342.57" font-size="21" text-anchor="start" class="">+ 8 markers: [Q] [O] [ABS] [E]</text>
<text x="795" y="1367.14" font-size="21" text-anchor="start" class="">[SEP_SCHEMA] [SEG_user / context / answer]</text>
<text x="600" y="1470.0" font-size="25" text-anchor="middle" class="">Question schema + typed state · one input of up to 32,768 tokens</text>
<path d="M600,1445 L600,1366" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
