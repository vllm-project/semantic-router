<text x="130" y="785.74" font-size="22" text-anchor="middle" class="">3, 6, 9, …, 24</text>
<text x="130" y="811.48" font-size="22" text-anchor="middle" class="">RoPE θ = 2,560,000</text>
<text x="130" y="880.0" font-size="22" text-anchor="middle" class="">Other layers</text>
<text x="130" y="905.74" font-size="22" text-anchor="middle" class="">|i − j| ≤ 128</text>
<text x="130" y="931.48" font-size="22" text-anchor="middle" class="">RoPE θ = 10,000</text>
<text x="130" y="1010.0" font-size="22" text-anchor="middle" class="">8 heads × 128</text>
<text x="130" y="1035.74" font-size="22" text-anchor="middle" class="">no bias</text>
