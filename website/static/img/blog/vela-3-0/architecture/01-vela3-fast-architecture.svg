<text x="1320" y="907.48" font-size="22" text-anchor="middle" class="">spans 20–23 · router 16–23</text>
<text x="1320" y="933.22" font-size="22" text-anchor="middle" class="">domain 12–23</text>
</g>
<g data-box="1125.0 990 390 80">
