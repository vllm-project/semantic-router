<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330" role="img"><title>Vela 2.0 decoder CandidateHead</title><desc>Vela 2.0 decoder-family CandidateHead. Each option endpoint and the question-block endpoint use separate LayerNorms. A scaled bilinear score and an additive GELU MLP score are summed. The same learned head serves Choice, Noul, Score and Set; Set adds one scalar bias before temperature scaling and sigmoid. Noul is a two-option Choice; Score returns the expectation of its ordered distribution. H is 1024, 2560 or 4096 for the 0.8B, 4B and 9B checkpoints; d is 256. These are independent checkpoints with the same topology, not shared weights.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 L3 5 Z" fill="#111"/></marker></defs>
