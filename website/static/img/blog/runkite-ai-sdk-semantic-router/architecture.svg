    <path d="M33 1061H60" stroke="#b66f0e" stroke-width="3"/>
    <text x="71" y="1067" font-size="16" fill="#526479">Managed execution + tools</text>
    <path d="M371 1061H398" stroke="#087ba9" stroke-width="3"/>
    <text x="409" y="1067" font-size="16" fill="#526479">Inference</text>
  </g>
</svg>
