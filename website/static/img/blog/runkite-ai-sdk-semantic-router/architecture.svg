    <text x="248" y="642" text-anchor="middle" font-size="16" fill="#086d94">Chat Completions</text>
    <rect x="32" y="694" width="440" height="130" rx="12" fill="#eaf6fc" stroke="#76bad7" stroke-width="1.5"/>
    <text x="52" y="731" font-size="22" font-weight="700">Envoy + Semantic Router</text>
    <text x="52" y="761" font-size="18" fill="#28617d">One inference endpoint</text>
    <path d="M52 781H452" stroke="#bedce9"/>
    <text x="52" y="806" font-size="17" fill="#28617d">Request signal → configured route</text>

    <rect x="504" y="694" width="224" height="130" rx="12" fill="#ffffff" stroke="#d5c4a5" stroke-width="1.5"/>
    <text x="524" y="732" font-size="19" font-weight="650">Fictional incident</text>
    <text x="524" y="759" font-size="19" font-weight="650">MCP service</text>
    <text x="524" y="800" font-size="16" fill="#845009">Connector destination</text>

    <path d="M248 824V889" fill="none" stroke="#087ba9" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <rect x="164" y="842" width="168" height="27" rx="6" fill="#f7f9fc"/>
    <text x="248" y="862" text-anchor="middle" font-size="16" fill="#086d94">Selected backend</text>
    <rect x="32" y="894" width="440" height="114" rx="12" fill="#ffffff" stroke="#b9d7e4" stroke-width="1.5"/>
    <text x="52" y="929" font-size="21" font-weight="700">Ollama</text>
    <text x="145" y="929" font-size="17" fill="#526479">local model serving</text>
    <rect x="52" y="947" width="183" height="38" rx="7" fill="#eaf6fc"/>
    <text x="143.5" y="972" text-anchor="middle" font-size="18" fill="#155f7f" font-weight="600">Qwen3:0.6b</text>
    <rect x="247" y="947" width="203" height="38" rx="7" fill="#eaf6fc"/>
    <text x="348.5" y="972" text-anchor="middle" font-size="18" fill="#155f7f" font-weight="600">Qwen3:1.7b</text>
