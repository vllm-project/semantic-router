<text x="1430" y="1265.91" font-size="23" text-anchor="middle" class="">Family · engine · accelerator · profile</text>
<text x="905" y="1347.0" font-size="22" text-anchor="middle" class="">DP replicates the model. Placing each replica on its own GPU is supported; TP / PP are follow-up work.</text>
<text x="905" y="1380.0" font-size="20" text-anchor="middle" class="">HTTP in-flight counters are not GPU-forward concurrency. Some active forwards continue after caller cancellation.</text>
