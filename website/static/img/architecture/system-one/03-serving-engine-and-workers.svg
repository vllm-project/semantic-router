<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1410" viewBox="0 0 1810 1410" role="img"><title>Serving Engine: replica pools and modular workers</title><desc>Deployment-level dispatch, worker ownership and pluggable inference internals.</desc>
