<rect width="100%" height="100%" fill="#fff"/>
        <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:400}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<text x="50" y="48.0" font-size="30" text-anchor="start" class="serif">(c) Scale deployments; compose inference inside each worker</text>
<text x="50" y="82.0" font-size="21" text-anchor="start" class="">Current implementation · replica selection is separate from choosing a model</text>
<rect x="65" y="135" width="970" height="1030" rx="12" fill="#FFFFFF" stroke="#111" stroke-width="2.2"/>
