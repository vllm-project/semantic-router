<text x="335.0" y="866.48" font-size="22" text-anchor="middle" class="">same model + revision + profile</text>
<text x="335.0" y="892.22" font-size="22" text-anchor="middle" class="">bounded admission</text>
</g>
<g data-box="575.0 795 390 128">
