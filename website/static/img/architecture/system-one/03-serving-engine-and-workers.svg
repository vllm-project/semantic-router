<text x="785.0" y="663.73" font-size="23" text-anchor="middle" class="">operated independently</text>
</g>
<path d="M335,795 L335,698" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
