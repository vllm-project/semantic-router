<text x="550.0" y="428.24" font-size="24" text-anchor="middle" class="">tie: least recently assigned ready worker</text>
</g>
<text x="550" y="244.0" font-size="23" text-anchor="middle" class="">Pool policy · applies independently to each deployment</text>
<text x="550" y="506.0" font-size="21" text-anchor="middle" class="">32 HTTP requests in flight per worker; no pool waiting queue.</text>
<text x="550" y="1137.0" font-size="21" text-anchor="middle" class="">Generation leases preserve in-flight work during replacement.</text>
