---
queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - check-success = PR Gate
    merge_conditions:
      - base = main
      - check-success = PR Gate
    # merge-batch merges the queue's own batch PR - built on the latest
    # main, so GitHub's "require branches to be up to date" protection is
    # satisfied without disabling it (#5674). Requires mergify[bot] in the
    # branch-protection bypass list ("bypass the required pull requests").
    merge_method: merge-batch
    update_method: merge
    # A batch of several pull requests shares one qualification run on the
    # latest base and merges through the batch PR; squash merges of the
    # original branches would be refused while they are behind (#5674).
    batch_size: 5
    # Above 0, Mergify checks each pull request on a draft pull request
    # instead of merging main into its branch. tools/ci/manual_ci.py runs
    # those drafts without a new /ci run (#5581).
    max_checks_retries: 1

merge_queue:
  max_parallel_checks: 1
  queued_label: null
  dequeued_label: null

pull_request_rules:
  - name: queue approved pull requests
    conditions:
      - base = main
      - "#approved-reviews-by >= 2"
    actions:
      queue:
