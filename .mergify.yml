---
queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - check-success = PR Gate
    merge_conditions:
      - base = main
      - check-success = PR Gate
    merge_method: squash
    update_method: merge
    batch_size: 1

merge_queue:
  max_parallel_checks: 1
  queued_label: null
  dequeued_label: null

pull_request_rules:
  - name: queue approved pull requests
    conditions:
      - base = main
      - "#approved-reviews-by >= 2"
    actions:
      queue:
