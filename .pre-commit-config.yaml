# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Basic hooks for Go, Rust, Python And JavaScript files only
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.2.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        files: \.(go|rs|py|js)$

  # Go specific hooks
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py go
        language: system
        files: \.go$

  - repo: local
    hooks:
      - id: model-catalog-generated
        name: model catalog schema and generated projections
        entry: make model-catalog-check
        language: system
        pass_filenames: false
        files: ^(config/catalog/|config/recipes/built-in/latest/catalog\.yaml$|src/semantic-router/pkg/catalog/zz_generated_catalog\.go$|src/vllm-sr/cli/model_assets/latest/catalog\.yaml$|dashboard/frontend/src/generated/modelCatalog\.json$|website/static/model-catalog/catalog\.json$|tools/catalog/|tools/make/model-catalog\.mk$)

  - repo: local
    hooks:
      - id: deployment-support-matrix
        name: deployment support matrix coverage
        entry: python3 tools/ci/check_deployment_support_matrix.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml$|deploy/|config/runtime/|website/docs/installation/support-matrix\.md$|tools/ci/check_deployment_support_matrix\.py$|tools/ci/tests/test_deployment_support_matrix\.py$)

      - id: backend-target-compatibility
        name: backend target compatibility coverage
        entry: .venv-agent/bin/python tools/ci/check_backend_target_compatibility.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml$|config/config\.yaml$|src/vllm-sr/tests/test_config_generator\.py$|src/semantic-router/pkg/config/maintained_asset_contract_test\.go$|deploy/helm/testdata/backend-target-values\.yaml$|deploy/helm/validate-chart\.sh$|tools/make/helm\.mk$|deploy/operator/controllers/semanticrouter_controller_test\.go$|dashboard/frontend/src/pages/configPageModelFormSupport\.test\.ts$|dashboard/backend/handlers/config_update_test\.go$|website/docs/installation/backend-target-compatibility\.md$|tools/ci/check_backend_target_compatibility\.py$|tools/ci/tests/test_backend_target_compatibility\.py$)

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py shell
        language: system
        files: \.sh$

  # Markdown specific hooks
  - repo: local
    hooks:
      - id: md-fmt
        name: md fmt
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py markdown
        language: system
        require_serial: true
        files: \.md$
        exclude: ^(node_modules/|website/node_modules/|dashboard/frontend/node_modules/|dashboard/wizmap/node_modules/|bench/|e2e/config/models/|models/|vsr/|website/docs/api/crd-reference\.md$|CLAUDE\.md$)

  # Yaml specific hooks
  - repo: local
    hooks:
      - id: yaml-and-yml-fmt
        name: yaml/yml fmt
        entry: .venv-agent/bin/yamllint --config-file=tools/linter/yaml/.yamllint
        language: system
        files: \.(yaml|yml)$
        exclude: ^(node_modules/)

  # JavaScript and TypeScript specific hooks
  - repo: local
    hooks:
      - id: js-ts-lint
        name: js/ts lint
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py javascript
        language: system
        files: \.(js|jsx|ts|tsx|mjs|cjs)$
        exclude: (^|/)node_modules/

  # Rust specific hooks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py rust
        language: system
        files: \.rs$

  - repo: local
    hooks:
      - id: black
        name: Python format check
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py python
        language: system
        files: \.py$
      - id: whitespace-check
        name: whitespace check
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py whitespace
        language: system
        files: \.(go|rs|py|js)$
      - id: codespell
        name: changed-file spelling check
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py codespell
        language: system
        types: [text]
      - id: architecture-check
        name: architecture dependency check
        entry: .venv-agent/bin/python tools/agent/scripts/architecture_check.py
        language: system
        pass_filenames: true
        require_serial: true
