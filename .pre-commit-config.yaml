# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Basic hooks for Go, Rust, Python And JavaScript files only
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.2.0
    hooks:
      - id: trailing-whitespace
        files: \.(go|rs|py|js)$
      - id: end-of-file-fixer
        files: \.(go|rs|py|js)$
        exclude: ^website/build/
      - id: check-added-large-files
        args: ["--maxkb=500"]
        files: \.(go|rs|py|js)$

  # Go specific hooks
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -w
        language: system
        files: \.go$

  - repo: local
    hooks:
      - id: deployment-support-matrix
        name: deployment support matrix coverage
        entry: python3 tools/ci/check_deployment_support_matrix.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml$|deploy/|config/runtime/|website/docs/installation/support-matrix\.md$|tools/ci/check_deployment_support_matrix\.py$|tools/ci/tests/test_deployment_support_matrix\.py$)

      - id: backend-target-compatibility
        name: backend target compatibility coverage
        entry: python3 tools/ci/check_backend_target_compatibility.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml$|config/config\.yaml$|src/vllm-sr/tests/test_config_generator\.py$|src/semantic-router/pkg/config/maintained_asset_contract_test\.go$|deploy/helm/testdata/backend-target-values\.yaml$|deploy/helm/validate-chart\.sh$|tools/make/helm\.mk$|deploy/operator/controllers/semanticrouter_controller_test\.go$|dashboard/frontend/src/pages/configPageModelFormSupport\.test\.ts$|dashboard/backend/handlers/config_update_test\.go$|website/docs/installation/backend-target-compatibility\.md$|tools/ci/check_backend_target_compatibility\.py$|tools/ci/tests/test_backend_target_compatibility\.py$)

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: make shellcheck
        language: system
        files: \.sh$

  - repo: local
    hooks:
      - id: golang-lint
        name: go lint
        entry: make go-lint
        language: system
        files: \.go$
        pass_filenames: false

  # Markdown specific hooks
  - repo: local
    hooks:
      - id: md-fmt
        name: md fmt
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py markdown
        language: system
        require_serial: true
        files: \.md$
        exclude: ^(node_modules/|website/node_modules/|dashboard/frontend/node_modules/|dashboard/wizmap/node_modules/|bench/|e2e/config/models/|models/|vsr/|website/docs/api/crd-reference\.md$|CLAUDE\.md$)

  # Yaml specific hooks
  - repo: local
    hooks:
      - id: yaml-and-yml-fmt
        name: yaml/yml fmt
        entry: .venv-agent/bin/yamllint --config-file=tools/linter/yaml/.yamllint
        language: system
        files: \.(yaml|yml)$
        exclude: ^(node_modules/)

  # JavaScript and TypeScript specific hooks
  - repo: local
    hooks:
      - id: js-ts-lint
        name: js/ts lint
        entry: .venv-agent/bin/python tools/agent/scripts/precommit_tool.py website
        language: system
        files: \.(js|ts|tsx)$
        exclude: ^(\node_modules/)
        pass_filenames: false

  # Rust specific hooks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd candle-binding && rustup component add rustfmt 2>/dev/null || true && cargo fmt'
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: bash -c 'cd candle-binding && cargo check --no-default-features'
        language: system
        files: \.rs$
        pass_filenames: false

  # Python specific hooks
  # Using only Black for Python formatting (simpler, no conflicts)
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        files: \.py$
        exclude: ^(\.venv/|venv/|env/|__pycache__/|\.git/|site-packages/)

  # Supply chain security scan (AST-based, tree-sitter)
  - repo: local
    hooks:
      - id: supply-chain-security-scan
        name: supply chain security scan (AST)
        entry: bash -c 'if [ ! -x ./.venv-agent/bin/python ]; then echo "run make precommit-install" >&2; exit 1; fi; exec ./.venv-agent/bin/python tools/security/ast_security_scanner.py scan . --fail-on HIGH'
        language: system
        pass_filenames: false
        files: \.(py|go|js|ts|tsx|rs)$

  # Repo-native changed-file lint gate
  - repo: local
    hooks:
      - id: agent-changed-files-lint
        name: agent changed-files lint
        entry: bash -c 'if [ ! -x ./.venv-agent/bin/python ]; then echo "run make precommit-install" >&2; exit 1; fi; exec ./.venv-agent/bin/python tools/agent/scripts/run_agent_precommit_lint.py "$@"' --
        language: system
        pass_filenames: true
        require_serial: true


