# Agent crew routing: one router, four arms.
# Each arm is selected by the model name the agents send; nothing restarts between arms:
#   "local" -> Ollama llama3.2:3b   "frontier" -> xAI Grok   "MoM" -> the router decides per call
# Keyword signals only, so the router downloads no classifier models.
# Needs XAI_API_KEY exported in the terminal that runs `vllm-sr serve`.

version: v0.3

listeners:
  - name: crew
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    model: local

  models:
    - name: local
      provider_model_id: llama3.2:3b
      pricing:
        currency: USD
        prompt_per_1m: 0.0
        completion_per_1m: 0.0
      backend_refs:
        - name: ollama
          endpoint: host.docker.internal:11434
          protocol: http
          weight: 100

    # Non-reasoning Grok: no hidden thinking tokens. Prices read 2026-09-11 from
    # docs.x.ai/developers/models; re-check before the measured runs.
    - name: frontier
      provider_model_id: grok-4.20-0309-non-reasoning
      pricing:
        currency: USD
        prompt_per_1m: 1.25
        cached_input_per_1m: 0.20
        completion_per_1m: 2.50
      backend_refs:
        # OpenAI-compatible, so it works on every image that has #3813.
        - name: xai
          base_url: https://api.x.ai/v1
          provider: openai
          api_key_env: XAI_API_KEY

    # Alternatives. Run demo/check_provider.py before switching.
    # - name: frontier
    #   provider_model_id: openai/gpt-oss-120b              # Groq free tier, $0.15 / $0.60
    #   backend_refs:
    #     - name: groq
    #       base_url: https://api.groq.com/openai/v1
    #       provider: openai
    #       api_key_env: GROQ_API_KEY
    # - name: frontier
    #   provider_model_id: gpt-4.1                          # OpenAI, $2.00 / $0.50 / $8.00
    #   backend_refs:
    #     - name: openai
    #       base_url: https://api.openai.com/v1
    #       provider: openai
    #       api_key_env: OPENAI_API_KEY

routing:
  modelCards:
    - name: local
      modality: text
    - name: frontier
      modality: text

  # Signals read the latest user message. Tool results never change a decision.
  signals:
    keywords:
      # What the call asks for. Only the reviewer's instruction says this.
      - name: defect_search
        operator: OR
        case_sensitive: false
        keywords:
          - find the defects
      # Code whose bugs are subtle: concurrency, processes, secrets.
      - name: subtle_code
        operator: OR
        case_sensitive: false
        keywords:
          - threading
          - asyncio
          - multiprocessing
          - concurrent
          - subprocess
          - pickle
          - password
          - secret_key

  decisions:
    - name: deep-review
      description: Searching concurrency or security code for defects earns the frontier model.
      priority: 200
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: defect_search
          - type: keyword
            name: subtle_code
      modelRefs:
        - model: frontier
          use_reasoning: false

    # Fall-through stays local, so a policy gap shows up as a missed defect, never as a bill.
    - name: default-local
      description: Everything else stays local.
      priority: 10
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: local
          use_reasoning: false

global:
  router:
    auto_model_name: MoM

  stores:
    response_cache:
      enabled: false        # a cache hit skips the model, so it has no cost to report

  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: ""
        qwen3_model_path: ""
        gemma_model_path: ""
        bert_model_path: ""
        multimodal_model_path: ""
    modules:
      prompt_guard:
        enabled: false
        model_ref: ""
        model_id: ""
        jailbreak_mapping_path: ""
      classifier:
        domain:
          model_ref: ""
          model_id: ""
          category_mapping_path: ""
          use_mmbert_32k: false
        pii:
          model_ref: ""
          model_id: ""
          pii_mapping_path: ""
          use_mmbert_32k: false
      feedback_detector:
        enabled: false
        model_ref: ""
        model_id: ""
        use_mmbert_32k: false
