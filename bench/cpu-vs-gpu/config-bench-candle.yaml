  modelCards:
  - name: Qwen/Qwen2.5-14B-Instruct
    capabilities:
    - ar
  - name: Qwen/Qwen-Image
    capabilities:
    - image_generation
    - diffusion
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: text_generation
        description: Text generation and general queries.
        mmlu_categories:
        - other
      modality:
      - name: AR
        description: Text-only response via autoregressive LLM.
      - name: DIFFUSION
        description: Image generation via diffusion model.
      - name: BOTH
        description: Hybrid response requiring both text and image.
    decisions:
    - name: image_generation
      description: Route image generation requests to the diffusion model.
      priority: 200
      rules:
        operator: AND
        conditions:
        - type: modality
          name: DIFFUSION
      plugins:
      - type: image_gen
        configuration:
          enabled: true
          backend: vllm_omni
          backend_config:
            base_url: http://localhost:8001
            model: Qwen/Qwen-Image
            num_inference_steps: 4
            cfg_scale: 0.0
          default_width: 1024
          default_height: 1024
          timeout_seconds: 120
    - name: text_and_image
      description: Route hybrid text+image requests to both models in parallel.
      priority: 190
      rules:
        operator: AND
        conditions:
        - type: modality
          name: BOTH
      plugins:
      - type: image_gen
        configuration:
          enabled: true
          backend: vllm_omni
          backend_config:
            base_url: http://localhost:8001
            model: Qwen/Qwen-Image
            num_inference_steps: 4
            cfg_scale: 0.0
          default_width: 1024
          default_height: 1024
          timeout_seconds: 120
    - name: text_generation
      description: Default text routing for AR requests.
      priority: 1
      rules:
        operator: OR
        conditions:
        - type: modality
          name: AR
        - type: domain
          name: text_generation
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    image_generation:
      models:
      - model: Qwen/Qwen-Image
        weight: '1'
    text_and_image:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct
        weight: '1'
      - model: Qwen/Qwen-Image
        weight: '1'
    text_generation:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct
        weight: '1'
global:
  stores:
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
    response_cache:
      enabled: false
      embedding_model: mmbert
  services:
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 3600
      max_responses: 100
    api:
      batch_classification:
        max_batch_size: 10
