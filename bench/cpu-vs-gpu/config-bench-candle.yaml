recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      keywords:
      - name: code_keywords
        operator: OR
        method: bm25
        keywords:
        - code
        - function
        - implement
        - debug
        - algorithm
        - compile
        - syntax
        - variable
        - loop
        - refactor
        bm25_threshold: 0.1
        case_sensitive: false
      - name: urgent_request
        operator: OR
        method: ngram
        keywords:
        - urgent
        - immediate
        - asap
        - emergency
        ngram_threshold: 0.4
        ngram_arity: 3
        case_sensitive: false
      - name: sensitive_data
        operator: AND
        keywords:
        - SSN
        - social security number
        - credit card
        case_sensitive: false
      - name: exclude_spam
        operator: NOR
        keywords:
        - buy now
        - free money
        case_sensitive: false
      - name: regex_pattern_match
        operator: OR
        keywords:
        - user\.name@domain\.com
        - C:\Program Files\\
        case_sensitive: false
      embeddings:
      - name: ai
        threshold: 0.75
        candidates:
        - artificial intelligence
        - machine learning
        - deep learning
        - neural networks
        - AI algorithms
        aggregation_method: max
        model: auto
      - name: data_science
        threshold: 0.7
        candidates:
        - data analysis
        - statistical modeling
        - predictive analytics
        - data visualization
        aggregation_method: mean
        model: auto
      - name: programming
        threshold: 0.72
        candidates:
        - write code
        - implement function
        - create class
        - code snippet
        - programming task
        aggregation_method: max
        model: auto
      domains:
      - name: urgent_request
        description: Urgent and time-sensitive requests
        mmlu_categories:
        - urgent_request
      - name: sensitive_data
        description: Requests involving sensitive personal data
        mmlu_categories:
        - sensitive_data
      - name: exclude_spam
        description: Potential spam or suspicious requests
        mmlu_categories:
        - exclude_spam
      - name: regex_pattern_match
        description: Structured data and pattern-based requests
        mmlu_categories:
        - regex_pattern_match
      - name: ai
        description: Artificial intelligence and machine learning topics
        mmlu_categories:
        - ai
        - machine_learning
      - name: data_science
        description: Data science and analytics
        mmlu_categories:
        - data_science
      - name: programming
        description: Programming and software development
        mmlu_categories:
        - programming
      - name: business
        description: Business and management related queries
        mmlu_categories:
        - business
      - name: law
        description: Legal questions and law-related topics
        mmlu_categories:
        - law
      - name: psychology
        description: Psychology and mental health topics
        mmlu_categories:
        - psychology
      - name: biology
        description: Biology and life sciences questions
        mmlu_categories:
        - biology
      - name: chemistry
        description: Chemistry and chemical sciences questions
        mmlu_categories:
        - chemistry
      - name: history
        description: Historical questions and cultural topics
        mmlu_categories:
        - history
      - name: other
        description: General knowledge and miscellaneous topics
        mmlu_categories:
        - other
      - name: health
        description: Health and medical information queries
        mmlu_categories:
        - health
      - name: economics
        description: Economics and financial topics
        mmlu_categories:
        - economics
      - name: math
        description: Mathematics and quantitative reasoning
        mmlu_categories:
        - math
      - name: physics
        description: Physics and physical sciences
        mmlu_categories:
        - physics
      - name: computer science
        description: Computer science and programming
        mmlu_categories:
        - computer science
      - name: philosophy
        description: Philosophy and ethical questions
        mmlu_categories:
        - philosophy
      - name: engineering
        description: Engineering and technical problem-solving
        mmlu_categories:
        - engineering
