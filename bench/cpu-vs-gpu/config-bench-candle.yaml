      description: Route hybrid text+image requests to both models in parallel.
      priority: 190
      rules:
        operator: AND
        conditions:
        - type: modality
          name: BOTH
      plugins:
      - type: image_gen
        configuration:
          enabled: true
          backend: vllm_omni
          backend_config:
            base_url: http://localhost:8001
            model: Qwen/Qwen-Image
            num_inference_steps: 4
            cfg_scale: 0.0
          default_width: 1024
          default_height: 1024
          timeout_seconds: 120
