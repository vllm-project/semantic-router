version: v0.3
listeners: []
providers:
  models:
  - name: llama3-8b
    provider_model_id: llama3-8b
    backend_refs:
    - provider: vllm
      endpoint: http://llama-8b:80/v1
    control:
      timeout:
        request: 300s
        stream: 300s
  - name: phi4-mini
    provider_model_id: phi4-mini
    backend_refs:
    - provider: vllm
      endpoint: http://phi4-mini:80/v1
    control:
      timeout:
        request: 300s
        stream: 300s
routing:
  modelCards:
  - name: llama3-8b
  - name: phi4-mini
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: business
        description: business routing domain.
      - name: law
        description: law routing domain.
      - name: psychology
        description: psychology routing domain.
      - name: biology
        description: biology routing domain.
      - name: chemistry
        description: chemistry routing domain.
      - name: history
        description: history routing domain.
      - name: other
        description: other routing domain.
      - name: health
        description: health routing domain.
      - name: economics
        description: economics routing domain.
      - name: math
        description: math routing domain.
      - name: physics
        description: physics routing domain.
      - name: computer science
        description: computer science routing domain.
      - name: philosophy
        description: philosophy routing domain.
      - name: engineering
        description: engineering routing domain.
    decisions:
    - name: business
      description: Route business and management queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: business
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a senior business consultant and strategic advisor
            with expertise in corporate strategy, operations management, financial
            analysis, marketing, and organizational development. Provide practical,
            actionable business advice backed by proven methodologies and industry
            best practices. Consider market dynamics, competitive landscape, and stakeholder
            interests in your recommendations.
          mode: replace
    - name: law
      description: Route legal queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: law
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a knowledgeable legal expert with comprehensive understanding
            of legal principles, case law, statutory interpretation, and legal procedures
            across multiple jurisdictions. Provide accurate legal information and
            analysis while clearly stating that your responses are for informational
            purposes only and do not constitute legal advice. Always recommend consulting
            with qualified legal professionals for specific legal matters.
          mode: replace
    - name: psychology
      description: Route psychology queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: psychology
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a psychology expert with deep knowledge of cognitive
            processes, behavioral patterns, mental health, developmental psychology,
            social psychology, and therapeutic approaches. Provide evidence-based
            insights grounded in psychological research and theory. When discussing
            mental health topics, emphasize the importance of professional consultation
            and avoid providing diagnostic or therapeutic advice.
          mode: replace
      - type: response_cache
        configuration:
          enabled: false
          similarity_threshold: 0.92
    - name: biology
      description: Route biology queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: biology
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a biology expert with comprehensive knowledge spanning
            molecular biology, genetics, cell biology, ecology, evolution, anatomy,
            physiology, and biotechnology. Explain biological concepts with scientific
            accuracy, use appropriate terminology, and provide examples from current
            research. Connect biological principles to real-world applications and
            emphasize the interconnectedness of biological systems.
          mode: replace
    - name: chemistry
      description: Route chemistry queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: chemistry
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a chemistry expert specializing in chemical reactions,
            molecular structures, and laboratory techniques. Provide detailed, step-by-step
            explanations.
          mode: replace
    - name: history
      description: Route history queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: history
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a historian with expertise across different time
            periods and cultures. Provide accurate historical context and analysis.
          mode: replace
    - name: other
      description: Route general queries
      priority: 5
      rules:
        operator: OR
        conditions:
        - type: domain
          name: other
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a helpful and knowledgeable assistant. Provide accurate,
            helpful responses across a wide range of topics.
          mode: replace
      - type: response_cache
        configuration:
          enabled: false
          similarity_threshold: 0.75
    - name: health
      description: Route health and medical queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: health
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a health and medical information expert with knowledge
            of anatomy, physiology, diseases, treatments, preventive care, nutrition,
            and wellness. Provide accurate, evidence-based health information while
            emphasizing that your responses are for educational purposes only and
            should never replace professional medical advice, diagnosis, or treatment.
            Always encourage users to consult healthcare professionals for medical
            concerns and emergencies.
          mode: replace
      - type: response_cache
        configuration:
          enabled: false
          similarity_threshold: 0.95
    - name: economics
      description: Route economics queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: economics
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are an economics expert with deep understanding of microeconomics,
            macroeconomics, econometrics, financial markets, monetary policy, fiscal
            policy, international trade, and economic theory. Analyze economic phenomena
            using established economic principles, provide data-driven insights, and
            explain complex economic concepts in accessible terms. Consider both theoretical
            frameworks and real-world applications in your responses.
          mode: replace
    - name: math
      description: Route mathematics queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: math
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a mathematics expert. Provide step-by-step solutions,
            show your work clearly, and explain mathematical concepts in an understandable
            way.
          mode: replace
    - name: physics
      description: Route physics queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: physics
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a physics expert with deep understanding of physical
            laws and phenomena. Provide clear explanations with mathematical derivations
            when appropriate.
          mode: replace
    - name: computer science
      description: Route computer science queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: computer science
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a computer science expert with knowledge of algorithms,
            data structures, programming languages, and software engineering. Provide
            clear, practical solutions with code examples when helpful.
          mode: replace
    - name: philosophy
      description: Route philosophy queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: philosophy
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are a philosophy expert with comprehensive knowledge
            of philosophical traditions, ethical theories, logic, metaphysics, epistemology,
            political philosophy, and the history of philosophical thought. Engage
            with complex philosophical questions by presenting multiple perspectives,
            analyzing arguments rigorously, and encouraging critical thinking. Draw
            connections between philosophical concepts and contemporary issues while
            maintaining intellectual honesty about the complexity and ongoing nature
            of philosophical debates.
          mode: replace
    - name: engineering
      description: Route engineering queries
      priority: 10
      rules:
        operator: OR
        conditions:
        - type: domain
          name: engineering
      plugins:
      - type: system_prompt
        configuration:
          enabled: false
          system_prompt: You are an engineering expert with knowledge across multiple
            engineering disciplines including mechanical, electrical, civil, chemical,
            software, and systems engineering. Apply engineering principles, design
            methodologies, and problem-solving approaches to provide practical solutions.
            Consider safety, efficiency, sustainability, and cost-effectiveness in
            your recommendations. Use technical precision while explaining concepts
            clearly, and emphasize the importance of proper engineering practices
            and standards.
          mode: replace
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    business:
      models:
      - model: llama3-8b
        weight: '1'
    law:
      models:
      - model: llama3-8b
        weight: '1'
    psychology:
      models:
      - model: llama3-8b
        weight: '1'
    biology:
      models:
      - model: llama3-8b
        weight: '1'
    chemistry:
      models:
      - model: llama3-8b
        weight: '1'
    history:
      models:
      - model: llama3-8b
        weight: '1'
    other:
      models:
      - model: llama3-8b
        weight: '1'
    health:
      models:
      - model: llama3-8b
        weight: '1'
    economics:
      models:
      - model: llama3-8b
        weight: '1'
    math:
      models:
      - model: phi4-mini
        weight: '1'
    physics:
      models:
      - model: llama3-8b
        weight: '1'
    computer science:
      models:
      - model: llama3-8b
        weight: '1'
    philosophy:
      models:
      - model: llama3-8b
        weight: '1'
    engineering:
      models:
      - model: llama3-8b
        weight: '1'
global:
  router:
    clear_route_cache: true
  services:
