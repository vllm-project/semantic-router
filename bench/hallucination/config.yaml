version: v0.3
listeners: []
providers:
  defaults:
    reasoning_families:
      Qwen/Qwen2.5-14B-Instruct-AWQ:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
  - name: Qwen/Qwen2.5-14B-Instruct-AWQ
    provider_model_id: Qwen/Qwen2.5-14B-Instruct-AWQ
    backend_refs:
    - provider: vllm
      endpoint: http://127.0.0.1:8083/v1
    control:
      timeout:
        request: 300s
        stream: 300s
    reasoning_family: Qwen/Qwen2.5-14B-Instruct-AWQ
routing:
  modelCards:
  - name: Qwen/Qwen2.5-14B-Instruct-AWQ
    capabilities:
    - chat
    - reasoning
    - ar
recipes:
- name: default
  description: Default routing recipe.
  routing:
    signals:
      domains:
      - name: general
        description: General questions.
        mmlu_categories:
        - other
      - name: math
        description: Mathematics and quantitative reasoning.
        mmlu_categories:
        - math
      - name: science
        description: Science questions.
        mmlu_categories:
        - physics
        - chemistry
        - biology
      fact_check:
      - name: needs_fact_check
        description: Query contains factual claims that should be verified against
          context.
      - name: no_fact_check_needed
        description: Query is creative, code-related, or opinion-based and does not
          need factual verification.
    decisions:
    - name: math_decision
      description: Mathematics and quantitative reasoning.
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: math
      plugins:
      - type: hallucination
        configuration:
          enabled: true
          use_nli: true
          hallucination_action: header
          unverified_factual_action: header
          include_hallucination_details: false
    - name: science_decision
      description: Science questions.
      priority: 100
      rules:
        operator: AND
        conditions:
        - type: domain
          name: science
      plugins:
      - type: hallucination
        configuration:
          enabled: true
          use_nli: true
          hallucination_action: header
          unverified_factual_action: header
          include_hallucination_details: false
    - name: general_decision
      description: General questions.
      priority: 50
      rules:
        operator: AND
        conditions:
        - type: domain
          name: general
      plugins:
      - type: hallucination
        configuration:
          enabled: true
          use_nli: true
          hallucination_action: header
          unverified_factual_action: header
          include_hallucination_details: false
entrypoints:
- model_names:
  - vllm-sr/auto
  - auto
  recipe: default
  assignments:
    math_decision:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct-AWQ
        weight: '1'
        reasoning:
          enabled: true
    science_decision:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct-AWQ
        weight: '1'
        reasoning:
          enabled: true
    general_decision:
      models:
      - model: Qwen/Qwen2.5-14B-Instruct-AWQ
        weight: '1'
global:
  router: {}
  services:
    api:
      batch_classification:
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores:
    memory:
      embedding_model: mmbert
    vector_store:
      embedding_model: mmbert
    response_cache:
      enabled: false
      embedding_model: mmbert
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
