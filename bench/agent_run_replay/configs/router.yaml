version: v0.3

# Router for replay.py run, in standalone mode without Envoy or models.
# Inference on 18899, management API on 18080, the recorded backend on 18771.
# Both models are served by the recorded backend, so only routing differs.
# The probe decision prefers strong once a request reaches 2K tokens, so the
# decision changes inside a run as the history grows. Set
# global.router.learning.protection.scope to session to compare scopes.

listeners:
  - name: http-18899
    address: 127.0.0.1
    port: 18899
    timeout: 300s
    # Standalone mode ignores client identity headers unless the listener
    # trusts the peer, and the replay runs on loopback.
    identity:
      trust_headers: true
      trusted_peers: ["127.0.0.0/8"]

providers:
  defaults:
    model: cheap
  models:
    - name: cheap
      provider_model_id: cheap
      api_format: openai
      pricing: {currency: USD, prompt_per_1m: 0.25, completion_per_1m: 2.0}
      backend_refs:
        - name: recorded-cheap
          endpoint: 127.0.0.1:18771
          protocol: http
          provider: vllm
    - name: strong
      provider_model_id: strong
      api_format: openai
      pricing: {currency: USD, prompt_per_1m: 1.25, completion_per_1m: 10.0}
      backend_refs:
        - name: recorded-strong
          endpoint: 127.0.0.1:18771
          protocol: http
          provider: vllm

routing:
  modelCards:
    - name: cheap
    - name: strong
  signals:
    context:
      - name: context_2k
        min_tokens: 2K
  decisions:
    - name: long_context_to_strong
      description: Probe decision. A request of 2K tokens or more prefers strong.
      priority: 200
      rules:
        operator: AND
        conditions:
          - type: context
            name: context_2k
      modelRefs: [{model: strong}, {model: cheap}]
      algorithm: {type: static}
    - name: default_cheap
      description: Every other request prefers cheap.
      priority: 100
      rules: {}
      modelRefs: [{model: cheap}, {model: strong}]
      algorithm: {type: static}

entrypoints:
  - model_names: ["vllm-sr/auto"]
    recipe: default

global:
  router:
    learning:
      enabled: true
      adaptation:
        enabled: false
      protection:
        enabled: true
        scope: conversation
        identity:
          headers:
            session: x-session-id
            conversation: x-conversation-id
        tuning:
          idle_timeout_seconds: 300
          min_turns_before_switch: 1
          switch_margin: 0.05
          stability_weight: 1.0
      state_store:
        backend: local
  stores:
    response_cache:
      enabled: false
  services:
    observability:
      tracing:
        enabled: false
    management_api:
      bind_address: 127.0.0.1
      port: 18080
      auth:
        mode: disabled
    router_replay:
      enabled: true
      store_backend: memory
      async_writes: false
      capture_personal_data: false
      capture_request_body: false
      capture_response_body: false
      max_records: 100000
