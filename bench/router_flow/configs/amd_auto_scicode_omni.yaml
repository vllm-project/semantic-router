version: v0.4
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 1200s
models:
- name: opus-worker
  card:
    capabilities:
    - chat
    - code
    - reasoning
    - long-context
    - text
    reasoning:
      type: reasoning_effort
      efforts:
      - medium
  connections:
  - provider: openrouter
    model: anthropic/claude-opus-4.8
    credential: openrouter_api_key
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
  pricing:
    input_cost_per_million_tokens: '5'
    output_cost_per_million_tokens: '25'
    cache_read_cost_per_million_tokens: '0'
    cache_write_cost_per_million_tokens: '5'
- name: gemini-worker
  card:
    capabilities:
    - chat
    - code
    - reasoning
    - long-context
    - text
    reasoning:
      type: reasoning_effort
      efforts:
      - medium
  connections:
  - provider: openrouter
    model: google/gemini-3.1-pro-preview
    credential: openrouter_api_key
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
  pricing:
    input_cost_per_million_tokens: '2'
    output_cost_per_million_tokens: '12'
    cache_read_cost_per_million_tokens: '0'
    cache_write_cost_per_million_tokens: '2'
- name: gpt-worker
  card:
    capabilities:
    - chat
    - code
    - reasoning
    - long-context
    - text
    reasoning:
      type: reasoning_effort
      efforts:
      - medium
  connections:
  - provider: openrouter
    model: openai/gpt-5.5
    credential: openrouter_api_key
  runtime:
    request_timeout: 300s
    stream_timeout: 300s
  pricing:
    input_cost_per_million_tokens: '5'
    output_cost_per_million_tokens: '30'
    cache_read_cost_per_million_tokens: '0'
    cache_write_cost_per_million_tokens: '5'
recipes:
- name: default
  description: Default routing recipe.
  document:
    signals:
      keywords:
      - name: scicode_any
        operator: OR
        keywords:
        - 'PROBLEM DESCRIPTION:'
        - 'SUBPROBLEM DESCRIPTION:'
        - 'FUNCTION HEADER:'
        - 'RETURN LINE:'
        - 'SCIENTIFIC BACKGROUND:'
        - scientific problem
        - subproblem
        - required_dependencies
        - The response must be formatted as ```python```
        - function header
        - return line
        - scientific background
      - name: scicode_function_contract
        operator: OR
        keywords:
        - 'FUNCTION HEADER:'
        - 'RETURN LINE:'
        - You MUST NOT import
        - must use in your solution implementation
        - must only use the following dependencies
        - Do not import
        - function header
        - return line
        - must not include code to import
        - must not import
        - dependencies
        - function implementation
      - name: scicode_multistep_dependency
        operator: OR
        keywords:
        - previous subproblems
        - functions that you generated previously
        - solutions to previous subproblems
        - may be implemented using your solutions to earlier subproblems
      - name: scicode_scientific_background
        operator: OR
        keywords:
        - 'SCIENTIFIC BACKGROUND:'
        - physics
        - chemistry
        - biology
        - material science
        - equation
        - simulation
        - differential
        - integral
        - matrix
        - tensor
        - optimization
        - scientific background
        - background
        - minimum image
        - lennard-jones
        - virial
        - molecular
      - name: scicode_numeric_risk
        operator: OR
        keywords:
        - numpy
        - scipy
        - pandas
        - sympy
        - float
        - tolerance
        - are_dicts_close
        - cmp_tuple_or_list
        - process_hdf5_to_tuple
        - target
        - test cases
        - test case
        - np.
        - array
        - vector
      context:
      - name: scicode_long_context
        min_tokens: 4K
        max_tokens: 1M
        description: Long SciCode prompt with background, prior subproblem code, or
          verbose scientific setup.
    projections:
      scores:
      - name: scicode_risk_score
        method: weighted_sum
        inputs:
        - type: keyword
          name: scicode_function_contract
          weight: 0.25
        - type: keyword
          name: scicode_multistep_dependency
          weight: 0.25
        - type: keyword
          name: scicode_scientific_background
          weight: 0.2
        - type: keyword
          name: scicode_numeric_risk
          weight: 0.2
        - type: context
          name: scicode_long_context
          weight: 0.1
      mappings:
      - name: scicode_risk_band
        source: scicode_risk_score
        method: threshold_bands
        outputs:
        - name: scicode_low_risk
          lt: 0.35
        - name: scicode_medium_risk
          gte: 0.35
          lt: 0.65
        - name: scicode_high_risk
          gte: 0.65
    decisions:
    - name: scicode_function_contract_fusion
      description: SciCode function-header tasks use a three-model scientific code
        panel and GPT synthesis.
      priority: 340
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: scicode_any
        - type: keyword
          name: scicode_function_contract
      output_contract: Return exactly one Python code block. Implement only the requested
        function using the exact FUNCTION HEADER and RETURN LINE. Do not import dependencies,
        do not include tests, do not print, and do not add prose outside the code
        block. Reuse prior subproblem functions only by name. Follow the prompt's
        sign, vector-direction, unit, and virial-equation conventions literally.
      algorithm:
        type: fusion
        fusion:
          max_concurrent: 3
          max_completion_tokens: 32768
          round_timeout_seconds: 300
          min_successful_responses: 2
          temperature: 0.2
          include_analysis: false
          include_intermediate_responses: false
          on_error: skip
          synthesis_template: 'You are the final SciCode code judge.


            Original subproblem:

            {{original}}


            Candidate implementations:

            {{responses}}


            Select the implementation most likely to pass the hidden SciCode

            sandbox tests. Preserve the exact function header and required

            return line from the prompt. Remove imports, examples, tests, main

            guards, print calls, and prose. When candidates disagree on vector

            direction, force sign, pressure units, or virial convention, choose

            the implementation that follows the prompt literally and is

            internally consistent with previously defined functions. Return

            exactly one ```python code block.'
          grounding:
            enabled: false
            reference: panel
            policy: weight
            min_score: 0.0
            min_keep: 1
            nli_contradiction_penalty: 1.0
            on_error: skip
    - name: scicode_multistep_remom
      description: Dependency-sensitive subproblems use ReMoM to refine function composition
        across prior generated code.
      priority: 260
      rules:
        operator: OR
        conditions:
        - type: keyword
          name: scicode_multistep_dependency
        - type: projection
          name: scicode_medium_risk
      output_contract: Return exactly one Python code block containing only the requested
        function implementation. Preserve the exact FUNCTION HEADER and RETURN LINE.
        Do not import dependencies or redefine prior subproblem functions.
      algorithm:
        type: remom
        remom:
          breadth_schedule:
          - 5
          model_distribution: round_robin
          temperature: 0.2
          include_reasoning: false
          compaction_strategy: last_n_tokens
          compaction_tokens: 3000
          max_concurrent: 3
          round_timeout_seconds: 300
          min_successful_responses: 2
          max_responses_per_round: 5
          include_intermediate_responses: false
          on_error: skip
          synthesis_template: 'You are solving one turn of SciCode. Compare the reference

            implementations against the original subproblem and return the

            single most reliable Python function.


            Original subproblem:

            {{.OriginalContent}}


            Reference implementations:

            {{range $i, $resp := .ReferenceResponses}}

            Reference {{add $i 1}}{{if $resp.Model}} ({{$resp.Model}}){{end}}:

            {{$resp.Content}}

            {{end}}


            Preserve the exact function header and return line. Do not import

            dependencies, include tests, or add prose. Return exactly one

            ```python code block.'
    - name: scicode_low_risk_remom
      description: Low-risk SciCode subproblems still use a lightweight loop for stable
        code formatting.
      priority: 160
      rules:
        operator: AND
        conditions:
        - type: keyword
          name: scicode_any
        - type: projection
          name: scicode_low_risk
      output_contract: Return exactly one Python code block containing only the requested
        function implementation. Preserve the exact FUNCTION HEADER and RETURN LINE.
        Do not import dependencies, include tests, print, or add prose.
      algorithm:
        type: remom
        remom:
          breadth_schedule:
          - 3
          model_distribution: round_robin
          temperature: 0.2
          include_reasoning: false
          compaction_strategy: last_n_tokens
          compaction_tokens: 2000
          max_concurrent: 3
          round_timeout_seconds: 240
          min_successful_responses: 2
          max_responses_per_round: 3
          include_intermediate_responses: false
          on_error: skip
          synthesis_template: 'You are solving one SciCode subproblem. Compare the
            reference

            implementations and return the most reliable final implementation.


            Original subproblem:

            {{.OriginalContent}}


            Reference implementations:

            {{range $i, $resp := .ReferenceResponses}}

            Reference {{add $i 1}}{{if $resp.Model}} ({{$resp.Model}}){{end}}:

            {{$resp.Content}}

            {{end}}


            Return exactly one ```python code block. Preserve the exact function

            header and return line. Do not import dependencies or add prose.'
    - name: scicode_fallback_remom
      description: Catch-all fallback for unmatched SciCode traffic.
      priority: 1
      rules:
        operator: AND
        conditions: []
      output_contract: Preserve the benchmark output format exactly. For SciCode,
        return one Python code block containing only the requested function implementation,
        without imports, tests, prints, or prose.
      algorithm:
        type: remom
        remom:
          breadth_schedule:
          - 5
          model_distribution: round_robin
          temperature: 0.2
          include_reasoning: false
          compaction_strategy: last_n_tokens
          compaction_tokens: 3000
          max_concurrent: 3
          round_timeout_seconds: 300
          min_successful_responses: 2
          max_responses_per_round: 5
          include_intermediate_responses: false
          on_error: skip
          synthesis_template: 'You are solving SciCode. Compare the reference implementations

            against the original prompt and return the single most reliable

            final answer in the requested format.


            Original prompt:

            {{.OriginalContent}}


            Reference implementations:

            {{range $i, $resp := .ReferenceResponses}}

            Reference {{add $i 1}}{{if $resp.Model}} ({{$resp.Model}}){{end}}:

            {{$resp.Content}}

            {{end}}


            Return exactly one ```python code block and no prose.'
entrypoints:
- name: vllm-sr/auto
  recipe: default
  assignments:
    scicode_function_contract_fusion:
      models:
      - model: opus-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: gemini-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: gpt-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
    scicode_multistep_remom:
      models:
      - model: gemini-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: gpt-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: opus-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
    scicode_low_risk_remom:
      models:
      - model: gemini-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: gpt-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: opus-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
    scicode_fallback_remom:
      models:
      - model: gemini-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: gpt-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
      - model: opus-worker
        weight: '1'
        reasoning:
          enabled: true
          effort: medium
billing_currency: USD
global:
  router: {}
  integrations:
    looper:
      endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
      timeout_seconds: 900
  services:
    backend_credentials:
      openrouter_api_key:
        credential_adapter_id: bearer
        secret_env: OPENROUTER_API_KEY
    backend_dispatch:
      bind_address: 0.0.0.0
      port: 8180
      audience: vllm-sr.backend-dispatch
      capability_ttl: 30s
      max_request_body_bytes: 67108864
    backend_egress:
      policy_file: /app/config/backend-egress-policy.yaml
  stores: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
