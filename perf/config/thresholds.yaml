# Allocation count and bytes/op are portable PR gates. ns/op is reported as an
# advisory trend on shared runners; a future fixed same-class runner can set
# gate_ns_per_op: true for a narrow suite.
component_benchmarks:
  default:
    max_allocs_regression_percent: 10
    max_bytes_regression_percent: 10
    max_ns_regression_percent: 30
    max_p95_latency_regression_percent: 20
    max_throughput_regression_percent: 10
    max_upstream_calls_regression_percent: 10
    max_token_amplification_regression_percent: 10

  benchmarks:
    - name: request_shape
      pattern: "^Benchmark(ExtractContentFast|Handler_ChunkProcessing|RewriteModel_Fast)"
      max_allocs_regression_percent: 5
      max_bytes_regression_percent: 8
      max_ns_regression_percent: 25

    - name: decision_topology
      pattern: "^BenchmarkDecisionTopology"
      max_allocs_regression_percent: 5
      max_bytes_regression_percent: 5
      max_ns_regression_percent: 20

    - name: selection
      pattern: "^Benchmark(SelectionTopology|Compute)"
      max_allocs_regression_percent: 5
      max_bytes_regression_percent: 8
      max_ns_regression_percent: 25

    - name: looper_orchestration
      pattern: "^Benchmark(Base|Fusion|ReMoM|Flow)_Execute"
      max_allocs_regression_percent: 8
      max_bytes_regression_percent: 10
      max_ns_regression_percent: 35

    - name: looper_core
      pattern: "^Benchmark(ReMoM|Fusion|Flow|Base)"
      max_allocs_regression_percent: 5
      max_bytes_regression_percent: 8
      max_ns_regression_percent: 25

    - name: classification
      pattern: "^Benchmark(Classify|CGO)"
      max_allocs_regression_percent: 10
      max_bytes_regression_percent: 10
      max_ns_regression_percent: 30

    - name: semantic_cache
      pattern: "^BenchmarkCache"
      max_allocs_regression_percent: 10
      max_bytes_regression_percent: 10
      max_ns_regression_percent: 30
