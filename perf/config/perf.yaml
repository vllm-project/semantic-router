schema_version: 1

# Environments are capability adapters, not hard-coded runner branches. The
# first shipped gate uses CPU. AMD/NVIDIA entries make accelerator ownership
# explicit now; future GPU producers can use runner: external and emit the same
# result JSON without changing the report or comparison layers.
environments:
  cpu:
    kind: cpu
    description: Portable host-side router benchmark environment.
    capabilities: [host, cgo]
    env:
      VSR_PERF_DEVICE: cpu

  amd-gpu:
    kind: gpu
    accelerator: amd
    description: AMD accelerator runner for future ROCm/model-serving suites.
    capabilities: [host, cgo, gpu, rocm]
    env:
      VSR_PERF_DEVICE: amd

  nvidia-gpu:
    kind: gpu
    accelerator: nvidia
    description: NVIDIA accelerator runner for future CUDA/model-serving suites.
    capabilities: [host, cgo, gpu, cuda]
    env:
      VSR_PERF_DEVICE: nvidia

profiles:
  quick:
    description: Fast local feedback over deterministic router hot paths.
    suites: [request-shape, signal-topology, decision-topology, selection, looper-core]
    count: 1
    benchtime: 100ms
    timeout: 10m

  ci:
    description: CPU PR gate with repeated samples and stubbed algorithm fanout.
    suites:
      - request-shape
      - signal-topology
      - decision-topology
      - selection
      - looper-core
      - looper-orchestration
    count: 3
    benchtime: 500ms
    timeout: 20m

  nightly:
    description: Longer CPU trend run over the same fail-closed inventory.
    suites:
      - request-shape
      - signal-topology
      - decision-topology
      - selection
      - looper-core
      - looper-orchestration
    count: 8
    benchtime: 2s
    timeout: 45m

  cpu-full:
    description: Opt-in CPU run including model-backed classification and cache suites.
    suites:
      - request-shape
      - signal-topology
      - decision-topology
      - selection
      - looper-core
      - looper-orchestration
      - classification
      - semantic-cache
    count: 3
    benchtime: 2s
    timeout: 45m

suites:
  request-shape:
    description: Real ExtProc request extraction across context, message, tool, and concurrency shapes.
    runner: go_benchmark
    module: src/semantic-router
    packages: [./pkg/extproc]
    benchmark: "^Benchmark(ExtractContentFast_ContextShape|ExtractContentFast_ContextTrend|ExtractContentFast_Parallel|Handler_ChunkProcessing_16K|RewriteModel_Fast_16K)$"
    environments: [cpu, amd-gpu, nvidia-gpu]
    requires: [host]
    dimensions:
      context_tokens: ["128", "512", "2048", "4096", "8192", "16384", "32768", "65536"]
      messages: ["1", "8", "64"]
      tools: ["0", "8", "64"]
      request_concurrency: ["1", "parallel"]
    source_paths:
      - src/semantic-router/pkg/extproc/**

  signal-topology:
    description: Learned-signal scheduling and aggregation scaling with deterministic inference stubs.
    runner: go_benchmark
    module: src/semantic-router
    packages: [./pkg/classification]
    benchmark: "^BenchmarkGenericClassifierSignalTopology$"
    environments: [cpu, amd-gpu, nvidia-gpu]
    requires: [host]
    dimensions:
      context_tokens: ["128", "512", "2048", "8192", "32768"]
      request_batch: ["1", "4", "16", "32"]
      learned_signals: ["0", "1", "4", "8"]
      learned_signal_set: [generic-classifier]
      signal_backend: [deterministic_stub]
    source_paths:
      - src/semantic-router/pkg/classification/**

  decision-topology:
    description: Real decision evaluation scaling by rule count and match position.
    runner: go_benchmark
    module: src/semantic-router
    packages: [./pkg/decision]
    benchmark: "^BenchmarkDecisionTopology$"
    environments: [cpu, amd-gpu, nvidia-gpu]
    requires: [host]
    dimensions:
      decisions: ["1", "16", "128", "512"]
      match_position: [first, last, no-match]
      request_concurrency: ["1", "parallel"]
    source_paths:
      - src/semantic-router/pkg/decision/**

  selection:
    description: Candidate selection and context-window fit hot paths.
    runner: go_benchmark
    module: src/semantic-router
    packages: [./pkg/selection]
    benchmark: "^Benchmark(SelectionTopology|ComputeCacheAffinityAdjustments|ComputeGap12|ComputeFitM)"
    environments: [cpu, amd-gpu, nvidia-gpu]
    requires: [host]
    dimensions:
      candidate_models: ["1", "3", "16"]
      context_utilization: [low, medium, boundary]
    source_paths:
      - src/semantic-router/pkg/selection/**

  looper-core:
    description: Pure deterministic Looper, Fusion, ReMoM, and Workflow helpers.
    runner: go_benchmark
    module: src/semantic-router
    packages: [./pkg/looper]
    benchmark: "^Benchmark(ReMoM_(Distribute|Shuffle)|Fusion_(Resolve|Format|Build|Parse)|Flow_(Resolve|Build|Format)|Base_(Split|Parse|Rewrite))"
    environments: [cpu, amd-gpu, nvidia-gpu]
    requires: [host]
    dimensions:
      candidate_models: ["1", "4", "16"]
      algorithm: [base, fusion, remom, workflows]
    source_paths:
      - src/semantic-router/pkg/looper/**

  looper-orchestration:
    description: Algorithm fanout, quorum, JSON, and localhost HTTP overhead with deterministic stubs.
    runner: go_benchmark
    module: src/semantic-router
    packages: [./pkg/looper]
    benchmark: "^Benchmark(Base|Fusion|ReMoM|Flow)_Execute$"
    environments: [cpu, amd-gpu, nvidia-gpu]
    requires: [host]
    dimensions:
      fanout: ["1", "2", "3", "4", "5", "8"]
      rounds: ["1", "2"]
      algorithm: [base, fusion, remom, workflows]
    source_paths:
      - src/semantic-router/pkg/looper/**

  classification:
    description: Model-backed CPU classification batch and CGO overhead.
    runner: go_benchmark
    module: perf
    packages: [./benchmarks]
    benchmark: "^Benchmark(ClassifyBatch|CGOOverhead|LearnedSignalKernel)"
    environments: [cpu]
    requires: [host, cgo]
    dimensions:
      classifier_batch: ["1", "4", "10", "16", "50", "100", parallel]
      context_tokens: ["128", "512", "2048"]
      learned_signal_set: [unified-intent-pii-security]
      learned_signals: ["3"]
      signal_backend: [native-unified]
    source_paths:
      - src/semantic-router/pkg/classification/**
      - candle-binding/**

  semantic-cache:
    description: Semantic-cache size, hit-rate, and concurrency paths.
    runner: go_benchmark
    module: perf
    packages: [./benchmarks]
    benchmark: "^BenchmarkCache"
    environments: [cpu]
    requires: [host, cgo]
    dimensions:
      cache_entries: ["1000", "10000"]
      request_concurrency: ["1", "10", "50"]
      cache_outcome: [hit, miss]
    source_paths:
      - src/semantic-router/pkg/cache/**
      - src/semantic-router/pkg/extproc/*cache*

trends:
  request-context-latency:
    title: Request extraction latency by context length
    description: Real ExtProc parsing with one message and no tools; the production-like pairwise request shapes remain separate regression points.
    suite: request-shape
    benchmark: "^BenchmarkExtractContentFast_ContextTrend/"
    x_dimension: context_tokens
    metric: latency_us_per_op
    x_scale: log2

  learned-signal-context-latency:
    title: Model-isolated generic-classifier path by context and enabled count
    description: CPU-safe view of generic learned classifier signals. The curve includes Router scheduling, score aggregation, synchronization, allocations, and deterministic full-input stub work; it does not claim neural inference latency or represent other learned-signal families.
    suite: signal-topology
    benchmark: "^BenchmarkGenericClassifierSignalTopology/Context/"
    x_dimension: context_tokens
    series_dimension: learned_signals
    metric: latency_us_per_op
    x_scale: log2

  learned-signal-request-batch-latency:
    title: Router batch latency by enabled generic-classifier count
    description: Model-isolated concurrent request batches at a fixed 2K-token context using generic learned classifier signals. Use the throughput chart beside it to distinguish latency growth from useful parallelism.
    suite: signal-topology
    benchmark: "^BenchmarkGenericClassifierSignalTopology/RequestBatch/"
    x_dimension: request_batch
    series_dimension: learned_signals
    metric: latency_us_per_op
    x_scale: log2

  learned-signal-request-batch-throughput:
    title: Router throughput by request batch and generic-classifier count
    description: Model-isolated requests per second from the same controlled generic learned classifier sweep; absolute values are advisory on shared CI hosts.
    suite: signal-topology
    benchmark: "^BenchmarkGenericClassifierSignalTopology/RequestBatch/"
    x_dimension: request_batch
    series_dimension: learned_signals
    metric: custom:requests/s
    x_scale: log2

  learned-model-batch-latency:
    title: Unified learned-model latency by classifier batch and context
    description: Model-backed CPU-full curve for the native unified intent, PII, and security signal kernel. It is not part of the hermetic PR gate.
    suite: classification
    benchmark: "^BenchmarkLearnedSignalKernel/"
    x_dimension: classifier_batch
    series_dimension: context_tokens
    metric: latency_ms_per_op
    x_scale: log2

  learned-model-batch-throughput:
    title: Unified learned-model throughput by classifier batch and context
    description: Model-backed texts per second for the exact unified learned-signal set recorded in each benchmark dimension.
    suite: classification
    benchmark: "^BenchmarkLearnedSignalKernel/"
    x_dimension: classifier_batch
    series_dimension: context_tokens
    metric: custom:texts/s
    x_scale: log2
