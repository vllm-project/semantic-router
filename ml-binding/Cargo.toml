[package]
name = "ml_semantic_router"
version = "0.1.0"
edition = "2021"
description = "Traditional ML algorithms binding for semantic-router using Linfa"
license = "Apache-2.0"

[lib]
name = "ml_semantic_router"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Linfa ML framework - inference only (training done in Python)
# Training: src/training/model_selection/ml_model_selection/
linfa-nn = "0.7"           # Ball Tree for KNN/KMeans inference

# Linear algebra (must match Linfa's ndarray version)
ndarray = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip parses centroids and scores to the exact f64 Python wrote.
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# Artifact ids, matching the trainer's hashlib.blake2b digests
blake2 = "0.10"

# Pin noisy_float to version compatible with Rust 1.75
noisy_float = "=0.2.0"

# FFI
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
