            - строго
            type: keyword_set
          type: density
        name: speed_constraint_dense
        predicate:
          gt: 0.08
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 10
        method: threshold_bands
        name: speed_workload_band
        outputs:
        - lt: 0.45
          name: speed_interactive
        - gte: 0.45
          name: speed_heavy_workload_required
        source: speed_workload_score
      scores:
      - inputs:
        - name: speed_heavy_request_phrases
          type: keyword
          value_source: confidence
          weight: 0.6
        - name: speed_heavy_intent
          type: embedding
          value_source: confidence
          weight: 0.55
        - name: speed_context_from_30k_to_60k
          type: context
          weight: 0.15
        - name: speed_context_from_60k_to_120k
          type: context
          weight: 0.15
        - name: speed_context_from_120k_to_240k
