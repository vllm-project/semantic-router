version: v0.3
recipes:
- name: balance
  description: A balanced Recipe optimized across quality, speed, and cost.
  routing:
    signals:
      complexity:
      - description: Semantic boundary between direct requests and synthesis-heavy work.
        easy:
          candidates:
          - Give a short definition of a common term.
          - Summarize one paragraph in a single sentence.
          - Explain a basic concept with one example.
        hard:
          candidates:
          - Analyze a production failure from several competing root causes.
          - Design a distributed system and justify its consistency tradeoffs.
          - Synthesize conflicting evidence into a defensible recommendation.
          - 分析复杂生产故障中的多个竞争性根因并提出可靠方案。
          - Analiza varias causas raíz y sintetiza una recomendación defendible.
          - حلّل عدة أسباب جذرية متنافسة وقدّم توصية قابلة للدفاع.
        name: balance_difficulty
        threshold: 0.08
      context:
      - description: The 30K-60K band raises text and tool requests into the complex lane.
        max_tokens: '60000'
        min_tokens: '30001'
        name: balance_context_from_30k_to_60k
      - description: The 60K-120K band raises text and tool requests into the complex lane.
        max_tokens: '120000'
        min_tokens: '60001'
        name: balance_context_from_60k_to_120k
      - description: The 120K-240K band preserves output and tool reserve on native-262K backends.
        max_tokens: '240000'
        min_tokens: '120001'
        name: balance_context_from_120k_to_240k
      - description: Inputs beyond 240K require a capability-preserving terminal lane.
        max_tokens: '2147483647'
        min_tokens: '240001'
        name: balance_exceeds_240k_context
      conversation:
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: balance_has_images
      - description: Request declares at least one callable tool.
        feature:
          source:
            type: tool_definition
          type: count
        name: balance_has_tools
        predicate:
          gte: 1
      - description: Request is actively continuing a client-owned tool loop.
        feature:
          source:
            type: active_tool_loop
          type: exists
        name: balance_active_tool_loop
      - description: Multi-turn conversations benefit from a small synthesis allowance.
        feature:
          source:
            role: user
            type: message
          type: count
        name: balance_multi_turn
        predicate:
          gte: 2
      keywords:
      - case_sensitive: false
        keywords:
        - \b(use|using|call|invoke|run)\b.{0,48}\b(tool|function)\b
        - \b(use|using|call|invoke|run)\b.{0,48}\b(calculator|browser|search|lookup|retriever|api|database)\b
        - \b(search|look up|fetch|query)\b.{0,48}\b(tool|function|integration)\b
        - (使用|调用|运行).{0,24}(工具|函数)
        - (usar|llamar|invocar).{0,48}(herramienta|función)
        - (utiliser|appeler|invoquer).{0,48}(outil|fonction)
        - (ツール|関数).{0,24}(使用|呼び出)
        - (werkzeug|funktion).{0,48}(verwenden|aufrufen)
        - (usar|chamar|invocar).{0,48}(ferramenta|função)
        - (도구|함수).{0,24}(사용|호출)
        - (استخدم|استدع).{0,32}(الأداة|الدالة)
        - (टूल|फ़ंक्शन).{0,32}(उपयोग|कॉल)
        - (используй|вызови).{0,48}(инструмент|функци)
        method: regex
        name: balance_tool_execution_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - quick answer
        - answer briefly
        - one sentence
        - concise summary
        - 简单回答
        - 简要说明
        - 简短回答
        - respuesta breve
        - réponse brève
        - 簡潔に答えて
        - kurz antworten
        - resposta breve
        - 짧게 답해
        - إجابة مختصرة
        - संक्षिप्त उत्तर
        - краткий ответ
        method: regex
        name: balance_simple_request_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - concise and direct
        - brief and direct
        - 简洁直接
        - 简短直接
        - breve y directa
        - brève et directe
        - 簡潔で直接的
        - kurz und direkt
        - breve e direta
        - 간결하고 직접적으로
        - موجز ومباشر
        - संक्षिप्त और सीधा
        - кратко и прямо
        method: regex
        name: balance_concise_request_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - do not analyze
        - don't analyze
        - without analysis
        - 不要分析
        - 无需分析
        - no analices
        - sans analyse
        - 分析しない
        - nicht analysieren
        - sem análise
        - 분석하지 마
        - دون تحليل
        - विश्लेषण मत करो
        - без анализа
        method: regex
        name: balance_reasoning_opt_out_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - analyze the tradeoffs
        - from first principles
        - root cause
        - reason step by step
        - compare the alternatives carefully
        - 分析取舍
        - 第一性原理
        - 根因分析
        - 逐步推理
        - analizar las ventajas y desventajas
        - causa raíz
        - analyser les compromis
        - cause racine
        - トレードオフを分析
        - 根本原因
        - kompromisse analysieren
        - ursache analysieren
        - analisar as compensações
        - causa raiz
        - 트레이드오프를 분석
        - 근본 원인
        - حلل المفاضلات
        - السبب الجذري
        - समझौतों का विश्लेषण
        - मूल कारण
        - проанализируй компромиссы
        - первопричина
        method: regex
        name: balance_deliberate_request_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - verify the answer
        - cite sources
        - fact-check
        - check the evidence
        - 核实答案
        - 引用来源
        - verificar la respuesta
        - citer les sources
        - 答えを検証
        - quellen zitieren
        - verificar a resposta
        - 답변을 검증
        - تحقق من الإجابة
        - उत्तर सत्यापित करें
        - проверь ответ
        method: regex
        name: balance_verification_request_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - that's wrong
        - wrong answer
        - \b(is|was|were) wrong\b
        - \banswer was incorrect\b
        - \bcorrect (it|this|the answer)\b
        - please correct the answer
        - try again
        - 回答错了
        - 请纠正答案
        - la respuesta es incorrecta
        - corrige la respuesta
        - la réponse est incorrecte
        - corrige la réponse
        - 回答が間違っています
        - bitte korrigiere die antwort
        - a resposta está errada
        - 답변이 틀렸습니다
        - الإجابة خاطئة
        - उत्तर गलत है
        - ответ неверный
        method: regex
        name: balance_correction_request_phrases
        operator: OR
      language:
      - description: English-language request.
        name: en
        threshold: 0.5
      - description: Chinese-language request.
        name: zh
        threshold: 0.5
      - description: Spanish-language request.
        name: es
        threshold: 0.5
      - description: French-language request.
        name: fr
        threshold: 0.5
      - description: Japanese-language request.
        name: ja
        threshold: 0.5
      - description: German-language request.
        name: de
        threshold: 0.5
      - description: Portuguese-language request.
        name: pt
        threshold: 0.5
      - description: Korean-language request.
        name: ko
        threshold: 0.5
      - description: Arabic-language request.
        name: ar
        threshold: 0.5
      - description: Hindi-language request.
        name: hi
        threshold: 0.5
      - description: Russian-language request.
        name: ru
        threshold: 0.5
      reasks:
      - description: Detect an immediate semantic repeat after an unsatisfactory answer.
        lookback_turns: 1
        name: balance_repeated_question
        threshold: 0.8
      structure:
      - description: Detect a dense set of explicit output or correctness constraints.
        feature:
          source:
            keywords:
            - must
            - exactly
            - at least
            - at most
            - without
            - 必须
            - 严格
            - 至少
            - 不超过
            type: keyword_set
          type: density
        name: balance_constraint_dense
        predicate:
          gt: 0.08
    projections:
      mappings:
      - calibration:
          method: sigmoid_distance
          slope: 10
        method: threshold_bands
        name: balance_reasoning_effort_band
        outputs:
        - lt: 0.3
          name: balance_direct_workload
        - gte: 0.3
          name: balance_deliberate_workload
        source: balance_reasoning_effort_score
      - calibration:
          method: sigmoid_distance
          slope: 12
        method: threshold_bands
        name: balance_answer_recovery_band
        outputs:
        - lt: 0.35
          name: balance_no_recovery_needed
        - gte: 0.35
          name: balance_needs_recovery
        source: balance_answer_recovery_score
      scores:
      - inputs:
        - name: balance_simple_request_phrases
          type: keyword
          value_source: confidence
          weight: -0.35
        - name: balance_concise_request_phrases
          type: keyword
          value_source: confidence
          weight: -0.1
        - name: balance_reasoning_opt_out_phrases
          type: keyword
          value_source: confidence
          weight: -1
        - name: balance_deliberate_request_phrases
          type: keyword
          value_source: confidence
          weight: 0.85
        - name: balance_verification_request_phrases
          type: keyword
          value_source: confidence
          weight: 0.45
        - name: balance_constraint_dense
          type: structure
          weight: 0.45
        - name: balance_difficulty:hard
          type: complexity
          weight: 0.4
        - name: balance_difficulty:easy
          type: complexity
          weight: -0.05
        - name: balance_multi_turn
          type: conversation
          weight: 0.08
        - name: en
          type: language
          weight: 0.02
        - name: zh
          type: language
          weight: 0.02
        - name: es
          type: language
          weight: 0.02
        - name: fr
          type: language
          weight: 0.02
        - name: ja
          type: language
          weight: 0.02
        - name: de
          type: language
          weight: 0.02
        - name: pt
          type: language
          weight: 0.02
        - name: ko
          type: language
          weight: 0.02
        - name: ar
          type: language
          weight: 0.02
        - name: hi
          type: language
          weight: 0.02
        - name: ru
          type: language
          weight: 0.02
        method: weighted_sum
        name: balance_reasoning_effort_score
      - inputs:
        - name: balance_correction_request_phrases
          type: keyword
          value_source: confidence
          weight: 0.5
        - name: balance_repeated_question
          type: reask
          value_source: confidence
          weight: 0.4
        method: weighted_sum
        name: balance_answer_recovery_score
    decisions:
    - algorithm:
        type: static
      description: Keep image understanding on the dedicated local visual-language model.
      name: omni
      priority: 500
      rules:
        conditions:
        - name: balance_has_images
          type: conversation
        operator: OR
    - algorithm:
        type: static
      description: Keep explicit tool execution and active tool turns on the dedicated coding model.
      name: agentic
      priority: 400
      rules:
        conditions:
        - conditions:
          - name: balance_active_tool_loop
            type: conversation
          - conditions:
            - name: balance_has_tools
              type: conversation
            - name: balance_tool_execution_phrases
              type: keyword
            operator: AND
          operator: OR
        - conditions:
          - name: balance_has_images
            type: conversation
          operator: NOT
        operator: AND
    - algorithm:
        type: static
      description: Send difficult, corrective, or long text synthesis to the frontier analysis pool.
      name: complex
      priority: 300
      rules:
        conditions:
        - conditions:
          - name: balance_deliberate_workload
            type: projection
          - name: balance_needs_recovery
            type: projection
          - name: balance_context_from_30k_to_60k
            type: context
          - name: balance_context_from_60k_to_120k
            type: context
          - name: balance_context_from_120k_to_240k
            type: context
          - name: balance_exceeds_240k_context
            type: context
          operator: OR
        - conditions:
          - name: balance_has_images
            type: conversation
          operator: NOT
        operator: AND
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.15
            latency: 0.25
            load: 0.15
            quality: 0.45
        type: multi_factor
      description: Balance multimodal and conversational work across fast, diverse, and frontier local models.
      name: medium
      priority: 200
      rules:
        conditions:
        - name: balance_has_images
          type: conversation
        - name: balance_multi_turn
          type: conversation
        operator: OR
    - algorithm:
        multi_factor:
          on_no_candidates: first
          weights:
            cost: 0.25
            latency: 0.35
            load: 0.15
            quality: 0.25
        type: multi_factor
      description: Keep ordinary requests on the fastest balanced local pair.
      name: simple
      priority: 10
    strategy: priority
- name: speed
  description: A speed-first Recipe for low-latency, real-time experiences.
  routing:
    signals:
      complexity:
      - description: Semantic boundary between interactive work and heavier latency-sensitive synthesis.
        easy:
          candidates:
          - Define a familiar term in one sentence.
          - Rewrite a short sentence clearly.
          - Give one direct factual answer.
        hard:
          candidates:
          - Design a multi-region architecture and analyze competing failure modes.
          - Review a complex migration plan with several operational constraints.
          - 综合多项约束设计分布式系统并分析故障模式。
          - صمم نظاماً موزعاً مع تحليل عدة أنماط للفشل.
        name: speed_complexity
        threshold: 0.1
      context:
      - description: The 30K-60K band records conservative context use within the native-262K latency pool.
        max_tokens: '60000'
        min_tokens: '30001'
        name: speed_context_from_30k_to_60k
      - description: The 60K-120K band records conservative context use within the native-262K latency pool.
        max_tokens: '120000'
        min_tokens: '60001'
        name: speed_context_from_60k_to_120k
      - description: The 120K-240K band preserves output, system, tool, and image reserve on native-262K backends.
        max_tokens: '240000'
        min_tokens: '120001'
        name: speed_context_from_120k_to_240k
      - description: Inputs beyond 240K require a capability-preserving terminal lane.
        max_tokens: '2147483647'
        min_tokens: '240001'
        name: speed_exceeds_240k_context
      conversation:
      - description: Request contains at least one image content part.
        feature:
          source:
            type: image_content
          type: exists
        name: speed_has_images
      - description: Request declares at least one callable tool.
        feature:
          source:
            type: tool_definition
          type: count
        name: speed_has_tools
        predicate:
          gte: 1
      - description: Request is actively continuing a client-owned tool loop.
        feature:
          source:
            type: active_tool_loop
          type: exists
        name: speed_active_tool_loop
      embeddings:
      - aggregation_method: max
        candidates:
        - Produce a comprehensive architecture and analyze several failure modes.
        - 对复杂迁移做深入分析并给出详细架构。
        - Realiza un análisis profundo y una arquitectura detallada.
        - Produis une analyse approfondie et une architecture détaillée.
        - 複雑な移行を深く分析し、詳細なアーキテクチャを示してください。
        - Erstelle eine gründliche Analyse und detaillierte Architektur.
        - Faça uma análise aprofundada e uma arquitetura detalhada.
        - 복잡한 마이그레이션을 심층 분석하고 상세 아키텍처를 제시하세요.
        - قدّم تحليلاً متعمقاً وبنية مفصلة.
        - गहन विश्लेषण और विस्तृत आर्किटेक्चर प्रस्तुत करें।
        - Проведи глубокий анализ и предложи подробную архитектуру.
        name: speed_heavy_intent
        threshold: 0.77
      keywords:
      - case_sensitive: false
        keywords:
        - \b(use|using|call|invoke|run)\b.{0,48}\b(tool|function)\b
        - \b(use|using|call|invoke|run)\b.{0,48}\b(calculator|browser|search|lookup|retriever|api|database)\b
        - \b(search|look up|fetch|query)\b.{0,48}\b(tool|function|integration)\b
        - (使用|调用|运行).{0,24}(工具|函数)
        - (usar|llamar|invocar).{0,48}(herramienta|función)
        - (utiliser|appeler|invoquer).{0,48}(outil|fonction)
        - (ツール|関数).{0,24}(使用|呼び出)
        - (werkzeug|funktion).{0,48}(verwenden|aufrufen)
        - (usar|chamar|invocar).{0,48}(ferramenta|função)
        - (도구|함수).{0,24}(사용|호출)
        - (استخدم|استدع).{0,32}(الأداة|الدالة)
        - (टूल|फ़ंक्शन).{0,32}(उपयोग|कॉल)
        - (используй|вызови).{0,48}(инструмент|функци)
        method: regex
        name: speed_tool_execution_phrases
        operator: OR
      - case_sensitive: false
        keywords:
        - deep analysis
