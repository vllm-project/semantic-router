          weight: 0.3
        - name: speed_constraint_dense
          type: structure
          weight: 0.5
        - name: speed_complexity:hard
          type: complexity
          weight: 0.35
        - name: speed_complexity:easy
          type: complexity
          weight: -0.1
        method: weighted_sum
        name: speed_workload_score
    decisions:
    - algorithm:
        type: static
      description: Preserve very long text context on the remote frontier lane.
      name: extended
      priority: 500
      rules:
        conditions:
        - name: speed_exceeds_240k_context
          type: context
        - conditions:
          - name: speed_has_images
            type: conversation
          operator: NOT
        operator: AND
    - algorithm:
        latency_aware:
          description: Minimize observed first-token latency for interactive tool traffic.
          ttft_percentile: 90
        type: latency_aware
      description: Keep tool-driven work fast on the coding and flash specialists.
      name: tooling
      priority: 400
      rules:
        conditions:
        - conditions:
          - name: speed_active_tool_loop
            type: conversation
          - conditions:
            - name: speed_has_tools
              type: conversation
            - name: speed_tool_execution_phrases
              type: keyword
            operator: AND
          operator: OR
        - conditions:
          - name: speed_has_images
            type: conversation
          operator: NOT
        - conditions:
          - name: speed_exceeds_240k_context
            type: context
          operator: NOT
        operator: AND
    - algorithm:
        type: static
      description: Keep visual work on the dedicated local visual-language model.
      name: omni
      priority: 300
      rules:
        conditions:
        - name: speed_has_images
          type: conversation
        operator: OR
    - algorithm:
        latency_aware:
          description: Minimize observed generation latency for demanding text requests.
          tpot_percentile: 90
        type: latency_aware
      description: Use live latency telemetry for demanding text work that must still feel responsive.
      name: heavy
      priority: 200
      rules:
        conditions:
        - conditions:
          - name: speed_heavy_workload_required
            type: projection
          - name: speed_context_from_30k_to_60k
            type: context
          - name: speed_context_from_60k_to_120k
            type: context
          - name: speed_context_from_120k_to_240k
