indices:
- id: vllm-sr/intelligence@1.0.0
  display_name: vLLM-SR Published Intelligence Index
  description: Directional composite of five public benchmarks reported by primary model sources.
  methodology: https://github.com/vllm-project/semantic-router/blob/main/website/docs/proposals/unified-model-catalog-and-evaluation-index.md
  aggregation: weighted_mean
  scale:
  - 0
  - 100
  missing:
    policy: require_coverage
    minimum: 0.6
  domains:
    general_reasoning: 0.2
    scientific_reasoning: 0.2
    frontier_reasoning: 0.2
    software_engineering: 0.2
    agentic_systems: 0.2
  components:
  - metric: tiger-ai-lab/mmlu-pro@1.0.0#accuracy
    weight: 0.2
    normalization:
      type: identity
  - metric: idavidrein/gpqa-diamond@1.0.0#accuracy
    weight: 0.2
    normalization:
      type: identity
  - metric: cais/humanitys-last-exam@1.0.0#accuracy
    weight: 0.2
    normalization:
      type: identity
  - metric: swe-bench/verified@1.0.0#resolved
    weight: 0.2
    normalization:
      type: identity
  - metric: harbor/terminal-bench@2.1.0#resolved
    weight: 0.2
    normalization:
      type: identity
