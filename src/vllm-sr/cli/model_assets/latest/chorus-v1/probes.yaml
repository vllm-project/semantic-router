- id: balance_over_240k_image_guard
  model: vllm-sr/chorus-v1
  expected_recipe: balance
  expected_decision: balance_over_240k_image_guard
  expected_algorithm: static
  expected_plugins:
  - system_prompt
  expected_alias: local/qwen3.6-35b
  notes: Eval proves modality-preserving routing and GLM exclusion; Qwen36 enforces true native-262K overflow because the router has no reject decision.
  variants:
  - id: image_at_first_over_240k_token
    display_prompt: Analyze the attached image at the 240K context boundary and explain the most important visual finding.
    playground:
      enabled: false
      reason: This synthetic long-context boundary fixture is materialized only for Eval and is intentionally disabled in Playground.
    generated_text:
      message_index: 0
      content_index: 1
      target_text_bytes: 960001
    messages:
    - role: user
      content:
      - type: text
        text: 'Conservative image context boundary check '
      - type: image_fixture
        fixture: chorus_v1_architecture
    expected_signals:
      context:
      - balance_exceeds_240k_context
      conversation:
      - balance_has_images
      - balance_has_tools
    tags:
    - language:en
    - shape:messages
    - multimodal
    - image
    - stress:long-input
    - positive
    - supported
    - context:240001
    - tools
    - shape:tools
    - priority
    tools:
    - type: function
      function:
        name: lookup_context_item
        description: Look up one item from the supplied context.
    notes: The four-bytes-per-token context counter classifies the ASCII payload at the first token above the conservative 240K routing boundary.
  - id: image_above_qwen36_native_limit
    display_prompt: Evaluate an image request whose context exceeds the native 262K limit and verify that it stays on the capability-preserving terminal lane.
    playground:
      enabled: false
      reason: This synthetic long-context boundary fixture is materialized only for Eval and is intentionally disabled in Playground.
    generated_text:
      message_index: 0
      content_index: 1
      target_text_bytes: 1100001
    messages:
    - role: user
      content:
      - type: text
        text: 'Conservative image context boundary check '
      - type: image_fixture
        fixture: chorus_v1_architecture
    expected_signals:
      context:
      - balance_exceeds_240k_context
      conversation:
      - balance_has_images
    notes: Eval proves modality-preserving routing; the native-262K backend must reject this intentionally unsupported total context.
    tags:
    - language:en
    - shape:messages
    - multimodal
    - image
    - stress:long-input
    - unsupported
    - known-gap
    - collision
    - context:above-262k
