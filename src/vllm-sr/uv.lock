    { name = "pydantic" },
    { name = "pyyaml" },
    { name = "requests" },
    { name = "typing-extensions" },
]

[package.optional-dependencies]
bench = [
    { name = "pyarrow" },
    { name = "tomli", marker = "python_full_version < '3.11'" },
]
dev = [
    { name = "black" },
    { name = "pytest" },
]
runtime = [
    { name = "vllm-srun", extra = ["multimodal"] },
]

[package.metadata]
requires-dist = [
    { name = "black", marker = "extra == 'dev'", specifier = ">=22.0.0" },
    { name = "click", specifier = ">=8.1.7" },
    { name = "huggingface-hub", specifier = ">=0.20.0" },
    { name = "jinja2", specifier = ">=3.1.4" },
    { name = "jsonschema", specifier = ">=4.23.0" },
    { name = "pyarrow", marker = "extra == 'bench'", specifier = ">=18.0.0" },
    { name = "pydantic", specifier = ">=2.12.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.4.1" },
    { name = "pyyaml", specifier = ">=6.0.2" },
    { name = "requests", specifier = ">=2.31.0" },
    { name = "tomli", marker = "python_full_version < '3.11' and extra == 'bench'", specifier = ">=2.0.1" },
    { name = "typing-extensions", specifier = ">=4.6.0" },
    { name = "vllm-srun", extras = ["multimodal"], marker = "extra == 'runtime'", editable = "../model-runtime" },
]
provides-extras = ["bench", "runtime", "dev"]

[[package]]
name = "vllm-srun"
version = "0.4.0"
source = { editable = "../model-runtime" }
dependencies = [
    { name = "httptools" },
    { name = "huggingface-hub" },
    { name = "numpy", version = "2.2.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.11.*'" },
    { name = "numpy", version = "2.5.3", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "prometheus-client" },
    { name = "pyyaml" },
    { name = "safetensors" },
    { name = "starlette" },
    { name = "tokenizers" },
    { name = "torch" },
    { name = "uvicorn" },
    { name = "uvloop", marker = "sys_platform != 'win32'" },
]

[package.optional-dependencies]
