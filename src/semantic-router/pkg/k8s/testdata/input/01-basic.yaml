---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentPool
metadata:
  name: test-pool
  namespace: default
spec:
  defaultModel: "qwen-2.5-7b"
  models:
    - name: "qwen-2.5-7b"
      reasoning:
        family: "qwen3"
      pricing:
        inputTokenPrice: 0.0000005  # $0.5 per 1M input tokens
        outputTokenPrice: 0.000001   # $1 per 1M output tokens
      loras:
        - name: "tech-support"
          description: "Technical support specialist"

    - name: "qwen-2.5-72b"
      reasoning:
        family: "qwen3"
      pricing:
        inputTokenPrice: 0.000003    # $3 per 1M input tokens
        outputTokenPrice: 0.000006   # $6 per 1M output tokens
      loras:
        - name: "advanced-reasoning"
          description: "Advanced reasoning and problem solving"
---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentRoute
metadata:
  name: test-route
  namespace: default
spec:
  signals:
    keywords:
      - name: "urgent"
        operator: "OR"
        keywords: ["urgent", "emergency", "asap"]
        caseSensitive: false
      - name: "tech_support"
        operator: "OR"
        keywords: ["I need help with technical issues", "Can you help me troubleshoot this problem?", "Something is not working correctly"]
        caseSensitive: false
    domains:
      - name: "computer science"
        description: "Computer science and programming"
      - name: "math"
        description: "Mathematics and quantitative reasoning"

  decisions:
    - name: "urgent_tech"
      priority: 100
      description: "Urgent technical support requests - use large model with reasoning"
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "urgent"
          - type: "keyword"
            name: "tech_support"
      modelRefs:
        - model: "qwen-2.5-72b"
          loraName: "advanced-reasoning"
          useReasoning: true
          reasoningEffort: "high"
      plugins:
        - type: "response_cache"
          configuration:
            enabled: true
            semantic: {match: {recall: {top_k: 3, min_similarity: 0.9}}}

    - name: "general_tech"
      priority: 50
      description: "General technical queries - use small model for efficiency"
      signals:
        operator: "OR"
        conditions:
          - type: "keyword"
            name: "tech_support"
          - type: "domain"
            name: "computer science"
      modelRefs:
        - model: "qwen-2.5-7b"
          loraName: "tech-support"
          useReasoning: false

