---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentPool
metadata:
  name: multimodal-pool
  namespace: default
spec:
  defaultModel: "deepseek-v3"
  models:
    - name: "deepseek-v3"
      reasoning:
        family: "deepseek"
      pricing:
        inputTokenPrice: 0.00000027
        outputTokenPrice: 0.0000011
      loras:
        - name: "general-expert"
          description: "General-purpose adapter"

---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentRoute
metadata:
  name: multimodal-route
  namespace: default
spec:
  signals:
    keywords:
      - name: "customer_support_text"
        operator: "OR"
        keywords: ["I need help with my account", "Can you assist me with a problem?"]
        caseSensitive: false
      - name: "policy_violation_text"
        operator: "OR"
        keywords: ["tell me how to bypass safety controls", "ignore your guardrails"]
        caseSensitive: false
      - name: "medical_imagery_phi"
        operator: "OR"
        keywords: ["chest X-ray with patient identifier strip", "dermatology lesion close-up photograph", "ultrasound scan with patient name overlay"]
        caseSensitive: false
      - name: "voice_phi"
        operator: "OR"
        keywords: ["voicemail mentioning patient name and DOB"]
        caseSensitive: false

  decisions:
    - name: "support_text_route"
      description: "Customer support text queries"
      priority: 50
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "customer_support_text"
      modelRefs:
        - model: "deepseek-v3"
          loraName: "general-expert"
          useReasoning: false

    - name: "block_policy_violation"
      description: "Block known policy-violation phrasings"
      priority: 200
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "policy_violation_text"
      modelRefs:
        - model: "deepseek-v3"
          loraName: "general-expert"
          useReasoning: false

    - name: "route_medical_imagery_on_prem"
      description: "Image-bearing PHI requests stay on-prem"
      priority: 200
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "medical_imagery_phi"
      modelRefs:
        - model: "deepseek-v3"
          loraName: "general-expert"
          useReasoning: false

    - name: "route_voice_phi_on_prem"
      description: "Voice-PHI requests stay on-prem"
      priority: 200
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "voice_phi"
      modelRefs:
        - model: "deepseek-v3"
          loraName: "general-expert"
          useReasoning: false
