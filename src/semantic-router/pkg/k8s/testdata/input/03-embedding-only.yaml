---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentPool
metadata:
  name: embedding-pool
  namespace: default
spec:
  defaultModel: "deepseek-v3"
  models:
    - name: "deepseek-v3"
      reasoning:
        family: "deepseek"
      pricing:
        inputTokenPrice: 0.00000027  # $0.27 per 1M input tokens - efficient for semantic matching
        outputTokenPrice: 0.0000011  # $1.1 per 1M output tokens
      loras:
        - name: "customer-support"
          description: "Customer support specialist"

    - name: "deepseek-r1"
      reasoning:
        family: "deepseek"
      pricing:
        inputTokenPrice: 0.00000055  # $0.55 per 1M input tokens - better reasoning
        outputTokenPrice: 0.0000022  # $2.2 per 1M output tokens
      loras:
        - name: "technical-expert"
          description: "Technical problem solving expert"

---
apiVersion: vllm.ai/v1alpha1
kind: IntelligentRoute
metadata:
  name: embedding-route
  namespace: default
spec:
  signals:
    keywords:
      - name: "customer_support"
        operator: "OR"
        keywords: ["I need help with my account", "Can you assist me with a problem?", "I have a question about my order"]
        caseSensitive: false
      - name: "technical_issue"
        operator: "OR"
        keywords: ["The system is not working properly", "I'm experiencing technical difficulties", "There's a bug in the application"]
        caseSensitive: false

  decisions:
    - name: "tech_troubleshoot"
      description: "Technical troubleshooting - use reasoning model"
      priority: 100
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "technical_issue"
      modelRefs:
        - model: "deepseek-r1"
          loraName: "technical-expert"
          useReasoning: true
          reasoningEffort: "high"

    - name: "support_ticket"
      description: "Customer support requests - use fast model"
      priority: 80
      signals:
        operator: "AND"
        conditions:
          - type: "keyword"
            name: "customer_support"
      modelRefs:
        - model: "deepseek-v3"
          loraName: "customer-support"
          useReasoning: false

