version: v0.5

listeners: []

providers:
  defaults:
    reasoning_effort: high
recipes:
  - name: default
    signals: {}

global:
  router:
    config_source: kubernetes
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: false
          sample_rate: 1.0
          duration_buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30]
          size_buckets: [1, 2, 5, 10, 20, 50, 100, 200]
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1.0
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
  plugins:
    - type: response_cache
      configuration:
        enabled: true
        scope: global
        semantic:
          match:
            recall:
              top_k: 1
              min_similarity: 0.8
