version: v0.3
providers:
  defaults:
    model: deepseek-v3
    reasoning_effort: high
  models:
    - name: deepseek-v3
      reasoning:
        family: deepseek
      pricing:
        prompt_per_1m: 0.27
        completion_per_1m: 1.1
    - name: deepseek-r1
      reasoning:
        family: deepseek
      pricing:
        prompt_per_1m: 0.55
        completion_per_1m: 2.2
routing:
  modelCards:
    - name: deepseek-v3
      loras:
        - name: customer-support
          description: Customer support specialist
    - name: deepseek-r1
      loras:
        - name: technical-expert
          description: Technical problem solving expert
  signals:
    keywords:
      - name: customer_support
        operator: OR
        keywords:
          - I need help with my account
          - Can you assist me with a problem?
          - I have a question about my order
        case_sensitive: false
      - name: technical_issue
        operator: OR
        keywords:
          - The system is not working properly
          - I'm experiencing technical difficulties
          - There's a bug in the application
        case_sensitive: false
  decisions:
    - name: tech_troubleshoot
      description: Technical troubleshooting - use reasoning model
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: technical_issue
      modelRefs:
        - model: deepseek-r1
          lora_name: technical-expert
          use_reasoning: true
          reasoning_effort: high
    - name: support_ticket
      description: Customer support requests - use fast model
      priority: 80
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: customer_support
      modelRefs:
        - model: deepseek-v3
          lora_name: customer-support
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      enabled: true
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ""
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
