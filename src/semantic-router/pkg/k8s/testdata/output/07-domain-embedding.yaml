version: v0.3
providers:
  defaults:
    model: gpt-4o-mini
    reasoning_effort: high
  models:
    - name: gpt-4o-mini
      pricing:
        prompt_per_1m: 0.15
        completion_per_1m: 0.6
    - name: gpt-4o
      pricing:
        prompt_per_1m: 2.5
        completion_per_1m: 10
routing:
  modelCards:
    - name: gpt-4o-mini
      loras:
        - name: research-assistant
          description: Research assistant
    - name: gpt-4o
      loras:
        - name: research-expert
          description: Advanced research specialist
  signals:
    keywords:
      - name: research_question
        operator: OR
        keywords:
          - Can you explain the theory behind this concept?
          - What are the latest research findings on this topic?
          - I'm conducting research and need detailed information
        case_sensitive: false
    domains:
      - name: biology
        description: Biology and life sciences
      - name: chemistry
        description: Chemistry and chemical sciences
      - name: physics
        description: Physics and physical sciences
  decisions:
    - name: biology_research
      description: Biology research queries
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: research_question
          - type: domain
            name: biology
      modelRefs:
        - model: gpt-4o
          use_reasoning: false
    - name: general_science_research
      description: General science research
      priority: 80
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: research_question
          - type: domain
            name: chemistry
      modelRefs:
        - model: gpt-4o
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      enabled: false
      ttl_seconds: 0
    memory:
      default_retrieval_limit: 0
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
    looper: {}
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ""
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
