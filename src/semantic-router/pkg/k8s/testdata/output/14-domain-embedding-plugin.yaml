version: v0.3
providers:
  defaults:
    model: gpt-4o-mini
    reasoning_effort: high
  models:
    - name: gpt-4o-mini
      pricing:
        prompt_per_1m: 0.15
        completion_per_1m: 0.6
    - name: gpt-4o
      pricing:
        prompt_per_1m: 2.5
        completion_per_1m: 10
routing:
  modelCards:
    - name: gpt-4o-mini
      loras:
        - name: finance-assistant
          description: Financial assistant
    - name: gpt-4o
      loras:
        - name: financial-advisor
          description: Financial domain specialist
  signals:
    keywords:
      - name: financial_advice
        operator: OR
        keywords:
          - I need advice on investment strategies
          - Can you help me with financial planning?
          - What should I do with my retirement savings?
        case_sensitive: false
    domains:
      - name: economics
        description: Economics and financial topics
      - name: business
        description: Business and management
  decisions:
    - name: investment_advice
      description: Financial advice with comprehensive protection
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: financial_advice
          - type: domain
            name: economics
      modelRefs:
        - model: gpt-4o
          use_reasoning: false
      plugins:
        - type: system_prompt
        - type: response_cache
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      enabled: true
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings: {}
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
