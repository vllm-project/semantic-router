version: v0.5
providers:
  defaults:
    model: qwen-2.5-32b
    reasoning_effort: high
  models:
    - name: qwen-2.5-32b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 2
        completion_per_1m: 4
      loras:
        - name: enterprise-assistant
          description: Enterprise assistant
    - name: qwen-2.5-72b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 3
        completion_per_1m: 6
      loras:
        - name: enterprise-specialist
          description: Enterprise domain specialist
        - name: compliance-expert
          description: Compliance and security expert
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings: {}
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
  plugins:
    - type: response_cache
      configuration:
        enabled: true
        scope: global
        semantic:
          match:
            recall:
              min_similarity: 0.8
              top_k: 1
recipes:
  - name: default
    signals:
      keywords:
        - name: compliance
          operator: OR
          keywords:
            - compliance
            - regulation
            - audit
            - policy
          case_sensitive: false
        - name: confidential
          operator: OR
          keywords:
            - confidential
            - sensitive
            - private
            - restricted
          case_sensitive: false
        - name: business_analysis
          operator: OR
          keywords:
            - I need to analyze business metrics and performance
            - Can you help me with strategic business planning?
            - We need insights on market trends and competition
          case_sensitive: false
        - name: legal_review
          operator: OR
          keywords:
            - This document needs legal review and compliance check
            - We need to ensure regulatory compliance
            - Can you review this for legal implications?
          case_sensitive: false
      domains:
        - name: business
          description: Business and management
        - name: law
          description: Legal questions and law-related topics
        - name: economics
          description: Economics and financial topics
    decisions:
      - name: compliance_legal
        description: Compliance and legal queries with full protection
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: compliance
            - type: keyword
              name: legal_review
            - type: domain
              name: law
        modelRefs:
          - model: qwen-2.5-72b
            use_reasoning: false
        plugins:
          - type: system_prompt
          - type: response_cache
          - type: header_mutation
      - name: confidential_business
        description: Confidential business analysis
        priority: 90
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: confidential
            - type: keyword
              name: business_analysis
            - type: domain
              name: business
        modelRefs:
          - model: qwen-2.5-72b
            use_reasoning: false
        plugins:
          - type: response_cache
          - type: header_mutation
      - name: general_business
        description: General business and economics queries
        priority: 50
        rules:
          operator: OR
          conditions:
            - type: keyword
              name: business_analysis
            - type: domain
              name: economics
        modelRefs:
          - model: qwen-2.5-72b
            use_reasoning: false
        plugins:
          - type: response_cache
