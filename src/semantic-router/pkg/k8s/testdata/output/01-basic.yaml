version: v0.3
providers:
  defaults:
    model: qwen-2.5-7b
    reasoning_effort: high
  models:
    - name: qwen-2.5-7b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 0.5
        completion_per_1m: 1
    - name: qwen-2.5-72b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 3
        completion_per_1m: 6
routing:
  modelCards:
    - name: qwen-2.5-7b
      loras:
        - name: tech-support
          description: Technical support specialist
    - name: qwen-2.5-72b
      loras:
        - name: advanced-reasoning
          description: Advanced reasoning and problem solving
  signals:
    keywords:
      - name: urgent
        operator: OR
        keywords:
          - urgent
          - emergency
          - asap
        case_sensitive: false
      - name: tech_support
        operator: OR
        keywords:
          - I need help with technical issues
          - Can you help me troubleshoot this problem?
          - Something is not working correctly
        case_sensitive: false
    domains:
      - name: computer science
        description: Computer science and programming
      - name: math
        description: Mathematics and quantitative reasoning
  decisions:
    - name: urgent_tech
      description: Urgent technical support requests - use large model with reasoning
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: urgent
          - type: keyword
            name: tech_support
      modelRefs:
        - model: qwen-2.5-72b
          lora_name: advanced-reasoning
          use_reasoning: true
          reasoning_effort: high
      plugins:
        - type: semantic-cache
    - name: general_tech
      description: General technical queries - use small model for efficiency
      priority: 50
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: tech_support
          - type: domain
            name: computer science
      modelRefs:
        - model: qwen-2.5-7b
          lora_name: tech-support
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      enabled: false
      ttl_seconds: 0
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ""
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
