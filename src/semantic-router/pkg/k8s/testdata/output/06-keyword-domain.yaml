version: v0.5
providers:
  defaults:
    model: deepseek-v3
    reasoning_effort: high
  models:
    - name: deepseek-v3
      reasoning:
        family: deepseek
      pricing:
        prompt_per_1m: 0.27
        completion_per_1m: 1.1
      loras:
        - name: homework-helper
          description: Homework assistance specialist
    - name: deepseek-r1
      reasoning:
        family: deepseek
      pricing:
        prompt_per_1m: 0.55
        completion_per_1m: 2.2
      loras:
        - name: academic-expert
          description: Advanced academic problem solver
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings: {}
    system: {}
  plugins:
    - type: response_cache
      configuration:
        enabled: true
        scope: global
        semantic:
          match:
            recall:
              min_similarity: 0.8
              top_k: 1
recipes:
  - name: default
    signals:
      keywords:
        - name: homework
          operator: OR
          keywords:
            - homework
            - assignment
            - exercise
            - problem set
          case_sensitive: false
      domains:
        - name: math
          description: Mathematics and quantitative reasoning
        - name: physics
          description: Physics and physical sciences
        - name: chemistry
          description: Chemistry and chemical sciences
    decisions:
      - name: math_homework
        description: Math homework assistance - use reasoning model
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: homework
            - type: domain
              name: math
        modelRefs:
          - model: deepseek-r1
            lora_name: academic-expert
            use_reasoning: true
            reasoning_effort: medium
      - name: science_homework
        description: Science homework assistance - use fast model
        priority: 90
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: homework
            - type: domain
              name: physics
        modelRefs:
          - model: deepseek-v3
            lora_name: homework-helper
            use_reasoning: false
