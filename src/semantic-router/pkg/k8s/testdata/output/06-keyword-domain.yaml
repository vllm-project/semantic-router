version: v0.3
providers:
  defaults:
    model: deepseek-v3
    reasoning_effort: high
  models:
    - name: deepseek-v3
      reasoning:
        family: deepseek
      pricing:
        prompt_per_1m: 0.27
        completion_per_1m: 1.1
    - name: deepseek-r1
      reasoning:
        family: deepseek
      pricing:
        prompt_per_1m: 0.55
        completion_per_1m: 2.2
routing:
  modelCards:
    - name: deepseek-v3
      loras:
        - name: homework-helper
          description: Homework assistance specialist
    - name: deepseek-r1
      loras:
        - name: academic-expert
          description: Advanced academic problem solver
  signals:
    keywords:
      - name: homework
        operator: OR
        keywords:
          - homework
          - assignment
          - exercise
          - problem set
        case_sensitive: false
    domains:
      - name: math
        description: Mathematics and quantitative reasoning
      - name: physics
        description: Physics and physical sciences
      - name: chemistry
        description: Chemistry and chemical sciences
  decisions:
    - name: math_homework
      description: Math homework assistance - use reasoning model
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: homework
          - type: domain
            name: math
      modelRefs:
        - model: deepseek-r1
          lora_name: academic-expert
          use_reasoning: true
          reasoning_effort: medium
    - name: science_homework
      description: Science homework assistance - use fast model
      priority: 90
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: homework
          - type: domain
            name: physics
      modelRefs:
        - model: deepseek-v3
          lora_name: homework-helper
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      enabled: false
      ttl_seconds: 0
    memory:
      default_retrieval_limit: 0
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
    looper: {}
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ""
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
