version: v0.3
providers:
  defaults:
    model: qwen-2.5-14b
    reasoning_effort: high
  models:
    - name: qwen-2.5-14b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 1
        completion_per_1m: 2
    - name: qwen-2.5-72b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 3
        completion_per_1m: 6
routing:
  modelCards:
    - name: qwen-2.5-14b
      loras:
        - name: support-agent
          description: Customer support agent
    - name: qwen-2.5-72b
      loras:
        - name: emergency-specialist
          description: Emergency support specialist
  signals:
    keywords:
      - name: urgent
        operator: OR
        keywords:
          - urgent
          - emergency
          - critical
        case_sensitive: false
      - name: support_request
        operator: OR
        keywords:
          - I need immediate assistance
          - Please help me resolve this issue
          - Can someone help me urgently?
        case_sensitive: false
  decisions:
    - name: urgent_support
      description: Urgent support requests - use large model with reasoning
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: urgent
          - type: keyword
            name: support_request
      modelRefs:
        - model: qwen-2.5-72b
          lora_name: emergency-specialist
          use_reasoning: true
          reasoning_effort: high
    - name: general_support
      description: General support requests - use small model
      priority: 50
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: urgent
          - type: keyword
            name: support_request
      modelRefs:
        - model: qwen-2.5-14b
          lora_name: support-agent
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      enabled: true
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings: {}
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
