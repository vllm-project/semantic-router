version: v0.3
providers:
  defaults:
    model: qwen-2.5-7b
    reasoning_effort: high
  models:
    - name: qwen-2.5-7b
      reasoning:
        family: qwen3
    - name: qwen-2.5-72b
      reasoning:
        family: qwen3
routing:
  modelCards:
    - name: qwen-2.5-7b
    - name: qwen-2.5-72b
  signals:
    keywords:
      - name: long_report
        operator: OR
        keywords:
          - full report
          - long report
        case_sensitive: false
  decisions:
    - name: long_report
      description: Long reports get more time and their own fallback policy
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: long_report
      modelRefs:
        - model: qwen-2.5-72b
          use_reasoning: false
      reliability:
        total_timeout: 600s
        per_try_timeout: 300s
        retry_count: 1
        retry_on: reset
        retriable_status_codes:
          - 429
      fallback:
        enabled: true
        max_attempts: 2
        total_timeout: 15m0s
        per_attempt_timeout: 7m30s
        retryable_status_codes:
          - 502
          - 503
          - 504
    - name: default_route
      description: Everything else keeps the provider model's reliability and the router's fallback
      priority: 10
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: long_report
      modelRefs:
        - model: qwen-2.5-7b
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        concurrency_threshold: 5
        max_concurrency: 8
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      enabled: false
      ttl_seconds: 0
    memory: {}
  integrations:
    tools:
      enabled: true
      top_k: 3
      similarity_threshold: 0.2
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
    looper: {}
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ""
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system:
      prompt_guard: models/mmbert32k-jailbreak-detector-merged
      domain_classifier: models/mmbert32k-intent-classifier-merged
      pii_classifier: models/mmbert32k-pii-detector-merged
    modules:
      safety:
        safety:
          use_cpu: false
        hazard:
          use_cpu: false
      prompt_compression:
        enabled: false
        max_tokens: 0
      prompt_guard:
        enabled: true
        model_id: ""
        threshold: 0.7
        use_cpu: true
        jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
        model_ref: prompt_guard
      classifier:
        domain:
          model_id: ""
          threshold: 0.5
          use_cpu: true
          category_mapping_path: models/mmbert32k-intent-classifier-merged/category_mapping.json
          model_ref: domain_classifier
        mcp:
          enabled: false
          transport_type: ""
          threshold: 0
        pii:
          model_id: ""
          threshold: 0.9
          use_cpu: true
          pii_mapping_path: models/mmbert32k-pii-detector-merged/pii_type_mapping.json
          model_ref: pii_classifier
        preference: {}
      complexity: {}
      hallucination_mitigation:
        fact_check:
          model_id: ""
          threshold: 0
          use_cpu: false
        detector:
          model_id: ""
          threshold: 0
          use_cpu: false
      feedback_detector:
        enabled: false
        model_id: ""
        threshold: 0
        use_cpu: false
        feedback_mapping_path: ""
      modality_detector:
        enabled: false
