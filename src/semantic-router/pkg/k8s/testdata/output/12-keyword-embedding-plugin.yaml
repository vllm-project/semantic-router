version: v0.5
providers:
  defaults:
    model: qwen-2.5-32b
    reasoning_effort: high
  models:
    - name: qwen-2.5-32b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 2
        completion_per_1m: 4
      loras:
        - name: api-router
          description: API routing specialist
    - name: qwen-2.5-72b
      reasoning:
        family: qwen3
      pricing:
        prompt_per_1m: 3
        completion_per_1m: 6
      loras:
        - name: advanced-router
          description: Advanced API routing expert
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings: {}
    system: {}
  plugins:
    - type: response_cache
      configuration:
        enabled: true
        scope: global
        semantic:
          match:
            recall:
              min_similarity: 0.8
              top_k: 1
recipes:
  - name: default
    signals:
      keywords:
        - name: security
          operator: OR
          keywords:
            - security
            - vulnerability
            - exploit
            - hack
          case_sensitive: false
        - name: threat_detection
          operator: OR
          keywords:
            - I found a security vulnerability in the system
            - There's a potential exploit that needs attention
            - We need to patch this security issue
          case_sensitive: false
    decisions:
      - name: security_alert
        description: Security-related queries with guided handling
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: security
            - type: keyword
              name: threat_detection
        modelRefs:
          - model: qwen-2.5-72b
            use_reasoning: false
        plugins:
          - type: system_prompt
          - type: header_mutation
