version: v0.5
providers:
  defaults:
    model: gemma-2-9b
    reasoning_effort: high
  models:
    - name: gemma-2-9b
      pricing:
        prompt_per_1m: 0.39999999999999997
        completion_per_1m: 0.7999999999999999
      loras:
        - name: greeting-handler
          description: Optimized for greeting responses
    - name: gemma-2-27b
      pricing:
        prompt_per_1m: 2
        completion_per_1m: 4
      loras:
        - name: urgent-specialist
          description: Specialized in handling urgent requests
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings: {}
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
  plugins:
    - type: response_cache
      configuration:
        enabled: true
        scope: global
        semantic:
          match:
            recall:
              min_similarity: 0.8
              top_k: 1
recipes:
  - name: default
    signals:
      keywords:
        - name: urgent
          operator: OR
          keywords:
            - urgent
            - emergency
            - critical
            - asap
          case_sensitive: false
        - name: greeting
          operator: OR
          keywords:
            - hello
            - hi
            - hey
            - greetings
          case_sensitive: false
    decisions:
      - name: urgent_request
        description: Handle urgent requests with larger model
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: urgent
        modelRefs:
          - model: gemma-2-27b
            lora_name: urgent-specialist
            use_reasoning: false
      - name: greeting_response
        description: Handle greetings with fast small model
        priority: 50
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: greeting
        modelRefs:
          - model: gemma-2-9b
            lora_name: greeting-handler
            use_reasoning: false
