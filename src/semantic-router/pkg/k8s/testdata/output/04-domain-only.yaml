version: v0.3
providers:
  defaults:
    model: mistral-7b
    reasoning_effort: high
  models:
    - name: mistral-7b
      pricing:
        prompt_per_1m: 0.7
        completion_per_1m: 1.4
    - name: mistral-large
      pricing:
        prompt_per_1m: 3
        completion_per_1m: 9
routing:
  modelCards:
    - name: mistral-7b
      loras:
        - name: stem-tutor
          description: STEM education tutor
    - name: mistral-large
      loras:
        - name: math-expert
          description: Mathematics specialist
        - name: science-expert
          description: Science specialist
  signals:
    domains:
      - name: math
        description: Mathematics and quantitative reasoning
      - name: physics
        description: Physics and physical sciences
      - name: computer science
        description: Computer science and programming
      - name: chemistry
        description: Chemistry and chemical sciences
  decisions:
    - name: stem_query
      description: Complex STEM domain queries - use large model
      priority: 100
      rules:
        operator: OR
        conditions:
          - type: domain
            name: math
          - type: domain
            name: physics
          - type: domain
            name: computer science
      modelRefs:
        - model: mistral-large
          lora_name: math-expert
          use_reasoning: false
    - name: chemistry_query
      description: Chemistry domain queries - use small model
      priority: 80
      rules:
        operator: AND
        conditions:
          - type: domain
            name: chemistry
      modelRefs:
        - model: mistral-7b
          lora_name: stem-tutor
          use_reasoning: false
global:
  router:
    config_source: kubernetes
    list_backend_models: false
    clear_route_cache: false
    streamed_body:
      enabled: false
    skip_processing:
      enabled: false
    model_selection: {}
  services:
    api:
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1
          duration_buckets:
            - 0.001
            - 0.005
            - 0.01
            - 0.025
            - 0.05
            - 0.1
            - 0.25
            - 0.5
            - 1
            - 2.5
            - 5
            - 10
            - 30
          size_buckets:
            - 1
            - 2
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
          enabled: true
          detailed_goroutine_tracking: true
    response_api:
      enabled: false
      ttl_seconds: 0
      max_responses: 0
    observability:
      tracing:
        enabled: false
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-semantic-router
          service_version: v0.1.0
          deployment_environment: development
      metrics:
        windowed_metrics:
          enabled: false
      profiling:
        enabled: false
    authz: {}
    ratelimit: {}
    management_api: {}
    router_replay:
      enabled: false
      ttl_seconds: 0
    startup_status:
      store_backend: ""
  stores:
    response_cache:
      backend_type: memory
      enabled: true
      similarity_threshold: 0.8
      max_entries: 1000
      ttl_seconds: 3600
      eviction_policy: fifo
      embedding_model: mmbert
    memory:
      default_retrieval_limit: 0
  integrations:
    looper: {}
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: ""
        mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
        use_cpu: true
        embedding_config:
          model_type: mmbert
          preload_embeddings: true
          target_dimension: 768
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.5
    system: {}
    modules:
      prompt_compression:
        enabled: false
        max_tokens: 0
