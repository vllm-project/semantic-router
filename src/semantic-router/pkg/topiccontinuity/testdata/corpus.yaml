# Hand-labeled synthetic regression corpus for the topic-continuity evaluator.
#
# This is a regression suite, not calibration and not representative traffic.
# It never sets the confidence scale. Labels describe the intended meaning of
# the final user turn:
#   continuation - the live turn depends on retained history
#   change       - the live turn starts unrelated work
#   ambiguous    - a careful reader could not tell
# Subsets:
#   general      - ordinary chat and coding sessions
#   adversarial  - marker phrases in quotes, code, negations, or late positions
#   metamorphic  - one meaning, with the surface wording replaced, reordered,
#                  quoted, negated, or moved into tool output
# Turn roles: user, assistant, call (assistant tool call: id, name), result
# (tool result: id).
