version: v0.5

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    model: general-small
  models:
    - name: general-small
      provider_model_id: general-small-instruct
      api_format: openai
      backend_refs:
        - name: small-primary
          endpoint: 127.0.0.1:18000
          protocol: http
          provider: vllm
      description: fast general model
    - name: general-large
      provider_model_id: general-large-instruct
      api_format: openai
      backend_refs:
        - name: large-primary
          endpoint: https://llm.example.com/v1
          provider: openai
          auth: {header: Authorization, prefix: Bearer}
          headers:
            X-Tenant: parity-corpus
          api_key: parity-static-key
      description: strong general model
    - name: claude-compatible
      provider_model_id: claude-compatible-1
      api_format: anthropic
      backend_refs:
        - name: claude-primary
          endpoint: 127.0.0.1:18001
          protocol: http
          provider: anthropic-compatible
      description: Anthropic Messages backend
    - name: painter
      provider_model_id: painter-diffusion-1
      api_format: images
      capabilities: [image_generation]
      modalities: {input: [text], output: [image]}
      backend_refs:
        - name: painter-primary
          endpoint: 127.0.0.1:18002
          protocol: http
          provider: vllm
      description: image generation backend

recipes:
  - name: default
    signals:
      keywords:
        - name: code_keywords
          operator: OR
          keywords: ["python", "golang", "compile"]
        - name: urgent_keywords
          operator: OR
          keywords: ["urgent", "asap"]
        - name: essay_keywords
          operator: OR
          keywords: ["essay", "poem"]
        - name: image_keywords
          operator: OR
          keywords: ["draw", "sketch"]
    decisions:
      - name: image_route
        priority: 40
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: image_keywords
        output: {kind: image, action: generate}
        modelRefs:
          - model: painter
            use_reasoning: false
      - name: code_route
        priority: 30
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: code_keywords
        modelRefs:
          - model: general-large
            use_reasoning: false
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              mode: insert
              system_prompt: You are a careful senior engineer.
          - type: header_mutation
            configuration:
              add:
                - name: x-route-source
                  value: parity-corpus
      - name: urgent_route
        priority: 20
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: urgent_keywords
        modelRefs:
          - model: general-small
            use_reasoning: false
      - name: essay_route
        priority: 10
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: essay_keywords
        modelRefs:
          - model: claude-compatible
            use_reasoning: false
  - name: support
    signals:
      keywords:
        - name: refund_keywords
          operator: OR
          keywords: ["refund", "invoice"]
    decisions:
      - name: billing_route
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: refund_keywords
        modelRefs:
          - model: general-small
            use_reasoning: false

entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
    default: true
  - model_names: ["vllm-sr/support"]
    recipe: support

global:
  router:
    routing_input:
      skip_user_messages_matching:
        - '(?s)^\s*OpenClaw runtime context:.*End OpenClaw runtime context\.\s*$'
      strip_blocks:
        - start: '<relevant-memories>'
          end: '</relevant-memories>'
