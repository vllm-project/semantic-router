# A recipe's data_policy is removed. replay: false forbade replay capture for
# every request of the recipe, even where a decision's router_replay plugin
# recorded: the recipe's router_replay plugin is disabled now, and so is the
# decision's. replay_personal_data: false forbade capturing personal data, as
# capture_personal_data: false does now. A policy that forbade nothing goes.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    data_policy: {replay: true}
    decisions:
      - name: chat
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
  - name: private
    data_policy:
      replay: false
    decisions:
      - name: recorded
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: router_replay
            configuration: {enabled: true, capture_response_body: true}
  - name: redacted
    data_policy: {replay_personal_data: false}
    decisions:
      - name: support
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: router_replay
            configuration: {enabled: true, capture_personal_data: true}
entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
    default: true
  - model_names: [team/private]
    recipe: private
  - model_names: [team/redacted]
    recipe: redacted
