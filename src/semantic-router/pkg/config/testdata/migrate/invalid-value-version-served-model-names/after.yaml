# A name a v0.3 document served by default that an entrypoint of the
# document serves already stays that entrypoint's: here MoM, which the
# private recipe serves. The default recipe keeps vllm-sr/auto and auto.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
entrypoints:
  - model_names: [vllm-sr/auto, auto]
    recipe: default
    default: true
  - model_names: [MoM]
    recipe: private
recipes:
  - name: default
    decisions:
      - name: chat
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
  - name: private
    decisions:
      - name: local
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
