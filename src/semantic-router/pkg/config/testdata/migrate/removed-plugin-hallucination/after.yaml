# A hallucination plugin is a response_guard rule over the fact_check rule
# needs_fact_check and a hallucination rule; in a decision that also had a
# response_jailbreak plugin, it joins the guard that plugin became.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: default
      priority: 1
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
entrypoints:
  - {model_names: [vllm-sr/grounded], recipe: grounded}
recipes:
  - name: grounded
    routing:
      signals:
        fact_check:
          - name: needs_fact_check
            description: Prompts whose answers are worth checking.
        jailbreak:
          - name: unsafe_answer
            direction: response
            threshold: 0.7
        hallucination:
          - name: ungrounded_claims
            description: Answers with claims their grounding context does not support.
      decisions:
        - name: grounded
          priority: 100
          rules: {operator: AND, conditions: []}
          modelRefs: [{model: general}]
          plugins:
            - type: response_guard
              configuration:
                rules:
                  - when:
                      type: jailbreak
                      name: unsafe_answer
                    action: annotate
                  - when:
                      operator: AND
                      conditions:
                        - type: fact_check
                          name: needs_fact_check
                        - type: hallucination
                          name: ungrounded_claims
                    action: annotate
                    details: true
                on_unknown: annotate
