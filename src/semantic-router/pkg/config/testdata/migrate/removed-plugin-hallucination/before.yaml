# A hallucination plugin is a response_guard rule over the fact_check rule
# needs_fact_check and a hallucination rule; in a decision that also had a
# response_jailbreak plugin, it joins the guard that plugin became.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
    default: true
  - {model_names: [vllm-sr/grounded], recipe: grounded}
recipes:
  - name: default
    decisions:
      - name: default
        priority: 1
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
  - name: grounded
    signals:
      fact_check:
        - name: needs_fact_check
          description: Prompts whose answers are worth checking.
      jailbreak:
        - name: unsafe_answer
          direction: response
          threshold: 0.7
    decisions:
      - name: grounded
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: response_jailbreak
            configuration: {enabled: true}
          - type: hallucination
            configuration:
              enabled: true
              hallucination_action: body
              unverified_factual_action: body
