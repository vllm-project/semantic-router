# A safety rule's hazard part. The first two rules are the v0.4 safety
# tutorial's: a hazard rule's Vela 1.0 Hazard categories become the harm
# categories they name, and hazard.threshold the predicate. A category named
# like a harm category is that category; one that names none is noted, and a
# rule with no harm category left matches an unsafe request, as its threshold
# did.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      safety:
        - name: unsafe-content
          predicate:
            gte: 0.5
        - name: unsafe-privacy
          labels: [PII/Privacy, S7]
          predicate:
            gte: 0.6
        - name: violent
          description: Violent or weapons content.
          labels: [Violence, Threat, S1, Guns and Illegal Weapons, S9]
          predicate:
            gte: 0.7
        - name: abuse
          labels: [Harassment, Threat]
          predicate:
            gte: 0.5
        - name: spam
          predicate:
            gte: 0.8
    decisions:
      - name: unsafe-privacy-content
        priority: 310
        rules: {type: safety, name: unsafe-privacy}
        modelRefs: [{model: general}]
      - name: unsafe-content
        priority: 300
        rules:
          operator: OR
          conditions:
            - {type: safety, name: unsafe-content}
            - {type: safety, name: violent}
            - {type: safety, name: abuse}
            - {type: safety, name: spam}
        modelRefs: [{model: general}]
