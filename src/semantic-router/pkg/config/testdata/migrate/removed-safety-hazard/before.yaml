# A safety rule's hazard part names labels migrate cannot map to the harm
# categories.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    safety:
      - name: harmful
        threshold: 0.5
        hazard: {labels: [violence, privacy, other], categories: [violence], threshold: 0.6}
  decisions:
    - name: refuse
      priority: 100
      rules: {type: safety, name: harmful}
      modelRefs: [{model: general}]
