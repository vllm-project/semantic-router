version: v0.5
providers:
  models:
    - name: general
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:8000
          weight: 1
  defaults:
    model: general
recipes:
  - name: default
    signals:
      domains:
        - {name: math, labels: [math]}
    decisions:
      - name: math
        priority: 100
        rules: {operator: AND, conditions: [{type: domain, name: math}]}
        modelRefs: [{model: general, use_reasoning: false}]
global:
  plugins:
    - type: context
      configuration:
        enabled: true
        compress:
          signals:
            enabled: true
            max_tokens: 512
            min_length: 256
            textrank_weight: 0.2
            position_weight: 0.4
            tfidf_weight: 0.4
            position_depth: 0.5
