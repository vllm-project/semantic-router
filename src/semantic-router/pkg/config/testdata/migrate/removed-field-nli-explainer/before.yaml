# The NLI explainer is retired: a hallucination rule's use_nli, the response
# cache's polarity guard, the explainer's system line and binding go, and the
# fusion grounding's NLI penalty is its contradiction penalty.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
    - name: strong
      backend_refs: [{name: strong, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
recipes:
  - name: default
    model_bindings:
      hallucination_explainer: primary
    signals:
      hallucination:
        - {name: ungrounded, use_nli: true}
    decisions:
      - name: grounded
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}, {model: strong}]
        algorithm:
          type: fusion
          fusion:
            grounding:
              nli_contradiction_penalty: 0.5
        plugins:
          - type: response_guard
            configuration:
              rules: [{when: {type: hallucination, name: ungrounded}, action: annotate}]
global:
  stores:
    response_cache:
      backend_type: memory
      polarity_guard: nli
  model_catalog:
    system:
      hallucination_explainer: models/mom-halugate-explainer
