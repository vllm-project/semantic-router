# Without auto_model_names, the default recipe answered vllm-sr/auto, auto and
# the auto_model_name. All three become the model_names of its entrypoint.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: chat
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
entrypoints:
  - model_names: [vllm-sr/auto, auto, reference]
    recipe: default
