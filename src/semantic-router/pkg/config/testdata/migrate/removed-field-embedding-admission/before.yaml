# Admission by an embedding model keyword is the admission of the deployment
# the keyword implied: mmbert's is vela-embedding's.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: faq
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
global:
  model_catalog:
    admission:
      "embedding:mmbert": {max_concurrency: 4, max_queue: 16}
