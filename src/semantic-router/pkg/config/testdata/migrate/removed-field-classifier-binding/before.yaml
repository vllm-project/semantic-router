# A binding that asked a classifier head (a label_distribution, label_scores,
# label_decision, score or token_spans contract) named a model no signal asks
# any more: migrate drops it, and the decision model answers the signal.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      pii:
        - name: personal
          predicate: {gte: 0.5}
      safety:
        - name: harmful
          labels: [Harassment]
          predicate: {gte: 0.5}
    model_bindings:
      pii:
        deployment: pii-encoder
        contract: token_spans.v1
        adapter: modernbert
      safety.harmful:
        deployment: safety-encoder
        contract: label_distribution.v1
    decisions:
      - name: guard
        priority: 100
        rules: {operator: OR, conditions: [{type: pii, name: personal}, {type: safety, name: harmful}]}
        modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      pii-encoder:
        provider: model_runtime
        artifact: vllm-sr/Vela-1.0-Encoder-307M-PII
      safety-encoder:
        provider: model_runtime
        artifact: vllm-sr/Vela-1.0-Encoder-307M-Safety
