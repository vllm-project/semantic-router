# Before v0.5 a projection partition synthesized its default member when no
# member matched, so a domain rule named for no domain matched as the
# default: migrate keeps it with labels [other], and the decision on it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      domains:
        - {name: math}
        - {name: general, description: General knowledge and conversation, labels: [other]}
    projections:
      partitions:
        - {name: subjects, semantics: exclusive, members: [math, general], default: general}
    decisions:
      - name: general
        priority: 100
        rules: {type: domain, name: general}
        modelRefs: [{model: general}]
