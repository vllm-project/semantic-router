# The replay service says where records are stored; recording and what a
# record captures are a router_replay plugin in global.plugins, where
# capture_personal_data: true is prompt_capture: raw.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
global:
  services:
    router_replay:
      store_backend: memory
      ttl_seconds: 3600
  plugins:
    - type: router_replay
      configuration:
        enabled: true
        capture_request_body: false
        prompt_capture: raw
recipes:
  - name: default
    decisions:
      - name: everything
        rules: {}
        modelRefs: [{model: general}]
        plugins:
          - type: router_replay
            configuration: {capture_response_body: false}
