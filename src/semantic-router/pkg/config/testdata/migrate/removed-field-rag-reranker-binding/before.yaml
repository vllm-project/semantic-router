# The rag.reranker binding is removed: the decision model judges RAG relevance.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: chat
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
global:
  model_catalog:
    bindings:
      rag.reranker: primary
