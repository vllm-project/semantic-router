# The image_gen plugin handed a decision to an image backend of its own; an
# image model the decision references and an output contract replace it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: images
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: image_gen
            configuration:
              enabled: true
              backend: vllm_omni
              backend_config: {base_url: "http://image-router:8005", model: Qwen/Qwen-Image}
