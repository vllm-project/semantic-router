# The prompt guard, PII and hallucination detector modules, the chat guard's
# external model fields and the batch concurrency of the removed modules: a
# module's threshold becomes the predicate of the rules that inherited it, and
# a decision-task binding is named for its signal type.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    model_bindings:
      pii_classifier: {deployment: primary, contract: decision.v1}
    signals:
      jailbreak:
        - {name: attack}
      pii:
        - {name: contact}
      hallucination:
        - {name: ungrounded}
    decisions:
      - name: blocked
        priority: 200
        rules:
          operator: OR
          conditions:
            - {type: jailbreak, name: attack}
            - {type: pii, name: contact}
        modelRefs: [{model: general}]
      - name: answer
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: response_guard
            configuration:
              rules: [{when: {type: hallucination, name: ungrounded}, action: annotate}]
global:
  services:
    api:
      batch_classification: {max_batch_size: 50, max_concurrency: 8, concurrency_threshold: 5}
  model_catalog:
    system:
      prompt_guard: models/Vela-1.0-Encoder-307M-Guard
      pii_classifier: models/Vela-1.0-Encoder-307M-PII
      hallucination_detector: models/vela-halu
    bindings:
      prompt_guard: {deployment: primary, contract: label_distribution.v1}
    admission:
      prompt_guard: {max_concurrency: 2}
    external:
      - name: guard
        model_role: guardrail
        llm_model_name: guard-v1
        llm_endpoint: {address: 127.0.0.1, port: 8001}
        parser_type: json
        threshold: 0.5
    modules:
      prompt_guard: {threshold: 0.7}
      classifier:
        pii: {threshold: 0.4}
      hallucination_mitigation:
        detector: {threshold: 0.6}
