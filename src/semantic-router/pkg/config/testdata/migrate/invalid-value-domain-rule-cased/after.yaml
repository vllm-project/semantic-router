# Before v0.5 a domain rule without labels or mmlu_categories matched the
# domain its name was in any case: migrate writes the name in lower case, in
# the rule and each condition, score input and partition that names it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      domains:
        - {name: math, description: Mathematics}
        - {name: physics}
    projections:
      partitions:
        - {name: sciences, semantics: exclusive, members: [math, physics], default: math}
      scores:
        - name: quantitative
          method: weighted_sum
          inputs:
            - {type: domain, name: math, weight: 1}
      mappings:
        - name: quantitative_band
          source: quantitative
          method: threshold_bands
          outputs: [{name: quantitative_heavy, gte: 0.5}]
    decisions:
      - name: math
        priority: 100
        rules: {type: domain, name: math}
        modelRefs: [{model: general}]
