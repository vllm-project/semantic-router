# Memory's retrieval_limit and similarity_threshold become the source's
# match.recall; an unset threshold is the memory store's default.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: assistant
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
      plugins:
        - type: context
          configuration:
            enabled: true
            sources:
              - type: memory
                match:
                  recall:
                    method: embedding
                    top_k: 8
                    min_similarity: 0.45
global:
  stores:
    memory:
      default_similarity_threshold: 0.45
