# The learned signal types the Router no longer has become turn_relation rules
# and systemone questions, and their conditions follow them.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      reasks:
        - {name: asked_again, description: The user repeats the question, threshold: 0.8, lookback_turns: 2}
      topic_continuity:
        - name: thread
          limits: {max_prior_turns: 3}
      classifiers:
        - name: risk
          labels: [SAFE, RISKY]
          instructions: Is the request risky?
      preferences:
        - {name: concise, description: Short answers, examples: [keep it short]}
        - {name: detailed, description: Thorough answers}
      embeddings:
        - name: billing
          threshold: 0.7
          candidates: [refund my order, update my card]
          aggregation_method: max
        - name: shipping
          threshold: 0.7
          candidates: [where is my parcel]
          aggregation_method: max
    projections:
      partitions:
        - name: support_intents
          semantics: exclusive
          members: [billing, shipping]
          default: billing
    decisions:
      - name: escalate
        priority: 300
        rules:
          operator: OR
          conditions:
            - {type: reask, name: asked_again}
            - {type: classifier, name: risk, label: RISKY}
        modelRefs: [{model: general}]
      - name: brief
        priority: 200
        rules: {type: preference, name: concise}
        modelRefs: [{model: general}]
      - name: billing
        priority: 100
        rules: {type: embedding, name: billing}
        modelRefs: [{model: general}]
