# The actions are the systemone choice question action, its options described
# by the action rules' descriptions; a condition names the action as its
# label, and a projection input names it as action:<action>.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      systemone:
        - name: action
          description: The action the request asks for.
          question:
            type: choice
            instructions: Which action does this request ask for?
            choices:
              - key: generate
                description: Write new code or another new artifact, such as a function, script, class, component or project scaffold.
              - key: explain
                description: Describe code or answer a question without editing anything.
              - key: fix
                description: Fix or debug something that is broken, failing or raising an error.
              - key: refactor
                description: Restructure, rename, simplify or clean up existing code without changing what it does.
              - key: test
                description: Write or improve tests, test cases or test coverage.
              - key: other
                description: Anything else, or no action is named.
    projections:
      scores:
        - name: repair_pressure
          method: weighted_sum
          inputs:
            - {type: systemone, name: 'action:fix', weight: 1.0}
      mappings:
        - name: repair_band
          source: repair_pressure
          method: threshold_bands
          outputs: [{name: repair_high, gte: 0.5}]
    decisions:
      - name: explain
        priority: 100
        rules: {type: systemone, name: action, label: explain}
        modelRefs: [{model: general}]
      - name: repair
        priority: 90
        rules:
          operator: OR
          conditions:
            - {type: systemone, name: action, label: fix}
            - {type: projection, name: repair_high}
        modelRefs: [{model: general}]
