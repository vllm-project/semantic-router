# signals.decision is named signals.systemone, in the default recipe and in another recipe.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
    default: true
  - {model_names: [vllm-sr/support], recipe: support}
recipes:
  - name: default
    signals:
      decision:
        - name: needs_tools
          question: {type: noul, instructions: "Does the request need a tool?"}
    decisions:
      - name: tools
        priority: 100
        rules: {type: systemone, name: needs_tools}
        modelRefs: [{model: general}]
  - name: support
    signals:
      decision:
        - name: billing
          question:
            type: choice
            instructions: Which team should handle this request?
            choices: [{key: billing}, {key: other}]
          labels: [billing]
    decisions:
      - name: billing
        priority: 100
        rules: {type: systemone, name: billing}
        modelRefs: [{model: general}]
