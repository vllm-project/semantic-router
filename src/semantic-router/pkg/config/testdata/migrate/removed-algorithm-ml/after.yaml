# The knn, kmeans, svm and mlp selectors are the systemone selector, which needs
# no trained model, or static for a decision with one candidate: the global ml
# block and the unused selection method go.
version: v0.5
providers:
  defaults: {model: small}
  models:
    - name: small
      backend_refs: [{name: small, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
      description: Fast general model
    - name: large
      backend_refs: [{name: large, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
      description: Strong reasoning model
recipes:
  - name: default
    decisions:
      - name: knn-route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: small}, {model: large}]
        algorithm: {type: systemone, systemone: {instructions: 'Which candidate model best fits this request?'}}
      - name: kmeans-route
        priority: 90
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: small}, {model: large}]
        algorithm: {type: systemone, systemone: {instructions: 'Which candidate model best fits this request?'}}
      - name: svm-route
        priority: 80
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: large}]
        algorithm: {type: static}
      - name: mlp-route
        priority: 70
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: small}, {model: large}]
        algorithm:
          type: systemone
          systemone:
            instructions: Which candidate model best fits this request?
global:
  router:
    model_selection:
      enabled: true
