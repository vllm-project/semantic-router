# A context_compression plugin becomes the context plugin's compress block and
# budget: target_tokens is budget.max_tokens, which also starts compression.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: agent
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: context_compression
            configuration:
              enabled: true
              mode: auto
              budget: {trigger_tokens: auto, target_tokens: 6000, reserve_output_tokens: auto}
              targets:
                tool_outputs: {mode: extractive, min_tokens: 2000, target_tokens: 1000}
                history: {mode: preserve}
              scoring: {method: bm25}
              recovery: {enabled: false}
              failure_mode: fail_open
