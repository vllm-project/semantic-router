# The automix_entailment verifier is the decision model's answer_check question:
# its threshold is escalate.accept.systemone.gte, its timeout timeout_ms, and the
# verifier server is no longer called. on_error: fail is kept.
version: v0.5
providers:
  defaults: {model: small}
  models:
    - name: small
      pricing: {prompt_per_1m: 0.1, completion_per_1m: 0.2}
      backend_refs: [{name: small, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
      description: Fast general model
    - name: large
      pricing: {prompt_per_1m: 3, completion_per_1m: 6}
      backend_refs: [{name: large, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
      description: Strong reasoning model
recipes:
  - name: default
    decisions:
      - name: verified
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: small}, {model: large}]
        algorithm:
          type: escalate
          escalate:
            order: cost
            accept:
              systemone:
                gte: 0.8
                timeout_ms: 5000
          on_error: fail
