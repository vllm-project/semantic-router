# The retention directive emits held is the decision's retention attribute.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: private-chat
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        retention: {drop: true}
