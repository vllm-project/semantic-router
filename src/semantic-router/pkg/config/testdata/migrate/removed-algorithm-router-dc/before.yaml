# router_dc is the systemone selector: the decision model chooses by the
# candidates' descriptions where router_dc compared embeddings, and the global
# router_dc block goes with it.
version: v0.3
providers:
  defaults: {model: small}
  models:
    - name: small
      backend_refs: [{name: small, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
    - name: large
      backend_refs: [{name: large, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
routing:
  modelCards:
    - {name: small, description: Fast general model}
    - {name: large, description: Strong reasoning model}
  decisions:
    - name: pick
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: small}, {model: large}]
      algorithm:
        type: router_dc
        router_dc: {temperature: 0.1, use_capabilities: true}
global:
  router:
    model_selection:
      enabled: true
      router_dc: {temperature: 0.07, require_descriptions: true}
