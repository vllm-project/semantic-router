# Rules, bindings and an admission gate that named a classify deployment. The
# deployment is dropped with what names it, and the decision model answers
# those signals: the unsafe-content rule is the v0.4 content-safety fragment's,
# the complexity rule a remote difficulty scorer's.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      safety:
        - {name: unsafe-content, predicate: {gte: 0.5}}
        - {name: unsafe-privacy, labels: [PII/Privacy, S7], predicate: {gte: 0.6}}
      complexity:
        - {name: needs_reasoning, labels: [hard]}
    decisions:
      - name: unsafe-privacy-content
        priority: 310
        rules: {type: safety, name: unsafe-privacy}
        modelRefs: [{model: general}]
      - name: unsafe-content
        priority: 300
        rules: {type: safety, name: unsafe-content}
        modelRefs: [{model: general}]
      - name: reasoning
        priority: 200
        rules: {type: complexity, name: needs_reasoning}
        modelRefs: [{model: general}]
