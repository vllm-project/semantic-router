# A store's embedding model keyword is the deployment it implied: mmbert is
# embeddings.default (vela-embedding), qwen3 the deployment of
# qwen3_model_path, multimodal omni-nano; the vector store's width is its
# embedding block's dimension.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: faq
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      omni-nano:
        artifact: vllm-sr/Vela-1.0-Omni-Nano
        revision: 2ff2d66385dbdd661a560ec3e8bcb45a0527d92e
        provider: model_runtime
        device: cpu
        input:
          overflow: truncate
      mom-embedding-pro:
        artifact: Qwen/Qwen3-Embedding-0.6B
        provider: model_runtime
        device: cpu
        input:
          overflow: truncate
  stores:
    response_cache:
      enabled: true
      backend_type: memory
    memory:
      enabled: false
      embedding:
        deployment: omni-nano
    vector_store:
      enabled: true
      backend_type: memory
      embedding:
        deployment: mom-embedding-pro
        dimension: 1024
