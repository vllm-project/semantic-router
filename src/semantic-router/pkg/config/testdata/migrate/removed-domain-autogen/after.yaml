# Domain conditions no longer declare the domains they name: a scope that
# declares none gets one domain rule per name.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: math
        priority: 200
        rules: {type: domain, name: math}
        modelRefs: [{model: general}]
      - name: billing
        priority: 100
        rules: {type: domain, name: billing}
        modelRefs: [{model: general}]
    signals:
      domains:
        - name: math
        - name: billing
          labels: [other]
