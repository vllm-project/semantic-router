# The external[] model with model_role memory_rewrite is the openai_chat
# deployment the memory query rewrite names: its llm_endpoint a base URL, its
# timeout, limits and generation settings carried, its key moved to an
# environment variable. Nothing reads any other external model.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
global:
  model_catalog:
    external:
      - name: summarizer
        llm_provider: vllm
        model_role: summarization
        llm_endpoint: {address: summarizer.example.com, port: 8000}
        llm_model_name: qwen3
      - name: rewriter
        llm_provider: vllm
        model_role: memory_rewrite
        llm_endpoint: {address: llm.example.com, port: 8000, protocol: http}
        llm_model_name: qwen3
        llm_timeout_seconds: 30
        access_key: written-inline-test-key
        max_tokens: 64
        temperature: 0.2
        max_response_bytes: 1048576
