# The tools plugin's policy fields at the top of its configuration, and the
# fields of the removed embedding retrieval.
version: v0.3
providers:
  defaults: {model: local}
  models:
    - name: local
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  modelCards:
    - {name: local, description: Local model}
  decisions:
    - name: private
      priority: 200
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: local}]
      plugins:
        - type: tools
          configuration:
            enabled: true
            policy:
              mode: none
              strip_tool_history: true
    - name: support
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: local}]
      plugins:
        - type: tools
          configuration:
            enabled: true
            policy:
              mode: filtered
              allow_tools: [docs.search, tickets.lookup]
              block_tools: [admin.delete]
