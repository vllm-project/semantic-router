# The global tools block: the tools plugin's semantic selection and
# tool_selection's add mode read its catalog and top_k.
version: v0.5
providers:
  defaults: {model: local}
  models:
    - name: local
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
      description: Local model
entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
    default: true
  - {model_names: [vllm-sr/support], recipe: support}
recipes:
  - name: default
    decisions:
      - name: search
        priority: 200
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: local}]
        plugins:
          - type: tools
            configuration: {enabled: true, policy: {mode: passthrough}, select: {mode: add, tools_db_path: config/tools_db.json, match: {judge: {preset: tool_rank, top_k: 5, min_ratio: 0.1}}}}
  - name: support
    decisions:
      - name: lookup
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: local}]
        plugins:
          - type: tools
            configuration:
              enabled: true
              select:
                mode: add
                tools_db_path: config/tools_db.json
                match:
                  judge:
                    preset: tool_rank
                    top_k: 5
                    min_ratio: 0.1
