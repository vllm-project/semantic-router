# The native cascade is escalate: its stages and quality move under escalate,
# each acceptance becomes accept.native with its bounds on each rule, a native
# stage needs no kind, and the budget stays the executor's own.
version: v0.3
listeners:
  - name: native
    port: 8801
    systemone:
      models: [vllm-sr/auto]
providers:
  models:
    - name: kai
      api_format: systemone
      deployment: local-kai
    - name: strong
      api_format: systemone
      provider_model_id: vllm-sr/Decision-2.0-Nox-4B
      backend_refs:
        - provider: systemone-compatible
          base_url: http://127.0.0.1:8900/v1
global:
  model_catalog:
    deployments:
      local-kai:
        provider: model_runtime
        artifact: vllm-sr/Decision-2.0-Kai-0.6B
        device: cpu
entrypoints:
  - api: systemone
    model_names: [vllm-sr/auto]
    recipe: native-decisions
recipes:
  - name: native-decisions
    routing:
      decisions:
        - name: classify
          rules: {}
          modelRefs: [{model: kai}, {model: strong}]
          algorithm:
            type: cascade
            budget: {deadline: 3s, max_calls: 2}
            quality:
              type: uncalibrated
              acceptance:
                rules:
                  - {question_type: choice, field: top_probability, predicate: {gte: 0}}
            stages:
              - name: fast
                kind: native
                model: kai
                accept:
                  rules:
                    - {question_type: choice, field: top_probability, predicate: {gte: 0.61}}
              - {name: strong, kind: native, model: strong, timeout: 1s}
