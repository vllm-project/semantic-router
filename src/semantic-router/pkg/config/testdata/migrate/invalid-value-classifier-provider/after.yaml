# A classify deployment, and an http one that named an external[] model,
# answered the removed classifier modules; no signal asks them, so migrate
# drops them, and the external model with them.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
global:
  model_catalog: {}
