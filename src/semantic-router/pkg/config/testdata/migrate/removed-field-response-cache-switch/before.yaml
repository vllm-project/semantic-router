# The response cache store no longer turns caching on: without decisions, its
# switch and threshold are a response_cache plugin in global.plugins.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
global:
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.92
