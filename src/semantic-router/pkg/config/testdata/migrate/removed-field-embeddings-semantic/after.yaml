# embeddings.semantic's remote endpoint is an openai_embeddings deployment
# that embeddings.default names; the response cache's fallback threshold
# moves to the store.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    systemone:
      - name: billing
        question:
          type: noul
          instructions: 'Is the request about any of these: refund my order?'
  decisions:
    - name: route
      priority: 100
      rules: {operator: OR, conditions: [{type: systemone, name: billing}]}
      modelRefs: [{model: general}]
global:
  model_catalog:
    embeddings:
      default: remote-embedding
    deployments:
      remote-embedding:
        provider: openai_embeddings
        endpoint: https://embed.example.com/v1
        model: BAAI/bge-m3
        auth:
          api_key_env: EMBEDDING_API_KEY
        timeout_ms: 5000
        max_retries: 2
        capabilities:
          dimensions: 1024
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      similarity_threshold: 0.7
