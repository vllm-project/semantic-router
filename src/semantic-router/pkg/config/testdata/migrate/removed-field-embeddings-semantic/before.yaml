# embeddings.semantic's remote endpoint is an openai_embeddings deployment
# that embeddings.default names; the response cache's fallback threshold
# moves to the store.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      systemone:
        - name: billing
          question:
            type: noul
            instructions: 'Is the request about any of these: refund my order?'
    decisions:
      - name: route
        priority: 100
        rules: {operator: OR, conditions: [{type: systemone, name: billing}]}
        modelRefs: [{model: general}]
global:
  model_catalog:
    embeddings:
      semantic:
        use_cpu: true
        embedding_config: {backend: openai_compatible, model_type: remote, min_score_threshold: 0.7, target_layer: 22}
        endpoint:
          base_url: https://embed.example.com/v1
          model: BAAI/bge-m3
          api_key_env: EMBEDDING_API_KEY
          timeout_seconds: 5
          max_retries: 2
          dimensions: 1024
  stores:
    response_cache:
      backend_type: memory
