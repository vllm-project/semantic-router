# Compression no longer embeds segments: embedding scoring becomes the default
# relevance judge.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: agent
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: context
            configuration:
              enabled: true
              compress:
                targets:
                  tool_outputs: {mode: extractive, min_tokens: 2000, target_tokens: 1000}
