# The memory store no longer turns memory on: its switch is a context plugin
# with a memory source in global.plugins, which a decision's own context
# plugin overrides.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
global:
  stores:
    memory:
      backend: milvus
      milvus: {address: "127.0.0.1:19530"}
  plugins:
    - type: context
      configuration:
        enabled: true
        sources:
          - type: memory
