# A route to a diffusion model reached it on the chat API, which cannot carry
# a generated image. Migrate declares the route's image output and points the
# model to the images API, noting to check that its backend serves it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
    - name: painter
      api_format: openai
      backend_refs: [{name: images, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
      modality: diffusion
recipes:
  - name: default
    signals:
      modality:
        - {name: DIFFUSION, labels: [image]}
    decisions:
      - name: image
        priority: 200
        rules: {type: modality, name: DIFFUSION}
        modelRefs: [{model: painter}]
      - name: everything
        rules: {}
        modelRefs: [{model: general}]
