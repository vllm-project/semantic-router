# RAG's top_k, similarity_threshold and rerank become the source's match block:
# recall with the same bounds, judged by the decision model's relevance preset.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: docs
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: context
            configuration:
              enabled: true
              sources:
                - type: rag
                  backend: vectorstore
                  backend_config: {vector_store_id: vs_docs}
                  match:
                    recall:
                      method: embedding
                      top_k: 12
                      min_similarity: 0.72
                    judge:
                      preset: relevance
                      top_k: 4
                      min_score: 0.5
