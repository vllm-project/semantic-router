# The prompt compression of the text the signals read is compress.signals of
# the context plugin in global.plugins, which every recipe's requests run
# before their decision. A compress block with only signals leaves the request
# whole, so a decision's block that held nothing writes mode: auto to keep
# compressing its requests.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: agent
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: context
            configuration:
              enabled: true
              compress: {mode: auto}
global:
  stores:
    memory:
      backend: milvus
      milvus: {address: "127.0.0.1:19530"}
  plugins:
    - type: context
      configuration:
        enabled: true
        sources:
          - type: memory
        compress:
          signals:
            enabled: true
            # coding keeps the first two and the last four sentences.
            profile: coding
            max_tokens: 2048
            skip_signals: [jailbreak, pii]
