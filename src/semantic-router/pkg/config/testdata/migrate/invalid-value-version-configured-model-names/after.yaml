# A name a v0.3 document served by default that names a configured model is
# not kept: an entrypoint name must be new, and a request for it reaches the
# model. Here MoM, a model's name, and auto, its provider model id. The
# default recipe keeps vllm-sr/auto.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
    - name: MoM
      provider_model_id: auto
      backend_refs: [{name: mom, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: chat
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
entrypoints:
  - model_names: [vllm-sr/auto]
    recipe: default
