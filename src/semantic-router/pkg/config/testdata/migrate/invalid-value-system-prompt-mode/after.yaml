# system_prompt replaced the caller's prompt for any mode other than insert,
# so a mode such as append is written as replace.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: support
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        plugins:
          - type: system_prompt
            configuration:
              enabled: true
              system_prompt: You are a support assistant.
              mode: replace
