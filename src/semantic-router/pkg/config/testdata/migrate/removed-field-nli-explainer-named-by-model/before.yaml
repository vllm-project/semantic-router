# A providers.models[] entry that names the retired NLI explainer's
# deployment would name nothing once migrate removes it, so migrate refuses
# until the model names the deployment that serves it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
    - name: native
      api_format: systemone
      deployment: explainer
recipes:
  - name: default
    decisions:
      - name: route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      explainer:
        provider: model_runtime
        artifact: models/mom-halugate-explainer
