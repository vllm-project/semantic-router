# The fields of the application signals the Router no longer reads become
# their labels, predicates, stages and inputs.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      domains:
        - {name: sciences, labels: [physics, chemistry]}
        - {name: computing, labels: [computer science]}
      fact_check:
        - {name: needs_fact_check}
        - {name: no_fact_check_needed, labels: [NO_FACT_CHECK_NEEDED], predicate: {gt: 0.3}}
      user_feedbacks:
        - {name: wrong_answer, labels: [WRONG_ANSWER]}
      modality:
        - {name: DIFFUSION, description: Image generation requests, labels: [image]}
      complexity:
        - name: difficulty
      jailbreak:
        - {name: attack, predicate: {gte: 0.7}, input: {history: true}}
        - {name: unsafe_answer, predicate: {gte: 0.8}, stage: response}
      safety:
        - {name: harmful, predicate: {gte: 0.6}}
      pii:
        - {name: personal, predicate: {gte: 0.8}, ignore_labels: [EMAIL_ADDRESS], input: {tool_results: true, request: false}}
    decisions:
      - name: guarded
        priority: 600
        rules:
          operator: OR
          conditions:
            - {type: jailbreak, name: attack}
            - {type: pii, name: personal}
            - {type: safety, name: harmful}
        modelRefs: [{model: general}]
      - name: hard
        priority: 500
        rules: {type: complexity, name: difficulty, label: hard}
        modelRefs: [{model: general}]
      - name: image
        priority: 400
        rules: {type: modality, name: DIFFUSION}
        modelRefs: [{model: general}]
      - name: science
        priority: 300
        rules:
          operator: AND
          conditions:
            - {type: domain, name: sciences}
            - {type: fact_check, name: needs_fact_check}
        modelRefs: [{model: general}]
      - name: retry
        priority: 200
        rules: {type: user_feedback, name: wrong_answer}
        modelRefs: [{model: general}]
      - name: plain
        priority: 100
        rules: {type: fact_check, name: no_fact_check_needed}
        modelRefs: [{model: general}]
