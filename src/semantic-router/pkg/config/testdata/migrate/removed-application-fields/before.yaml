# The fields of the application signals the Router no longer reads become
# their labels, predicates, stages and inputs.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      domains:
        - {name: sciences, mmlu_categories: [physics, chemistry]}
        - {name: computing, mmlu_categories: [computer_science]}
      fact_check:
        - {name: needs_fact_check}
        - {name: no_fact_check_needed}
      user_feedbacks:
        - {name: wrong_answer}
      modality:
        - {name: DIFFUSION, description: Image generation requests}
      complexity:
        - name: difficulty
          threshold: 0.1
          hard: {candidates: [prove the theorem]}
          easy: {candidates: [say hello]}
      jailbreak:
        - {name: attack, threshold: 0.7, include_history: true}
        - {name: unsafe_answer, threshold: 0.8, direction: response}
      safety:
        - {name: harmful, labels: [benign, harmful], unsafe_labels: [harmful], threshold: 0.6}
      pii:
        - {name: personal, threshold: 0.8, pii_types_allowed: [EMAIL_ADDRESS], include_history: true, source: tool_result}
    decisions:
      - name: guarded
        priority: 600
        rules:
          operator: OR
          conditions:
            - {type: jailbreak, name: attack}
            - {type: pii, name: personal}
            - {type: safety, name: harmful}
        modelRefs: [{model: general}]
      - name: hard
        priority: 500
        rules: {type: complexity, name: "difficulty:hard"}
        modelRefs: [{model: general}]
      - name: image
        priority: 400
        rules: {type: modality, name: DIFFUSION}
        modelRefs: [{model: general}]
      - name: science
        priority: 300
        rules:
          operator: AND
          conditions:
            - {type: domain, name: sciences}
            - {type: fact_check, name: needs_fact_check}
        modelRefs: [{model: general}]
      - name: retry
        priority: 200
        rules: {type: user_feedback, name: wrong_answer}
        modelRefs: [{model: general}]
      - name: plain
        priority: 100
        rules: {type: fact_check, name: no_fact_check_needed}
        modelRefs: [{model: general}]
