# A rerank deployment has no consumer left: the decision model judges RAG
# relevance, so migrate deletes it.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: chat
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      remote-reranker:
        provider: rerank
        endpoint: https://rerank.example.com
        model: bge-reranker-v2-m3
