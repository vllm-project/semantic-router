# A candidate iteration model names a model providers.models does not
# declare, which modelRefs refuses; a candidate iteration does not choose
# where a request goes, so the model is dropped, and an iteration it leaves
# with no model with it. A LoRA a model declares is a model name.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
      loras: [{name: declared}]
recipes:
  - name: default
    decisions:
      - name: support
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
        candidateIterations:
          - variable: candidate
            source: models
            models:
              - {model: general}
              - {model: declared}
            outputs: [{type: model, value: candidate}]
      - name: archive
        priority: 50
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
