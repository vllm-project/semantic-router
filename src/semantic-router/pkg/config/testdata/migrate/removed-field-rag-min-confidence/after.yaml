# RAG's min_confidence_threshold retrieved only when a fact_check rule matched:
# the condition moves into the decision's rules.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      keywords:
        - {name: docs_question, operator: any, keywords: [manual, docs]}
      fact_check:
        - {name: needs_fact_check, description: Prompts with factual claims that should be verified.}
    decisions:
      - name: grounded
        priority: 100
        rules:
          operator: AND
          conditions:
            - {type: keyword, name: docs_question}
            - {type: fact_check, name: needs_fact_check}
        modelRefs: [{model: general}]
        plugins:
          - type: context
            configuration:
              enabled: true
              sources:
                - type: rag
                  backend: vectorstore
                  backend_config: {vector_store_id: vs_docs}
global:
  stores:
    vector_store: {enabled: true, backend_type: memory}
