# The embeddings API is removed. Its switch only made the embedding
# deployment a prepared service; it now starts for the stores that recall
# with it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: chat
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
