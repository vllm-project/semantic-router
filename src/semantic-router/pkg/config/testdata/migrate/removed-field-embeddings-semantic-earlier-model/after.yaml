# embeddings.semantic names the embedding model of an earlier release. Its
# Vela 1.0 replacement on the CPU is the pre-declared vela-embedding, so the
# block is dropped; migrate notes that stored vectors must be re-embedded.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
