# The candle, ONNX Runtime and OpenVINO providers are the model runtime: a
# device keeps its accelerator (an OpenVINO GPU runs on CPU), a registry path
# becomes its Hub repository and an earlier task model its Vela 1.0
# replacement. The execution fields go, and the NLI explainer is retired.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      domain:
        provider: candle
        artifact: models/mom-domain-classifier
        revision: 0000000000000000000000000000000000000000
        device: cuda:1
        precision: fp16
      guard:
        provider: ort
        artifact: models/Vela-1.0-Encoder-307M-Guard
        device: migraphx
        custom_ops_profile: rocm-fused
        compilation_cache_dir: /var/cache/ort
      embedder:
        provider: openvino
        artifact: models/mom-embedding-light
        device: GPU
      explainer:
        provider: candle
        artifact: models/mom-halugate-explainer
