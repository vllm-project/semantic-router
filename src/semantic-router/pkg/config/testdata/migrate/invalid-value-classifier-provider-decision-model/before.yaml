# A classify deployment named where nothing answers in its place: the
# decision model's deployment. Migrate refuses and names the place to change.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    decisions:
      - name: route
        priority: 100
        rules: {operator: AND, conditions: []}
        modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      scorer: {provider: classify, endpoint: "http://scorer:8080"}
    system:
      decision_model: {deployment: scorer}
