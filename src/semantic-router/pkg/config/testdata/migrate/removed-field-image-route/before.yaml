# A decision that routed image requests to a model whose modality made the
# image declares it in an output contract: an image from an image model, or
# text with an image from one model that writes both.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
    - name: painter
      api_format: images
      backend_refs: [{name: images, endpoint: "127.0.0.1:8001", protocol: http, weight: 1}]
      modality: diffusion
    - name: omni
      api_format: responses
      backend_refs: [{name: omni, endpoint: "127.0.0.1:8002", protocol: http, weight: 1}]
      capabilities: [chat, image_generation]
      modality: omni
recipes:
  - name: default
    signals:
      modality:
        - {name: DIFFUSION, labels: [image]}
        - {name: BOTH, labels: [text_image]}
    decisions:
      - name: image
        priority: 200
        rules: {type: modality, name: DIFFUSION}
        modelRefs: [{model: painter}]
      - name: text-and-image
        priority: 190
        rules: {operator: OR, conditions: [{type: modality, name: BOTH}]}
        modelRefs: [{model: omni}]
      - name: everything
        rules: {}
        modelRefs: [{model: general}]
