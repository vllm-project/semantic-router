# An embedding rule with image anchors has no question that replaces it.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    embeddings:
      - name: chart
        threshold: 0.6
        image_candidates: [fixtures/bar-chart.png]
        aggregation_method: max
        query_modality: image
  decisions:
    - name: charts
      priority: 100
      rules: {type: embedding, name: chart}
      modelRefs: [{model: general}]
