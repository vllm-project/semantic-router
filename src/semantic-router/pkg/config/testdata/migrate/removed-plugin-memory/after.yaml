# A memory plugin becomes the memory source of the decision's context plugin;
# a disabled one, which turned the global memory off, a disabled context
# plugin. A decision whose only old plugin is rag keeps the global memory as a
# memory source.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  decisions:
    - name: personal
      priority: 100
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
      plugins:
        - type: context
          configuration:
            enabled: true
            sources:
              - type: memory
                store:
                  auto: false
                hybrid_search: true
                hybrid_mode: rrf
                reflection: {enabled: true, algorithm: heuristic, max_inject_tokens: 384}
    - name: private
      priority: 90
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
      plugins:
        - type: context
          configuration:
            enabled: false
    - name: docs
      priority: 80
      rules: {operator: AND, conditions: []}
      modelRefs: [{model: general}]
      plugins:
        - type: context
          configuration:
            enabled: true
            sources:
              - type: rag
                backend: vectorstore
                backend_config: {vector_store_id: vs_docs}
              - type: memory
global:
  stores:
    memory:
      enabled: true
