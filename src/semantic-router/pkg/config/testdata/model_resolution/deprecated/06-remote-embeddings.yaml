# Deprecated: embeddings.semantic.endpoint.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    systemone:
      - name: billing
        question:
          type: noul
          instructions: 'Is the request about any of these: refund my order?'
  decisions:
    - name: route
      priority: 100
      rules: {operator: OR, conditions: [{type: systemone, name: billing}]}
      modelRefs: [{model: general}]
global:
  model_catalog:
    embeddings:
      semantic:
        embedding_config: {backend: openai_compatible, model_type: remote}
        endpoint:
          base_url: https://embed.example.com/v1
          model: BAAI/bge-m3
          api_key_env: EMBEDDING_API_KEY
          timeout_seconds: 5
          max_retries: 2
          dimensions: 1024
