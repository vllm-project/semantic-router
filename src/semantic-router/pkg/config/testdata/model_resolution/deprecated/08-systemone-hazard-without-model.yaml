# A hazard part without a hazard deployment uses the pre-declared hazard deployment (Vela 1.0 Hazard); under a systemone decision model it failed to load before.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    domains: [{name: math, description: Mathematics}]
    safety:
      - name: unsafe-privacy
        threshold: 0.5
        hazard: {labels: [violence, privacy], categories: [privacy], threshold: 0.6}
    decision:
      - name: needs_tools
        question: {type: noul, instructions: "Does the request need a tool?"}
  decisions:
    - name: route
      priority: 100
      rules:
        operator: OR
        conditions:
          - {type: domain, name: math}
          - {type: safety, name: unsafe-privacy}
          - {type: decision, name: needs_tools}
      modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      d3-remote:
        provider: systemone
        endpoint: https://systemone.example.com/v1/systemone
        model: vllm-sr/d3-ultra
        question_types: [choice, noul, score, set]
        auth: {api_key_env: SYSTEMONE_KEY}
    system:
      decision_model: {deployment: d3-remote}
