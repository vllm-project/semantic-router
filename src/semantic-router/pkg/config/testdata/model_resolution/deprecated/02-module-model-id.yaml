# Deprecated: module model_id names the model directly; model_ref "" turns a module off.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    domains: [{name: math, description: Mathematics}]
    jailbreak: [{name: injection, threshold: 0.6}]
    pii: [{name: personal, threshold: 0.5}]
  decisions:
    - name: route
      priority: 100
      rules:
        operator: OR
        conditions:
          - {type: domain, name: math}
          - {type: jailbreak, name: injection}
          - {type: pii, name: personal}
      modelRefs: [{model: general}]
global:
  model_catalog:
    modules:
      prompt_guard: {enabled: true, model_id: models/Vela-1.0-Encoder-307M-Guard, use_cpu: true}
      classifier:
        domain: {model_ref: "", model_id: ""}
        pii: {model_id: models/Vela-1.0-Encoder-307M-PII, use_cpu: false}
