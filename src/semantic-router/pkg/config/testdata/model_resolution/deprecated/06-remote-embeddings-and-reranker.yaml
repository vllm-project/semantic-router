# Deprecated: embeddings.semantic.endpoint and the rag.reranker binding with pair_scorer.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  model_bindings:
    rag.reranker:
      deployment: document-ranker
      contract: relevance_scores.v1
      adapter: vela_reranker
      pair_scorer: {layer: 22, dimension: 768}
  signals:
    embeddings: [{name: billing, threshold: 0.7, candidates: [refund my order]}]
  decisions:
    - name: route
      priority: 100
      rules: {operator: OR, conditions: [{type: embedding, name: billing}]}
      modelRefs: [{model: general}]
      plugins:
        - type: rag
          configuration:
            enabled: true
            backend: vectorstore
            top_k: 5
            backend_config: {vector_store_id: vs_docs}
            rerank: {top_k: 3}
global:
  model_catalog:
    deployments:
      document-ranker: {provider: model_runtime, artifact: vllm-sr/Vela-1.0-Encoder-307M-Reranker, revision: a388e41cbbd5dc5f16b6389fa76d0b8b8a38a8bf, device: cpu, input: {max_tokens: 4096, overflow: reject}}
    embeddings:
      semantic:
        embedding_config: {backend: openai_compatible, model_type: remote}
        endpoint:
          base_url: https://embed.example.com/v1
          model: BAAI/bge-m3
          api_key_env: EMBEDDING_API_KEY
          timeout_seconds: 5
          max_retries: 2
          dimensions: 1024
