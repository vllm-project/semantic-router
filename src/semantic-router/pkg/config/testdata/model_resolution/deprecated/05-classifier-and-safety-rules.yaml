# Deprecated: classifier type/model/model_path/use_cpu, safety model, hazard model.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  signals:
    classifiers:
      - {name: safety-head, type: local, model_path: models/Vela-1.0-Encoder-307M-Safety, use_cpu: true, labels: [safe, unsafe]}
      - name: tool-risk
        type: llm
        model: judge
        labels: [SAFE, RISKY]
        instructions: Choose RISKY only for destructive tool operations.
      - {name: remote-risk, type: sequence_classifier, model: risk-service, labels: [SAFE, RISKY]}
    safety:
      - name: unsafe
        model: binary-service
        threshold: 0.5
        hazard:
          model: hazard-service
          labels: [violence, privacy]
          categories: [privacy]
          threshold: 0.6
  decisions:
    - name: route
      priority: 100
      rules:
        operator: OR
        conditions:
          - {type: classifier, name: safety-head, label: unsafe, predicate: {gte: 0.5}}
          - {type: classifier, name: tool-risk, label: RISKY, predicate: {gte: 0.5}}
          - {type: classifier, name: remote-risk, label: RISKY, predicate: {gte: 0.5}}
          - {type: safety, name: unsafe}
      modelRefs: [{model: general}]
global:
  model_catalog:
    external:
      - name: judge
        model_role: classification
        llm_provider: openai
        llm_endpoint: {address: llm.example.com, port: 443, protocol: https}
        llm_model_name: gpt-4.1-mini
        parser_type: json
      - name: risk-service
        model_role: classification
        llm_endpoint: {address: risk.example.com, port: 8080, protocol: http}
      - name: binary-service
        model_role: classification
        llm_endpoint: {address: safety.example.com, port: 8080, protocol: http}
      - name: hazard-service
        model_role: classification
        llm_endpoint: {address: hazard.example.com, port: 8080, protocol: http}
