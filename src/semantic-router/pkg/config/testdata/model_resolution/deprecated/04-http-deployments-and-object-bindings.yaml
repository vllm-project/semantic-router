# Deprecated: provider http + external_model, binding contract/adapter, consumer-name keys.
version: v0.3
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
routing:
  model_bindings:
    prompt_guard: {deployment: guard-http, contract: label_distribution.v1, adapter: http_classify}
    domain_classifier: {deployment: local-domain, contract: label_distribution.v1, adapter: modernbert}
  signals:
    domains: [{name: math, description: Mathematics}]
    jailbreak: [{name: injection, threshold: 0.6}]
  decisions:
    - name: route
      priority: 100
      rules:
        operator: OR
        conditions:
          - {type: domain, name: math}
          - {type: jailbreak, name: injection}
      modelRefs: [{model: general}]
global:
  model_catalog:
    external:
      - name: guard-service
        model_role: guardrail
        llm_endpoint: {address: guard.example.com, port: 443, protocol: https}
        llm_timeout_seconds: 5
    deployments:
      guard-http: {provider: http, external_model: guard-service}
      local-domain: {provider: model_runtime, artifact: vllm-sr/Vela-1.0-Encoder-307M-Domain, revision: 0b4f9da14f8e8b8d1ae28d3e8d42a4d785c5a3bb, device: cpu}
    modules:
      prompt_guard: {enabled: true, threshold: 0.7, positive_labels: [INJECTION]}
