# A systemone decision model; deprecated top-level question_types. The built-in signals now ask it.
version: v0.5
providers:
  defaults: {model: general}
  models:
    - name: general
      backend_refs: [{name: local, endpoint: "127.0.0.1:8000", protocol: http, weight: 1}]
recipes:
  - name: default
    signals:
      domains: [{name: math, description: Mathematics}]
      safety:
        - {name: unsafe, predicate: {gte: 0.5}}
      systemone:
        - name: needs_tools
          question: {type: noul, instructions: "Does the request need a tool?"}
    decisions:
      - name: route
        priority: 100
        rules:
          operator: OR
          conditions:
            - {type: domain, name: math}
            - {type: safety, name: unsafe}
            - {type: systemone, name: needs_tools}
        modelRefs: [{model: general}]
global:
  model_catalog:
    deployments:
      d3-remote:
        provider: systemone
        endpoint: https://systemone.example.com/v1/systemone
        model: vllm-sr/d3-ultra
        question_types: [choice, noul, score, set]
        auth: {api_key_env: SYSTEMONE_KEY}
    system:
      decision_model: {deployment: d3-remote}
