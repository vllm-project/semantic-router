version: v0.3
listeners: []
providers:
  defaults:
    model: m1
  models:
    - name: m1
      backend_refs:
        - endpoint: 127.0.0.1:8000
          provider: vllm
    - name: m2
      backend_refs:
        - endpoint: 127.0.0.1:8001
          provider: vllm
routing:
  modelCards:
    - name: m1
    - name: m2
  decisions:
    - name: fusion-panel
      priority: 1
      rules: {operator: AND, conditions: []}
      modelRefs:
        - model: m1
          use_reasoning: false
        - model: m2
          use_reasoning: false
      algorithm:
        type: fusion
        fusion:
          min_successful_responses: 3
