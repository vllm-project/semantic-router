version: v0.3
listeners: []
providers:
  defaults:
    default_model: m1
  models:
    - name: m1
      backend_refs:
        - endpoint: 127.0.0.1:8000
routing:
  modelCards:
    - name: m1
  decisions:
    - name: flow
      priority: 1
      rules: {operator: AND, conditions: []}
      modelRefs:
        - model: m1
          use_reasoning: false
      algorithm:
        type: workflows
        workflows:
          mode: static
          roles:
            - name: worker
              models: [ghost]
