version: v0.3
listeners: []
providers:
  defaults:
    default_model: m1
  models:
    - name: m1
      backend_refs:
        - endpoint: 127.0.0.1:8000
    - name: m2
      backend_refs:
        - endpoint: 127.0.0.1:8001
routing:
  modelCards:
    - name: m1
    - name: m2
  decisions:
    - name: prompt-select
      priority: 1
      rules: {operator: AND, conditions: []}
      modelRefs:
        - model: m1
          use_reasoning: false
        - model: m2
          use_reasoning: false
      algorithm:
        type: prompt
        on_error: skip
        prompt:
          model: m1
          instructions: pick one
