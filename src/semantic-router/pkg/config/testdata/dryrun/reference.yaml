version: v0.3
listeners: []
providers:
  defaults:
    default_model: m1
  models:
    - name: m1
      backend_refs:
        - endpoint: 127.0.0.1:8000
routing:
  modelCards:
    - name: m1
  signals:
    keywords:
      - name: hello
        operator: OR
        keywords: ["hi"]
  decisions:
    - name: triage
      priority: 1
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: nope
      modelRefs:
        - model: m1
          use_reasoning: false
