version: v0.3
listeners: []
providers:
  defaults:
    default_model: m1
  models:
    - name: m1
      backend_refs:
        - endpoint: 127.0.0.1:8000
routing:
  modelCards:
    - name: m1
  projections:
    scores:
      - name: alpha
        method: weighted_sum
        inputs:
          - type: projection
            name: beta
            weight: 1.0
      - name: beta
        method: weighted_sum
        inputs:
          - type: projection
            name: alpha
            weight: 1.0
  decisions:
    - name: d1
      priority: 1
      rules: {operator: AND, conditions: []}
      modelRefs:
        - model: m1
          use_reasoning: false
