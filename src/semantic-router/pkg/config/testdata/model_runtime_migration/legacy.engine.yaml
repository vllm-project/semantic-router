# What the CLI's own migration writes for the legacy.yaml example of
# website/docs/model-runtime/migrate.md, before `vllm-sr config migrate` asks
# the Router to rewrite the model fields. The CLI test checks the first step
# against this file; the Router test checks that the second step turns it into
# the page's legacy.migrated.yaml.
version: v0.3
listeners: []
providers:
  defaults:
    model: answer-model
  models:
  - name: answer-model
    backend_refs:
    - name: answer
      endpoint: vllm:8000
      provider: vllm
routing:
  model_bindings:
    embedding:
      deployment: vela-embedding
      contract: embedding.v1
      adapter: mmbert
global:
  model_catalog:
    deployments:
      vela-embedding:
        artifact: vllm-sr/Vela-1.0-Encoder-307M-Embedding
        provider: model_runtime
        device: rocm:0
      vela-domain:
        artifact: vllm-sr/Vela-1.0-Encoder-307M-Domain
        provider: model_runtime
        device: cuda:0
    modules:
      prompt_guard:
        enabled: true
        model_id: models/Vela-1.0-Encoder-307M-Guard
      hallucination_mitigation:
        enabled: true
        detector:
          model_id: models/Vela-1.0-Encoder-307M-Halu
  stores:
    response_cache:
      enabled: true
      backend_type: memory
      embedding_model: mmbert
