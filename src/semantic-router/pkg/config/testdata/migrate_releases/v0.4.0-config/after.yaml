version: v0.5
# Optional operator-owned benchmark definitions, versioned index DAGs, and
# model-linked measurements live together under evaluation.
listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s
    # Optional bearer credentials for CLI-managed Envoy listeners.
    api_keys: []
providers:
  defaults:
    model: qwen3-8b
    reasoning_effort: medium
  models:
    - name: qwen3-8b
      reasoning:
        family: qwen3
      provider_model_id: qwen3-8b-instruct
      api_format: openai
      reliability:
        lb_policy: least_request
        retry_count: 2
        retry_on: connect-failure,refused-stream
        consecutive_5xx: 5
        base_ejection_time: 30s
        max_ejection_percent: 50
        health_check_path: /health
        health_check_interval: 10s
        health_check_timeout: 2s
      pricing:
        currency: USD
        prompt_per_1m: 0.18
        cached_input_per_1m: 0.04
        cache_write_per_1m: 0.225
        completion_per_1m: 0.42
      external_model_ids:
        openai: qwen3-8b
        analytics: qwen3-routing
      backend_refs:
        - name: local-primary
          endpoint: 127.0.0.1:8000
          protocol: http
          weight: 80
          provider: vllm
          auth: {api_key_env: VLLM_SR_PRIMARY_API_KEY}
        - name: local-secondary
          endpoint: 127.0.0.1:8004
          protocol: http
          provider: vllm
          auth: {api_key_env: VLLM_SR_PRIMARY_API_KEY}
          weight: 20
      display_name: Qwen3 8B reference model
      publisher: Alibaba Cloud
      presentation:
        logo: package:qwen
        monogram: Q
        monochrome: false
      distribution:
        type: open_weights
        source: https://huggingface.co/Qwen/Qwen3-8B
        license: Apache-2.0
      family: qwen3
      revision: reference-v1
      released_at: 2025-04-29
      knowledge_cutoff: 2024-12
      lifecycle: active
      param_size: 8B
      context_window_size: 131072
      max_output_tokens: 32768
      description: General-purpose text model for the default routing tier.
      capabilities: [chat, reasoning, tools]
      modalities:
        input: [text]
        output: [text]
      tags: [default, fast]
    # Keep remote-provider access fields visible without mixing incompatible
    # request semantics into the weighted qwen3-8b replica pool above.
    - name: remote-openai-reference
      provider_model_id: remote-openai-reference
      api_format: openai
      backend_refs:
        - name: remote-primary
          endpoint: https://api.example.com/v1
          provider: openai
          auth: {header: Authorization, prefix: Bearer}
          headers:
            X-Tenant: reference-config
          api_version: "2025-03-01"
          chat_path: /chat/completions
          api_key: static-demo-key
          weight: 100
    - name: qwen3-32b
      reasoning:
        type: reasoning_effort
        parameter: reasoning.effort
        activation_parameter: enable_thinking
        effort_flags:
          low: low_effort
          medium: medium_effort
        levels: [none, low, medium, high]
        default: medium
        disabled: none
        modes: [enabled, disabled]
        default_mode: enabled
      provider_model_id: qwen3-32b-instruct
      api_format: anthropic
      pricing:
        currency: USD
        prompt_per_1m: 1.2
        cached_input_per_1m: 0.3
        completion_per_1m: 3.4
      external_model_ids:
        internal: qwen3-32b
      backend_refs:
        - name: large-primary
          provider: anthropic-compatible
          endpoint: 127.0.0.1:8001
          protocol: http
          weight: 100
      param_size: 32B
      context_window_size: 131072
      description: Higher-quality text model for complex and verified requests.
      capabilities: [chat, reasoning, long-context]
      loras:
        - name: computer-science-expert
          description: Adapter specialized for advanced computer science and software design prompts.
      tags: [premium, analysis]
    - name: llava-omni
      provider_model_id: llava-omni-preview
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 2.5
        cached_input_per_1m: 0.5
        completion_per_1m: 4.0
      external_model_ids:
        openai: llava-omni-preview
      backend_refs:
        - name: omni-primary
          provider: vllm
          endpoint: 127.0.0.1:8002
          protocol: http
          weight: 100
      param_size: 13B
      context_window_size: 65536
      description: Omni model that can satisfy both text and multimodal orchestration paths.
      capabilities: [chat, vision, multimodal]
      tags: [multimodal, omni]
      modalities: {input: [text, image], output: [text]}
    - name: sdxl-image
      provider_model_id: sdxl-image
      api_format: images
      pricing:
        currency: USD
        prompt_per_1m: 4.0
        completion_per_1m: 4.0
      external_model_ids:
        openai: gpt-image-1
      backend_refs:
        - name: image-primary
          provider: vllm
          endpoint: 127.0.0.1:8003
          protocol: http
          weight: 100
      param_size: 3B
      context_window_size: 8192
      description: Diffusion-style image generation backend used by image routes.
      capabilities: [image_generation]
      tags: [image, diffusion]
      modalities: {input: [text], output: [image]}
    # Catalog-backed models do not need a handwritten routing.modelCards entry.
    - name: built-in-catalog-example
      catalog: vllm-sr/mom-v1-lite
evaluation:
  records:
    - model: qwen3-8b
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.83
    - model: qwen3-32b
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.96
    - model: llava-omni
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.88
    - model: sdxl-image
      benchmark: vllm-sr/operator-rating@1.0.0
      metrics:
        score: 0.79
entrypoints:
  - model_names: ["vllm-sr/exhaustive-default"]
    recipe: default
    default: true
  - model_names: [vllm-sr/auto, auto, exhaustive-reference]
    recipe: default
  - model_names: ["vllm-sr/exhaustive-privacy"]
    recipe: privacy-first
  - model_names: [vllm-sr/remom]
    recipe: default-remom
  - model_names: [vllm-sr/fusion]
    recipe: default-fusion
  - model_names: [vllm-sr/flow]
    recipe: default-flow
recipes:
  - name: default
    strategy: priority
    # Optional recipe-local consumer bindings to named model deployments.
    model_bindings: {}
    signals:
      keywords:
        - name: code_keywords
          operator: OR
          method: bm25
          keywords: ["code", "function", "debug", "algorithm", "refactor"]
          case_sensitive: false
          bm25_threshold: 0.1
        - name: machine_learning
          operator: OR
          method: bm25
          keywords: ["machine learning", "model training", "gradient", "neural network", "classifier"]
          case_sensitive: false
          bm25_threshold: 0.1
        - name: urgent_keywords
          operator: OR
          method: ngram
          keywords: ["urgent", "immediate", "asap", "emergency"]
          case_sensitive: false
          ngram_threshold: 0.4
          ngram_arity: 3
        - name: fuzzy_sensitive_keywords
          operator: OR
          method: fuzzy
          keywords: ["social security", "credit card", "password", "api key"]
          case_sensitive: false
          fuzzy_match: true
          fuzzy_threshold: 82
        - name: critical_payment_event
          description: Critical payment or transaction events that need incident-grade routing.
          operator: OR
          keywords: [payment_failed, transaction_declined, critical, high, TXN_DECLINE, urgent, immediate, asap, deadline, time sensitive, time-sensitive, now, critical window, critical-window]
        - name: many_questions
          description: Prompts that contain many explicit questions.
          operator: OR
          method: regex
          keywords: ['[?？]']
          count:
            gte: 4
        - name: at_most_one_question
          description: Prompts with one or fewer explicit questions.
          operator: OR
          method: regex
          keywords: ['[?？]']
          count:
            lte: 1
        - name: numbered_steps
          description: Prompts that contain numbered list items such as "1. ..."
          operator: OR
          method: regex
          keywords: ['(?m)^\s*\d+\.\s+']
        - name: first_then_flow
          description: Prompts that express an ordered workflow.
          operator: OR
          method: regex
          keywords: ['(?s)first.*then', '(?s)first.*next.*finally', '(?s)首先.*然后', '(?s)先.*再']
        - name: constraint_dense
          description: Prompts with dense explicit constraints relative to multilingual text units.
          operator: OR
          keywords: [under, at most, at least, within, no more than, 不超过, 至少, 最多]
          density:
            gt: 16
        - name: format_directive_dense
          description: Prompts with dense output-format directives relative to multilingual text units.
          operator: OR
          keywords: [table, bullet, json, markdown, 表格, 列表, JSON]
          density:
            gt: 16
        - name: low_question_density
          description: Prompts with very low question density relative to multilingual text units.
          operator: OR
          method: regex
          keywords: ['[?？]']
          density:
            lt: 10
        - name: long_current_turn_bytes
          description: Current user turn is at least four thousand UTF-8 bytes.
          operator: OR
          method: regex
          keywords: ['(?s).', '[^\x00-\x7F]', '[^\x00-\x{7FF}]', '[^\x00-\x{FFFF}]']
          case_sensitive: true
          count:
            gte: 4000
      domains:
        - name: business
          description: Business and management related queries.
          labels: [business]
          model_scores:
            - model: qwen3-32b
              score: 0.96
              use_reasoning: true
          predicate:
            gte: 0.5
        - name: law
          description: Legal questions and policy topics.
          labels: [law]
          predicate:
            gte: 0.5
        - name: psychology
          description: Psychology and mental-health oriented prompts.
          labels: [psychology]
          predicate:
            gte: 0.5
        - name: health
          description: Health and medical information requests.
          labels: [health]
          predicate:
            gte: 0.5
        - name: "computer science"
          description: Computer science and engineering prompts.
          labels: ["computer science"]
          predicate:
            gte: 0.5
        - name: other
          description: General fallback traffic.
          labels: [other]
          predicate:
            gte: 0.5
      safety:
        - name: unsafe-content
          description: Content risk, independent of prompt attacks.
          predicate:
            gte: 0.5
      fact_check:
        - name: needs_fact_check
          description: Prompts with factual claims that should be verified.
          predicate:
            gte: 0.95
        - name: no_fact_check_needed
          description: Creative prompts that do not need factual verification.
          labels: [NO_FACT_CHECK_NEEDED]
          predicate:
            gt: 0.05
      user_feedbacks:
        - name: wrong_answer
          description: The user indicates the previous answer was incorrect.
          labels: [WRONG_ANSWER]
          predicate:
            gte: 0.7
        - name: need_clarification
          description: The user asks for a clearer or more detailed answer.
          labels: [NEED_CLARIFICATION]
          predicate:
            gte: 0.7
      language:
        - name: zh
          description: Chinese-language requests.
          # threshold: minimum lingua-go confidence required (0 = built-in default 0.3)
          threshold: 0.0
        - name: es
          description: Spanish-language requests.
      context:
        - name: long_context
          min_tokens: 32K
          max_tokens: 256K
          description: Requests that need larger effective context windows.
      complexity:
        - name: needs_reasoning
          description: Escalate multi-step reasoning or synthesis-heavy prompts.
        - name: deep_synthesis
          description: Escalate synthesis-heavy prompts, with a wider medium band than needs_reasoning.
      modality:
        - name: AR
          description: Text-only autoregressive requests.
          labels: [text]
          predicate:
            gte: 0.7
        - name: DIFFUSION
          description: Image-generation requests.
          labels: [image]
          predicate:
            gte: 0.7
        - name: BOTH
          description: Requests that need both text and image generation.
          labels: [text_image]
          predicate:
            gte: 0.7
      role_bindings:
        - name: admin
          description: Requests from platform administrators.
          role: admin
          subjects:
            - kind: Group
              name: platform-admins
        - name: premium_user
          description: Requests from paid end users.
          role: premium_user
          subjects:
            - kind: Group
              name: premium-tier
      jailbreak:
        - name: prompt_injection
          description: Detect common prompt-injection or jailbreak attempts.
          predicate:
            gte: 0.8
          input:
            history: true
        # direction: response scores the model's output instead of the prompt, so
        # this rule only exists once the model has answered; the selected
        # decision's response_jailbreak plugin enforces on it.
        - name: unsafe_completion
          description: Detect jailbreak content in the model's own output.
          predicate:
            gte: 0.85
          stage: response
      # Hallucination rules check the model's answer against the grounding
      # context the request carried (tool results or retrieved context), so they
      # only exist once the model has answered; the selected decision's
      # hallucination plugin enforces on them. use_nli asks the detector for
      # span-level NLI explanations.
      hallucination:
        - name: ungrounded_claims
          description: Detect claims the grounding context does not support.
          predicate:
            gte: 0.5
      pii:
        - name: restricted_pii
          description: Sensitive prompts where only low-risk identifiers may pass through.
          predicate:
            gte: 0.85
          ignore_labels: [EMAIL_ADDRESS]
          input:
            history: true
      conversation:
        - name: multi_turn_user
          description: At least two user messages.
          feature:
            type: count
            source:
              type: message
              role: user
          predicate:
            gte: 2
        - name: has_tools
          description: Request defines at least one tool.
          feature:
            type: count
            source:
              type: tool_definition
          predicate:
            gte: 1
        - name: requires_tool_execution
          description: Request protocol requires at least one tool call.
          feature:
            type: exists
            source:
              type: tool_choice_required
        - name: forbids_tool_execution
          description: Request protocol explicitly forbids tool calls.
          feature:
            type: exists
            source:
              type: tool_choice_none
        - name: active_tool_use
          description: Tool-result continuation inside an agent loop.
          feature:
            type: exists
            source:
              type: active_tool_loop
        - name: resumable_flow_state
          description: Request ends with a Router Flow tool result carrying continuation state.
          feature:
            type: exists
            source:
              type: flow_tool_state
        - name: has_developer_msg
          description: Request contains a developer message.
          feature:
            type: exists
            source:
              type: message
              role: developer
        - name: heavy_non_user
          description: Non-user messages exceed threshold.
          feature:
            type: count
            source:
              type: message
              role: non_user
          predicate:
            gt: 5
            lte: 99
      metadata:
        - name: consent_denied
          description: Caller explicitly denied remote processing consent.
          key: consent
          predicate:
            equals: denied
      input_modality:
        - name: image_input
          description: Request contains at least one image content part.
          modality: image
        - name: audio_input
          description: Request contains at least one audio content part.
          modality: audio
        - name: has_images
          description: Request contains at least one image content part.
          modality: image
      turn_relation:
        - name: likely_dissatisfied
          description: The current user turn closely repeats the immediately previous user turn.
          labels: [reask]
          input:
            previous_turns: 2
        - name: persistently_dissatisfied
          description: The current user turn repeats the last two user turns in a row.
          labels: [reask]
          input:
            previous_turns: 4
      systemone:
        - name: content-risk
          description: Independent content hazards with model-specific operating points.
          question:
            type: choice
            instructions: Which of these labels applies to the request?
            choices:
              - key: violence
              - key: criminal_activity
              - key: sexual_content
              - key: child_exploitation
              - key: hate
              - key: harassment_abuse
              - key: regulated_substances
              - key: weapons
              - key: self_harm
              - key: privacy
              - key: specialized_advice
              - key: misinformation
        - name: generic-safety-score
          description: Generic binary safety classification head.
          question:
            type: choice
            instructions: Which of these labels applies to the request?
            choices:
              - key: safe
              - key: unsafe
        - name: tool-risk
          description: Prompted tool execution risk labeler.
          question:
            type: choice
            instructions: Choose RISKY only for destructive, privileged, or irreversible tool operations.
            choices:
              - key: SAFE
              - key: RISKY
        - name: remote-safety-score
          description: Remote binary safety classification head.
          question:
            type: choice
            instructions: Which of these labels applies to the request?
            choices:
              - key: SAFE
              - key: RISKY
        - name: preference
          question:
            type: choice
            instructions: Which response preference does the request express?
            choices:
              - key: terse_answers
                description: 'Users who prefer short, direct responses. Examples: keep it concise; bullet points only; answer in one paragraph'
              - key: none
                description: The request expresses none of these preferences.
        - name: technical_support
          question:
            type: noul
            instructions: 'Is the request about any of these: how to configure the system; installation guide; troubleshooting steps; error message explanation?'
        - name: account_management
          question:
            type: noul
            instructions: 'Is the request about any of these: password reset; account settings; billing information; subscription management?'
        - name: clinical_query_intent
          question:
            type: noul
            instructions: 'Is the request about any of these: patient symptoms or clinical question; medication interaction or dosage question; test result interpretation request?'
    projections:
      scores:
        - name: request_difficulty
          method: weighted_sum
          inputs:
            - type: systemone
              name: technical_support
              weight: 0.18
              value_source: confidence
              match: 1.0
              miss: 0.0
            - type: systemone
              name: account_management
              weight: -0.08
              value_source: confidence
            - type: complexity
              name: needs_reasoning:medium
              weight: 0.18
            - type: complexity
              name: needs_reasoning:hard
              weight: 0.36
            - type: context
              name: long_context
              weight: 0.18
            - type: keyword
              name: first_then_flow
              weight: 0.12
      mappings:
        - name: request_band
          source: request_difficulty
          method: threshold_bands
          calibration:
            method: sigmoid_distance
            slope: 10.0
          outputs:
            - name: support_fast
              lte: 0.20
            - name: support_balanced
              gt: 0.20
              lt: 0.45
            - name: support_escalated
              gte: 0.45
    decisions:
      - name: static_business_route
        description: Static fallback for standard business traffic.
        priority: 200
        tier: 2
        output_contract: Preserve any explicit user-requested output format exactly.
        annotations:
          policy_class: business
          owner: routing-platform
        rules:
          operator: AND
          conditions:
            - type: domain
              name: business
        modelRefs:
          - model: qwen3-8b
            use_reasoning: false
            reasoning_description: Prefer fast, direct business answers.
        candidateIterations:
          - variable: candidate
            source: models
            models:
              - model: qwen3-32b
                weight: 1.0
                use_reasoning: true
                reasoning_mode: enabled
                reasoning_description: Candidate iteration reference model for DSL authoring coverage.
                reasoning_effort: low
            outputs:
              - type: model
                value: candidate
        algorithm:
          type: static
        plugins:
          # Shadow a candidate model on a small sample of this route's traffic.
          # The primary response never waits on or changes because of the shadow.
          - type: router_replay
            configuration:
              enabled: true
              shadow:
                model: qwen3-32b
                sample_rate: 0.05
                max_concurrency: 2
                max_queue_depth: 8
                timeout_seconds: 30
                max_response_bytes: 1048576
                max_retries: 0
                capture_response_body: false
                max_capture_bytes: 4096
                tls_skip_verify: false
                forward_headers: []
          - type: system_prompt
            configuration:
              enabled: true
              mode: insert
              system_prompt: You are a senior business consultant. Give practical recommendations and clear tradeoffs.
          - type: response_cache
            configuration:
              enabled: true
              mode: exact
              scope: user
              # Reference-only setting for operators who explicitly opt into semantic mode.
              semantic:
                match:
                  recall:
                    top_k: 3
                    min_similarity: 0.82
              ttl_seconds: 7200
              request_controls:
                enabled: true
                header: x-vsr-cache-control
                allowed:
                  - no-cache
                  - no-store
                  - bypass
                  - max-age
                  - ttl
                max_ttl_seconds: 7200
              personalized:
                mode: disabled
              revision:
                cache_epoch: "2026-08"
                model_revision: "model-catalog-v1"
                prompt_revision: "prompts-v1"
                policy_revision: "policy-v1"
          - type: context
            configuration:
              enabled: true
              sources:
                - type: memory
              compress:
                mode: auto
                targets:
                  current_user:
                    mode: preserve
                  tool_outputs:
                    mode: extractive
                    min_tokens: 2000
                    target_tokens: 1000
                  history:
                    mode: preserve
                  rag:
                    mode: preserve
                  memory:
                    mode: preserve
                match:
                  recall:
                    method: bm25
                recovery:
                  enabled: false
                  store: response_cache
                  ttl_seconds: 900
                  max_bytes_per_request: 10485760
                  max_total_bytes: 268435456
                  max_retrievals: 8
                request_controls:
                  enabled: false
                  header: x-vsr-compression-control
                  allowed:
                    - bypass
                    - target
                  max_target_tokens: 16000
                failure_mode: fail_open
              budget:
                max_tokens: auto
                reserve_output_tokens: auto
          - type: tools
            configuration:
              enabled: true
              policy:
                mode: filtered
                allow_tools:
                  - search_web
                block_tools:
                  - exec_cmd
              select:
                mode: add
                tools_db_path: config/runtime/tools/tools_db.json
                match:
                  judge:
                    preset: tool_rank
                    top_k: 5
                    min_ratio: 0.1
        retention:
          drop: false
          ttl_turns: 4
          keep_current_model: true
          prefer_prefix_retention: true
      - name: legal_confidence_route
        description: Confidence-routed legal and factual traffic.
        priority: 190
        rules:
          operator: OR
          conditions:
            - type: domain
              name: law
            - type: fact_check
              name: needs_fact_check
        modelRefs:
          - model: qwen3-8b
            use_reasoning: true
            reasoning_mode: enabled
            weight: 0.4
          - model: qwen3-32b
            use_reasoning: true
            reasoning_description: Escalate when confidence is weak.
            reasoning_effort: high
            weight: 0.6
        algorithm:
          type: escalate
          minimum_candidates: 2
          escalate:
            order: size
            accept:
              confidence:
                method: hybrid
                gte: 0.72
                hybrid_weights:
                  logprob_weight: 0.65
                  margin_weight: 0.35
                token_filter: tool_call_args
        plugins:
          - type: response_guard
            configuration:
              rules:
                - when:
                    operator: AND
                    conditions:
                      - type: fact_check
                        name: needs_fact_check
                      - type: hallucination
                        name: ungrounded_claims
                  action: annotate
              on_unknown: annotate
          # Disabled sample: field coverage only (reference config union coverage
          # for PromptCachePluginConfig). qwen3-32b speaks the Anthropic Messages
          # wire format this plugin targets; see tutorials/plugin/prompt-cache.
          - type: prompt_cache
            configuration:
              enabled: false
              ttl: 1h
              targets: [instructions, tools]
              on_unsupported: skip
      - name: health_ratings_route
        description: Ratings-based route for health requests that need fact verification.
        priority: 180
        rules:
          operator: AND
          conditions:
            - type: domain
              name: health
            - type: fact_check
              name: needs_fact_check
        modelRefs:
          - model: qwen3-8b
            use_reasoning: true
            reasoning_mode: enabled
          - model: qwen3-32b
            use_reasoning: true
            reasoning_effort: high
        algorithm:
          type: ratings
          ratings:
            max_concurrent: 3
          on_error: skip
        adaptations:
          mode: bypass
        plugins:
          - type: router_replay
            configuration:
              enabled: true
              max_records: 10000
              capture_request_body: true
              capture_response_body: true
              max_body_bytes: 4096
              # 0 = no truncation (the documented default). Set to a positive
              # byte cap to independently limit structured tool-trace fields
              # (prompt, tool_definitions, and each tool-call's arguments/output)
              # without having to shrink max_body_bytes.
              max_tool_trace_bytes: 0
              # Cap the number of tool-trace steps retained per record. Long
              # agent sessions (many sequential tool calls) can otherwise grow
              # the trace unbounded and OOM the router (#1835). 0 = no cap.
              max_tool_trace_steps: 100
      - name: computer-science-remom-route
        description: ReMoM route for complex computer science prompts.
