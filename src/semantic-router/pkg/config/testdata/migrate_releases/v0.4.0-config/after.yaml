                  match:
                    recall:
                      method: embedding
                      top_k: 6
                      min_similarity: 0.76
                    judge:
                      preset: relevance
                      top_k: 6
                      min_score: 0.5
                  max_context_length: 9000
                  on_failure: warn
                  cache_results: false
                  backend_config:
                    primary: milvus
                    fallback: external_api
                    strategy: parallel
                    primary_config:
                      collection: docs
                      reuse_cache_connection: true
                    fallback_config:
                      endpoint: https://search.example.com/query
                      request_format: pinecone
                - type: memory
      - name: mlp_experimental_route
        description: Experimental MLP-based model selection route.
        priority: 103
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: machine_learning
        modelRefs:
