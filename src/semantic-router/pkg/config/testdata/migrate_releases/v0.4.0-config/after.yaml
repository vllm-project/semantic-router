              reference: hybrid # hybrid | context | panel
              policy: weight # weight | annotate | filter (see below)
              min_score: 0.0 # filter policy only: drop below this (0-1)
              min_keep: 1 # filter policy only: keep at least this many
              contradiction_penalty: 1.0
              on_error: skip # skip (fall back to plain fusion) | fail
              # policy controls how the scores are used:
              #   weight   (default) keep every response; tell the judge to weight
              #            each answer by its score (a correct lone dissenter is kept).
              #   annotate keep every response; pass the scores to the judge as notes.
              #   filter   hard-drop responses below min_score (keep min_keep).
              # filter regresses quality on contested factual questions because it
              # deletes the correct dissenter; see bench/grounded_fusion/FINDINGS.md.
          on_error: skip
  - name: default-flow
    description: The workflows decisions of recipe default
    strategy: priority
    # Optional recipe-local consumer bindings to named model deployments.
    model_bindings: {}
    signals:
      keywords:
        - name: code_keywords
          operator: OR
          method: bm25
          keywords: ["code", "function", "debug", "algorithm", "refactor"]
          case_sensitive: false
          bm25_threshold: 0.1
        - name: machine_learning
          operator: OR
          method: bm25
          keywords: ["machine learning", "model training", "gradient", "neural network", "classifier"]
          case_sensitive: false
          bm25_threshold: 0.1
        - name: urgent_keywords
          operator: OR
          method: ngram
          keywords: ["urgent", "immediate", "asap", "emergency"]
          case_sensitive: false
          ngram_threshold: 0.4
          ngram_arity: 3
        - name: fuzzy_sensitive_keywords
          operator: OR
          method: fuzzy
          keywords: ["social security", "credit card", "password", "api key"]
          case_sensitive: false
          fuzzy_match: true
          fuzzy_threshold: 82
        - name: critical_payment_event
          description: Critical payment or transaction events that need incident-grade routing.
          operator: OR
          keywords: [payment_failed, transaction_declined, critical, high, TXN_DECLINE, urgent, immediate, asap, deadline, time sensitive, time-sensitive, now, critical window, critical-window]
        - name: many_questions
          description: Prompts that contain many explicit questions.
          operator: OR
          method: regex
          keywords: ['[?？]']
          count:
            gte: 4
        - name: at_most_one_question
          description: Prompts with one or fewer explicit questions.
          operator: OR
          method: regex
          keywords: ['[?？]']
          count:
            lte: 1
        - name: numbered_steps
          description: Prompts that contain numbered list items such as "1. ..."
          operator: OR
          method: regex
          keywords: ['(?m)^\s*\d+\.\s+']
        - name: first_then_flow
          description: Prompts that express an ordered workflow.
          operator: OR
          method: regex
          keywords: ['(?s)first.*then', '(?s)first.*next.*finally', '(?s)首先.*然后', '(?s)先.*再']
        - name: constraint_dense
          description: Prompts with dense explicit constraints relative to multilingual text units.
          operator: OR
          keywords: [under, at most, at least, within, no more than, 不超过, 至少, 最多]
          density:
            gt: 16
        - name: format_directive_dense
          description: Prompts with dense output-format directives relative to multilingual text units.
          operator: OR
          keywords: [table, bullet, json, markdown, 表格, 列表, JSON]
          density:
            gt: 16
        - name: low_question_density
          description: Prompts with very low question density relative to multilingual text units.
          operator: OR
          method: regex
          keywords: ['[?？]']
          density:
            lt: 10
        - name: long_current_turn_bytes
          description: Current user turn is at least four thousand UTF-8 bytes.
          operator: OR
          method: regex
          keywords: ['(?s).', '[^\x00-\x7F]', '[^\x00-\x{7FF}]', '[^\x00-\x{FFFF}]']
          case_sensitive: true
          count:
            gte: 4000
      domains:
        - name: business
          description: Business and management related queries.
          labels: [business]
          model_scores:
            - model: qwen3-32b
              score: 0.96
              use_reasoning: true
          predicate:
            gte: 0.5
        - name: law
          description: Legal questions and policy topics.
          labels: [law]
          predicate:
            gte: 0.5
        - name: psychology
          description: Psychology and mental-health oriented prompts.
          labels: [psychology]
          predicate:
            gte: 0.5
        - name: health
          description: Health and medical information requests.
          labels: [health]
          predicate:
            gte: 0.5
        - name: "computer science"
          description: Computer science and engineering prompts.
          labels: ["computer science"]
          predicate:
            gte: 0.5
        - name: other
          description: General fallback traffic.
          labels: [other]
          predicate:
            gte: 0.5
      safety:
        - name: unsafe-content
          description: Content risk, independent of prompt attacks.
          predicate:
            gte: 0.5
      fact_check:
        - name: needs_fact_check
          description: Prompts with factual claims that should be verified.
          predicate:
            gte: 0.95
        - name: no_fact_check_needed
          description: Creative prompts that do not need factual verification.
          labels: [NO_FACT_CHECK_NEEDED]
          predicate:
            gt: 0.05
      user_feedbacks:
        - name: wrong_answer
          description: The user indicates the previous answer was incorrect.
          labels: [WRONG_ANSWER]
          predicate:
            gte: 0.7
        - name: need_clarification
          description: The user asks for a clearer or more detailed answer.
          labels: [NEED_CLARIFICATION]
          predicate:
            gte: 0.7
      language:
        - name: zh
          description: Chinese-language requests.
          # threshold: minimum lingua-go confidence required (0 = built-in default 0.3)
          threshold: 0.0
        - name: es
          description: Spanish-language requests.
      context:
        - name: long_context
          min_tokens: 32K
          max_tokens: 256K
          description: Requests that need larger effective context windows.
      complexity:
        - name: needs_reasoning
          description: Escalate multi-step reasoning or synthesis-heavy prompts.
        - name: deep_synthesis
          description: Escalate synthesis-heavy prompts, with a wider medium band than needs_reasoning.
      modality:
        - name: AR
          description: Text-only autoregressive requests.
          labels: [text]
          predicate:
            gte: 0.7
        - name: DIFFUSION
          description: Image-generation requests.
          labels: [image]
          predicate:
            gte: 0.7
        - name: BOTH
          description: Requests that need both text and image generation.
          labels: [text_image]
          predicate:
            gte: 0.7
      role_bindings:
        - name: admin
          description: Requests from platform administrators.
          role: admin
          subjects:
            - kind: Group
              name: platform-admins
        - name: premium_user
          description: Requests from paid end users.
          role: premium_user
          subjects:
            - kind: Group
              name: premium-tier
      jailbreak:
        - name: prompt_injection
          description: Detect common prompt-injection or jailbreak attempts.
          predicate:
            gte: 0.8
          input:
            history: true
        # direction: response scores the model's output instead of the prompt, so
        # this rule only exists once the model has answered; the selected
        # decision's response_jailbreak plugin enforces on it.
        - name: unsafe_completion
          description: Detect jailbreak content in the model's own output.
          predicate:
            gte: 0.85
          stage: response
      # Hallucination rules check the model's answer against the grounding
      # context the request carried (tool results or retrieved context), so they
      # only exist once the model has answered; the selected decision's
      # hallucination plugin enforces on them. use_nli asks the detector for
      # span-level NLI explanations.
      hallucination:
        - name: ungrounded_claims
          description: Detect claims the grounding context does not support.
          predicate:
            gte: 0.5
      pii:
        - name: restricted_pii
          description: Sensitive prompts where only low-risk identifiers may pass through.
          predicate:
            gte: 0.85
          ignore_labels: [EMAIL_ADDRESS]
          input:
            history: true
      conversation:
        - name: multi_turn_user
          description: At least two user messages.
          feature:
            type: count
            source:
              type: message
              role: user
          predicate:
            gte: 2
        - name: has_tools
          description: Request defines at least one tool.
          feature:
            type: count
            source:
              type: tool_definition
          predicate:
            gte: 1
        - name: requires_tool_execution
          description: Request protocol requires at least one tool call.
          feature:
            type: exists
            source:
              type: tool_choice_required
        - name: forbids_tool_execution
          description: Request protocol explicitly forbids tool calls.
          feature:
            type: exists
            source:
              type: tool_choice_none
        - name: active_tool_use
          description: Tool-result continuation inside an agent loop.
          feature:
            type: exists
            source:
              type: active_tool_loop
        - name: resumable_flow_state
          description: Request ends with a Router Flow tool result carrying continuation state.
          feature:
            type: exists
            source:
              type: flow_tool_state
        - name: has_developer_msg
          description: Request contains a developer message.
          feature:
            type: exists
            source:
              type: message
              role: developer
        - name: heavy_non_user
          description: Non-user messages exceed threshold.
          feature:
            type: count
            source:
              type: message
              role: non_user
          predicate:
            gt: 5
            lte: 99
      metadata:
        - name: consent_denied
          description: Caller explicitly denied remote processing consent.
          key: consent
          predicate:
            equals: denied
      input_modality:
        - name: image_input
          description: Request contains at least one image content part.
          modality: image
        - name: audio_input
          description: Request contains at least one audio content part.
          modality: audio
        - name: has_images
          description: Request contains at least one image content part.
          modality: image
      turn_relation:
        - name: likely_dissatisfied
          description: The current user turn closely repeats the immediately previous user turn.
          labels: [reask]
          input:
            previous_turns: 2
        - name: persistently_dissatisfied
          description: The current user turn repeats the last two user turns in a row.
          labels: [reask]
          input:
            previous_turns: 4
      systemone:
        - name: content-risk
          description: Independent content hazards with model-specific operating points.
          question:
            type: choice
            instructions: Which of these labels applies to the request?
            choices:
              - key: violence
              - key: criminal_activity
              - key: sexual_content
              - key: child_exploitation
              - key: hate
              - key: harassment_abuse
              - key: regulated_substances
              - key: weapons
              - key: self_harm
              - key: privacy
              - key: specialized_advice
              - key: misinformation
        - name: generic-safety-score
          description: Generic binary safety classification head.
          question:
            type: choice
            instructions: Which of these labels applies to the request?
            choices:
              - key: safe
              - key: unsafe
        - name: tool-risk
          description: Prompted tool execution risk labeler.
          question:
            type: choice
            instructions: Choose RISKY only for destructive, privileged, or irreversible tool operations.
            choices:
              - key: SAFE
              - key: RISKY
        - name: remote-safety-score
          description: Remote binary safety classification head.
          question:
            type: choice
            instructions: Which of these labels applies to the request?
            choices:
              - key: SAFE
              - key: RISKY
        - name: preference
          question:
            type: choice
            instructions: Which response preference does the request express?
            choices:
              - key: terse_answers
                description: 'Users who prefer short, direct responses. Examples: keep it concise; bullet points only; answer in one paragraph'
              - key: none
                description: The request expresses none of these preferences.
        - name: technical_support
          question:
            type: noul
            instructions: 'Is the request about any of these: how to configure the system; installation guide; troubleshooting steps; error message explanation?'
        - name: account_management
          question:
            type: noul
            instructions: 'Is the request about any of these: password reset; account settings; billing information; subscription management?'
        - name: clinical_query_intent
          question:
            type: noul
            instructions: 'Is the request about any of these: patient symptoms or clinical question; medication interaction or dosage question; test result interpretation request?'
    projections:
      scores:
        - name: request_difficulty
          method: weighted_sum
          inputs:
            - type: systemone
              name: technical_support
              weight: 0.18
              value_source: confidence
              match: 1.0
              miss: 0.0
            - type: systemone
              name: account_management
              weight: -0.08
              value_source: confidence
            - type: complexity
              name: needs_reasoning:medium
              weight: 0.18
            - type: complexity
              name: needs_reasoning:hard
              weight: 0.36
            - type: context
              name: long_context
              weight: 0.18
            - type: keyword
              name: first_then_flow
              weight: 0.12
      mappings:
        - name: request_band
          source: request_difficulty
          method: threshold_bands
          calibration:
            method: sigmoid_distance
            slope: 10.0
          outputs:
            - name: support_fast
              lte: 0.20
            - name: support_balanced
              gt: 0.20
              lt: 0.45
            - name: support_escalated
              gte: 0.45
    decisions:
      - name: router-flow-workflow-route
        description: Router Flow route for bounded static or dynamic micro-agent workflows.
        priority: 164
        rules:
          operator: AND
          conditions:
            - type: domain
              name: business
            - type: complexity
              name: needs_reasoning
              label: hard
        modelRefs:
          - model: qwen3-8b
            use_reasoning: true
            reasoning_mode: enabled
            weight: 0.5
          - model: qwen3-32b
            use_reasoning: true
            reasoning_effort: high
            weight: 0.5
        algorithm:
          type: workflows
          workflows:
            mode: dynamic
            template: micro_agent
            planner:
              model: qwen3-32b
            max_steps: 6
            max_parallel: 2
            max_completion_tokens: 1024
            round_timeout_seconds: 90
            min_successful_responses: 1
            temperature: 0.2
            include_intermediate_responses: true
          on_error: fail
global:
  router:
    config_source: file
    strategy: priority
    list_backend_models: true
    clear_route_cache: true
    fallback:
      version: 1
      enabled: false
      max_attempts: 3
      total_timeout: 30s
      per_attempt_timeout: 10s
      retryable_status_codes:
        - 502
        - 503
        - 504
      circuit_breaker:
        consecutive_failures: 3
        cooldown_period: 30s
        half_open_probes: 1
    streamed_body:
      enabled: true
      max_bytes: 1048576
      timeout_sec: 15
    skip_processing:
      enabled: false
    model_selection:
      enabled: true
    learning:
      enabled: true
      adaptation:
        enabled: true
        candidate_set: decision
        strategy: routing_sampling
      protection:
        enabled: true
        scope: conversation
        identity:
          headers:
            session: x-session-id
            conversation: x-conversation-id
        tuning:
          idle_timeout_seconds: 300
          min_turns_before_switch: 1
          switch_margin: 0.05
          stability_weight: 1.0
          # Gate session model switches on recent-outcome evidence. Disabled by
          # default; thresholds stay placeholders until they are calibrated.
          progress_gate:
            enabled: false
            mode: observe
            calibration_id: "" # External profile name@version; required for enforce.
            window_size: 8
            window_ttl_seconds: 900
            min_window_outcomes: 3
            min_consecutive_regressions: 2
            min_consecutive_recoveries: 2
            cooldown_seconds: 120
            max_switches_per_window: 2
      state_store:
        backend: redis
        ttl_seconds: 86400
        timeout_ms: 50
        redis:
          address: redis:6379
          password: "${VLLM_SR_STACK_REDIS_PASSWORD}"
          database: 2
          key_prefix: "vsr:router-session:v1:"
  services:
    api:
      routing_preview:
        request_timeout_seconds: 120
        max_concurrency: 16
      batch_classification:
        max_batch_size: 100
        metrics:
          sample_rate: 1.0
          batch_size_ranges:
            - min: 1
              max: 4
              label: tiny
            - min: 5
              max: 16
              label: standard
          duration_buckets: [0.01, 0.05, 0.1, 0.5, 1.0]
          size_buckets: [128, 512, 2048, 8192]
          enabled: true
          detailed_goroutine_tracking: true
          high_resolution_timing: true
    response_api:
      enabled: true
      store_backend: redis
      ttl_seconds: 86400
      max_responses: 2000
      redis:
        address: redis:6379
        password: "${VLLM_SR_STACK_REDIS_PASSWORD}"
        db: 1
        key_prefix: "vsr:responses:"
        cluster_mode: false
        cluster_addresses: ['redis-a:6379', 'redis-b:6379']
        pool_size: 10
        min_idle_conns: 2
        max_retries: 3
        dial_timeout: 5
        read_timeout: 5
        write_timeout: 5
        tls_enabled: false
        tls_cert_path: certs/redis.crt
        tls_key_path: certs/redis.key
        tls_ca_path: certs/ca.crt
        config_path: config/backends/response-api-redis.yaml
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: jaeger:4317
          insecure: true
        sampling:
          type: probabilistic
          rate: 0.5
        resource:
          service_name: vllm-sr
          service_version: v0.3.0
          deployment_environment: development
      metrics:
        enabled: true
        windowed_metrics:
          enabled: true
          time_windows: [1m, 5m, 1h]
          update_interval: 30s
          max_models: 50
      profiling:
        enabled: false
        port: 6060
        bind: 127.0.0.1
    authz:
      fail_open: false
      identity:
        user_id_header: x-user-id
        user_groups_header: x-user-groups
      providers:
        - type: header-injection
          headers:
            X-Plan: premium
            X-Role: admin
    ratelimit:
      fail_open: false
      providers:
        - type: envoy-ratelimit
          address: ratelimit.default.svc.cluster.local:8081
          domain: api
        - type: local-limiter
          rules:
            - name: premium-per-minute
              match:
                group: premium-tier
                model: qwen3-32b
              requests_per_unit: 120
              tokens_per_unit: 300000
              unit: minute
            - name: user-per-hour
              match:
                user: demo-user
              requests_per_unit: 1000
              tokens_per_unit: 2000000
              unit: hour
    management_api:
      bind_address: 127.0.0.1
      port: 8080
      remote_exposure: false
      auth:
        mode: disabled
        tokens:
          - env: VSR_MGMT_TOKEN
            role: admin
        roles:
          viewer:
            - health.read
            - ready.read
            - docs.read
            - metrics.read
            - audit.read
            - classify.invoke
            - config.read
            - replay.read
            - data.read
            - cache.read
            - compression.read
          operator:
            - health.read
            - ready.read
            - docs.read
            - metrics.read
            - audit.read
            - classify.invoke
            - config.read
            - config.write
            - learning.ingest
            - replay.read
            - replay.detail
            - data.read
            - data.write
            - cache.read
            - cache.invalidate
            - compression.read
            - compression.preview
          admin:
            - "*"
    startup_status:
      store_backend: file
    router_replay:
      store_backend: postgres
      ttl_seconds: 2592000
      async_writes: true
      redis:
        address: redis:6379
        db: 2
        password: "${VLLM_SR_STACK_REDIS_PASSWORD}"
        use_tls: false
        tls_skip_verify: false
        max_retries: 3
        pool_size: 20
        key_prefix: "vsr:replay:"
      postgres:
        host: postgres
        port: 5432
        database: vsr
        user: router
        password: "${VLLM_SR_STACK_POSTGRES_PASSWORD}"
        ssl_mode: disable
        max_open_conns: 20
        max_idle_conns: 10
        conn_max_lifetime: 300
        table_name: router_replay
      milvus:
        address: milvus:19530
        username: root
        password: "${MILVUS_PASSWORD}"
        collection_name: router_replay
        consistency_level: Bounded
        shard_num: 2
      qdrant:
        host: qdrant
        port: 6334
        api_key: ""
        use_tls: false
        collection_name: router_replay
  stores:
    response_cache:
      backend_type: milvus
      max_entries: 50000
      ttl_seconds: 7200
      eviction_policy: lru
      milvus:
        connection:
          host: milvus
          port: 19530
          database: default
          timeout: 30
          auth:
            enabled: true
            username: root
            password: "${MILVUS_PASSWORD}"
          tls:
            enabled: false
            cert_file: certs/milvus.crt
            key_file: certs/milvus.key
            ca_file: certs/ca.crt
        collection:
          name: semantic_cache
          description: Semantic cache vectors.
          vector_field:
            name: embedding
            dimension: 768
            metric_type: COSINE
          index:
            type: HNSW
            params:
              M: 16
              efConstruction: 200
        search:
          params:
            ef: 64
          topk: 10
          consistency_level: Bounded
        logging:
          level: info
        development:
          drop_collection_on_startup: false
          auto_create_collection: true
    memory:
      backend: milvus
      auto_store: true
      disabled_routes: []
      disabled_models: []
      valkey:
        host: valkey
        port: 6379
        database: 0
        password: valkey-secret
        timeout: 10
        collection_prefix: "mem:"
        index_name: mem_idx
        dimension: 384
        metric_type: COSINE
        index_m: 16
        index_ef_construction: 200
        tls_enabled: false
        tls_ca_path: ""
        tls_insecure_skip_verify: false
      milvus:
        address: milvus:19530
        collection: agentic_memory
        dimension: 384
        num_partitions: 32
      qdrant:
        host: qdrant
        port: 6334
        api_key: ""
        use_tls: false
        connect_timeout: 10
        collection: agentic_memory
        dimension: 384
      redis_cache:
        enabled: false
        address: "localhost:6379"
        ttl_seconds: 300
        db: 0
        key_prefix: "memory_cache:"
        password: ""
      default_retrieval_limit: 10
      # Calibrated for mom-embedding-light with weighted hybrid scoring.
      default_similarity_threshold: 0.40
      hybrid_search: true
      hybrid_mode: weighted
      adaptive_threshold: true
      reflection:
        enabled: true
        algorithm: heuristic
        max_inject_tokens: 512
        recency_decay_days: 14
        dedup_threshold: 0.9
        block_patterns:
          - api key
          - password
      persistence:
        timeout_seconds: 30
        concurrency: 8
        queue: 64
        shutdown_grace_seconds: 5
    vector_store:
      enabled: true
      backend_type: llama_stack
      file_storage_dir: /var/lib/vsr/data
      max_file_size_mb: 100
      ingestion_workers: 4
      ingestion_drain_timeout_seconds: 25
      supported_formats: [.txt, .md, .json, .csv, .html, .pdf]
      milvus:
        connection:
          host: milvus
          port: 19530
          database: vector_store
          timeout: 30
          auth:
            enabled: true
            username: root
            password: "${MILVUS_PASSWORD}"
          tls:
            enabled: false
            cert_file: certs/milvus.crt
            key_file: certs/milvus.key
            ca_file: certs/ca.crt
        collection:
          name: vector_store
          description: Uploaded document embeddings.
          vector_field:
            name: embedding
            dimension: 384
            metric_type: COSINE
          index:
            type: HNSW
            params:
              M: 16
              efConstruction: 200
        search:
          params:
            ef: 64
          topk: 10
          consistency_level: Strong
        logging:
          level: info
        development:
          drop_collection_on_startup: false
          auto_create_collection: true
      memory:
        max_entries_per_store: 5000
      llama_stack:
        endpoint: http://llama-stack:8321
        auth_token: llama-stack-token
        embedding_model: all-MiniLM-L6-v2
        request_timeout_seconds: 30
        search_type: hybrid
      valkey:
        host: valkey
        port: 6379
        database: 0
        password: valkey-secret
        connect_timeout: 5
        collection_prefix: "vsr_vs_"
        metric_type: COSINE
        index_m: 16
        index_ef_construction: 200
      qdrant:
        host: qdrant
