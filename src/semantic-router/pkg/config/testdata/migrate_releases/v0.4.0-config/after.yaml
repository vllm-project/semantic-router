              name: DIFFUSION
        output: {kind: image, action: generate}
        modelRefs:
          - model: sdxl-image
            use_reasoning: false
  - name: privacy-first
    description: Keeps privacy-sensitive traffic on the local default-tier model.
    strategy: confidence
    # Strict model facts; input accounting still uses an estimate.
    candidate_requirements:
      capabilities: declared
      context: known_limits
    signals:
      keywords:
        - name: privacy_recipe_keywords
          operator: OR
          method: bm25
          keywords: ["ssn", "passport number", "credit card number"]
          case_sensitive: false
          bm25_threshold: 0.1
    decisions:
      - name: privacy_recipe_route
        description: Route privacy-sensitive prompts to the local model.
        priority: 100
        rules:
          operator: AND
          conditions:
            - type: keyword
              name: privacy_recipe_keywords
        modelRefs:
          - model: qwen3-8b
            use_reasoning: false
        algorithm:
          type: static
    fallback:
      version: 1
      enabled: false
      max_attempts: 3
      total_timeout: 30s
      per_attempt_timeout: 10s
      retryable_status_codes:
        - 502
        - 503
        - 504
      circuit_breaker:
        consecutive_failures: 3
        cooldown_period: 30s
        half_open_probes: 1
    plugins:
      - type: router_replay
        configuration:
          enabled: false
  - name: default-remom
    description: The remom decisions of recipe default
    strategy: priority
    # Optional recipe-local consumer bindings to named model deployments.
    model_bindings: {}
    signals:
      keywords:
        - name: code_keywords
          operator: OR
          method: bm25
          keywords: ["code", "function", "debug", "algorithm", "refactor"]
          case_sensitive: false
          bm25_threshold: 0.1
        - name: machine_learning
          operator: OR
          method: bm25
          keywords: ["machine learning", "model training", "gradient", "neural network", "classifier"]
          case_sensitive: false
          bm25_threshold: 0.1
        - name: urgent_keywords
          operator: OR
          method: ngram
          keywords: ["urgent", "immediate", "asap", "emergency"]
          case_sensitive: false
          ngram_threshold: 0.4
          ngram_arity: 3
        - name: fuzzy_sensitive_keywords
          operator: OR
          method: fuzzy
          keywords: ["social security", "credit card", "password", "api key"]
          case_sensitive: false
          fuzzy_match: true
          fuzzy_threshold: 82
        - name: critical_payment_event
          description: Critical payment or transaction events that need incident-grade routing.
          operator: OR
          keywords: [payment_failed, transaction_declined, critical, high, TXN_DECLINE, urgent, immediate, asap, deadline, time sensitive, time-sensitive, now, critical window, critical-window]
        - name: many_questions
          description: Prompts that contain many explicit questions.
          operator: OR
          method: regex
          keywords: ['[?？]']
          count:
            gte: 4
        - name: at_most_one_question
          description: Prompts with one or fewer explicit questions.
          operator: OR
          method: regex
          keywords: ['[?？]']
          count:
            lte: 1
        - name: numbered_steps
          description: Prompts that contain numbered list items such as "1. ..."
          operator: OR
          method: regex
          keywords: ['(?m)^\s*\d+\.\s+']
        - name: first_then_flow
          description: Prompts that express an ordered workflow.
          operator: OR
          method: regex
          keywords: ['(?s)first.*then', '(?s)first.*next.*finally', '(?s)首先.*然后', '(?s)先.*再']
        - name: constraint_dense
          description: Prompts with dense explicit constraints relative to multilingual text units.
          operator: OR
          keywords: [under, at most, at least, within, no more than, 不超过, 至少, 最多]
          density:
            gt: 16
        - name: format_directive_dense
          description: Prompts with dense output-format directives relative to multilingual text units.
          operator: OR
          keywords: [table, bullet, json, markdown, 表格, 列表, JSON]
          density:
            gt: 16
        - name: low_question_density
          description: Prompts with very low question density relative to multilingual text units.
          operator: OR
          method: regex
          keywords: ['[?？]']
          density:
            lt: 10
        - name: long_current_turn_bytes
          description: Current user turn is at least four thousand UTF-8 bytes.
          operator: OR
          method: regex
          keywords: ['(?s).', '[^\x00-\x7F]', '[^\x00-\x{7FF}]', '[^\x00-\x{FFFF}]']
          case_sensitive: true
          count:
            gte: 4000
      domains:
        - name: business
          description: Business and management related queries.
          labels: [business]
          model_scores:
            - model: qwen3-32b
              score: 0.96
              use_reasoning: true
          predicate:
            gte: 0.5
        - name: law
          description: Legal questions and policy topics.
          labels: [law]
          predicate:
            gte: 0.5
        - name: psychology
          description: Psychology and mental-health oriented prompts.
          labels: [psychology]
          predicate:
            gte: 0.5
        - name: health
          description: Health and medical information requests.
          labels: [health]
          predicate:
            gte: 0.5
        - name: "computer science"
