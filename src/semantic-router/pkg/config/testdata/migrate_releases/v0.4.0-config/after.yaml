      # A route action sends every request matching this decision to
      # action.destination, overriding a caller-pinned model, so a detected
      # prompt attack cannot bypass the guard by naming a model. The action
      # requires an explicit jailbreak condition in rules, and destination must
      # be defined in model_config. If the destination cannot satisfy the
      # request context window, the decision falls back to its normal candidate
      # policy (modelRefs/default selection).
      - name: prompt_attack_guard_route
        description: Route detected prompt attacks to a safe fallback model.
        priority: 120
        rules:
          type: jailbreak
          name: prompt_injection
        action:
          type: route
          destination: qwen3-8b
        modelRefs:
          - model: qwen3-8b
            use_reasoning: false
      - name: safe_only_svm_route
        description: SVM route that only matches when prompt-injection signals are absent.
        priority: 110
        rules:
          operator: AND
          conditions:
            - operator: NOT
              conditions:
                - type: jailbreak
                  name: prompt_injection
            - operator: OR
              conditions:
