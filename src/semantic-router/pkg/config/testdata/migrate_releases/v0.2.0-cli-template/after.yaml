# src/vllm-sr/cli/templates/config.template.yaml at the v0.2.0 tag.
# Advanced YAML sample for vLLM Semantic Router.
# Most users should start with `vllm-sr serve` and finish setup in the dashboard.
# Use this template when you want to hand-author routing config directly.

version: v0.5
listeners:
  - name: "http-8899"
    address: "0.0.0.0"
    port: 8899
    timeout: "300s"
providers:
  models:
    - name: "replace-with-your-model"
      backend_refs:
        - name: primary
          weight: 100
          endpoint: "host.docker.internal:8000/v1"
          protocol: "http"
  defaults:
    model: "replace-with-your-model"
recipes:
  - name: default
    decisions:
      - name: "default-route"
        description: "Catch-all route for every request while you build out more specific signals and decisions."
        priority: 100
        rules:
          operator: "AND"
          conditions: []
        modelRefs:
          - model: "replace-with-your-model"
            use_reasoning: false
entrypoints:
  - model_names: [vllm-sr/auto, auto, MoM]
    recipe: default
