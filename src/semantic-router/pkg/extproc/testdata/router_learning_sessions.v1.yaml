        proposal: protection-cheap
        scores:
          protection-cheap: 0.9
          protection-frontier: 0.1
        conversation: conversation-a
        expected:
          model: protection-cheap
          sampling_allowed: true
          action: establish_baseline
          reason: new_conversation
          category: baseline
          hard_locked: false
          preflight_reason: no_tool_or_protocol_state
        coverage: []
      - id: tool-call
        append_messages:
          - role: assistant
            text: '{"a":12,"b":12}'
            tool_call_id: call-1
        candidates:
          - protection-cheap
          - protection-frontier
        proposal: protection-frontier
        scores:
          protection-cheap: 0.1
          protection-frontier: 0.9
        conversation: conversation-a
        expected:
          model: protection-cheap
          sampling_allowed: false
          action: hold_current
          reason: tool_or_protocol_state
          category: blocked
          hard_locked: true
          preflight_reason: tool_or_protocol_state
        coverage:
          - active-tool-call
      - id: tool-result
        append_messages:
          - role: tool
            text: '144'
            tool_call_id: call-1
        candidates:
          - protection-cheap
          - protection-frontier
        proposal: protection-frontier
        scores:
          protection-cheap: 0.1
          protection-frontier: 0.9
        conversation: conversation-a
        expected:
          model: protection-cheap
          sampling_allowed: false
          action: hold_current
          reason: tool_or_protocol_state
          category: blocked
          hard_locked: true
          preflight_reason: tool_or_protocol_state
        coverage:
          - tool-result
      - id: user-after-result
        append_messages:
          - role: user
            text: Please explain that result.
        candidates:
          - protection-cheap
          - protection-frontier
        proposal: protection-frontier
        scores:
          protection-cheap: 0.1
          protection-frontier: 0.9
        conversation: conversation-a
        expected:
          model: protection-cheap
          sampling_allowed: false
          action: hold_current
          reason: tool_or_protocol_state
          category: blocked
          hard_locked: true
          preflight_reason: tool_or_protocol_state
        coverage:
          - tool-followup
      - id: completed-loop
        append_messages:
          - role: assistant
            text: The result is 144.
          - role: user
            text: Now solve a harder problem.
        candidates:
          - protection-cheap
          - protection-frontier
        proposal: protection-frontier
        scores:
          protection-cheap: 0.1
          protection-frontier: 0.9
        conversation: conversation-a
        expected:
          model: protection-frontier
          sampling_allowed: true
          action: allow_switch
          reason: switch_allowed
          category: opportunity
          hard_locked: false
          preflight_reason: no_tool_or_protocol_state
        coverage:
          - tool-release
