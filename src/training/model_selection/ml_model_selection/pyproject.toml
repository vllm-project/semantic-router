[project]
name = "ml-model-selection"
version = "0.0.0"
description = "Environment for the ML model selection trainer and service under src/training/model_selection/ml_model_selection"
requires-python = ">=3.10"
dependencies = [
    # Lower bounds are the ones in requirements.txt; upper bounds stop at the next major.
    "fastapi>=0.115.0,<1",
    "huggingface-hub>=0.20.0,<3",
    "numpy>=1.24.0,<3",
    "openai>=1.0.0,<4",
    "pydantic>=2.0.0,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.3.0,<2",
    "tqdm>=4.65.0,<5",
    "uvicorn[standard]>=0.30.0,<1",
    # Imported by add_category_to_training_data.py but missing from requirements.txt.
    "requests>=2.31.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
# Embedding generation for training and benchmarks. embeddings.py guards these
# imports and the tests never generate embeddings, as in requirements-parity.txt.
embeddings = [
    "sentence-transformers>=2.2.0,<7",
    # requirements.txt leaves torch unbounded; the floor follows the other training areas.
    "torch>=2.2,<3",
]

[tool.uv]
package = false
