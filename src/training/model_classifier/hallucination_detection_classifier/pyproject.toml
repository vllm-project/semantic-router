[project]
name = "hallucination-detection-classifier"
version = "0.0.0"
description = "Environment for the hallucination detection classifier under src/training/model_classifier/hallucination_detection_classifier"
requires-python = ">=3.10"
dependencies = [
    # Lower bounds are the ones in requirements.txt; upper bounds stop at the next major.
    "datasets>=2.14.0,<6",
    "numpy>=1.24.0,<3",
    "scikit-learn>=1.3.0,<2",
    "torch>=2.0.0,<3",
    "tqdm>=4.65.0,<5",
    # The default base model (vllm-sr/modernbert-base-32k) needs ModernBERT, added in 4.48.
    "transformers>=4.48.0,<6",
]

[tool.uv]
package = false
