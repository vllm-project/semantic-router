[project]
name = "prompt-guard-fine-tuning-lora"
version = "0.0.0"
description = "Environment for the prompt-guard fine-tuning scripts under src/training/model_classifier/prompt_guard_fine_tuning_lora"
requires-python = ">=3.10"
dependencies = [
    # This folder has no requirements.txt. Bounds match the intent LoRA slice,
    # with datasets starting at 2.19 so the package imports against current pyarrow.
    # transformers.Trainer needs accelerate at runtime although nothing imports it.
    "accelerate>=0.28,<2",
    "datasets>=2.19,<5",
    "jsonschema>=4.18,<5",
    "peft>=0.10,<1",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "transformers>=4.40,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
