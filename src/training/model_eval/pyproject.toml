[project]
name = "vllm-sr-model-eval"
version = "0.0.0"
description = "Environment for the model evaluation scripts under src/training/model_eval"
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets>=2.19,<6",
    "huggingface_hub>=0.20,<2",
    "jsonschema>=4.18,<5",
    "matplotlib>=3.5,<4",
    "numpy>=1.24,<3",
    "openai>=1.0,<3",
    "pandas>=1.5,<4",
    "peft>=0.10,<1",
    "pyyaml>=6.0,<7",
    "requests>=2.25,<3",
    "rfc3339-validator>=0.1.4,<1",
    "scikit-learn>=1.3,<2",
    "seaborn>=0.11,<1",
    "seqeval>=1.2.2,<2",
    "torch>=2.2,<3",
    "tqdm>=4.60,<5",
    "transformers>=4.57.6,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
