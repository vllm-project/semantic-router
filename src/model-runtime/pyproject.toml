[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-srun"
version = "0.2.0"
description = "Built-in model runtime for vLLM Semantic Router: decision, classification, embedding and reranking models behind one HTTP contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "vLLM Semantic Router Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tokenizers>=0.20",
  "huggingface_hub>=0.25",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "uvloop>=0.19; sys_platform != 'win32'",
  "httptools>=0.6",
  "prometheus_client>=0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "mypy>=1.10",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "onnx>=1.17",
  "setuptools>=69",
  "wheel>=0.42",
]
reference = [
  "transformers>=5.0",
]
onnx = [
  "onnxruntime>=1.26",
]
multimodal = [
  "pillow>=10.4",
]

[project.scripts]
vllm-srun = "vllm_srun.cli:main"

[project.entry-points."vllm_srun.families"]
decision1 = "vllm_srun.families.decision1.family:Decision1Family"
decision2 = "vllm_srun.families.decision2.family:Decision2Family"
decision3 = "vllm_srun.families.decision3.family:Decision3Family"
multimodal_embedding = "vllm_srun.families.multimodal_embedding.family:MultimodalEmbeddingFamily"
task_heads = "vllm_srun.families.task_heads.family:TaskHeadsFamily"
vela2 = "vllm_srun.families.vela2.family:Vela2Family"

[project.entry-points."vllm_srun.engines"]
native = "vllm_srun.engines.native.engine:NativeEngine"
onnxruntime = "vllm_srun.engines.onnxruntime.engine:OnnxRuntimeEngine"

[project.entry-points."vllm_srun.accelerators"]
cpu = "vllm_srun.accel.cpu:CPUAccelerator"
cuda = "vllm_srun.accel.cuda:CUDAAccelerator"
mps = "vllm_srun.accel.mps:MPSAccelerator"
rocm = "vllm_srun.accel.rocm:ROCmAccelerator"
xpu = "vllm_srun.accel.xpu:XPUAccelerator"

[project.entry-points."vllm_srun.profiles"]
exact = "vllm_srun.profiles.exact:ExactProfile"
shared_context = "vllm_srun.profiles.shared_context:SharedContextProfile"
batching = "vllm_srun.profiles.batching:BatchingProfile"
max_speed = "vllm_srun.profiles.max_speed:MaxSpeedProfile"

[tool.setuptools.packages.find]
include = ["vllm_srun*"]

[tool.setuptools.package-data]
vllm_srun = [
  "api/openapi.yaml",
  "registry/golden_answers*.json",
  "registry/kernel_choices.json",
  "testing/data/*.jinja",
]

[tool.mypy]
# The plugin API, the runtime that drives it and the built-in engines and
# families are checked strictly; modules they import are read for types but
# not reported.
python_version = "3.10"
files = [
  "vllm_srun/plugins",
  "vllm_srun/scheduler",
  "vllm_srun/profiles",
  "vllm_srun/runtime.py",
  "vllm_srun/api",
  "vllm_srun/registry",
  "vllm_srun/heads",
  "vllm_srun/supervision",
  "vllm_srun/engines",
  "vllm_srun/families",
]
strict = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA or ROCm device; skipped on CPU-only hosts",
  "reference: needs the Transformers reference implementation",
]
