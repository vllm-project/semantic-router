[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-sr-runtime"
version = "0.2.0"
description = "Built-in model runtime for vLLM Semantic Router: decision, classification, embedding and reranking models behind one HTTP contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "vLLM Semantic Router Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tokenizers>=0.20",
  "huggingface_hub>=0.25",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "uvloop>=0.19; sys_platform != 'win32'",
  "httptools>=0.6",
  "prometheus_client>=0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "onnx>=1.17",
  "setuptools>=69",
  "wheel>=0.42",
]
reference = [
  "transformers>=5.0",
]
onnx = [
  "onnxruntime>=1.20",
]
multimodal = [
  "onnxruntime>=1.20",
  "pillow>=10.4",
]

[project.scripts]
vllm-sr-runtime = "vllm_sr_runtime.cli:main"

[project.entry-points."vllm_sr_runtime.families"]
decision1 = "vllm_sr_runtime.families.decision1.family:Decision1Family"
decision2 = "vllm_sr_runtime.families.decision2.family:Decision2Family"
multimodal_embedding = "vllm_sr_runtime.families.multimodal_embedding.family:MultimodalEmbeddingFamily"
task_heads = "vllm_sr_runtime.families.task_heads.family:TaskHeadsFamily"
vela2 = "vllm_sr_runtime.families.vela2.family:Vela2Family"

[project.entry-points."vllm_sr_runtime.engines"]
native = "vllm_sr_runtime.engines.native.engine:NativeEngine"
onnxruntime = "vllm_sr_runtime.engines.onnxruntime.engine:OnnxRuntimeEngine"

[project.entry-points."vllm_sr_runtime.accelerators"]
cpu = "vllm_sr_runtime.accel.cpu:CPUAccelerator"
cuda = "vllm_sr_runtime.accel.cuda:CUDAAccelerator"
mps = "vllm_sr_runtime.accel.mps:MPSAccelerator"
rocm = "vllm_sr_runtime.accel.rocm:ROCmAccelerator"
xpu = "vllm_sr_runtime.accel.xpu:XPUAccelerator"

[project.entry-points."vllm_sr_runtime.profiles"]
exact = "vllm_sr_runtime.profiles.exact:ExactProfile"
shared_context = "vllm_sr_runtime.profiles.shared_context:SharedContextProfile"
batching = "vllm_sr_runtime.profiles.batching:BatchingProfile"
max_speed = "vllm_sr_runtime.profiles.max_speed:MaxSpeedProfile"

[tool.setuptools.packages.find]
include = ["vllm_sr_runtime*"]

[tool.setuptools.package-data]
vllm_sr_runtime = [
  "api/openapi.yaml",
  "registry/golden_answers*.json",
  "registry/kernel_choices.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA or ROCm device; skipped on CPU-only hosts",
  "reference: needs the Transformers reference implementation",
]
