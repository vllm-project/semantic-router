[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-sr-runtime"
version = "0.1.0"
description = "Built-in model runtime for vLLM Semantic Router: typed decision models behind one HTTP contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "vLLM Semantic Router Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tokenizers>=0.20",
  "huggingface_hub>=0.25",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "prometheus_client>=0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.21",
]
reference = [
  "transformers>=5.0",
]

[project.scripts]
vllm-sr-runtime = "vllm_sr_runtime.cli:main"

[project.entry-points."vllm_sr_runtime.families"]
decision2 = "vllm_sr_runtime.families.decision2.family:Decision2Family"

[project.entry-points."vllm_sr_runtime.engines"]
native = "vllm_sr_runtime.engines.native.engine:NativeEngine"

[project.entry-points."vllm_sr_runtime.accelerators"]
cpu = "vllm_sr_runtime.accel.cpu:CPUAccelerator"
cuda = "vllm_sr_runtime.accel.cuda:CUDAAccelerator"
rocm = "vllm_sr_runtime.accel.rocm:ROCmAccelerator"

[project.entry-points."vllm_sr_runtime.profiles"]
exact = "vllm_sr_runtime.profiles.exact:ExactProfile"
shared_context = "vllm_sr_runtime.profiles.shared_context:SharedContextProfile"
batching = "vllm_sr_runtime.profiles.batching:BatchingProfile"
max_speed = "vllm_sr_runtime.profiles.max_speed:MaxSpeedProfile"

[tool.setuptools.packages.find]
include = ["vllm_sr_runtime*"]

[tool.setuptools.package-data]
vllm_sr_runtime = ["api/openapi.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA or ROCm device; skipped on CPU-only hosts",
  "reference: needs the Transformers reference implementation",
]
