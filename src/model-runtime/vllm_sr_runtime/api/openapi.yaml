openapi: 3.0.3
info:
  title: vLLM Semantic Router Model Runtime
  version: 1.0.0
  description: |
    Contract of the vllm-sr model runtime. `POST /v1/decisions` is a strict
    superset of System One: every System One request is accepted and every
    System One response field keeps its meaning. `POST /v1/systemone` is an
    alias with the same request and response. The router's Go client is
    generated from this file.
  license:
    name: Apache-2.0
paths:
  /v1/decisions:
    post:
      operationId: createDecisions
      summary: Answer typed Choice, Noul and Score questions about one state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: One answer per question, in request order; a failed question carries its own error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/systemone:
    post:
      operationId: createSystemOne
      summary: Alias of /v1/decisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Same as /v1/decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/models:
    get:
      operationId: listModels
      summary: Describe the served model, its limits, placement and verification
      responses:
        '200':
          description: The served models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
  /health:
    get:
      operationId: getHealth
      summary: Readiness; 200 only when the model is loaded, verified and passed its golden check
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness; 200 while the process serves HTTP
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
components:
  responses:
    Error:
      description: A request-level error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [state, questions]
      properties:
        model:
          type: string
          description: Served model ID. Optional while a runtime serves one model.
        state:
          description: The context the questions are about; text, an object or an array of JSON values.
        questions:
          type: object
          description: Named questions; answers keep this order.
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/Question'
        options:
          $ref: '#/components/schemas/RequestOptions'
    Question:
      type: object
      required: [type, instructions]
      properties:
        type:
          type: string
          description: choice, noul or score. Unknown types are answered with invalid_question.
        instructions:
          description: The question; non-empty text, an object or an array.
        criteria:
          description: |
            System One criteria. Choice: an object of 2..255 option keys to descriptions (descriptions may be
            null). Noul: an optional object with only false and true. Score: an ordered list of 2..10 level
            descriptions.
        choices:
          type: array
          description: Ordered Choice or Noul options, an alternative to a criteria object.
          items:
            $ref: '#/components/schemas/ChoiceOption'
        levels:
          type: array
          description: Ordered Score level descriptions, an alternative to a criteria list.
          items: {}
    ChoiceOption:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
        description:
          nullable: true
          description: Text, an object, an array or null.
    RequestOptions:
      type: object
      additionalProperties: false
      properties:
        deadline_ms:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Questions not started by the deadline return deadline_exceeded.
        profile:
          type: string
          description: exact, or the profile the server enabled.
        return_meta:
          type: boolean
          description: Include meta in the response (default true).
    DecisionResponse:
      type: object
      required: [model, answers, usage]
      properties:
        model:
          type: string
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Answer'
        usage:
          $ref: '#/components/schemas/Usage'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Answer:
      type: object
      required: [type]
      description: |
        One answer. Choice: choice, probabilities, confidence. Noul: noul (P(true)). Score: score (the expected
        level), probabilities, confidence, legend. A failed question has only type and error.
      properties:
        type:
          type: string
          nullable: true
        choice:
          type: string
        noul:
          type: number
          format: double
        score:
          type: number
          format: double
        probabilities:
          type: object
          additionalProperties:
            type: number
            format: double
        confidence:
          type: number
          format: double
        legend:
          type: object
          additionalProperties:
            type: string
        error:
          type: string
          enum: [invalid_question, max_length_exceeded, invalid_model_output, deadline_exceeded, unavailable]
    Usage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
    ResponseMeta:
      type: object
      properties:
        revision:
          type: string
          nullable: true
          description: The 40-hex Hub revision; null for a local package directory.
        model_sha256:
          type: string
        profile:
          type: string
        numerics:
          type: string
        engine:
          type: string
        accelerator:
          type: string
        device:
          type: string
        queue_ms:
          type: number
          format: double
        compute_ms:
          type: number
          format: double
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, model_not_found, request_too_large, overloaded, internal_error, not_ready]
            message:
              type: string
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelCard'
    ModelCard:
      type: object
      required: [id, object, family, surfaces, ready]
      properties:
        id:
          type: string
        object:
          type: string
        owned_by:
          type: string
        family:
          type: string
        repo:
          type: string
          nullable: true
        revision:
          type: string
          nullable: true
        model_sha256:
          type: string
        manifest_sha256:
          type: string
        surfaces:
          type: array
          items:
            type: string
        question_types:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/ModelLimits'
        licence:
          type: string
          nullable: true
        profile:
          type: string
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileInfo'
        engine:
          type: string
        accelerator:
          type: string
        accelerator_validated:
          type: boolean
        device:
          type: string
        dtype:
          type: string
        parameters:
          type: integer
        ready:
          type: boolean
        golden:
          $ref: '#/components/schemas/GoldenStatus'
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
    ModelLimits:
      type: object
      properties:
        max_input_tokens:
          type: integer
        min_options:
          type: integer
        max_options:
          type: integer
        min_levels:
          type: integer
        max_levels:
          type: integer
    ProfileInfo:
      type: object
      required: [name, numerics]
      properties:
        name:
          type: string
        numerics:
          type: string
          enum: [exact, approximate]
        description:
          type: string
    GoldenStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, matched, unverified, failed]
        checked:
          type: integer
        matched:
          type: integer
        reference:
          type: string
          nullable: true
    PluginInfo:
      type: object
      required: [group, name]
      properties:
        group:
          type: string
        name:
          type: string
        distribution:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [starting, loading, warming, ready, degraded, failed, alive]
        reason:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
