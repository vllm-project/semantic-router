version: v0.3

# Router latency gate config for the legacy router (in-process bindings):
# router-latency-cpu.yaml plus the legacy backend selectors (variant,
# use_mmbert_32k) that pick the mmBERT-32K architecture in candle.

listeners:
  - name: http-18899
    address: 127.0.0.1
    port: 18899
    timeout: 300s

providers:
  defaults:
    model: general-model
  models:
    - name: general-model
      provider_model_id: general-model
      api_format: openai
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:18000
          protocol: http
          weight: 100
    - name: code-model
      provider_model_id: code-model
      api_format: openai
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:18000
          protocol: http
          weight: 100
    - name: guarded-model
      provider_model_id: guarded-model
      api_format: openai
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:18000
          protocol: http
          weight: 100

routing:
  modelCards:
    - name: general-model
      description: General-purpose text model.
      modality: ar
    - name: code-model
      description: Code model.
      modality: ar
    - name: guarded-model
      description: Model for flagged traffic.
      modality: ar

  signals:
    keywords:
      - name: code_keywords
        operator: OR
        method: bm25
        keywords: ["code", "function", "debug", "algorithm", "refactor"]
        case_sensitive: false
        bm25_threshold: 0.1
    domains:
      - name: business
        description: Business and management related queries.
        mmlu_categories: [business]
      - name: law
        description: Legal questions and policy topics.
        mmlu_categories: [law]
      - name: health
        description: Health and medical information requests.
        mmlu_categories: [health]
      - name: "computer science"
        description: Computer science and engineering prompts.
        mmlu_categories: ["computer science"]
      - name: other
        description: General fallback traffic.
        mmlu_categories: [other]
    fact_check:
      - name: needs_fact_check
        description: Prompts with factual claims that should be verified.
      - name: no_fact_check_needed
        description: Creative prompts that do not need factual verification.
    user_feedbacks:
      - name: wrong_answer
        description: The user indicates the previous answer was incorrect.
      - name: need_clarification
        description: The user asks for a clearer or more detailed answer.
    jailbreak:
      - name: jailbreak_detected
        threshold: 0.5
        description: Prompt attacks.
    pii:
      - name: restricted_pii
        threshold: 0.85
        pii_types_allowed: [EMAIL_ADDRESS]
        description: Sensitive identifiers.

  decisions:
    - name: guard_jailbreak
      description: Prompt attacks go to the guarded model.
      priority: 500
      rules:
        operator: AND
        conditions:
          - type: jailbreak
            name: jailbreak_detected
      modelRefs:
        - model: guarded-model
    - name: guard_pii
      description: Sensitive identifiers go to the guarded model.
      priority: 400
      rules:
        operator: AND
        conditions:
          - type: pii
            name: restricted_pii
      modelRefs:
        - model: guarded-model
    - name: retry_wrong_answer
      description: Corrections go to the code model.
      priority: 300
      rules:
        operator: AND
        conditions:
          - type: user_feedback
            name: wrong_answer
      modelRefs:
        - model: code-model
    - name: code
      description: Computer science and code prompts.
      priority: 200
      rules:
        operator: OR
        conditions:
          - type: domain
            name: "computer science"
          - type: keyword
            name: code_keywords
      modelRefs:
        - model: code-model
    - name: verified_facts
      description: Factual prompts in regulated domains.
      priority: 150
      rules:
        operator: AND
        conditions:
          - type: fact_check
            name: needs_fact_check
          - operator: OR
            conditions:
              - type: domain
                name: law
              - type: domain
                name: health
              - type: domain
                name: business
      modelRefs:
        - model: general-model
    - name: general
      description: Everything else.
      priority: 1
      rules:
        operator: OR
        conditions:
          - type: domain
            name: other
          - type: fact_check
            name: no_fact_check_needed
          - type: user_feedback
            name: need_clarification
      modelRefs:
        - model: general-model

global:
  model_catalog:
    system:
      prompt_guard: models/Vela-1.0-Encoder-307M-Guard
      domain_classifier: models/Vela-1.0-Encoder-307M-Domain
      pii_classifier: models/Vela-1.0-Encoder-307M-PII
      fact_check_classifier: models/Vela-1.0-Encoder-307M-FactCheck
      feedback_detector: models/Vela-1.0-Encoder-307M-Feedback
    modules:
      prompt_guard:
        enabled: true
        model_ref: prompt_guard
        model_id: models/Vela-1.0-Encoder-307M-Guard
        threshold: 0.5
        use_cpu: true
        variant: mmbert32k
        max_sequence_length: 0
        jailbreak_mapping_path: models/Vela-1.0-Encoder-307M-Guard/jailbreak_type_mapping.json
        positive_labels: [jailbreak]
      classifier:
        domain:
          enabled: true
          model_ref: domain_classifier
          max_sequence_length: 0
          model_id: models/Vela-1.0-Encoder-307M-Domain
          threshold: 0.5
          use_cpu: true
          category_mapping_path: models/Vela-1.0-Encoder-307M-Domain/category_mapping.json
          fallback_category: other
        pii:
          enabled: true
          model_ref: pii_classifier
          max_sequence_length: 0
          model_id: models/Vela-1.0-Encoder-307M-PII
          threshold: 0.9
          use_cpu: true
          use_mmbert_32k: true
          pii_mapping_path: models/Vela-1.0-Encoder-307M-PII/pii_mapping.json
      hallucination_mitigation:
        enabled: false
        fact_check:
          model_ref: fact_check_classifier
          max_sequence_length: 0
          model_id: models/Vela-1.0-Encoder-307M-FactCheck
          threshold: 0.95
          use_cpu: true
          use_mmbert_32k: true
      feedback_detector:
        enabled: true
        model_ref: feedback_detector
        max_sequence_length: 0
        model_id: models/Vela-1.0-Encoder-307M-Feedback
        threshold: 0.7
        use_cpu: true
        use_mmbert_32k: true
