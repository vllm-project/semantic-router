version: v0.5

# Router latency gate config (docs/records/router-latency-cpu.md): the
# model-backed request signals of the default configuration (domain, prompt
# guard, PII, fact-check, feedback) plus a keyword signal, on the Vela 1.0
# models, with decisions that read every one. The legacy router reads
# router-latency-cpu-legacy.yaml: the same signals, decisions and models with
# its backend selectors (variant, use_mmbert_32k), which this router rejects.

listeners:
  - name: http-18899
    address: 127.0.0.1
    port: 18899
    timeout: 300s

providers:
  defaults:
    model: general-model
  models:
    - name: general-model
      provider_model_id: general-model
      api_format: openai
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:18000
          protocol: http
          weight: 100
      description: General-purpose text model.
    - name: code-model
      provider_model_id: code-model
      api_format: openai
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:18000
          protocol: http
          weight: 100
      description: Code model.
    - name: guarded-model
      provider_model_id: guarded-model
      api_format: openai
      backend_refs:
        - name: local
          endpoint: 127.0.0.1:18000
          protocol: http
          weight: 100
      description: Model for flagged traffic.

recipes:
  - name: default

    signals:
      keywords:
        - name: code_keywords
          operator: OR
          method: bm25
          keywords: ["code", "function", "debug", "algorithm", "refactor"]
          case_sensitive: false
          bm25_threshold: 0.1
      domains:
        - name: business
          description: Business and management related queries.
          labels: [business]
          predicate:
            gte: 0.5
        - name: law
          description: Legal questions and policy topics.
          labels: [law]
          predicate:
            gte: 0.5
        - name: health
          description: Health and medical information requests.
          labels: [health]
          predicate:
            gte: 0.5
        - name: "computer science"
          description: Computer science and engineering prompts.
          labels: ["computer science"]
          predicate:
            gte: 0.5
        - name: other
          description: General fallback traffic.
          labels: [other]
          predicate:
            gte: 0.5
      fact_check:
        - name: needs_fact_check
          description: Prompts with factual claims that should be verified.
          predicate:
            gte: 0.95
        - name: no_fact_check_needed
          description: Creative prompts that do not need factual verification.
          labels: [NO_FACT_CHECK_NEEDED]
          predicate:
            gt: 0.05
      user_feedbacks:
        - name: wrong_answer
          description: The user indicates the previous answer was incorrect.
          labels: [WRONG_ANSWER]
          predicate:
            gte: 0.7
        - name: need_clarification
          description: The user asks for a clearer or more detailed answer.
          labels: [NEED_CLARIFICATION]
          predicate:
            gte: 0.7
      jailbreak:
        - name: jailbreak_detected
          description: Prompt attacks.
          predicate:
            gte: 0.5
      pii:
        - name: restricted_pii
          description: Sensitive identifiers.
          predicate:
            gte: 0.85
          ignore_labels: [EMAIL_ADDRESS]
    decisions:
      - name: guard_jailbreak
        description: Prompt attacks go to the guarded model.
        priority: 500
        rules:
          operator: AND
          conditions:
            - type: jailbreak
              name: jailbreak_detected
        modelRefs:
          - model: guarded-model
      - name: guard_pii
        description: Sensitive identifiers go to the guarded model.
        priority: 400
        rules:
          operator: AND
          conditions:
            - type: pii
              name: restricted_pii
        modelRefs:
          - model: guarded-model
      - name: retry_wrong_answer
        description: Corrections go to the code model.
        priority: 300
        rules:
          operator: AND
          conditions:
            - type: user_feedback
              name: wrong_answer
        modelRefs:
          - model: code-model
      - name: code
        description: Computer science and code prompts.
        priority: 200
        rules:
          operator: OR
          conditions:
            - type: domain
              name: "computer science"
            - type: keyword
              name: code_keywords
        modelRefs:
          - model: code-model
      - name: verified_facts
        description: Factual prompts in regulated domains.
        priority: 150
        rules:
          operator: AND
          conditions:
            - type: fact_check
              name: needs_fact_check
            - operator: OR
              conditions:
                - type: domain
                  name: law
                - type: domain
                  name: health
                - type: domain
                  name: business
        modelRefs:
          - model: general-model
      - name: general
        description: Everything else.
        priority: 1
        rules:
          operator: OR
          conditions:
            - type: domain
              name: other
            - type: fact_check
              name: no_fact_check_needed
            - type: user_feedback
              name: need_clarification
        modelRefs:
          - model: general-model

global:
  model_catalog:
    system:
      prompt_guard: models/Vela-1.0-Encoder-307M-Guard
      pii_classifier: models/Vela-1.0-Encoder-307M-PII
    modules:
      prompt_guard:
        enabled: true
        model_ref: prompt_guard
        model_id: models/Vela-1.0-Encoder-307M-Guard
        threshold: 0.5
        use_cpu: true
        max_sequence_length: 0
        jailbreak_mapping_path: models/Vela-1.0-Encoder-307M-Guard/jailbreak_type_mapping.json
        positive_labels: [jailbreak]
      classifier:
        pii:
          enabled: true
          model_ref: pii_classifier
          max_sequence_length: 0
          model_id: models/Vela-1.0-Encoder-307M-PII
          threshold: 0.9
          use_cpu: true
          pii_mapping_path: models/Vela-1.0-Encoder-307M-PII/pii_mapping.json
      hallucination_mitigation:
        enabled: false
